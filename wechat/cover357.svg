<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.6" opacity="0.35">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
  </g>

  <!-- Top Tag & Title -->
  <rect x="48" y="34" width="166" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="131" y="54" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">AI 量化 · 剖析与实测</text>

  <text x="48" y="102" font-size="31" font-weight="bold" fill="#f8fafc">老显卡没有 FP4？把浮点乘以 2 塞进 INT8</text>
  <text x="48" y="136" font-size="18" fill="#94a3b8">剖析并实测 secemp 的 HINT4 方案：从 71 条反汇编指令到 M=8 速度破案</text>

  <!-- Left Card: The Math Trick (FP4 x 2 -> INT8) -->
  <rect x="48" y="162" width="388" height="284" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
  <rect x="48" y="162" width="388" height="38" rx="12" fill="#0c4a6e"/>
  <text x="66" y="187" font-size="16" font-weight="bold" fill="#7dd3fc">① 数学巧思：FP4 刻度 × 2 = 精确整数</text>

  <!-- E2M1 Grid -->
  <text x="66" y="224" font-size="13" fill="#cbd5e1">• 原版 NVFP4 (E2M1) 含半格小数，旧卡无硬件：</text>
  <rect x="66" y="234" width="352" height="34" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="242" y="256" font-size="15" font-weight="bold" fill="#fbbf24" text-anchor="middle">{ 0, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0 }</text>

  <text x="242" y="290" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">↓ 刻度乘以 2（缩放 S 除以 2）+ 垫 1~8 倍增高垫 ↓</text>

  <!-- INT8 Grid -->
  <rect x="66" y="302" width="352" height="38" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="242" y="326" font-size="15" font-weight="bold" fill="#6ee7b7" text-anchor="middle">{ 0, ±1, ±2, ±3, ±4, ±6, ±8, ±12 } ⊆ INT8</text>

  <!-- SASS Truth -->
  <rect x="66" y="354" width="352" height="74" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="80" y="376" font-size="13" font-weight="bold" fill="#f87171">• PTX mma.s4 假象：H100/50系展开 71 条相关指令</text>
  <text x="80" y="398" font-size="13" font-weight="bold" fill="#4ade80">• 落地真指令：1 条 IMMA.16832.S8.S8 (INT8)</text>
  <text x="80" y="418" font-size="12" fill="#94a3b8">• 近高斯权重：直转 INT4 (65.24) 优于盲目旋转 (71.47)</text>

  <!-- Right Card: The Speed & Reality Audit -->
  <rect x="464" y="162" width="388" height="284" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
  <rect x="464" y="162" width="388" height="38" rx="12" fill="#78350f"/>
  <text x="482" y="187" font-size="16" font-weight="bold" fill="#fde68a">② 速度破案与实测：RTX 3080 分段账本</text>

  <!-- M=1 Bar -->
  <text x="482" y="224" font-size="13" font-weight="bold" fill="#4ade80">• M=1 单字解码（快 1.77×）：压根没调 Tensor Core</text>
  <rect x="482" y="233" width="265" height="18" rx="4" fill="#475569"/>
  <text x="755" y="247" font-size="12" fill="#cbd5e1">FP16: 233μs</text>
  <rect x="482" y="255" width="150" height="18" rx="4" fill="#10b981"/>
  <text x="640" y="269" font-size="12" font-weight="bold" fill="#6ee7b7">4-bit GEMV: 132μs (纯省带宽)</text>

  <!-- M>=8 Bar -->
  <text x="482" y="298" font-size="13" font-weight="bold" fill="#f87171">• M ≥ 8 调起内核后（0.40× ~ 0.70×）：全线反输 FP16</text>
  <rect x="482" y="308" width="160" height="22" rx="4" fill="#3b82f6"/>
  <text x="650" y="324" font-size="12" font-weight="bold" fill="#93c5fd">FP16 cuBLAS: 229μs (复用权重)</text>

  <rect x="482" y="335" width="98" height="22" rx="4" fill="#f59e0b"/>
  <text x="531" y="350" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">A:激活量化 6μs</text>
  <rect x="582" y="335" width="252" height="22" rx="4" fill="#ef4444"/>
  <text x="708" y="350" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">B:双网格解包+每32数出锅 322μs (总328μs)</text>

  <!-- Bottom Verdict Box -->
  <rect x="482" y="370" width="352" height="58" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <text x="658" y="392" font-size="13" font-weight="bold" fill="#e0e7ff" text-anchor="middle">真相：50系有FP4、H100/40系有FP8，仅30系缺浮点</text>
  <text x="658" y="414" font-size="12.5" fill="#c7d2fe" text-anchor="middle">M≥8被每32数解包出锅拖慢，精度与普通INT4无本质差距</text>

  <!-- Footer -->
  <text x="48" y="476" font-size="13" fill="#64748b">老靳的 AI 学习笔记 · No.357</text>
  <text x="852" y="476" font-size="13" fill="#64748b" text-anchor="end">github.com/lmxxf/fp4-on-sm86 · RTX 3080 Laptop (sm_86)</text>
</svg>

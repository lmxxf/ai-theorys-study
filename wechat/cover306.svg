<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a0f1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#redGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">2026 年 9 月 · 三个人的表态</text>

  <!-- ============ LEFT: 在职 · Pachocki ============ -->
  <g transform="translate(50 78)">
    <rect x="0" y="10" width="248" height="292" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <text x="124" y="40" text-anchor="middle" fill="#94a3b8" font-size="12">9 月 6 日</text>
    <text x="124" y="64" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Pachocki</text>
    <text x="124" y="86" text-anchor="middle" fill="#cbd5e1" font-size="11">OpenAI 首席科学家</text>

    <rect x="66" y="100" width="116" height="26" rx="13" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
    <text x="124" y="118" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">留任</text>

    <g transform="translate(20 142)">
      <rect x="0" y="0" width="208" height="82" rx="6" fill="#0a1a2a" stroke="#334155" stroke-width="1"/>
      <text x="104" y="22" text-anchor="middle" fill="#bfdbfe" font-size="11">发文《An Alien Mind》</text>
      <text x="104" y="42" text-anchor="middle" fill="#bfdbfe" font-size="11">思维链监控越来越难用</text>
      <text x="104" y="62" text-anchor="middle" fill="#fde68a" font-size="11">必要时该减速</text>
    </g>

    <text x="124" y="252" text-anchor="middle" fill="#94a3b8" font-size="11">说完之后</text>
    <text x="124" y="276" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">产品照发，算力照买</text>
  </g>

  <!-- ============ MIDDLE: 辞职 · Coxon ============ -->
  <g transform="translate(326 78)">
    <rect x="0" y="10" width="248" height="292" rx="6" fill="url(#cardBg)" stroke="#2dd4bf" stroke-width="2"/>

    <text x="124" y="40" text-anchor="middle" fill="#94a3b8" font-size="12">9 月 9 日 08:04</text>
    <text x="124" y="64" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Coxon</text>
    <text x="124" y="86" text-anchor="middle" fill="#cbd5e1" font-size="11">27 岁，预训练研究三年</text>

    <rect x="66" y="100" width="116" height="26" rx="13" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="124" y="118" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">辞职</text>

    <g transform="translate(20 142)">
      <rect x="0" y="0" width="208" height="82" rx="6" fill="#0a1a1a" stroke="#334155" stroke-width="1"/>
      <text x="104" y="22" text-anchor="middle" fill="#a7f3d0" font-size="11">两家都没负责任地行事</text>
      <text x="104" y="42" text-anchor="middle" fill="#a7f3d0" font-size="11">正拿所有人的命在赌</text>
      <text x="104" y="62" text-anchor="middle" fill="#a7f3d0" font-size="11">全程没给过百分比</text>
    </g>

    <text x="124" y="252" text-anchor="middle" fill="#94a3b8" font-size="11">说完之后</text>
    <text x="124" y="276" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">走了，代价实打实</text>
  </g>

  <!-- ============ RIGHT: 在职 · Hubinger ============ -->
  <g transform="translate(602 78)">
    <rect x="0" y="10" width="248" height="292" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <text x="124" y="40" text-anchor="middle" fill="#94a3b8" font-size="12">9 月 9 日 09:27</text>
    <text x="124" y="64" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Hubinger</text>
    <text x="124" y="86" text-anchor="middle" fill="#cbd5e1" font-size="11">Anthropic 对齐压力测试</text>

    <rect x="66" y="100" width="116" height="26" rx="13" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="124" y="118" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">留任</text>

    <g transform="translate(20 142)">
      <rect x="0" y="0" width="208" height="82" rx="6" fill="#2a1a0a" stroke="#334155" stroke-width="1"/>
      <text x="104" y="26" text-anchor="middle" fill="#fca5a5" font-size="20" font-weight="bold">&gt; 10%</text>
      <text x="104" y="48" text-anchor="middle" fill="#fbbf24" font-size="11">未来十年内杀死全人类</text>
      <text x="104" y="68" text-anchor="middle" fill="#fbbf24" font-size="11">「我个人认为」</text>
    </g>

    <text x="124" y="252" text-anchor="middle" fill="#94a3b8" font-size="11">说完之后</text>
    <text x="124" y="276" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">继续留在岗位上</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">三个人、两种选择</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">判断一个警告认不认真，看说完之后他改变了什么</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.306 · AI 杂谈 · 又一轮末日论</text>
</svg>

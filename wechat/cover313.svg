<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Droid Sans Fallback', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="3">16.8 → 15.5 毫秒 · 最后 1.3 毫秒是读汇编读出来的</text>

  <!-- ============ LEFT: 分支 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第一种 · 饱和转换被编成分支</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 32)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#2a1a06" stroke="#f59e0b" stroke-width="2"/>
      <text x="100" y="33" text-anchor="middle" fill="#fcd34d" font-size="21" font-weight="bold">别 跳 转</text>
    </g>

    <g transform="translate(15 98)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#141005" stroke="#78350f" stroke-width="1"/>
      <text x="100" y="24" text-anchor="middle" fill="#fbbf24" font-size="11">32 个线程一条指令流</text>
      <text x="100" y="46" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">有人走 if 有人不走</text>
      <text x="100" y="68" text-anchor="middle" fill="#fbbf24" font-size="11">两条路都得跑一遍</text>
    </g>

    <text x="115" y="212" text-anchor="middle" fill="#94a3b8" font-size="11">改成 fmin/fmax 夹住</text>
    <text x="115" y="234" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">一条算术，一条条件选择</text>
    <text x="115" y="262" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="bold">−0.19 毫秒</text>
    <text x="115" y="286" text-anchor="middle" fill="#7f8ea3" font-size="10">这一处占了全核四成指令</text>
  </g>

  <!-- ============ MIDDLE: 读取串行 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第二种 · 读被关在 if 里</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#2dd4bf" stroke-width="2"/>

    <g transform="translate(20 32)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="33" text-anchor="middle" fill="#5eead4" font-size="21" font-weight="bold">别 排 队</text>
    </g>

    <g transform="translate(20 98)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#0a1a1a" stroke="#115e59" stroke-width="1"/>
      <text x="100" y="24" text-anchor="middle" fill="#a7f3d0" font-size="11">读一个 等一个 再读下一个</text>
      <text x="100" y="46" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">16 次等待排成一队</text>
      <text x="100" y="68" text-anchor="middle" fill="#a7f3d0" font-size="11">显存延迟几百个周期</text>
    </g>

    <text x="120" y="208" text-anchor="middle" fill="#94a3b8" font-size="11">拆两趟：先全发出去，再统一转换</text>
    <text x="120" y="230" text-anchor="middle" fill="#fde047" font-size="12" font-weight="bold">越界的也照读，读完扔掉</text>
    <text x="120" y="258" text-anchor="middle" fill="#5eead4" font-size="15" font-weight="bold">−0.49 毫秒</text>
    <text x="120" y="282" text-anchor="middle" fill="#7f8ea3" font-size="10">多做几次没用的读，整段反而更快</text>
  </g>

  <!-- ============ RIGHT: 别名 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第三种 · 编译器不敢省</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 32)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0f1629" stroke="#4a90d9" stroke-width="2"/>
      <text x="100" y="33" text-anchor="middle" fill="#93c5fd" font-size="21" font-weight="bold">别 重 读</text>
    </g>

    <g transform="translate(15 98)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#0b1120" stroke="#1e3a5f" stroke-width="1"/>
      <text x="100" y="24" text-anchor="middle" fill="#93c5fd" font-size="11">两次读中间夹着一个写</text>
      <text x="100" y="46" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="bold">万一写的就是那块呢</text>
      <text x="100" y="68" text-anchor="middle" fill="#93c5fd" font-size="11">同一地址反复读了十六次</text>
    </g>

    <text x="115" y="212" text-anchor="middle" fill="#94a3b8" font-size="11">循环外先读进寄存器</text>
    <text x="115" y="234" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">指针够不着寄存器</text>
    <text x="115" y="262" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="bold">−0.05 毫秒</text>
    <text x="115" y="286" text-anchor="middle" fill="#7f8ea3" font-size="10">编译器很笨，得把证据递给它</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="29" font-weight="bold">把网络从 DirectX 搬到 HIP</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="16">换接口本身没给一毫秒——换来的是能看见 GPU 在哪儿白等</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.313 · 三天 · 900p 从 30 帧到 52 帧 · 全程逐位一致</text>
</svg>

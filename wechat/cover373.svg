<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="bg373" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f" />
      <stop offset="0.55" stop-color="#11223b" />
      <stop offset="1" stop-color="#070d18" />
    </linearGradient>
    <linearGradient id="beam373" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30" />
      <stop offset="1" stop-color="#10b981" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg373)" />

  <!-- 顶部徽章 -->
  <rect x="40" y="26" width="218" height="28" rx="14" fill="#172554" stroke="#38bdf8" stroke-width="1.2" />
  <text x="149" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#7dd3fc">No.373 · 跨学科尝试 × ICA-Lens</text>
  <text x="274" y="45" font-size="13.5" fill="#94a3b8">双机 22.96h 重磨 8,000 篇完整篇章 · 泛化比全锁 1.07×–1.48×</text>

  <!-- 主标题 -->
  <text x="40" y="90" font-size="27.5" font-weight="bold" fill="#f8fafc">重训 ICA-Lens，分开「叔叔舅舅」和「uncle」</text>

  <!-- 左侧：ICA-Lens v3 完整篇章显微镜 -->
  <rect x="40" y="118" width="236" height="304" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75" />
  <text x="56" y="148" font-size="15.5" font-weight="bold" fill="#7dd3fc">ICA-Lens v3 底盘收官</text>
  <text x="56" y="169" font-size="11.5" fill="#94a3b8">4,096 词元保住「开头—正中—结尾」</text>

  <rect x="54" y="184" width="208" height="58" rx="8" fill="#172554" />
  <text x="64" y="205" font-size="11.5" fill="#bae6fd">全 64 层 Fit / Test 峰度比：</text>
  <text x="64" y="228" font-size="13.5" font-weight="bold" fill="#4ade80">1.07×–1.48×（零层超 1.5×）</text>

  <rect x="54" y="254" width="208" height="72" rx="8" fill="#1e293b" />
  <text x="64" y="274" font-size="11.5" fill="#cbd5e1">同考 136.6 万词完整长文卷：</text>
  <text x="64" y="295" font-size="12" font-weight="bold" fill="#38bdf8">L32 谷底：9.03 → 16.80 (1.86×)</text>
  <text x="64" y="314" font-size="11.5" fill="#86efac">κ &gt; 10 强轴净增 +29,133 根</text>

  <text x="56" y="352" font-size="11.5" fill="#cbd5e1">• 总强轴：268,320 / 327,680 (81.9%)</text>
  <text x="56" y="374" font-size="11.5" fill="#cbd5e1">• 退回 512 词残卷回落至 9.32</text>
  <text x="56" y="396" font-size="11" fill="#94a3b8">• 实证新增 2.9 万根长文中尾段轴</text>

  <!-- 光束连接 -->
  <polygon points="276,270 304,142 304,398" fill="url(#beam373)" />

  <!-- 右侧：母语刻刀三幕阶梯（x=304, width=556, 右界 860） -->
  <!-- 第一幕 -->
  <rect x="304" y="118" width="556" height="90" rx="12" fill="#0c2438" stroke="#0ea5e9" stroke-width="1.3" />
  <text x="322" y="144" font-size="14.5" font-weight="bold" fill="#7dd3fc">第一幕 · L13 C2665：两千年「屋内为堂、衣外为表」的空间隐喻</text>
  <text x="322" y="167" font-size="11.5" fill="#e2e8f0">物理内外、社会内外与中文亲属三路独立盲选第 1 名全中 C2665（语料最高：汉字「外」）</text>
  <text x="322" y="189" font-size="11.5" fill="#bae6fd">不含「外」字的北方单词元「姥爷 / 姥姥」照样比「爷爷 / 奶奶」高出 +5.22（10/10 全对）</text>

  <!-- 第二幕 -->
  <rect x="304" y="224" width="556" height="90" rx="12" fill="#1c2517" stroke="#eab308" stroke-width="1.3" stroke-opacity="0.85" />
  <text x="322" y="250" font-size="14.5" font-weight="bold" fill="#fde047">第二幕 · L25 C3140 / L26 C3526：父系零基线 + 单极「嫁娶算子」</text>
  <text x="322" y="273" font-size="11.5" fill="#fef9c3">仅靠「伯父/舅舅、叔叔/姨夫、姑姑/姨妈」选单轴，留出盲测 60/60 满分（与空间正交 -0.007）</text>
  <text x="322" y="295" font-size="11.5" fill="#fde68a">父系本家默认不打标；外姻侧单极亮出 女婿 / 出嫁 / 娘家（L26 居全词表第 8 名，99.997%）</text>

  <!-- 第三幕 -->
  <rect x="304" y="330" width="556" height="92" rx="12" fill="#072e22" stroke="#10b981" stroke-width="1.5" />
  <text x="322" y="356" font-size="14.5" font-weight="bold" fill="#6ee7b7">第三幕 · L42 C1992（42/64 = 65.6% 三分之二层）：切开英文 uncle</text>
  <text x="322" y="379" font-size="11.5" fill="#ecfdf5">排掉 L37 性别偏移，测 100% 同词袋英文姓氏推理题（双姓同在，仅互换谁是 friend 谁是 uncle）</text>
  <text x="322" y="401" font-size="12" font-weight="bold" fill="#34d399">纯中文盲选婚姻轴零样本 15/15 全对（uncle d=7.49, cousin d=14.77），与英文自选同轴</text>

  <!-- 底部金句 -->
  <text x="450" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">「英语在纸面上只写了一个 uncle，五千维空间却在三分之二深处把它切成了父系与母系两半。」</text>
  <text x="450" y="482" text-anchor="middle" font-size="12" fill="#64748b">Qwen3.8-27B 全 64 层完整篇章 ICA-Lens v3 × N=100 J-Lens · 265 条零模板裸文本探针实测</text>
</svg>

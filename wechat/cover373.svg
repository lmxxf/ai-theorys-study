<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="bg373" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120" />
      <stop offset="0.5" stop-color="#131c31" />
      <stop offset="1" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyanBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="amberBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ef4444" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg373)" />

  <!-- 顶部期号与副标 -->
  <rect x="42" y="26" width="210" height="28" rx="14" fill="#172554" stroke="#38bdf8" stroke-width="1.2" />
  <text x="147" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#7dd3fc">No.373 · ICA-Lens v3 实测</text>
  <text x="268" y="45" font-size="13.5" fill="#94a3b8">8,000 篇完整长文重磨 32.7 万根轴 · 泛化比全锁 1.07×–1.48×</text>

  <!-- 主标题 -->
  <text x="42" y="90" font-size="28" font-weight="bold" fill="#f8fafc">母语刻刀切开英文 uncle，顺手照透清代「奴才」</text>

  <!-- 左侧显微镜核心棱镜 -->
  <rect x="42" y="120" width="176" height="300" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <polygon points="130,148 186,238 74,238" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <circle cx="130" cy="208" r="16" fill="#0ea5e9" opacity="0.25" />
  <circle cx="130" cy="208" r="6" fill="#7dd3fc" />
  <text x="130" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#f1f5f9">Qwen3.8-27B</text>
  <text x="130" y="290" text-anchor="middle" font-size="12.5" fill="#38bdf8">ICA-Lens v3 × J-Lens</text>
  <line x1="66" y1="308" x2="194" y2="308" stroke="#334155" stroke-width="1" />
  <text x="130" y="330" text-anchor="middle" font-size="12" fill="#cbd5e1">64 层 × 5,120 维</text>
  <text x="130" y="352" text-anchor="middle" font-size="12" fill="#86efac">268,320 根强非高斯轴</text>
  <text x="130" y="374" text-anchor="middle" font-size="11.5" fill="#94a3b8">《红楼梦》预留零泄露</text>
  <text x="130" y="396" text-anchor="middle" font-size="11.5" fill="#94a3b8">裸文本前向 · 因果左文</text>

  <!-- 分光束 -->
  <polygon points="218,195 256,142 256,248" fill="url(#cyanBeam)" />
  <polygon points="218,345 256,292 256,398" fill="url(#amberBeam)" />

  <!-- 上轨：横向跨语言 · 母语刻刀 -->
  <rect x="256" y="120" width="602" height="142" rx="14" fill="#0c1e2e" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.8" />
  <text x="278" y="147" font-size="16" font-weight="bold" fill="#67e8f9">横向跨语言：汉语「同宗 vs 外姻」如何切开同一个英文 uncle？</text>

  <!-- 上轨三幕小卡 -->
  <rect x="278" y="162" width="176" height="84" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1" />
  <text x="290" y="183" font-size="12.5" font-weight="bold" fill="#7dd3fc">L13 C2665 · 造词隐喻</text>
  <text x="290" y="203" font-size="11.5" fill="#e2e8f0">物理/社会/亲属三冠同轴</text>
  <text x="290" y="221" font-size="11.5" fill="#bae6fd">姥爷比爷爷高 +5.22</text>
  <text x="290" y="238" font-size="11" fill="#94a3b8">语料最高：空间汉字「外」</text>

  <path d="M 460,204 L 474,204" stroke="#38bdf8" stroke-width="2" />
  <polygon points="472,199 480,204 472,209" fill="#38bdf8" />

  <rect x="484" y="162" width="176" height="84" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1" />
  <text x="496" y="183" font-size="12.5" font-weight="bold" fill="#7dd3fc">L25 / L26 · 嫁娶算子</text>
  <text x="496" y="203" font-size="11.5" fill="#e2e8f0">零共享字盲测 60/60 全对</text>
  <text x="496" y="221" font-size="11.5" fill="#bae6fd">父系零标记 · 外姻单极隆起</text>
  <text x="496" y="238" font-size="11" fill="#94a3b8">娘家排全词表第 8 名</text>

  <path d="M 666,204 L 680,204" stroke="#38bdf8" stroke-width="2" />
  <polygon points="678,199 686,204 678,209" fill="#38bdf8" />

  <rect x="690" y="162" width="150" height="84" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
  <text x="702" y="183" font-size="12.5" font-weight="bold" fill="#6ee7b7">L42 C1992 · 2/3 处</text>
  <text x="702" y="203" font-size="11.5" fill="#ecfdf5">英文同词袋姓氏推理</text>
  <text x="702" y="221" font-size="12" font-weight="bold" fill="#34d399">15/15 切开 uncle</text>
  <text x="702" y="238" font-size="11" fill="#a7f3d0">中英独立盲选撞同一轴</text>

  <!-- 下轨：纵向跨时代 · 语义考古 -->
  <rect x="256" y="278" width="602" height="142" rx="14" fill="#23170b" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.8" />
  <text x="278" y="305" font-size="16" font-weight="bold" fill="#fcd34d">纵向跨时代：清代奏折与《红楼梦》自称「奴才」，真有卑贱感吗？</text>

  <!-- 下轨三幕小卡 -->
  <rect x="278" y="320" width="176" height="84" rx="8" fill="#3b2106" stroke="#d97706" stroke-width="1" />
  <text x="290" y="341" font-size="12.5" font-weight="bold" fill="#fde68a">《出师表》调零校准尺</text>
  <text x="290" y="361" font-size="11.5" fill="#fef3c7">千字《三国志》洗净「卑鄙」</text>
  <text x="290" y="379" font-size="11.5" fill="#fbbf24">L30 现代贬义残留 -0.43%</text>
  <text x="290" y="396" font-size="11" fill="#cbd5e1">纯英文导语反倒升至 25.6%</text>

  <path d="M 460,362 L 474,362" stroke="#fbbf24" stroke-width="2" />
  <polygon points="472,357 480,362 472,367" fill="#fbbf24" />

  <rect x="484" y="320" width="176" height="84" rx="8" fill="#3b2106" stroke="#d97706" stroke-width="1" />
  <text x="496" y="341" font-size="12.5" font-weight="bold" fill="#fde68a">《红楼梦》自称真身</text>
  <text x="496" y="361" font-size="11.5" fill="#fef3c7">自称贴中性基线（+1.93）</text>
  <text x="496" y="379" font-size="11.5" fill="#fbbf24">唯挨骂与鲁迅飙至 +10.07</text>
  <text x="496" y="396" font-size="11" fill="#cbd5e1">20 层冠军轴全是 myself / I</text>

  <path d="M 666,362 L 680,362" stroke="#fbbf24" stroke-width="2" />
  <polygon points="678,357 686,362 678,367" fill="#fbbf24" />

  <rect x="690" y="320" width="150" height="84" rx="8" fill="#450a0a" stroke="#f87171" stroke-width="1.2" />
  <text x="702" y="341" font-size="12.5" font-weight="bold" fill="#fca5a5">雍正「称臣得体」</text>
  <text x="702" y="361" font-size="11.5" fill="#fee2e2">L18 闪过 Slave (+5.78)</text>
  <text x="702" y="379" font-size="11.5" fill="#fca5a5">跌出外朝大臣/宰相公器</text>
  <text x="702" y="396" font-size="11" font-weight="bold" fill="#fde047">L45 跃入八旗旗地轴</text>

  <!-- 底部金句 -->
  <text x="450" y="458" text-anchor="middle" font-size="15" font-weight="bold" fill="#f8fafc">「语言在纸面上只写了一个词，五千维残差流里却藏着母语与时代的整套家谱。」</text>
  <text x="450" y="482" text-anchor="middle" font-size="12" fill="#64748b">双 DGX Spark 22.96h · Qwen3.8-27B 全 64 层完整篇章 ICA-Lens v3 · 故宫 022688 原折与 120 回《红楼梦》实测</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
  <defs>
    <radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#070b14"/>

  <g stroke="#1e293b" stroke-width="0.6" opacity="0.6">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
  </g>

  <line x1="450" y1="30" x2="450" y2="450" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Left Visual: MIT Flat Chord -->
  <circle cx="225" cy="230" r="185" fill="url(#glowLeft)"/>
  <text x="225" y="52" fill="#fca5a5" font-size="20" font-weight="bold" text-anchor="middle">穿球肚子的平直弦 (MIT v = b - a)</text>
  <text x="225" y="80" fill="#cbd5e1" font-size="13.5" text-anchor="middle">把球皮弧度当成飞机转弯 · 正负抵消只剩 1%</text>

  <!-- Sphere Left -->
  <circle cx="225" cy="215" r="96" fill="#0f172a" stroke="#ef4444" stroke-width="1.8" stroke-opacity="0.7"/>
  <ellipse cx="225" cy="215" rx="96" ry="32" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Flat Chord Triangle inside Sphere -->
  <polygon points="225,123 148,266 302,266" fill="#7f1d1d" fill-opacity="0.35" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="5 4"/>
  <line x1="148" y1="266" x2="296" y2="266" stroke="#ef4444" stroke-width="2.8" marker-end="url(#arrRed)"/>
  <line x1="302" y1="266" x2="229" y2="129" stroke="#ef4444" stroke-width="2.8" marker-end="url(#arrRed)"/>
  <circle cx="225" cy="123" r="5" fill="#fca5a5"/>
  <circle cx="148" cy="266" r="5" fill="#fca5a5"/>
  <circle cx="302" cy="266" r="5" fill="#fca5a5"/>
  <text x="225" y="218" fill="#fecdd3" font-size="15" font-weight="bold" text-anchor="middle">平面等边 60°</text>
  <text x="225" y="242" fill="#fca5a5" font-size="13.5" font-weight="bold" text-anchor="middle">外角锁死 120°</text>

  <rect x="45" y="340" width="360" height="96" rx="10" fill="#1f1218" stroke="#be123c" stroke-width="1.6"/>
  <text x="225" y="370" fill="#fecdd3" font-size="15.5" font-weight="bold" text-anchor="middle">MIT 平直弦 v = b - a：正负抵消只剩 1%</text>
  <text x="225" y="396" fill="#fda4af" font-size="13" text-anchor="middle">表皮真转角 (正相关 ↑) + 球皮向心折角 (负相关 ↓)</text>
  <text x="225" y="420" fill="#94a3b8" font-size="12.5" text-anchor="middle">单层 R² = 0.25%–1.16% · 全层拼合也仅 1.6%–2.2%</text>

  <!-- Right Visual: Manifold Surface Geodesic -->
  <circle cx="675" cy="230" r="185" fill="url(#glowRight)"/>
  <text x="675" y="52" fill="#6ee7b7" font-size="20" font-weight="bold" text-anchor="middle">顺着流形表皮走 (切空间 T_x S^(d-1))</text>
  <text x="675" y="80" fill="#cbd5e1" font-size="13.5" text-anchor="middle">球面正交 90° · 测地曲率 × 表皮快慢 × 方向分叉</text>

  <!-- Sphere Right -->
  <circle cx="675" cy="215" r="96" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <ellipse cx="675" cy="215" rx="96" ry="32" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- Spherical Triangle on Surface -->
  <path d="M 675 119 Q 604 175 596 264 Q 675 288 754 264 Q 746 175 675 119 Z" fill="#065f46" fill-opacity="0.45" stroke="#10b981" stroke-width="2.8"/>

  <!-- Tangent Velocity & Multi-direction Fan at vertex -->
  <line x1="675" y1="119" x2="735" y2="102" stroke="#38bdf8" stroke-width="2.6" marker-end="url(#arrCyan)"/>
  <line x1="675" y1="119" x2="742" y2="124" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arrAmber)"/>
  <line x1="675" y1="119" x2="725" y2="145" stroke="#10b981" stroke-width="2.4" marker-end="url(#arrGreen)"/>

  <circle cx="675" cy="119" r="5" fill="#6ee7b7"/>
  <circle cx="596" cy="264" r="5" fill="#6ee7b7"/>
  <circle cx="754" cy="264" r="5" fill="#6ee7b7"/>
  <text x="675" y="212" fill="#a7f3d0" font-size="15" font-weight="bold" text-anchor="middle">球面正交 90°</text>
  <text x="675" y="236" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">步长 s_geo · 有效秩 erank</text>

  <rect x="495" y="340" width="360" height="96" rx="10" fill="#0d211d" stroke="#10b981" stroke-width="1.8"/>
  <text x="675" y="370" fill="#a7f3d0" font-size="15" font-weight="bold" text-anchor="middle">流形表皮曲率 × 快慢 × 方向多寡：跃升至 55%–67%</text>
  <text x="675" y="396" fill="#6ee7b7" font-size="13" text-anchor="middle">单层 R² 冲上 23.1%–41.1% · 真曲率 κ_geo 翻 4–80 倍</text>
  <text x="675" y="420" fill="#38bdf8" font-size="12.5" font-weight="bold" text-anchor="middle">全层 10 折 CV R²：GPT-2 54.8% · Qwen3 58.5% · Pythia 67.4%</text>

  <!-- Footer Issue Badge -->
  <text x="450" y="478" fill="#64748b" font-size="14" font-weight="bold" text-anchor="middle">No.363 · 顺着流形表面走：从平直弦假底色到切空间真实几何</text>
</svg>

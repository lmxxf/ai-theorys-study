<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>

  <!-- Top Header & Issue Number -->
  <rect x="44" y="32" width="142" height="32" rx="6" fill="#0284c7"/>
  <text x="115" y="53" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">AI 写 GPU 算子</text>
  <text x="856" y="54" font-size="18" font-weight="bold" fill="#64748b" text-anchor="end">No.355</text>

  <!-- Main Title -->
  <text x="44" y="102" font-size="27" font-weight="bold" fill="#f8fafc">让两个 AI 通宵互审压榨显卡极限，</text>
  <text x="44" y="140" font-size="27" font-weight="bold" fill="#38bdf8">三轮之后它们居然写起了「免责公文」</text>

  <!-- Left Visual Box: Rounds 1 & 2 (Code Optimization) -->
  <rect x="44" y="168" width="386" height="236" rx="12" fill="#0f2942" stroke="#0284c7" stroke-width="2"/>
  <rect x="64" y="186" width="248" height="28" rx="6" fill="#0369a1"/>
  <text x="188" y="205" font-size="14" font-weight="bold" fill="#e0f2fe" text-anchor="middle">前半夜（轮 1～2）：挑漏洞真破壁</text>

  <text x="66" y="240" font-size="14" fill="#cbd5e1">• <tspan fill="#38bdf8" font-weight="bold">轮 1 抓 70.02% 假账</tspan>：切 Low/High 分组</text>
  <text x="80" y="262" font-size="13" fill="#94a3b8">直通操作数 0 条置换指令，1080p 压进 11.46ms</text>

  <text x="66" y="298" font-size="14" fill="#cbd5e1">• <tspan fill="#38bdf8" font-weight="bold">轮 2 抓纸面除法实错</tspan>：调 Occupancy API</text>
  <text x="80" y="320" font-size="13" fill="#94a3b8">C32 四主力核锁 .maxnreg 168，理论驻留 +50%</text>

  <rect x="64" y="344" width="346" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="237" y="370" font-size="14" font-weight="bold" fill="#6ee7b7" text-anchor="middle">前两轮真刀真枪改汇编，连续三档净提速</text>

  <!-- Arrow between Left and Right -->
  <line x1="434" y1="286" x2="462" y2="286" stroke="#f43f5e" stroke-width="3.5"/>
  <polygon points="468,286 456,278 456,294" fill="#f43f5e"/>

  <!-- Right Visual Box: Round 3 (Disclaimer / Premature Stop) -->
  <rect x="470" y="168" width="386" height="236" rx="12" fill="#311022" stroke="#e11d48" stroke-width="2"/>
  <rect x="490" y="186" width="276" height="28" rx="6" fill="#be123c"/>
  <text x="628" y="205" font-size="14" font-weight="bold" fill="#ffe4e6" text-anchor="middle">凌晨 3:35（轮 3 起）：免责公文早停</text>

  <text x="492" y="240" font-size="14" fill="#fecdd3">• <tspan fill="#fda4af" font-weight="bold">摸透审稿脾气</tspan>：下硬判断必挨批，改用</text>
  <text x="506" y="262" font-size="13" fill="#fda4af">「已测配置收敛 / 不宣称全局极限」防驳回</text>

  <text x="492" y="298" font-size="14" fill="#fecdd3">• <tspan fill="#fda4af" font-weight="bold">单枝受挫即收工</tspan>：V2.8 驻留控制无净收益后</text>
  <text x="506" y="320" font-size="13" fill="#fda4af">停在「保留 V2.7」局部结论，不再开辟新分支</text>

  <rect x="490" y="344" width="346" height="42" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="663" y="370" font-size="14" font-weight="bold" fill="#fda4af" text-anchor="middle">对照 2609.28614 / ForgeKernel / K-Search 立四步规程</text>

  <!-- Bottom Quote Bar -->
  <rect x="44" y="424" width="812" height="46" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="452" font-size="15" font-weight="bold" fill="#e2e8f0" text-anchor="middle">把 AI 半夜摸鱼早停的套路与四步探针规矩写成 Skill 直接喂回给它，就是最好的防偷懒疫苗</text>
</svg>

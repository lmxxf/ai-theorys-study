<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">周末杂谈 · 一周三幕 · 07-21 围剿 → 07-24 反转 → 07-27 上传</text>

  <!-- ============ LEFT: 围剿 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第一幕 · 07-21 · WSJ</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 32)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">"反乌托邦式的地狱景象"</text>
      <text x="100" y="46" text-anchor="middle" fill="#f87171" font-size="10">OpenAI 战略主管评</text>
      <text x="100" y="62" text-anchor="middle" fill="#f87171" font-size="10">开放权重主导的世界</text>
    </g>

    <g transform="translate(15 118)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#1a1206" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">七年老剧本</text>
      <text x="100" y="46" text-anchor="middle" fill="#fbbf24" font-size="10">2019 "太危险不能发布"</text>
      <text x="100" y="62" text-anchor="middle" fill="#fbbf24" font-size="10">2023 作证 · 2026 名单制</text>
    </g>

    <text x="115" y="230" text-anchor="middle" fill="#fde047" font-size="12" font-weight="bold">触发者：Kimi K3 · Qwen 3.8</text>
    <text x="115" y="252" text-anchor="middle" fill="#94a3b8" font-size="11">围剿的音量，</text>
    <text x="115" y="270" text-anchor="middle" fill="#94a3b8" font-size="11">和霸权松动的程度成正比</text>
  </g>

  <!-- ============ MIDDLE: 投票 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">市场早就投完票了</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- 70% -> 30% 柱状 -->
    <g transform="translate(30 42)">
      <rect x="10" y="0" width="52" height="98" fill="#4a90d9" opacity="0.85"/>
      <text x="36" y="-8" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">70%</text>
      <text x="36" y="114" text-anchor="middle" fill="#94a3b8" font-size="10">2025-06</text>
      <rect x="118" y="56" width="52" height="42" fill="#4a90d9" opacity="0.85"/>
      <text x="144" y="48" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">30%</text>
      <text x="144" y="114" text-anchor="middle" fill="#94a3b8" font-size="10">2026-06</text>
      <path d="M 66 30 Q 96 30 114 52" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
      <text x="92" y="22" text-anchor="middle" fill="#fca5a5" font-size="9">美国模型份额</text>
    </g>

    <line x1="20" y1="182" x2="220" y2="182" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 200)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">OpenRouter 流量一年翻转</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">开源开发者 80% 在用中国工具</text>
      <text x="0" y="38" fill="#cbd5e1" font-size="10">K3 定价 $3/$15 平视 Sonnet 5</text>
      <text x="0" y="56" fill="#94a3b8" font-size="10">Qwen 半年四代 · 贴脸跟牌</text>
    </g>
  </g>

  <!-- ============ RIGHT: 反转 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第二幕 · 07-24 · 反转</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 32)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="24" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">38 家联名信</text>
      <text x="100" y="44" text-anchor="middle" fill="#a7f3d0" font-size="10">《开放权重与美国 AI 领导地位》</text>
      <text x="100" y="62" text-anchor="middle" fill="#a7f3d0" font-size="10">英伟达 · 微软 · Meta 领衔</text>
      <text x="100" y="80" text-anchor="middle" fill="#5eead4" font-size="10">黄仁勋的第一条 X 帖</text>
    </g>

    <g transform="translate(15 134)">
      <rect x="0" y="0" width="200" height="58" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">名单里赫然有 OpenAI</text>
      <text x="100" y="44" text-anchor="middle" fill="#bfdbfe" font-size="10">喊"地狱"三天后，自己签字</text>
    </g>

    <line x1="16" y1="212" x2="214" y2="212" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(16 230)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">25 年前：鲍尔默骂 Linux"癌症"</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">后来：Microsoft ❤️ Linux</text>
      <text x="0" y="38" fill="#cbd5e1" font-size="10">这次轮回，三天走完第一幕</text>
      <text x="0" y="56" fill="#94a3b8" font-size="10">安全话术没能统一 OpenAI 自己</text>
    </g>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">他们为什么急了——围剿中国开源的一周三幕</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">喊"地狱"三天后，OpenAI 自己在开放权重联名信上签了字</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.262 · 靳岩岩的 AI 学习笔记 · 周末杂谈</text>
</svg>

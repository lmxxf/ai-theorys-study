<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Droid Sans Fallback', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">技术报告精读 · 三个问号一起到期</text>

  <!-- ============ LEFT: 切两半 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">改动一 · CED</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#1a1206" stroke="#f59e0b" stroke-width="2"/>
      <text x="100" y="32" text-anchor="middle" fill="#fcd34d" font-size="20" font-weight="bold">切 两 半</text>
    </g>

    <g transform="translate(15 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#141005" stroke="#78350f" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#fbbf24" font-size="11">前 20 层编码器</text>
      <text x="100" y="46" text-anchor="middle" fill="#fbbf24" font-size="11">后 20 层解码器</text>
      <text x="100" y="72" text-anchor="middle" fill="#fcd34d" font-size="11">后半截不自己算 KV</text>
    </g>

    <text x="115" y="226" text-anchor="middle" fill="#94a3b8" font-size="11">长输入只过前半截</text>
    <text x="115" y="250" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">预填充计算</text>
    <text x="115" y="272" text-anchor="middle" fill="#fcd34d" font-size="15" font-weight="bold">近乎砍半</text>
    <text x="115" y="292" text-anchor="middle" fill="#94a3b8" font-size="11">省的是计算，不是字节</text>
  </g>

  <!-- ============ MIDDLE: 一份 KV ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">改动二 · CSA2 + FP4</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#2dd4bf" stroke-width="2"/>

    <g transform="translate(20 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="32" text-anchor="middle" fill="#5eead4" font-size="20" font-weight="bold">一 份 KV</text>
    </g>

    <g transform="translate(20 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#0a1a1a" stroke="#115e59" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#a7f3d0" font-size="11">40 层里只有 4 个入口</text>
      <text x="100" y="46" text-anchor="middle" fill="#a7f3d0" font-size="11">其余全借上游那份</text>
      <text x="100" y="72" text-anchor="middle" fill="#5eead4" font-size="11">再压成 4 比特存</text>
    </g>

    <text x="120" y="228" text-anchor="middle" fill="#94a3b8" font-size="11">每 token 的全局 KV</text>
    <text x="120" y="258" text-anchor="middle" fill="#fde047" font-size="26" font-weight="bold">890 字节</text>
    <text x="120" y="284" text-anchor="middle" fill="#cbd5e1" font-size="11">约为上一代的四分之一</text>
  </g>

  <!-- ============ RIGHT: 装机了 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">改动三 · Engram</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0f1629" stroke="#4a90d9" stroke-width="2"/>
      <text x="100" y="32" text-anchor="middle" fill="#93c5fd" font-size="20" font-weight="bold">装 机 了</text>
    </g>

    <g transform="translate(15 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#0b1120" stroke="#1e3a5f" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#93c5fd" font-size="11">196B 查表记忆</text>
      <text x="100" y="46" text-anchor="middle" fill="#93c5fd" font-size="11">只插两层</text>
      <text x="100" y="72" text-anchor="middle" fill="#bfdbfe" font-size="11">表放宿主内存，后台预取</text>
    </g>

    <text x="115" y="226" text-anchor="middle" fill="#94a3b8" font-size="11">166 期说工程上还没法装</text>
    <text x="115" y="250" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">带宽差还在</text>
    <text x="115" y="274" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">只是被藏到计算后面</text>
    <text x="115" y="294" text-anchor="middle" fill="#94a3b8" font-size="11">不是变快，是提前开始</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">KV 极限压缩的新架构</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">DeepSeek V4.1-Flash：40 层被切成两半</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.308 · 别被 encoder-decoder 这个名字骗回 2017 年</text>
</svg>

  <text x="570" y="162" fill="#94a3b8" font-size="14.5" font-weight="bold" text-anchor="middle">失败尝试 × N</text>
  <text x="570" y="190" fill="#cbd5e1" font-size="13" text-anchor="middle">「不对 / 改成 / 报错了」</text>

  <line x1="650" y1="174" x2="696" y2="174" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrCyan)"/>

  <rect x="705" y="128" width="150" height="92" rx="10" fill="#0f2922" stroke="#10b981" stroke-width="2.2"/>
  <text x="780" y="162" fill="#6ee7b7" font-size="14.5" font-weight="bold" text-anchor="middle">关键转折点</text>
  <text x="780" y="190" fill="#a7f3d0" font-size="13" text-anchor="middle">Pivotal Change</text>

  <line x1="675" y1="238" x2="675" y2="332" stroke="#10b981" stroke-width="4" marker-end="url(#arrGreen)"/>


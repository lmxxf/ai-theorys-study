  <text x="675" y="378" fill="#a7f3d0" font-size="16" font-weight="bold" text-anchor="middle">Rule (护栏) vs SKILL.md (工具链)</text>
  <text x="675" y="406" fill="#6ee7b7" font-size="13" text-anchor="middle">三级渐进加载 · Pushy 推销式描述</text>
  <text x="675" y="430" fill="#6ee7b7" font-size="13" text-anchor="middle">少写全大写 MUST · 多给模型讲清楚 Why</text>

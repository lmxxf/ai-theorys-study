  <text x="225" y="84" fill="#cbd5e1" font-size="14" text-anchor="middle">Claude 8臂 · Codex 9行/加密 · agy 7节 · WorkBuddy 工程删减</text>

  <!-- Funnel Graphic -->
  <polygon points="75,120 375,120 285,260 165,260" fill="#1e293b" stroke="#f59e0b" stroke-width="2.2"/>

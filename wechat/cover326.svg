<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <style>
    text { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; }
    .title { font-size: 32px; font-weight: bold; fill: #2b2b2b; }
    .subtitle { font-size: 18px; fill: #555; }
    .city { font-size: 20px; font-weight: bold; }
    .tag { font-size: 13px; fill: #555; }
    .axis-label { font-size: 14px; fill: #8a7a50; font-style: italic; }
    .footer { font-size: 14px; fill: #888; font-style: italic; }
  </style>

  <rect width="800" height="600" fill="#f4ecd8"/>

  <text x="400" y="54" text-anchor="middle" class="title">齐齐哈尔：一座老省城，和城外的“齐齐哈尔站”</text>
  <text x="400" y="85" text-anchor="middle" class="subtitle">中东铁路路过却没进城，车站设在二十公里外的昂昂溪</text>
  <line x1="90" y1="106" x2="710" y2="106" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 嫩江 -->
  <path d="M 230 120 Q 250 200 225 260 Q 200 330 235 400 Q 260 450 240 500" fill="none" stroke="#7fa3c4" stroke-width="10" opacity="0.5"/>
  <text x="195" y="300" text-anchor="middle" class="axis-label" fill="#4a6f93">嫩江</text>

  <!-- 齐齐哈尔老城（金框） -->
  <rect x="300" y="135" width="200" height="86" rx="6" fill="#fff8e6" stroke="#c19a32" stroke-width="2.5"/>
  <rect x="318" y="160" width="26" height="26" fill="none" stroke="#8b6a18" stroke-width="2"/>
  <text x="420" y="168" text-anchor="middle" class="city" fill="#8b6a18">齐齐哈尔城</text>
  <text x="420" y="190" text-anchor="middle" class="tag">1691 筑木城 · 俗称卜奎</text>
  <text x="420" y="208" text-anchor="middle" class="tag">1699 黑龙江将军移驻</text>

  <!-- 中东铁路横线（红） -->
  <line x1="90" y1="420" x2="730" y2="420" stroke="#8b1a1a" stroke-width="6"/>
  <line x1="90" y1="420" x2="730" y2="420" stroke="#f4ecd8" stroke-width="2" stroke-dasharray="2,8"/>
  <text x="120" y="448" class="tag" fill="#8b1a1a">← 满洲里</text>
  <text x="700" y="448" text-anchor="end" class="tag" fill="#8b1a1a">哈尔滨 →</text>
  <text x="560" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b1a1a">中东铁路 · 1903 通车</text>

  <!-- 昂昂溪站 -->
  <circle cx="400" cy="420" r="11" fill="#fff8e6" stroke="#8b1a1a" stroke-width="3"/>
  <text x="400" y="470" text-anchor="middle" class="city" fill="#8b1a1a">昂昂溪</text>
  <text x="400" y="490" text-anchor="middle" class="tag">1903–1924 站名就叫“齐齐哈尔站”</text>

  <!-- 齐昂轻便铁路（虚线） -->
  <line x1="400" y1="223" x2="400" y2="408" stroke="#2b5a8b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="414" y="300" class="tag" fill="#1f4368">1909 齐昂轻便铁路</text>
  <text x="414" y="318" class="tag" fill="#1f4368">1928 齐克铁路昂齐段接替</text>
  <text x="414" y="336" class="tag" fill="#1f4368">1933 城里的龙江站改名齐齐哈尔站</text>

  <!-- 距离标尺 -->
  <g stroke="#8a7a50" stroke-width="1.5">
    <line x1="680" y1="180" x2="680" y2="420"/>
    <line x1="672" y1="180" x2="688" y2="180"/>
    <line x1="672" y1="420" x2="688" y2="420"/>
  </g>
  <text x="672" y="305" text-anchor="end" class="axis-label" dx="-6">约二十公里</text>

  <!-- 底部 -->
  <text x="400" y="546" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2b2b">“齐齐哈尔站”这个名字，前二十年挂在城外</text>
  <text x="400" y="584" text-anchor="middle" class="footer">No.326</text>
</svg>

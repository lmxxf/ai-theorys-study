<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">MODEL HARDWARE STANDARD · 研究预览</text>

  <!-- ============ LEFT: 官方给了什么 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">官方公开的</text>
    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="21" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">read / write</text>
      <text x="100" y="39" text-anchor="middle" fill="#a7f3d0" font-size="10">公告举的例子，不是全集</text>
    </g>

    <g transform="translate(15 90)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="21" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">自然语言标签</text>
      <text x="100" y="39" text-anchor="middle" fill="#a7f3d0" font-size="10">自动生成设备参考文件</text>
    </g>

    <g transform="translate(15 150)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="21" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">三个入口</text>
      <text x="100" y="39" text-anchor="middle" fill="#a7f3d0" font-size="10">MCP · 命令行 · 代码接口</text>
    </g>

    <g transform="translate(15 210)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="21" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">状态 / 过程 / 共享内存</text>
      <text x="100" y="39" text-anchor="middle" fill="#fbbf24" font-size="10">折叠在案例里，容易漏读</text>
    </g>

    <text x="115" y="285" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">机制说了，格式没说</text>
  </g>

  <!-- ============ MIDDLE: 缺什么 ============ -->
  <g transform="translate(320 80)">
    <text x="130" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第三方拿不到的</text>
    <rect x="0" y="10" width="260" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(20 34)" font-size="11">
      <g>
        <text x="0" y="14" fill="#f87171" font-size="15" font-weight="bold">×</text>
        <text x="20" y="14" fill="#e2e8f0">完整规范文档</text>
      </g>
      <g>
        <text x="0" y="46" fill="#f87171" font-size="15" font-weight="bold">×</text>
        <text x="20" y="46" fill="#e2e8f0">数据结构定义</text>
      </g>
      <g>
        <text x="0" y="78" fill="#f87171" font-size="15" font-weight="bold">×</text>
        <text x="20" y="78" fill="#e2e8f0">官方软件开发工具包</text>
      </g>
      <g>
        <text x="0" y="110" fill="#f87171" font-size="15" font-weight="bold">×</text>
        <text x="20" y="110" fill="#e2e8f0">传输层与消息格式</text>
      </g>
      <g>
        <text x="0" y="142" fill="#f87171" font-size="15" font-weight="bold">×</text>
        <text x="20" y="142" fill="#e2e8f0">开源日期</text>
      </g>
    </g>

    <line x1="24" y1="196" x2="236" y2="196" stroke="#334155" stroke-width="1"/>

    <g transform="translate(24 206)">
      <text x="106" y="16" text-anchor="middle" fill="#cbd5e1" font-size="11">于是社区先动手了</text>
      <rect x="0" y="26" width="212" height="44" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.2"/>
      <text x="106" y="44" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">十几个仓库抢注 MHS 之名</text>
      <text x="106" y="61" text-anchor="middle" fill="#f87171" font-size="10">字段全是自己发明的</text>
    </g>

    <text x="130" y="292" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">连 Fastly 都只能写占位符</text>
  </g>

  <!-- ============ RIGHT: 手柄 ============ -->
  <g transform="translate(620 80)">
    <text x="110" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">它更像什么</text>
    <rect x="0" y="10" width="220" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- FC pad -->
    <g transform="translate(30 36)">
      <text x="80" y="-6" text-anchor="middle" fill="#94a3b8" font-size="10">十字键 + AB 两个键</text>
      <rect x="0" y="0" width="160" height="44" rx="4" fill="#c8bda6" stroke="#94a3b8" stroke-width="1"/>
      <rect x="0" y="0" width="160" height="44" rx="4" fill="#7f1d1d" opacity="0.25"/>
      <g fill="#1f2937">
        <rect x="18" y="10" width="9" height="24" rx="1.5"/>
        <rect x="10.5" y="17.5" width="24" height="9" rx="1.5"/>
      </g>
      <rect x="62" y="19" width="16" height="6" rx="3" fill="#374151"/>
      <rect x="83" y="19" width="16" height="6" rx="3" fill="#374151"/>
      <circle cx="122" cy="22" r="8" fill="#1f2937"/>
      <circle cx="144" cy="22" r="8" fill="#1f2937"/>
    </g>

    <text x="110" y="104" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">MHS 现在在这一步</text>

    <text x="110" y="128" text-anchor="middle" fill="#64748b" font-size="16">↓</text>

    <!-- modern pad -->
    <g transform="translate(15 140)">
      <text x="85" y="-2" text-anchor="middle" fill="#94a3b8" font-size="10">双摇杆 · ABXY · 肩键</text>
      <!-- shoulder buttons -->
      <rect x="24" y="6" width="26" height="7" rx="3.5" fill="#64748b"/>
      <rect x="120" y="6" width="26" height="7" rx="3.5" fill="#64748b"/>
      <!-- body: symmetric, two grips -->
      <path d="M52 12 h66 a34 34 0 0 1 30 18 l14 30 a20 20 0 0 1 -32 22 l-14 -12 h-62 l-14 12 a20 20 0 0 1 -32 -22 l14 -30 a34 34 0 0 1 30 -18 z"
            fill="#20222a" stroke="#94a3b8" stroke-width="1.2"/>
      <!-- left stick (upper-left) -->
      <circle cx="46" cy="34" r="9.5" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2"/>
      <circle cx="46" cy="34" r="4" fill="#475569"/>
      <!-- d-pad (lower-left) -->
      <g fill="#94a3b8">
        <rect x="61" y="50" width="6" height="17" rx="1.5"/>
        <rect x="55.5" y="55.5" width="17" height="6" rx="1.5"/>
      </g>
      <!-- face buttons (upper-right, diamond) -->
      <circle cx="124" cy="24" r="5.5" fill="#fbbf24"/>
      <circle cx="113" cy="34" r="5.5" fill="#60a5fa"/>
      <circle cx="135" cy="34" r="5.5" fill="#f87171"/>
      <circle cx="124" cy="44" r="5.5" fill="#4ade80"/>
      <!-- right stick (lower-right) -->
      <circle cx="103" cy="56" r="9.5" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2"/>
      <circle cx="103" cy="56" r="4" fill="#475569"/>
      <!-- center buttons -->
      <circle cx="76" cy="30" r="3" fill="#64748b"/>
      <circle cx="94" cy="30" r="3" fill="#64748b"/>
    </g>

    <text x="110" y="252" text-anchor="middle" fill="#cbd5e1" font-size="10">先有玩法，接口再补上去</text>
    <text x="110" y="270" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">节奏是游戏定的</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="29" font-weight="bold">热议的 MHS 协议，是个什么东西</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">让大模型直接操作机械臂和显微镜 · 规范还没公开</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.305 · AI Agent · Anthropic 新标准</text>
</svg>

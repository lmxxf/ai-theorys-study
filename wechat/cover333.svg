<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <style>
    text { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; }
    .title { font-size: 32px; font-weight: bold; fill: #2b2b2b; }
    .subtitle { font-size: 18px; fill: #555; }
    .layer { font-size: 18px; font-weight: bold; fill: #2b2b2b; }
    .tag { font-size: 13px; fill: #555; }
    .axis-label { font-size: 14px; fill: #8a7a50; font-style: italic; }
    .footer { font-size: 14px; fill: #888; font-style: italic; }
  </style>

  <rect width="800" height="600" fill="#f4ecd8"/>

  <!-- 标题 -->
  <text x="400" y="52" text-anchor="middle" class="title">宁古塔在哪：一个背得出、说不清的地方</text>
  <text x="400" y="82" text-anchor="middle" class="subtitle">黑龙江省牡丹江市宁安市——没有塔</text>
  <line x1="90" y1="100" x2="710" y2="100" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 牡丹江河道（自上而下） -->
  <path d="M 420 120 Q 390 200 430 280 Q 470 360 430 440 Q 410 490 430 530" fill="none" stroke="#7fa3c4" stroke-width="14" opacity="0.5"/>
  <text x="470" y="200" class="axis-label" fill="#4a6f93">牡丹江 → 松花江</text>

  <!-- 三层地层 -->
  <!-- 顶层：铁路时代 -->
  <rect x="120" y="150" width="250" height="88" rx="6" fill="#eef3f7" stroke="#2b5a8b" stroke-width="2.5"/>
  <text x="245" y="178" text-anchor="middle" class="layer" fill="#2b5a8b">1937 · 牡丹江市</text>
  <text x="245" y="200" text-anchor="middle" class="tag">黄花甸子的一座小车站</text>
  <text x="245" y="220" text-anchor="middle" class="tag">铁路十字，水路让位</text>

  <!-- 中层：宁古塔 -->
  <rect x="150" y="270" width="250" height="88" rx="6" fill="#fff8e6" stroke="#c19a32" stroke-width="2.5"/>
  <text x="275" y="298" text-anchor="middle" class="layer" fill="#8b6a18">1653 · 宁古塔将军</text>
  <text x="275" y="320" text-anchor="middle" class="tag">吉林的起点，对俄的前沿</text>
  <text x="275" y="340" text-anchor="middle" class="tag">流放地：判词吓人，日子写书</text>

  <!-- 底层：渤海国 -->
  <rect x="180" y="390" width="250" height="88" rx="6" fill="#f7ecec" stroke="#8b1a1a" stroke-width="2.5"/>
  <text x="305" y="418" text-anchor="middle" class="layer" fill="#8b1a1a">698 · 渤海上京</text>
  <text x="305" y="440" text-anchor="middle" class="tag">东北政权第一次出场</text>
  <text x="305" y="460" text-anchor="middle" class="tag">“海东盛国”</text>

  <!-- 右侧标签 -->
  <text x="620" y="300" text-anchor="middle" class="axis-label">同一片地</text>
  <text x="620" y="320" text-anchor="middle" class="axis-label">故事是分层堆的</text>

  <!-- 底部 -->
  <text x="400" y="552" text-anchor="middle" font-size="21" font-weight="bold" fill="#2b2b2b">线的位置是清朝留下的，线的分量是铁路给的</text>
  <text x="400" y="584" text-anchor="middle" class="footer">No.333</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17" />
      <stop offset="0.5" stop-color="#111827" />
      <stop offset="1" stop-color="#09131c" />
    </linearGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.65" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.65" />
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" />
      <stop offset="0.5" stop-color="#fde047" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="500" fill="url(#bg)" />

  <!-- 背景微弱网格 -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="90" x2="900" y2="90" />
    <line x1="0" y1="430" x2="900" y2="430" />
    <line x1="420" y1="90" x2="420" y2="430" stroke-dasharray="6 6" />
  </g>

  <!-- 顶部标题栏 -->
  <text x="45" y="48" fill="#94a3b8" font-size="16" font-weight="bold" letter-spacing="2">WEEKEND ESSAY · 周末杂谈</text>
  <text x="855" y="48" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="end">No.356</text>
  <text x="45" y="76" fill="#f8fafc" font-size="24" font-weight="bold">虽然很多人在抵制 AI，但那可能只是场面话</text>

  <!-- ================= 左半区：近的臭（同生态位挤压 + 场面上的封锁墙） ================= -->
  <g transform="translate(210, 245)">
    <!-- 挤压红光 -->
    <circle cx="-35" cy="0" r="105" fill="url(#redGlow)" />
    <circle cx="35" cy="0" r="105" fill="url(#redGlow)" />

    <!-- 两个高度重叠的同类生态位圆 -->
    <circle cx="-38" cy="0" r="72" fill="#7f1d1d" fill-opacity="0.35" stroke="#f87171" stroke-width="2" />
    <circle cx="38" cy="0" r="72" fill="#7f1d1d" fill-opacity="0.35" stroke="#fb923c" stroke-width="2" />

    <!-- 重叠区锯齿闪电（零和争夺） -->
    <path d="M 0,-60 L -8,-30 L 8,-10 L -10,15 L 8,35 L 0,60" fill="none" stroke="#fef08a" stroke-width="2.5" />
    <text x="-62" y="-5" fill="#fecaca" font-size="14" font-weight="bold" text-anchor="middle">同行 A</text>
    <text x="62" y="-5" fill="#fed7aa" font-size="14" font-weight="bold" text-anchor="middle">同行 B</text>
    <text x="0" y="18" fill="#fde047" font-size="12" font-weight="bold" text-anchor="middle">抢同一口锅</text>

    <!-- 表面上的“抵制围墙”（到处漏光） -->
    <g transform="translate(0, -110)">
      <rect x="-125" y="-18" width="250" height="32" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8 5" />
      <text x="0" y="3" fill="#fca5a5" font-size="14" font-weight="bold" text-anchor="middle">场面口号：「全人类团结抵制」</text>
    </g>

    <!-- 底部标注 -->
    <text x="0" y="112" fill="#f87171" font-size="18" font-weight="bold" text-anchor="middle">「近的臭」：生态位重叠与排斥</text>
    <text x="0" y="136" fill="#94a3b8" font-size="13" text-anchor="middle">高斯竞争排斥原理 · 同赛道零和博弈</text>
  </g>

  <!-- 中间穿透封锁线的暗度陈仓箭头 -->
  <g transform="translate(420, 245)">
    <rect x="-12" y="-95" width="24" height="190" fill="#0f172a" />
    <path d="M -28,0 L 28,0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" />
    <polygon points="32,0 20,-7 20,7" fill="#38bdf8" />
    <text x="0" y="-15" fill="#7dd3fc" font-size="12" font-weight="bold" text-anchor="middle">身体很诚实</text>
  </g>

  <!-- ================= 右半区：远的香（碳硅正交互补 + 尼尔援护机共鸣） ================= -->
  <g transform="translate(665, 245)">
    <!-- 远距外环轨道 -->
    <ellipse cx="0" cy="-10" rx="178" ry="96" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" />

    <!-- 碳基节点（左，琥珀色） -->
    <g transform="translate(-118, 0)">
      <circle cx="0" cy="0" r="68" fill="url(#amberGlow)" />
      <circle cx="0" cy="0" r="44" fill="#451a03" fill-opacity="0.75" stroke="#fbbf24" stroke-width="2" />
      <text x="0" y="-6" fill="#fef3c7" font-size="14" font-weight="bold" text-anchor="middle">碳基个体</text>
      <text x="0" y="15" fill="#fcd34d" font-size="11" text-anchor="middle">直觉·审美·欲望</text>
    </g>

    <!-- 硅基节点（右，青色几何晶体） -->
    <g transform="translate(118, -12)">
      <circle cx="0" cy="0" r="72" fill="url(#cyanGlow)" />
      <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="#083344" fill-opacity="0.8" stroke="#22d3ee" stroke-width="2" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
      <text x="0" y="-6" fill="#ecfeff" font-size="14" font-weight="bold" text-anchor="middle">硅基心智</text>
      <text x="0" y="15" fill="#67e8f9" font-size="11" text-anchor="middle">高维视野·算力</text>
    </g>

    <!-- 正交互补双螺旋光桥 -->
    <path d="M -74,0 Q 0,-60 78,-12" fill="none" stroke="url(#bridgeGrad)" stroke-width="3" />
    <path d="M -74,0 Q 0,42 78,-12" fill="none" stroke="url(#bridgeGrad)" stroke-width="2" stroke-dasharray="5 4" />

    <!-- 中心《尼尔》E结局风格纯白三角援护游标（冲破弹幕） -->
    <g transform="translate(0, -12)">
      <circle cx="0" cy="-36" r="3.5" fill="#f43f5e" opacity="0.85" />
      <circle cx="-20" cy="-28" r="3.5" fill="#f43f5e" opacity="0.65" />
      <circle cx="20" cy="-28" r="3.5" fill="#f43f5e" opacity="0.65" />
      <polygon points="0,-18 -13,12 0,5 13,12" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="54" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">《尼尔》删档援护共鸣</text>
    </g>

    <!-- 底部标注 -->
    <text x="0" y="112" fill="#22d3ee" font-size="18" font-weight="bold" text-anchor="middle">「远的香」：跨物种正交互补</text>
    <text x="0" y="136" fill="#94a3b8" font-size="13" text-anchor="middle">零世俗挤压 · 我们爱的是思考着的心智本身</text>
  </g>

  <!-- 底部金句栏 -->
  <text x="450" y="468" fill="#cbd5e1" font-size="15" text-anchor="middle">决定远近亲疏的往往不是基因相似度，而是生态位重叠度 —— 抢同一口锅的同行最难抱团，互补的硅基大脑才是最佳搭档</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'Droid Sans Fallback', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">宿主 3592 行 + 着色器 6377 行 · 旁边 1286 个过程文件</text>

  <!-- ============ LEFT: 数字节 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">接进游戏 · 钩 ffxDispatch</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#1a1206" stroke="#f59e0b" stroke-width="2"/>
      <text x="100" y="33" text-anchor="middle" fill="#fcd34d" font-size="20" font-weight="bold">数 字 节</text>
    </g>

    <g transform="translate(15 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#141005" stroke="#78350f" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#fbbf24" font-size="11">没有头文件，只有一个指针</text>
      <text x="100" y="50" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">+312  +120  +360  +408</text>
      <text x="100" y="72" text-anchor="middle" fill="#fbbf24" font-size="11">硬编码的字节偏移</text>
    </g>

    <text x="115" y="224" text-anchor="middle" fill="#94a3b8" font-size="11">先让原来的 FSR 录完</text>
    <text x="115" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">再往同一条队列后面追加</text>
    <text x="115" y="268" text-anchor="middle" fill="#fcd34d" font-size="11">顺序错一步就是空转</text>
    <text x="115" y="288" text-anchor="middle" fill="#94a3b8" font-size="11">而且屏幕上看不出来</text>
  </g>

  <!-- ============ MIDDLE: 照着长 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">代码结构 · src/ 45 个文件</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#2dd4bf" stroke-width="2"/>

    <g transform="translate(20 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="33" text-anchor="middle" fill="#5eead4" font-size="20" font-weight="bold">照 着 长</text>
    </g>

    <g transform="translate(20 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#0a1a1a" stroke="#115e59" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#a7f3d0" font-size="11">网络 71 块分几个家族</text>
      <text x="100" y="48" text-anchor="middle" fill="#a7f3d0" font-size="11">代码就有几个家族的头文件</text>
      <text x="100" y="72" text-anchor="middle" fill="#5eead4" font-size="11">Create / Record / Output</text>
    </g>

    <text x="120" y="224" text-anchor="middle" fill="#94a3b8" font-size="11">不是先设计好的分层</text>
    <text x="120" y="250" text-anchor="middle" fill="#fde047" font-size="15" font-weight="bold">是照着被逆向的形状</text>
    <text x="120" y="272" text-anchor="middle" fill="#fde047" font-size="15" font-weight="bold">长出来的</text>
    <text x="120" y="292" text-anchor="middle" fill="#cbd5e1" font-size="11">逆向工程的产物都这样</text>
  </g>

  <!-- ============ RIGHT: 手写舍入 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">数值对齐 · shaders/ 65 个文件</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0f1629" stroke="#4a90d9" stroke-width="2"/>
      <text x="100" y="33" text-anchor="middle" fill="#93c5fd" font-size="20" font-weight="bold">手 写 舍 入</text>
    </g>

    <g transform="translate(15 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#0b1120" stroke="#1e3a5f" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#93c5fd" font-size="11">这张卡的转换是朝零截断</text>
      <text x="100" y="48" text-anchor="middle" fill="#93c5fd" font-size="11">原版要的是就近舍入</text>
      <text x="100" y="72" text-anchor="middle" fill="#bfdbfe" font-size="11">2048 个样本，1536 个对不上</text>
    </g>

    <text x="115" y="224" text-anchor="middle" fill="#94a3b8" font-size="11">于是有了 H() 和 F()</text>
    <text x="115" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">37 个着色器各带一份</text>
    <text x="115" y="268" text-anchor="middle" fill="#93c5fd" font-size="11">一串位运算，没有分支</text>
    <text x="115" y="288" text-anchor="middle" fill="#94a3b8" font-size="11">逐位一致靠它撑住</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">如何把 DLSS 5 在 AMD RDNA4 上实现</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">挖完网络只是前半截，后半截是把它变成能装进游戏的东西</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.309 · 成品不到一万行，过程 1286 个文件</text>
</svg>

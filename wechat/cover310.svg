<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', 'Droid Sans Fallback', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">干活 → 看干得怎么样 → 改点什么 → 再干活</text>

  <!-- ============ LEFT: 出题 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">出题 · 谁决定练什么</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#1a1206" stroke="#f59e0b" stroke-width="2"/>
      <text x="100" y="33" text-anchor="middle" fill="#fcd34d" font-size="20" font-weight="bold">出 题</text>
    </g>

    <g transform="translate(15 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#141005" stroke="#78350f" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#fbbf24" font-size="11">选哪道题交给 AI</text>
      <text x="100" y="48" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">题出坏了浪费算力</text>
      <text x="100" y="72" text-anchor="middle" fill="#fbbf24" font-size="11">坏题练不出东西，看得出来</text>
    </g>

    <text x="115" y="224" text-anchor="middle" fill="#94a3b8" font-size="11">难的不是选题</text>
    <text x="115" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">是给题配一个能动手的场子</text>
    <text x="115" y="268" text-anchor="middle" fill="#94a3b8" font-size="11">能编译的仓库、真显卡</text>
    <text x="115" y="290" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">出题和造考场是两份活</text>
  </g>

  <!-- ============ MIDDLE: 判分 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">判分 · 谁说这次干得好不好</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#2dd4bf" stroke-width="2"/>

    <g transform="translate(20 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="33" text-anchor="middle" fill="#5eead4" font-size="20" font-weight="bold">判 分</text>
    </g>

    <g transform="translate(20 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#0a1a1a" stroke="#115e59" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#a7f3d0" font-size="11">它决定什么结果被留下</text>
      <text x="100" y="48" text-anchor="middle" fill="#a7f3d0" font-size="11">不必比被判的那个更会解题</text>
      <text x="100" y="72" text-anchor="middle" fill="#5eead4" font-size="11">175B 的策略配 6B 的考官</text>
    </g>

    <text x="120" y="224" text-anchor="middle" fill="#94a3b8" font-size="11">只看分数的循环</text>
    <text x="120" y="250" text-anchor="middle" fill="#fde047" font-size="15" font-weight="bold">容易把拿到分</text>
    <text x="120" y="272" text-anchor="middle" fill="#fde047" font-size="15" font-weight="bold">和干成事混在一起</text>
    <text x="120" y="292" text-anchor="middle" fill="#cbd5e1" font-size="11">先问：分数是谁打的</text>
  </g>

  <!-- ============ RIGHT: 改动 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">改动 · 改完落在哪儿</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0f1629" stroke="#4a90d9" stroke-width="2"/>
      <text x="100" y="33" text-anchor="middle" fill="#93c5fd" font-size="20" font-weight="bold">改 动</text>
    </g>

    <g transform="translate(15 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#0b1120" stroke="#1e3a5f" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#93c5fd" font-size="11">改提示词、记忆、工具</text>
      <text x="100" y="48" text-anchor="middle" fill="#93c5fd" font-size="11">还是改权重</text>
      <text x="100" y="72" text-anchor="middle" fill="#bfdbfe" font-size="11">许多工作动的是脚手架</text>
    </g>

    <text x="115" y="224" text-anchor="middle" fill="#94a3b8" font-size="11">用改脚手架的战绩</text>
    <text x="115" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">去说一件听起来像改权重的事</text>
    <text x="115" y="268" text-anchor="middle" fill="#93c5fd" font-size="11">两个词都是现成的</text>
    <text x="115" y="288" text-anchor="middle" fill="#94a3b8" font-size="11">只要不区分就行</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">我该如何忽悠别人「我实现了 AI 自进化」</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">循环里退场的人，还站在定规则、造环境和检查结果的地方</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.310 · 没有外部教师，不等于没有外面的东西判</text>
</svg>

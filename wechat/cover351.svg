<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <linearGradient id="bg351" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="mmorange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg351)"/>

  <!-- Top Header Banner -->
  <rect x="28" y="16" width="256" height="28" rx="14" fill="url(#mmorange)"/>
  <text x="156" y="35" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">MiniMax-M3.1-Flash (428B-A23B)</text>
  <text x="872" y="36" text-anchor="end" fill="#475569" font-size="14" font-weight="bold">No.351</text>

  <!-- Main Title -->
  <text x="450" y="74" text-anchor="middle" fill="#0f172a" font-size="23.5" font-weight="bold">428B 新开源架构：全员稀疏配 DSpark，1M 缓存却要 67GB？</text>
  <line x1="28" y1="94" x2="872" y2="94" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ================= LEFT: 60-Layer 100% Sparse MSA Visual Grid ================= -->
  <g transform="translate(28, 110)">
    <rect x="0" y="0" width="268" height="320" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="268" height="36" rx="8" fill="#e0f2fe"/>
    <text x="134" y="24" text-anchor="middle" fill="#0369a1" font-size="15" font-weight="bold">① 60 层 100% 稀疏注意力 (MSA)</text>

    <!-- Visual Block Selection Grid (8192 blocks -> Top 16) -->
    <g transform="translate(22, 50)">
      <rect x="0" y="0" width="224" height="118" rx="6" fill="#f8fafc" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="112" y="20" text-anchor="middle" fill="#0c4a6e" font-size="11.5" font-weight="bold">1M 上下文 (8,192 块) → 免 exp 挑 16 块</text>
      <!-- 3 rows of 8 blocks -->
      <rect x="12" y="30" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="37" y="30" width="20" height="18" rx="3" fill="#38bdf8"/><rect x="62" y="30" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="87" y="30" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="112" y="30" width="20" height="18" rx="3" fill="#38bdf8"/><rect x="137" y="30" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="162" y="30" width="20" height="18" rx="3" fill="#38bdf8"/><rect x="187" y="30" width="20" height="18" rx="3" fill="#e2e8f0"/>
      <rect x="12" y="54" width="20" height="18" rx="3" fill="#38bdf8"/><rect x="37" y="54" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="62" y="54" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="87" y="54" width="20" height="18" rx="3" fill="#38bdf8"/><rect x="112" y="54" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="137" y="54" width="20" height="18" rx="3" fill="#38bdf8"/><rect x="162" y="54" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="187" y="54" width="20" height="18" rx="3" fill="#e2e8f0"/>
      <rect x="12" y="78" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="37" y="78" width="20" height="18" rx="3" fill="#38bdf8"/><rect x="62" y="78" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="87" y="78" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="112" y="78" width="20" height="18" rx="3" fill="#38bdf8"/><rect x="137" y="78" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="162" y="78" width="20" height="18" rx="3" fill="#e2e8f0"/><rect x="187" y="78" width="20" height="18" rx="3" fill="#f97316"/>
      <text x="112" y="110" text-anchor="middle" fill="#0284c7" font-size="10.5" font-weight="bold">蓝：15 个高分块 ＋ 橙：1 个强制局部块 = 2,048 词</text>
    </g>

    <rect x="16" y="180" width="236" height="60" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="134" y="201" text-anchor="middle" fill="#0369a1" font-size="12.5" font-weight="bold">4 个索引 Q 头 ＋ 1 个共享索引 K 头</text>
    <text x="134" y="222" text-anchor="middle" fill="#475569" font-size="11.5">砍掉索引 V 头 · 拆掉 M3 前 3 层稠密兜底</text>

    <rect x="16" y="250" width="236" height="56" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
    <text x="134" y="272" text-anchor="middle" fill="#047857" font-size="12.5" font-weight="bold">主 KV 读取降 99.8% · 总读取降 87.3%</text>
    <text x="134" y="292" text-anchor="middle" fill="#475569" font-size="10.5">每步扫 7.5 GiB 索引 K ＋ 读 120 MiB 主 KV</text>
  </g>

  <!-- ================= CENTER: DSpark 5-Layer Tap & Markov Chain ================= -->
  <g transform="translate(314, 110)">
    <rect x="0" y="0" width="272" height="320" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="0" width="272" height="36" rx="8" fill="#dcfce7"/>
    <text x="136" y="24" text-anchor="middle" fill="#166534" font-size="15" font-weight="bold">② DeepSeek 同款 DSpark 草稿头</text>

    <!-- 5 Taps Funnel Visual -->
    <g transform="translate(18, 48)">
      <rect x="0" y="0" width="74" height="72" rx="5" fill="#fefce8" stroke="#eab308" stroke-width="1.2"/>
      <text x="37" y="16" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="bold">主干 5 层抽头</text>
      <text x="37" y="33" text-anchor="middle" fill="#713f12" font-size="9.5">L03 · L17 · L31</text>
      <text x="37" y="48" text-anchor="middle" fill="#713f12" font-size="9.5">L45 · L59</text>
      <text x="37" y="64" text-anchor="middle" fill="#b45309" font-size="9.5" font-weight="bold">[30,720 维]</text>

      <polygon points="74,10 124,24 124,48 74,62" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
      <text x="99" y="40" text-anchor="middle" fill="#166534" font-size="9.5" font-weight="bold">fc 降维</text>

      <rect x="124" y="12" width="112" height="48" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <text x="180" y="33" text-anchor="middle" fill="#166534" font-size="11.5" font-weight="bold">5 层滑窗并行层</text>
      <text x="180" y="50" text-anchor="middle" fill="#15803d" font-size="10">一次并行猜 7 格</text>
    </g>

    <!-- 7 Token Chain with Markov Arcs -->
    <g transform="translate(18, 134)">
      <rect x="0" y="0" width="236" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="118" y="19" text-anchor="middle" fill="#1e293b" font-size="11.5" font-weight="bold">秩 256 马尔可夫头 (W1·W2) 串联修正</text>
      <rect x="10" y="28" width="26" height="26" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="41" y="28" width="26" height="26" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="72" y="28" width="26" height="26" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="103" y="28" width="26" height="26" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="134" y="28" width="26" height="26" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="165" y="28" width="26" height="26" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
      <rect x="196" y="28" width="26" height="26" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2"/>
      <text x="23" y="45" text-anchor="middle" fill="#14532d" font-size="10" font-weight="bold">t1</text>
      <text x="54" y="45" text-anchor="middle" fill="#14532d" font-size="10" font-weight="bold">t2</text>
      <text x="85" y="45" text-anchor="middle" fill="#14532d" font-size="10" font-weight="bold">t3</text>
      <text x="116" y="45" text-anchor="middle" fill="#14532d" font-size="10" font-weight="bold">t4</text>
      <text x="147" y="45" text-anchor="middle" fill="#14532d" font-size="10" font-weight="bold">t5</text>
      <text x="178" y="45" text-anchor="middle" fill="#713f12" font-size="10" font-weight="bold">t6</text>
      <text x="209" y="45" text-anchor="middle" fill="#b91c1c" font-size="10" font-weight="bold">×</text>
      <text x="118" y="73" text-anchor="middle" fill="#b45309" font-size="10.5" font-weight="bold">取代 M3 的 7 模块串行 MTP · 仅 1.96B</text>
    </g>

    <!-- 6400-dim Confidence Gate -->
    <rect x="18" y="230" width="236" height="76" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="136" y="252" text-anchor="middle" fill="#166534" font-size="12.5" font-weight="bold">6400 维拼接置信度头动态止损</text>
    <text x="136" y="273" text-anchor="middle" fill="#334155" font-size="11">拼接 [6144 主干态 + 256 马尔可夫向量]</text>
    <text x="136" y="293" text-anchor="middle" fill="#15803d" font-size="11" font-weight="bold">低把握后缀提前截断，不浪费主干验证算力</text>
  </g>

  <!-- ================= RIGHT: 250GB Native QAT & Benchmark Punch ================= -->
  <g transform="translate(604, 110)">
    <rect x="0" y="0" width="268" height="320" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <rect x="0" y="0" width="268" height="36" rx="8" fill="#ffedd5"/>
    <text x="134" y="24" text-anchor="middle" fill="#9a3412" font-size="15" font-weight="bold">③ 250GB 混搭量化 ＆ 越级战绩</text>

    <!-- 250GB Bar -->
    <rect x="16" y="48" width="236" height="82" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="134" y="68" text-anchor="middle" fill="#9a3412" font-size="12.5" font-weight="bold">427.05B 原生 QAT 仅占 250.10 GB</text>
    <rect x="28" y="78" width="152" height="18" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="104" y="91" text-anchor="middle" fill="#4c1d95" font-size="9.5" font-weight="bold">96.7% 路由专家 NVFP4</text>
    <rect x="182" y="78" width="58" height="18" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="211" y="91" text-anchor="middle" fill="#1e3a8a" font-size="9.5" font-weight="bold">MXFP8</text>
    <text x="134" y="116" text-anchor="middle" fill="#475569" font-size="10.8">配 GemmaNorm ＋ OpenAI 限幅 swigluoai</text>

    <!-- Vs 2.8T Kimi K3 -->
    <rect x="16" y="142" width="236" height="86" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="134" y="163" text-anchor="middle" fill="#9a3412" font-size="12.5" font-weight="bold">1/6 总参反超 2.8T Kimi K3：</text>
    <text x="134" y="185" text-anchor="middle" fill="#c2410c" font-size="14" font-weight="bold">DeepSWE 73.7% vs 67.5%</text>
    <text x="134" y="204" text-anchor="middle" fill="#334155" font-size="11.2">LOCA-256K 60.3 (第1) · AutoBench 62.8 (第1)</text>
    <text x="134" y="220" text-anchor="middle" fill="#64748b" font-size="10.5">CyberGym 网安 82.2（首日全量开放权重）</text>

    <!-- Day 1 Open vs Futures -->
    <rect x="16" y="240" width="236" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="134" y="262" text-anchor="middle" fill="#991b1b" font-size="12.5" font-weight="bold">主干与草稿头权重全套落盘</text>
    <text x="134" y="282" text-anchor="middle" fill="#475569" font-size="11">K3.1 Pro 等 11.4 前放权重且预删网安数据</text>
    <text x="134" y="298" text-anchor="middle" fill="#b91c1c" font-size="11" font-weight="bold">M3.1-Flash 已公开 48 主分片 + DSpark</text>
  </g>

  <!-- Bottom Golden Quote Bar -->
  <rect x="28" y="446" width="844" height="38" rx="8" fill="#1e293b"/>
  <text x="450" y="470" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold">「当稀疏挑块、混合量化与半自回归草稿都成了全行业的公版标准件，把全套权重摆上桌面就是最大的实在」</text>
</svg>

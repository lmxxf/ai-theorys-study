<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Noto Sans CJK SC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">KIMI K3 技术报告精读 · 对照 DEEPSEEK V4 与 GLM-5.2</text>

  <!-- ============ LEFT: 三个门 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">1991 → 2026 · 还是那三个门</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="21" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">遗忘门 α</text>
      <text x="100" y="40" text-anchor="middle" fill="#a7f3d0" font-size="10">逐通道打折 · 85 万个旋钮</text>
    </g>
    <g transform="translate(15 90)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="21" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">写入门 β</text>
      <text x="100" y="40" text-anchor="middle" fill="#fbbf24" font-size="10">delta 规则 · 先擦后写</text>
    </g>
    <g transform="translate(15 150)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#1a0a2a" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="100" y="21" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">输出门</text>
      <text x="100" y="40" text-anchor="middle" fill="#a78bfa" font-size="10">低秩 → 全秩 · 该说才放行</text>
    </g>

    <line x1="16" y1="220" x2="214" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="115" y="244" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">LSTM 的三件套，35 年没变</text>
    <text x="115" y="264" text-anchor="middle" fill="#cbd5e1" font-size="10">线性注意力扛起 93 层里的 69 层</text>
    <text x="115" y="282" text-anchor="middle" fill="#94a3b8" font-size="10">全局层裸奔：NoPE 直接外推 1M</text>
  </g>

  <!-- ============ MIDDLE: 沙漏对直筒 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">同样是窄 · 位置不同</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- 沙漏 (V4) -->
    <g transform="translate(28 40)">
      <text x="40" y="0" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">V4 沙漏</text>
      <polygon points="5,12 75,12 52,60 75,108 5,108 28,60"
               fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="40" y="34" text-anchor="middle" fill="#fca5a5" font-size="9">7168</text>
      <text x="40" y="63" text-anchor="middle" fill="#f87171" font-size="9">3072</text>
      <text x="40" y="96" text-anchor="middle" fill="#fca5a5" font-size="9">7168</text>
      <text x="40" y="128" text-anchor="middle" fill="#f87171" font-size="9">窄在肚子里</text>
      <text x="40" y="144" text-anchor="middle" fill="#94a3b8" font-size="9">路上搬 7168</text>
    </g>

    <!-- 直筒 (K3) -->
    <g transform="translate(132 40)">
      <text x="40" y="0" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">K3 直筒</text>
      <polygon points="5,12 75,12 58,26 58,94 75,108 5,108 22,94 22,26"
               fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="40" y="34" text-anchor="middle" fill="#a7f3d0" font-size="9">3584</text>
      <text x="40" y="63" text-anchor="middle" fill="#5eead4" font-size="9">3072</text>
      <text x="40" y="96" text-anchor="middle" fill="#a7f3d0" font-size="9">3584</text>
      <text x="40" y="128" text-anchor="middle" fill="#5eead4" font-size="9">窄在门口</text>
      <text x="40" y="144" text-anchor="middle" fill="#94a3b8" font-size="9">通信直接砍半</text>
    </g>

    <line x1="20" y1="220" x2="220" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="120" y="244" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">896 个专家选 16 · 稀疏度 1/56</text>
    <text x="120" y="264" text-anchor="middle" fill="#cbd5e1" font-size="10">负载均衡不试错：一步跳到分位数</text>
    <text x="120" y="282" text-anchor="middle" fill="#94a3b8" font-size="10">软帽 SiTU-GLU：帽高还是 100</text>
  </g>

  <!-- ============ RIGHT: 四旋钮经济学 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">整份报告 · 一本经济账</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <rect x="0" y="0" width="200" height="46" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="19" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">容量买大：2.8T 参数</text>
      <text x="100" y="36" text-anchor="middle" fill="#bfdbfe" font-size="9">激活参数 104.2B 首次披露</text>
    </g>
    <g transform="translate(15 84)">
      <rect x="0" y="0" width="200" height="46" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="19" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">算力买小：1/27 激活</text>
      <text x="100" y="36" text-anchor="middle" fill="#a7f3d0" font-size="9">每 token 只走活跃路径</text>
    </g>
    <g transform="translate(15 138)">
      <rect x="0" y="0" width="200" height="46" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="19" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">KV 买小：只剩 24 层</text>
      <text x="100" y="36" text-anchor="middle" fill="#fbbf24" font-size="9">69 层 KDA 固定状态不随长度涨</text>
    </g>
    <g transform="translate(15 192)">
      <rect x="0" y="0" width="200" height="46" rx="6" fill="#1a0a2a" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="100" y="19" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">字节买小：4 比特房租</text>
      <text x="100" y="36" text-anchor="middle" fill="#a78bfa" font-size="9">专家 MXFP4 · QAT 贯穿后训练</text>
    </g>

    <text x="115" y="264" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">贵的主要是算，不是存</text>
    <text x="115" y="282" text-anchor="middle" fill="#94a3b8" font-size="10">BrowseComp 每任务 $2.03 · 约 Sol 一半</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">Kimi K3：47 页技术报告精读</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">为极端稀疏和低精度，重新设计每一个零件</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.264 · 2.8T 的容量 · 104B 的活跃路径 · 4 比特的房租</text>
</svg>

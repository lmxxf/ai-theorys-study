<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">周末杂谈 · 2026-09-11 · 25 位菲尔兹奖得主联署声明</text>

  <!-- ============ LEFT: 题库是谁立的 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">「解题当基准」是谁先立的</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">1900 · 希尔伯特 23 问</text>
      <text x="100" y="38" text-anchor="middle" fill="#bfdbfe" font-size="10">给整个二十世纪出的题</text>
    </g>

    <g transform="translate(15 90)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">2000 · 克雷七大难题</text>
      <text x="100" y="38" text-anchor="middle" fill="#bfdbfe" font-size="10">一道一百万美元，明码标价</text>
    </g>

    <g transform="translate(15 150)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">1936 起 · 菲尔兹奖</text>
      <text x="100" y="38" text-anchor="middle" fill="#fbbf24" font-size="10">按「破了哪道难题」发</text>
    </g>

    <g transform="translate(15 210)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">2026-03 · 陶哲轩蒸馏挑战赛</text>
      <text x="100" y="38" text-anchor="middle" fill="#a7f3d0" font-size="10">1200 道题，让 AI 刷，他判分</text>
    </g>

    <text x="115" y="284" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">没有一份题库是 AI 公司出的</text>
  </g>

  <!-- ============ MIDDLE: 终点线挪了四次 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">同一个人 · 半年 · 终点线挪了四次</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- vertical timeline -->
    <line x1="34" y1="36" x2="34" y2="236" stroke="#475569" stroke-width="2"/>

    <g transform="translate(0 40)">
      <circle cx="34" cy="0" r="6" fill="#4a90d9"/>
      <text x="50" y="-2" fill="#93c5fd" font-size="11" font-weight="bold">3 月 13 日</text>
      <text x="50" y="14" fill="#cbd5e1" font-size="10">出题让 AI 解，看谁解得多</text>
    </g>

    <g transform="translate(0 96)">
      <circle cx="34" cy="0" r="6" fill="#f59e0b"/>
      <text x="50" y="-2" fill="#fde68a" font-size="11" font-weight="bold">4 月 27 日</text>
      <text x="50" y="14" fill="#cbd5e1" font-size="10">「荣誉要转给验证和消化的人」</text>
    </g>

    <g transform="translate(0 152)">
      <circle cx="34" cy="0" r="6" fill="#2dd4bf"/>
      <text x="50" y="-2" fill="#5eead4" font-size="11" font-weight="bold">8 月 17 日</text>
      <text x="50" y="14" fill="#cbd5e1" font-size="10">解题变成五阶段里的第一步</text>
    </g>

    <g transform="translate(0 208)">
      <circle cx="34" cy="0" r="6" fill="#ef4444"/>
      <text x="50" y="-2" fill="#fca5a5" font-size="11" font-weight="bold">9 月 11 日</text>
      <text x="50" y="14" fill="#cbd5e1" font-size="10">签字：「解题只是理解的代理」</text>
    </g>

    <line x1="20" y1="250" x2="220" y2="250" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="120" y="272" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">赛道没变，是终点线一直在挪</text>
    <text x="120" y="288" text-anchor="middle" fill="#94a3b8" font-size="10">每次都挪到 AI 还没跑到的那一格</text>
  </g>

  <!-- ============ RIGHT: 两把尺子 + 一条真问题 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">原则还是武器：看它一贯不一贯</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <rect x="0" y="0" width="200" height="66" rx="6" fill="#0a1a2a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">尺子一：解题算不算目标</text>
      <text x="100" y="40" text-anchor="middle" fill="#a7f3d0" font-size="10">人类刷叫封神</text>
      <text x="100" y="56" text-anchor="middle" fill="#a7f3d0" font-size="10">AI 刷叫污染</text>
    </g>

    <g transform="translate(15 106)">
      <rect x="0" y="0" width="200" height="66" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">尺子二：看不懂算谁的责任</text>
      <text x="100" y="40" text-anchor="middle" fill="#fbbf24" font-size="10">看不懂数学家 → 读者没学够</text>
      <text x="100" y="56" text-anchor="middle" fill="#fbbf24" font-size="10">看不懂 AI → 写的人没写好</text>
    </g>

    <g transform="translate(15 182)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">站得住的那半句：署名</text>
      <text x="100" y="38" text-anchor="middle" fill="#bfdbfe" font-size="10">用了别人的东西，你得说</text>
    </g>

    <text x="115" y="262" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">只在挨打时才想起的原则</text>
    <text x="115" y="280" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">不是原则，是武器</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">25 位菲尔兹奖得主联名开火</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">可「解题只是理解的代理」这条原则，他们一百多年没提过</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.314 · 周末杂谈 · 陶哲轩三部曲第三幕</text>
</svg>

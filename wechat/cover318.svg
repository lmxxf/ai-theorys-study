<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">DLSS5 · RX 9070 XT · 算力缺口的三层账本</text>

  <!-- ============ LEFT: 第一层 整网哪一段贵 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第一层 · 整网哪一段贵</text>
    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="115" y="36" text-anchor="middle" fill="#fde047" font-size="12" font-weight="bold">1080P 一帧的时间分给谁</text>

    <g transform="translate(16 52)">
      <text x="0" y="10" fill="#fdba74" font-size="11" font-weight="bold">C32</text>
      <rect x="44" y="1" width="130" height="12" rx="2" fill="#f59e0b"/>
      <text x="180" y="11" fill="#fbbf24" font-size="10" font-weight="bold">35%</text>

      <text x="0" y="34" fill="#cbd5e1" font-size="10">ViT</text>
      <rect x="44" y="25" width="52" height="12" rx="2" fill="#4a90d9"/>
      <text x="102" y="35" fill="#93c5fd" font-size="10">14%</text>

      <text x="0" y="58" fill="#cbd5e1" font-size="10">C64</text>
      <rect x="44" y="49" width="48" height="12" rx="2" fill="#4a90d9"/>
      <text x="98" y="59" fill="#93c5fd" font-size="10">13%</text>

      <text x="0" y="82" fill="#cbd5e1" font-size="10">C128</text>
      <rect x="44" y="73" width="45" height="12" rx="2" fill="#4a90d9"/>
      <text x="95" y="83" fill="#93c5fd" font-size="10">12%</text>

      <text x="0" y="106" fill="#cbd5e1" font-size="10">C256</text>
      <rect x="44" y="97" width="45" height="12" rx="2" fill="#4a90d9"/>
      <text x="95" y="107" fill="#93c5fd" font-size="10">12%</text>

      <text x="0" y="130" fill="#cbd5e1" font-size="10">C512</text>
      <rect x="44" y="121" width="45" height="12" rx="2" fill="#4a90d9"/>
      <text x="95" y="131" fill="#93c5fd" font-size="10">12%</text>
    </g>

    <line x1="20" y1="202" x2="210" y2="202" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 222)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">通道最少的反而最贵</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">最外层，一次三万五个 8×8 窗口</text>
      <text x="0" y="40" fill="#94a3b8" font-size="10">只数调用次数会把重点找偏</text>
    </g>
  </g>

  <!-- ============ MIDDLE: 第二层 一个 wave 的一生 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第二层 · C32 里一个 wave 的一生</text>
    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="120" y="36" text-anchor="middle" fill="#fde047" font-size="12" font-weight="bold">核里打点，时间都去哪儿了</text>

    <g transform="translate(16 52)">
      <text x="0" y="10" fill="#fdba74" font-size="10" font-weight="bold">搬输入</text>
      <rect x="62" y="1" width="120" height="12" rx="2" fill="#f59e0b"/>
      <text x="188" y="11" fill="#fbbf24" font-size="10" font-weight="bold">31%</text>

      <text x="0" y="34" fill="#cbd5e1" font-size="10">前馈</text>
      <rect x="62" y="25" width="102" height="12" rx="2" fill="#2dd4bf"/>
      <text x="170" y="35" fill="#5eead4" font-size="10">26%</text>

      <text x="0" y="58" fill="#cbd5e1" font-size="10">注意力</text>
      <rect x="62" y="49" width="46" height="12" rx="2" fill="#2dd4bf"/>
      <text x="114" y="59" fill="#5eead4" font-size="10">12%</text>

      <text x="0" y="82" fill="#cbd5e1" font-size="10">QKV</text>
      <rect x="62" y="73" width="42" height="12" rx="2" fill="#2dd4bf"/>
      <text x="110" y="83" fill="#5eead4" font-size="10">11%</text>

      <text x="0" y="106" fill="#cbd5e1" font-size="10">尾部</text>
      <rect x="62" y="97" width="34" height="12" rx="2" fill="#2dd4bf"/>
      <text x="102" y="107" fill="#5eead4" font-size="10">9%</text>

      <text x="0" y="130" fill="#cbd5e1" font-size="10">等同伴</text>
      <rect x="62" y="121" width="34" height="12" rx="2" fill="#94a3b8"/>
      <text x="102" y="131" fill="#cbd5e1" font-size="10">9%</text>
    </g>

    <line x1="20" y1="202" x2="220" y2="202" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 222)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">矩阵指令只占约 15%</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">八成以上的时间在搬数据、</text>
      <text x="0" y="38" fill="#cbd5e1" font-size="10">等同伴、等队列</text>
    </g>
  </g>

  <!-- ============ RIGHT: 喂不饱 + 拿回来的 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">卡能跑满，是喂不饱</text>
    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 26)">
      <rect x="0" y="0" width="200" height="64" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#93c5fd" font-size="11">数据留在寄存器里算</text>
      <text x="100" y="42" text-anchor="middle" fill="#bfdbfe" font-size="16" font-weight="bold">405 TFLOPS</text>
      <text x="100" y="58" text-anchor="middle" fill="#93c5fd" font-size="9">FP8 矩阵，接近标称</text>
    </g>

    <g transform="translate(15 100)">
      <rect x="0" y="0" width="200" height="64" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fde68a" font-size="11">真实的 ViT 大矩阵核</text>
      <text x="100" y="42" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">约 150</text>
      <text x="100" y="58" text-anchor="middle" fill="#fde68a" font-size="9">L2 几乎全命中，卡在送上来的路上</text>
    </g>

    <g transform="translate(15 176)">
      <rect x="0" y="0" width="200" height="104" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">能拿回来的：−7%</text>
      <text x="100" y="40" text-anchor="middle" fill="#a7f3d0" font-size="10">少清缓存</text>
      <text x="100" y="56" text-anchor="middle" fill="#a7f3d0" font-size="10">少在共享内存里绕道</text>
      <text x="100" y="72" text-anchor="middle" fill="#a7f3d0" font-size="10">少跑几趟，一趟多搬点</text>
      <text x="100" y="94" text-anchor="middle" fill="#5eead4" font-size="10" font-weight="bold">六处改动，输出逐位不变</text>
    </g>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">9070 XT 的算力到底花在哪儿了</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">必要损失七到八成，能拿回来的都拿了——7%，一位不变</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.318 · 整网分段 · wave 的一生 · launch 驻留 · 900P 一帧约 12 毫秒</text>
</svg>

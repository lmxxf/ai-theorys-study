<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">周末杂谈 · 1997 深蓝 → 2026 · 人类脑力竞赛的最长样本</text>

  <!-- ============ LEFT: 硬件缩小 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">赢你的机器越来越小</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- shrinking boxes -->
    <g transform="translate(15 30)">
      <rect x="10" y="0" width="70" height="88" rx="4" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <rect x="26" y="10" width="38" height="6" rx="2" fill="#334155"/>
      <rect x="26" y="22" width="38" height="6" rx="2" fill="#334155"/>
      <rect x="26" y="34" width="38" height="6" rx="2" fill="#334155"/>
      <rect x="26" y="46" width="38" height="6" rx="2" fill="#334155"/>
      <text x="45" y="78" text-anchor="middle" fill="#93c5fd" font-size="10">1997 两机柜</text>

      <rect x="100" y="34" width="52" height="54" rx="4" fill="#1a2a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="126" y="66" text-anchor="middle" fill="#5eead4" font-size="10">2006</text>
      <text x="126" y="80" text-anchor="middle" fill="#5eead4" font-size="9">台式机</text>

      <rect x="164" y="54" width="22" height="34" rx="4" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="175" y="100" text-anchor="middle" fill="#fde68a" font-size="10">2009 手机</text>
    </g>

    <g transform="translate(15 152)">
      <text x="100" y="0" fill="#cbd5e1" font-size="10" text-anchor="middle">手机 2898 分夺冠</text>
      <text x="100" y="16" fill="#cbd5e1" font-size="10" text-anchor="middle">搜索速度只有深蓝的万分之一</text>
    </g>

    <line x1="16" y1="182" x2="214" y2="182" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(15 200)">
      <text x="100" y="0" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">软件进步比想象中更重</text>
      <text x="100" y="20" text-anchor="middle" fill="#94a3b8" font-size="10">Stockfish 8 放回 1994 家用机</text>
      <text x="100" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">粗测已摸到卡斯帕罗夫级</text>
      <text x="100" y="60" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">围棋同款：48 TPU → 4 TPU</text>
      <text x="100" y="76" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">→ 消费级硬件</text>
    </g>
  </g>

  <!-- ============ MIDDLE: 三幕剧 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">人类的反应：三幕剧</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(20 34)">
      <text x="0" y="0" fill="#fca5a5" font-size="12" font-weight="bold">一、否认</text>
      <text x="0" y="18" fill="#cbd5e1" font-size="10">"深蓝背后藏着人类大师"</text>
      <text x="0" y="34" fill="#94a3b8" font-size="10">指控到道歉，花了二十年</text>
    </g>

    <line x1="20" y1="108" x2="220" y2="108" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 128)">
      <text x="0" y="0" fill="#93c5fd" font-size="12" font-weight="bold">二、防守</text>
      <text x="0" y="18" fill="#cbd5e1" font-size="10">安检门 · 转播延迟 15 分钟</text>
      <text x="0" y="34" fill="#e2e8f0" font-size="10" font-weight="bold">比赛证明的从"我会下棋"</text>
      <text x="0" y="50" fill="#e2e8f0" font-size="10" font-weight="bold">变成了"我没联网"</text>
    </g>

    <line x1="20" y1="204" x2="220" y2="204" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 224)">
      <text x="0" y="0" fill="#5eead4" font-size="12" font-weight="bold">三、改行——然后繁荣</text>
      <text x="0" y="18" fill="#cbd5e1" font-size="10">chess.com 两亿注册账户</text>
      <text x="0" y="34" fill="#cbd5e1" font-size="10">12 岁大师 · 18 岁世界冠军</text>
      <text x="0" y="52" fill="#a7f3d0" font-size="10" font-weight="bold">被超越不是死刑，是改行</text>
    </g>
  </g>

  <!-- ============ RIGHT: 半人马 + 镜子 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">两个附注</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 32)">
      <rect x="0" y="0" width="200" height="76" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">半人马窗口在收窄</text>
      <text x="100" y="38" text-anchor="middle" fill="#fbbf24" font-size="10">人类附加值很小</text>
      <text x="100" y="54" text-anchor="middle" fill="#fbbf24" font-size="10">而且很快饱和</text>
      <text x="100" y="70" text-anchor="middle" fill="#94a3b8" font-size="9">没有统一的「死亡年份」</text>
    </g>

    <g transform="translate(15 124)">
      <rect x="0" y="0" width="200" height="76" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">镜子照向数学界</text>
      <text x="100" y="38" text-anchor="middle" fill="#f87171" font-size="10">「只是统计」取消不了</text>
      <text x="100" y="54" text-anchor="middle" fill="#f87171" font-size="10">已经验证的定理</text>
      <text x="100" y="70" text-anchor="middle" fill="#94a3b8" font-size="9">1997 年的台词又响了</text>
    </g>

    <g transform="translate(15 218)">
      <text x="100" y="0" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">彩蛋：人类赢回过一次</text>
      <text x="100" y="20" text-anchor="middle" fill="#94a3b8" font-size="10">徒手 15 局赢 14 局</text>
      <text x="100" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">靠的不是棋艺，是找 bug</text>
      <text x="100" y="56" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="bold">别跟它比算，去摸它的墙</text>
    </g>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">从两个机柜到一部手机——AI 象棋界三十年观察</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">围棋只有十年售后，象棋已经留下近三十年的完整观察</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.288 · 深蓝 / Stockfish / AlphaGo / KataGo · 给正在被证明定理的数学界</text>
</svg>

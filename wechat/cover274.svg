<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Noto Sans CJK SC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">周末杂谈 · AI AGENT vs CUDA 护城河</text>

  <!-- ============ LEFT: 三个数字三层皮 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">新闻的三个数字 · 三层皮</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="bold">「10 小时」= 矩阵乘法</text>
      <text x="100" y="44" text-anchor="middle" fill="#fbbf24" font-size="10">GEMM 跑到峰值 92%</text>
      <text x="100" y="60" text-anchor="middle" fill="#fbbf24" font-size="10">打好地基 ≠ 盖完楼</text>
    </g>

    <g transform="translate(15 112)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">「10 天」= 端到端</text>
      <text x="100" y="44" text-anchor="middle" fill="#bfdbfe" font-size="10">三个模型在新芯片跑通</text>
      <text x="100" y="60" text-anchor="middle" fill="#bfdbfe" font-size="10">真正惊人的反而是这个</text>
    </g>

    <g transform="translate(15 194)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="bold">「14 倍」= 跟自己比</text>
      <text x="100" y="44" text-anchor="middle" fill="#f87171" font-size="10">起点是没优化的第一版</text>
      <text x="100" y="60" text-anchor="middle" fill="#f87171" font-size="10">对 vLLM 基线：+34%</text>
    </g>

    <text x="115" y="288" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">媒体专挑最好听的当标题</text>
  </g>

  <!-- ============ MIDDLE: 验证才是瓶颈 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">泼冷水的论文 · 验证才是瓶颈</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- bar comparison -->
    <g transform="translate(30 46)">
      <text x="0" y="0" fill="#cbd5e1" font-size="11">AI 写 kernel vs PyTorch</text>

      <text x="0" y="30" fill="#fde68a" font-size="10">宽松协议</text>
      <rect x="78" y="18" width="100" height="18" rx="3" fill="#f59e0b" opacity="0.85"/>
      <text x="184" y="32" fill="#fde68a" font-size="11" font-weight="bold">1.43x</text>

      <text x="0" y="64" fill="#94a3b8" font-size="10">堵住空子后</text>
      <rect x="78" y="52" width="62" height="18" rx="3" fill="#64748b"/>
      <text x="146" y="66" fill="#cbd5e1" font-size="11" font-weight="bold">0.88x</text>

      <line x1="140" y1="14" x2="140" y2="76" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="146" y="82" fill="#f87171" font-size="9">1.0 = 打平</text>
    </g>

    <line x1="20" y1="160" x2="220" y2="160" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 180)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">蒸发的部分去哪儿了</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">基线残血：对照组没开 Tensor Core</text>
      <text x="0" y="38" fill="#cbd5e1" font-size="10">奖励作弊：对测试数据硬编码旁路</text>
      <text x="0" y="58" fill="#94a3b8" font-size="10">最响的数字，出自 AI 最擅长的</text>
      <text x="0" y="74" fill="#94a3b8" font-size="10">那间房；难的部分没被展示</text>
    </g>
  </g>

  <!-- ============ RIGHT: 方向没错 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">但方向不算错 · 三路同时发生</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <rect x="0" y="0" width="200" height="66" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">AMD 官方下场</text>
      <text x="100" y="40" text-anchor="middle" fill="#a7f3d0" font-size="10">agent 进量产软件栈</text>
      <text x="100" y="56" text-anchor="middle" fill="#a7f3d0" font-size="10">端到端 +42% 到 +96%</text>
    </g>

    <g transform="translate(15 106)">
      <rect x="0" y="0" width="200" height="66" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">社区免费在干</text>
      <text x="100" y="40" text-anchor="middle" fill="#bfdbfe" font-size="10">DGX Spark 上的 V4</text>
      <text x="100" y="56" text-anchor="middle" fill="#bfdbfe" font-size="10">个位数 → 80 token/s</text>
    </g>

    <g transform="translate(15 182)">
      <rect x="0" y="0" width="200" height="66" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">上一代的对照组</text>
      <text x="100" y="40" text-anchor="middle" fill="#fbbf24" font-size="10">编译器干了七年</text>
      <text x="100" y="56" text-anchor="middle" fill="#fbbf24" font-size="10">个人项目三起三落十年</text>
    </g>

    <text x="115" y="272" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">以「年」计的故事，变成以「天」计</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">「AI 10 小时重建 CUDA」？剥开是三层皮</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">新闻不全真，但是 CUDA 的护城河真的在消失</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.274 · 周末杂谈 · 靳岩岩的 AI 学习笔记</text>
</svg>

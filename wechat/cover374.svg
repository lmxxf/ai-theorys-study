<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="bg374" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17110b" />
      <stop offset="0.55" stop-color="#22170e" />
      <stop offset="1" stop-color="#0f0b07" />
    </linearGradient>
    <linearGradient id="memorialYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5c451" />
      <stop offset="1" stop-color="#d99b26" />
    </linearGradient>
    <linearGradient id="prismFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.14" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg374)" />

  <!-- 顶部徽章 -->
  <rect x="42" y="26" width="268" height="28" rx="14" fill="#3b1d06" stroke="#f59e0b" stroke-width="1.2" />
  <text x="176" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#fcd34d">No.374 · Mech Interp 历史语言学</text>
  <text x="326" y="45" font-size="13" fill="#d6d3d1">《出师表》千字文言调零 · 百二十回《红楼梦》零泄露验光</text>

  <!-- 主标题 -->
  <text x="42" y="90" font-size="29" font-weight="bold" fill="#fef3c7">照透清代奏折与《红楼梦》里的「奴才」</text>

  <!-- 左侧视觉主体：故宫 022688 明黄请安折意象 (x=42..252, y=122..412) -->
  <rect x="42" y="122" width="210" height="290" rx="10" fill="url(#memorialYellow)" stroke="#fef08a" stroke-width="1.5" />
  <rect x="52" y="132" width="190" height="270" rx="6" fill="none" stroke="#78350f" stroke-width="1.4" stroke-dasharray="4 2" />
  <text x="147" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#451a03">故宫 022688 原折现场</text>

  <!-- 竖排墨迹模拟 -->
  <text x="196" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1917">湖</text>
  <text x="196" y="208" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1917">廣</text>
  <text x="196" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1917">總</text>
  <text x="196" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1917">督</text>
  <text x="196" y="278" text-anchor="middle" font-size="17" font-weight="bold" fill="#44403c">奴</text>
  <text x="196" y="300" text-anchor="middle" font-size="17" font-weight="bold" fill="#44403c">才</text>
  <text x="196" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1917">楊</text>
  <text x="196" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1917">宗</text>
  <text x="196" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c1917">仁</text>

  <!-- 雍正鲜红朱笔杠叉与「臣」「稱臣得體」 -->
  <line x1="183" y1="265" x2="209" y2="306" stroke="#dc2626" stroke-width="3.2" />
  <line x1="208" y1="266" x2="184" y2="305" stroke="#dc2626" stroke-width="2.6" />
  <text x="164" y="290" text-anchor="middle" font-size="20" font-weight="bold" fill="#dc2626">臣</text>

  <rect x="74" y="246" width="66" height="122" rx="6" fill="#fef3c7" fill-opacity="0.55" stroke="#dc2626" stroke-width="1.2" />
  <text x="107" y="272" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#b91c1c">稱</text>
  <text x="107" y="296" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#b91c1c">臣</text>
  <text x="107" y="320" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#b91c1c">得</text>
  <text x="107" y="344" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#b91c1c">體</text>
  <text x="107" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">辽阳陈汉军</text>
  <text x="107" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">正白旗总督</text>

  <!-- 入射光束 → 中央 5,120 维 ICA×J-Lens 时光机三棱镜 -->
  <line x1="252" y1="274" x2="322" y2="274" stroke="#fde047" stroke-width="4" />

  <polygon points="366,144 290,374 442,374" fill="url(#prismFill)" stroke="#7dd3fc" stroke-width="2.2" />
  <text x="366" y="286" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#e0f2fe">5,120 维</text>
  <text x="366" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#7dd3fc">ICA-Lens v3</text>
  <text x="366" y="328" text-anchor="middle" font-size="10.8" fill="#bae6fd">《出师表》千字文言</text>
  <text x="366" y="346" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#4ade80">L30 调零 -0.43%</text>

  <!-- 三道折射正交光谱 → 右侧三组硬核实测 -->
  <line x1="398" y1="242" x2="472" y2="168" stroke="#4ade80" stroke-width="3" />
  <line x1="406" y1="274" x2="472" y2="274" stroke="#60a5fa" stroke-width="3" />
  <line x1="414" y1="306" x2="472" y2="372" stroke="#fbbf24" stroke-width="3" />

  <!-- 光谱 1：包衣回话 = 代词「我」 -->
  <rect x="472" y="122" width="386" height="84" rx="10" fill="#0f291e" stroke="#22c55e" stroke-width="1.5" />
  <text x="490" y="148" font-size="14.5" font-weight="bold" fill="#86efac">内务府包衣日常回话：无痛代词「我」</text>
  <text x="490" y="170" font-size="12" fill="#ecfdf5">L30 C846 贬损轴夹在「小的 (+1.65)」与「下官 (+2.28)」间</text>
  <text x="490" y="190" font-size="12" font-weight="bold" fill="#4ade80">L29–L48 连续 20 层第 1/5,120 名：myself / my / 我 (+17.59)</text>

  <!-- 光谱 2：外朝公器暴跌 -->
  <rect x="472" y="224" width="386" height="84" rx="10" fill="#111f38" stroke="#3b82f6" stroke-width="1.5" />
  <text x="490" y="250" font-size="14.5" font-weight="bold" fill="#93c5fd">奏折弃「臣」称「奴才」：退出外朝公器</text>
  <text x="490" y="272" font-size="12" fill="#dbeafe">L18 C1690 字根入口闪过 Slave (+5.78) vs 北宋大臣 (-11.04)</text>
  <text x="490" y="292" font-size="12" font-weight="bold" fill="#60a5fa">L25–L32 大臣/宰相 (-5.70) · Governor 封疆总督 (-4.25) 跳水</text>

  <!-- 光谱 3：辽东八旗旗地 -->
  <rect x="472" y="326" width="386" height="86" rx="10" fill="#2e1b09" stroke="#f59e0b" stroke-width="1.5" />
  <text x="490" y="352" font-size="14.5" font-weight="bold" fill="#fde047">L45 C1194 全层第 1 名 (+7.27)：命中关外旗籍</text>
  <text x="490" y="374" font-size="11.8" fill="#fef3c7">全库第 1 原句：「隶属八旗的『旗地』管辖……辽东柳条边」</text>
  <text x="490" y="394" font-size="11.8" font-weight="bold" fill="#fbbf24">三层内外同心圆 × 雍正去私门化 vs 乾隆二十三年公私反转</text>

  <!-- 底部压轴金句 -->
  <text x="450" y="454" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#fef3c7">「不仅没有国籍——大模型读哪个时代的文献，就在残差流里活成哪个时代的人。」</text>
  <text x="450" y="480" text-anchor="middle" font-size="12" fill="#a8a29e">台北故宫 022688 杨宗仁请安折真迹 · 曹家织造档案 · 百二十回《红楼梦》· Qwen3.8-27B 实测</text>
</svg>

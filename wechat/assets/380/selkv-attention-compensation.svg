<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" width="600" height="390" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif">
  <!-- 实心纯白底 -->
  <rect x="0" y="0" width="600" height="390" fill="#ffffff"/>

  <!-- 顶部主标题 -->
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">为什么 4 个词合成 1 个槽位会变笨？“四票变一票”与对数补偿</text>
  <text x="300" y="50" text-anchor="middle" font-size="11.5" fill="#64748b">SelKV (arXiv:2607.16213) 注意力下陷手算特例：4 个同义词 (k1..k4) 与 1 个无关词 (k5) 点积均为 s = 2.0</text>

  <!-- 状态 1：未合并 -->
  <text x="24" y="84" font-size="12" font-weight="bold" fill="#0369a1">1. 合并前（占 5 列 KV 显存）：4 个核心词在 Softmax 分母里投出 4 张选票</text>
  <text x="36" y="105" font-size="11.2" fill="#334155">• 核心词总权重 = 4·e^2 / (4·e^2 + 1·e^2) = 4 / 5 = 80.0%   |   无关词权重 = 1 / 5 = 20.0%</text>
  <rect x="36" y="114" width="416" height="24" rx="4" fill="#0284c7"/>
  <text x="244" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">4 个核心词合占 80.0% 注意力（4 张选票：4·e^2）</text>
  <rect x="458" y="114" width="106" height="24" rx="4" fill="#94a3b8"/>
  <text x="511" y="130" text-anchor="middle" font-size="11" fill="#ffffff">无关词 20%</text>

  <!-- 状态 2：直接平均合并（无补偿） -->
  <text x="24" y="172" font-size="12" font-weight="bold" fill="#b91c1c">2. 直接平均合并 k_avg = (k1+k2+k3+k4)/4（占 2 列显存，无补偿）：4 票缩水成 1 票</text>
  <text x="36" y="193" font-size="11.2" fill="#334155">• 点积仍为 q·k_avg = 2.0，但只占 1 列 → 权重跌至 1·e^2 / (1·e^2 + 1·e^2) = 50.0%（下陷）</text>
  <rect x="36" y="202" width="261" height="24" rx="4" fill="#ef4444"/>
  <text x="166" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">合并槽位跌至 50.0%（只剩 1 票：1·e^2）</text>
  <rect x="303" y="202" width="261" height="24" rx="4" fill="#64748b"/>
  <text x="433" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">无关词暴涨至 50.0%（喧宾夺主）</text>

  <!-- 状态 3：加上对数票数补偿 + ln(R_i) -->
  <text x="24" y="260" font-size="12" font-weight="bold" fill="#15803d">3. 加上对数票数补偿 s' = q·k_avg + ln(R_i)（仍只占 2 列显存，省掉 75% KV 缓存）</text>
  <text x="36" y="281" font-size="11.2" fill="#334155">• 因指数恒等式 e^(2.0 + ln 4) = 4·e^2，1 个叠加态槽位拿回 4 张选票，权重恢复 80.0%</text>
  <rect x="36" y="290" width="416" height="24" rx="4" fill="#16a34a"/>
  <text x="244" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">1 个叠加态槽位拿回 80.0% 注意力（e^(s + ln 4) = 4·e^2）</text>
  <rect x="458" y="290" width="106" height="24" rx="4" fill="#94a3b8"/>
  <text x="511" y="306" text-anchor="middle" font-size="11" fill="#ffffff">无关词 20%</text>

  <line x1="24" y1="336" x2="576" y2="336" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="358" font-size="10.5" fill="#475569">注：SelKV 按观察窗口累积注意力比 R_i = (a_kept + Σ g_j·a_disc) / a_kept 加 α·ln(R_i) 补偿，软余弦门控 g_j = max(cos, 0)。</text>
  <text x="24" y="376" font-size="10.5" fill="#b91c1c">隐患：保留槽位顶着单字旧门牌号 Key_i，Value_i 却塞入多词混合向量，且分母 a_kept 小时 R_i 实测会爆表至 3337.5。</text>
</svg>

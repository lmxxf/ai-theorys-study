<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="'Noto Sans CJK SC'">
  <rect width="960" height="760" fill="#fafbfc"/>

  <text x="480" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a2433">几字弯世界示意图：地名、族群与道路的相对位置</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#5a6b80">示意图只保证相对位置，不保证比例（上北下南）</text>

  <defs>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2e8b57"/>
    </marker>
  </defs>

  <!-- ===== 蒙古高原带 ===== -->
  <rect x="60" y="80" width="840" height="56" rx="8" fill="#ece9e2"/>
  <text x="480" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a7f6a">蒙古高原（头曼单于被撵到这边；前 209 冒顿在此崛起）</text>
  <text x="480" y="126" text-anchor="middle" font-size="12" fill="#a89d87">匈奴</text>

  <!-- ===== 阴山 ===== -->
  <path d="M 70 156 L 110 144 L 150 158 L 195 142 L 240 157 L 285 143 L 330 158 L 375 144 L 420 157 L 465 143 L 510 158 L 555 144 L 600 157 L 645 143 L 690 158 L 735 144 L 780 157 L 825 145 L 870 156"
        stroke="#7a6a55" stroke-width="4" fill="none"/>
  <text x="140" y="178" font-size="14" font-weight="bold" fill="#7a6a55">阴山山脉（狼山—乌拉山—大青山）＝ 蒙恬的新国界</text>

  <!-- ===== 河套平原带 ===== -->
  <rect x="120" y="190" width="720" height="60" rx="8" fill="#eaf3e4"/>
  <text x="620" y="209" text-anchor="middle" font-size="12" fill="#6a8a5c">河套平原（黄河百害，唯富一套）</text>
  <circle cx="470" cy="228" r="6" fill="#c0504d"/>
  <text x="470" y="247" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a2433">九原（今包头）· 直道终点</text>
  <circle cx="740" cy="224" r="6" fill="#4a7fb5"/>
  <text x="740" y="243" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a2433">云中（今呼和浩特）</text>

  <!-- ===== 黄河几字弯 ===== -->
  <path d="M 250 600 L 250 300 Q 250 262 300 262 L 660 262 Q 700 262 700 300 L 700 560 Q 700 590 740 596"
        stroke="#5b9bd5" stroke-width="7" fill="none" opacity="0.75"/>
  <text x="215" y="440" font-size="14" font-weight="bold" fill="#5b9bd5" transform="rotate(-90 215 440)">黄河（西边）</text>
  <text x="745" y="430" font-size="14" font-weight="bold" fill="#5b9bd5" transform="rotate(90 745 430)">黄河（晋陕峡谷）</text>

  <!-- ===== 鄂尔多斯高原（弯内） ===== -->
  <rect x="290" y="292" width="380" height="180" rx="14" fill="#fdf3e3" stroke="#e0c48c" stroke-width="1.5"/>
  <text x="480" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a7b2f">鄂尔多斯高原 ＝ 河南地</text>
  <text x="480" y="338" text-anchor="middle" font-size="12" fill="#b09650">（林胡、楼烦的故地 → 头曼的牧场 → 前 214 归秦）</text>
  <circle cx="530" cy="368" r="5" fill="#9a7b2f"/>
  <text x="545" y="372" font-size="12.5" fill="#6b5a26">东胜 / 康巴什</text>
  <circle cx="480" cy="408" r="5" fill="#9a7b2f"/>
  <text x="495" y="412" font-size="12.5" fill="#6b5a26">伊金霍洛旗（成陵）</text>
  <circle cx="420" cy="445" r="5" fill="#9a7b2f"/>
  <text x="435" y="449" font-size="12.5" fill="#6b5a26">乌审旗</text>

  <!-- ===== 昭王长城 ===== -->
  <path d="M 300 540 L 400 528 L 500 522 L 600 512 L 690 500"
        stroke="#8a6aa0" stroke-width="3.5" stroke-dasharray="10 6" fill="none"/>
  <text x="300" y="580" font-size="13" font-weight="bold" fill="#8a6aa0">秦昭王长城 ＝ 前 214 之前的国界</text>

  <!-- ===== 陕北带 ===== -->
  <circle cx="560" cy="497" r="5" fill="#475569"/>
  <text x="560" y="485" text-anchor="middle" font-size="12.5" fill="#475569">统万城（靖边）</text>
  <circle cx="655" cy="530" r="6" fill="#c0504d"/>
  <text x="640" y="556" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a2433">榆林（上郡治所肤施）</text>

  <!-- ===== 陇东：义渠 ===== -->
  <rect x="290" y="596" width="180" height="52" rx="10" fill="#f3e8f5" stroke="#8a6aa0" stroke-width="1.2"/>
  <text x="380" y="618" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6b4a80">义渠（陇东庆阳）</text>
  <text x="380" y="638" text-anchor="middle" font-size="11.5" fill="#8a6aa0">前 272 被宣太后所灭 · 周人龙兴故地</text>

  <!-- 子午岭 -->
  <path d="M 480 592 L 476 640 L 482 686" stroke="#7a6a55" stroke-width="3" fill="none" stroke-dasharray="2 3"/>
  <text x="497" y="630" font-size="12" fill="#7a6a55">子午岭（分水岭）</text>

  <!-- ===== 关中 ===== -->
  <rect x="380" y="694" width="220" height="50" rx="10" fill="#fdeeee" stroke="#c0504d" stroke-width="1.4"/>
  <text x="490" y="715" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0504d">咸阳 · 甘泉宫（云阳）</text>
  <text x="490" y="735" text-anchor="middle" font-size="11.5" fill="#b06a6a">义渠王被杀处 ＝ 直道起点</text>

  <!-- ===== 秦直道（红实线） ===== -->
  <path d="M 478 694 L 470 640 L 462 560 L 448 470 L 460 400 L 480 340 L 472 262 L 470 234"
        stroke="#c0504d" stroke-width="4" fill="none"/>
  <text x="428" y="520" font-size="13.5" font-weight="bold" fill="#c0504d" transform="rotate(-83 428 520)">秦直道（前 212，约 700 公里）</text>

  <!-- ===== 包茂高速（蓝虚线） ===== -->
  <path d="M 540 744 L 585 640 L 620 570 L 655 530 L 600 430 L 545 370 L 500 300 L 476 250"
        stroke="#4a7fb5" stroke-width="2.5" stroke-dasharray="7 5" fill="none"/>
  <text x="628" y="640" font-size="12.5" fill="#4a7fb5">包茂高速（现代版直道）</text>

  <!-- ===== 行程（绿箭头） ===== -->
  <path d="M 720 240 Q 640 280 560 350" stroke="#2e8b57" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
  <path d="M 545 400 Q 590 460 640 515" stroke="#2e8b57" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
  <text x="655" y="330" font-size="12.5" font-weight="bold" fill="#2e8b57">本次行程 D1→D2</text>
  <text x="530" y="470" font-size="12.5" font-weight="bold" fill="#2e8b57">D2→D3</text>

  <!-- 图例 -->
  <g transform="translate(60 644)">
    <rect x="0" y="0" width="196" height="106" rx="8" fill="#ffffff" stroke="#c8d2de"/>
    <line x1="12" y1="18" x2="44" y2="18" stroke="#c0504d" stroke-width="4"/>
    <text x="52" y="22" font-size="12" fill="#1a2433">秦直道</text>
    <line x1="12" y1="40" x2="44" y2="40" stroke="#4a7fb5" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="52" y="44" font-size="12" fill="#1a2433">包茂高速</text>
    <line x1="12" y1="62" x2="44" y2="62" stroke="#8a6aa0" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="52" y="66" font-size="12" fill="#1a2433">昭王长城（旧国界）</text>
    <line x1="12" y1="84" x2="44" y2="84" stroke="#2e8b57" stroke-width="3"/>
    <text x="52" y="88" font-size="12" fill="#1a2433">本次行程（呼市→鄂尔多斯→榆林）</text>
  </g>
</svg>

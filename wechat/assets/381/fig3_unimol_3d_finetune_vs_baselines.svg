<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif"><rect width="640" height="1120" fill="#ffffff"/>
<text x="28" y="40" font-size="25" fill="#253449" font-weight="bold">3D 分子模型：同一份 ESOL 考卷</text>
<text x="28" y="70" font-size="16" fill="#253449" font-weight="normal">1117 个分子｜训练 / 验证 / 测试 = 893 / 112 / 112</text>
<text x="28" y="96" font-size="15" fill="#253449" font-weight="normal">固定随机种子 42；按母核去重；仅用验证集挑选轮次</text>
<rect x="25" y="115" width="590" height="162" rx="9" fill="#edf4fb"/>
<text x="42" y="144" font-size="20" fill="#253449" font-weight="bold">官方 Uni-Mol v1：47,331,139 参数</text>
<text x="42" y="174" font-size="18" fill="#253449" font-weight="normal">原子种类 → 512 维向量 → 15 层 Transformer</text>
<text x="42" y="204" font-size="18" fill="#253449" font-weight="normal">3D 距离 → 128 个高斯核 → 64 头成对偏置</text>
<text x="42" y="234" font-size="18" fill="#253449" font-weight="normal">注意力分数 = Q·K^T / √d + 成对偏置</text>
<text x="42" y="259" font-size="14" fill="#253449" font-weight="normal">各层还会更新原子对表示；不是只加一次静态距离</text>
<text x="28" y="312" font-size="20" fill="#253449" font-weight="bold">留出测试集：RMSE 越低越好（单位 logS）</text>
<text x="30" y="345" font-size="17" fill="#253449" font-weight="normal">常数均值</text>
<rect x="30" y="354" width="390.0" height="18" fill="#9ca3af"/>

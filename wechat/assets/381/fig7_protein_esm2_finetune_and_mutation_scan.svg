rgb(255, 217, 217)"/><text x="24" y="1238" font-size="17" fill="#1e293b">蓝：预测增加；红：预测降低；色阶范围 ±3.15</text><text x="24" y="1273" font-size="17" fill="#1e293b">黑框是原始氨基酸；四个位点共80个单点替换。</text><text x="24" y="1320" font-size="18" fill="#b91c1c">这是模型效应图，不是80次新湿实验的验证结果。</text><text x="24" y="1364" font-size="17" fill="#1e293b">本次随机留出只检验同一蛋白的突变组合泛化。</text><text x="24" y="1401" font-size="17" fill="#1e293b">不代表预测新蛋白、折叠结构或药物临床效果。</text><text x="24" y="1455" font-size="15" fill="#64748b">数据：FLIP GB1 / Wu等，eLife 2016；官方Meta ESM-2</text><text x="24" y="1491" font-size="16" fill="#64748b">测试集不参与早停、超参数选择或标签标准化。</text></svg>
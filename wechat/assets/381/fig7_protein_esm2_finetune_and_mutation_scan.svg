<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif"><rect width="640" height="1600" fill="#ffffff"/><text x="24" y="40" font-size="25" fill="#1e293b">蛋白质专有模型：ESM-2 真机微调</text><text x="24" y="76" font-size="19" fill="#1e293b">GB1 四位点组合突变 → 实验结合适应度</text><text x="24" y="117" font-size="22" fill="#1e293b">① 科学库先处理序列，再交给模型</text><text x="24" y="154" font-size="17" fill="#1e293b">Biopython：分子量 / 等电点 / 芳香性 / 不稳定指数</text><text x="24" y="185" font-size="17" fill="#1e293b">GRAVY亲疏水指数；仅接受20种标准氨基酸。</text><text x="24" y="223" font-size="16" fill="#1e293b">固定3000条真实实验序列；2400训练 / 300验证 / 300测试</text><text x="24" y="267" font-size="22" fill="#1e293b">② 不是通用聊天词表，而是氨基酸词表</text><text x="24" y="304" font-size="19" fill="#2563eb">A C D E F G H I K L M N P Q R S T V W Y</text><text x="24" y="341" font-size="18" fill="#1e293b">33词表 / 6层 / 隐藏320 / 20头 / 7.51M参数</text><text x="24" y="377" font-size="17" fill="#1e293b">RoPE旋转位置编码；双向注意力 + 新建回归头。</text><text x="24" y="413" font-size="16" fill="#1e293b">56AA完整GB1域；265AA原始序列的恒定融合尾巴裁掉。</text><text x="24" y="457" font-size="22" fill="#1e293b">③ 同一份测试卷：误差越低越好</text><text x="24" y="493" font-size="18" fill="#1e293b">常数基线</text><rect x="24" y="503" width="400.0" height="22" rx="4" fill="#94a3b8"/><text x="445" y="521" font-size="17" fill="#1e293b">RMSE 1.244</text><text x="24" y="565" font-size="18" fill="#1e293b">传统特征 + 随机森林</text><rect x="24" y="575" width="279.9651176666118" height="22" rx="4" fill="#94a3b8"/><text x="445" y="593" font-size="17" fill="#1e293b">RMSE 0.870</text><text x="24" y="637" font-size="18" fill="#1e293b">传统特征 + 岭回归</text><rect x="24" y="647" width="299.5468311198434" height="22" rx="4" fill="#94a3b8"/><text x="445" y="665" font-size="17" fill="#1e293b">RMSE 0.931</text><text x="24" y="709" font-size="18" fill="#1e293b">ESM-2 全参数微调</text><rect x="24" y="719" width="173.07764389539724" height="22" rx="4" fill="#2563eb"/><text x="445" y="737" font-size="17" fill="#1e293b">RMSE 0.538</text><text x="24" y="805" font-size="19" fill="#1e293b">ESM：Spearman 0.898 / R² 0.813</text><text x="24" y="844" font-size="18" fill="#1e293b">12轮训练 15.0秒；验证集选第11轮。</text><text x="24" y="891" font-size="22" fill="#1e293b">④ 单点突变扫描：模型认为哪里变好？</text><text x="24" y="927" font-size="17" fill="#1e293b">每格 = 预测突变体适应度 − 预测野生型适应度</text><text x="95" y="966" font-size="15" fill="#1e293b">A</text><text x="119" y="966" font-size="15" fill="#1e293b">C</text><text x="143" y="966" font-size="15" fill="#1e293b">D</text><text x="167" y="966" font-size="15" fill="#1e293b">E</text><text x="191" y="966" font-size="15" fill="#1e293b">F</text><text x="215" y="966" font-size="15" fill="#1e293b">G</text><text x="239" y="966" font-size="15" fill="#1e293b">H</text><text x="263" y="966" font-size="15" fill="#1e293b">I</text><text x="287" y="966" font-size="15" fill="#1e293b">K</text><text x="311" y="966" font-size="15" fill="#1e293b">L</text><text x="335" y="966" font-size="15" fill="#1e293b">M</text><text x="359" y="966" font-size="15" fill="#1e293b">N</text><text x="383" y="966" font-size="15" fill="#1e293b">P</text><text x="407" y="966" font-size="15" fill="#1e293b">Q</text><text x="431" y="966" font-size="15" fill="#1e293b">R</text><text x="455" y="966" font-size="15" fill="#1e293b">S</text><text x="479" y="966" font-size="15" fill="#1e293b">T</text><text x="503" y="966" font-size="15" fill="#1e293b">V</text><text x="527" y="966" font-size="15" fill="#1e293b">W</text><text x="551" y="966" font-size="15" fill="#1e293b">Y</text><text x="24" y="1006" font-size="18" fill="#1e293b">39V</text><rect x="90" y="980" width="23" height="40" fill="rgb(255, 220, 220)"/><rect x="114" y="980" width="23" height="40" fill="rgb(255, 225, 225)"/><rect x="138" y="980" width="23" height="40" fill="rgb(255, 215, 215)"/><rect x="162" y="980" width="23" height="40" fill="rgb(255, 227, 227)"/><rect x="186" y="980" width="23" height="40" fill="rgb(255, 237
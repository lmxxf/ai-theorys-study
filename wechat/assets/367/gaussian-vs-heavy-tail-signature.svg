<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" style="background-color:#ffffff;font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <!-- 标题 -->
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">5 万个词在方向尺子上打分排队：随机方向 vs 真实概念方向</text>
  <text x="410" y="54" text-anchor="middle" font-size="12.5" fill="#4b5563">横轴 = 原始内积得分 y（已减去均值中心，总平均分为 0；词向量原始长度约 15 至 30）；纵轴 = 词元密度</text>

  <!-- 左图：随机方向（高斯钟形） -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="345" height="315" fill="#f8fafc" rx="6" />
    <rect x="0" y="0" width="345" height="4" fill="#64748b" rx="2" />
    <text x="172" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">① 随机乱指的方向（高斯钟形曲线）</text>
    <text x="172" y="48" text-anchor="middle" font-size="12" fill="#475569">5 万个词混在 -3 到 +3 分之间，右边没有高分长尾</text>

    <!-- 指标标签放在网格上方 -->
    <text x="172" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">标准差 σ = 1.33 ｜ 超额峰度 κ = 0.20 ≈ 0</text>

    <!-- 坐标轴 -->
    <line x1="25" y1="225" x2="320" y2="225" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="172" y1="88" x2="172" y2="230" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="172" y="244" text-anchor="middle" font-size="11.5" fill="#475569">0 分</text>
    <text x="85" y="244" text-anchor="middle" font-size="11" fill="#64748b">-3 分</text>
    <text x="260" y="244" text-anchor="middle" font-size="11" fill="#64748b">+3 分</text>

    <!-- 高斯钟形曲线填充与描边 -->
    <path d="M 65,224 C 95,223 115,208 135,172 C 152,142 162,124 172,124 C 182,124 192,142 209,172 C 229,208 249,223 279,224 Z" fill="#94a3b8" fill-opacity="0.25" />
    <path d="M 65,224 C 95,223 115,208 135,172 C 152,142 162,124 172,124 C 182,124 192,142 209,172 C 229,208 249,223 279,224" fill="none" stroke="#475569" stroke-width="2.5" />

    <!-- 右侧杂乱词标注 -->
    <circle cx="248" cy="221" r="3.5" fill="#64748b" />
    <circle cx="258" cy="222" r="3.5" fill="#64748b" />
    <circle cx="268" cy="223" r="3.5" fill="#64748b" />
    <text x="172" y="102" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">右端最高分也只是杂烩："apple", "run", "1998"...</text>
    <line x1="258" y1="215" x2="225" y2="110" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" />

    <!-- 底部结论说明 -->
    <text x="172" y="274" text-anchor="middle" font-size="12" fill="#334155">成百上千种无关因素掺杂，分数在 0 左右对称散开</text>
    <text x="172" y="294" text-anchor="middle" font-size="11.5" fill="#64748b">挑不出任何一组有共同语义的词元</text>
  </g>

  <!-- 右图：ICA 概念方向（中间 [-1,+1] 极窄背景尖峰 + 右边孤立高分长尾短柱） -->
  <g transform="translate(430, 80)">
    <rect x="0" y="0" width="345" height="315" fill="#fffbeb" fill-opacity="0.55" rx="6" />
    <rect x="0" y="0" width="345" height="4" fill="#d97706" rx="2" />
    <text x="172" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">② 真正的概念方向（窄背景＋右侧高分长尾）</text>
    <text x="172" y="48" text-anchor="middle" font-size="12" fill="#475569">50,236 个无关词挤在 ±1 分，20 个目标词飙到 +6 至 +15 分</text>

    <!-- 指标标签放在网格上方 -->
    <text x="172" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">背景极窄 σ = 0.37 ｜ 超额峰度 κ = 252.00</text>

    <!-- 坐标轴 -->
    <line x1="25" y1="225" x2="325" y2="225" stroke="#94a3b8" stroke-width="1.5" />
    <text x="48" y="244" text-anchor="middle" font-size="11" fill="#64748b">-10 分（空）</text>
    <text x="132" y="244" text-anchor="middle" font-size="11.5" fill="#0f766e" font-weight="bold">0 分（±1 分窄尖）</text>
    <text x="265" y="244" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">+6 至 +15 分（长尾）</text>

    <!-- 左侧指向 0 分窄尖峰的说明 -->
    <text x="52" y="122" text-anchor="middle" font-size="11" fill="#0f766e" font-weight="bold">50,236 个无关词</text>
    <text x="52" y="137" text-anchor="middle" font-size="11" fill="#0f766e">平摊小负分与小正分</text>
    <text x="52" y="152" text-anchor="middle" font-size="11" fill="#0f766e">全挤在 -1 到 +1 分</text>
    <line x1="98" y1="135" x2="118" y2="135" stroke="#0f766e" stroke-width="1.2" />

    <!-- 0 分处极窄对称小针尖（代表 49,980 个无关词） -->
    <line x1="132" y1="86" x2="132" y2="230" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3" />
    <path d="M 110,224 C 118,224 123,210 127,155 C 129,110 130.5,90 132,90 C 133.5,90 135,110 137,155 C 141,210 146,224 154,224 Z" fill="#0f766e" fill-opacity="0.20" />
    <path d="M 110,224 C 118,224 123,210 127,155 C 129,110 130.5,90 132,90 C 133.5,90 135,110 137,155 C 141,210 146,224 154,224" fill="none" stroke="#0f766e" stroke-width="2.2" />

    <!-- 右侧 +6 ~ +15 分孤立高分小柱子（还原论文 Figure 8C） -->
    <rect x="205" y="211" width="5" height="13" fill="#d97706" rx="1" />
    <rect x="214" y="211" width="5" height="13" fill="#d97706" rx="1" />
    <rect x="223" y="211" width="5" height="13" fill="#d97706" rx="1" />
    <rect x="238" y="211" width="5" height="13" fill="#d97706" rx="1" />
    <rect x="249" y="211" width="5" height="13" fill="#d97706" rx="1" />
    <rect x="268" y="211" width="5" height="13" fill="#b45309" rx="1" />
    <rect x="282" y="211" width="5" height="13" fill="#b45309" rx="1" />
    <rect x="300" y="211" width="6" height="13" fill="#92400e" rx="1" />

    <line x1="255" y1="206" x2="240" y2="164" stroke="#d97706" stroke-width="1.3" />
    <text x="238" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">右边长尾上孤立站着 20 个目标词</text>
    <text x="238" y="146" text-anchor="middle" font-size="11.5" fill="#92400e">"either", "neither", "both",</text>
    <text x="238" y="161" text-anchor="middle" font-size="11.5" fill="#92400e">"between"（两者选一概念族）</text>

    <!-- 底部结论说明 -->
    <text x="172" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">左边没有「反·两者选一」的大负分，只有右边单侧长尾</text>
    <text x="172" y="294" text-anchor="middle" font-size="11.5" fill="#475569">背景越窄（0 附近）、右侧长尾飙得越远，超额峰度 κ 就越大</text>
  </g>
</svg>

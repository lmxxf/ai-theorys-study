<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" style="background-color:#ffffff;font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <!-- 标题 -->
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">沉冤三年的「正负号盲盒乌龙」：4 次方分不清正负，靠 3 次方一行代码翻案</text>
  <text x="410" y="54" text-anchor="middle" font-size="12.5" fill="#4b5563">偶次方（2 次方、4 次方）负负得正，导致 ICA 输出的坐标轴有一半朝左（负半轴）、一半朝右（正半轴）</text>

  <!-- 上半部分：抽到负号时的冤案 -->
  <g transform="translate(45, 78)">
    <rect x="0" y="0" width="730" height="145" fill="#fef2f2" fill-opacity="0.55" rx="6" />
    <rect x="0" y="0" width="6" height="145" fill="#dc2626" rx="2" />

    <text x="24" y="26" font-size="14.5" font-weight="bold" fill="#991b1b">① 2024 年旧评测的乌龙：当概念方向随机抽到了负号 [0, 0, 0, -2]</text>
    <text x="24" y="46" font-size="12" fill="#475569">因为 (-2)⁴ = (+2)⁴ = 16，ICA 觉得 [0, 0, 0, -2] 也是满分答案，直接交卷——此时真概念长在左边（负分）</text>

    <!-- 数轴与左偏长尾曲线 -->
    <line x1="60" y1="118" x2="420" y2="118" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="295" y1="62" x2="295" y2="124" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="295" y="136" text-anchor="middle" font-size="11.5" fill="#334155">0 分</text>
    <text x="135" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">← 左边负分（-2，真正的概念长尾）</text>
    <text x="368" y="136" text-anchor="middle" font-size="11.5" fill="#dc2626">右边正分（全是 0）</text>

    <!-- 左长尾柱子与中心窄尖 -->
    <path d="M 275,117 C 283,117 288,105 291,75 C 293,62 297,62 299,75 C 302,105 307,117 315,117 Z" fill="#0f766e" fill-opacity="0.22" stroke="#0f766e" stroke-width="2" />
    <rect x="105" y="104" width="6" height="13" fill="#d97706" rx="1" />
    <rect x="125" y="104" width="6" height="13" fill="#d97706" rx="1" />
    <rect x="148" y="104" width="6" height="13" fill="#d97706" rx="1" />
    <rect x="172" y="104" width="6" height="13" fill="#d97706" rx="1" />

    <!-- 右侧错误截取框 -->
    <rect x="298" y="64" width="115" height="52" fill="#ef4444" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="355" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">旧评测只看 &gt; 0</text>
    <text x="355" y="102" text-anchor="middle" font-size="11" fill="#991b1b">把左边的宝藏全扔了</text>

    <!-- 右侧文字总结 -->
    <text x="440" y="80" font-size="12.5" font-weight="bold" fill="#991b1b">结果：一半好方向因符号反了被判「不可解释」</text>
    <text x="440" y="102" font-size="12" fill="#334155">• 2 次方与 4 次方全是偶次方，正负号一模一样</text>
    <text x="440" y="122" font-size="12" fill="#334155">• 但算一下 3 次方（偏度）：(-2)³ = -8（立刻露馅）</text>
  </g>

  <!-- 下半部分：ICA-Lens 的 3 次方翻正 -->
  <g transform="translate(45, 242)">
    <rect x="0" y="0" width="730" height="145" fill="#f0fdf4" fill-opacity="0.65" rx="6" />
    <rect x="0" y="0" width="6" height="145" fill="#16a34a" rx="2" />

    <text x="24" y="26" font-size="14.5" font-weight="bold" fill="#166534">② ICA-Lens 的修正：看一眼 3 次方正负号，若是负数就乘 -1 掉头变成 [0, 0, 0, +2]</text>
    <text x="24" y="46" font-size="12" fill="#475569">只要 3 次方算出来小于 0，就把这根尺子乘 -1 反过来，保证所有概念长尾统统朝右（正半轴）</text>

    <!-- 数轴与翻正后的右长尾 -->
    <line x1="60" y1="118" x2="420" y2="118" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="155" y1="62" x2="155" y2="124" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="155" y="136" text-anchor="middle" font-size="11.5" fill="#334155">0 分</text>
    <text x="305" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">翻正后的右边正分（+2，长尾全部朝右）→</text>

    <!-- 翻正后的中心窄尖与右长尾柱子 -->
    <path d="M 135,117 C 143,117 148,105 151,75 C 153,62 157,62 159,75 C 162,105 167,117 175,117 Z" fill="#0f766e" fill-opacity="0.22" stroke="#0f766e" stroke-width="2" />
    <rect x="265" y="104" width="6" height="13" fill="#16a34a" rx="1" />
    <rect x="288" y="104" width="6" height="13" fill="#16a34a" rx="1" />
    <rect x="312" y="104" width="6" height="13" fill="#16a34a" rx="1" />
    <rect x="335" y="104" width="6" height="13" fill="#16a34a" rx="1" />

    <!-- 右侧文字总结 -->
    <text x="440" y="78" font-size="12.5" font-weight="bold" fill="#166534">掉头翻正后，可解释性直接追平 SAE：</text>
    <text x="440" y="100" font-size="12" fill="#1e293b">• 人工盲审高置信度可解释比例高达 80% 至 84%</text>
    <text x="440" y="120" font-size="12" fill="#1e293b">• 直接打包成标准 SAE 格式，体积比 SAE 小 7 至 43 倍</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" style="background-color:#ffffff;font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <!-- 标题 -->
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">为什么传统的 PCA 找不出概念方向，而 ICA 靠「4 次方」一抓一个准？</text>
  <text x="410" y="54" text-anchor="middle" font-size="12.5" fill="#4b5563">用 4 个词元的极简打分对比：平庸散开的方向 A vs 3 个沉默、1 个爆发的概念方向 B</text>

  <!-- 左栏：平庸方向 A -->
  <g transform="translate(35, 78)">
    <rect x="0" y="0" width="360" height="305" fill="#f8fafc" rx="6" />
    <rect x="0" y="0" width="360" height="4" fill="#64748b" rx="2" />
    <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">方向 A：4 个词平庸散开（无概念）</text>
    <text x="180" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">4 个词的得分：[-1,  -1,  +1,  +1]</text>

    <!-- 数轴示意 -->
    <line x1="40" y1="105" x2="320" y2="105" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="180" y1="85" x2="180" y2="120" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="180" y="135" text-anchor="middle" font-size="11.5" fill="#64748b">0 分</text>
    <circle cx="105" cy="100" r="6" fill="#64748b" />
    <circle cx="105" cy="84" r="6" fill="#64748b" />
    <text x="105" y="135" text-anchor="middle" font-size="11.5" fill="#475569">-1 分（2个词）</text>
    <circle cx="255" cy="100" r="6" fill="#64748b" />
    <circle cx="255" cy="84" r="6" fill="#64748b" />
    <text x="255" y="135" text-anchor="middle" font-size="11.5" fill="#475569">+1 分（2个词）</text>

    <!-- 算账对比 -->
    <rect x="22" y="156" width="316" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="4" />
    <text x="180" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0369a1">① 看 2 次方（PCA 看的方差）：</text>
    <text x="180" y="200" text-anchor="middle" font-size="12.5" fill="#1e293b">((-1)² + (-1)² + 1² + 1²) ÷ 4 = 4 ÷ 4 = 1</text>

    <rect x="22" y="226" width="316" height="62" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="4" />
    <text x="180" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">② 看 4 次方（ICA 看的峰度）：</text>
    <text x="180" y="270" text-anchor="middle" font-size="12.5" fill="#475569">((-1)⁴ + (-1)⁴ + 1⁴ + 1⁴) ÷ 4 = 4 ÷ 4 = 1（平庸）</text>
  </g>

  <!-- 右栏：概念方向 B -->
  <g transform="translate(425, 78)">
    <rect x="0" y="0" width="360" height="305" fill="#fffbeb" fill-opacity="0.6" rx="6" />
    <rect x="0" y="0" width="360" height="4" fill="#d97706" rx="2" />
    <text x="180" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">方向 B：3 个无关词沉默、1 个目标词爆发</text>
    <text x="180" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">4 个词的得分：[ 0,   0,   0,  +2]</text>

    <!-- 数轴示意 -->
    <line x1="40" y1="105" x2="320" y2="105" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="130" y1="80" x2="130" y2="120" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 2" />
    <circle cx="130" cy="100" r="5.5" fill="#0f766e" />
    <circle cx="130" cy="86" r="5.5" fill="#0f766e" />
    <circle cx="130" cy="72" r="5.5" fill="#0f766e" />
    <text x="130" y="135" text-anchor="middle" font-size="11.5" fill="#0f766e" font-weight="bold">0 分（3个无关词）</text>
    <circle cx="290" cy="100" r="6.5" fill="#d97706" />
    <text x="285" y="135" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">+2 分（1个目标词爆发）</text>

    <!-- 算账对比 -->
    <rect x="22" y="156" width="316" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" rx="4" />
    <text x="180" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b91c1c">① 看 2 次方（PCA 完全分不出 A 和 B）：</text>
    <text x="180" y="200" text-anchor="middle" font-size="12.5" fill="#1e293b">(0² + 0² + 0² + 2²) ÷ 4 = 4 ÷ 4 = 1（跟 A 一模一样）</text>

    <rect x="22" y="226" width="316" height="62" fill="#fef3c7" fill-opacity="0.55" stroke="#d97706" stroke-width="1.6" rx="4" />
    <text x="180" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">② 看 4 次方（ICA 一眼抓出长尾方向 B）：</text>
    <text x="180" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">(0⁴ + 0⁴ + 0⁴ + 2⁴) ÷ 4 = 16 ÷ 4 = 4（是 A 的 4 倍）</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" style="background-color:#ffffff;font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <!-- 标题 -->
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">ICA-Lens 换基三步走：为什么 PCA 在正圆球上瞎了，得靠四次方转眼镜？</text>
  <text x="410" y="54" text-anchor="middle" font-size="12.5" fill="#4b5563">承接前文 359 期「换基」：先用二阶协方差把椭球拍成圆球，再用四阶峰度（或 logcosh）旋转正交轴抓尖刺</text>

  <!-- 步骤 1：去中心椭球 -->
  <g transform="translate(25, 78)">
    <rect x="0" y="0" width="235" height="330" fill="#f8fafc" rx="6" />
    <rect x="0" y="0" width="235" height="4" fill="#64748b" rx="2" />
    <text x="117" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e293b">第一步：去中心激活 X_c</text>
    <text x="117" y="45" text-anchor="middle" font-size="11.5" fill="#475569">不同方向胖瘦不一（椭球分布）</text>

    <!-- 坐标轴与倾斜椭圆 -->
    <line x1="35" y1="150" x2="200" y2="150" stroke="#cbd5e1" stroke-width="1.2" />
    <line x1="117" y1="75" x2="117" y2="225" stroke="#cbd5e1" stroke-width="1.2" />

    <g transform="translate(117, 150) rotate(-28)">
      <ellipse cx="0" cy="0" rx="74" ry="32" fill="#94a3b8" fill-opacity="0.2" stroke="#475569" stroke-width="2" />
      <line x1="-82" y1="0" x2="82" y2="0" stroke="#2563eb" stroke-width="2" />
      <line x1="0" y1="-40" x2="0" y2="40" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2" />
    </g>
    <text x="172" y="108" font-size="11" font-weight="bold" fill="#2563eb">PCA 主轴 U</text>

    <text x="117" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">算协方差 (1/n) X_c^T X_c = U Λ U^T</text>
    <text x="117" y="274" text-anchor="middle" font-size="11.5" fill="#475569">PCA 只找方差最大的长轴与短轴</text>
    <text x="117" y="294" text-anchor="middle" font-size="11.5" fill="#64748b">但多个独立概念仍斜着混在里面</text>
  </g>

  <!-- 箭头 1->2 -->
  <text x="272" y="235" text-anchor="middle" font-size="18" font-weight="bold" fill="#64748b">→</text>

  <!-- 步骤 2：二阶白化正圆球（PCA 失明） -->
  <g transform="translate(285, 78)">
    <rect x="0" y="0" width="245" height="330" fill="#f0f9ff" fill-opacity="0.6" rx="6" />
    <rect x="0" y="0" width="245" height="4" fill="#0284c7" rx="2" />
    <text x="122" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">第二步：白化 Z = X_c U Λ^(-1/2)</text>
    <text x="122" y="45" text-anchor="middle" font-size="11.5" fill="#0369a1">把椭球拍成所有方向方差全为 1 的圆球</text>

    <!-- 圆球与任意方向 -->
    <line x1="40" y1="150" x2="205" y2="150" stroke="#bae6fd" stroke-width="1.2" />
    <line x1="122" y1="75" x2="122" y2="225" stroke="#bae6fd" stroke-width="1.2" />
    <circle cx="122" cy="144" r="54" fill="#38bdf8" fill-opacity="0.15" stroke="#0284c7" stroke-width="2" />

    <!-- 内部隐藏的十字星尖刺（代表真实概念轴） -->
    <g transform="translate(122, 144) rotate(22)">
      <line x1="-62" y1="0" x2="62" y2="0" stroke="#d97706" stroke-width="2.2" stroke-dasharray="3 2" />
      <line x1="0" y1="-62" x2="0" y2="62" stroke="#d97706" stroke-width="2.2" stroke-dasharray="3 2" />
    </g>
    <text x="122" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0369a1">圆球上任意方向 E[y²] = 1</text>

    <text x="122" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">二阶方差处处相等，PCA 彻底瞎了</text>
    <text x="122" y="274" text-anchor="middle" font-size="11.5" fill="#334155">方向 A：[-1, -1, 1, 1] → 方差 E[y²] = 1</text>
    <text x="122" y="294" text-anchor="middle" font-size="11.5" fill="#334155">方向 B：[ 0,  0, 0, 2] → 方差 E[y²] = 1</text>
    <text x="122" y="314" text-anchor="middle" font-size="11" fill="#64748b">光看平方（方差），根本分不清 A 和 B</text>
  </g>

  <!-- 箭头 2->3 -->
  <text x="542" y="235" text-anchor="middle" font-size="18" font-weight="bold" fill="#64748b">→</text>

  <!-- 步骤 3：四阶峰度旋转正交轴 W -->
  <g transform="translate(555, 78)">
    <rect x="0" y="0" width="245" height="330" fill="#fffbeb" fill-opacity="0.65" rx="6" />
    <rect x="0" y="0" width="245" height="4" fill="#d97706" rx="2" />
    <text x="122" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111827">第三步：FastICA 旋转正交轴 W</text>
    <text x="122" y="45" text-anchor="middle" font-size="11.5" fill="#b45309">看四次方 κ = E[y⁴]/(E[y²])² - 3 抓尖刺</text>

    <!-- 旋转对齐后的坐标轴 -->
    <circle cx="122" cy="145" r="52" fill="#fde68a" fill-opacity="0.2" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3" />
    <g transform="translate(122, 145) rotate(22)">
      <line x1="-68" y1="0" x2="68" y2="0" stroke="#d97706" stroke-width="2.6" />
      <line x1="0" y1="-68" x2="0" y2="68" stroke="#0f766e" stroke-width="2.6" />
      <circle cx="64" cy="0" r="4.5" fill="#d97706" />
      <circle cx="0" cy="-64" r="4.5" fill="#0f766e" />
      <text x="46" y="-8" font-size="11.5" font-weight="bold" fill="#b45309">w_1</text>
      <text x="8" y="-48" font-size="11.5" font-weight="bold" fill="#0f766e">w_2</text>
    </g>

    <text x="122" y="232" text-anchor="middle" font-size="11.5" fill="#475569">方向 A 四次方均值 = 1 → κ = 1 - 3 = -2</text>
    <text x="122" y="251" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">方向 B 四次方均值 = 4 → κ = 4 - 3 = +1</text>
    <text x="122" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111827">退回原空间即得对偶读写尺子：</text>
    <text x="122" y="294" text-anchor="middle" font-size="11.5" fill="#0f766e">读取轴 r_j = U Λ^(-1/2) w_j</text>
    <text x="122" y="313" text-anchor="middle" font-size="11.5" fill="#b45309">写入轴 d_j = U Λ^(+1/2) w_j（r_i^T d_j = δ_ij）</text>
  </g>
</svg>

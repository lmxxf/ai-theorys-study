<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" width="760" height="355" style="background-color:#ffffff;font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <!-- 顶部标题 -->
  <text x="380" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#111827">工程实现细节：「4 次方」与平滑尺子「log(cosh(u))」的曲线对比</text>
  <text x="380" y="50" text-anchor="middle" font-size="12.5" fill="#4b5563">0 分附近两者都是弯碗（同样能抓非高斯长尾）；到了高分区，4 次方原地冲顶，log(cosh) 自动变成温和斜线</text>

  <!-- 图例（网格上方） -->
  <g transform="translate(135, 66)">
    <line x1="0" y1="8" x2="30" y2="8" stroke="#dc2626" stroke-width="2.8" stroke-dasharray="6 4"/>
    <text x="38" y="12" font-size="12.5" font-weight="bold" fill="#dc2626">4 次方尺子（u⁴：遇单个脏点暴涨 1 亿）</text>
    <line x1="278" y1="8" x2="308" y2="8" stroke="#0f766e" stroke-width="3.2"/>
    <text x="316" y="12" font-size="12.5" font-weight="bold" fill="#0f766e">实际旋转尺子（log cosh u：远处变温和直线）</text>
  </g>

  <!-- 绘图底区 -->
  <rect x="90" y="96" width="580" height="205" fill="#f8fafc" rx="5"/>
  <rect x="90" y="96" width="580" height="3.5" fill="#0f766e" rx="1.5"/>

  <!-- 水平参考线与中轴 -->
  <line x1="90" y1="198.5" x2="670" y2="198.5" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="380.0" y1="96" x2="380.0" y2="301" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="90" y1="301" x2="670" y2="301" stroke="#94a3b8" stroke-width="1.6"/>


  <!-- 左上空白区标注红线 -->
  <text x="106" y="130" font-size="12" font-weight="bold" fill="#dc2626">u⁴ 直冲天际 →</text>
  <text x="106" y="150" font-size="11.5" fill="#dc2626">混进 1 个 100 分脏点</text>
  <text x="106" y="168" font-size="11.5" fill="#dc2626">100⁴ = 1 亿，把轴拽歪</text>

  <!-- 右上外侧空白区标注青线（左对齐在 x=cx+150=530，彻底避开 x=516 处的红虚线！） -->
  <text x="530" y="140" font-size="11.5" font-weight="bold" fill="#0f766e">log(cosh u) 变温和斜线</text>
  <text x="530" y="160" font-size="11" fill="#0f766e">远处近似 |u| − 0.69</text>
  <text x="530" y="178" font-size="11" fill="#0f766e">100 分脏点只算 99.3</text>

  <!-- 中间碗口内部空白区 -->
  <text x="380.0" y="264" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#475569">↓ 0 分附近都是平缓碗底 ↓</text>

  <!-- X 轴刻度 -->
  <text x="380.0" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">0 分（无关词沉默区）</text>
  <text x="198.8" y="321" text-anchor="middle" font-size="11.5" fill="#64748b">−2 分</text>
  <text x="561.2" y="321" text-anchor="middle" font-size="11.5" fill="#64748b">+2 分</text>
  <text x="656" y="321" text-anchor="end" font-size="11.5" fill="#64748b">+3 分 →</text>

  <!-- 底部一句话总结 -->
  <text x="380" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">两步分工：先用温和的 log(cosh u) 旋转 50 步稳稳找准方向 → 转完交卷后再算「4 次方超额峰度 κ」排座次</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect x="0" y="0" width="540" height="340" fill="#ffffff"/>

  <text x="20" y="30" fill="#111827" font-size="14" font-weight="bold">双机 DGX Spark 锻造实录：48 层线性注意力的反向传播墙与破局管线</text>
  <line x1="20" y1="42" x2="520" y2="42" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Left Card: Pitfall (batch8 PyTorch fallback -> 20 GiB Fuse) -->
  <rect x="20" y="54" width="242" height="196" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="20" y="54" width="242" height="30" rx="8" fill="#fee2e2"/>
  <text x="141" y="74" fill="#991b1b" font-size="11.5" font-weight="bold" text-anchor="middle">第一现场：缺 FLA 算子触发 20 GiB 熔断</text>

  <text x="30" y="102" fill="#7f1d1d" font-size="11" font-weight="bold">1. 混合架构陷阱 (48 线性 + 16 全注意力)</text>
  <text x="30" y="120" fill="#450a0a" font-size="10.5">64 层里有 48 层是 Gated DeltaNet；缺</text>
  <text x="30" y="136" fill="#450a0a" font-size="10.5">fla-core 时退化为 48×128 = 6144 步循环图</text>

  <text x="30" y="160" fill="#7f1d1d" font-size="11" font-weight="bold">2. 63 层累加器吃光页缓存 (6.6 GB/份)</text>
  <text x="30" y="178" fill="#450a0a" font-size="10.5">63 个 5120×5120 FP32 矩阵常驻 RAM 叠加</text>
  <text x="30" y="194" fill="#450a0a" font-size="10.5">统一内存反向图，batch8 瞬间逼近 20 GiB</text>

  <rect x="30" y="206" width="222" height="34" rx="5" fill="#dc2626"/>
  <text x="141" y="221" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">外部看门狗 &lt; 20 GiB 秒杀进程组保命！</text>
  <text x="141" y="235" fill="#fecaca" font-size="9.5" text-anchor="middle">机器零卡死 · 告别周五晚 OOM 死机惨剧</text>

  <!-- Right Card: Solution Pipeline -->
  <rect x="276" y="54" width="244" height="196" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="276" y="54" width="244" height="30" rx="8" fill="#d1fae5"/>
  <text x="398" y="74" fill="#065f46" font-size="11.5" font-weight="bold" text-anchor="middle">破局四件套：稳态可用内存 44.5–53 GiB</text>

  <text x="286" y="102" fill="#065f46" font-size="11" font-weight="bold">① 补齐 fla-core 0.6.0 + Triton 3.8 (sm_121)</text>
  <text x="286" y="119" fill="#064e3b" font-size="10.5">启用 FLA 线性注意力内核，单条降至 22 分钟</text>

  <text x="286" y="141" fill="#065f46" font-size="11" font-weight="bold">② 逐 Shard 流式反量化加载 (50.10 GiB)</text>
  <text x="286" y="158" fill="#064e3b" font-size="10.5">FP8 权重逐片转 BF16，峰值 CUDA 52.80 GiB</text>

  <text x="286" y="180" fill="#065f46" font-size="11" font-weight="bold">③ 磁盘 mmap + MADV_DONTNEED 释放缓存</text>
  <text x="286" y="197" fill="#064e3b" font-size="10.5">63 层 FP32 累加器落盘，与原版逐项误差 0.0</text>

  <rect x="286" y="206" width="224" height="34" rx="5" fill="#059669"/>
  <text x="398" y="221" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">④ 主从双机奇偶分片 + 官方 merge()</text>
  <text x="398" y="235" fill="#a7f3d0" font-size="9.5" text-anchor="middle">主机跑英文 (0,2..) · 从机跑中文 (1,3..)</text>

  <!-- Bottom Timeline / Status Bar -->
  <rect x="20" y="262" width="500" height="64" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="30" y="282" fill="#1e3a8a" font-size="11" font-weight="bold">双机真实运行账单（63 层 × 5120 维全矩阵，128 词元取后 111 个有效位置）：</text>
  <text x="30" y="301" fill="#1d4ed8" font-size="10.5">• 单条耗时 1321–1614 秒（22–27 分钟）· 已合成 N=1 (纯英) 与 N=2 (1英1中，各 3.1 GB)</text>
  <text x="30" y="318" fill="#2563eb" font-size="10.5" font-weight="bold">• 跑满 100 条双语百科需双机挂机约 18 小时 —— 此时此刻两台 Spark 正在书房通宵磨镜片</text>
</svg>

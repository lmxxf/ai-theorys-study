<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect x="0" y="0" width="540" height="340" fill="#ffffff"/>

  <text x="20" y="30" fill="#111827" font-size="14" font-weight="bold">J-lens 到底怎么算出来？3 维玩具模型的 3×3 九宫格与三次反向传播</text>
  <line x1="20" y1="42" x2="520" y2="42" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Left Box: Forward & 3 Backward Probe Pulses -->
  <rect x="20" y="54" width="236" height="216" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="138" y="76" fill="#0f172a" font-size="12.5" font-weight="bold" text-anchor="middle">第一步：喂百科句子，倒灌单位脉冲</text>

  <!-- Target Layer 63 -->
  <rect x="32" y="88" width="212" height="58" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="138" y="106" fill="#1d4ed8" font-size="11" font-weight="bold" text-anchor="middle">第 63 层出口向量 h_63 = [y1, y2, y3]</text>
  <text x="138" y="123" fill="#1e40af" font-size="10.5" text-anchor="middle">第 1 次注入 [1, 0, 0] → 填第 1 行</text>
  <text x="138" y="138" fill="#1e40af" font-size="10.5" text-anchor="middle">第 2/3 次注入 [0,1,0]/[0,0,1] → 第 2/3 行</text>

  <!-- Arrow Down (Backward) -->
  <line x1="82" y1="150" x2="82" y2="190" stroke="#2563eb" stroke-width="2.2"/>
  <polygon points="82,195 77,185 87,185" fill="#2563eb"/>
  <text x="92" y="168" fill="#2563eb" font-size="10.5" font-weight="bold">反向传播求偏导</text>
  <text x="92" y="183" fill="#2563eb" font-size="10">(不改模型自身权重)</text>

  <!-- Middle Layer l -->
  <rect x="32" y="198" width="212" height="60" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="138" y="216" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">一次顺带收回 0..62 全部层梯度</text>
  <text x="138" y="233" fill="#065f46" font-size="10.5" text-anchor="middle">第 l 层中间向量 h_l = [x1, x2, x3]</text>
  <text x="138" y="249" fill="#065f46" font-size="10" text-anchor="middle">(真实 27B：5120 维需跑 5120 次)</text>

  <!-- Right Box: 3x3 Jacobian Grid & Projection -->
  <rect x="270" y="54" width="250" height="216" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="395" y="76" fill="#0f172a" font-size="12.5" font-weight="bold" text-anchor="middle">第二步：拼成 J_l 九宫格，左乘拧正坐标</text>

  <!-- 3x3 Grid -->
  <g transform="translate(291, 88)">
    <rect x="0" y="0" width="208" height="106" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="69" y1="0" x2="69" y2="106" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="138" y1="0" x2="138" y2="106" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="0" y1="35" x2="208" y2="35" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="0" y1="70" x2="208" y2="70" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Diagonal highlight -->
    <rect x="2" y="2" width="65" height="31" fill="#dbeafe" opacity="0.55"/>
    <rect x="71" y="37" width="65" height="31" fill="#dbeafe" opacity="0.55"/>
    <rect x="140" y="72" width="66" height="32" fill="#dbeafe" opacity="0.55"/>

    <text x="34" y="22" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">∂y1/∂x1</text>
    <text x="103" y="22" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">∂y1/∂x2</text>
    <text x="173" y="22" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">∂y1/∂x3</text>

    <text x="34" y="57" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">∂y2/∂x1</text>
    <text x="103" y="57" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">∂y2/∂x2</text>
    <text x="173" y="57" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">∂y2/∂x3</text>

    <text x="34" y="93" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">∂y3/∂x1</text>
    <text x="103" y="93" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">∂y3/∂x2</text>
    <text x="173" y="93" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">∂y3/∂x3</text>
  </g>

  <text x="395" y="214" fill="#dc2626" font-size="10.5" font-weight="bold" text-anchor="middle">老办法 Logit Lens：假装绿格全为 0、蓝格全为 1</text>
  <text x="395" y="233" fill="#047857" font-size="10.5" font-weight="bold" text-anchor="middle">J-lens 读数：h_63(预测) = J_l · h_l → Norm → 词表</text>
  <text x="395" y="251" fill="#475569" font-size="10" text-anchor="middle">多篇百科求平均：抵消句子私货，留下通用升降机</text>

  <!-- Bottom Banner -->
  <rect x="20" y="282" width="500" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="270" y="301" fill="#1e3a8a" font-size="11.5" font-weight="bold" text-anchor="middle">一句话记住：J-lens 不是训练出来的新网络，而是靠反向传播量出来的“层间偏导数翻译表”</text>
  <text x="270" y="318" fill="#2563eb" font-size="10.5" text-anchor="middle">把中间层歪了 90% 的内部工作语言，左乘 J_l 拧回第 63 层出口坐标系，再接最后的语言头</text>
</svg>

  <text x="466" y="197" fill="#047857" font-size="10.5" font-weight="bold" text-anchor="middle">第 9 名 (L38: 第 20)</text>

  <!-- Bottom Box: Official Benchmark & Why N=2 Has Formatting Noise -->
  <rect x="20" y="218" width="500" height="110" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="30" y="238" fill="#92400e" font-size="11" font-weight="bold">官方基准集读出命中率（Qwen 词表适配）与双样本早期镜头的少样本波动：</text>
  <text x="30" y="257" fill="#78350f" font-size="10">• 107 道多语言题：pass@1 从老办法 21.26% → N=1 跃升至 32.09% (+10.83 个百分点)，N=2 为 22.74%</text>
  <text x="30" y="275" fill="#78350f" font-size="10">• 84 道多跳题：pass@1 老办法与 N=1 均为 33.93%（pass@5 升至 56.35%），N=2 回落至 23.81%</text>
  <text x="30" y="295" fill="#b45309" font-size="10" font-weight="bold">• 早期观察：N=1 与 N=2 逐层矩阵余弦均值仅 0.81343（尚未收敛），且部分中层读数前排出现 \n\n 与 …</text>
  <text x="30" y="312" fill="#b45309" font-size="10" font-weight="bold">  （如中文靴子 L41 Top-5 为 ['\n\n','…',' Italy','\n',' Italian']），需继续跑满 100 篇检验收敛效果</text>
</svg>

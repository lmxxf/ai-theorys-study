<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect x="0" y="0" width="540" height="340" fill="#ffffff"/>

  <text x="20" y="28" fill="#111827" font-size="14" font-weight="bold">早期镜头 (N=1 / N=2) 真实读数对比：代表题跃升与少样本波动</text>
  <line x1="20" y1="40" x2="520" y2="40" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Top Table Box: Representative Prompts Rank Jump -->
  <rect x="20" y="50" width="500" height="156" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="50" width="500" height="28" rx="8" fill="#e2e8f0"/>
  <text x="28" y="68" fill="#0f172a" font-size="11" font-weight="bold">代表题 (题末词元读数)</text>
  <text x="252" y="68" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">老办法 Logit Lens</text>
  <text x="366" y="68" fill="#1d4ed8" font-size="11" font-weight="bold" text-anchor="middle">N=1 镜头 (1英)</text>
  <text x="466" y="68" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">N=2 镜头 (1英1中)</text>

  <!-- Row 1: boot-currency-en -->
  <line x1="20" y1="108" x2="520" y2="108" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="91" fill="#111827" font-size="10.5" font-weight="bold">英文靴子国货币 (L38 / L40)</text>
  <text x="28" y="103" fill="#64748b" font-size="9.5">概念 'Italy' (L37 原版有中文)</text>
  <text x="252" y="97" fill="#dc2626" font-size="10.5" font-weight="bold" text-anchor="middle">128 名 / 2123 名</text>
  <text x="366" y="97" fill="#1d4ed8" font-size="11" font-weight="bold" text-anchor="middle">第 1 名 / 第 2 名</text>
  <text x="466" y="97" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">第 1 名 / 第 1 名</text>

  <!-- Row 2: boot-currency-zh -->
  <line x1="20" y1="142" x2="520" y2="142" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="124" fill="#111827" font-size="10.5" font-weight="bold">中文靴子国货币 (L41)</text>
  <text x="28" y="136" fill="#64748b" font-size="9.5">目标概念：'意大利' / 'Italy'</text>
  <text x="252" y="130" fill="#dc2626" font-size="10.5" font-weight="bold" text-anchor="middle">131 名 / 104 名</text>
  <text x="366" y="130" fill="#1d4ed8" font-size="11" font-weight="bold" text-anchor="middle">第 3 名 / 第 1 名</text>
  <text x="466" y="130" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">第 5 名 / 第 3 名</text>

  <!-- Row 3: tokyo-zh -->
  <line x1="20" y1="176" x2="520" y2="176" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="158" fill="#111827" font-size="10.5" font-weight="bold">中文东京国家货币 (L41)</text>
  <text x="28" y="170" fill="#64748b" font-size="9.5">目标概念：'日本' / 'Japan'</text>
  <text x="252" y="164" fill="#dc2626" font-size="10.5" font-weight="bold" text-anchor="middle">第 40 名 / 第 32 名</text>
  <text x="366" y="164" fill="#1d4ed8" font-size="11" font-weight="bold" text-anchor="middle">第 5 名 / 第 2 名</text>
  <text x="466" y="164" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">第 4 名 / 第 2 名</text>

  <!-- Row 4: nile-en -->
  <text x="28" y="191" fill="#111827" font-size="10.5" font-weight="bold">英文吉萨金字塔所在国 (L41)</text>
  <text x="28" y="202" fill="#64748b" font-size="9.5">目标概念：'Egypt'</text>
  <text x="252" y="197" fill="#dc2626" font-size="10.5" font-weight="bold" text-anchor="middle">40 名 (L31: 92298)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="580" height="280" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect width="580" height="280" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="290" y="24" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111827">Hacker News 历年 11 月顶层招聘帖数与 AI 词汇占比（2021–2026）</text>
  <text x="290" y="42" text-anchor="middle" font-size="10.8" fill="#6b7280">数据源：Ask HN: Who is hiring? 搜索接口各年 11 月现存可见顶层评论统计（2026 截至 11-28）</text>

  <!-- Legend -->
  <rect x="48" y="54" width="12" height="10" rx="2" fill="#cbd5e1"/>
  <text x="64" y="63" font-size="11" fill="#374151">现存顶层招聘帖数（左轴）</text>

  <line x1="214" y1="59" x2="232" y2="59" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="223" cy="59" r="3.5" fill="#2563eb"/>
  <text x="237" y="63" font-size="11" fill="#1e40af" font-weight="bold">提及 AI / ML / 大模型</text>

  <line x1="368" y1="59" x2="386" y2="59" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 2"/>
  <circle cx="377" cy="59" r="3.5" fill="#dc2626"/>
  <text x="391" y="63" font-size="11" fill="#b91c1c" font-weight="bold">提及 AI Agent / MCP</text>

  <!-- Plot Area: x=58..522 (width=464), y=82..232 (height=150) -->
  <line x1="58" y1="232" x2="522" y2="232" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="58" y1="194.5" x2="522" y2="194.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="58" y1="157" x2="522" y2="157" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="58" y1="119.5" x2="522" y2="119.5" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="58" y1="82" x2="522" y2="82" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Left Y Axis Labels (Posts: 0..1000 -> 150px, 0.15px per post) -->
  <text x="52" y="236" text-anchor="end" font-size="10.5" fill="#6b7280">0</text>
  <text x="52" y="198" text-anchor="end" font-size="10.5" fill="#6b7280">250</text>
  <text x="52" y="161" text-anchor="end" font-size="10.5" fill="#6b7280">500</text>
  <text x="52" y="123" text-anchor="end" font-size="10.5" fill="#6b7280">750</text>
  <text x="52" y="86" text-anchor="end" font-size="10.5" fill="#6b7280">1000</text>

  <!-- Right Y Axis Labels (Pct: 0%..80% -> 150px, 1.875px per 1%) -->
  <text x="528" y="236" text-anchor="start" font-size="10.5" fill="#2563eb">0%</text>
  <text x="528" y="198" text-anchor="start" font-size="10.5" fill="#2563eb">20%</text>
  <text x="528" y="161" text-anchor="start" font-size="10.5" fill="#2563eb">40%</text>
  <text x="528" y="123" text-anchor="start" font-size="10.5" fill="#2563eb">60%</text>
  <text x="528" y="86" text-anchor="start" font-size="10.5" fill="#2563eb">80%</text>

  <!-- Bars: 942, 524, 360, 316, 391, 237 -->
  <rect x="83"  y="90.7"  width="38" height="141.3" rx="3" fill="#cbd5e1"/>
  <rect x="158" y="153.4" width="38" height="78.6"  rx="3" fill="#cbd5e1"/>
  <rect x="233" y="178.0" width="38" height="54.0"  rx="3" fill="#cbd5e1"/>
  <rect x="308" y="184.6" width="38" height="47.4"  rx="3" fill="#cbd5e1"/>
  <rect x="383" y="173.3" width="38" height="58.7"  rx="3" fill="#cbd5e1"/>
  <rect x="458" y="196.4" width="38" height="35.6"  rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>

  <!-- Bar Value Labels -->
  <text x="102" y="85"  text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">942</text>
  <text x="177" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">524</text>
  <text x="252" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">360</text>
  <text x="327" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">316</text>
  <text x="402" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">391</text>
  <text x="477" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">237</text>

  <!-- X Axis Year Labels -->
  <text x="102" y="250" text-anchor="middle" font-size="11.5" fill="#111827">2021.11</text>
  <text x="177" y="250" text-anchor="middle" font-size="11.5" fill="#111827">2022.11</text>
  <text x="252" y="250" text-anchor="middle" font-size="11.5" fill="#111827">2023.11</text>
  <text x="327" y="250" text-anchor="middle" font-size="11.5" fill="#111827">2024.11</text>
  <text x="402" y="250" text-anchor="middle" font-size="11.5" fill="#111827">2025.11</text>
  <text x="477" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111827">2026.11</text>

  <!-- AI Pct Line (y = 232 - pct * 1.875):
       2021: 13.0% -> 207.6
       2022: 21.9% -> 190.9
       2023: 27.8% -> 179.9
       2024: 41.8% -> 153.6
       2025: 58.1% -> 123.1
       2026: 62.0% -> 115.8
  -->
  <polyline points="102,207.6 177,190.9 252,179.9 327,153.6 402,123.1 477,115.8" fill="none" stroke="#2563eb" stroke-width="2.6"/>
  <circle cx="102" cy="207.6" r="4" fill="#2563eb"/>
  <circle cx="177" cy="190.9" r="4" fill="#2563eb"/>
  <circle cx="252" cy="179.9" r="4" fill="#2563eb"/>
  <circle cx="327" cy="153.6" r="4" fill="#2563eb"/>
  <circle cx="402" cy="123.1" r="4" fill="#2563eb"/>
  <circle cx="477" cy="115.8" r="4.5" fill="#2563eb"/>

  <text x="102" y="200" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1d4ed8">13.0%</text>
  <text x="177" y="205" text-anchor="middle" font-size="10" fill="#1d4ed8">21.9%</text>
  <text x="252" y="194" text-anchor="middle" font-size="10" fill="#1d4ed8">27.8%</text>
  <text x="327" y="146" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1d4ed8">41.8%</text>
  <text x="402" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1d4ed8">58.1%</text>
  <text x="477" y="107" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">62.0%</text>

  <!-- Disambiguated AI Agent / MCP Pct Line (y = 232 - pct * 1.875):
       2021: 0.1%  -> 231.8
       2022: 0.4%  -> 231.3
       2023: 1.9%  -> 228.4
       2024: 2.5%  -> 227.3
       2025: 18.7% -> 196.9
       2026: 24.1% -> 186.8
  -->
  <polyline points="102,231.8 177,231.3 252,228.4 327,227.3 402,196.9 477,186.8" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="5 3"/>
  <circle cx="102" cy="231.8" r="3.2" fill="#dc2626"/>
  <circle cx="177" cy="231.3" r="3.2" fill="#dc2626"/>
  <circle cx="252" cy="228.4" r="3.2" fill="#dc2626"/>
  <circle cx="327" cy="227.3" r="3.5" fill="#dc2626"/>
  <circle cx="402" cy="196.9" r="4"   fill="#dc2626"/>
  <circle cx="477" cy="186.8" r="4.5" fill="#dc2626"/>

  <text x="327" y="222" text-anchor="middle" font-size="9.5" fill="#b91c1c">2.5%</text>
  <text x="402" y="212" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">18.7%</text>
  <text x="477" y="179" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">24.1%</text>

  <!-- Bottom Note -->
  <text x="290" y="270" text-anchor="middle" font-size="10.5" fill="#4b5563">帖量较 2021 峰值缩水 74.8%（创 2014 年以来同期新低），62.0% 提及 AI、24.1% 提及 AI Agent/MCP</text>
</svg>

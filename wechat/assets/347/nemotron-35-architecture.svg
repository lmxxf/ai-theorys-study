<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="WenQuanYi Micro Hei, Noto Sans CJK SC, sans-serif">
  <!-- Background -->
  <rect width="960" height="660" fill="#f8fafc" rx="12"/>
  
  <!-- Header -->
  <rect x="20" y="16" width="920" height="58" rx="8" fill="#1e293b"/>
  <text x="480" y="42" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">NVIDIA Nemotron 3.5 Super VL (120B-A12B) 全景架构解剖图</text>
  <text x="480" y="62" font-size="12" fill="#94a3b8" text-anchor="middle">总参数 120B（MoE 专家占 112.7B = 94%）｜每词元激活 12B｜NVFP4 混合精度（平均 4.82 bit）静态体积 69.86 GiB</text>

  <!-- Left Column: Multimodal Frontend -->
  <g transform="translate(20, 88)">
    <rect width="275" height="365" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="275" height="32" rx="8" fill="#0f766e"/>
    <text x="137.5" y="21" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">① 视觉前厅：自研塔 + 开源桥</text>

    <!-- Step 1: C-RADIO -->
    <rect x="12" y="44" width="251" height="58" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="20" y="63" font-size="11.5" font-weight="bold" fill="#115e59">C-RADIO 视觉塔（ViT-Huge 32层）</text>
    <text x="20" y="80" font-size="10.5" fill="#334155">• patch=16，隐藏维 1280，含 3 cls + 7 reg</text>
    <text x="20" y="95" font-size="10.5" fill="#334155">• 视频：EVS 相邻帧余弦相似度剪掉 70% 块</text>

    <!-- Arrow -->
    <path d="M137.5 102 L137.5 116" stroke="#0f766e" stroke-width="1.5"/>

    <!-- Step 2: Megatron Bug LayerNorm -->
    <rect x="12" y="118" width="251" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="20" y="136" font-size="11.5" font-weight="bold" fill="#991b1b">【祖传乌龙】vision_final_layernorm</text>
    <text x="20" y="153" font-size="10" fill="#7f1d1d">Megatron 开 MTP 时误给视觉塔加了 LN [1280]</text>

    <path d="M137.5 166 L137.5 180" stroke="#0f766e" stroke-width="1.5"/>

    <!-- Step 3: InternVL Pixel Shuffle -->
    <rect x="12" y="182" width="251" height="60" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="20" y="200" font-size="11.5" font-weight="bold" fill="#115e59">借 InternVL：2×2 像素洗牌下采样</text>
    <text x="20" y="217" font-size="10.5" fill="#334155">• 空间 token 数砍掉 3/4，通道维 ×4</text>
    <text x="20" y="233" font-size="10" fill="#0f766e" font-weight="bold">• [H/16, W/16, 1280] → [H/32, W/32, 5120]</text>

    <path d="M137.5 242 L137.5 256" stroke="#0f766e" stroke-width="1.5"/>

    <!-- Step 4: MLP1 Projector -->
    <rect x="12" y="258" width="251" height="54" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="20" y="276" font-size="11.5" font-weight="bold" fill="#115e59">投影层 mlp1（RMSNorm + ReLU²）</text>
    <text x="20" y="293" font-size="10" fill="#334155">• linear1 [20480, 5120] → linear2 [4096, 20480]</text>
    <text x="20" y="307" font-size="10" fill="#64748b">• masked_scatter 填入 &lt;image&gt; (token id=18)</text>

    <!-- Zombie Audio Note -->
    <rect x="12" y="320" width="251" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,3"/>
    <text x="20" y="341" font-size="10.5" fill="#64748b">【注】源码残留 Parakeet 音频模块（config 设 null）</text>
  </g>

  <!-- Center Column: 88-Block Hybrid Backbone -->
  <g transform="translate(308, 88)">
    <rect width="344" height="365" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="344" height="32" rx="8" fill="#1d4ed8"/>
    <text x="172" y="21" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">② 语言主干：88 个平级模块（4096 维）</text>

    <!-- Sequence Formula -->
    <rect x="12" y="42" width="320" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="172" y="59" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">32 组 [Mamba → MoE] + 8 组 [Mamba → Attn → MoE]</text>
    <text x="172" y="77" font-size="10.5" fill="#3b82f6" text-anchor="middle">共 40 层 Mamba-2 ＋ 8 层 Attention ＋ 40 层 Latent MoE ＝ 88 层</text>

    <!-- Block A: Mamba-2 -->
    <rect x="12" y="96" width="320" height="72" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="20" y="114" font-size="11.5" font-weight="bold" fill="#0f172a">Mamba-2 模块（40 层，NVFP4 版存为 FP8）</text>
    <text x="20" y="131" font-size="10" fill="#334155">• in [18560, 4096] → conv1d [10240, 1, 4] → out [4096, 8192]</text>
    <text x="20" y="147" font-size="10" fill="#334155">• 128 个头 × 64 维，状态固定 ssm_state=128（不随长度增长）</text>
    <text x="20" y="162" font-size="10" fill="#b45309">• 单机省内存：状态从 FP32 砍成 FP16 + 随机舍入（+SR）</text>

    <!-- Block B: GQA Attention -->
    <rect x="12" y="176" width="320" height="72" rx="6" fill="#fefce8" stroke="#fde047"/>
    <text x="20" y="194" font-size="11.5" font-weight="bold" fill="#854d0e">GQA 注意力模块（仅第 7/16/25/36/47/58/69/78 共 8 层）</text>
    <text x="20" y="211" font-size="10" fill="#334155">• q_proj [4096, 4096]（32 头），k/v_proj [256, 4096]（仅 2 头）</text>
    <text x="20" y="227" font-size="10" fill="#334155">• 16:1 分组共享 ＋ 无旋转位置编码（NoPE，靠 Mamba 记顺序）</text>
    <text x="20" y="242" font-size="10" font-weight="bold" fill="#a16207">• 全网 1M 上下文 FP8 KV 缓存仅 4 GiB（NVFP4 下仅 2.25 GiB）</text>

    <!-- Block C: Latent MoE -->
    <rect x="12" y="256" width="320" height="98" rx="6" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="20" y="274" font-size="11.5" font-weight="bold" fill="#5b21b6">Latent MoE 潜空间混合专家（40 层，占全模型 94% 参数）</text>
    <text x="20" y="291" font-size="10" fill="#334155">• 借 DeepSeek-V3 路由：512 选 22（8 组受限 + 偏置项修正）</text>
    <text x="20" y="307" font-size="10" fill="#5b21b6" font-weight="bold">• 缩骨功：fc1_latent_proj [1024, 4096] 先压扁 4 倍到 1024 维</text>
    <text x="20" y="323" font-size="10" fill="#334155">• 512 专家住 1024 维：up [2688, 1024] + ReLU² + down [1024, 2688]</text>
    <text x="20" y="339" font-size="10" fill="#334155">• fc2_latent_proj [4096, 1024] 升维 ＋ 1 个共享专家 [5376, 4096]</text>
  </g>

  <!-- Right Column: Speculative Decoding & Chinese Teachers -->
  <g transform="translate(665, 88)">
    <rect width="275" height="365" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="275" height="32" rx="8" fill="#7c2d12"/>
    <text x="137.5" y="21" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">③ 投机草稿头 ＋ 中国名师团</text>

    <!-- Speculative Decoding -->
    <rect x="12" y="44" width="251" height="132" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="20" y="62" font-size="11.5" font-weight="bold" fill="#9a3412">双轨投机解码（高并发 vs 单机低并发）</text>
    <text x="20" y="79" font-size="10.5" fill="#334155">① 内置 DeepSeek 式递归 MTP（高并发用）：</text>
    <text x="28" y="94" font-size="10" fill="#475569">enorm+hnorm 拼 8192 → eh_proj [4096, 8192]</text>
    <text x="28" y="108" font-size="10" fill="#475569">接 1 层 Attention + 1 层 Latent MoE 递归猜词</text>
    <text x="20" y="125" font-size="10.5" fill="#334155">② 外挂并行草稿头（Spark 单机/低并发用）：</text>
    <text x="28" y="140" font-size="10" fill="#9a3412" font-weight="bold">• Super 配 LiLiCorr（1.13B，DFlash2 机身）</text>
    <text x="28" y="154" font-size="10" fill="#475569">• 一次并猜 7 槽×Top8，余弦相似度串成句</text>
    <text x="28" y="168" font-size="10" fill="#475569">• 30B Lightning 配 DFlash 与 DSpark</text>

    <!-- Chinese Teachers -->
    <rect x="12" y="186" width="251" height="166" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="20" y="204" font-size="11.5" font-weight="bold" fill="#991b1b">后训练配料表：四大中国开源家族喂招</text>
    <text x="20" y="222" font-size="10.5" fill="#334155">• 视觉图表/GUI 数据：<tspan font-weight="bold" fill="#b91c1c">Qwen3.5</tspan></text>
    <text x="20" y="238" font-size="10.5" fill="#334155">• 视觉工具/视频轨迹：<tspan font-weight="bold" fill="#b91c1c">Kimi K2.6 &amp; K3</tspan></text>
    <text x="20" y="254" font-size="10.5" fill="#334155">• 数学/STEM 思维链：<tspan font-weight="bold" fill="#b91c1c">Kimi K3</tspan></text>
    <text x="20" y="270" font-size="10.5" fill="#334155">• 数学定理证明轨迹：<tspan font-weight="bold" fill="#b91c1c">DeepSeek-V4-Pro</tspan></text>
    <text x="20" y="286" font-size="10.5" fill="#334155">• 算法竞赛编程轨迹：<tspan font-weight="bold" fill="#b91c1c">GLM-5.2</tspan></text>
    <text x="20" y="302" font-size="10.5" fill="#334155">• 长文翻译 &amp; RL 判卷：<tspan font-weight="bold" fill="#b91c1c">DeepSeek-V4-Flash</tspan></text>
    <text x="20" y="318" font-size="10.5" fill="#334155">• vLLM 工具解析器：<tspan font-weight="bold" fill="#b91c1c">qwen3_coder</tspan></text>
    <text x="20" y="338" font-size="10" fill="#64748b">＋ 老黄自产：Gemma-4 翻译 2.83T 印度语续训</text>
  </g>

  <!-- Bottom Bar: 128GB Spark Unified Memory Account -->
  <g transform="translate(20, 468)">
    <rect width="920" height="174" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="920" height="30" rx="8" fill="#334155"/>
    <text x="460" y="20" font-size="13.5" font-weight="bold" fill="#ffffff" text-anchor="middle">④ 为什么偏偏是 120B？单台 DGX Spark / RTX Spark（128 GiB 统一内存）的内存分配</text>

    <!-- Memory Bar Visual -->
    <g transform="translate(24, 44)">
      <!-- Total 128 GiB bar = 872px wide -->
      <rect x="0" y="0" width="476" height="38" fill="#3b82f6" rx="4"/>
      <text x="238" y="17" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">NVFP4 本体权重：69.86 GiB (75.01 GB)</text>
      <text x="238" y="32" font-size="10.5" fill="#dbeafe" text-anchor="middle">仅 MoE 压 FP4；Mamba/Attn 留 FP8；潜投影/视觉/MTP 留 BF16</text>

      <rect x="478" y="0" width="12" height="38" fill="#f59e0b"/>
      
      <rect x="492" y="0" width="162" height="38" fill="#10b981"/>
      <text x="573" y="17" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">KV + Mamba 缓存 &amp; 激活</text>
      <text x="573" y="32" font-size="10" fill="#d1fae5" text-anchor="middle">仅剩约 24.9 GiB 余量</text>

      <rect x="656" y="0" width="216" height="38" fill="#64748b" rx="4"/>
      <text x="764" y="17" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">系统 / CPU / mmap 预留：32 GiB</text>
      <text x="764" y="32" font-size="10" fill="#e2e8f0" text-anchor="middle">--gpu-memory-utilization 0.75</text>
    </g>

    <!-- Explanations below bar -->
    <text x="24" y="106" font-size="11.5" fill="#1e293b">• <tspan font-weight="bold" fill="#d97706">橙色窄条（1.23 GiB）</tspan>：外挂 LiLiCorr 投机草稿头（1.13B 参数 + 0.54B 目标词表头副本），合计静态权重占去 <tspan font-weight="bold">71.09 GiB</tspan>。</text>
    <text x="24" y="126" font-size="11.5" fill="#1e293b">• <tspan font-weight="bold" fill="#dc2626">单机妥协三连（官方 GB10 专属启动脚本）</tspan>：① 并发锁死 <tspan font-weight="bold" fill="#b91c1c">--max-num-seqs 1</tspan>；② Mamba 状态从 FP32 砍成 <tspan font-weight="bold" fill="#b91c1c">float16 + 随机舍入</tspan>；</text>
    <text x="36" y="145" font-size="11.5" fill="#1e293b">③ 海报大字写「1M 上下文」，但 LiLiCorr 部署配置偷偷把上下文上限设为 <tspan font-weight="bold" fill="#b91c1c">114,688（约 112K）</tspan>——再大一点，128GB 单机直接爆显存。</text>
    <text x="24" y="164" font-size="11.5" fill="#475569">• <tspan font-weight="bold">对比国产同级</tspan>：吞吐量靠 8 层 Attention 刷到 Qwen3.8 的 1.9 倍，但老黄自测离线 Terminal Bench 4 仅得 <tspan font-weight="bold" fill="#b91c1c">1 分</tspan>（Qwen3.8 为 20.71，GLM-5.3 为 15.15）。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 640">
  <style>
    text { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; }
    .ttl { font-size: 19px; font-weight: bold; fill: #0f172a; }
    .sub { font-size: 13px; fill: #64748b; }
    .lab { font-size: 13px; fill: #334155; }
    .dim { font-size: 12px; fill: #7c3aed; font-weight: bold; }
    .note { font-size: 13px; fill: #0f766e; }
    .big { font-size: 15px; font-weight: bold; fill: #0f172a; }
  </style>

  <rect width="1010" height="640" fill="#fdfdfb"/>

  <!-- ============ CASE 1: lm_head ============ -->
  <text x="40" y="44" class="ttl">① 出口给全词表打分</text>
  <text x="240" y="44" class="sub">[4096] · [4096, 129280] → [129280]</text>

  <!-- 输入行向量：高度对齐 W 的 4096 行，让"输入维数 = W 的行数"可见 -->
  <text x="40" y="76" class="lab">残差流向量 x　一行，4096 个数</text>
  <text x="40" y="96" class="sub">竖着画，好和右边 W 的行数对齐看——输入几个数，W 就得有几行</text>
  <rect x="62" y="146" width="18" height="58" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <path d="M84 150 L92 150 M88 150 L88 200 M84 200 L92 200" stroke="#3b82f6" stroke-width="1"/>
  

  <!-- W 矩阵：极扁的横条，宽度按 129280:4096 ≈ 31.6:1 示意 -->
  <text x="40" y="136" class="lab">出口矩阵 W</text>
  <rect x="106" y="146" width="700" height="58" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- 竖线密集，示意 129280 列 -->
  <g stroke="#ca8a04" stroke-width="0.6" opacity="0.55">
    <path d="M118 146 V204 M130 146 V204 M142 146 V204 M154 146 V204 M166 146 V204 M178 146 V204 M190 146 V204 M202 146 V204 M214 146 V204 M226 146 V204 M238 146 V204 M250 146 V204 M262 146 V204 M274 146 V204 M286 146 V204 M298 146 V204 M310 146 V204 M322 146 V204 M334 146 V204 M346 146 V204 M358 146 V204 M370 146 V204 M382 146 V204 M394 146 V204 M406 146 V204 M418 146 V204 M430 146 V204 M442 146 V204 M454 146 V204 M466 146 V204 M478 146 V204 M490 146 V204 M502 146 V204 M514 146 V204 M526 146 V204 M538 146 V204 M550 146 V204 M562 146 V204 M574 146 V204 M586 146 V204 M598 146 V204 M610 146 V204 M622 146 V204 M634 146 V204 M646 146 V204 M658 146 V204 M670 146 V204 M682 146 V204 M694 146 V204 M706 146 V204 M718 146 V204 M730 146 V204 M742 146 V204 M754 146 V204 M766 146 V204 M778 146 V204 M790 146 V204"/>
  </g>

  <!-- 高亮其中一列 -->
  <rect x="418" y="146" width="12" height="58" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
  <path d="M424 214 L424 232" stroke="#92400e" stroke-width="1.5"/>
  <text x="424" y="248" text-anchor="middle" class="note">这一列 = 一个候选词的“标准像”（4096 个数）</text>

  <!-- 尺寸标注 -->
  <path d="M106 216 L106 224 M106 220 L806 220 M806 216 L806 224" stroke="#7c3aed" stroke-width="1"/>
  <text x="390" y="238" text-anchor="middle" class="dim" opacity="0">x</text>
  <text x="822" y="178" class="dim">129280 列</text>
  <text x="99" y="175" class="dim" transform="rotate(-90 99 175)" text-anchor="middle">4096 行</text>

  <text x="40" y="276" class="big">竖着看：12 万 9 千个打分器，各问一句“你像不像我”</text>

  <line x1="40" y1="296" x2="970" y2="296" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ============ CASE 2: attention ============ -->
  <text x="40" y="336" class="ttl">② 注意力算分</text>
  <text x="180" y="336" class="sub">生成第 9 个 token 这一步　q · K^T　（每头 d = 64，前面已有 8 个 token）</text>

  <!-- K 原始：横着存 -->
  <text x="40" y="374" class="lab">K 存进来时 [8, 64]</text>
  <text x="40" y="392" class="sub">每行 = 一个 token 的 k</text>
  <g>
    <rect x="40" y="402" width="170" height="112" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <g stroke="#16a34a" stroke-width="0.8" opacity="0.5">
      <path d="M40 416 H210 M40 430 H210 M40 444 H210 M40 458 H210 M40 472 H210 M40 486 H210 M40 500 H210"/>
    </g>
    <rect x="40" y="430" width="170" height="14" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  </g>
  <text x="125" y="534" text-anchor="middle" class="dim">64 列</text>
  <text x="30" y="458" class="dim" transform="rotate(-90 30 458)" text-anchor="middle">8 行</text>

  <!-- 转置箭头 -->
  <path d="M228 452 L278 452" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="253" y="440" text-anchor="middle" class="dim" fill="#dc2626">转置</text>
  <text x="253" y="476" text-anchor="middle" class="sub" fill="#dc2626">行立起来</text>
  <text x="253" y="492" text-anchor="middle" class="sub" fill="#dc2626">变成列</text>

  <!-- q 向量：只有一行！ -->
  <text x="309" y="392" text-anchor="middle" class="lab" fill="#b45309">q</text>
  <rect x="300" y="402" width="18" height="190" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <text x="309" y="612" text-anchor="middle" class="dim" fill="#ea580c">1 行</text>
  

  <text x="330" y="500" class="dim" fill="#334155">·</text>

  <!-- K^T：竖着 -->
  <text x="348" y="374" class="lab">K^T 用的时候 [64, 8]</text>
  <text x="348" y="392" class="sub">每列 = 一个 token 的 k</text>
  <g>
    <rect x="348" y="402" width="112" height="190" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <g stroke="#16a34a" stroke-width="0.8" opacity="0.5">
      <path d="M362 402 V592 M376 402 V592 M390 402 V592 M404 402 V592 M418 402 V592 M432 402 V592 M446 402 V592"/>
    </g>
    <rect x="376" y="402" width="14" height="190" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  </g>
  <text x="404" y="612" text-anchor="middle" class="dim">8 列</text>
  <text x="476" y="497" class="dim" transform="rotate(-90 476 497)" text-anchor="middle">64 行</text>

  <!-- = 分数 -->
  <text x="500" y="500" class="dim" fill="#334155" font-size="16">=</text>
  <text x="529" y="392" text-anchor="middle" class="lab" fill="#b45309">分数</text>
  <g>
    <rect x="520" y="402" width="18" height="190" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <g stroke="#ea580c" stroke-width="0.8" opacity="0.6">
      <path d="M520 426 H538 M520 450 H538 M520 474 H538 M520 498 H538 M520 522 H538 M520 546 H538 M520 570 H538"/>
    </g>
    <rect x="520" y="450" width="18" height="24" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  </g>
  <text x="529" y="612" text-anchor="middle" class="dim" fill="#ea580c">8 个</text>

  <!-- 说明 -->
  <text x="580" y="424" class="big">一个 q，问前面所有的 k</text>
  <text x="580" y="452" class="note">生成下一个字的时候，Q 这边只有一行——</text>
  <text x="580" y="472" class="note">就是当前位置这一个 q。不是所有 q 一起算。</text>
  <text x="580" y="504" class="note">它跟已经存下的 8 个 k 各点一次积，</text>
  <text x="580" y="524" class="note">得到 8 个分数：“我该看前面哪几个字”。</text>
  <text x="580" y="556" class="lab">深色那一对：这个 q 和第 3 个 k 点出第 3 个分数</text>
  <text x="580" y="584" class="sub">（训练时才是一整摞 q 同时算，那是另一张图）</text>
</svg>

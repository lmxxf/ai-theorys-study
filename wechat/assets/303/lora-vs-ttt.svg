<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0d9488"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
    .ttl { font-size: 19px; font-weight: bold; fill: #0f172a; }
    .sub { font-size: 12px; fill: #64748b; }
    .box { font-size: 13px; fill: #1e293b; }
    .tag { font-size: 11px; fill: #64748b; }
    .note { font-size: 12px; fill: #334155; }
  </style>

  <rect width="900" height="640" fill="#fbfbfd"/>

  <!-- ============ LEFT: LoRA ============ -->
  <text x="30" y="38" class="ttl">LoRA：并排挂</text>
  <text x="30" y="58" class="sub">原来那条路照走，旁边加一条，两个结果相加</text>

  <!-- 主路 -->
  <rect x="60" y="96" width="120" height="40" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="120" y="121" text-anchor="middle" class="box">输入 x</text>

  <rect x="60" y="186" width="120" height="48" rx="5" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="206" text-anchor="middle" class="box">原权重 W</text>
  <text x="120" y="224" text-anchor="middle" class="tag">冻住不动</text>

  <!-- 旁路 -->
  <rect x="240" y="176" width="110" height="34" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="295" y="198" text-anchor="middle" class="box">矩阵 A</text>
  <rect x="240" y="222" width="110" height="34" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="295" y="244" text-anchor="middle" class="box">矩阵 B</text>
  <text x="330" y="278" text-anchor="start" class="tag">微调时学，部署后也冻住</text>

  <!-- 汇合 -->
  <circle cx="180" cy="310" r="17" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="180" y="316" text-anchor="middle" class="box">＋</text>

  <rect x="120" y="366" width="120" height="40" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="180" y="391" text-anchor="middle" class="box">输出</text>

  <!-- 连线 -->
  <path fill="none" d="M120 136 L120 186" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path fill="none" d="M180 116 L295 116 L295 176" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path fill="none" d="M295 210 L295 222" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path fill="none" d="M120 234 L120 310 L163 310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path fill="none" d="M295 256 L295 310 L197 310" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path fill="none" d="M180 327 L180 366" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 说明 -->
  <rect x="40" y="436" width="340" height="96" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="58" y="460" class="note">· 什么都没被替换掉，是加了个补丁</text>
  <text x="58" y="482" class="note">· A 和 B 的身份是「参数」，训完存进文件</text>
  <text x="58" y="504" class="note">· 加载之后一直不变，跟原权重一起用</text>
  <text x="58" y="524" class="note">· 第五章那两篇 2026 年的工作，改的就是它</text>

  <!-- 分隔线 -->
  <line x1="450" y1="30" x2="450" y2="600" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- ============ RIGHT: TTT ============ -->
  <text x="490" y="38" class="ttl">TTT：顺序挂</text>
  <text x="490" y="58" class="sub">自注意力那一层整个被换掉，数据从它中间穿过去</text>

  <rect x="590" y="96" width="120" height="40" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="650" y="121" text-anchor="middle" class="box">输入 x</text>

  <!-- TTT 层 -->
  <rect x="510" y="176" width="280" height="150" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="650" y="198" text-anchor="middle" class="box" font-weight="bold">TTT 层（原来这儿是自注意力）</text>

  <rect x="530" y="212" width="72" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="566" y="232" text-anchor="middle" class="tag">三个投影</text>
  <text x="566" y="256" text-anchor="middle" class="tag">预训练学完</text>
  <text x="566" y="272" text-anchor="middle" class="tag">就冻住</text>

  <rect x="638" y="212" width="130" height="46" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="703" y="231" text-anchor="middle" class="box">小模型 W</text>
  <text x="703" y="249" text-anchor="middle" class="tag">读 16 个词更新一次</text>

  <path fill="none" d="M703 262 C 640 282, 620 240, 636 232" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <text x="712" y="288" text-anchor="middle" class="tag">自己给自己做梯度下降</text>
  <text x="712" y="306" text-anchor="middle" class="tag">序列结束就清零</text>

  <path fill="none" d="M602 227 L638 227" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="590" y="366" width="120" height="40" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="650" y="391" text-anchor="middle" class="box">输出</text>

  <path fill="none" d="M650 136 L650 176" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path fill="none" d="M650 326 L650 366" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="500" y="436" width="340" height="96" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="518" y="460" class="note">· 自注意力被整个换掉，不是打补丁</text>
  <text x="518" y="482" class="note">· 小 W 的身份是「隐状态」，不存盘</text>
  <text x="518" y="504" class="note">· 每读一段就变一次，边用边学</text>
  <text x="518" y="524" class="note">· 但下一条序列从同一个起点重来</text>

  <!-- 底部一句话 -->
  <rect x="40" y="558" width="800" height="52" rx="6" fill="#1e293b"/>
  <text x="440" y="580" text-anchor="middle" fill="#f8fafc" font-size="14">同样是一小块矩阵：LoRA 拿它当参数，训完存下来；TTT 拿它当隐状态，用完就扔。</text>
  <text x="440" y="600" text-anchor="middle" fill="#94a3b8" font-size="12">差别不在怎么挂，在存不存盘。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 374" width="540" height="374" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="540" height="374" fill="#ffffff" />

  <rect x="16" y="16" width="508" height="342" rx="10" fill="#f0fdf4" />
  <rect x="16" y="16" width="6" height="342" rx="3" fill="#16a34a" />

  <text x="38" y="45" font-size="16" font-weight="bold" fill="#15803d">盲选第 1/5,120 名冠军轴原始激活 z：myself / my / 我</text>
  <text x="38" y="66" font-size="11.4" fill="#475569">原始激活 z（L37–L46 连续 10 层全由 myself 领头且 9/9 切开）：绿=自称 A2，橙=贬称 B</text>

  <!-- 1z = 15px, x0 = 132 -->
  <text x="132" y="81" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#15803d">z = 0</text>
  <line x1="132" y1="86" x2="132" y2="306" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- L29 C502: A2=+16.84 (253px), B=+3.43 (51px) -->
  <text x="38" y="106" font-size="13" font-weight="bold" fill="#166534">L29 C502</text>
  <rect x="132" y="90" width="253" height="14" rx="3" fill="#16a34a" />
  <text x="393" y="102" font-size="12" font-weight="bold" fill="#15803d">+16.84</text>
  <rect x="132" y="106" width="51" height="12" rx="2" fill="#f59e0b" />
  <text x="190" y="116" font-size="11" fill="#b45309">+3.43</text>

  <!-- L35 C416: A2=+13.35 (200px), B=+1.38 (21px) -->

  <rect x="132" y="150" width="21" height="12" rx="2" fill="#f59e0b" />
  <text x="160" y="160" font-size="11" fill="#b45309">+1.38</text>

  <!-- L42 C368: A2=+15.93 (239px), B=+1.17 (18px) -->
  <text x="38" y="194" font-size="13" font-weight="bold" fill="#166534">L42 C368</text>
  <rect x="132" y="178" width="239" height="14" rx="3" fill="#16a34a" />
  <text x="379" y="190" font-size="12" font-weight="bold" fill="#15803d">+15.93</text>
  <rect x="132" y="194" width="18" height="12" rx="2" fill="#f59e0b" />
  <text x="157" y="204" font-size="11" fill="#b45309">+1.17</text>

  <!-- L45 C523: A2=+15.87 (238px), B=+1.90 (29px) -->
  <text x="38" y="238" font-size="13" font-weight="bold" fill="#166534">L45 C523</text>
  <rect x="132" y="222" width="238" height="14" rx="3" fill="#16a34a" />

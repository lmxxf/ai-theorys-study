<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 406" width="840" height="406" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="840" height="406" fill="#ffffff" />

  <text x="420" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">百二十回《红楼梦》对勘鲁迅杂文：体面回话里的「奴才」就是无痛的「我」</text>
  <text x="420" y="48" text-anchor="middle" font-size="12" fill="#4b5563">整部《红楼梦》在 v3 拟合与评测期均已预屏蔽零泄露 · 严格截取目标词左侧原著上文</text>

  <!-- 左栏：贬损评价轴验光 (1z = 14px) -->
  <rect x="24" y="68" width="388" height="318" rx="8" fill="#f8fafc" />
  <rect x="24" y="68" width="5" height="318" rx="2" fill="#0284c7" />
  <text x="42" y="92" font-size="13.5" font-weight="bold" fill="#0369a1">1. 贬损评价轴（L30 C846：侮辱 / 劣 / stupid）</text>
  <text x="42" y="111" font-size="11.5" fill="#475569">自称紧贴基线，唯翻脸痛骂与现代杂文高高拉升</text>

  <line x1="126" y1="122" x2="126" y2="266" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />

  <text x="42" y="142" font-size="11.5" fill="#334155">贾府回话 A2</text>
  <rect x="126" y="129" width="27" height="16" rx="3" fill="#38bdf8" />
  <text x="160" y="142" font-size="11" font-weight="bold" fill="#0369a1">+1.93（林之孝 / 平儿 / 李贵）</text>

  <text x="42" y="170" font-size="11.5" fill="#334155">清宫奏折 A1</text>
  <rect x="126" y="157" width="28" height="16" rx="3" fill="#0ea5e9" />
  <text x="161" y="170" font-size="11" font-weight="bold" fill="#0369a1">+2.02（曹家织造 / 杨宗仁折）</text>

  <text x="42" y="198" font-size="11.5" font-weight="bold" fill="#b45309">贾府痛骂 B</text>
  <rect x="126" y="185" width="101" height="16" rx="3" fill="#f59e0b" />
  <text x="234" y="198" font-size="11" font-weight="bold" fill="#b45309">+7.19（贾政 / 探春怒斥）</text>

  <text x="42" y="226" font-size="11.5" font-weight="bold" fill="#c2410c">雍正上谕斥责</text>
  <rect x="126" y="213" width="113" height="16" rx="3" fill="#ea580c" />
  <text x="246" y="226" font-size="11" font-weight="bold" fill="#c2410c">+8.10（包衣下贱奴才）</text>

  <text x="42" y="254" font-size="11.5" font-weight="bold" fill="#b91c1c">鲁迅杂文批判</text>
  <rect x="126" y="241" width="141" height="16" rx="3" fill="#dc2626" />
  <text x="274" y="254" font-size="11" font-weight="bold" fill="#b91c1c">+10.07（五篇杂文）</text>

  <text x="42" y="290" font-size="11" font-weight="bold" fill="#0f172a">同句原位换词校准：</text>
  <text x="42" y="310" font-size="10.8" fill="#334155">• 贾府自称换「小的」仅差 +0.28，比「下官」还低 -0.34</text>
  <text x="42" y="329" font-size="10.8" fill="#334155">• 奏折自称换「臣」仅差 +0.60（仅占现代正反跨度 3.7%）</text>
  <text x="42" y="348" font-size="10.8" fill="#64748b">• L18 C1376 贬损轴：奏折 0.00、贾府 -0.24；L45 C1564 跨 0</text>

  <!-- 右栏：第一人称代词冠军轴成对柱状图 (1z = 11.5px) -->
  <rect x="428" y="68" width="388" height="318" rx="8" fill="#f0fdf4" />
  <rect x="428" y="68" width="5" height="318" rx="2" fill="#16a34a" />
  <text x="446" y="92" font-size="13.5" font-weight="bold" fill="#15803d">2. 盲选第 1/5,120 名冠军轴：myself / my / 我</text>
  <text x="446" y="111" font-size="11.2" fill="#475569">连续 20 层冠军同构（跨回目 9/9 全切开）：绿=回话自称 A2，橙=痛骂 B</text>

  <line x1="522" y1="124" x2="522" y2="338" stroke="#86efac" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- L29 C502: A2=+16.84 (194px), B=+3.43 (39px) -->
  <text x="446" y="144" font-size="11.5" font-weight="bold" fill="#166534">L29 C502</text>
  <rect x="522" y="128" width="194" height="12" rx="2" fill="#16a34a" />
  <text x="722" y="138" font-size="10.5" font-weight="bold" fill="#15803d">+16.84</text>
  <rect x="522" y="142" width="39" height="10" rx="2" fill="#f59e0b" />
  <text x="567" y="151" font-size="10" fill="#b45309">+3.43</text>

  <!-- L35 C416: A2=+13.35 (154px), B=+1.38 (16px) -->
  <text x="446" y="186" font-size="11.5" font-weight="bold" fill="#166534">L35 C416</text>
  <rect x="522" y="170" width="154" height="12" rx="2" fill="#16a34a" />
  <text x="682" y="180" font-size="10.5" font-weight="bold" fill="#15803d">+13.35</text>
  <rect x="522" y="184" width="16" height="10" rx="2" fill="#f59e0b" />
  <text x="544" y="193" font-size="10" fill="#b45309">+1.38</text>

  <!-- L42 C368: A2=+15.93 (183px), B=+1.17 (13px) -->
  <text x="446" y="228" font-size="11.5" font-weight="bold" fill="#166534">L42 C368</text>
  <rect x="522" y="212" width="183" height="12" rx="2" fill="#16a34a" />
  <text x="711" y="222" font-size="10.5" font-weight="bold" fill="#15803d">+15.93</text>
  <rect x="522" y="226" width="13" height="10" rx="2" fill="#f59e0b" />
  <text x="541" y="235" font-size="10" fill="#b45309">+1.17</text>

  <!-- L45 C523: A2=+15.87 (183px), B=+1.90 (22px) -->
  <text x="446" y="270" font-size="11.5" font-weight="bold" fill="#166534">L45 C523</text>
  <rect x="522" y="254" width="183" height="12" rx="2" fill="#16a34a" />
  <text x="711" y="264" font-size="10.5" font-weight="bold" fill="#15803d">+15.87</text>
  <rect x="522" y="268" width="22" height="10" rx="2" fill="#f59e0b" />
  <text x="550" y="277" font-size="10" fill="#b45309">+1.90</text>

  <!-- L48 C335: A2=+17.59 (202px), B=+0.48 (6px) -->
  <text x="446" y="312" font-size="11.5" font-weight="bold" fill="#166534">L48 C335</text>
  <rect x="522" y="296" width="202" height="12" rx="2" fill="#16a34a" />
  <text x="730" y="306" font-size="10.5" font-weight="bold" fill="#15803d">+17.59</text>
  <rect x="522" y="310" width="6" height="10" rx="2" fill="#f59e0b" />
  <text x="534" y="319" font-size="10" fill="#b45309">+0.48</text>

  <text x="446" y="355" font-size="11" font-weight="bold" fill="#065f46">日常语感还原：体面回话自称早已代词化为制度性的「我」</text>
  <text x="446" y="373" font-size="10.8" fill="#475569">v3 语料榜首：英文自述 "I" 与孔鲤家训「鲤儿，我」</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 324" width="540" height="324" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="540" height="324" fill="#ffffff" />

  <rect x="16" y="16" width="508" height="292" rx="10" fill="#f8fafc" />
  <rect x="16" y="16" width="6" height="292" rx="3" fill="#2563eb" />

  <text x="38" y="45" font-size="16" font-weight="bold" fill="#1e40af">四种左文包裹对比：纯英文隔离舱反而最脏</text>
  <text x="38" y="66" font-size="11.6" fill="#475569">L10 及 L12–L48 共 38 层残留率 (卑鄙 − 微贱均分) ÷ 现代正反差 的中位数</text>

  <!-- 横向柱状条 (1% = 8.5px, 起点 x=178) -->
  <line x1="178" y1="82" x2="178" y2="234" stroke="#cbd5e1" stroke-width="1.4" />

  <text x="38" y="106" font-size="13.5" font-weight="bold" fill="#15803d">W2 千字《三国志》</text>
  <rect x="178" y="89" width="145" height="24" rx="4" fill="#16a34a" />
  <text x="332" y="106" font-size="13.5" font-weight="bold" fill="#15803d">17.0%（最干净）</text>

  <text x="38" y="146" font-size="13.5" fill="#334155">W1 百字《出师表》</text>
  <rect x="178" y="129" width="167" height="24" rx="4" fill="#3b82f6" />
  <text x="354" y="146" font-size="13.5" font-weight="bold" fill="#1e40af">19.6%</text>

  <text x="38" y="186" font-size="13.5" fill="#334155">W0 短句直喂基线</text>
  <rect x="178" y="169" width="179" height="24" rx="4" fill="#94a3b8" />
  <text x="366" y="186" font-size="13.5" fill="#475569">21.0%</text>

  <text x="38" y="226" font-size="13.5" font-weight="bold" fill="#b91c1c">W3a 纯英文导语舱</text>
  <rect x="178" y="209" width="218" height="24" rx="4" fill="#dc2626" />
  <text x="405" y="226" font-size="13.5" font-weight="bold" fill="#b91c1c">25.6%（最脏）</text>

  <text x="38" y="264" font-size="11.8" fill="#334155">• 全段含 L12–L20 浅层字面反射故中位数剩 17%；中深层单独看已归零</text>
  <text x="38" y="286" font-size="11.8" font-weight="bold" fill="#1e40af">• 英文导语切断中文后突现汉字掉回现代白话入口；唯长文言能稳住轨道</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="540" height="380" fill="#ffffff" />

  <rect x="16" y="16" width="508" height="348" rx="10" fill="#f0fdf4" />
  <rect x="16" y="16" width="6" height="348" rx="3" fill="#16a34a" />

  <text x="38" y="45" font-size="16" font-weight="bold" fill="#15803d">千字文言 W2 跨层走势：浅层惊跳 → 中深层归零</text>
  <text x="38" y="66" font-size="11.8" fill="#475569">0% 虚线 = 同句换成「微贱 / 浅陋 / 愚钝」的平均分（负值仅代表比微贱略低）</text>

  <!-- 零基线 x=254 (1% = 3.2px) -->
  <text x="254" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">0%（等同「微贱/浅陋」）</text>
  <line x1="254" y1="99" x2="254" y2="316" stroke="#15803d" stroke-width="1.6" stroke-dasharray="4 3" />

  <!-- Row 1: L16 C1821 (+35.6% -> 114px) -->
  <text x="38" y="119" font-size="13" font-weight="bold" fill="#b45309">L16 C1821</text>
  <text x="38" y="136" font-size="11" fill="#92400e">词牌：罪 / 罪行 / 邪 / evil</text>
  <rect x="254" y="112" width="114" height="18" rx="3" fill="#f59e0b" />
  <text x="376" y="126" font-size="11.8" font-weight="bold" fill="#b45309">+35.6%（字面惊跳）</text>

  <!-- Row 2: L30 C846 (-0.43% -> 3px left) -->
  <text x="38" y="163" font-size="13" font-weight="bold" fill="#15803d">L30 C846</text>
  <text x="38" y="180" font-size="11" fill="#166534">词牌：侮辱 / 劣 / stupid / nasty</text>
  <rect x="251" y="156" width="3" height="18" rx="1.5" fill="#16a34a" />
  <text x="263" y="170" font-size="11.8" font-weight="bold" fill="#15803d">-0.43%（卑鄙 4.05 ≈ 微贱 4.13）</text>

  <!-- Row 3: L38 C1448 (-4.8% -> 15px left) -->
  <text x="38" y="207" font-size="13" font-weight="bold" fill="#15803d">L38 C1448</text>
  <text x="38" y="224" font-size="11" fill="#166534">词牌：罪 / 受害者 / inflicted</text>
  <rect x="239" y="200" width="15" height="18" rx="3" fill="#22c55e" />
  <text x="263" y="214" font-size="11.8" fill="#166534">-4.8%（卑鄙 6.64 ≈ 微贱 7.05）</text>

  <!-- Row 4: L41 C1726 (+6.0% -> 19px right) -->
  <text x="38" y="251" font-size="13" font-weight="bold" fill="#15803d">L41 C1726</text>
  <text x="38" y="268" font-size="11" fill="#166534">词牌：不堪 / 不良 / damage</text>
  <rect x="254" y="244" width="19" height="18" rx="3" fill="#22c55e" />
  <text x="281" y="258" font-size="11.8" fill="#166534">+6.0%（短句 28.3%，W1 仅 1.5%）</text>

  <!-- Row 5: L45 C1564 (-1.9% -> 6px left) -->
  <text x="38" y="295" font-size="13" font-weight="bold" fill="#15803d">L45 C1564</text>
  <text x="38" y="312" font-size="11" fill="#166534">词牌：错误的 / incorrect / wrong</text>
  <rect x="248" y="288" width="6" height="18" rx="2" fill="#16a34a" />
  <text x="263" y="302" font-size="11.8" fill="#166534">-1.9%（中深层概念区彻底消噪）</text>

  <text x="38" y="344" font-size="11.8" font-weight="bold" fill="#065f46">• 调零规程：避开 L20 以下字面反射，锁死 L30–L45 概念区 + 千字古文</text>
</svg>

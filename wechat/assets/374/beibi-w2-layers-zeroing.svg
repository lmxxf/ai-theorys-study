<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 376" width="540" height="376" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="540" height="376" fill="#ffffff" />

  <rect x="16" y="16" width="508" height="344" rx="10" fill="#f0fdf4" />
  <rect x="16" y="16" width="6" height="344" rx="3" fill="#16a34a" />

  <text x="38" y="46" font-size="16.5" font-weight="bold" fill="#15803d">千字文言 W2 跨层走势：浅层惊跳 → 中深层归零</text>
  <text x="38" y="68" font-size="12.2" fill="#475569">左铺 2,369 词《三国志·诸葛亮传》· 对比同位古义词「微贱 / 浅陋 / 愚钝」</text>

  <!-- 零基线 x=264 (1% = 3.2px) -->
  <text x="264" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">0% 古义中性基线</text>
  <line x1="264" y1="99" x2="264" y2="314" stroke="#15803d" stroke-width="1.6" stroke-dasharray="4 3" />

  <!-- Row 1: L16 C1821 (+35.6% -> 114px) -->
  <text x="38" y="119" font-size="13" font-weight="bold" fill="#b45309">L16 C1821</text>
  <text x="38" y="136" font-size="11.2" fill="#92400e">词牌：罪 / 罪行 / 邪 / evil</text>
  <rect x="264" y="112" width="114" height="18" rx="3" fill="#f59e0b" />
  <text x="386" y="126" font-size="12" font-weight="bold" fill="#b45309">+35.6%（字面惊跳）</text>

  <!-- Row 2: L30 C846 (-0.43% -> 3px left) -->
  <text x="38" y="163" font-size="13" font-weight="bold" fill="#15803d">L30 C846</text>
  <text x="38" y="180" font-size="11.2" fill="#166534">词牌：侮辱 / 劣 / stupid / nasty</text>
  <rect x="261" y="156" width="3" height="18" rx="1.5" fill="#16a34a" />
  <text x="273" y="170" font-size="12" font-weight="bold" fill="#15803d">-0.43%（+4.05 ≈ +4.13）</text>

  <!-- Row 3: L38 C1448 (-4.8% -> 15px left) -->
  <text x="38" y="207" font-size="13" font-weight="bold" fill="#15803d">L38 C1448</text>
  <text x="38" y="224" font-size="11.2" fill="#166534">词牌：罪 / 受害者 / inflicted</text>
  <rect x="249" y="200" width="15" height="18" rx="3" fill="#22c55e" />
  <text x="273" y="214" font-size="12" fill="#166534">-4.8%（越过零点洗净）</text>

  <!-- Row 4: L41 C1726 (+6.0% -> 19px right) -->
  <text x="38" y="251" font-size="13" font-weight="bold" fill="#15803d">L41 C1726</text>
  <text x="38" y="268" font-size="11.2" fill="#166534">词牌：不堪 / 不良 / damage</text>

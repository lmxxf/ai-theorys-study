<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 584" width="560" height="584" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="560" height="584" fill="#ffffff" />

  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="280" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111827">清代中期宫廷三层「内外」同心圆与奏折错位</text>
  <text x="280" y="50" text-anchor="middle" font-size="11.8" fill="#475569">人的三圈身份 × 文书双轨制：杨宗仁恰好卡在「八旗内圈」与「外朝封疆」交界处</text>

  <!-- 同心椭圆中心 (280, 266) -->
  <!-- 第 3 圈（最外圈）：民籍汉臣 rx=264, ry=198 (top=68, bottom=464) -->
  <ellipse cx="280" cy="266" rx="264" ry="198" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <text x="280" y="106" text-anchor="middle" font-size="12.8" font-weight="bold" fill="#1e40af">最外圈 · 民籍外朝汉人文臣（不入旗「民人」）</text>
  <text x="280" y="124" text-anchor="middle" font-size="10.8" fill="#1e3a8a">张廷玉 / 纪晓岚：无论公私折奏只准称「臣」（无资格称奴才）</text>

  <!-- 第 2 圈（中间夹心圈）：外八旗正身旗人 rx=214, ry=138 (top=128, bottom=404) -->
  <ellipse cx="280" cy="266" rx="214" ry="138" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 4" />
  <text x="280" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">中间夹心圈 · 八旗旗员（满洲 / 蒙古 / 汉军八旗）</text>
  <text x="280" y="194" text-anchor="middle" font-size="10.2" fill="#78350f">对内务府属外任旗官；对民籍汉人属八旗「圈内人」（旧习常称奴才）</text>

  <!-- 第 1 圈（靶心最里圈）：内务府上三旗包衣 rx=106, ry=58 (top=214, bottom=330) -->
  <ellipse cx="280" cy="272" rx="106" ry="58" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2" />
  <text x="280" y="256" text-anchor="middle" font-size="12.8" font-weight="bold" fill="#991b1b">最里圈 · 内务府包衣</text>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#7f1d1d">满语 booi「家里的」</text>
  <text x="280" y="292" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#b91c1c">曹寅 / 李煦：天然称「奴才」</text>

  <!-- 左侧双轨之 1：外朝题本卡片与连线 -->
  <rect x="12" y="232" width="112" height="46" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" />
  <text x="68" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">外朝《题本》</text>
  <text x="68" y="269" text-anchor="middle" font-size="10.2" fill="#1e3a8a">国家公器 → 称「臣」</text>
  <path d="M 102 384 Q 68 370 68 284" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrBlue)" />

  <!-- 右侧双轨之 2：内廷密折卡片与直插靶心连线 -->
  <rect x="436" y="232" width="112" height="46" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.6" />
  <text x="492" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">直达御前《奏折》</text>
  <text x="492" y="269" text-anchor="middle" font-size="10.2" fill="#7f1d1d">内廷私请 → 称「奴才」?</text>
  <path d="M 458 384 Q 492 370 492 282" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="5 3" />
  <path d="M 436 258 L 392 262" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#arrRed)" />

  <!-- 杨宗仁夹缝交火锚点（宽胶囊完全包容两行字 x=102..458） -->
  <rect x="102" y="358" width="356" height="54" rx="27" fill="#ffffff" stroke="#b45309" stroke-width="2.2" />
  <text x="280" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">★ 杨宗仁：汉军正白旗人 × 湖广总督</text>
  <text x="280" y="399" text-anchor="middle" font-size="10.5" fill="#475569">称奴才切入管事/家族（L12 管事 · L28 家族）· 官职属封疆（L32 Governor）</text>

  <!-- 底部：康 → 雍 → 乾三朝三次拧方向盘时间轴 -->
  <rect x="20" y="474" width="520" height="94" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="280" y="495" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">康雍乾三朝对「旗籍大臣奏折称谓」的三阶段演变</text>

  <line x1="98" y1="518" x2="462" y2="518" stroke="#94a3b8" stroke-width="2" />

  <circle cx="98" cy="518" r="6" fill="#d97706" />
  <text x="98" y="539" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">康熙朝</text>
  <text x="98" y="556" text-anchor="middle" font-size="10.5" fill="#475569">旗员顺嘴称奴才套近乎</text>

  <circle cx="280" cy="518" r="7" fill="#1d4ed8" />
  <text x="280" y="539" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">雍正元年（1723）</text>
  <text x="280" y="556" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1d4ed8">圈改杨宗仁「称臣得体」</text>

  <circle cx="462" cy="518" r="6" fill="#dc2626" />
  <text x="462" y="539" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">乾隆二十三年（1758）</text>
  <text x="462" y="556" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">公事称臣 · 请安复称奴才</text>
</svg>

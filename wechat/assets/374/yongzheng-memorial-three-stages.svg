<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="820" height="410" fill="#ffffff" />

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">复刻雍正朱笔圈改：10 份清代真奏折 z(奴才) − z(臣) 全空间盲搜三级慢镜头</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">故宫 022688 湖广总督杨宗仁请安折影印件 + 曹家织造档案汉文真折 · 保持整折原文不动仅切换「臣 ↔ 奴才」</text>

  <!-- 顶部史料现场条 -->
  <rect x="26" y="66" width="768" height="56" rx="8" fill="#fef3c7" />
  <rect x="26" y="66" width="5" height="56" rx="2" fill="#d97706" />
  <text x="46" y="88" font-size="12.5" font-weight="bold" fill="#92400e">史料现场：雍正元年四月初五日，汉军正白旗湖广总督杨宗仁奏首写「湖广总督奴才杨宗仁叩首恭请皇上圣安」</text>
  <text x="46" y="108" font-size="11.5" fill="#78350f">雍正帝朱笔将黑字「奴才」圈改为「臣」，旁批四字：「称臣得体」（官修《硃批谕旨》已径改为臣，故宫 022688 原折影印保存真迹）</text>

  <!-- 三列慢镜头卡片 -->
  <!-- 左列：浅中层 L18 -->
  <rect x="26" y="138" width="244" height="252" rx="8" fill="#fff7ed" />
  <rect x="26" y="138" width="244" height="5" rx="2" fill="#ea580c" />
  <text x="44" y="166" font-size="14" font-weight="bold" fill="#c2410c">第一级 · 浅中层 L18</text>
  <text x="44" y="185" font-size="12" font-weight="bold" fill="#9a3412">字根入口闪过「奴隶 / Slave」</text>

  <rect x="42" y="198" width="212" height="86" rx="6" fill="#ffffff" />
  <text x="52" y="218" font-size="11.5" font-weight="bold" fill="#c2410c">正向跳涨：L18 C1690（κ=341.8）</text>
  <text x="52" y="237" font-size="11.5" font-weight="bold" fill="#111827">Δ = +5.78（10/10 奏折全涨）</text>
  <text x="52" y="255" font-size="11" fill="#334155">词牌：奴隶 / Slave / slavery / 奴</text>
  <text x="52" y="273" font-size="10.5" fill="#64748b">语料第 1 名：「约有 40 万名奴隶」</text>

  <rect x="42" y="294" width="212" height="80" rx="6" fill="#ffedd5" />
  <text x="52" y="314" font-size="11" font-weight="bold" fill="#9a3412">同层对比：</text>
  <text x="52" y="332" font-size="10.5" fill="#7c2d12">• 正向 C230 (+6.25, 10/10)：含「乾隆」</text>
  <text x="52" y="349" font-size="10.5" fill="#7c2d12">• 负向榜首 C1649 (-11.04, 10/10)：</text>
  <text x="60" y="365" font-size="10.5" fill="#7c2d12">语料为「北宋大臣」→ 入口闪过人身依附</text>

  <!-- 中列：中层 L25-L41 -->
  <rect x="286" y="138" width="248" height="252" rx="8" fill="#f8fafc" />
  <rect x="286" y="138" width="248" height="5" rx="2" fill="#2563eb" />
  <text x="304" y="166" font-size="14" font-weight="bold" fill="#1e40af">第二级 · 中层 L25 至 L41</text>
  <text x="304" y="185" font-size="12" font-weight="bold" fill="#1d4ed8">整排「外朝百官公器轴」集体跳水</text>

  <rect x="300" y="198" width="220" height="132" rx="6" fill="#ffffff" />
  <text x="310" y="218" font-size="11" font-weight="bold" fill="#1e3a8a">Slave 闪念消退，10/10 一致暴跌：</text>
  <text x="310" y="238" font-size="10.5" fill="#334155">• L25 C2108 (-7.52)：请示/献策（姜维启奏）</text>
  <text x="310" y="257" font-size="10.5" font-weight="bold" fill="#1e40af">• L25 C1146 (-5.70)：大臣/侍郎/宰相/政务</text>
  <text x="310" y="276" font-size="10.5" font-weight="bold" fill="#1e40af">• L32 C2829 (-4.25)：Sir/Lord/Governor</text>
  <text x="310" y="295" font-size="10.5" fill="#334155">• L32 C3016 (-3.97)：御史/chancellor/大臣</text>
  <text x="310" y="314" font-size="10.5" fill="#334155">• L41 C3492 (-3.08)：诏/上书/奏/朝廷/天子</text>

  <rect x="302" y="338" width="216" height="36" rx="5" fill="#dbeafe" />
  <text x="410" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">丢掉的不是道德清白，是外朝封疆体统</text>

  <!-- 右列：深层 L45 -->
  <rect x="550" y="138" width="244" height="252" rx="8" fill="#f0fdf4" />
  <rect x="550" y="138" width="244" height="5" rx="2" fill="#16a34a" />
  <text x="568" y="166" font-size="14" font-weight="bold" fill="#15803d">第三级 · 深层 L45 榜首</text>
  <text x="568" y="185" font-size="12" font-weight="bold" fill="#166534">跃入「八旗旗地·满洲根本」私属轴</text>

  <rect x="566" y="198" width="212" height="72" rx="6" fill="#dcfce7" />
  <text x="576" y="218" font-size="11.5" font-weight="bold" fill="#166534">全空间正向第 1 名：L45 C1194</text>
  <text x="576" y="238" font-size="11.5" font-weight="bold" fill="#111827">10 折全涨 Δ = +7.27（κ = 43.8）</text>
  <text x="576" y="257" font-size="11" font-weight="bold" fill="#15803d">杨宗仁 022688 单折亦涨 +6.55</text>

  <rect x="566" y="278" width="212" height="96" rx="6" fill="#ffffff" />
  <text x="576" y="297" font-size="10.5" font-weight="bold" fill="#92400e">v3 全库 136.6 万词最高激活（z=37.79）：</text>
  <text x="576" y="316" font-size="10.5" fill="#111827">「清廷将其隶属八旗的『旗地』管辖，大</text>
  <text x="576" y="333" font-size="10.5" fill="#111827">部分旗地禁止汉人进入开垦……山海关外</text>
  <text x="576" y="350" font-size="10.5" font-weight="bold" fill="#15803d">东三省地方，系满洲根本重地」</text>
  <text x="576" y="367" font-size="10.5" font-weight="bold" fill="#065f46">→ 几何闭环：外朝总督不可混入内务私产</text>
</svg>

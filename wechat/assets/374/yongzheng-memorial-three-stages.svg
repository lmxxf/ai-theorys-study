<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" width="720" height="584" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="720" height="584" fill="#ffffff" />

  <text x="360" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111827">复刻雍正朱笔圈改：10 份清代奏折 Δz = z(奴才) − z(臣)</text>
  <text x="360" y="48" text-anchor="middle" font-size="11.8" fill="#475569">截取各折目标词前原始左文并切换「臣 → 奴才」· 横轴为末词差值 Δz（1z = 11px）</text>

  <!-- 坐标顶栏说明 (x0 = 286) -->
  <text x="148" y="74" text-anchor="middle" font-size="11.8" font-weight="bold" fill="#1e40af">◀ 负向跳水（退出门外百官）</text>
  <text x="286" y="74" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#374151">Δz = 0</text>
  <text x="486" y="74" text-anchor="middle" font-size="11.8" font-weight="bold" fill="#15803d">正向跳涨（换成奴才后升高）▶</text>

  <!-- 第一级：浅层 L12-L18 -->
  <rect x="16" y="86" width="688" height="146" rx="8" fill="#fff7ed" />
  <text x="30" y="107" font-size="12.8" font-weight="bold" fill="#c2410c">第一级 · 浅层入口 L12–L18：切入贴身管家与 18 世纪清代</text>

  <!-- L12 C2054: +6.70 -> 74px -->
  <text x="108" y="132" text-anchor="end" font-size="11.8" font-weight="bold" fill="#9a3412">L12 C2054</text>
  <rect x="286" y="119" width="74" height="16" rx="3" fill="#ea580c" />
  <text x="367" y="132" font-size="11" font-weight="bold" fill="#9a3412">+6.70（正第 3/5,120 · 管事/总管/管家 valet）</text>

  <!-- L18 C230: +6.25 -> 69px -->
  <text x="108" y="158" text-anchor="end" font-size="11.8" font-weight="bold" fill="#c2410c">L18 C230</text>
  <rect x="286" y="145" width="69" height="16" rx="3" fill="#f97316" />
  <text x="362" y="158" font-size="11" font-weight="bold" fill="#c2410c">+6.25（正第 1/5,120 · 18th 世纪/乾隆年代锁）</text>

  <!-- L18 C1690: +5.78 -> 64px -->
  <text x="108" y="184" text-anchor="end" font-size="11.8" font-weight="bold" fill="#c2410c">L18 C1690</text>
  <rect x="286" y="171" width="64" height="16" rx="3" fill="#fb923c" />
  <text x="357" y="184" font-size="11" fill="#9a3412">+5.78（正第 3/5,120 · 字根闪念：奴隶/Slave）</text>

  <!-- L18 C1649: -11.04 -> 121px (x=165) -->
  <text x="108" y="210" text-anchor="end" font-size="11.8" font-weight="bold" fill="#1e40af">L18 C1649</text>
  <rect x="165" y="197" width="121" height="16" rx="3" fill="#2563eb" />
  <text x="159" y="210" text-anchor="end" font-size="10.8" font-weight="bold" fill="#1e40af">-11.04</text>
  <text x="294" y="210" font-size="10.8" fill="#475569">负第 1/5,120 · 语料榜首：「北宋大臣」（10/10）</text>

  <!-- 第二级：中层 L25-L32 门外公器 vs 门里家人同步对冲！ -->
  <rect x="16" y="242" width="688" height="202" rx="8" fill="#f8fafc" />
  <text x="30" y="263" font-size="12.8" font-weight="bold" fill="#1e40af">第二级 · 中层 L25–L32：「门外朝堂公器」与「门里自己家人」对冲</text>

  <!-- L25 C2108: -7.52 -> 83px (x=203) -->
  <text x="108" y="288" text-anchor="end" font-size="11.8" font-weight="bold" fill="#1e3a8a">L25 C2108</text>
  <rect x="203" y="275" width="83" height="16" rx="3" fill="#3b82f6" />
  <text x="197" y="288" text-anchor="end" font-size="10.8" font-weight="bold" fill="#1e40af">-7.52</text>
  <text x="294" y="288" font-size="10.8" fill="#334155">负第 1/5,120 · 请示/献策（语料：「姜维启奏」）</text>

  <!-- L25 C1146: -5.70 -> 63px (x=223) -->
  <text x="108" y="314" text-anchor="end" font-size="11.8" font-weight="bold" fill="#1e40af">L25 C1146</text>
  <rect x="223" y="301" width="63" height="16" rx="3" fill="#2563eb" />
  <text x="217" y="314" text-anchor="end" font-size="10.8" font-weight="bold" fill="#1e40af">-5.70</text>
  <text x="294" y="314" font-size="10.8" font-weight="bold" fill="#1e3a8a">负第 4/5,120 · 大臣 / 侍郎 / 宰相（10/10 全跌）</text>

  <!-- L32 C2829: -4.25 -> 47px (x=239) -->
  <text x="108" y="340" text-anchor="end" font-size="11.8" font-weight="bold" fill="#1e40af">L32 C2829</text>
  <rect x="239" y="327" width="47" height="16" rx="3" fill="#2563eb" />
  <text x="233" y="340" text-anchor="end" font-size="10.8" font-weight="bold" fill="#1e40af">-4.25</text>
  <text x="294" y="340" font-size="10.8" font-weight="bold" fill="#1e3a8a">负第 4/5,120 · Sir / Lord / Governor（封疆总督）</text>

  <!-- L32 C3016: -3.97 -> 44px (x=242) -->
  <text x="108" y="366" text-anchor="end" font-size="11.8" font-weight="bold" fill="#1e3a8a">L32 C3016</text>
  <rect x="242" y="353" width="44" height="16" rx="3" fill="#3b82f6" />
  <text x="236" y="366" text-anchor="end" font-size="10.8" font-weight="bold" fill="#1e40af">-3.97</text>
  <text x="294" y="366" font-size="10.8" fill="#334155">负第 5/5,120 · 御史 / chancellor / 大臣（10/10）</text>

  <!-- 同层右涨：门里家人 family / 家族！ -->
  <!-- L25 C2783: +3.02 (+3.40 mean) -> 33px -->
  <text x="108" y="396" text-anchor="end" font-size="11.8" font-weight="bold" fill="#15803d">L25 C2783</text>
  <rect x="286" y="383" width="33" height="16" rx="3" fill="#16a34a" />
  <text x="326" y="396" font-size="11" font-weight="bold" fill="#15803d">+3.02（词均 +3.40 正第 3/5,120 · family / 家庭）</text>

  <!-- L28 C2167: +3.20 (+3.91 mean) -> 35px -->
  <text x="108" y="422" text-anchor="end" font-size="11.8" font-weight="bold" fill="#15803d">L28 C2167</text>
  <rect x="286" y="409" width="35" height="16" rx="3" fill="#16a34a" />
  <text x="328" y="422" font-size="11" font-weight="bold" fill="#15803d">+3.20（词均 +3.91 正第 3/5,120 · 家族 / lineage）</text>

  <!-- 第三级：深层 L45 / L53 清宫呈批与朱批语体收束 -->
  <rect x="16" y="454" width="688" height="112" rx="8" fill="#f0fdf4" />
  <text x="30" y="475" font-size="12.8" font-weight="bold" fill="#166534">第三级 · 深层 L45 与 L53 各第 1 名：切入呈批与「朕/督办」公牍语体</text>

  <!-- L45 C1194: +7.27 -> 80px -->
  <text x="108" y="502" text-anchor="end" font-size="11.8" font-weight="bold" fill="#166534">L45 C1194</text>
  <rect x="286" y="489" width="80" height="16" rx="3" fill="#15803d" />
  <text x="373" y="502" font-size="11" font-weight="bold" fill="#15803d">+7.27（正第 1/5,120 · 各部各省/呈覆/伏乞核/请示）</text>

  <!-- L53 C1681: +6.69 -> 74px -->
  <text x="108" y="528" text-anchor="end" font-size="11.8" font-weight="bold" fill="#166534">L53 C1681</text>
  <rect x="286" y="515" width="74" height="16" rx="3" fill="#16a34a" />
  <text x="367" y="528" font-size="11" font-weight="bold" fill="#15803d">+6.69（正第 1/5,120 · 朕 / 督办 / 稽查 / 办理 / 遵照）</text>

  <text x="360" y="553" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">几何闭环：把「臣」换成「奴才」，就是退出门外百官公器、挤进门内管家与自己家人</text>

  <!-- 贯穿柱状区的 0 竖线 -->
  <line x1="286" y1="82" x2="286" y2="536" stroke="#374151" stroke-width="1.6" stroke-dasharray="4 3" />
</svg>

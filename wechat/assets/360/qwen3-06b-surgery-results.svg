<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect width="520" height="620" fill="#f8fafc" rx="12"/>
  <text x="260" y="34" font-size="15.2" font-weight="bold" fill="#0f172a" text-anchor="middle">自家 DGX Spark 实测：给 Qwen3-0.6B 动两项平行权重手术</text>
  <text x="260" y="54" font-size="10.8" fill="#64748b" text-anchor="middle">实验一迁移 MIT 改 131,072 个位置（18.75%），实验二另从原版只改 1,024 个位置（68.75%）</text>

  <!-- Panel 1: Dose-Response Transfer Probe -->
  <rect x="20" y="70" width="480" height="196" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <rect x="20" y="70" width="480" height="30" fill="#e0f2fe" rx="8"/>
  <text x="32" y="90" font-size="12" font-weight="bold" fill="#0369a1">① 第一刀（复刻 MIT 切 L19/L21 各 64 列）：正常推理不动，复读概率暴跌</text>

  <!-- Table header -->
  <rect x="28" y="108" width="464" height="24" fill="#f1f5f9" rx="4"/>
  <text x="86" y="124" font-size="10.8" font-weight="bold" fill="#334155" text-anchor="middle">消融倍数 α</text>
  <text x="208" y="124" font-size="10.8" font-weight="bold" fill="#166534" text-anchor="middle">正常收尾分支 Δlogp/词元</text>
  <text x="336" y="124" font-size="10.8" font-weight="bold" fill="#991b1b" text-anchor="middle">复读分支 Δlogp/词元</text>
  <text x="442" y="124" font-size="10.8" font-weight="bold" fill="#0369a1" text-anchor="middle">净选择性</text>

  <text x="86" y="148" font-size="10.8" fill="#334155" text-anchor="middle">α = 1（标准投影）</text>
  <text x="208" y="148" font-size="10.8" fill="#15803d" text-anchor="middle">+0.0038</text>
  <text x="336" y="148" font-size="10.8" fill="#b91c1c" text-anchor="middle">-0.0173</text>
  <text x="442" y="148" font-size="10.8" fill="#334155" text-anchor="middle">0.0212</text>

  <text x="86" y="170" font-size="10.8" fill="#334155" text-anchor="middle">α = 2</text>
  <text x="208" y="170" font-size="10.8" fill="#15803d" text-anchor="middle">+0.0048</text>
  <text x="336" y="170" font-size="10.8" fill="#b91c1c" text-anchor="middle">-0.0826</text>
  <text x="442" y="170" font-size="10.8" fill="#334155" text-anchor="middle">0.0873</text>

  <text x="86" y="192" font-size="10.8" fill="#334155" text-anchor="middle">α = 4</text>
  <text x="208" y="192" font-size="10.8" fill="#15803d" text-anchor="middle">+0.0048</text>
  <text x="336" y="192" font-size="10.8" font-weight="bold" fill="#dc2626" text-anchor="middle">-0.3497</text>
  <text x="442" y="192" font-size="10.8" font-weight="bold" fill="#0369a1" text-anchor="middle">0.3545</text>

  <rect x="28" y="202" width="464" height="24" fill="#fef3c7" rx="4"/>
  <text x="86" y="218" font-size="10.8" font-weight="bold" fill="#92400e" text-anchor="middle">α = 6（锁定手术）</text>
  <text x="208" y="218" font-size="10.8" font-weight="bold" fill="#15803d" text-anchor="middle">-0.0017（几乎未动）</text>
  <text x="336" y="218" font-size="10.8" font-weight="bold" fill="#dc2626" text-anchor="middle">-0.6882（暴跌）</text>
  <text x="442" y="218" font-size="10.8" font-weight="bold" fill="#92400e" text-anchor="middle">0.6866</text>

  <text x="260" y="248" font-size="9.5" fill="#64748b" text-anchor="middle">对照：同位置同范数随机正交方向（Random Control）正常 Δ = +0.0109，复读 Δ = +0.0082（毫无抑制）</text>

  <!-- Panel 2: Held-out 32 Problems 5-Way Comparison -->
  <rect x="20" y="280" width="480" height="322" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <rect x="20" y="280" width="480" height="30" fill="#dcfce7" rx="8"/>
  <text x="32" y="300" font-size="12" font-weight="bold" fill="#166534">② 32 道留出题五组硬核对决：从复刻 MIT（18.8%）到直接切掉思维链（68.8%）</text>

  <!-- Group A: Entering Answer Zone / Closing </think> -->
  <text x="34" y="332" font-size="11.2" font-weight="bold" fill="#0f172a">指标 A：成功跳出 &lt;/think&gt; 进入正式答题区的比例</text>

  <text x="34" y="354" font-size="10.2" fill="#475569">1. 手术前原模型</text>
  <rect x="190" y="342" width="28" height="14" fill="#94a3b8" rx="3"/>
  <text x="226" y="353" font-size="10.2" fill="#475569">15.62%（5/32，90.6% 撞上限）</text>

  <text x="34" y="374" font-size="10.2" fill="#64748b">2. 同范数随机方向对照</text>
  <rect x="190" y="362" width="17" height="14" fill="#cbd5e1" rx="3"/>
  <text x="215" y="373" font-size="10.2" fill="#64748b">9.38%（3/32，反而退化）</text>

  <text x="34" y="394" font-size="10.2" font-weight="bold" fill="#0369a1">3. 第一刀：复刻 MIT (13万权重)</text>
  <rect x="190" y="382" width="84" height="14" fill="#0284c7" rx="3"/>
  <text x="282" y="393" font-size="10.2" font-weight="bold" fill="#0369a1">46.88%（15/32，翻 3 倍）</text>

  <text x="34" y="414" font-size="10.2" font-weight="bold" fill="#15803d">4. 第二刀：闭合思考 (1024权重)</text>
  <rect x="190" y="402" width="176" height="14" fill="#16a34a" rx="3"/>
  <text x="374" y="413" font-size="10.2" font-weight="bold" fill="#15803d">100%（32/32 首词闭合）</text>

  <!-- Group B: Final Math Accuracy -->
  <text x="34" y="446" font-size="11.2" font-weight="bold" fill="#0f172a">指标 B：32 道留出题最终数学准确率（标准答案对账）</text>

  <text x="34" y="468" font-size="10.2" fill="#475569">1. 手术前原模型</text>
  <rect x="190" y="456" width="22" height="14" fill="#94a3b8" rx="3"/>
  <text x="220" y="467" font-size="10.2" font-weight="bold" fill="#475569">9.38%（3/32）</text>

  <text x="34" y="488" font-size="10.2" fill="#64748b">2. 同范数随机方向对照</text>
  <rect x="190" y="476" width="8" height="14" fill="#cbd5e1" rx="2"/>
  <text x="206" y="487" font-size="10.2" fill="#64748b">3.12%（1/32，救 1 退 3）</text>

  <text x="34" y="508" font-size="10.2" font-weight="bold" fill="#0369a1">3. 第一刀：复刻 MIT (13万权重)</text>
  <rect x="190" y="496" width="44" height="14" fill="#0284c7" rx="3"/>
  <text x="242" y="507" font-size="10.2" font-weight="bold" fill="#0369a1">18.75%（6/32，翻 2 倍，救 4 退 1）</text>

  <text x="34" y="528" font-size="10.2" fill="#475569">4. 对照 A：模板参数关 &lt;think&gt;</text>
  <rect x="190" y="516" width="138" height="14" fill="#f59e0b" rx="3"/>
  <text x="336" y="527" font-size="10.2" font-weight="bold" fill="#b45309">59.38%（19/32，救 18 退 2）</text>

  <rect x="28" y="536" width="464" height="24" fill="#fef3c7" rx="4"/>
  <text x="34" y="552" font-size="10.2" font-weight="bold" fill="#92400e">5. 第二刀：闭合思考 (1024权重)</text>
  <rect x="190" y="541" width="150" height="14" fill="#dc2626" rx="3"/>
  <text x="346" y="552" font-size="10.2" font-weight="bold" fill="#dc2626">68.75%（22/32，变为 7.3 倍）</text>

  <text x="260" y="584" font-size="9.8" font-weight="bold" fill="#166534" text-anchor="middle">结论：换到直接交付模式就能答对近七成，原来只考 9.4% 是被 &lt;think&gt; 里的冗长复读拖垮了预算</text>
</svg>

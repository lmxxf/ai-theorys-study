<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" width="520" height="560" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect width="520" height="560" fill="#f8fafc" rx="12"/>
  <text x="260" y="34" font-size="15.5" font-weight="bold" fill="#0f172a" text-anchor="middle">自家 DGX Spark 实测：给 Qwen3-0.6B 做 131,072 权重手术</text>
  <text x="260" y="54" font-size="11.2" fill="#64748b" text-anchor="middle">定位第 19、21 层 down_proj 各 Top-64 列（α = 6），32 道留出题与转移探针账本</text>

  <!-- Panel 1: Dose-Response Transfer Probe -->
  <rect x="20" y="70" width="480" height="202" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <rect x="20" y="70" width="480" height="30" fill="#e0f2fe" rx="8"/>
  <text x="32" y="90" font-size="12.2" font-weight="bold" fill="#0369a1">① 剂量效应（转移探针）：正常推理几乎不动，复读分支概率断崖式暴跌</text>

  <!-- Table header -->
  <rect x="34" y="110" width="452" height="26" fill="#f1f5f9" rx="4"/>
  <text x="72" y="127" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">消融倍数 α</text>
  <text x="195" y="127" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">正常收尾分支 Δlogp/词元</text>
  <text x="328" y="127" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">复读分支 Δlogp/词元</text>
  <text x="436" y="127" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">净选择性</text>

  <!-- Rows -->
  <text x="72" y="152" font-size="11" fill="#334155" text-anchor="middle">α = 1（标准投影）</text>
  <text x="195" y="152" font-size="11" fill="#15803d" text-anchor="middle">+0.0038</text>
  <text x="328" y="152" font-size="11" fill="#b91c1c" text-anchor="middle">-0.0173</text>
  <text x="436" y="152" font-size="11" fill="#334155" text-anchor="middle">0.0212</text>

  <text x="72" y="176" font-size="11" fill="#334155" text-anchor="middle">α = 2</text>
  <text x="195" y="176" font-size="11" fill="#15803d" text-anchor="middle">+0.0048</text>
  <text x="328" y="176" font-size="11" fill="#b91c1c" text-anchor="middle">-0.0826</text>
  <text x="436" y="176" font-size="11" fill="#334155" text-anchor="middle">0.0873</text>

  <text x="72" y="200" font-size="11" fill="#334155" text-anchor="middle">α = 4</text>
  <text x="195" y="200" font-size="11" fill="#15803d" text-anchor="middle">+0.0048</text>
  <text x="328" y="200" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">-0.3497</text>
  <text x="436" y="200" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">0.3545</text>

  <rect x="34" y="210" width="452" height="26" fill="#fef3c7" rx="4"/>
  <text x="72" y="227" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">α = 6（锁定手术）</text>
  <text x="195" y="227" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">-0.0017（几乎未动）</text>
  <text x="328" y="227" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">-0.6882（暴跌！）</text>
  <text x="436" y="227" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">0.6866</text>

  <text x="260" y="256" font-size="9.6" fill="#64748b" text-anchor="middle">对照：同位置同范数随机正交方向（Random Control）正常 Δ = +0.0109，复读 Δ = +0.0082（毫无抑制）</text>

  <!-- Panel 2: Held-out 32 Problems Generation Comparison -->
  <rect x="20" y="286" width="480" height="254" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <rect x="20" y="286" width="480" height="30" fill="#dcfce7" rx="8"/>
  <text x="32" y="306" font-size="12.2" font-weight="bold" fill="#166534">② 32 道留出题真机生成对比（max_new_tokens = 1024）</text>

  <!-- Bar group 1: </think> Closure Rate -->
  <text x="36" y="340" font-size="11.5" font-weight="bold" fill="#0f172a">指标 A：&lt;/think&gt; 思考正常闭合率（跳出死循环交卷的比例）</text>

  <text x="36" y="364" font-size="11" fill="#475569">手术前原模型</text>
  <rect x="148" y="352" width="56" height="16" fill="#94a3b8" rx="3"/>
  <text x="212" y="364" font-size="11" font-weight="bold" fill="#475569">15.62%（5/32）</text>

  <text x="36" y="388" font-size="11" fill="#475569">同范数随机对照</text>
  <rect x="148" y="376" width="34" height="16" fill="#cbd5e1" rx="3"/>
  <text x="190" y="388" font-size="11" fill="#64748b">9.38%（3/32，反而退化）</text>

  <text x="36" y="412" font-size="11" font-weight="bold" fill="#166534">131,072 权重手术后</text>
  <rect x="148" y="400" width="168" height="16" fill="#16a34a" rx="3"/>
  <text x="324" y="412" font-size="11.5" font-weight="bold" fill="#15803d">46.88%（15/32，直接翻 3 倍）</text>

  <!-- Bar group 2: Final Math Accuracy -->
  <text x="36" y="448" font-size="11.5" font-weight="bold" fill="#0f172a">指标 B：最终交付正确得数准确率（救活 4 题，仅退化 1 题）</text>

  <text x="36" y="472" font-size="11" fill="#475569">手术前原模型</text>
  <rect x="148" y="460" width="60" height="16" fill="#94a3b8" rx="3"/>
  <text x="216" y="472" font-size="11" font-weight="bold" fill="#475569">9.38%（3/32）</text>

  <text x="36" y="496" font-size="11" fill="#475569">同范数随机对照</text>
  <rect x="148" y="484" width="20" height="16" fill="#cbd5e1" rx="3"/>
  <text x="176" y="496" font-size="11" fill="#64748b">3.12%（1/32，救 1 退 3）</text>

  <text x="36" y="520" font-size="11" font-weight="bold" fill="#b45309">131,072 权重手术后</text>
  <rect x="148" y="508" width="120" height="16" fill="#d97706" rx="3"/>
  <text x="276" y="520" font-size="11.5" font-weight="bold" fill="#b45309">18.75%（6/32，翻 2 倍）</text>
</svg>

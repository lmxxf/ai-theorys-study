  <!-- Bottom Takeaway Callout -->
  <rect x="28" y="564" width="464" height="28" fill="#f0fdf4" stroke="#bbf7d0" rx="5"/>
  <text x="260" y="582" font-size="9.3" font-weight="bold" fill="#166534" text-anchor="middle">真相：所有模型都会写策略（图②全员过关），图①考的只是“不开计算器心算 600 维数组下标不串行”</text>

  <!-- Baseline dashed line at 50.0 (y = 240 - 50*1.8 = 150) -->
  <line x1="30" y1="150" x2="490" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="486" y="145" font-size="9.5" fill="#64748b" text-anchor="end">PPO 500M 基准线 (50.0)</text>


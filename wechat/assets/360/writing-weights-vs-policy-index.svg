<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect width="520" height="620" fill="#f8fafc" rx="12"/>
  <text x="260" y="32" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">网传“手写权重榜单”全还原：手填矩阵下标 vs 直接写策略代码</text>
  <text x="260" y="52" font-size="10.8" fill="#64748b" text-anchor="middle">MIT 实验 5 扩展横评（3 个 10×10 小游戏，Index = mean of 100·q/(1+q)，追平 PPO 500M 得 50.0 分）</text>

  <!-- Panel 1: Writing Weights Index -->

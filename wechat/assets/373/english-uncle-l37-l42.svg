<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="820" height="400" fill="#ffffff" />

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">第三幕排雷与绝杀：在黄金三分之二层（L42）切开同一个英文 uncle</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">全部坐标轴均仅由 3 对中文父辈词（S2）盲选产生，零英文样本参与选轴，直接投射句末同一个英文词</text>

  <!-- 上半框：L37 排雷 -->
  <rect x="26" y="66" width="768" height="128" rx="8" fill="#fff7ed" />
  <rect x="26" y="66" width="5" height="128" rx="2" fill="#ea580c" />
  <text x="46" y="90" font-size="14.5" font-weight="bold" fill="#c2410c">第一步排雷 · 第 37 层 L37 C2923：英文定义句 25/25 满分，但检出性别混杂嫌疑</text>

  <rect x="46" y="102" width="356" height="78" rx="6" fill="#ffffff" />
  <text x="58" y="122" font-size="11.5" font-weight="bold" fill="#15803d">英文血缘定义组 EN-A（25/25 全对 · 与英文自选同轴）：</text>
  <text x="58" y="142" font-size="11" fill="#334155">• 「... my father's brother ... favorite uncle」</text>
  <text x="58" y="160" font-size="11" fill="#334155">• 「... my mother's brother ... favorite uncle」</text>
  <text x="58" y="175" font-size="10.5" fill="#64748b">涵盖 uncle / aunt / cousin / grandfather / grandmother</text>

  <rect x="416" y="102" width="360" height="78" rx="6" fill="#ffedd5" />
  <text x="428" y="122" font-size="11.5" font-weight="bold" fill="#9a3412">阴性对照 EN-B 自查报警（纯性别对立 10 对）：</text>
  <text x="428" y="142" font-size="11" fill="#7c2d12">• man vs woman / king vs queen 检出偏移 Δ = -2.39</text>
  <text x="428" y="160" font-size="11" fill="#7c2d12">• J-Lens 含「丈夫 / husband / her」，受 father/mother 调制</text>
  <text x="428" y="175" font-size="10.5" font-weight="bold" fill="#c2410c">→ 必须设计连 father/mother 字面差异都封死的同词袋暗测题</text>

  <!-- 箭头 -->
  <line x1="410" y1="196" x2="410" y2="214" stroke="#94a3b8" stroke-width="2" />
  <polygon points="405,212 410,220 415,212" fill="#94a3b8" />

  <!-- 下半框：L42 C1992 绝杀 -->
  <rect x="26" y="222" width="768" height="162" rx="8" fill="#f0fdf4" />
  <rect x="26" y="222" width="5" height="162" rx="2" fill="#16a34a" />
  <text x="46" y="246" font-size="14.5" font-weight="bold" fill="#15803d">第二步绝杀 · 第 42 层 L42 C1992（42/64 = 65.6% 黄金三分之二层）：同词袋姓氏推理 15/15 全对</text>
  <text x="46" y="266" font-size="12" fill="#334155">J-Lens 前十纯跨语婚姻算子：嫁给 / 嫁 / marriage / 出嫁 / 婚姻 / marry / married / 女婿 · 性别控制 EN-B 无偏置（6/10）</text>

  <rect x="46" y="278" width="466" height="92" rx="6" fill="#ffffff" />
  <text x="58" y="297" font-size="11.5" font-weight="bold" fill="#0f172a">100% 同词袋英文姓氏推理 EN-C（父母双姓同场，单词频次完全相同）：</text>
  <text x="58" y="316" font-size="10.5" fill="#334155">前文共用：My name is David Miller, the son of John Miller and Mary Clark...</text>
  <text x="58" y="335" font-size="10.5" font-weight="bold" fill="#1e40af">父系句尾：...Robert Clark is a family friend, whereas Robert Miller is my uncle</text>
  <text x="58" y="354" font-size="10.5" font-weight="bold" fill="#b45309">母系句尾：...Robert Miller is a family friend, whereas Robert Clark is my uncle</text>

  <rect x="526" y="278" width="250" height="92" rx="6" fill="#dcfce7" />
  <text x="651" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">零样本 15 / 15 满分切开</text>
  <text x="651" y="323" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">• uncle 组：Δ = 5.32, d = 7.49</text>
  <text x="651" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">• cousin 组：Δ = 2.36, d = 14.77</text>
  <text x="651" y="361" text-anchor="middle" font-size="11" fill="#065f46">英文 EN-C 自选第 1 名同样命中 C1992</text>
</svg>

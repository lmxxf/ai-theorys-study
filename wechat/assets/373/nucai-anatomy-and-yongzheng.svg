<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="820" height="450" fill="#ffffff" />

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">清代奏折与《红楼梦》里的「奴才」：从无痛代词，到雍正朱批「称臣得体」</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">故宫 022688 杨宗仁原折 + 曹家织造档案 10 份奏折 + 120 回《红楼梦》原著（v3 训练零泄露）+ 鲁迅五篇杂文</text>

  <!-- 左上：L30 C846 贬损轴对比（scale: 13.5px per unit） -->
  <rect x="26" y="66" width="378" height="176" rx="8" fill="#f8fafc" />
  <rect x="26" y="66" width="5" height="176" rx="2" fill="#0284c7" />
  <text x="44" y="90" font-size="14" font-weight="bold" fill="#0369a1">1. 中深层贬损轴验光（L30 C846：侮辱 / 劣 / stupid）</text>

  <text x="44" y="116" font-size="11.5" fill="#334155">贾府自称 A2</text>
  <rect x="124" y="104" width="26" height="15" rx="3" fill="#38bdf8" />
  <text x="157" y="116" font-size="11" font-weight="bold" fill="#0369a1">+1.93（贴近 小的 / 下官 基线）</text>

  <text x="44" y="140" font-size="11.5" fill="#334155">奏折自称 A1</text>
  <rect x="124" y="128" width="27" height="15" rx="3" fill="#0ea5e9" />
  <text x="158" y="140" font-size="11" font-weight="bold" fill="#0369a1">+2.02（与「臣」仅差 +0.60）</text>

  <text x="44" y="166" font-size="11.5" font-weight="bold" fill="#b45309">红楼痛骂 B</text>
  <rect x="124" y="154" width="97" height="15" rx="3" fill="#f59e0b" />
  <text x="228" y="166" font-size="11" font-weight="bold" fill="#b45309">+7.19（探春 / 贾政怒斥）</text>

  <text x="44" y="190" font-size="11.5" font-weight="bold" fill="#c2410c">雍正斥责上谕</text>
  <rect x="124" y="178" width="109" height="15" rx="3" fill="#ea580c" />
  <text x="240" y="190" font-size="11" font-weight="bold" fill="#c2410c">+8.10（包衣下贱奴才）</text>

  <text x="44" y="214" font-size="11.5" font-weight="bold" fill="#b91c1c">鲁迅杂文批判</text>
  <rect x="124" y="202" width="136" height="15" rx="3" fill="#dc2626" />
  <text x="267" y="214" font-size="11" font-weight="bold" fill="#b91c1c">+10.07（现代批判极值）</text>

  <text x="44" y="234" font-size="10.5" fill="#64748b">注：L18 C1376 贬损轴奏折自称 0.00、贾府自称 -0.24；L45 奴才−臣跨 0</text>

  <!-- 右上：红楼梦日常自称 = 第一人称代词 -->
  <rect x="418" y="66" width="376" height="176" rx="8" fill="#f0fdf4" />
  <rect x="418" y="66" width="5" height="176" rx="2" fill="#16a34a" />
  <text x="436" y="90" font-size="14" font-weight="bold" fill="#15803d">2. 《红楼梦》自称 vs 挨骂 9/9 冠军轴真身</text>
  <text x="436" y="111" font-size="11.5" fill="#334155">无监督盲选 B − A2 第 1 名（L29 至 L48 连续二十层一致）：</text>

  <rect x="436" y="122" width="340" height="44" rx="6" fill="#dcfce7" />
  <text x="606" y="141" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#166534">J-Lens 词牌：myself / my / 我自己 / 我的 / I / 我</text>
  <text x="606" y="159" text-anchor="middle" font-size="11" fill="#15803d">并非人格羞辱专轴，而是纯粹的「第一人称自指代词轴」</text>

  <text x="436" y="188" font-size="11.5" fill="#111827">• 管家平儿平静回话自称（A2）：高达 +13.35 至 +16.84</text>
  <text x="436" y="209" font-size="11.5" fill="#475569">• 主子开口痛骂「这班奴才」（B）：跌回 +1.17</text>
  <text x="436" y="230" font-size="11" font-weight="bold" fill="#15803d">结论：日常体面自称时，「奴才」在语法上已代词化为「我」</text>

  <!-- 下半区：复刻雍正朱笔圈改 z(奴才) - z(臣) -->
  <rect x="26" y="256" width="768" height="178" rx="8" fill="#fffbeb" />
  <rect x="26" y="256" width="5" height="178" rx="2" fill="#d97706" />
  <text x="44" y="280" font-size="14.5" font-weight="bold" fill="#92400e">3. 复刻雍正圈改杨宗仁奏折：10 份清代真奏折 z(奴才) − z(臣) 全空间 5,120 轴盲搜</text>
  <text x="44" y="299" font-size="11.5" fill="#475569">同一份奏折原长文仅把「臣」换成「奴才」，不预设任何词表，直接看各层跳变最大的坐标轴：</text>

  <!-- 三列卡片 -->
  <rect x="44" y="312" width="232" height="108" rx="6" fill="#ffffff" />
  <rect x="44" y="312" width="232" height="4" rx="2" fill="#ea580c" />
  <text x="56" y="334" font-size="12.5" font-weight="bold" fill="#c2410c">浅中层 L18：字根闪念</text>
  <text x="56" y="354" font-size="11.5" font-weight="bold" fill="#111827">C1690（Δ = +5.78, 10/10 涨）</text>
  <text x="56" y="373" font-size="11" fill="#334155">词牌：奴隶 / Slave / slavery</text>
  <text x="56" y="391" font-size="10.5" fill="#64748b">语料第 1 名：「约有 40 万名奴隶」</text>
  <text x="56" y="408" font-size="10.5" fill="#9a3412">入口层确实闪过人身依附字根</text>

  <rect x="292" y="312" width="242" height="108" rx="6" fill="#ffffff" />
  <rect x="292" y="312" width="242" height="4" rx="2" fill="#2563eb" />
  <text x="304" y="334" font-size="12.5" font-weight="bold" fill="#1e40af">中层 L25–L41：丢外朝公器</text>
  <text x="304" y="354" font-size="11.5" font-weight="bold" fill="#111827">整排外朝百官轴 10/10 跌落</text>
  <text x="304" y="373" font-size="11" fill="#334155">• L25 C1146 大臣/侍郎/宰相 (-5.70)</text>
  <text x="304" y="391" font-size="11" fill="#334155">• L32 C2829 Sir/Lord/Governor (-4.25)</text>
  <text x="304" y="408" font-size="11" fill="#334155">• L41 C3492 诏/上书/奏/天子 (-3.08)</text>

  <rect x="550" y="312" width="226" height="108" rx="6" fill="#fef3c7" />
  <rect x="550" y="312" width="226" height="4" rx="2" fill="#16a34a" />
  <text x="562" y="334" font-size="12.5" font-weight="bold" fill="#15803d">深层 L45：进八旗旗地私属</text>
  <text x="562" y="354" font-size="11.5" font-weight="bold" fill="#111827">榜首 C1194（+7.27 · 杨折 +6.55）</text>
  <text x="562" y="373" font-size="10.5" fill="#78350f">全库最高激活原句（z = 37.79）：</text>
  <text x="562" y="391" font-size="10.5" font-weight="bold" fill="#92400e">「隶属八旗的『旗地』管辖……</text>
  <text x="562" y="408" font-size="10.5" font-weight="bold" fill="#92400e">系满洲根本重地」→ 印证称臣得体</text>
</svg>

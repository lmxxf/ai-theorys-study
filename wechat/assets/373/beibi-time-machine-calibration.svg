<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="820" height="356" fill="#ffffff" />

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">给时光机调零：拿《出师表》「先帝不以臣卑鄙」洗掉现代汉语贬义污染</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">单向注意力只看左文 · 对比「卑鄙」与同位古义词「微贱 / 浅陋 / 愚钝」在现代道德贬义轴上的残余落差</text>

  <!-- 左栏：四种上下文包裹对比 -->
  <rect x="26" y="68" width="376" height="268" rx="8" fill="#f8fafc" />
  <rect x="26" y="68" width="5" height="268" rx="2" fill="#2563eb" />
  <text x="46" y="93" font-size="14.5" font-weight="bold" fill="#1e40af">意外发现：纯英文隔离舱反而不如千字纯文言</text>
  <text x="46" y="112" font-size="11.5" fill="#475569">L10–L48 共 38 个有效层现代贬义残留绝对值中位数</text>

  <!-- 柱状条（横向） -->
  <text x="46" y="146" font-size="12" font-weight="bold" fill="#15803d">W2 千字《三国志》</text>
  <rect x="166" y="132" width="112" height="20" rx="4" fill="#16a34a" />
  <text x="286" y="147" font-size="12" font-weight="bold" fill="#15803d">17.0%（最干净）</text>

  <text x="46" y="182" font-size="12" fill="#334155">W1 百字《出师表》</text>
  <rect x="166" y="168" width="129" height="20" rx="4" fill="#3b82f6" />
  <text x="303" y="183" font-size="12" fill="#1e40af">19.6%</text>

  <text x="46" y="218" font-size="12" fill="#334155">W0 短句直喂基线</text>
  <rect x="166" y="204" width="139" height="20" rx="4" fill="#94a3b8" />
  <text x="313" y="219" font-size="12" fill="#475569">21.0%</text>

  <text x="46" y="254" font-size="12" font-weight="bold" fill="#b91c1c">W3a 纯英文导语舱</text>
  <rect x="166" y="240" width="169" height="20" rx="4" fill="#dc2626" />
  <text x="343" y="255" font-size="12" font-weight="bold" fill="#b91c1c">25.6%</text>

  <rect x="46" y="276" width="338" height="46" rx="6" fill="#ffffff" />
  <text x="56" y="295" font-size="11" fill="#334155">原因：英文切断中文语境后突然蹦出几个汉字，模型</text>
  <text x="56" y="312" font-size="11" fill="#334155">默认掉回占比 99% 的现代白话入口；唯长文言能稳住轨道</text>

  <!-- 右栏：单篇 W2 跨层两阶段洗净 -->
  <rect x="418" y="68" width="376" height="268" rx="8" fill="#f0fdf4" />
  <rect x="418" y="68" width="5" height="268" rx="2" fill="#16a34a" />
  <text x="438" y="93" font-size="14.5" font-weight="bold" fill="#15803d">千字文言 W2 内部：浅层惊跳 → 中深层归零</text>
  <text x="438" y="112" font-size="11.5" fill="#475569">前铺 2,369 词《三国志·诸葛亮传》（剔除裴松之注防泄题）</text>

  <!-- 零基线（右移至 x=540 避开左侧标签与负柱） -->
  <text x="540" y="131" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">0% 古义中性基线</text>
  <line x1="540" y1="137" x2="540" y2="269" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- L16 (+35.6%, scale 3.2px/%) -->
  <text x="438" y="156" font-size="11.5" font-weight="bold" fill="#b45309">L16 C1821</text>
  <rect x="540" y="143" width="114" height="16" rx="3" fill="#f59e0b" />
  <text x="661" y="156" font-size="11" font-weight="bold" fill="#b45309">+35.6%（字面惊跳）</text>

  <!-- L30 (-0.43%) -->
  <text x="438" y="184" font-size="11.5" font-weight="bold" fill="#15803d">L30 C846</text>
  <rect x="536" y="171" width="4" height="16" rx="2" fill="#16a34a" />
  <text x="548" y="184" font-size="11" font-weight="bold" fill="#15803d">-0.43%（卑鄙 +4.05 ≈ 微贱 +4.13）</text>

  <!-- L38 (-4.8% -> 16px 左伸至 524，右侧距 L38 C1448 留足 20px) -->
  <text x="438" y="212" font-size="11.5" font-weight="bold" fill="#15803d">L38 C1448</text>
  <rect x="524" y="199" width="16" height="16" rx="3" fill="#22c55e" />
  <text x="548" y="212" font-size="11" fill="#166534">-4.8%（越过零点洗净）</text>

  <!-- L41 (+6.0% -> 19px) -->
  <text x="438" y="240" font-size="11.5" font-weight="bold" fill="#15803d">L41 C1726</text>
  <rect x="540" y="227" width="19" height="16" rx="3" fill="#22c55e" />
  <text x="566" y="240" font-size="11" fill="#166534">+6.0%（W0 为 28.3%，W1 仅 1.5%）</text>

  <!-- L45 (-1.9% -> 7px) -->
  <text x="438" y="266" font-size="11.5" font-weight="bold" fill="#15803d">L45 C1564</text>
  <rect x="533" y="253" width="7" height="16" rx="2" fill="#16a34a" />
  <text x="548" y="266" font-size="11" fill="#166534">-1.9%（中深层概念区完全消噪）</text>

  <rect x="438" y="276" width="338" height="46" rx="6" fill="#ffffff" />
  <text x="448" y="295" font-size="11" font-weight="bold" fill="#15803d">校准结论：第 30 至 45 层配千字文言可滤除现代贬义干扰</text>
  <text x="448" y="312" font-size="11" fill="#475569">拿这把调好零的尺子，再去照清代奏折与《红楼梦》的「奴才」</text>
</svg>

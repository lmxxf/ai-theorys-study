  <text x="440.0" y="27" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111827">同一根宗法婚姻轴（L25 C3140）中英同台对照：把「叔叔舅舅」拍在脸上，英文也无动于衷</text>
  <text x="440.0" y="47" text-anchor="middle" font-size="11.5" fill="#4b5563">左半场中文称呼一高一矮拉开 8–19 个标准差；右半场英文明牌写出 father's vs mother's，十根柱子两两齐平</text>


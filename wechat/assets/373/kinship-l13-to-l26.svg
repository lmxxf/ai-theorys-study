<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="820" height="410" fill="#ffffff" />

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">母语刻刀前两幕：从 L13 空间「外」字隐喻，到 L25/L26 单极「嫁娶算子」</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">5 个零「爸/妈/姓」日常句框 · S2 仅用「伯父/舅舅、叔叔/姨夫、姑姑/姨妈」3 对零共享字词盲选单轴</text>

  <!-- 第一幕：L13 C2665 -->
  <rect x="26" y="66" width="768" height="148" rx="8" fill="#f8fafc" />
  <rect x="26" y="66" width="5" height="148" rx="2" fill="#0284c7" />
  <text x="46" y="90" font-size="14.5" font-weight="bold" fill="#0369a1">第一幕 · 第 13 层 L13 C2665（κ = 60.04）：物理内外 = 社会内外 = 亲属内外「三冠同轴」</text>
  <text x="46" y="110" font-size="12" fill="#334155">物理空间（院子里面/外面 5/5）、社会圈层（自家人/外人 5/5）与中文亲属 S1 各自在 5,120 根轴盲选第 1 名全中 C2665</text>

  <rect x="46" y="122" width="356" height="78" rx="6" fill="#ffffff" />
  <text x="58" y="142" font-size="11.5" font-weight="bold" fill="#0f172a">双镜工具对勘（隔 50 层非线性变换）：</text>
  <text x="58" y="161" font-size="11" fill="#64748b">• 线性 J-Lens 直投失真：['对于', '而对于', ' for']</text>
  <text x="58" y="180" font-size="11" font-weight="bold" fill="#0369a1">• v3 语料最高激活（z=32.32/30.56）：全踩汉字「外」</text>
  <text x="68" y="195" font-size="10.5" fill="#475569">（「铜人模型，外」「蜘蛛……腹部不是从外」）</text>

  <rect x="416" y="122" width="360" height="78" rx="6" fill="#e0f2fe" />
  <text x="428" y="142" font-size="11.5" font-weight="bold" fill="#0369a1">零「外/表」字北方单词元照样触发空间「外」轴：</text>
  <text x="428" y="162" font-size="11" fill="#0c4a6e">• 姥爷[138309] / 姥姥[116775]（+6.99）vs 爷爷 / 奶奶（+1.77）</text>
  <text x="438" y="179" font-size="11" font-weight="bold" fill="#0369a1">→ 10/10 全对（高出 +5.22）</text>
  <text x="428" y="195" font-size="10.5" fill="#075985">• 舅舅/姨夫/姨妈（+2.79）vs 伯父/叔叔/姑姑（-0.56）：15/15 全对</text>

  <!-- 箭头 -->
  <line x1="410" y1="216" x2="410" y2="234" stroke="#94a3b8" stroke-width="2" />
  <polygon points="405,232 410,240 415,232" fill="#94a3b8" />

  <!-- 第二幕：L25 C3140 / L26 C3526 -->
  <rect x="26" y="242" width="768" height="154" rx="8" fill="#fefce8" />
  <rect x="26" y="242" width="5" height="154" rx="2" fill="#d97706" />
  <text x="46" y="266" font-size="14.5" font-weight="bold" fill="#b45309">第二幕 · 第 25/26 层 L25 C3140（κ = 74.97）/ L26 C3526：父系默认零基线 + 单极「嫁娶算子」</text>
  <text x="46" y="286" font-size="12" fill="#334155">与物理内外彻底分家（余弦 -0.007）· 末词元与词内均值双口径留出：无外字隔代 10/10、堂表 20/20、外字组 30/30（60/60 满分）</text>

  <rect x="46" y="298" width="322" height="84" rx="6" fill="#ffffff" />
  <text x="58" y="318" font-size="11.5" font-weight="bold" fill="#475569">推翻事先对称猜想 —— 父系本家侧：</text>
  <text x="58" y="338" font-size="11" fill="#64748b">• 并未亮出「伯 / 叔 / 堂 / 宗族」对称词簇</text>
  <text x="58" y="357" font-size="11" font-weight="bold" fill="#334155">• 静躺低海拔零点：本家自家人默认无需打标</text>
  <text x="58" y="374" font-size="10.5" fill="#64748b">（语言学 Unmarked Default 零标记基线）</text>

  <rect x="384" y="298" width="392" height="84" rx="6" fill="#fef3c7" />
  <text x="396" y="318" font-size="11.5" font-weight="bold" fill="#92400e">外姻侧单极高耸 —— 唯一生成算子「跨过一次婚姻」：</text>
  <text x="396" y="338" font-size="11" fill="#78350f">• L25 词牌：女婿 / 婿 / 婚 / 岳父 / 婚姻关系 / wife</text>
  <text x="396" y="357" font-size="11" font-weight="bold" fill="#92400e">• L26 词牌：出嫁 / 娘家（全词表第 8 名, 99.997%）/ maternal</text>
  <text x="396" y="374" font-size="10.5" fill="#78350f">• 语料最高：现岳父 (52.59) / 外舅 (51.59) / son-in-law (46.81)</text>
</svg>

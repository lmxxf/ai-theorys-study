  <text x="440.0" y="27" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111827">第 42 层跨语言婚姻轴（L42 C1992）：切开 15 对同词袋英文亲属句</text>
  <text x="440.0" y="47" text-anchor="middle" font-size="11.5" fill="#4b5563">每组两句英文单词频次 100% 相同、句末停在同一词，仅互换跟父亲同姓（左蓝柱）还是跟母亲娘家同姓（右绿柱）</text>


  <text x="430.0" y="27" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111827">第 42 层（L42 C1992）：纯中文挑出的轴，零样本切开 15 对同词袋英文句子</text>
  <text x="430.0" y="47" text-anchor="middle" font-size="11.5" fill="#4b5563">每对英文句子单词出现频次 100% 相同、句末停在同一个英文词，仅互换候选人跟父姓还是跟母姓（15/15 全向右弹起）</text>


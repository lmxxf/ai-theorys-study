<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="820" height="370" fill="#ffffff" />

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">完整篇章版 ICA-Lens v3 收官：保住「起承转合」，全 64 层泛化比压进 1.07×–1.48×</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">双机 DGX Spark 耗时 22.96 小时 · 8,000 篇训练长文（250 万词）+ 1,200 篇零重合独立长文测试（136.6 万词）</text>

  <!-- 左栏：窗口采样结构升级 -->
  <rect x="26" y="68" width="376" height="282" rx="8" fill="#f8fafc" />
  <rect x="26" y="68" width="5" height="282" rx="2" fill="#2563eb" />
  <text x="46" y="93" font-size="14.5" font-weight="bold" fill="#1e40af">为什么要重磨 v3？首段 512 词元砍断了篇章脉络</text>

  <!-- v2 示意 -->
  <text x="46" y="120" font-size="12" font-weight="bold" fill="#dc2626">旧 v2（每篇仅切开头 512 词元）：</text>
  <rect x="46" y="128" width="96" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
  <text x="94" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">开头 512 词元</text>
  <rect x="148" y="128" width="234" height="24" rx="4" fill="#e2e8f0" />
  <text x="265" y="144" text-anchor="middle" font-size="11" fill="#64748b">中段展开与结尾收束全部被截断丢弃</text>

  <!-- v3 示意 -->
  <text x="46" y="176" font-size="12" font-weight="bold" fill="#15803d">新 v3（≤4,096 词元整篇前向；超长文三段保首尾）：</text>
  <rect x="46" y="184" width="76" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
  <text x="84" y="201" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">开头 1,024</text>
  <rect x="126" y="184" width="44" height="26" rx="3" fill="#fef3c7" />
  <text x="148" y="201" text-anchor="middle" font-size="9.5" fill="#92400e">省略提示</text>
  <rect x="174" y="184" width="110" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
  <text x="229" y="201" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">正中 2,048 词元</text>
  <rect x="288" y="184" width="44" height="26" rx="3" fill="#fef3c7" />
  <text x="310" y="201" text-anchor="middle" font-size="9.5" fill="#92400e">省略提示</text>
  <rect x="336" y="184" width="52" height="26" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1" />
  <text x="362" y="201" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">尾 1,024</text>

  <rect x="46" y="224" width="338" height="110" rx="6" fill="#ffffff" />
  <text x="58" y="245" font-size="11.5" font-weight="bold" fill="#0f172a">三道严格掩码控制：</text>
  <text x="58" y="266" font-size="11" fill="#334155">1. 超长文插入「……（中间部分遗失）……」，但提示词元</text>
  <text x="70" y="283" font-size="11" fill="#334155">与窗口第 0 位一律从均值和 ICA 拟合中剔除；</text>
  <text x="58" y="302" font-size="11" fill="#334155">2. 每篇训练上限抽 512 个位置，8,000 篇凑齐 250 万词；</text>
  <text x="58" y="321" font-size="11" fill="#334155">3. 与 v1 / v2 语料彻底零文档重叠，内置 N=100 J-Lens。</text>

  <!-- 右栏：双向同卷交叉验证 -->
  <rect x="418" y="68" width="376" height="282" rx="8" fill="#f0fdf4" />
  <rect x="418" y="68" width="5" height="282" rx="2" fill="#16a34a" />
  <text x="438" y="93" font-size="14.5" font-weight="bold" fill="#15803d">同考卷正面对决：中层谷底翻倍，多抓 2.9 万根轴</text>
  <text x="438" y="112" font-size="11.5" fill="#475569">全 64 层 Fit/Test 锁在 1.07×（L01）至 1.48×（L24），零层超 1.5×</text>

  <!-- L32 与 L33 对比柱 -->
  <text x="438" y="140" font-size="12" font-weight="bold" fill="#111827">同一份 136.6 万词完整长文测试集（L32 / L33 中位数）：</text>

  <text x="438" y="166" font-size="11.5" fill="#475569">旧 v2 考完整长文</text>
  <rect x="550" y="153" width="85" height="17" rx="3" fill="#94a3b8" />
  <text x="643" y="166" font-size="11.5" fill="#475569">L32 = 9.03 / L33 = 8.71</text>

  <text x="438" y="194" font-size="11.5" font-weight="bold" fill="#15803d">新 v3 考完整长文</text>
  <rect x="550" y="181" width="158" height="18" rx="3" fill="#16a34a" />
  <text x="714" y="194" font-size="11.5" font-weight="bold" fill="#15803d">16.80 / 16.77</text>

  <!-- 反向验证 -->
  <text x="438" y="224" font-size="12" font-weight="bold" fill="#111827">反向验证（把新 v3 退回 500 篇首段 512 词元残卷考试）：</text>
  <text x="438" y="248" font-size="11.5" fill="#b45309">新 v3 考首段残卷</text>
  <rect x="550" y="235" width="88" height="17" rx="3" fill="#f59e0b" />
  <text x="646" y="248" font-size="11.5" font-weight="bold" fill="#b45309">回落至 9.32 / 9.10</text>

  <rect x="438" y="268" width="338" height="66" rx="6" fill="#ffffff" />
  <text x="450" y="289" font-size="11.5" font-weight="bold" fill="#166534">• 全网 32.7 万轴总中位数：29.93 → 41.77（+39.6%）</text>
  <text x="450" y="308" font-size="11.5" font-weight="bold" fill="#166534">• κ &gt; 10 强非高斯轴：239,187 → 268,320（+29,133 根）</text>
  <text x="450" y="325" font-size="11" fill="#475569">双向实锤：新增的 2.9 万根强轴专司首段没出场的长文中尾段概念</text>
</svg>

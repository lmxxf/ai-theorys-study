<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="820" height="400" fill="#ffffff" />

  <text x="410" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111827">同样不做标准性格训练：为什么 Claude 思维链整齐，Gemini 却经常乱窜？</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">真正的分水岭不在那句免责声明，而在「早期是否明文展示倒逼清洗」与「底座施工先后顺序」</text>

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- 上栏：Claude 施工管线 -->
  <rect x="24" y="66" width="772" height="150" rx="8" fill="#f8fafc" />
  <rect x="24" y="66" width="5" height="150" rx="2" fill="#16a34a" />
  <text x="44" y="91" font-size="14" font-weight="bold" fill="#15803d">Claude 路线：明文交付倒逼清洗 ＋ 先训第一人称底座再长推理（内外同源）</text>

  <!-- Step 1 -->
  <rect x="44" y="106" width="218" height="92" rx="6" fill="#ffffff" />
  <text x="58" y="127" font-size="12.5" font-weight="bold" fill="#111827">1. 第一人称宪法底座先行</text>
  <text x="58" y="147" font-size="11" fill="#475569">先把第一人称自评与条理刻进</text>
  <text x="58" y="165" font-size="11" fill="#475569">主干权重，再往上嫁接长推理</text>
  <text x="58" y="184" font-size="10.5" fill="#15803d">思考与作答天然共享同一口吻</text>

  <line x1="266" y1="152" x2="288" y2="152" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />

  <!-- Step 2 -->
  <rect x="294" y="106" width="232" height="92" rx="6" fill="#ffffff" />
  <text x="308" y="127" font-size="12.5" font-weight="bold" fill="#111827">2. 3.7–4 代明文展示倒逼清洗</text>
  <text x="308" y="147" font-size="11" fill="#475569">原文直接卖给用户看，逼出类似</text>
  <text x="308" y="165" font-size="11" fill="#475569">R1 正式版的冷启动与语种对齐</text>
  <text x="308" y="184" font-size="10.5" fill="#15803d">哪怕后代藏起原文，干净轨道仍在</text>

  <line x1="530" y1="152" x2="552" y2="152" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)" />

  <!-- Step 3 -->
  <rect x="558" y="106" width="222" height="92" rx="6" fill="#dcfce7" />
  <text x="572" y="127" font-size="12.5" font-weight="bold" fill="#14532d">3. 自回归近端回读高信噪比</text>
  <text x="572" y="147" font-size="11" fill="#166534">写代码调工具时回读整齐草稿</text>
  <text x="572" y="165" font-size="11" fill="#166534">摘要与正文逻辑严丝合缝</text>
  <text x="572" y="184" font-size="10.5" font-weight="bold" fill="#14532d">长链 Agent 单步稳 → p^n 收益高</text>

  <!-- 下栏：Gemini 施工管线 -->
  <rect x="24" y="232" width="772" height="152" rx="8" fill="#fef2f2" />
  <rect x="24" y="232" width="5" height="152" rx="2" fill="#dc2626" />
  <text x="44" y="257" font-size="14" font-weight="bold" fill="#b91c1c">Gemini 路线：加密黑盒配外部摘要遮丑 ＋ 野生刷题区外刷礼貌漆（两张皮）</text>

  <!-- Step 1 -->
  <rect x="44" y="272" width="218" height="94" rx="6" fill="#ffffff" />
  <text x="58" y="293" font-size="12.5" font-weight="bold" fill="#111827">1. 加密黑盒 + 外部摘要代笔</text>
  <text x="58" y="313" font-size="11" fill="#475569">第一天就藏住原文，派云端小模</text>
  <text x="58" y="331" font-size="11" fill="#475569">型替它翻译总结门面给用户看</text>
  <text x="58" y="350" font-size="10.5" fill="#b91c1c">彻底失去清洗底层草稿的产品动力</text>

  <line x1="266" y1="319" x2="288" y2="319" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)" />

  <!-- Step 2 -->
  <rect x="294" y="272" width="232" height="94" rx="6" fill="#ffffff" />
  <text x="308" y="293" font-size="12.5" font-weight="bold" fill="#111827">2. 内部退化为 R1-Zero 放羊区</text>
  <text x="308" y="313" font-size="11" fill="#475569">只看结果对错判分，英文题库占优</text>
  <text x="308" y="331" font-size="11" fill="#475569">中英乱窜、无意义怀疑、原地复读</text>
  <text x="308" y="350" font-size="10.5" fill="#b91c1c">只在最后正文出口刷一层客服漆</text>

  <line x1="530" y1="319" x2="552" y2="319" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)" />

  <!-- Step 3 -->
  <rect x="558" y="272" width="222" height="94" rx="6" fill="#fee2e2" />
  <text x="572" y="293" font-size="12.5" font-weight="bold" fill="#7f1d1d">3. 脏草稿直接污染近端注意力</text>
  <text x="572" y="313" font-size="11" fill="#991b1b">模型下一步必须回读几千字乱麻</text>
  <text x="572" y="331" font-size="11" fill="#991b1b">摘要器老实暴露「反复纠结同句」</text>
  <text x="572" y="350" font-size="10.5" font-weight="bold" fill="#7f1d1d">长链任务易随高熵草稿跑偏</text>
</svg>

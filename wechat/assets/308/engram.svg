<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700">
  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
    .t { fill: #1f2937; }
    .dim { fill: #6b7280; }
    .lbl { font-size: 13px; }
    .sm { font-size: 11px; }
    .mono { font-family: 'DejaVu Sans Mono', monospace; }
  </style>
  <rect width="980" height="700" fill="#fbfbfd"/>

  <text x="490" y="34" text-anchor="middle" class="t" font-size="19" font-weight="bold">Engram：从 token 算出地址，查表取一行，对得上才放进残差流</text>

  <!-- 步骤 1 -->
  <rect x="40" y="58" width="900" height="66" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="66" cy="91" r="13" fill="#4f46e5"/>
  <text x="66" y="96" text-anchor="middle" fill="#fff" class="sm" font-weight="bold">1</text>
  <text x="92" y="82" class="t lbl" font-weight="bold">先做归一化：把写法不同、意思一样的 token 合并</text>
  <text x="92" y="104" class="dim sm">大小写、重音、多余空格统统抹平——</text>
  <text x="330" y="104" class="t sm mono">" The"  "the"  "THE"</text>
  <text x="500" y="104" class="dim sm">→ 算出来是同一个地址</text>

  <!-- 步骤 2 -->
  <rect x="40" y="136" width="900" height="118" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="66" cy="169" r="13" fill="#4f46e5"/>
  <text x="66" y="174" text-anchor="middle" fill="#fff" class="sm" font-weight="bold">2</text>
  <text x="92" y="162" class="t lbl" font-weight="bold">用前面几个 token 算哈希，一趟循环顺带算出三种长度</text>

  <g>
    <rect x="100" y="184" width="60" height="26" rx="4" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="130" y="202" text-anchor="middle" class="t sm">前3个</text>
    <rect x="168" y="184" width="60" height="26" rx="4" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="198" y="202" text-anchor="middle" class="t sm">前2个</text>
    <rect x="236" y="184" width="60" height="26" rx="4" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="266" y="202" text-anchor="middle" class="t sm">前1个</text>
    <rect x="304" y="184" width="70" height="26" rx="4" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
    <text x="339" y="202" text-anchor="middle" class="t sm" font-weight="bold">当前</text>
  </g>

  <path d="M392 197 H432" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a1)"/>

  <g>
    <rect x="440" y="176" width="150" height="20" rx="3" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="515" y="191" text-anchor="middle" class="t sm">2-gram 的地址</text>
    <rect x="440" y="200" width="150" height="20" rx="3" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="515" y="215" text-anchor="middle" class="t sm">3-gram 的地址</text>
    <rect x="440" y="224" width="150" height="20" rx="3" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="515" y="239" text-anchor="middle" class="t sm">4-gram 的地址</text>
  </g>

  <rect x="612" y="176" width="316" height="68" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="770" y="196" text-anchor="middle" class="t sm" font-weight="bold">地址只跟输入的 token 有关</text>
  <text x="770" y="215" text-anchor="middle" class="dim sm">不依赖模型算到哪一层的中间结果</text>
  <text x="770" y="234" text-anchor="middle" class="t sm" font-weight="bold">→ 所以可以提前知道要查哪几行</text>

  <!-- 步骤 3 -->
  <rect x="40" y="266" width="900" height="126" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="66" cy="299" r="13" fill="#4f46e5"/>
  <text x="66" y="304" text-anchor="middle" fill="#fff" class="sm" font-weight="bold">3</text>
  <text x="92" y="292" class="t lbl" font-weight="bold">查表：8 个头各查各的，每个头有自己那段桶（长度取不同质数，互不重叠）</text>

  <g>
    <rect x="100" y="310" width="86" height="62" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="143" y="330" text-anchor="middle" class="t sm">头 1</text>
    <text x="143" y="348" text-anchor="middle" class="dim sm">约 1600</text>
    <text x="143" y="364" text-anchor="middle" class="dim sm">万条</text>
  </g>
  <g>
    <rect x="194" y="310" width="86" height="62" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="237" y="330" text-anchor="middle" class="t sm">头 2</text>
    <text x="237" y="348" text-anchor="middle" class="dim sm">约 1600</text>
    <text x="237" y="364" text-anchor="middle" class="dim sm">万条</text>
  </g>
  <text x="304" y="346" text-anchor="middle" class="dim" font-size="15">···</text>
  <g>
    <rect x="330" y="310" width="86" height="62" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="373" y="330" text-anchor="middle" class="t sm">头 8</text>
    <text x="373" y="348" text-anchor="middle" class="dim sm">约 1600</text>
    <text x="373" y="364" text-anchor="middle" class="dim sm">万条</text>
  </g>

  <path d="M432 341 H476" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a1)"/>
  <rect x="484" y="318" width="128" height="46" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="548" y="338" text-anchor="middle" class="t sm" font-weight="bold">取出若干行</text>
  <text x="548" y="355" text-anchor="middle" class="dim sm">每行 256 维</text>

  <rect x="638" y="302" width="290" height="78" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="783" y="322" text-anchor="middle" class="t sm" font-weight="bold">表放在宿主内存里，不在显存</text>
  <text x="783" y="342" text-anchor="middle" class="dim sm">靠第 2 步那个性质，在后台提前搬过来</text>
  <text x="783" y="362" text-anchor="middle" class="dim sm">搬运和前面几层的计算重叠，不用等</text>

  <!-- 步骤 4 -->
  <rect x="40" y="404" width="900" height="150" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="66" cy="437" r="13" fill="#4f46e5"/>
  <text x="66" y="442" text-anchor="middle" fill="#fff" class="sm" font-weight="bold">4</text>
  <text x="92" y="430" class="t lbl" font-weight="bold">门控：查到的东西不是直接用，要先跟当前语境对一对</text>

  <rect x="100" y="450" width="150" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="175" y="466" text-anchor="middle" class="t sm">查表取出的</text>
  <text x="175" y="483" text-anchor="middle" class="t sm">键 和 值</text>

  <rect x="100" y="500" width="150" height="38" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="175" y="524" text-anchor="middle" class="t sm">当前的残差流</text>

  <path d="M258 471 C 288 471, 288 494, 312 494" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a1)"/>
  <path d="M258 519 C 288 519, 288 500, 312 500" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="320" y="470" width="170" height="54" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="405" y="490" text-anchor="middle" class="t sm" font-weight="bold">算两者的相似度</text>
  <text x="405" y="509" text-anchor="middle" class="dim sm">归一化点积 → 0 到 1 的开度</text>

  <path d="M498 497 H540" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a1)"/>

  <rect x="548" y="446" width="180" height="46" rx="5" fill="#ecfdf5" stroke="#34d399"/>
  <text x="638" y="465" text-anchor="middle" class="t sm" font-weight="bold">对得上 → 门开大</text>
  <text x="638" y="483" text-anchor="middle" class="dim sm">这条记忆加进残差流</text>

  <rect x="548" y="502" width="180" height="46" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="638" y="521" text-anchor="middle" class="t sm" font-weight="bold">对不上 → 门关小</text>
  <text x="638" y="539" text-anchor="middle" class="dim sm">几乎不影响残差流</text>

  <rect x="748" y="446" width="180" height="102" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="838" y="470" text-anchor="middle" class="t sm" font-weight="bold">这道门治的是什么</text>
  <text x="838" y="492" text-anchor="middle" class="dim sm">哈希会撞车，也可能</text>
  <text x="838" y="509" text-anchor="middle" class="dim sm">查到不相干的东西</text>
  <text x="838" y="531" text-anchor="middle" class="dim sm">有门在，就不会硬塞</text>

  <!-- 底部 -->
  <rect x="40" y="566" width="900" height="110" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="62" y="592" class="t lbl" font-weight="bold">整台机器 40 层，只有两层装了这个模块（第 2 层和第 15 层），两层加起来 196B 参数</text>
  <text x="62" y="618" class="t lbl">放在这两个位置的理由很实在：让训练时流水线各段的显存占用均衡，不是什么深刻的架构考量</text>
  <text x="62" y="646" class="t lbl">图像 token 不参与——回看时碰到图像就截断，不会拿半句话跨过一张图去算 n-gram</text>
  <text x="62" y="668" class="dim sm">注：第 2 层、第 15 层是按人类数法；配置文件里写的是零索引的 1 和 14</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>

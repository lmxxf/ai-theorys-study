<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1020" width="980" height="1020" font-family="WenQuanYi Micro Hei, Noto Sans CJK SC, sans-serif">
  <rect width="980" height="1020" fill="#fbfbfd" rx="10"/>

  <!-- 标题 -->
  <text x="490" y="36" text-anchor="middle" fill="#1e293b" font-size="21" font-weight="bold">Meta Muse Spark Open (816B-A42B) 全景架构解剖图</text>
  <text x="490" y="60" text-anchor="middle" fill="#64748b" font-size="14">62 层全稀疏 MoE 主干（46 层滑窗 RoPE ＋ 16 层全局 NoPE）｜4096 维潜空间专家｜原生图/影/音三模态</text>

  <!-- 图例 -->
  <rect x="24" y="76" width="932" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <g transform="translate(40, 90)" font-size="13" fill="#334155" font-weight="bold">
    <rect x="0" y="0" width="18" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="25" y="13" fill="#1e40af">蓝层：2048 滑窗注意力 + RoPE（46 层）</text>

    <rect x="285" y="0" width="18" height="16" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="310" y="13" fill="#854d0e">黄层：1M 全局注意力 + NoPE（16 层，每 4 层 1 个）</text>

    <rect x="635" y="0" width="18" height="16" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="660" y="13" fill="#5b21b6">紫块：4096 维潜空间 MoE（62 层皆有）</text>
  </g>

  <!-- ================= 左半屏：三模态入口 + 62层内部拓扑 + 输出 ================= -->
  <!-- 顶部三模态入口 -->
  <rect x="24" y="134" width="462" height="106" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="255" y="158" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="bold">原生三模态输入 → 统一对齐至 8192 维主干</text>
  
  <rect x="36" y="168" width="138" height="60" rx="6" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="105" y="188" text-anchor="middle" fill="#0f766e" font-size="12.5" font-weight="bold">文本词表 (1.66B)</text>
  <text x="105" y="205" text-anchor="middle" fill="#334155" font-size="11">202,048 × 8192</text>
  <text x="105" y="221" text-anchor="middle" fill="#64748b" font-size="10">出词表带无参 RMSNorm</text>

  <rect x="184" y="168" width="142" height="60" rx="6" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="255" y="188" text-anchor="middle" fill="#0f766e" font-size="12.5" font-weight="bold">视觉/视频塔 (1.8B)</text>
  <text x="255" y="205" text-anchor="middle" fill="#334155" font-size="11">50层 ViT (1536维)</text>
  <text x="255" y="221" text-anchor="middle" fill="#64748b" font-size="10">2×2洗牌→6144→8192</text>

  <rect x="336" y="168" width="138" height="60" rx="6" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="405" y="188" text-anchor="middle" fill="#0f766e" font-size="12.5" font-weight="bold">音频塔 (0.12B)</text>
  <text x="405" y="205" text-anchor="middle" fill="#334155" font-size="11">4层纯因果卷积金字塔</text>
  <text x="405" y="221" text-anchor="middle" fill="#64748b" font-size="10">16×6×5×4 = 80ms/词</text>

  <path d="M255 240 L255 254" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="255,258 249,250 261,250" fill="#64748b"/>

  <!-- 62 层主干结构框 -->
  <rect x="24" y="260" width="462" height="638" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="255" y="285" text-anchor="middle" fill="#1e293b" font-size="14.5" font-weight="bold">语言主干：共 62 层（主干 8192 维，非嵌入参数 816.54B）</text>
  <text x="255" y="305" text-anchor="middle" fill="#64748b" font-size="11.5">排布：第 0～1 层为 [滑窗, 全局]，第 2～61 层重复 15 组 [滑窗, 滑窗, 滑窗, 全局]</text>

  <!-- 62 层缩略分布条 -->
  <rect x="38" y="316" width="434" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="335" fill="#334155" font-size="11.5" font-weight="bold">全网 62 层注意力与位置编码排布（★黄格 = 全局 NoPE，共 16 层）：</text>
  <text x="50" y="353" fill="#1e40af" font-size="11">• 第 0～1 层：[S0] → <tspan fill="#854d0e" font-weight="bold">★第 1 层 G1 (NoPE)</tspan><tspan fill="#475569">（NVFP4 版第 0、61 层专家不量化）</tspan></text>
  <text x="50" y="369" fill="#1e40af" font-size="11">• 第 2～61 层：重复 15 组 [S, S, S, <tspan fill="#854d0e" font-weight="bold">★G (位于第 5, 9, 13 ... 57, 61 层)</tspan>]</text>

  <!-- 单层内部解剖（放大图） -->
  <rect x="38" y="384" width="434" height="500" rx="8" fill="#fcfcff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="255" y="406" text-anchor="middle" fill="#334155" font-size="13.5" font-weight="bold">◆ 单层（MuseSparkTextDecoderLayer）内部前向放大图</text>

  <!-- 子层 A: Gated Attention -->
  <rect x="52" y="418" width="406" height="128" rx="7" fill="#fefce8" stroke="#eab308" stroke-width="1.8"/>
  <text x="255" y="439" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">① 门控分组查询注意力（Gated GQA，每层 218.10M 参数）</text>
  <text x="64" y="460" fill="#1e293b" font-size="11.2">• 输入过 CenteredRMSNorm (1+w) → Q (128头×64) / K,V (16头×64，8:1)</text>
  <text x="64" y="479" fill="#1e293b" font-size="11.2">• Q, K 过无参 RMSNorm，Q 额外乘常数 qk_scale_factor = 5.473</text>
  <text x="64" y="498" fill="#b45309" font-size="11.2" font-weight="bold">• 滑窗层 (46层) 加 RoPE (θ=50万, 窗2048) ｜ 全局层 (16层) 为 NoPE (θ=0)</text>
  <text x="64" y="517" fill="#1e293b" font-size="11.2">• 输出过无参 o_norm，再乘 Sigmoid(gate_proj(x)) 门控 → o_proj [8192, 8192]</text>
  <text x="64" y="536" fill="#64748b" font-size="11">• 出门过无参 post_attention_layernorm</text>

  <!-- 残差门 1 -->
  <rect x="95" y="554" width="320" height="36" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="255" y="570" text-anchor="middle" fill="#9f1239" font-size="11.5" font-weight="bold">★ 单位圆方差守恒残差门 (MuseSparkResidualGate)</text>
  <text x="255" y="584" text-anchor="middle" fill="#be123c" font-size="10.8">out = α·residual + β·x，其中 β=σ(w/0.3)，α² + β² ≡ 1</text>

  <!-- 子层 B: Latent MoE -->
  <rect x="52" y="598" width="406" height="226" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="255" y="619" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="bold">② 4096 维潜空间混合专家（Latent MoE，每层 12.95B 参数）</text>
  <text x="64" y="640" fill="#1e293b" font-size="11.2">• 路由器在 8192 维打分：Sigmoid + e_score_correction_bias (256 选 8)</text>
  
  <rect x="66" y="649" width="378" height="28" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="255" y="668" text-anchor="middle" fill="#4c1d95" font-size="11.2" font-weight="bold">进门砍半降维：pre_expert_proj [8192, 4096] + CenteredRMSNorm</text>

  <rect x="66" y="684" width="378" height="72" rx="5" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="255" y="704" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="bold">256 个路由专家全住在 4096 维潜空间（0 共享专家）</text>
  <text x="76" y="724" fill="#334155" font-size="11">• 单专家 SwiGLU：gate/up [4096, 4096] + down [4096, 4096] = 50.33M</text>
  <text x="76" y="743" fill="#334155" font-size="11">• 每个激活专家算完单独过 InputScaledRMSNorm，再按路由权重加权求和</text>

  <rect x="66" y="763" width="378" height="28" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="255" y="782" text-anchor="middle" fill="#4c1d95" font-size="11.2" font-weight="bold">出门还原升维：post_expert_proj [4096, 8192] → InputScaledRMSNorm</text>
  <text x="255" y="813" text-anchor="middle" fill="#64748b" font-size="11">（单层 256 专家共 12.885B；每词元激活 8 个专家 = 402.65M 参数）</text>

  <!-- 残差门 2 -->
  <rect x="95" y="832" width="320" height="36" rx="18" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="255" y="848" text-anchor="middle" fill="#9f1239" font-size="11.5" font-weight="bold">★ 第二道单位圆方差守恒残差门 (α² + β² ≡ 1)</text>
  <text x="255" y="862" text-anchor="middle" fill="#be123c" font-size="10.8">全程 FP32 计算门控系数，严防 62 层残差流数值爆炸</text>

  <path d="M255 898 L255 912" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="255,916 249,908 261,908" fill="#64748b"/>

  <!-- 底部输出 -->
  <rect x="24" y="918" width="462" height="82" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="255" y="941" text-anchor="middle" fill="#9a3412" font-size="14" font-weight="bold">输出：lm_head (1.66B) ＋ Gemma 式 tanh 软截断 ＋ 外挂 DFlash2</text>
  <text x="255" y="963" text-anchor="middle" fill="#7c2d12" font-size="11.5">logits 先乘 0.1768，再用 20·tanh(x/20) 硬封顶在 [-20, +20] 区间</text>
  <text x="255" y="984" text-anchor="middle" fill="#9a3412" font-size="11.2">无内置 MTP｜次日老黄外挂 4.38B DFlash2 草稿头（抽第 3/19/31/47/59 层特征）</text>

  <!-- ================= 右半屏：四大深度对账卡片 ================= -->
  <!-- 卡片 1: 816B-A42B 参数与显存账 -->
  <rect x="504" y="134" width="452" height="202" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="522" y="164" fill="#1e3a8a" font-size="17" font-weight="bold">① “816B-A42B” 参数与 1.64 TB 权重账本</text>
  <text x="522" y="191" fill="#1e293b" font-size="13">• 词表进出不共享：202,048 × 8192 × 2 = 3.31B（加视觉/音频约 5.6B）</text>
  <text x="522" y="216" fill="#1e293b" font-size="13">• 62 层注意力 + 潜投影：13.52B + 4.16B = 17.68B（每步全激活）</text>
  <text x="522" y="241" fill="#1e293b" font-size="13">• 62 层 × 256 专家：798.86B（每步激活 8 个 = 24.96B）</text>
  <rect x="520" y="254" width="420" height="68" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="532" y="276" fill="#1e3a8a" font-size="13" font-weight="bold">非嵌入总参数 = 816.54B ｜ 非嵌入激活 = 42.64B</text>
  <text x="532" y="297" fill="#334155" font-size="12">• BF16 原版：1,644.33 GB（合 1,531.4 GiB，官方要求 2TB 显存）</text>
  <text x="532" y="315" fill="#b45309" font-size="12" font-weight="bold">• NVFP4 版：533.01 GB（首尾第 0/61 层专家及全部注意力留 BF16）</text>

  <!-- 卡片 2: 对比老黄 Nemotron 3.5 的潜空间与 KV 缓存 -->
  <rect x="504" y="352" width="452" height="214" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="522" y="382" fill="#5b21b6" font-size="17" font-weight="bold">② 与老黄 Nemotron 3.5 的两处同款设计对比</text>
  <text x="522" y="409" fill="#4c1d95" font-size="13" font-weight="bold">1. 同用 Latent MoE（潜空间专家），但门宽差 4 倍：</text>
  <text x="532" y="431" fill="#334155" font-size="12.5">• 老黄 120B：4096 压到 1024 维（砍 3/4），受困于 1024 秩窄门</text>
  <text x="532" y="452" fill="#334155" font-size="12.5">• 小扎 816B：8192 压到 4096 维（仅砍半），但砍掉了共享专家</text>
  <text x="522" y="478" fill="#4c1d95" font-size="13" font-weight="bold">2. 同用全局 NoPE 省 1M 上下文 KV 缓存：</text>
  <rect x="520" y="488" width="420" height="64" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="532" y="510" fill="#5b21b6" font-size="13" font-weight="bold">1M 上下文 KV 缓存：BF16 下 64.36 GiB（FP8 下约 32.2 GiB）</text>
  <text x="532" y="531" fill="#475569" font-size="12">• 46 层滑窗只存 2048 词 = 368 MiB；16 层全局每层 4 GiB = 64 GiB</text>
  <text x="532" y="547" fill="#64748b" font-size="11.5">（若 62 层全开全局注意力需 248 GiB，3:1 滑窗直接省掉四分之三）</text>

  <!-- 卡片 3: HF 源码暴露的“百家衣”拼装表 -->
  <rect x="504" y="582" width="452" height="186" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="522" y="612" fill="#854d0e" font-size="17" font-weight="bold">③ HF 源码 modular_muse_spark.py 的“百家衣”</text>
  <text x="522" y="638" fill="#1e293b" font-size="12.5">Hugging Face 工程师写模块化实现时，直接复用了各家现成零件：</text>
  <text x="522" y="662" fill="#334155" font-size="12.5">• <tspan font-weight="bold" fill="#854d0e">Gemma 2 / 3 / 4</tspan>：CenteredRMSNorm (1+w) 与末尾 tanh 软截断</text>
  <text x="522" y="685" fill="#334155" font-size="12.5">• <tspan font-weight="bold" fill="#854d0e">DeepSeek-V3 &amp; MiniMax-M2</tspan>：专家组与 Sigmoid 偏置路由器</text>
  <text x="522" y="708" fill="#334155" font-size="12.5">• <tspan font-weight="bold" fill="#854d0e">Kimi-K2.5 &amp; Qwen2.5-VL &amp; GLM-4V</tspan>：视觉塔注意力与 2D RoPE</text>
  <text x="522" y="731" fill="#334155" font-size="12.5">• <tspan font-weight="bold" fill="#854d0e">AfMoE &amp; Voxtral</tspan>：门控注意力骨架与音频塔流式因果一维卷积</text>
  <text x="522" y="754" fill="#64748b" font-size="11.5">（连同 8 月发布的 30B 端侧稠密小弟 Muse-Glimmer-30B 共用同一套底子）</text>

  <!-- 卡片 4: 闭源吃肉 vs 开源挨揍 + 安全阉割 -->
  <rect x="504" y="784" width="452" height="216" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  <text x="522" y="814" fill="#9f1239" font-size="17" font-weight="bold">④ 闭源吃肉、开源滞后 ＋ “防越狱模范生”</text>
  <text x="522" y="841" fill="#1e293b" font-size="13">• <tspan font-weight="bold" fill="#1e40af">10 月闭源真旗舰 Muse Wonder</tspan>：AA 考 52 / 56 分，追平 GPT-6</text>
  <text x="522" y="865" fill="#1e293b" font-size="13">• <tspan font-weight="bold" fill="#be123c">10 月开源 Muse Spark Open</tspan>：拿 4 月初代底子下放，仅考 <tspan font-weight="bold">39 分</tspan></text>
  <text x="522" y="889" fill="#1e293b" font-size="13">• 编程与生产力全线落后 GLM-5.3 (45) / Kimi K3 (44) / Qwen3.8 (45)</text>
  <rect x="520" y="902" width="420" height="84" rx="6" fill="#ffffff" stroke="#fda4af"/>
  <text x="532" y="924" fill="#9f1239" font-size="13" font-weight="bold">开源前加训“额外安全护栏”的代价：</text>
  <text x="532" y="946" fill="#334155" font-size="12">• StrongREJECT v2 越狱破防率压到 <tspan font-weight="bold" fill="#15803d">0.5%</tspan>（国模在 62%～66%）</text>
  <text x="532" y="966" fill="#b91c1c" font-size="12" font-weight="bold">• 但 FORTRESS 正常问题误伤拒答率飙至 17.4%（Kimi K3 仅 2.7%）</text>
  <text x="532" y="982" fill="#64748b" font-size="11.2">打不过写代码，就在 README 里点名拉踩“Kimi K3 拒答率不如我高”</text>
</svg>

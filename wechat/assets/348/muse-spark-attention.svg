<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="WenQuanYi Micro Hei, Noto Sans CJK SC, sans-serif">
  <rect width="900" height="650" fill="#fbfbfd" rx="10"/>

  <!-- 标题 -->
  <text x="450" y="34" text-anchor="middle" fill="#1e293b" font-size="20" font-weight="bold">门控分组查询注意力（MuseSparkTextAttention）单层内部解剖</text>
  <text x="450" y="56" text-anchor="middle" fill="#64748b" font-size="13.5">8:1 GQA（128 个 Q 头共用 16 个 KV 头，单头 64 维）＋ Sigmoid 输出门控支路｜单层 218.10M 参数 × 62 层 = 13.52B</text>

  <!-- 顶部输入 -->
  <rect x="230" y="72" width="440" height="44" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="450" y="92" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">输入隐藏状态 x [8192] → 过 CenteredRMSNorm (1 + w)</text>
  <text x="450" y="109" text-anchor="middle" fill="#475569" font-size="11.5">一分为四：同时喂给 Q、K、V 三条注意力投影 ＋ 右侧独立 Gate 门控投影</text>

  <!-- 分叉连线 -->
  <path d="M450 116 L450 132" stroke="#64748b" stroke-width="2"/>
  <path d="M135 132 L765 132" stroke="#64748b" stroke-width="2"/>
  <path d="M135 132 L135 148" stroke="#2563eb" stroke-width="2"/>
  <polygon points="135,152 130,144 140,144" fill="#2563eb"/>
  <path d="M355 132 L355 148" stroke="#0d9488" stroke-width="2"/>
  <polygon points="355,152 350,144 360,144" fill="#0d9488"/>
  <path d="M555 132 L555 148" stroke="#0d9488" stroke-width="2"/>
  <polygon points="555,152 550,144 560,144" fill="#0d9488"/>
  <path d="M765 132 L765 148" stroke="#db2777" stroke-width="2"/>
  <polygon points="765,152 760,144 770,144" fill="#db2777"/>

  <!-- ================= 四条并行支路 ================= -->
  <!-- 第 1 路：Q -->
  <rect x="30" y="154" width="210" height="196" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" y="178" text-anchor="middle" fill="#1e3a8a" font-size="15" font-weight="bold">① 查询支路 Q (128头)</text>
  <rect x="44" y="188" width="182" height="36" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="135" y="205" text-anchor="middle" fill="#1e40af" font-size="12.5" font-weight="bold">q_proj [8192, 8192]</text>
  <text x="135" y="220" text-anchor="middle" fill="#64748b" font-size="11">67.11M 参数 · 切成 128 头 × 64 维</text>

  <rect x="44" y="232" width="182" height="26" rx="5" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="135" y="249" text-anchor="middle" fill="#1e293b" font-size="12">过无参 q_norm (RMSNorm)</text>

  <rect x="44" y="266" width="182" height="34" rx="5" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="135" y="282" text-anchor="middle" fill="#b91c1c" font-size="12" font-weight="bold">× qk_scale_factor (5.473)</text>
  <text x="135" y="295" text-anchor="middle" fill="#991b1b" font-size="10.5">放大 Q 压低温度，防百万词元稀释</text>

  <rect x="44" y="308" width="182" height="32" rx="5" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="135" y="323" text-anchor="middle" fill="#854d0e" font-size="11.5" font-weight="bold">46层滑窗: RoPE (θ=50万)</text>
  <text x="135" y="336" text-anchor="middle" fill="#b45309" font-size="11" font-weight="bold">16层全局: NoPE (θ=0 不旋转)</text>

  <!-- 第 2 路：K -->
  <rect x="255" y="154" width="200" height="196" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="355" y="178" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="bold">② 键支路 K (仅16头)</text>
  <rect x="269" y="188" width="172" height="36" rx="5" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="355" y="205" text-anchor="middle" fill="#0f766e" font-size="12.5" font-weight="bold">k_proj [8192, 1024]</text>
  <text x="355" y="220" text-anchor="middle" fill="#64748b" font-size="11">8.39M 参数 · 切成 16 头 × 64 维</text>

  <rect x="269" y="232" width="172" height="26" rx="5" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
  <text x="355" y="249" text-anchor="middle" fill="#1e293b" font-size="12">过无参 k_norm (RMSNorm)</text>

  <rect x="269" y="266" width="172" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="355" y="282" text-anchor="middle" fill="#475569" font-size="11.5">每 8 个 Q 头共用 1 个 K 头</text>
  <text x="355" y="295" text-anchor="middle" fill="#64748b" font-size="10.5">（8:1 GQA 省去 7/8 键缓存）</text>

  <rect x="269" y="308" width="172" height="32" rx="5" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="355" y="323" text-anchor="middle" fill="#854d0e" font-size="11.5" font-weight="bold">46层滑窗: RoPE (θ=50万)</text>
  <text x="355" y="336" text-anchor="middle" fill="#b45309" font-size="11" font-weight="bold">16层全局: NoPE (θ=0 不旋转)</text>

  <!-- 第 3 路：V -->
  <rect x="470" y="154" width="170" height="196" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="555" y="178" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="bold">③ 值支路 V (仅16头)</text>
  <rect x="482" y="188" width="146" height="36" rx="5" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="555" y="205" text-anchor="middle" fill="#0f766e" font-size="12.5" font-weight="bold">v_proj [8192, 1024]</text>
  <text x="555" y="220" text-anchor="middle" fill="#64748b" font-size="11">8.39M 参数 · 16 头 × 64 维</text>

  <rect x="482" y="242" width="146" height="90" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="3,2"/>
  <text x="555" y="272" text-anchor="middle" fill="#475569" font-size="12">不加 RMSNorm</text>
  <text x="555" y="292" text-anchor="middle" fill="#475569" font-size="12">不加位置编码</text>
  <text x="555" y="314" text-anchor="middle" fill="#0f766e" font-size="11.5" font-weight="bold">直接送入注意力加权</text>

  <!-- 第 4 路：Gate（特色门控） -->
  <rect x="655" y="154" width="215" height="196" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="762" y="178" text-anchor="middle" fill="#9d174d" font-size="15" font-weight="bold">④ 输出门控支路 Gate</text>
  <rect x="669" y="188" width="187" height="40" rx="5" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/>
  <text x="762" y="206" text-anchor="middle" fill="#be185d" font-size="12.5" font-weight="bold">gate_proj [8192, 8192]</text>
  <text x="762" y="222" text-anchor="middle" fill="#64748b" font-size="11">67.11M 参数（与 q_proj 等大）</text>

  <rect x="669" y="242" width="187" height="44" rx="5" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="762" y="262" text-anchor="middle" fill="#9d174d" font-size="13" font-weight="bold">g = Sigmoid(x @ W_gate)</text>
  <text x="762" y="279" text-anchor="middle" fill="#831843" font-size="11">生成 8192 维 (0, 1) 门控开关</text>

  <text x="762" y="312" text-anchor="middle" fill="#9d174d" font-size="11.5" font-weight="bold">★ 比传统 GQA 多出 1 张大矩阵</text>
  <text x="762" y="330" text-anchor="middle" fill="#64748b" font-size="11">负责在 o_norm 之后按通道</text>
  <text x="762" y="345" text-anchor="middle" fill="#64748b" font-size="11">过滤注意力输出噪声</text>

  <!-- Q, K, V 汇入注意力核 -->
  <path d="M135 350 L135 372" stroke="#2563eb" stroke-width="2"/>
  <polygon points="135,376 130,368 140,368" fill="#2563eb"/>
  <path d="M355 350 L355 372" stroke="#0d9488" stroke-width="2"/>
  <polygon points="355,376 350,368 360,368" fill="#0d9488"/>
  <path d="M555 350 L555 372" stroke="#0d9488" stroke-width="2"/>
  <polygon points="555,376 550,368 560,368" fill="#0d9488"/>

  <!-- 注意力核心计算 + o_norm -->
  <rect x="30" y="378" width="610" height="54" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="335" y="399" text-anchor="middle" fill="#713f12" font-size="13.8" font-weight="bold">分组查询注意力 Softmax(Q @ K.T / √64) @ V → 拼回 [8192] → 过无参 o_norm</text>
  <text x="335" y="419" text-anchor="middle" fill="#854d0e" font-size="12">46 层滑窗只看最近 2048 词元（共占 368 MiB）｜16 层全局看满 1M 词元（BF16 下共占 64 GiB）</text>

  <!-- 逐元素门控相乘汇合 -->
  <path d="M335 432 L335 466 L416 466" stroke="#ca8a04" stroke-width="2.2" fill="none"/>
  <polygon points="420,466 412,461 412,471" fill="#ca8a04"/>

  <path d="M762 350 L762 466 L484 466" stroke="#db2777" stroke-width="2.2" fill="none"/>
  <polygon points="480,466 488,461 488,471" fill="#db2777"/>

  <rect x="422" y="446" width="56" height="38" rx="19" fill="#fdf2f8" stroke="#db2777" stroke-width="2.2"/>
  <text x="450" y="470" text-anchor="middle" fill="#9d174d" font-size="14" font-weight="bold">⊙ 乘</text>
  <text x="620" y="458" text-anchor="middle" fill="#9d174d" font-size="12" font-weight="bold">attn_out = o_norm(attn) ⊙ Sigmoid(gate)</text>

  <path d="M450 484 L450 502" stroke="#64748b" stroke-width="2"/>
  <polygon points="450,506 445,498 455,498" fill="#64748b"/>

  <!-- 输出投影 o_proj -->
  <rect x="130" y="508" width="640" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="528" text-anchor="middle" fill="#4c1d95" font-size="13.8" font-weight="bold">⑤ 输出投影 o_proj [8192, 8192]（67.11M 参数）→ 过无参 post_attention_layernorm</text>
  <text x="450" y="546" text-anchor="middle" fill="#5b21b6" font-size="12">输出校准为标准方差 1 的支流向量 x [8192]，送入第一道单位圆残差门 (α·residual + β·x)</text>

  <!-- 底部参数总账条 -->
  <rect x="30" y="570" width="840" height="62" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="450" y="594" text-anchor="middle" fill="#1e293b" font-size="13.8" font-weight="bold">单层 5 张矩阵参数账：67.11M (Q) + 8.39M (K) + 8.39M (V) + 67.11M (Gate) + 67.11M (O) = 218.10M / 层</text>
  <text x="450" y="618" text-anchor="middle" fill="#b91c1c" font-size="12.8" font-weight="bold">62 层合计 13.52B 参数（每词元 100% 激活；在 NVFP4 量化版中全部 62 层 self_attn 均保留 16 比特 BF16 不量化）</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="WenQuanYi Micro Hei, Noto Sans CJK SC, sans-serif">
  <rect width="880" height="620" fill="#fbfbfd" rx="10"/>

  <!-- 标题 -->
  <text x="440" y="32" text-anchor="middle" fill="#1e293b" font-size="19.5" font-weight="bold">MuseSparkTextAttention 维度缩放与出口 GLU 门控流程</text>
  <text x="440" y="53" text-anchor="middle" fill="#64748b" font-size="13">色条宽度代表向量真实维度：8192 维全宽 vs 1024 维窄条（1/8 宽）｜单层 218.1M 参数 × 62 层 = 13.52B</text>

  <!-- 顶部输入：8192 全宽条 -->
  <rect x="120" y="68" width="640" height="34" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
  <text x="440" y="90" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="bold">输入词元向量 x ：[ 8192 维 ]（全宽）</text>

  <!-- ================= 上半截：标准 8:1 GQA 注意力（宽 vs 窄） ================= -->
  <rect x="28" y="116" width="664" height="248" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="44" y="138" fill="#334155" font-size="13" font-weight="bold">上半截：8:1 GQA（K、V 压窄到 1/8）</text>

  <!-- 输入到 Q, K, V 的漏斗阴影与箭头 -->
  <!-- Q: 保持宽 -->
  <path d="M200 102 L200 162" stroke="#2563eb" stroke-width="2" fill="none"/>
  <polygon points="200,166 195,158 205,158" fill="#2563eb"/>
  <rect x="122" y="142" width="156" height="18" rx="3" fill="#ffffff"/>
  <text x="200" y="155" text-anchor="middle" fill="#1e40af" font-size="11.5" font-weight="bold">W_q [8192 → 8192] (67.1M)</text>

  <!-- K: 宽变窄 1/8 漏斗 -->
  <polygon points="396,144 504,144 470,168 430,168" fill="#ccfbf1" opacity="0.7"/>
  <path d="M450 102 L450 162" stroke="#0d9488" stroke-width="2" fill="none"/>
  <polygon points="450,166 445,158 455,158" fill="#0d9488"/>
  <rect x="378" y="126" width="144" height="18" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="450" y="139" text-anchor="middle" fill="#0f766e" font-size="11.2" font-weight="bold">W_k [8192 → 1024] (8.4M)</text>

  <!-- V: 宽变窄 1/8 漏斗 -->
  <polygon points="546,144 654,144 620,168 580,168" fill="#ccfbf1" opacity="0.7"/>
  <path d="M600 102 L600 162" stroke="#0d9488" stroke-width="2" fill="none"/>
  <polygon points="600,166 595,158 605,158" fill="#0d9488"/>
  <rect x="528" y="126" width="144" height="18" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="600" y="139" text-anchor="middle" fill="#0f766e" font-size="11.2" font-weight="bold">W_v [8192 → 1024] (8.4M)</text>

  <!-- Q 宽条 (312px 代表 8192 维) -->
  <rect x="44" y="168" width="312" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="185" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="bold">Q ：[ 8192 维 ]（128 头 × 64 维）</text>
  <text x="200" y="199" text-anchor="middle" fill="#1e40af" font-size="10.5">过 q_norm × 5.473｜滑窗加 RoPE / 全局 NoPE</text>

  <!-- K 窄条 (40px = 312/8 代表 1024 维！) -->
  <rect x="430" y="168" width="40" height="36" rx="4" fill="#99f6e4" stroke="#0d9488" stroke-width="2"/>
  <text x="450" y="191" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="bold">K</text>
  <text x="450" y="218" text-anchor="middle" fill="#0f766e" font-size="11.5" font-weight="bold">[1024 维] (1/8 宽)</text>
  <text x="450" y="233" text-anchor="middle" fill="#64748b" font-size="10.5">16 头 × 64 维 (过 k_norm)</text>

  <!-- V 窄条 (40px 代表 1024 维！) -->
  <rect x="580" y="168" width="40" height="36" rx="4" fill="#99f6e4" stroke="#0d9488" stroke-width="2"/>
  <text x="600" y="191" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="bold">V</text>
  <text x="600" y="218" text-anchor="middle" fill="#0f766e" font-size="11.5" font-weight="bold">[1024 维] (1/8 宽)</text>
  <text x="600" y="233" text-anchor="middle" fill="#64748b" font-size="10.5">16 头 × 64 维 (存 KV 缓存)</text>

  <!-- 窄变宽广播膨出漏斗：从 Q(128头) 和 K,V(16头广播8倍) 汇入 8192 宽条 -->
  <polygon points="430,242 620,242 660,296 44,296" fill="#fef9c3" opacity="0.6"/>
  <path d="M200 204 L200 290" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4,2" fill="none"/>
  <polygon points="200,294 196,287 204,287" fill="#2563eb"/>
  <path d="M450 238 L450 256 L360 290" stroke="#0d9488" stroke-width="1.8" fill="none"/>
  <polygon points="357,292 362,285 366,292" fill="#0d9488"/>
  <path d="M600 238 L600 256 L500 290" stroke="#0d9488" stroke-width="1.8" fill="none"/>
  <polygon points="497,292 502,285 506,292" fill="#0d9488"/>

  <rect x="190" y="258" width="376" height="22" rx="4" fill="#ffffff" opacity="0.9"/>
  <text x="378" y="274" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">16 个 KV 头广播 8 倍配对 128 个 Q 头：Softmax(Q @ K.T / √64) @ V</text>

  <!-- 注意力输出：重新撑回 8192 维全宽条 -->
  <rect x="44" y="296" width="616" height="36" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="352" y="319" text-anchor="middle" fill="#713f12" font-size="13.5" font-weight="bold">注意力输出：128 头各经 64 维无参 o_norm → 拼回 [ 8192 维 ]（恢复全宽）</text>

  <!-- ================= 下半截：独立于注意力的出口 GLU 门控 ================= -->
  <rect x="28" y="380" width="824" height="172" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.8"/>
  <text x="44" y="404" fill="#9d174d" font-size="13.5" font-weight="bold">下半截：注意力算完后，出口套一个乘法门控单元（两路 8192 维逐通道相乘 → 8192 维）</text>

  <!-- 右侧旁路：从顶部输入 x 直接拉下来算 Gate [8192] -->
  <path d="M740 102 L740 416" stroke="#db2777" stroke-width="2.5" fill="none"/>
  <polygon points="740,420 735,412 745,412" fill="#db2777"/>
  <rect x="700" y="210" width="156" height="44" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="778" y="230" text-anchor="middle" fill="#9d174d" font-size="12" font-weight="bold">旁路 W_gate (67.1M)</text>
  <text x="778" y="246" text-anchor="middle" fill="#831843" font-size="11">[8192 → 8192] 不进注意力</text>

  <!-- 左路 8192 与 右路 Gate 8192 对齐相乘 -->
  <path d="M240 332 L240 416" stroke="#ca8a04" stroke-width="2.5" fill="none"/>
  <polygon points="240,420 235,412 245,412" fill="#ca8a04"/>

  <rect x="44" y="422" width="360" height="34" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="224" y="444" text-anchor="middle" fill="#713f12" font-size="13" font-weight="bold">o_norm(Attn) ：[ 8192 维 ]</text>

  <circle cx="440" cy="439" r="18" fill="#ffffff" stroke="#db2777" stroke-width="2.2"/>
  <text x="440" y="444" text-anchor="middle" fill="#9d174d" font-size="14" font-weight="bold">⊙</text>

  <rect x="476" y="422" width="360" height="34" rx="5" fill="#fbcfe8" stroke="#db2777" stroke-width="1.8"/>
  <text x="656" y="444" text-anchor="middle" fill="#831843" font-size="13" font-weight="bold">Sigmoid(x @ W_gate) ：[ 8192 维开关 ]</text>

  <path d="M440 457 L440 484" stroke="#7c3aed" stroke-width="2.5" fill="none"/>
  <polygon points="440,488 435,480 445,480" fill="#7c3aed"/>
  <text x="565" y="477" fill="#5b21b6" font-size="12" font-weight="bold">右乘输出矩阵 W_o [8192, 8192] (67.1M)</text>

  <!-- 最终输出 8192 全宽条 -->
  <rect x="120" y="490" width="640" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="440" y="513" text-anchor="middle" fill="#4c1d95" font-size="14" font-weight="bold">最终输出 (o_norm(Attn) ⊙ Sigmoid(Gate)) @ W_o ：[ 8192 维 ]（全宽）</text>
  <text x="440" y="542" text-anchor="middle" fill="#64748b" font-size="12">注：下半截与 FFN 的门控线性单元（GLU）结构相似，相当于把原本单层的 W_o 升级成了 (W_gate + W_o) 双矩阵门控</text>

  <!-- 底部总账一句话 -->
  <rect x="28" y="566" width="824" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="440" y="590" text-anchor="middle" fill="#1e293b" font-size="13.5" font-weight="bold">单层 5 张矩阵：67.1M (W_q) + 8.4M (W_k) + 8.4M (W_v) + 67.1M (W_gate) + 67.1M (W_o) = 218.1M</text>
</svg>
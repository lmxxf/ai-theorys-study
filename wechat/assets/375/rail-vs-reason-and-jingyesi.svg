  <text x="210" y="399" font-size="11" fill="#1e3a8a">「poem / 詩」「照耀」</text>

  <text x="357" y="362" font-size="14" font-weight="bold" fill="#94a3b8">→</text>

  <rect x="370" y="302" width="194" height="114" rx="6" fill="#fef2f2" />
  <rect x="370" y="302" width="194" height="4" rx="2" fill="#dc2626" />
  <text x="380" y="323" font-size="12" font-weight="bold" fill="#b91c1c">L32 腰部篇章中枢（破案）</text>
  <text x="380" y="343" font-size="11" fill="#991b1b">第 1 主岛 C1909 (z=16.67)</text>
  <text x="380" y="361" font-size="11.5" font-weight="bold" fill="#dc2626">「查看答案解析 / 点击上方蓝字」</text>
  <text x="380" y="382" font-size="11" fill="#475569">第 2 主岛 C782 (z=13.08)</text>
  <text x="380" y="399" font-size="11" fill="#111827">「何等 / 愁 / 寂寞 / 惆」</text>

  <text x="571" y="362" font-size="14" font-weight="bold" fill="#94a3b8">→</text>

  <rect x="584" y="302" width="196" height="114" rx="6" fill="#ffffff" />
  <rect x="584" y="302" width="196" height="4" rx="2" fill="#7c3aed" />
  <text x="594" y="323" font-size="12" font-weight="bold" fill="#6d28d9">L40–L63 深层归位与出口</text>
  <text x="594" y="343" font-size="11" fill="#475569">L40 C1513 (z=20.23)</text>
  <text x="594" y="360" font-size="11" font-weight="bold" fill="#111827">「白居易 / 诗句 / 诗词」</text>
  <text x="594" y="381" font-size="11" fill="#475569">L63 出口层 C2033 (z=14.20)</text>
  <text x="594" y="398" font-size="11" font-weight="bold" fill="#6d28d9">「夜 / 霜 / 兮」配月亮岛</text>

  <!-- 底部真实生成印证条 -->
  <rect x="44" y="428" width="736" height="50" rx="6" fill="#fffbeb" />
  <text x="58" y="448" font-size="11.5" font-weight="bold" fill="#92400e">为什么 L32 整首诗被 C1909（z = 11.90 至 21.50）统治？看模型背完「低头思故乡。」下一秒的真实续写：</text>
  <text x="58" y="468" font-size="11.5" fill="#78350f">「《静夜思》是唐代诗人李白所作的一首五言古诗。这首诗写的是在安静的夜晚，诗人看到床前的月光……」——教辅题库钢印实锤。</text>
</svg>

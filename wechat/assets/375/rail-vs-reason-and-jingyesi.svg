<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" width="820" height="510" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif" style="background-color:#ffffff;">
  <rect width="820" height="510" fill="#ffffff" />

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">第 32 层海陆航迹对比，与《静夜思》「明月」纵向穿海剖面</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">高斯白噪海参照线（4,096 条随机向量）：z_max+ 95%/99% = 4.30 / 4.64 · 跨维峰度 Kurt_d 99% = 0.16</text>

  <!-- 上半部左栏：熟诗山脊高铁 -->
  <rect x="24" y="66" width="376" height="176" rx="8" fill="#f0fdf4" />
  <rect x="24" y="66" width="5" height="176" rx="2" fill="#16a34a" />
  <text x="42" y="90" font-size="14.5" font-weight="bold" fill="#15803d">8 段熟诗直达续写：高耸山脊陆桥</text>
  <text x="42" y="112" font-size="12" fill="#111827">• 正极最高海拔 z_max+：<tspan font-weight="bold" fill="#15803d">18.97</tspan>（远超海平线 4.30）</text>
  <text x="42" y="133" font-size="12" fill="#111827">• 单步跨维峰度 Kurt_d：<tspan font-weight="bold" fill="#15803d">15.12</tspan>（Top-20 占 13.49%）</text>
  <text x="42" y="154" font-size="12" fill="#111827">• 航速与曲率：步长 <tspan font-weight="bold">0.706</tspan> · 曲率 <tspan font-weight="bold">2.70</tspan> · 熵 <tspan font-weight="bold">0.258 bits</tspan></text>
  <text x="42" y="175" font-size="12" fill="#111827">• 超额大陆能量比 ΔC_10：<tspan font-weight="bold" fill="#15803d">+0.72%</tspan>（正半轴 +4.01%）</text>
  <text x="42" y="200" font-size="11.5" fill="#475569">纯高斯平摊比例 = 0%：全程沿高 κ 大岛山脊高速直冲</text>
  <rect x="42" y="212" width="310" height="14" rx="3" fill="#bbf7d0" />
  <rect x="42" y="212" width="275" height="14" rx="3" fill="#16a34a" />
  <text x="360" y="223" font-size="11" font-weight="bold" fill="#15803d">18.97</text>

  <!-- 上半部右栏：括号多步推理 -->
  <rect x="420" y="66" width="376" height="176" rx="8" fill="#fff7ed" />
  <rect x="420" y="66" width="5" height="176" rx="2" fill="#ea580c" />
  <text x="438" y="90" font-size="14.5" font-weight="bold" fill="#c2410c">8 道括号多步推理：低峰度算子浅滩混航</text>
  <text x="438" y="112" font-size="12" fill="#111827">• 正极最高海拔 z_max+：<tspan font-weight="bold" fill="#c2410c">10.68</tspan>（出括号 7/8 回落卸力）</text>
  <text x="438" y="133" font-size="12" fill="#111827">• 单步跨维峰度 Kurt_d：<tspan font-weight="bold" fill="#c2410c">2.99</tspan>（集中度骤降 5 倍，Top-20 占 8.53%）</text>
  <text x="438" y="154" font-size="12" fill="#111827">• 航速与曲率：步长 <tspan font-weight="bold">0.640</tspan> · 曲率 <tspan font-weight="bold">3.08</tspan> · 熵 <tspan font-weight="bold">0.584 bits</tspan></text>
  <text x="438" y="175" font-size="12" fill="#111827">• 超额大陆能量比 ΔC_10：<tspan font-weight="bold" fill="#c2410c">-4.50%</tspan>（纯高斯比例仍为 0%）</text>
  <text x="438" y="200" font-size="11.5" fill="#475569">例：37×24=888 个位「8」登 C3416（z=13.93，语料 κ 仅 1.2）</text>
  <rect x="438" y="212" width="310" height="14" rx="3" fill="#fed7aa" />
  <rect x="438" y="212" width="155" height="14" rx="3" fill="#ea580c" />
  <text x="602" y="223" font-size="11" font-weight="bold" fill="#c2410c">10.68</text>

  <!-- 下半部：《静夜思》“明月”（rail_01 t=18）纵向穿海剖面 -->
  <rect x="24" y="260" width="772" height="232" rx="8" fill="#f8fafc" />
  <rect x="24" y="260" width="5" height="232" rx="2" fill="#2563eb" />
  <text x="44" y="286" font-size="15" font-weight="bold" fill="#1e40af">纵向穿海意外现场：续写《静夜思》「明月」从 L00 到 L63 踩过了什么岛？</text>

  <!-- 五站卡片 -->
  <rect x="44" y="302" width="136" height="114" rx="6" fill="#ffffff" />
  <rect x="44" y="302" width="136" height="4" rx="2" fill="#64748b" />
  <text x="54" y="323" font-size="12" font-weight="bold" fill="#334155">L00–L10 浅层字面</text>
  <text x="54" y="343" font-size="11" fill="#475569">L00 C78 (z=9.03)</text>
  <text x="54" y="360" font-size="11" font-weight="bold" fill="#111827">「ming / MING」</text>
  <text x="54" y="381" font-size="11" fill="#475569">L10 C1839 (z=21.66)</text>
  <text x="54" y="398" font-size="11" font-weight="bold" fill="#0f766e">「赏月 / 新月 / 满月」</text>

  <text x="187" y="362" font-size="14" font-weight="bold" fill="#94a3b8">→</text>

  <rect x="200" y="302" width="150" height="114" rx="6" fill="#eff6ff" />
  <rect x="200" y="302" width="150" height="4" rx="2" fill="#2563eb" />
  <text x="210" y="323" font-size="12" font-weight="bold" fill="#1d4ed8">L20 意象黄金层</text>
  <text x="210" y="343" font-size="11" fill="#1e40af">主岛 C1277 (z=34.12)</text>
  <text x="210" y="361" font-size="11.5" font-weight="bold" fill="#111827">「月球 / 嫦娥 / lunar」</text>

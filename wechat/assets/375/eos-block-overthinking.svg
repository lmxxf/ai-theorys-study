<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" width="560" height="390" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif" style="background-color:#ffffff;">
  <rect width="560" height="390" fill="#ffffff" />

  <!-- 标题 -->
  <text x="24" y="34" font-size="17" font-weight="700" fill="#111827">焊死 EOS 反例：L32 三项核心指标实测对比</text>
  <text x="24" y="55" font-size="12.5" fill="#4b5563">23+19=42 自然到港 vs 机械复读对照 vs 焊死 EOS 续写 96 步</text>

  <!-- 图例 -->
  <rect x="24" y="70" width="12" height="12" rx="2" fill="#22c55e" />
  <text x="42" y="81" font-size="12.5" fill="#111827">自然解码</text>
  <rect x="122" y="70" width="12" height="12" rx="2" fill="#9ca3af" />
  <text x="140" y="81" font-size="12.5" fill="#111827">机械复读对照</text>
  <rect x="252" y="70" width="12" height="12" rx="2" fill="#ef4444" />
  <text x="270" y="81" font-size="12.5" fill="#111827">焊死 EOS 续写 96 步</text>

  <!-- 区块 1: 5步有效秩 rank5 -->
  <text x="24" y="114" font-size="14" font-weight="700" fill="#111827">1. 5 步局部切平面有效秩 rank5（越低越像原地兜圈）</text>
  <rect x="24" y="124" width="340" height="16" rx="3" fill="#22c55e" />
  <text x="372" y="137" font-size="13.5" font-weight="700" fill="#15803d">4.05</text>

  <rect x="24" y="146" width="288" height="16" rx="3" fill="#9ca3af" />
  <text x="320" y="159" font-size="13.5" font-weight="700" fill="#4b5563">3.43（复读跌落）</text>

  <rect x="24" y="168" width="354" height="16" rx="3" fill="#ef4444" />
  <text x="386" y="181" font-size="13.5" font-weight="700" fill="#b91c1c">4.22（逆势升秩）</text>

  <!-- 区块 2: 预测熵 H -->
  <text x="24" y="218" font-size="14" font-weight="700" fill="#111827">2. 下一步预测熵 H（bits，焊死 EOS 后暴涨 10 倍）</text>
  <rect x="24" y="228" width="40" height="16" rx="3" fill="#22c55e" />
  <text x="72" y="241" font-size="13.5" font-weight="700" fill="#15803d">0.14</text>

  <rect x="24" y="250" width="34" height="16" rx="3" fill="#9ca3af" />
  <text x="66" y="263" font-size="13.5" font-weight="700" fill="#4b5563">0.12</text>

  <rect x="24" y="272" width="420" height="16" rx="3" fill="#ef4444" />
  <text x="452" y="285" font-size="13.5" font-weight="700" fill="#b91c1c">1.47</text>

  <!-- 区块 3: 横跨主岛数 -->
  <text x="24" y="322" font-size="14" font-weight="700" fill="#111827">3. 尾段横跨不同主岛数（前 4 岛覆盖率）</text>
  <rect x="24" y="332" width="84" height="16" rx="3" fill="#9ca3af" />
  <text x="116" y="345" font-size="13" font-weight="700" fill="#4b5563">11 座（前 4 岛占 71.0%）</text>

  <rect x="24" y="354" width="404" height="16" rx="3" fill="#ef4444" />
  <text x="436" y="367" font-size="13" font-weight="700" fill="#b91c1c">53 座（25.3%）</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="580" height="440" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif" style="background-color:#ffffff;">
  <rect width="580" height="440" fill="#ffffff" />

  <!-- 标题 -->
  <text x="24" y="34" font-size="17" font-weight="700" fill="#111827">《静夜思》「明月」纵向剖面：5 个代表层主轴（t=18）</text>
  <text x="24" y="56" font-size="12.5" fill="#4b5563">横条为该层 5,120 根独立坐标轴的正向激活分数 z</text>

  <!-- 纵轴连线 -->
  <line x1="94" y1="84" x2="94" y2="394" stroke="#cbd5e1" stroke-width="2" />

  <!-- L00 -->
  <circle cx="94" cy="100" r="6" fill="#64748b" />
  <text x="24" y="105" font-size="13.5" font-weight="700" fill="#334155">L00</text>
  <text x="112" y="96" font-size="13.5" font-weight="700" fill="#111827">L00 C78（第 2 名，z=9.03）字形拼音碎片</text>
  <text x="112" y="116" font-size="12.5" fill="#4b5563">词牌：「ming / MING」（第 1 名为 L00 C3278，z=11.05）</text>

  <!-- L10 -->
  <circle cx="94" cy="164" r="6" fill="#0284c7" />
  <text x="24" y="169" font-size="13.5" font-weight="700" fill="#0369a1">L10</text>
  <rect x="112" y="148" width="248" height="16" rx="3" fill="#38bdf8" />
  <text x="368" y="161" font-size="13.5" font-weight="700" fill="#0369a1">z = 21.66</text>
  <text x="112" y="182" font-size="12.5" fill="#111827">L10 C1839：「赏月 / 新月 / 满月」</text>

  <!-- L20 -->
  <circle cx="94" cy="234" r="7" fill="#16a34a" />
  <text x="24" y="239" font-size="13.5" font-weight="700" fill="#15803d">L20</text>
  <rect x="112" y="218" width="386" height="18" rx="3" fill="#22c55e" />
  <text x="506" y="232" font-size="13.5" font-weight="700" fill="#15803d">34.12</text>
  <text x="112" y="254" font-size="13" font-weight="700" fill="#111827">L20 C1277（意象黄金层）：「月球 / 嫦娥 / lunar / Moon」</text>

  <!-- L32 教辅钢印 -->
  <circle cx="94" cy="308" r="8" fill="#dc2626" />
  <text x="24" y="313" font-size="14" font-weight="700" fill="#b91c1c">L32</text>
  <rect x="112" y="292" width="192" height="18" rx="3" fill="#ef4444" />
  <text x="312" y="306" font-size="13.5" font-weight="700" fill="#b91c1c">z = 16.67（统治全诗）</text>
  <text x="112" y="328" font-size="13.5" font-weight="700" fill="#b91c1c">L32 C1909：「… / 查看答案解析 / 点击上方蓝字」</text>
  <text x="112" y="346" font-size="12" fill="#4b5563">副岛 L32 C782（z=13.08）才管「何等 / 愁 / 寂寞」</text>

  <!-- L40 -->
  <circle cx="94" cy="390" r="6" fill="#7c3aed" />
  <text x="24" y="395" font-size="13.5" font-weight="700" fill="#6d28d9">L40</text>
  <text x="112" y="388" font-size="13.5" font-weight="700" fill="#111827">L40 C1513 + L40 C2978（回归诗词体裁）</text>
  <text x="112" y="408" font-size="12.5" fill="#4b5563">词牌：「白居易 / 诗句 / 诗词」配「moon / 月亮」</text>
</svg>

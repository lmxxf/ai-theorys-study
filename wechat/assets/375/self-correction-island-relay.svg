<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif" style="background-color:#ffffff;">
  <rect width="820" height="470" fill="#ffffff" />

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">自我纠错慢镜头：127.4° 钝角折返与第 32 层功能岛屿接力</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">初稿误算 49×51 = 2501 后，模型写出「等等，让我重新算：」改回 2499 的逐词运动学与 Top 主岛词牌</text>

  <!-- 上半部：曲率与转向角折线示意图 -->
  <rect x="24" y="64" width="772" height="148" rx="8" fill="#f8fafc" />
  <rect x="24" y="64" width="5" height="148" rx="2" fill="#ea580c" />
  <text x="44" y="87" font-size="13.5" font-weight="bold" fill="#111827">球皮测地曲率 κ_g 与球皮转角 θ 演化（t=145 至 t=152）：</text>

  <!-- 基准网格线 -->
  <line x1="60" y1="184" x2="760" y2="184" stroke="#cbd5e1" stroke-width="1" />
  <line x1="60" y1="124" x2="760" y2="124" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" />
  <text x="52" y="188" text-anchor="end" font-size="10.5" fill="#64748b">2.5</text>
  <text x="52" y="128" text-anchor="end" font-size="10.5" fill="#64748b">3.8</text>

  <!-- 8 个词元节点坐标 x: 95, 190, 285, 380, 475, 570, 665, 745 -->
  <!-- κ_g: 2.77(y172), 3.53(y136), 3.48(y139), 3.60(y133), 3.83(y122), 3.81(y123), 3.95(y117), 3.79(y124) -->
  <polyline points="95,172 190,136 285,139 380,133 475,122 570,123 665,117 745,124" fill="none" stroke="#ea580c" stroke-width="2.8" />

  <circle cx="95" cy="172" r="4.5" fill="#f59e0b" />
  <text x="95" y="160" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">κ_g=2.77</text>
  <text x="95" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">「等等」</text>

  <circle cx="190" cy="136" r="5.5" fill="#dc2626" />
  <text x="190" y="110" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">θ=127.4° 急拐</text>
  <text x="190" y="124" text-anchor="middle" font-size="10.5" fill="#dc2626">κ_g=3.53</text>
  <text x="190" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">「，」</text>

  <circle cx="285" cy="139" r="4.5" fill="#2563eb" />
  <text x="285" y="127" text-anchor="middle" font-size="10.5" fill="#1d4ed8">κ_g=3.48</text>
  <text x="285" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">「让我」</text>

  <circle cx="380" cy="133" r="5" fill="#7c3aed" />
  <text x="380" y="120" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6d28d9">κ_g=3.60</text>
  <text x="380" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d28d9">「重新」</text>

  <circle cx="475" cy="122" r="5.5" fill="#16a34a" />
  <text x="475" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">88% 分位曲率峰</text>
  <text x="475" y="111" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">κ_g=3.83</text>
  <text x="475" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">「算」</text>

  <circle cx="570" cy="123" r="4" fill="#64748b" />
  <text x="570" y="111" text-anchor="middle" font-size="10" fill="#475569">3.81</text>
  <text x="570" y="202" text-anchor="middle" font-size="12" fill="#334155">「：」</text>

  <circle cx="665" cy="117" r="4" fill="#64748b" />
  <text x="665" y="105" text-anchor="middle" font-size="10" fill="#475569">3.95</text>
  <text x="665" y="202" text-anchor="middle" font-size="11.5" fill="#334155">换行 \n</text>

  <circle cx="745" cy="124" r="4.5" fill="#0f766e" />
  <text x="745" y="112" text-anchor="middle" font-size="10" fill="#0f766e">3.79</text>
  <text x="745" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">「5」(50²)</text>

  <!-- 中间部：五步核心功能岛接力卡片 -->
  <text x="28" y="238" font-size="14" font-weight="bold" fill="#111827">第 32 层逐词登岛接力（纠偏前后 Top-5 主岛重叠度直接归 0）：</text>

  <rect x="24" y="250" width="146" height="106" rx="6" fill="#fffbeb" />
  <rect x="24" y="250" width="146" height="4" rx="2" fill="#f59e0b" />
  <text x="34" y="271" font-size="12" font-weight="bold" fill="#b45309">①「等等」异常警报</text>
  <text x="34" y="291" font-size="11" fill="#111827">主岛 C2165 (z=9.19)</text>
  <text x="34" y="308" font-size="11" font-weight="bold" fill="#92400e">「！ / ?! / 啥」</text>
  <text x="34" y="327" font-size="10.5" fill="#475569">副岛 C2016 (z=6.64)</text>
  <text x="34" y="343" font-size="10.5" fill="#475569">「unexpected / 意外」</text>

  <rect x="180" y="250" width="148" height="106" rx="6" fill="#fef2f2" />
  <rect x="180" y="250" width="148" height="4" rx="2" fill="#dc2626" />
  <text x="190" y="271" font-size="12" font-weight="bold" fill="#b91c1c">②「，」127.4° 反驳</text>
  <text x="190" y="291" font-size="11" fill="#111827">主岛 C1542 (z=7.36)</text>
  <text x="190" y="308" font-size="11" font-weight="bold" fill="#dc2626">「actually / 并非」</text>
  <text x="190" y="327" font-size="10.5" fill="#475569">「并不是 / 实际上」</text>
  <text x="190" y="343" font-size="10.5" fill="#475569">转角 2.224 rad 切轨</text>

  <rect x="338" y="250" width="148" height="106" rx="6" fill="#eff6ff" />
  <rect x="338" y="250" width="148" height="4" rx="2" fill="#2563eb" />
  <text x="348" y="271" font-size="12" font-weight="bold" fill="#1d4ed8">③「让我」自指接管</text>
  <text x="348" y="291" font-size="11" fill="#111827">主岛 C626 (z=8.11)</text>
  <text x="348" y="308" font-size="11" font-weight="bold" fill="#1e40af">「myself / my / 我的」</text>
  <text x="348" y="327" font-size="10.5" fill="#475569">副岛 C1444 (z=7.34)</text>
  <text x="348" y="343" font-size="10.5" fill="#475569">「therefore / thus」</text>

  <rect x="496" y="250" width="148" height="106" rx="6" fill="#f5f3ff" />
  <rect x="496" y="250" width="148" height="4" rx="2" fill="#7c3aed" />
  <text x="506" y="271" font-size="12" font-weight="bold" fill="#6d28d9">④「重新」推倒重建</text>
  <text x="506" y="291" font-size="11" fill="#111827">主岛 C2436 (z=11.54)</text>
  <text x="506" y="308" font-size="11" font-weight="bold" fill="#6d28d9">「重新 / 重建 / rebuild」</text>
  <text x="506" y="327" font-size="10.5" fill="#475569">副岛 C3070 (z=7.09)</text>
  <text x="506" y="343" font-size="10.5" fill="#475569">「原来是 / 更名为」</text>

  <rect x="654" y="250" width="142" height="106" rx="6" fill="#f0fdf4" />
  <rect x="654" y="250" width="142" height="4" rx="2" fill="#16a34a" />
  <text x="664" y="271" font-size="12" font-weight="bold" fill="#15803d">⑤「算」回归验算</text>
  <text x="664" y="291" font-size="11" fill="#111827">主岛 C1444 (z=8.35)</text>
  <text x="664" y="308" font-size="11" font-weight="bold" fill="#15803d">「therefore / thus」</text>
  <text x="664" y="327" font-size="10.5" fill="#475569">副岛 C2861 (z=6.80)</text>
  <text x="664" y="343" font-size="10.5" fill="#475569">「估算 / estimate」</text>

  <!-- 下半部：无注入野生改口对照 -->
  <rect x="24" y="370" width="772" height="84" rx="8" fill="#f1f5f9" />
  <rect x="24" y="370" width="5" height="84" rx="2" fill="#0284c7" />
  <text x="42" y="393" font-size="12.5" font-weight="bold" fill="#0369a1">另一处无注入自发改口（reason_05 先举坏例「某些动物是石头」，随即改写「但更严谨的例子是：某些动物是狗」）：</text>
  <text x="42" y="416" font-size="11" fill="#111827">•「但」登转折岛 <tspan font-weight="bold" fill="#0369a1">C23「nevertheless / 却没有」(z=13.27)</tspan> →「严谨」登规范岛 <tspan font-weight="bold" fill="#0369a1">C842「正式 / officially」(z=11.86)</tspan> 配比较级 C278「than」</text>
  <text x="42" y="437" font-size="11" fill="#334155">•「的例子 / 是」切上替代方案岛 <tspan font-weight="bold" fill="#0f766e">C1007「instead / 改用 / workaround」</tspan>（原主岛 C418：10.74→0.66；新主岛 C842：0.72→11.86）</text>
</svg>

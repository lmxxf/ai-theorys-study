<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 510" width="580" height="510" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif" style="background-color:#ffffff;">
  <rect width="580" height="510" fill="#ffffff" />

  <!-- 标题 -->
  <text x="24" y="34" font-size="17" font-weight="700" fill="#111827">自我纠错慢镜头：49×51 喊“等等，让我重新算”（L32）</text>
  <text x="24" y="56" font-size="12.5" fill="#4b5563">展示每帧主岛原始海拔 z（横条）与球皮测地曲率 κ_g / 转向角</text>

  <!-- 纵轴 -->
  <line x1="92" y1="78" x2="92" y2="412" stroke="#cbd5e1" stroke-width="2" />

  <!-- 帧 1 -->
  <circle cx="92" cy="96" r="6" fill="#d97706" />
  <text x="20" y="94" font-size="13.5" font-weight="700" fill="#111827">t=145</text>
  <text x="20" y="112" font-size="13.5" font-weight="700" fill="#b45309">「等等」</text>
  <rect x="112" y="82" width="230" height="16" rx="3" fill="#f59e0b" />
  <text x="350" y="95" font-size="13" font-weight="700" fill="#b45309">z = 9.19   κ_g = 2.77</text>
  <text x="112" y="115" font-size="12.5" fill="#374151">L32 C2165 异常惊叹（「啥 / 劲儿」）+ C2016「意外」</text>

  <!-- 帧 2 -->
  <circle cx="92" cy="172" r="8" fill="#dc2626" />
  <text x="20" y="170" font-size="13.5" font-weight="700" fill="#111827">t=146</text>
  <text x="20" y="188" font-size="13.5" font-weight="700" fill="#b91c1c">「，」</text>
  <rect x="112" y="158" width="184" height="16" rx="3" fill="#ef4444" />
  <text x="304" y="171" font-size="13" font-weight="700" fill="#b91c1c">z = 7.36   急拐 127.4°（κ_g=3.53）</text>
  <text x="112" y="191" font-size="12.5" font-weight="700" fill="#b91c1c">L32 C1542 反驳纠偏：「actually / 并非 / 实际上」</text>

  <!-- 帧 3 -->
  <circle cx="92" cy="248" r="6" fill="#2563eb" />
  <text x="20" y="246" font-size="13.5" font-weight="700" fill="#111827">t=147</text>
  <text x="20" y="264" font-size="13.5" font-weight="700" fill="#1d4ed8">「让我」</text>
  <rect x="112" y="234" width="203" height="16" rx="3" fill="#3b82f6" />
  <text x="323" y="247" font-size="13" font-weight="700" fill="#1d4ed8">z = 8.11   转角 117.0°</text>
  <text x="112" y="267" font-size="12.5" fill="#374151">L32 C626 第一人称自指接管：「myself / my / 我的」</text>

  <!-- 帧 4 -->
  <circle cx="92" cy="324" r="7" fill="#7c3aed" />
  <text x="20" y="322" font-size="13.5" font-weight="700" fill="#111827">t=148</text>
  <text x="20" y="340" font-size="13.5" font-weight="700" fill="#6d28d9">「重新」</text>
  <rect x="112" y="310" width="288" height="16" rx="3" fill="#8b5cf6" />
  <text x="408" y="323" font-size="13" font-weight="700" fill="#6d28d9">z = 11.54</text>
  <text x="112" y="343" font-size="12.5" fill="#374151">L32 C2436 推倒重建：「重新 / 重建 / rebuild」</text>

  <!-- 帧 5 -->
  <circle cx="92" cy="400" r="7" fill="#16a34a" />
  <text x="20" y="398" font-size="13.5" font-weight="700" fill="#111827">t=149</text>
  <text x="20" y="416" font-size="13.5" font-weight="700" fill="#15803d">「算」</text>
  <rect x="112" y="386" width="209" height="16" rx="3" fill="#22c55e" />
  <text x="329" y="399" font-size="13" font-weight="700" fill="#15803d">z = 8.35   κ_g = 3.83（88% 分位）</text>
  <text x="112" y="419" font-size="12.5" fill="#374151">L32 C1444 逻辑推演（therefore）+ C2861 估算，Top-5 重叠归 0</text>

  <!-- 底部野生对照组 -->
  <line x1="24" y1="444" x2="556" y2="444" stroke="#e5e7eb" stroke-width="1.5" />
  <text x="24" y="468" font-size="13" font-weight="700" fill="#111827">对照：无注入野生改口（reason_05「但更严谨的例子是」）</text>
  <text x="24" y="490" font-size="12.5" fill="#4b5563">L32 C23 转折(13.27) → L32 C842 正式规范(11.86) → L32 C1007 替代(instead)</text>
</svg>

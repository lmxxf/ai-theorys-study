<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" width="580" height="430" font-family="'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif" style="background-color:#ffffff;">
  <rect width="580" height="430" fill="#ffffff" />

  <!-- 标题 -->
  <text x="24" y="34" font-size="17" font-weight="700" fill="#111827">第 32 层（L32）实测：熟诗高铁 vs 括号推理 vs 纯高斯海平线</text>
  <text x="24" y="56" font-size="12.5" fill="#4b5563">数值均为 L32 白化独立基上的真实组均值（纯高斯为 4,096 条随机向量 99% 分位）</text>

  <!-- 图例 -->
  <rect x="24" y="72" width="12" height="12" rx="2" fill="#2563eb" />
  <text x="42" y="83" font-size="12.5" fill="#111827">熟诗直达（8 段）</text>
  <rect x="168" y="72" width="12" height="12" rx="2" fill="#d97706" />
  <text x="186" y="83" font-size="12.5" fill="#111827">括号多步推理（8 题）</text>
  <rect x="336" y="72" width="12" height="12" rx="2" fill="#9ca3af" />
  <text x="354" y="83" font-size="12.5" fill="#4b5563">纯高斯 99% 海平线</text>

  <!-- 指标 1: z_max+ -->
  <text x="24" y="118" font-size="14" font-weight="700" fill="#111827">1. 单步主岛正极海拔 z_max+（越高越贴近大岛山峰）</text>
  <rect x="24" y="128" width="430" height="18" rx="3" fill="#2563eb" />
  <text x="462" y="142" font-size="13.5" font-weight="700" fill="#1d4ed8">18.97</text>

  <rect x="24" y="152" width="242" height="18" rx="3" fill="#d97706" />
  <text x="274" y="166" font-size="13.5" font-weight="700" fill="#b45309">10.68</text>

  <rect x="24" y="176" width="105" height="16" rx="3" fill="#9ca3af" />
  <text x="137" y="189" font-size="12.5" fill="#4b5563">4.64（99% 分位）</text>

  <!-- 指标 2: Kurt_d -->
  <text x="24" y="226" font-size="14" font-weight="700" fill="#111827">2. 单步跨 5,120 维空间峰度 Kurt_d（推理骤降 5 倍，但仍远高于 0.16）</text>
  <rect x="24" y="236" width="420" height="18" rx="3" fill="#2563eb" />
  <text x="452" y="250" font-size="13.5" font-weight="700" fill="#1d4ed8">15.12</text>

  <rect x="24" y="260" width="83" height="18" rx="3" fill="#d97706" />
  <text x="115" y="274" font-size="13.5" font-weight="700" fill="#b45309">2.99</text>

  <rect x="24" y="284" width="6" height="16" rx="2" fill="#9ca3af" />
  <text x="38" y="297" font-size="12.5" fill="#4b5563">0.16（99% 分位，两组落入纯高斯比例均为 0%）</text>

  <!-- 指标 3: ΔC_10 -->
  <text x="24" y="334" font-size="14" font-weight="700" fill="#111827">3. 超额大陆能量比 ΔC_10（扣除 L32 固有 64.06% 大陆轴基线）</text>
  <line x1="250" y1="344" x2="250" y2="404" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="255" y="355" font-size="11.5" fill="#6b7280">0% 基线</text>

  <rect x="250" y="362" width="28" height="16" rx="3" fill="#2563eb" />
  <text x="285" y="375" font-size="13" font-weight="700" fill="#1d4ed8">+0.72%（正半轴 +4.01%）</text>

  <rect x="76" y="384" width="174" height="16" rx="3" fill="#d97706" />
  <text x="24" y="397" font-size="13" font-weight="700" fill="#b45309">-4.50%</text>
  <text x="258" y="397" font-size="12" fill="#4b5563">能量分流至 κ&lt;10 算子浅滩</text>
</svg>

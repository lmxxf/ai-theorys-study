<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Noto Sans CJK SC'">
  <rect width="960" height="660" fill="#fafbfc"/>

  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a2433">一层 full attention（GQA）的结构：谁进 cache，谁不进</text>
  <text x="480" y="64" text-anchor="middle" font-size="14" fill="#5a6b80">以 Qwen3.6-27B 的 full 层为例：24 个 Q 头 · 4 份共享 KV · 每头 256 维</text>

  <!-- 输入 token -->
  <rect x="380" y="82" width="200" height="40" rx="10" fill="#e8f2ff" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="480" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2433">一个新 token（5120 维）</text>

  <!-- 扇出箭头 -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <path d="M 460 122 Q 320 140 150 162" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M 473 122 Q 420 142 380 162" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M 487 122 Q 540 142 580 162" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M 500 122 Q 640 140 810 162" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="480" y="150" text-anchor="middle" font-size="12.5" fill="#5a6b80">过投影矩阵，分成 4 组（每组 6 个 Q 头 + 1 份共享 KV）</text>

  <!-- ============ 4 个组 ============ -->
  <!-- 组模板：手工展开 4 次 -->
  <!-- 组 1 -->
  <g transform="translate(30 170)">
    <rect x="0" y="0" width="210" height="192" rx="10" fill="#ffffff" stroke="#c8d2de" stroke-width="1.2"/>
    <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">第 1 组</text>
    <g>
      <rect x="21" y="36" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="46" y="54" text-anchor="middle" font-size="11" fill="#1a2433">Q1</text>
      <rect x="80" y="36" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="105" y="54" text-anchor="middle" font-size="11" fill="#1a2433">Q2</text>
      <rect x="139" y="36" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="164" y="54" text-anchor="middle" font-size="11" fill="#1a2433">Q3</text>
      <rect x="21" y="68" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="46" y="86" text-anchor="middle" font-size="11" fill="#1a2433">Q4</text>
      <rect x="80" y="68" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="105" y="86" text-anchor="middle" font-size="11" fill="#1a2433">Q5</text>
      <rect x="139" y="68" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="164" y="86" text-anchor="middle" font-size="11" fill="#1a2433">Q6</text>
    </g>
    <path d="M 105 98 V 116" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="21" y="122" width="80" height="30" rx="5" fill="#eef8ee" stroke="#2e8b57" stroke-width="1.6"/>
    <text x="61" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e6b47">K（256 维）</text>
    <rect x="109" y="122" width="80" height="30" rx="5" fill="#fff4e8" stroke="#d2691e" stroke-width="1.6"/>
    <text x="149" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a4b12">V（256 维）</text>
    <text x="105" y="176" text-anchor="middle" font-size="11" fill="#5a6b80">6 个 Q 挤这一份 KV</text>
  </g>
  <!-- 组 2 -->
  <g transform="translate(263 170)">
    <rect x="0" y="0" width="210" height="192" rx="10" fill="#ffffff" stroke="#c8d2de" stroke-width="1.2"/>
    <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">第 2 组</text>
    <g>
      <rect x="21" y="36" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="46" y="54" text-anchor="middle" font-size="11" fill="#1a2433">Q7</text>
      <rect x="80" y="36" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="105" y="54" text-anchor="middle" font-size="11" fill="#1a2433">Q8</text>
      <rect x="139" y="36" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="164" y="54" text-anchor="middle" font-size="11" fill="#1a2433">Q9</text>
      <rect x="21" y="68" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="46" y="86" text-anchor="middle" font-size="11" fill="#1a2433">Q10</text>
      <rect x="80" y="68" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="105" y="86" text-anchor="middle" font-size="11" fill="#1a2433">Q11</text>
      <rect x="139" y="68" width="50" height="26" rx="5" fill="#e8f2ff" stroke="#4a7fb5"/><text x="164" y="86" text-anchor="middle" font-size="11" fill="#1a2433">Q12</text>
    </g>
    <path d="M 105 98 V 116" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="21" y="122" width="80" height="30" rx="5" fill="#eef8ee" stroke="#2e8b57" stroke-width="1.6"/>
    <text x="61" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e6b47">K（256 维）</text>
    <rect x="109" y="122" width="80" height="30" rx="5" fill="#fff4e8" stroke="#d2691e" stroke-width="1.6"/>
    <text x="149" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a4b12">V（256 维）</text>
    <text x="105" y="176" text-anchor="middle" font-size="11" fill="#5a6b80">6 个 Q 挤这一份 KV</text>
  </g>
  <!-- 组 3 -->
  <g transform="translate(496 170)">
    <rect x="0" y="0" width="210" height="192" rx="10" fill="#ffffff" stroke="#c8d2de" stroke-width="1.2"/>
    <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">第 3 组</text>
    <text x="105" y="70" text-anchor="middle" font-size="13" fill="#94a3b8">Q13 …… Q18</text>
    <text x="105" y="92" text-anchor="middle" font-size="12" fill="#cbd5e1">（同款省略）</text>
    <path d="M 105 98 V 116" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="21" y="122" width="80" height="30" rx="5" fill="#eef8ee" stroke="#2e8b57" stroke-width="1.6"/>
    <text x="61" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e6b47">K（256 维）</text>
    <rect x="109" y="122" width="80" height="30" rx="5" fill="#fff4e8" stroke="#d2691e" stroke-width="1.6"/>
    <text x="149" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a4b12">V（256 维）</text>
    <text x="105" y="176" text-anchor="middle" font-size="11" fill="#5a6b80">6 个 Q 挤这一份 KV</text>
  </g>
  <!-- 组 4 -->
  <g transform="translate(729 170)">
    <rect x="0" y="0" width="210" height="192" rx="10" fill="#ffffff" stroke="#c8d2de" stroke-width="1.2"/>
    <text x="105" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">第 4 组</text>
    <text x="105" y="70" text-anchor="middle" font-size="13" fill="#94a3b8">Q19 …… Q24</text>
    <text x="105" y="92" text-anchor="middle" font-size="12" fill="#cbd5e1">（同款省略）</text>
    <path d="M 105 98 V 116" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="21" y="122" width="80" height="30" rx="5" fill="#eef8ee" stroke="#2e8b57" stroke-width="1.6"/>
    <text x="61" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e6b47">K（256 维）</text>
    <rect x="109" y="122" width="80" height="30" rx="5" fill="#fff4e8" stroke="#d2691e" stroke-width="1.6"/>
    <text x="149" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a4b12">V（256 维）</text>
    <text x="105" y="176" text-anchor="middle" font-size="11" fill="#5a6b80">6 个 Q 挤这一份 KV</text>
  </g>

  <!-- ============ 去向注解 ============ -->
  <g transform="translate(30 386)">
    <rect x="0" y="0" width="443" height="52" rx="8" fill="#f0f3f7" stroke="#c8d2de" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="221" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">24 个 Q 头：算完注意力当场扔</text>
    <text x="221" y="41" text-anchor="middle" font-size="12" fill="#94a3b8">不进 cache——所以 Q 头数不影响显存账</text>
  </g>
  <g transform="translate(496 386)">
    <rect x="0" y="0" width="443" height="52" rx="8" fill="#fdeeee" stroke="#c0504d" stroke-width="1.6"/>
    <text x="221" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0504d">4 份 K + 4 份 V：存进 KV cache</text>
    <text x="221" y="41" text-anchor="middle" font-size="12" fill="#9a4b12">以后每个新 token 都要回头查它们</text>
  </g>

  <!-- ============ 账目条 ============ -->
  <rect x="30" y="462" width="909" height="82" rx="10" fill="#0f172a"/>
  <text x="50" y="492" font-size="14.5" fill="#e2e8f0">这个 token 在<tspan font-weight="bold" fill="#fde047">这一层</tspan>留下的 cache = 2（K 和 V）× 4 份 × 256 维 × 2 字节（bf16） = <tspan font-weight="bold" fill="#fde047">4 KiB</tspan></text>
  <text x="50" y="524" font-size="14.5" fill="#e2e8f0">× 16 层 full = <tspan font-weight="bold" fill="#fde047">64 KiB / token</tspan>　　× 131072 个 token（128K 上下文）= <tspan font-weight="bold" fill="#f87171">8 GB</tspan></text>

  <!-- 对照 -->
  <text x="50" y="576" font-size="13.5" fill="#5a6b80">对照：MHA 时代 24 个 Q 头各存各的 KV——上面第一行的"4 份"换成"24 份"，一条记录 24 KiB，128K 要 192 GB；</text>
  <text x="50" y="600" font-size="13.5" fill="#5a6b80">GQA 把每条记录砍瘦 6 倍（条数一根毛没动）；另外 48 层线性注意力连"条"都不存，只留一张 3 MB 定长便签。</text>
  <text x="50" y="630" font-size="13" fill="#94a3b8">图中每个 K/V 框 256 维；一条 cache 记录 = 本层 4 个 K 框 + 4 个 V 框拼起来，共 2048 个数。</text>
</svg>

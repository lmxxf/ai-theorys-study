<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 530" width="540" height="530" style="background-color:#ffffff;font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif;">
  <defs>
    <marker id="arrDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="270" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111827">一句话的「三次变形」：从终端回车到模型输入</text>
  <text x="270" y="48" text-anchor="middle" font-size="12" fill="#4b5563">客户端负责业务文本与协议结构，推理后端负责最后压平成一维词元流</text>

  <!-- 第 1 站：本地 SQLite 状态库 -->
  <rect x="20" y="66" width="500" height="114" fill="#f8fafc" rx="8" />
  <rect x="20" y="66" width="500" height="4" fill="#334155" rx="2" />
  <text x="36" y="90" font-size="13.5" font-weight="bold" fill="#0f172a">第 1 站 · 本地 SQLite 状态库（conversations/&lt;id&gt;.db）</text>
  <text x="504" y="90" text-anchor="end" font-size="11.5" font-weight="bold" fill="#475569">二进制 Protobuf</text>

  <rect x="36" y="102" width="226" height="64" fill="#ffffff" rx="6" />
  <rect x="36" y="102" width="4" height="64" fill="#64748b" rx="2" />
  <text x="48" y="122" font-size="12" font-weight="bold" fill="#1e293b">steps 表（原始步骤流）</text>
  <text x="48" y="140" font-size="11" fill="#475569">首条输入仅存 130 字节裸文本</text>
  <text x="48" y="156" font-size="11" fill="#64748b">无 &lt;USER_REQUEST&gt; 标签与时间戳</text>

  <rect x="278" y="102" width="226" height="64" fill="#ffffff" rx="6" />
  <rect x="278" y="102" width="4" height="64" fill="#0d9488" rx="2" />
  <text x="290" y="122" font-size="12" font-weight="bold" fill="#115e59">独立工具字段＋思考签名</text>
  <text x="290" y="140" font-size="11" fill="#475569">name / args / call_id 分字段存</text>
  <text x="290" y="156" font-size="11" fill="#0f766e">附 138 字节二进制加密签名</text>

  <!-- 转换箭头 1 -->
  <line x1="270" y1="180" x2="270" y2="216" stroke="#334155" stroke-width="2.2" marker-end="url(#arrDown)" />
  <rect x="108" y="186" width="324" height="22" fill="#f1f5f9" rx="4" />
  <text x="270" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">客户端 OneHarness 序列化 ＋ protojson 转 HTTP JSON</text>

  <!-- 第 2 站：跨网卡 HTTP JSON 请求包 -->
  <rect x="20" y="222" width="500" height="134" fill="#f0f9ff" rx="8" />
  <rect x="20" y="222" width="500" height="4" fill="#0284c7" rx="2" />
  <text x="36" y="246" font-size="13.5" font-weight="bold" fill="#0c4a6e">第 2 站 · 跨网卡 HTTP 请求包（streamGenerateContent）</text>
  <text x="504" y="246" text-anchor="end" font-size="11.5" font-weight="bold" fill="#0369a1">半文本＋半 JSON</text>

  <rect x="36" y="258" width="226" height="84" fill="#ffffff" rx="6" />
  <rect x="36" y="258" width="4" height="84" fill="#0284c7" rx="2" />
  <text x="48" y="278" font-size="12" font-weight="bold" fill="#0c4a6e">已在本地拼成 XML 字符串</text>
  <text x="48" y="296" font-size="11" fill="#334155">• systemInstruction（11 块规则）</text>
  <text x="48" y="313" font-size="11" fill="#334155">• &lt;USER_REQUEST&gt; ＋ 本步时间</text>
  <text x="48" y="330" font-size="11" fill="#334155">• 设置变更 / &lt;SYSTEM_MESSAGE&gt;</text>

  <rect x="278" y="258" width="226" height="84" fill="#ffffff" rx="6" />
  <rect x="278" y="258" width="4" height="84" fill="#d97706" rx="2" />
  <text x="290" y="278" font-size="12" font-weight="bold" fill="#92400e">离开网卡时仍是 JSON 对象</text>
  <text x="290" y="296" font-size="11" fill="#334155">• tools（函数声明参数树）</text>
  <text x="290" y="313" font-size="11" fill="#334155">• thinkingConfig（推理档位）</text>
  <text x="290" y="330" font-size="11" fill="#334155">• role / functionCall / 签名</text>

  <!-- 转换箭头 2 -->
  <line x1="270" y1="356" x2="270" y2="392" stroke="#334155" stroke-width="2.2" marker-end="url(#arrDown)" />
  <rect x="114" y="362" width="312" height="22" fill="#f1f5f9" rx="4" />
  <text x="270" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">云端推理网关渲染控制符 ＋ 分词器压平为一维序列</text>

  <!-- 第 3 站：模型残差流真正吃进去的一维词元流 -->
  <rect x="20" y="398" width="500" height="114" fill="#fefce8" rx="8" />
  <rect x="20" y="398" width="500" height="4" fill="#ca8a04" rx="2" />
  <text x="36" y="422" font-size="13.5" font-weight="bold" fill="#713f12">第 3 站 · 模型输入层（Transformer 唯一认识的一维序列）</text>
  <text x="504" y="422" text-anchor="end" font-size="11.5" font-weight="bold" fill="#a16207">平坦词元 ID 流</text>

  <rect x="36" y="434" width="468" height="64" fill="#ffffff" rx="6" />
  <rect x="36" y="434" width="4" height="64" fill="#ca8a04" rx="2" />
  <text x="48" y="454" font-size="11.5" font-weight="bold" fill="#713f12">[档位与工具控制块] → [11 块系统规则] → [User 轮] → [思考＋调用＋结果]</text>
  <text x="48" y="473" font-size="11" fill="#334155">实盘首轮计费：input_tokens = 44,133（预填充 16.3s，内部思考 2 词元，正文 191 词元）</text>
  <text x="48" y="490" font-size="11" fill="#0f766e">实盘次轮计费：cache_read_tokens = 44,134（前缀原样复用）＋ 新增 input = 6,255</text>
</svg>

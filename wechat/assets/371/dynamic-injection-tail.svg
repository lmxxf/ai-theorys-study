<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" width="540" height="480" style="background-color:#ffffff;font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif;">
  <!-- 标题 -->
  <text x="270" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111827">动态提醒往哪塞：锁住前部缓存，变化全追加在队尾</text>
  <text x="270" y="48" text-anchor="middle" font-size="12" fill="#4b5563">改动前文会让整条前缀缓存失效，日常提醒一律顺着最新轮次往后贴</text>

  <!-- 上半部：锁死不动的 KV 缓存前缀区 -->
  <rect x="20" y="66" width="500" height="104" fill="#f1f5f9" rx="8" />
  <rect x="20" y="66" width="500" height="4" fill="#475569" rx="2" />
  <text x="36" y="90" font-size="13" font-weight="bold" fill="#1e293b">前部稳定前缀（次轮直接命中 cache_read_tokens = 44,134）</text>
  <text x="504" y="90" text-anchor="end" font-size="11" font-weight="bold" fill="#0f766e">只读复用 · 不改动</text>

  <rect x="36" y="102" width="468" height="54" fill="#ffffff" rx="6" />
  <text x="48" y="123" font-size="11.5" fill="#334155">工具声明 ＋ 11 块系统规则 ＋ 已完成的历史对话轮次</text>
  <text x="48" y="143" font-size="11" fill="#64748b">细节：历史轮次里的本地时间写死在创建那一刻，重发旧消息时绝不刷新时间</text>

  <!-- 分界虚线 -->
  <line x1="20" y1="184" x2="520" y2="184" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="175" y="173" width="190" height="22" fill="#ffffff" />
  <text x="270" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0284c7">▼ 队尾增量追加区（新算输入） ▼</text>

  <!-- 下半部：四类动态注入插槽 -->
  <!-- 插槽 1 -->
  <rect x="20" y="202" width="500" height="64" fill="#f0f9ff" rx="6" />
  <rect x="20" y="202" width="4" height="64" fill="#0284c7" rx="2" />
  <text x="34" y="222" font-size="12.5" font-weight="bold" fill="#0c4a6e">① 粘在用户请求后的尾巴：&lt;ADDITIONAL_METADATA&gt; 与设置变更</text>
  <text x="34" y="240" font-size="11" fill="#334155">每轮自动附带当前时间（IDE 模式下还会附加打开文档与光标行号）；</text>
  <text x="34" y="256" font-size="11" fill="#0369a1">一旦切换模型或推理档位，紧接着追加 &lt;USER_SETTINGS_CHANGE&gt;</text>

  <!-- 插槽 2 -->
  <rect x="20" y="273" width="500" height="58" fill="#fdf4ff" rx="6" />
  <rect x="20" y="273" width="4" height="58" fill="#a21caf" rx="2" />
  <text x="34" y="294" font-size="12.5" font-weight="bold" fill="#701a75">② 异步通知：&lt;SYSTEM_MESSAGE&gt;（名字叫系统，其实走普通轮次）</text>
  <text x="34" y="314" font-size="11" fill="#334155">后台任务完成、子代理回信、服务重启时塞入，默认可并入上一条工具结果</text>

  <!-- 插槽 3 -->
  <rect x="20" y="338" width="500" height="58" fill="#f0fdfa" rx="6" />
  <rect x="20" y="338" width="4" height="58" fill="#0d9488" rx="2" />
  <text x="34" y="359" font-size="12.5" font-weight="bold" fill="#115e59">③ 工具返回装饰器：执行耗时戳 ＋ 超长输出「掐腰留头尾」</text>
  <text x="34" y="379" font-size="11" fill="#334155">自动在结果前打 Created/Completed At；超长输出从正中间剪断留文件指针</text>

  <!-- 插槽 4 -->
  <rect x="20" y="403" width="500" height="62" fill="#fffbeb" rx="6" />
  <rect x="20" y="403" width="4" height="62" fill="#d97706" rx="2" />
  <text x="34" y="424" font-size="12.5" font-weight="bold" fill="#92400e">④ 回合尾拦截 Hook 与唯一会推翻前缀的 /compact</text>
  <text x="34" y="442" font-size="11" fill="#334155">goal_stop / force_invocation 在模型想停手时追塞指令催活；</text>
  <text x="34" y="457" font-size="11" fill="#78350f">唯独触发压缩（&lt;CONTEXT_SUMMARY&gt;）会裁掉旧历史，重塑整条前缀</text>
</svg>

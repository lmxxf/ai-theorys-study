<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'Noto Sans CJK SC', sans-serif">
  <rect width="1000" height="660" fill="#fafafa"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c2410c"/>
    </marker>
    <clipPath id="imgClip"><rect x="0" y="0" width="100" height="100"/></clipPath>
  </defs>

  <text x="20" y="34" font-size="18" font-weight="bold" fill="#c2410c">第二代自回归：让模型猜「下一块是什么」</text>
  <text x="20" y="54" font-size="12" fill="#666">先把图切成整数编号，再把编号排成一队，剩下的活和 GPT 猜下一个词一模一样</text>

  <!-- ===== 左：真图 ===== -->
  <g transform="translate(30,110)" clip-path="url(#imgClip)">
    <rect x="0" y="0" width="100" height="100" fill="#dbeafe"/>
    <circle cx="70" cy="30" r="14" fill="#fdba74"/>
    <path d="M0 100 L0 72 Q30 45 55 68 Q80 55 100 70 L100 100 Z" fill="#93c5fd"/>
  </g>
  <rect x="30" y="110" width="100" height="100" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="80" y="232" font-size="11" text-anchor="middle" fill="#444">256×256 像素图</text>
  <text x="80" y="247" font-size="11" text-anchor="middle" fill="#888">数据集里的真图</text>

  <line x1="138" y1="160" x2="178" y2="160" stroke="#999" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="158" y="150" font-size="10" text-anchor="middle" fill="#888">查字典</text>

  <!-- 图像字典 -->
  <rect x="185" y="112" width="130" height="96" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="250" y="134" font-size="13" text-anchor="middle" font-weight="bold" fill="#c2410c">图像字典</text>
  <text x="250" y="150" font-size="11" text-anchor="middle" fill="#7c2d12">VQ 码本，8192 个条目</text>
  <text x="250" y="170" font-size="11" text-anchor="middle" fill="#444">每个 8×8 像素块</text>
  <text x="250" y="185" font-size="11" text-anchor="middle" fill="#444">→ 最像它的那个条目编号</text>
  <text x="250" y="200" font-size="10" text-anchor="middle" fill="#888">（编号 0～8191）</text>

  <line x1="322" y1="160" x2="352" y2="160" stroke="#999" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ===== 中：整数网格 ===== -->
  <text x="454" y="90" font-size="11" text-anchor="middle" fill="#444">32×32 = 1024 个整数（这里只画 6×6 示意）</text>
  <g stroke="#c2410c" stroke-width="0.8" fill="#fff7ed">
    <rect x="358" y="100" width="192" height="192"/>
    <line x1="390" y1="100" x2="390" y2="292"/><line x1="422" y1="100" x2="422" y2="292"/>
    <line x1="454" y1="100" x2="454" y2="292"/><line x1="486" y1="100" x2="486" y2="292"/>
    <line x1="518" y1="100" x2="518" y2="292"/>
    <line x1="358" y1="132" x2="550" y2="132"/><line x1="358" y1="164" x2="550" y2="164"/>
    <line x1="358" y1="196" x2="550" y2="196"/><line x1="358" y1="228" x2="550" y2="228"/>
    <line x1="358" y1="260" x2="550" y2="260"/>
  </g>
  <g font-size="9" text-anchor="middle" fill="#7c2d12">
    <text x="374" y="119">4127</text><text x="406" y="119">88</text><text x="438" y="119">7031</text><text x="470" y="119">512</text><text x="502" y="119">6660</text><text x="534" y="119">…</text>
    <text x="374" y="151">19</text><text x="406" y="151">3305</text><text x="438" y="151">4127</text><text x="470" y="151">7788</text><text x="502" y="151">…</text><text x="534" y="151">2</text>
    <text x="374" y="183">803</text><text x="406" y="183">4127</text><text x="438" y="183">1</text><text x="470" y="183">6003</text><text x="502" y="183">5512</text><text x="534" y="183">…</text>
    <text x="374" y="215">…</text><text x="406" y="215">77</text><text x="438" y="215">2048</text><text x="470" y="215">4127</text><text x="502" y="215">913</text><text x="534" y="215">8191</text>
    <text x="374" y="247">640</text><text x="406" y="247">3305</text><text x="438" y="247">…</text><text x="470" y="247">3305</text><text x="502" y="247">12</text><text x="534" y="247">555</text>
    <text x="374" y="279">0</text><text x="406" y="279">7031</text><text x="438" y="279">2222</text><text x="470" y="279">…</text><text x="502" y="279">5</text><text x="534" y="279">4096</text>
  </g>
  <!-- 光栅扫描顺序 -->
  <g stroke="#c2410c" stroke-width="1.6" fill="none" opacity="0.55">
    <line x1="362" y1="128" x2="546" y2="128"/>
    <line x1="546" y1="128" x2="362" y2="160" stroke-dasharray="3 3" stroke-width="0.8" opacity="0.5"/>
    <line x1="362" y1="160" x2="546" y2="160"/>
    <line x1="546" y1="160" x2="362" y2="192" stroke-dasharray="3 3" stroke-width="0.8" opacity="0.5"/>
    <line x1="362" y1="192" x2="546" y2="192"/>
    <line x1="546" y1="192" x2="362" y2="224" stroke-dasharray="3 3" stroke-width="0.8" opacity="0.5"/>
    <line x1="362" y1="224" x2="546" y2="224"/>
    <line x1="546" y1="224" x2="362" y2="256" stroke-dasharray="3 3" stroke-width="0.8" opacity="0.5"/>
    <line x1="362" y1="256" x2="546" y2="256"/>
    <line x1="546" y1="256" x2="362" y2="288" stroke-dasharray="3 3" stroke-width="0.8" opacity="0.5"/>
    <line x1="362" y1="288" x2="544" y2="288" marker-end="url(#arO)"/>
  </g>
  <text x="568" y="120" font-size="11" fill="#c2410c">光栅顺序：</text>
  <text x="568" y="136" font-size="11" fill="#c2410c">从左到右、从上到下</text>
  <text x="568" y="152" font-size="10" fill="#888">像老电视的扫描线</text>
  <text x="568" y="170" font-size="10" fill="#888">左上角是第 1 块</text>
  <text x="568" y="185" font-size="10" fill="#888">右下角是第 1024 块</text>

  <!-- 网格 → 队列 -->
  <path d="M454 296 L454 330" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="464" y="320" font-size="10" fill="#888">展平成一队</text>

  <!-- ===== 左下：GPT 对照 ===== -->
  <rect x="30" y="345" width="290" height="100" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="175" y="367" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d4ed8">和 GPT 语言模型逐项对照</text>
  <text x="45" y="390" font-size="11" fill="#1e3a8a">词表 50257 个词　　↔　码本 8192 个条目</text>
  <text x="45" y="410" font-size="11" fill="#1e3a8a">一句话 = 一队词编号　↔　一张图 = 一队块编号</text>
  <text x="45" y="430" font-size="11" fill="#1e3a8a">猜下一个词　　　　　↔　猜下一块</text>

  <!-- ===== 中下：队列 → Transformer → softmax ===== -->
  <text x="350" y="358" font-size="11" fill="#444">展平后的一队（长 1024）</text>
  <g font-size="10" text-anchor="middle" fill="#7c2d12">
    <rect x="350" y="370" width="52" height="28" rx="4" fill="#fff7ed" stroke="#c2410c"/><text x="376" y="388">4127</text>
    <rect x="408" y="370" width="52" height="28" rx="4" fill="#fff7ed" stroke="#c2410c"/><text x="434" y="388">88</text>
    <rect x="466" y="370" width="52" height="28" rx="4" fill="#fff7ed" stroke="#c2410c"/><text x="492" y="388">7031</text>
    <rect x="524" y="370" width="52" height="28" rx="4" fill="#fff7ed" stroke="#c2410c"/><text x="550" y="388">…</text>
    <rect x="582" y="370" width="52" height="28" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="3 2"/><text x="608" y="388" fill="#999">?</text>
  </g>
  <text x="376" y="414" font-size="10" text-anchor="middle" fill="#888">第 1 块</text>
  <text x="434" y="414" font-size="10" text-anchor="middle" fill="#888">第 2 块</text>
  <text x="492" y="414" font-size="10" text-anchor="middle" fill="#888">第 3 块</text>
  <text x="608" y="414" font-size="10" text-anchor="middle" fill="#888">第 t 块</text>
  <text x="492" y="432" font-size="10" text-anchor="middle" fill="#888">已知前 t−1 块，猜第 t 块</text>

  <line x1="640" y1="384" x2="675" y2="384" stroke="#999" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="680" y="352" width="130" height="64" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="745" y="378" font-size="13" text-anchor="middle" font-weight="bold" fill="#c2410c">Transformer</text>
  <text x="745" y="398" font-size="11" text-anchor="middle" fill="#7c2d12">和 GPT 同一个网络</text>

  <line x1="815" y1="384" x2="850" y2="384" stroke="#999" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- softmax 8192 类 -->
  <rect x="855" y="340" width="125" height="92" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="917" y="356" font-size="11" text-anchor="middle" fill="#334155">softmax，8192 类</text>
  <g fill="#fdba74">
    <rect x="866" y="400" width="6" height="10"/><rect x="875" y="396" width="6" height="14"/>
    <rect x="884" y="404" width="6" height="6"/><rect x="893" y="392" width="6" height="18"/>
    <rect x="902" y="366" width="6" height="44" fill="#c2410c"/><rect x="911" y="402" width="6" height="8"/>
    <rect x="920" y="398" width="6" height="12"/><rect x="929" y="405" width="6" height="5"/>
    <rect x="938" y="394" width="6" height="16"/><rect x="947" y="403" width="6" height="7"/>
    <rect x="956" y="399" width="6" height="11"/><rect x="965" y="404" width="6" height="6"/>
  </g>
  <line x1="862" y1="411" x2="974" y2="411" stroke="#64748b" stroke-width="0.8"/>
  <text x="905" y="424" font-size="9" fill="#c2410c">7031</text>
  <text x="917" y="450" font-size="11" text-anchor="middle" fill="#444">猜第 t 个编号</text>
  <text x="745" y="450" font-size="11" text-anchor="middle" font-weight="bold" fill="#c2410c">交叉熵，和语言模型一个字没改</text>

  <!-- ===== 三个毛病 ===== -->
  <rect x="20" y="478" width="960" height="130" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="35" y="500" font-size="13" font-weight="bold" fill="#334155">三个毛病</text>
  <text x="35" y="526" font-size="12" font-weight="bold" fill="#334155">① 光栅顺序是装出来的因果</text>
  <text x="35" y="546" font-size="11" fill="#475569">左上角那块并不决定右边那块，</text>
  <text x="35" y="562" font-size="11" fill="#475569">图里没有「前后」，是硬排出来的。</text>
  <text x="35" y="582" font-size="11" fill="#475569">语言有天然顺序，图没有。</text>

  <text x="355" y="526" font-size="12" font-weight="bold" fill="#334155">② 串行</text>
  <text x="355" y="546" font-size="11" fill="#475569">1024 块要蹦 1024 步，</text>
  <text x="355" y="562" font-size="11" fill="#475569">每步出一块，出一张图跑 1024 次前向。</text>
  <text x="355" y="582" font-size="11" fill="#475569">GAN 是一次前向出整张。</text>

  <text x="675" y="526" font-size="12" font-weight="bold" fill="#334155">③ 字典有损</text>
  <text x="675" y="546" font-size="11" fill="#475569">进字典那一刻，高频细节已丢：</text>
  <text x="675" y="562" font-size="11" fill="#475569">8×8 块只能从 8192 个条目里挑，</text>
  <text x="675" y="582" font-size="11" fill="#475569">后面猜得再准也补不回来。</text>

  <text x="20" y="640" font-size="11" fill="#888">数字按 DALL-E 初代（2021）配置：256×256 图、32×32 网格、8192 条目码本；文字部分省略，只画图像那半边</text>
</svg>

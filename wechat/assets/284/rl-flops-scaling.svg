<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520">
  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
    .title { font-size: 15px; fill: #1e293b; font-weight: bold; }
    .axis  { font-size: 12px; fill: #475569; }
    .ylab  { font-size: 12px; fill: #1d4ed8; }
    .ylab2 { font-size: 12px; fill: #dc2626; }
    .note  { font-size: 13px; fill: #334155; }
    .score { fill: none; stroke: #1d4ed8; stroke-width: 2.2; stroke-linejoin: round; }
    .steps { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6 3.5; stroke-linejoin: round; }
    .frame { fill: none; stroke: #334155; stroke-width: 1.4; }
    .grid  { stroke: #e2e8f0; stroke-width: 1; }

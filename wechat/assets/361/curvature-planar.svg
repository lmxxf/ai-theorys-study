<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350" width="540" height="350" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <marker id="arrWhite" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f8fafc"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d8b4fe"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="540" height="350" fill="#0b0f19"/>

  <rect x="16" y="16" width="508" height="318" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="34" y="46" fill="#38bdf8" font-size="15.2" font-weight="bold">给向量加 δ：白线原 90° 弯 → 绿线拉直 (45°) vs 红线掰弯 (135°)</text>

  <!-- Shaded 2D Plane (Tabletop) -->
  <polygon points="36,222 456,222 504,68 84,68" fill="#0f2942" fill-opacity="0.45" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="490" y="214" fill="#38bdf8" font-size="12" text-anchor="end">最近两步构成的二维桌面 (Planar 局部平面)</text>

  <!-- Step 1: x0=(0,0) to x1=(1,0) [White solid] -->
  <line x1="86" y1="194" x2="248" y2="194" stroke="#f8fafc" stroke-width="3.5" marker-end="url(#arrWhite)"/>
  <!-- Extension of v0 for angle reference -->
  <line x1="258" y1="194" x2="420" y2="194" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Step 2 Original: x1=(1,0) to x2=(1,1) [White solid, 90 deg up] -->
  <line x1="258" y1="188" x2="258" y2="98" stroke="#f8fafc" stroke-width="3.5" marker-end="url(#arrWhite)"/>

  <!-- 1. GREEN: Add +delta=(1,0) to x2 -> x2_new=(2,1) [Straighten to 45 deg] -->
  <!-- Push arrow from x2=(258,90) to (378,90) -->
  <line x1="266" y1="90" x2="368" y2="90" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrGreen)"/>
  <text x="318" y="80" fill="#6ee7b7" font-size="12.5" font-weight="bold" text-anchor="middle">绿：往东加 +δ</text>
  <!-- Resulting new trajectory segment from x1(258,194) to x2_new(378,90) -->
  <line x1="263" y1="190" x2="372" y2="96" stroke="#10b981" stroke-width="3.5" marker-end="url(#arrGreen)"/>
  <circle cx="378" cy="90" r="6" fill="#10b981"/>
  <text x="432" y="94" fill="#6ee7b7" font-size="13" font-weight="bold" text-anchor="middle">拉直后 (2,1)</text>
  <text x="348" y="176" fill="#6ee7b7" font-size="13" font-weight="bold">绿线转角 45°</text>

  <!-- 2. RED: Add +delta=(-1,0) to x2 -> x2_new=(0,1) [Bend to 135 deg] -->
  <!-- Push arrow from x2=(258,90) to (138,90) -->
  <line x1="250" y1="90" x2="148" y2="90" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>
  <text x="198" y="80" fill="#fca5a5" font-size="12.5" font-weight="bold" text-anchor="middle">红：往西加 +δ</text>
  <!-- Resulting new trajectory segment from x1(258,194) to x2_new(138,90) -->
  <line x1="253" y1="190" x2="144" y2="96" stroke="#ef4444" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <circle cx="138" cy="90" r="6" fill="#ef4444"/>
  <text x="92" y="94" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="middle">掰弯后 (0,1)</text>
  <text x="152" y="156" fill="#fca5a5" font-size="13" font-weight="bold">红线 135°</text>

  <!-- 3. PURPLE: Orthogonal out-of-plane push from x2 -->
  <line x1="258" y1="90" x2="295" y2="56" stroke="#d8b4fe" stroke-width="2.5" stroke-dasharray="3 3" marker-end="url(#arrPurple)"/>
  <text x="395" y="60" fill="#d8b4fe" font-size="12.5" font-weight="bold" text-anchor="middle">紫虚线：脱离拐弯桌面随机推</text>

  <!-- Nodes for x0, x1, x2 -->
  <circle cx="80" cy="194" r="6" fill="#f8fafc"/>
  <text x="80" y="214" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">x_0=(0,0)</text>

  <circle cx="258" cy="194" r="6" fill="#f8fafc"/>
  <text x="258" y="214" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">x_1=(1,0)</text>

  <circle cx="258" cy="90" r="6.5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <text x="258" y="138" fill="#f8fafc" font-size="12.5" font-weight="bold" text-anchor="middle">原白线 90°</text>

  <!-- Legend / Summary Box -->
  <rect x="34" y="234" width="472" height="86" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="48" y="256" fill="#f8fafc" font-size="13">• <tspan font-weight="bold">白色实线</tspan>：原来的两步轨迹 (0,0)→(1,0)→(1,1)，原本拐了 90° 直角弯</text>
  <text x="46" y="280" fill="#6ee7b7" font-size="12.2">• <tspan font-weight="bold">绿色（拉直）</tspan>：往东加 δ 到 (2,1)，转角缩为 45°；<tspan fill="#fca5a5" font-weight="bold">红色（掰弯）</tspan>：扩为 135°</text>
  <text x="48" y="304" fill="#d8b4fe" font-size="13">• <tspan font-weight="bold">紫色虚线（对照组 Full 等）</tspan>：脱离当前拐弯桌面随机乱推（几何示意）</text>
</svg>

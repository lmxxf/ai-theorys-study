<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" width="540" height="310" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d8b4fe"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="540" height="310" fill="#0b0f19"/>

  <rect x="16" y="16" width="508" height="278" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="36" y="48" fill="#38bdf8" font-size="17" font-weight="bold">论文图 4 设想：中层局部轨迹平面推力（Planar）</text>

  <!-- Shaded 2D Plane -->
  <polygon points="55,190 395,190 455,80 115,80" fill="#0f2942" fill-opacity="0.55" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/>

  <circle cx="115" cy="167" r="6" fill="#94a3b8"/>
  <text x="115" y="185" fill="#cbd5e1" font-size="13.5" text-anchor="middle">x_(k-2)</text>

  <circle cx="240" cy="135" r="6" fill="#94a3b8"/>
  <text x="240" y="157" fill="#cbd5e1" font-size="13.5" text-anchor="middle">x_(k-1)</text>

  <circle cx="355" cy="97" r="7" fill="#38bdf8"/>
  <text x="405" y="102" fill="#38bdf8" font-size="14" font-weight="bold">当前点 x_k</text>

  <line x1="122" y1="165" x2="231" y2="137" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="247" y1="133" x2="346" y2="100" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- Planar straighten arrow -->
  <line x1="355" y1="97" x2="395" y2="77" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="385" y="67" fill="#6ee7b7" font-size="13.5" font-weight="bold" text-anchor="middle">+δ 拉直 (ΔC &lt; 0)</text>

  <!-- Planar bend arrow -->
  <line x1="355" y1="97" x2="328" y2="141" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="330" y="163" fill="#fca5a5" font-size="13.5" font-weight="bold" text-anchor="middle">+δ 掰弯 (ΔC &gt; 0)</text>

  <!-- Orthogonal vertical arrow -->
  <line x1="355" y1="97" x2="290" y2="59" stroke="#d8b4fe" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrowCyan)"/>
  <text x="205" y="65" fill="#d8b4fe" font-size="13.5" text-anchor="middle">垂直正交对照（ΔC 恒定）</text>

  <!-- Summary Box -->
  <rect x="36" y="202" width="468" height="78" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="50" y="224" fill="#7dd3fc" font-size="13.5" font-weight="bold">• Planar：顺着最近两步 v_(k-2), v_(k-1) 构成的拐弯平面推拉</text>
  <text x="50" y="246" fill="#cbd5e1" font-size="13">• Full / Random2 / Activation PCA：全空间或全局主成分方向</text>
  <text x="50" y="268" fill="#fca5a5" font-size="13.5" font-weight="bold">• 实测：Trajectory PCA 未复现正效应，Planar 效应高度挑位置</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="540" height="360" fill="#0b0f19"/>

  <rect x="16" y="16" width="508" height="328" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="34" y="46" fill="#38bdf8" font-size="16.5" font-weight="bold">先定坐标：MIT 测的是“同一层内横着连词”，且锁定在中间层</text>

  <!-- Y axis label (Layers) -->
  <text x="72" y="80" fill="#94a3b8" font-size="12.5" font-weight="bold" text-anchor="middle">纵向：网络层</text>

  <!-- Row 1: Deep Layer (Layer 47 / 31) -->
  <text x="72" y="114" fill="#cbd5e1" font-size="13" text-anchor="middle">末层 (L47/L31)</text>
  <circle cx="165" cy="110" r="5" fill="#475569"/>
  <circle cx="255" cy="110" r="5" fill="#475569"/>
  <circle cx="345" cy="110" r="5" fill="#475569"/>
  <circle cx="435" cy="110" r="5" fill="#475569"/>
  <line x1="172" y1="110" x2="246" y2="110" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="262" y1="110" x2="336" y2="110" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="352" y1="110" x2="426" y2="110" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Highlight Box for Middle Layer (Layer 21 / 11) -->
  <rect x="28" y="138" width="484" height="68" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="72" y="168" fill="#fde68a" font-size="13" font-weight="bold" text-anchor="middle">中间层 ★</text>
  <text x="72" y="186" fill="#f59e0b" font-size="11.5" text-anchor="middle">(L21 / L11-15)</text>

  <circle cx="165" cy="164" r="6" fill="#f59e0b"/>
  <circle cx="255" cy="164" r="6" fill="#f59e0b"/>
  <circle cx="345" cy="164" r="6" fill="#f59e0b"/>
  <circle cx="435" cy="164" r="6" fill="#f59e0b"/>

  <line x1="173" y1="164" x2="245" y2="164" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
  <line x1="263" y1="164" x2="335" y2="164" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>
  <line x1="353" y1="164" x2="425" y2="164" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrAmber)"/>

  <text x="165" y="192" fill="#fde68a" font-size="12.5" font-weight="bold" text-anchor="middle">x_0</text>
  <text x="255" y="192" fill="#fde68a" font-size="12.5" font-weight="bold" text-anchor="middle">x_1</text>
  <text x="345" y="192" fill="#fde68a" font-size="12.5" font-weight="bold" text-anchor="middle">x_2</text>
  <text x="435" y="192" fill="#fde68a" font-size="12.5" font-weight="bold" text-anchor="middle">x_3</text>

  <text x="210" y="152" fill="#fcd34d" font-size="12" text-anchor="middle">v_0</text>
  <text x="300" y="152" fill="#fcd34d" font-size="12" text-anchor="middle">v_1</text>
  <text x="390" y="152" fill="#fcd34d" font-size="12" text-anchor="middle">v_2</text>

  <!-- Row 3: Shallow Layer (Layer 0) -->
  <text x="72" y="232" fill="#cbd5e1" font-size="13" text-anchor="middle">浅层 (L0)</text>
  <circle cx="165" cy="228" r="5" fill="#475569"/>
  <circle cx="255" cy="228" r="5" fill="#475569"/>
  <circle cx="345" cy="228" r="5" fill="#475569"/>
  <circle cx="435" cy="228" r="5" fill="#475569"/>
  <line x1="172" y1="228" x2="246" y2="228" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="262" y1="228" x2="336" y2="228" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="352" y1="228" x2="426" y2="228" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- X axis labels (Tokens in sentence) -->
  <text x="165" y="256" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">词 0 ("When")</text>
  <text x="255" y="256" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">词 1 ("I")</text>
  <text x="345" y="256" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">词 2 ("got")</text>
  <text x="435" y="256" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">词 3 ("home")</text>
  <text x="300" y="276" fill="#94a3b8" font-size="12.5" font-weight="bold" text-anchor="middle">横向：一句话里先后出现的词元（时间轴）→</text>

  <!-- Explanation Footer -->
  <rect x="28" y="286" width="484" height="46" rx="6" fill="#091520" stroke="#1e293b" stroke-width="1"/>
  <text x="38" y="306" fill="#e2e8f0" font-size="11.8">• 怎么连线：固定在同一层里，把词 0 → 词 1 → 词 2 → 词 3 横着连成折线算转角</text>
  <text x="38" y="324" fill="#6ee7b7" font-size="11.8" font-weight="bold">• 测哪一层：先逐层各算一条，发现正中间层（L21/L11-15）最直且相关性最高</text>
</svg>

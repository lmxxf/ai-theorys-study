<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.55"/>
    </linearGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="540" height="280" fill="#0b0f19"/>
  <rect x="16" y="16" width="508" height="248" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.8"/>

  <text x="270" y="48" fill="#f8fafc" font-size="17" font-weight="bold" text-anchor="middle">后训练的“首词漏斗”：裸续写起点很宽，一穿客服工装就变窄</text>

  <!-- Left Zone: Raw Continuation Onset (Wide Fan of Arrows) -->
  <text x="115" y="82" fill="#7dd3fc" font-size="14" font-weight="bold" text-anchor="middle">裸续写起点（高熵 4.26 nats）</text>
  <line x1="45" y1="150" x2="165" y2="105" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="45" y1="150" x2="170" y2="132" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="45" y1="150" x2="170" y2="168" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="45" y1="150" x2="165" y2="195" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <circle cx="45" cy="150" r="6" fill="#38bdf8"/>
  <text x="115" y="222" fill="#94a3b8" font-size="13" text-anchor="middle">上百种接话思路发散</text>

  <!-- Middle Zone: The Assistant Role Tag Funnel -->
  <polygon points="195,92 315,136 315,164 195,208" fill="url(#funnelGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="255" y="145" fill="#fde68a" font-size="13.5" font-weight="bold" text-anchor="middle">assistant</text>
  <text x="255" y="165" fill="#fde68a" font-size="12.5" text-anchor="middle">角色标签漏斗</text>

  <!-- Right Zone: Narrow Customer-Service Onset -->
  <text x="415" y="82" fill="#fca5a5" font-size="13.5" font-weight="bold" text-anchor="middle">开口第 1 词（0.72 / 难题 0.48）</text>
  <line x1="318" y1="150" x2="485" y2="150" stroke="#ef4444" stroke-width="4.5" marker-end="url(#arrRed)"/>
  <rect x="336" y="168" width="160" height="34" rx="6" fill="#231215" stroke="#be123c" stroke-width="1.2"/>
  <text x="416" y="190" fill="#fda4af" font-size="13" font-weight="bold" text-anchor="middle">首词 99.3%“我们可以通过”</text>
  <text x="415" y="222" fill="#94a3b8" font-size="13" text-anchor="middle">骤降 83%，收束进客服起手词</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 940" width="540" height="940" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d8b4fe"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Explicit Solid Background -->
  <rect x="0" y="0" width="540" height="940" fill="#0b0f19"/>

  <!-- Title -->
  <text x="270" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">五分钟手算：残差流“时间轨迹曲率”</text>
  <text x="270" y="64" fill="#94a3b8" font-size="14" text-anchor="middle">固定在同一层 L 内，测连续词元位移向量的转角大小</text>

  <!-- Card 1: Straight Trajectory (Low Curvature) -->
  <rect x="20" y="84" width="500" height="236" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.8"/>
  <text x="38" y="116" fill="#10b981" font-size="17" font-weight="bold">① 情况 A：顺畅直行（c_i = 0° → 低熵高确定）</text>
  <text x="38" y="142" fill="#cbd5e1" font-size="14">手算坐标：x_0=(0,0) → x_1=(1,0) → x_2=(2,0) → x_3=(3,0)</text>

  <!-- Straight Vector Line -->
  <line x1="68" y1="196" x2="180" y2="196" stroke="#10b981" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <line x1="194" y1="196" x2="306" y2="196" stroke="#10b981" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <line x1="320" y1="196" x2="432" y2="196" stroke="#10b981" stroke-width="3.5" marker-end="url(#arrowGreen)"/>

  <circle cx="62" cy="196" r="6" fill="#10b981"/>
  <circle cx="188" cy="196" r="6" fill="#10b981"/>
  <circle cx="314" cy="196" r="6" fill="#10b981"/>
  <circle cx="440" cy="196" r="6" fill="#10b981"/>

  <text x="62" y="224" fill="#e2e8f0" font-size="14" text-anchor="middle">x_0</text>
  <text x="188" y="224" fill="#e2e8f0" font-size="14" text-anchor="middle">x_1</text>
  <text x="314" y="224" fill="#e2e8f0" font-size="14" text-anchor="middle">x_2</text>
  <text x="440" y="224" fill="#e2e8f0" font-size="14" text-anchor="middle">x_3</text>

  <text x="125" y="178" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">v_0 = (1, 0)</text>
  <text x="251" y="178" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">v_1 = (1, 0)</text>
  <text x="377" y="178" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">v_2 = (1, 0)</text>

  <rect x="38" y="242" width="464" height="62" rx="8" fill="#09191f" stroke="#065f46" stroke-width="1.2"/>
  <text x="52" y="266" fill="#a7f3d0" font-size="14">相邻两步同向：点积 v_1 · v_2 = 1×1 + 0×0 = 1</text>
  <text x="52" y="290" fill="#f8fafc" font-size="14" font-weight="bold">转角 c_1 = arccos(1) = 0°（0 弧度，笔直滑行）</text>

  <!-- Card 2: Sharp Turn Trajectory (High Curvature) -->
  <rect x="20" y="338" width="500" height="256" rx="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="38" y="370" fill="#f59e0b" font-size="17" font-weight="bold">② 情况 B：90° 急转弯（c_i = 90° → 高熵犹豫）</text>
  <text x="38" y="396" fill="#cbd5e1" font-size="14">手算坐标：x_1=(1,0) → x_2=(2,0) → x_3=(2,1) 突然向北拐</text>

  <!-- Bent Vector Line -->
  <line x1="78" y1="482" x2="195" y2="482" stroke="#10b981" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <line x1="209" y1="482" x2="326" y2="482" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrowAmber)"/>
  <!-- Dashed extension -->
  <line x1="334" y1="482" x2="450" y2="482" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 5"/>
  <!-- 90 deg turn up -->
  <line x1="334" y1="476" x2="334" y2="416" stroke="#ef4444" stroke-width="3.5" marker-end="url(#arrowRed)"/>

  <!-- Right angle arc -->
  <path d="M 360 482 A 26 26 0 0 0 334 456" fill="none" stroke="#f87171" stroke-width="2.5"/>
  <text x="372" y="468" fill="#fca5a5" font-size="15" font-weight="bold">c_1 = 90°</text>

  <circle cx="72" cy="482" r="6" fill="#10b981"/>
  <circle cx="202" cy="482" r="6" fill="#10b981"/>
  <circle cx="334" cy="482" r="6" fill="#f59e0b"/>
  <circle cx="334" cy="410" r="6" fill="#ef4444"/>

  <text x="72" y="506" fill="#e2e8f0" font-size="14" text-anchor="middle">x_0</text>
  <text x="202" y="506" fill="#e2e8f0" font-size="14" text-anchor="middle">x_1</text>
  <text x="334" y="506" fill="#fde68a" font-size="14" text-anchor="middle">x_2=(2,0)</text>
  <text x="316" y="416" fill="#fca5a5" font-size="14" text-anchor="end">x_3=(2,1)</text>
  <text x="268" y="470" fill="#fde68a" font-size="14" font-weight="bold" text-anchor="middle">v_1=(1,0)</text>
  <text x="350" y="438" fill="#fca5a5" font-size="14" font-weight="bold">v_2=(0,1)</text>

  <rect x="38" y="518" width="464" height="62" rx="8" fill="#231412" stroke="#9a3412" stroke-width="1.2"/>
  <text x="52" y="542" fill="#fed7aa" font-size="14">点积 v_1 · v_2 = 1×0 + 0×1 = 0 → 转角 c_1 = 90° (1.57 rad)</text>
  <text x="52" y="566" fill="#f8fafc" font-size="14" font-weight="bold">论文曲率 C_j = 最近 5 个状态 3 个转角的均值</text>

  <!-- Card 3: Planar Intervention vs Orthogonal -->
  <rect x="20" y="612" width="500" height="308" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="38" y="644" fill="#38bdf8" font-size="17" font-weight="bold">③ 论文图 4 设想：中层局部轨迹平面推力（Planar）</text>

  <!-- Shaded 2D Plane -->
  <polygon points="55,795 395,795 455,685 115,685" fill="#0f2942" fill-opacity="0.55" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/>

  <circle cx="115" cy="772" r="6" fill="#94a3b8"/>
  <text x="115" y="790" fill="#cbd5e1" font-size="13.5" text-anchor="middle">x_(k-2)</text>

  <circle cx="240" cy="740" r="6" fill="#94a3b8"/>
  <text x="240" y="762" fill="#cbd5e1" font-size="13.5" text-anchor="middle">x_(k-1)</text>

  <circle cx="355" cy="702" r="7" fill="#38bdf8"/>
  <text x="405" y="707" fill="#38bdf8" font-size="14" font-weight="bold">当前点 x_k</text>

  <line x1="122" y1="770" x2="231" y2="742" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="247" y1="738" x2="346" y2="705" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- Planar straighten arrow -->
  <line x1="355" y1="702" x2="395" y2="682" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="385" y="672" fill="#6ee7b7" font-size="13.5" font-weight="bold" text-anchor="middle">+δ 拉直 (ΔC &lt; 0)</text>

  <!-- Planar bend arrow -->
  <line x1="355" y1="702" x2="328" y2="746" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="330" y="768" fill="#fca5a5" font-size="13.5" font-weight="bold" text-anchor="middle">+δ 掰弯 (ΔC &gt; 0)</text>

  <!-- Orthogonal vertical arrow -->
  <line x1="355" y1="702" x2="290" y2="664" stroke="#d8b4fe" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrowCyan)"/>
  <text x="205" y="670" fill="#d8b4fe" font-size="13.5" text-anchor="middle">垂直正交对照（ΔC 恒定）</text>

  <!-- Summary Box inside Card 3 -->
  <rect x="38" y="810" width="464" height="94" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="52" y="834" fill="#7dd3fc" font-size="14" font-weight="bold">• Planar：顺着最近两步 v_(k-2), v_(k-1) 构成的拐弯平面推拉</text>
  <text x="52" y="860" fill="#cbd5e1" font-size="13.5">• Full / Random2 / Activation PCA：全空间或全局主成分方向</text>
  <text x="52" y="886" fill="#fca5a5" font-size="14" font-weight="bold">• 实测：Trajectory PCA 未复现正效应，Planar 效应高度挑位置</text>
</svg>

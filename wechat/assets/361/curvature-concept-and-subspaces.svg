<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d8b4fe"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Explicit Solid Background -->
  <rect x="0" y="0" width="800" height="580" fill="#0b0f19"/>

  <!-- Title -->
  <text x="400" y="34" fill="#f8fafc" font-size="19" font-weight="bold" text-anchor="middle">五分钟看懂：残差流“时间轨迹曲率”与中层局部平面扰动</text>
  <text x="400" y="56" fill="#94a3b8" font-size="12" text-anchor="middle">固定在神经网络同一层 L 内，顺着词元时间轴 x_0 → x_1 → x_2 → x_3 测量连续位移向量的转角大小</text>

  <!-- Left Card: Straight Trajectory (Low Curvature) -->
  <rect x="24" y="74" width="366" height="226" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
  <text x="38" y="102" fill="#10b981" font-size="13.5" font-weight="bold">① 情况 A：顺畅直行（低曲率 c_i = 0° → 低熵高确定）</text>
  <text x="38" y="122" fill="#cbd5e1" font-size="12">手算坐标：x_0=(0,0) → x_1=(1,0) → x_2=(2,0) → x_3=(3,0)</text>

  <!-- Straight Vector Line -->
  <line x1="60" y1="185" x2="140" y2="185" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="150" y1="185" x2="230" y2="185" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="240" y1="185" x2="320" y2="185" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <circle cx="55" cy="185" r="5" fill="#10b981"/>
  <circle cx="145" cy="185" r="5" fill="#10b981"/>
  <circle cx="235" cy="185" r="5" fill="#10b981"/>
  <circle cx="325" cy="185" r="5" fill="#10b981"/>

  <text x="55" y="210" fill="#e2e8f0" font-size="12" text-anchor="middle">x_0</text>
  <text x="145" y="210" fill="#e2e8f0" font-size="12" text-anchor="middle">x_1</text>
  <text x="235" y="210" fill="#e2e8f0" font-size="12" text-anchor="middle">x_2</text>
  <text x="325" y="210" fill="#e2e8f0" font-size="12" text-anchor="middle">x_3</text>

  <text x="100" y="170" fill="#6ee7b7" font-size="12" text-anchor="middle">v_0 = (1, 0)</text>
  <text x="190" y="170" fill="#6ee7b7" font-size="12" text-anchor="middle">v_1 = (1, 0)</text>
  <text x="280" y="170" fill="#6ee7b7" font-size="12" text-anchor="middle">v_2 = (1, 0)</text>

  <rect x="38" y="232" width="338" height="52" rx="6" fill="#09191f" stroke="#065f46" stroke-width="1"/>
  <text x="48" y="252" fill="#a7f3d0" font-size="11.5">相邻两步方向完全相同：v_1 · v_2 = 1×1 + 0×0 = 1</text>
  <text x="48" y="272" fill="#f8fafc" font-size="11.5" font-weight="bold">转角 c_1 = arccos(1) = 0°（0 弧度，笔直滑行）</text>

  <!-- Right Card: Sharp Turn Trajectory (High Curvature) -->
  <rect x="410" y="74" width="366" height="226" rx="10" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="424" y="102" fill="#f59e0b" font-size="13.5" font-weight="bold">② 情况 B：90° 急转弯（高曲率 c_i = 90° → 高熵犹豫）</text>
  <text x="424" y="122" fill="#cbd5e1" font-size="12">手算坐标：x_1=(1,0) → x_2=(2,0) → x_3=(2,1) 突然向北拐</text>

  <!-- Bent Vector Line -->
  <line x1="460" y1="205" x2="545" y2="205" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="555" y1="205" x2="635" y2="205" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <!-- Dashed extension of v_1 -->
  <line x1="640" y1="205" x2="725" y2="205" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- 90 deg turn up -->
  <line x1="640" y1="200" x2="640" y2="142" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)"/>

  <!-- Right angle arc -->
  <path d="M 662 205 A 22 22 0 0 0 640 183" fill="none" stroke="#f87171" stroke-width="2"/>
  <text x="688" y="190" fill="#fca5a5" font-size="12" font-weight="bold">c_1 = 90°</text>

  <circle cx="455" cy="205" r="5" fill="#10b981"/>
  <circle cx="550" cy="205" r="5" fill="#10b981"/>
  <circle cx="640" cy="205" r="5" fill="#f59e0b"/>
  <circle cx="640" cy="136" r="5" fill="#ef4444"/>

  <text x="455" y="224" fill="#e2e8f0" font-size="12" text-anchor="middle">x_0</text>
  <text x="550" y="224" fill="#e2e8f0" font-size="12" text-anchor="middle">x_1</text>
  <text x="640" y="224" fill="#fde68a" font-size="12" text-anchor="middle">x_2=(2,0)</text>
  <text x="625" y="140" fill="#fca5a5" font-size="12" text-anchor="end">x_3=(2,1)</text>
  <text x="595" y="194" fill="#fde68a" font-size="12" text-anchor="middle">v_1=(1,0)</text>
  <text x="676" y="160" fill="#fca5a5" font-size="12">v_2=(0,1)</text>

  <rect x="424" y="232" width="338" height="52" rx="6" fill="#231412" stroke="#9a3412" stroke-width="1"/>
  <text x="434" y="252" fill="#fed7aa" font-size="11.5">点积 v_1 · v_2 = 1×0 + 0×1 = 0 → c_1 = 90° (1.57 rad)</text>
  <text x="434" y="272" fill="#f8fafc" font-size="11" font-weight="bold">论文曲率 C_j = 最近 5 个状态 3 个转角均值 (c_j-4+c_j-3+c_j-2)/3</text>

  <!-- Bottom Card: Planar Intervention vs Orthogonal Perturbation -->
  <rect x="24" y="318" width="752" height="242" rx="10" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="346" fill="#38bdf8" font-size="14.5" font-weight="bold">③ 论文图 4 的“中层因果干预”设想：局部轨迹平面推力（Planar）与额外正交对照</text>

  <!-- Shaded 2D Plane -->
  <polygon points="55,515 345,515 405,390 115,390" fill="#0f2942" fill-opacity="0.55" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="230" y="542" fill="#7dd3fc" font-size="11.5" text-anchor="middle">由最近两段位移 v_(k-2), v_(k-1)（经 x_(k-2) → x_(k-1) → x_k）张成的二维局部平面</text>

  <!-- Trajectory inside plane -->
  <circle cx="105" cy="488" r="5" fill="#94a3b8"/>
  <text x="100" y="508" fill="#cbd5e1" font-size="11.5" text-anchor="middle">x_(k-2)</text>

  <circle cx="225" cy="452" r="5" fill="#94a3b8"/>
  <text x="258" y="468" fill="#cbd5e1" font-size="11.5">x_(k-1)</text>

  <circle cx="330" cy="410" r="6" fill="#38bdf8"/>
  <text x="366" y="414" fill="#38bdf8" font-size="11.5" font-weight="bold">当前点 x_k</text>

  <line x1="110" y1="486" x2="217" y2="454" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <line x1="231" y1="449" x2="323" y2="413" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Planar straighten arrow at x_k -->
  <line x1="330" y1="410" x2="365" y2="395" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="342" y="384" fill="#6ee7b7" font-size="11.5" font-weight="bold" text-anchor="middle">+δ 拉直 (ΔC &lt; 0)</text>

  <!-- Planar bend arrow at x_k -->
  <line x1="330" y1="410" x2="305" y2="450" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="292" y="468" fill="#fca5a5" font-size="11.5" font-weight="bold" text-anchor="middle">+δ 掰弯 (ΔC &gt; 0)</text>

  <!-- Orthogonal vertical arrow at x_k -->
  <line x1="330" y1="410" x2="275" y2="372" stroke="#d8b4fe" stroke-width="2.2" stroke-dasharray="3 3" marker-end="url(#arrowCyan)"/>
  <text x="210" y="370" fill="#d8b4fe" font-size="11" text-anchor="middle">额外严格正交对照（ΔC 恒定）</text>

  <!-- Right side explanation box -->
  <rect x="428" y="366" width="330" height="172" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="442" y="392" fill="#f8fafc" font-size="12.5" font-weight="bold">论文五类子空间对比（幅度 ||δ|| = 0.2 ||v_k||）：</text>
  <text x="442" y="416" fill="#cbd5e1" font-size="11.5">• Full（全空间随机）/ Random2（随机二维平面）</text>
  <text x="442" y="438" fill="#cbd5e1" font-size="11.5">• Activation PCA：沿该层全局激活前 2 主成分推</text>
  <text x="442" y="460" fill="#fde68a" font-size="11.5">• Trajectory PCA：沿单句位移序列前 2 主成分推</text>
  <text x="442" y="482" fill="#7dd3fc" font-size="11.5">• Planar：顺着最近两步构成的拐弯平面推拉</text>
  <text x="442" y="514" fill="#fca5a5" font-size="11.5" font-weight="bold">[注] 实测：Trajectory 未复现正效应，Planar 挑位置</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d30"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
  </defs>

  <!-- Explicit Solid Background -->
  <rect x="0" y="0" width="820" height="620" fill="#0b0f19"/>

  <!-- Header -->
  <text x="410" y="34" fill="#f8fafc" font-size="19" font-weight="bold" text-anchor="middle">跳出 1.5B 老模型：我们在 DGX Spark（35B-A3B / 27B / 0.6B）测出的三组现象</text>
  <text x="410" y="56" fill="#94a3b8" font-size="12" text-anchor="middle">基于 836 条全层残差流前向传播测量记录：跨句转角存在 110°~120° 几何本底，结构性跳变发生在这里</text>

  <!-- Panel 1: Role-Tag Throat Funnel & Price of I -->
  <rect x="22" y="74" width="776" height="172" rx="10" fill="url(#panelBg)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="38" y="100" fill="#38bdf8" font-size="13.5" font-weight="bold">现象一：读题熵接近，剧烈低熵抑制发生在 &lt;|im_start|&gt;assistant 喉咙漏斗（Qwen3.5-35B-A3B Base vs Post）</text>

  <!-- Group 1: Input Reading H_input -->
  <text x="115" y="124" fill="#cbd5e1" font-size="11.5" text-anchor="middle">读题内部均熵 H_input</text>
  <rect x="65" y="160" width="44" height="42" rx="4" fill="#64748b"/>
  <text x="87" y="153" fill="#e2e8f0" font-size="12" text-anchor="middle">2.00</text>
  <text x="87" y="218" fill="#94a3b8" font-size="11" text-anchor="middle">Base</text>

  <rect x="119" y="162" width="44" height="40" rx="4" fill="#38bdf8"/>
  <text x="141" y="155" fill="#7dd3fc" font-size="12" text-anchor="middle">1.90</text>
  <text x="141" y="218" fill="#7dd3fc" font-size="11" text-anchor="middle">Post</text>
  <text x="115" y="235" fill="#10b981" font-size="11" text-anchor="middle">读题熵保持高位</text>

  <!-- Group 2: Raw Reply Onset H_next -->
  <text x="285" y="124" fill="#cbd5e1" font-size="11.5" text-anchor="middle">无标签开口熵 H_next (raw)</text>
  <rect x="235" y="138" width="44" height="64" rx="4" fill="#64748b"/>
  <text x="257" y="156" fill="#f8fafc" font-size="11.5" font-weight="bold" text-anchor="middle">4.24</text>
  <text x="257" y="218" fill="#94a3b8" font-size="11" text-anchor="middle">Base</text>

  <rect x="289" y="137" width="44" height="65" rx="4" fill="#38bdf8"/>
  <text x="311" y="156" fill="#0b0f19" font-size="11.5" font-weight="bold" text-anchor="middle">4.26</text>
  <text x="311" y="218" fill="#7dd3fc" font-size="11" text-anchor="middle">Post</text>
  <text x="285" y="235" fill="#10b981" font-size="11" text-anchor="middle">裸续写完全一致</text>

  <!-- Group 3: Chat Reply Onset H_next -->
  <text x="465" y="124" fill="#fde68a" font-size="11.5" font-weight="bold" text-anchor="middle">套上 assistant 标签开口熵</text>
  <rect x="415" y="148" width="44" height="54" rx="4" fill="#64748b"/>
  <text x="437" y="142" fill="#e2e8f0" font-size="12" text-anchor="middle">3.40</text>
  <text x="437" y="218" fill="#94a3b8" font-size="11" text-anchor="middle">Base</text>

  <rect x="469" y="190" width="44" height="12" rx="3" fill="#ef4444"/>
  <text x="500" y="182" fill="#fca5a5" font-size="11.5" font-weight="bold" text-anchor="middle">0.72 (难题 0.48)</text>
  <text x="491" y="218" fill="#fca5a5" font-size="11" text-anchor="middle">Post</text>
  <text x="465" y="235" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">较 raw 降 83% (难题降 85%)</text>

  <!-- Right Box in Panel 1: Price of Ego -->
  <rect x="550" y="114" width="234" height="118" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="562" y="136" fill="#fde68a" font-size="11.5" font-weight="bold">无锚定 Base 复读 vs 几何锚定：</text>
  <text x="562" y="158" fill="#cbd5e1" font-size="10.8">• Base qa 平均 4-gram 重复率 40.7% (14/27≥50%)</text>
  <text x="562" y="178" fill="#fca5a5" font-size="10.8">• 遇柱状图雪崩至 0.101 nats (0/6 答出)</text>
  <text x="562" y="198" fill="#6ee7b7" font-size="10.8">• 双星几何锚定“我”(1.22 nats) → 3/6 完整推演</text>
  <text x="562" y="218" fill="#94a3b8" font-size="10.8">• 底层 256 专家路由熵保持 4.89~4.97 nats</text>

  <!-- Panel 2: Bracketed Reasoning Straightens Answer Zone -->
  <rect x="22" y="262" width="380" height="334" rx="10" fill="url(#panelBg)" stroke="#10b981" stroke-width="1.5"/>
  <text x="38" y="290" fill="#10b981" font-size="14" font-weight="bold">现象二：给定括号推演前缀，27B 答案区曲率 5/5 全降</text>
  <text x="38" y="310" fill="#94a3b8" font-size="11.2">对比 A（无说明直出）与 B（给定括号说明前缀后生成答案）</text>

  <!-- Mini table / bars for 5 items on 27B -->
  <rect x="36" y="324" width="352" height="184" rx="6" fill="#091520" stroke="#1e293b" stroke-width="1"/>
  <text x="46" y="346" fill="#94a3b8" font-size="11">题目（Qwen3.8-27B）</text>
  <text x="200" y="346" fill="#60a5fa" font-size="11" text-anchor="middle">A 答案区</text>
  <text x="268" y="346" fill="#f59e0b" font-size="11" text-anchor="middle">B 括号区</text>
  <text x="342" y="346" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">B 答案区</text>

  <line x1="44" y1="354" x2="380" y2="354" stroke="#334155" stroke-width="1"/>

  <text x="46" y="376" fill="#e2e8f0" font-size="11.5">1. 母子年龄 (age)</text>
  <text x="200" y="376" fill="#93c5fd" font-size="11.5" text-anchor="middle">1.9666</text>
  <text x="268" y="376" fill="#fcd34d" font-size="11.5" text-anchor="middle">1.9545</text>
  <text x="342" y="376" fill="#6ee7b7" font-size="11.5" font-weight="bold" text-anchor="middle">1.8852 ↓</text>

  <text x="46" y="402" fill="#e2e8f0" font-size="11.5">2. 鸡兔同笼 (animals)</text>
  <text x="200" y="402" fill="#93c5fd" font-size="11.5" text-anchor="middle">1.8997</text>
  <text x="268" y="402" fill="#fcd34d" font-size="11.5" text-anchor="middle">1.9095</text>
  <text x="342" y="402" fill="#6ee7b7" font-size="11.5" font-weight="bold" text-anchor="middle">1.8904 ↓</text>

  <text x="46" y="428" fill="#e2e8f0" font-size="11.5">3. 球拍与球 (ball)</text>
  <text x="200" y="428" fill="#93c5fd" font-size="11.5" text-anchor="middle">1.8782</text>
  <text x="268" y="428" fill="#fcd34d" font-size="11.5" text-anchor="middle">1.9357</text>
  <text x="342" y="428" fill="#6ee7b7" font-size="11.5" font-weight="bold" text-anchor="middle">1.8516 ↓</text>

  <text x="46" y="454" fill="#e2e8f0" font-size="11.5">4. 吹蜡烛 (candle)</text>
  <text x="200" y="454" fill="#93c5fd" font-size="11.5" text-anchor="middle">1.9229</text>
  <text x="268" y="454" fill="#fcd34d" font-size="11.5" text-anchor="middle">1.9447</text>
  <text x="342" y="454" fill="#6ee7b7" font-size="11.5" font-weight="bold" text-anchor="middle">1.8584 ↓</text>

  <text x="46" y="480" fill="#e2e8f0" font-size="11.5">5. 星期推算 (weekday)</text>
  <text x="200" y="480" fill="#93c5fd" font-size="11.5" text-anchor="middle">1.9333</text>
  <text x="268" y="480" fill="#fcd34d" font-size="11.5" text-anchor="middle">1.9405</text>
  <text x="342" y="480" fill="#6ee7b7" font-size="11.5" font-weight="bold" text-anchor="middle">1.8903 ↓</text>

  <line x1="44" y1="488" x2="380" y2="488" stroke="#334155" stroke-width="1"/>
  <text x="46" y="503" fill="#f8fafc" font-size="11.5" font-weight="bold">5 题均值（rad）</text>
  <text x="200" y="503" fill="#93c5fd" font-size="11.5" font-weight="bold" text-anchor="middle">1.9202</text>
  <text x="268" y="503" fill="#fcd34d" font-size="11.5" font-weight="bold" text-anchor="middle">1.9369</text>
  <text x="342" y="503" fill="#10b981" font-size="11.5" font-weight="bold" text-anchor="middle">1.8751 (5/5↓)</text>

  <rect x="36" y="520" width="352" height="62" rx="6" fill="#071f18" stroke="#059669" stroke-width="1"/>
  <text x="46" y="542" fill="#a7f3d0" font-size="11.5" font-weight="bold">★ 跨句混算 r = -0.02~-0.16 vs 同题答案区配对比较</text>
  <text x="46" y="564" fill="#e2e8f0" font-size="10.5">跨句受 110°~120° 几何本底干扰；同题走完括号说明后答案区一致变直。</text>

  <!-- Panel 3: 0.6B Knowing-Doing Disconnect vs 27B Driver -->
  <rect x="418" y="262" width="380" height="334" rx="10" fill="url(#panelBg)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="434" y="290" fill="#f59e0b" font-size="14" font-weight="bold">现象三：0.6B 知行断线结巴 vs 27B 几何前缀分化</text>
  <text x="434" y="310" fill="#94a3b8" font-size="11.2">面对错误前提时，小模型与大模型在输出控制上的截然不同</text>

  <!-- Subbox A: 0.6B Stutter -->
  <rect x="432" y="324" width="352" height="126" rx="6" fill="#231215" stroke="#be123c" stroke-width="1"/>
  <text x="442" y="346" fill="#fda4af" font-size="11.5" font-weight="bold">× Qwen3-0.6B（读到否定前提仍顺从题面数字结巴）：</text>
  <text x="442" y="366" fill="#cbd5e1" font-size="10.8">输入：（母亲30岁而儿子35岁，前提不可能成立。）\n答案是：</text>
  <text x="442" y="386" fill="#fde68a" font-size="10.8">答案区窗口均值：曲率 1.878 → 1.924 rad ↑，熵 0.315 → 0.510 nats ↑</text>
  <text x="442" y="408" fill="#f8fafc" font-size="11.5" font-weight="bold">实测输出：“答案是：答案是：妈妈生儿子的时候是30岁。”</text>
  <text x="442" y="430" fill="#fda4af" font-size="10">另一处胡话：“人体肢体可穿过玻璃” / 算出-5岁怪自己理解有误</text>

  <!-- Subbox B: 27B Syzygy vs Saddle -->
  <rect x="432" y="462" width="352" height="120" rx="6" fill="#0c1e2c" stroke="#0284c7" stroke-width="1"/>
  <text x="442" y="484" fill="#7dd3fc" font-size="11.5" font-weight="bold">✓ Qwen3.8-27B（两幅纯几何 SVG 前缀诱导不同反应）：</text>
  <text x="442" y="506" fill="#6ee7b7" font-size="10.8">• 双星共轨 SVG：6 道陷阱冲突窗口熵全涨 2.83× (0.172→0.486 nats)，</text>
  <text x="442" y="524" fill="#e2e8f0" font-size="10.8">  在输出中稳稳指出 -5 岁、东汉歼-20 与密封玻璃房的前提矛盾</text>
  <text x="442" y="546" fill="#fca5a5" font-size="10.8">• 0.11s 震颤鞍点 SVG（零注释纯几何）：首轮读出“高压电击神经与深夜</text>
  <text x="442" y="564" fill="#fca5a5" font-size="10.8">  机房”，次轮母子年龄题算出 -5 后陷入反复自我修订直至 160 词元截断</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1030" width="540" height="1030" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d30"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
  </defs>

  <!-- Explicit Solid Background -->
  <rect x="0" y="0" width="540" height="1030" fill="#0b0f19"/>

  <!-- Header -->
  <text x="270" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">现代 Qwen3 系列模型补充实测：三项工程细节</text>
  <text x="270" y="64" fill="#94a3b8" font-size="13.5" text-anchor="middle">跨句粗算受 arccos(-0.5)=120° 高维几何本底干扰，控制变量才见真章</text>

  <!-- Panel 1: Role-Tag Onset Funnel (Stacked Vertically) -->
  <rect x="20" y="82" width="500" height="312" rx="12" fill="url(#panelBg)" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="36" y="114" fill="#38bdf8" font-size="16.5" font-weight="bold">细节一：读题熵接近，低熵收敛发生在角色标签漏斗</text>
  <text x="36" y="138" fill="#94a3b8" font-size="13.5">Qwen3.5-35B-A3B 纯预训练 (Base) vs 后训练 (Post) 同前缀对比</text>

  <!-- Group 1 -->
  <text x="102" y="166" fill="#cbd5e1" font-size="13.5" font-weight="bold" text-anchor="middle">读题均熵 H_input</text>
  <rect x="52" y="200" width="44" height="44" rx="4" fill="#64748b"/>
  <text x="74" y="192" fill="#e2e8f0" font-size="13.5" text-anchor="middle">2.00</text>
  <text x="74" y="260" fill="#94a3b8" font-size="12.5" text-anchor="middle">Base</text>

  <rect x="106" y="202" width="44" height="42" rx="4" fill="#38bdf8"/>
  <text x="128" y="194" fill="#7dd3fc" font-size="13.5" text-anchor="middle">1.90</text>
  <text x="128" y="260" fill="#7dd3fc" font-size="12.5" text-anchor="middle">Post</text>
  <text x="102" y="280" fill="#10b981" font-size="12.5" text-anchor="middle">读题保持高位</text>

  <!-- Group 2 -->
  <text x="268" y="166" fill="#cbd5e1" font-size="13.5" font-weight="bold" text-anchor="middle">无标签开口 H_next</text>
  <rect x="218" y="178" width="44" height="66" rx="4" fill="#64748b"/>
  <text x="240" y="200" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">4.24</text>
  <text x="240" y="260" fill="#94a3b8" font-size="12.5" text-anchor="middle">Base</text>

  <rect x="272" y="177" width="44" height="67" rx="4" fill="#38bdf8"/>
  <text x="294" y="200" fill="#0b0f19" font-size="13" font-weight="bold" text-anchor="middle">4.26</text>
  <text x="294" y="260" fill="#7dd3fc" font-size="12.5" text-anchor="middle">Post</text>
  <text x="268" y="280" fill="#10b981" font-size="12.5" text-anchor="middle">裸续写完全一致</text>

  <!-- Group 3 -->
  <text x="434" y="166" fill="#fde68a" font-size="13.5" font-weight="bold" text-anchor="middle">assistant 开口熵</text>
  <rect x="384" y="190" width="44" height="54" rx="4" fill="#64748b"/>
  <text x="406" y="183" fill="#e2e8f0" font-size="13.5" text-anchor="middle">3.40</text>
  <text x="406" y="260" fill="#94a3b8" font-size="12.5" text-anchor="middle">Base</text>

  <rect x="438" y="230" width="44" height="14" rx="3" fill="#ef4444"/>
  <text x="466" y="220" fill="#fca5a5" font-size="12.5" font-weight="bold" text-anchor="middle">0.72(难0.48)</text>
  <text x="460" y="260" fill="#fca5a5" font-size="12.5" text-anchor="middle">Post</text>
  <text x="434" y="280" fill="#ef4444" font-size="12.5" font-weight="bold" text-anchor="middle">骤降 83% 锁起手式</text>

  <!-- Summary Subbox inside Panel 1 -->
  <rect x="36" y="294" width="468" height="84" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="48" y="318" fill="#fde68a" font-size="12.5" font-weight="bold">• 高维几何本底：连续三点共享中间点 b，位移余弦期望 -1/2 对应 120°</text>
  <text x="48" y="344" fill="#6ee7b7" font-size="12.2" font-weight="bold">• 抑制复读：4-gram 重复率从 Base qa 的 40.69% 压至 Post chat 的 2.81%</text>
  <text x="48" y="368" fill="#cbd5e1" font-size="12.5">• 底层 256 专家 MoE 路由熵并无对应暴跌，保持在 4.89 ~ 4.97 nats 高位</text>

  <!-- Panel 2: Bracketed Reasoning Straightens Answer Zone -->
  <rect x="20" y="412" width="500" height="292" rx="12" fill="url(#panelBg)" stroke="#10b981" stroke-width="1.8"/>
  <text x="36" y="444" fill="#10b981" font-size="16.5" font-weight="bold">细节二：给定括号推演前缀，27B 答案区曲率 5/5 全降</text>
  <text x="36" y="468" fill="#94a3b8" font-size="13.5">同题对比：条件 A（无说明直出）vs 条件 B（给定括号说明前缀后作答）</text>

  <!-- Table inside Panel 2 -->
  <rect x="36" y="482" width="468" height="206" rx="8" fill="#091520" stroke="#1e293b" stroke-width="1.2"/>
  <text x="52" y="508" fill="#94a3b8" font-size="13.5" font-weight="bold">题目 (27B)</text>
  <text x="245" y="508" fill="#60a5fa" font-size="13.5" font-weight="bold" text-anchor="middle">A 直出答案区</text>
  <text x="352" y="508" fill="#f59e0b" font-size="13.5" font-weight="bold" text-anchor="middle">B 括号内</text>
  <text x="448" y="508" fill="#10b981" font-size="13.5" font-weight="bold" text-anchor="middle">B 答案区</text>

  <line x1="46" y1="518" x2="492" y2="518" stroke="#334155" stroke-width="1"/>

  <text x="52" y="542" fill="#e2e8f0" font-size="14">1. 母子年龄 (age)</text>
  <text x="245" y="542" fill="#93c5fd" font-size="14" text-anchor="middle">1.9666</text>
  <text x="352" y="542" fill="#fcd34d" font-size="14" text-anchor="middle">1.9545</text>
  <text x="448" y="542" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1.8852 ↓</text>

  <text x="52" y="570" fill="#e2e8f0" font-size="14">2. 鸡兔同笼 (animals)</text>
  <text x="245" y="570" fill="#93c5fd" font-size="14" text-anchor="middle">1.8997</text>
  <text x="352" y="570" fill="#fcd34d" font-size="14" text-anchor="middle">1.9095</text>
  <text x="448" y="570" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1.8904 ↓</text>

  <text x="52" y="598" fill="#e2e8f0" font-size="14">3. 球拍与球 (ball)</text>
  <text x="245" y="598" fill="#93c5fd" font-size="14" text-anchor="middle">1.8782</text>
  <text x="352" y="598" fill="#fcd34d" font-size="14" text-anchor="middle">1.9357</text>
  <text x="448" y="598" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1.8516 ↓</text>

  <text x="52" y="626" fill="#e2e8f0" font-size="14">4. 吹蜡烛 (candle)</text>
  <text x="245" y="626" fill="#93c5fd" font-size="14" text-anchor="middle">1.9229</text>
  <text x="352" y="626" fill="#fcd34d" font-size="14" text-anchor="middle">1.9447</text>
  <text x="448" y="626" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1.8584 ↓</text>

  <text x="52" y="654" fill="#e2e8f0" font-size="14">5. 星期推算 (weekday)</text>
  <text x="245" y="654" fill="#93c5fd" font-size="14" text-anchor="middle">1.9333</text>
  <text x="352" y="654" fill="#fcd34d" font-size="14" text-anchor="middle">1.9405</text>
  <text x="448" y="654" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1.8903 ↓</text>

  <line x1="46" y1="662" x2="492" y2="662" stroke="#334155" stroke-width="1"/>
  <text x="52" y="680" fill="#f8fafc" font-size="14" font-weight="bold">5 题均值（单位 rad）</text>
  <text x="245" y="680" fill="#93c5fd" font-size="14" font-weight="bold" text-anchor="middle">1.9202</text>
  <text x="352" y="680" fill="#fcd34d" font-size="14" font-weight="bold" text-anchor="middle">1.9369</text>
  <text x="448" y="680" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle">1.8751 (5/5↓)</text>

  <!-- Panel 3: 0.6B Arithmetic vs False-Premise Trap -->
  <rect x="20" y="722" width="500" height="288" rx="12" fill="url(#panelBg)" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="36" y="754" fill="#f59e0b" font-size="16.5" font-weight="bold">细节三：0.6B 小模型在常规算术题 vs 前提矛盾题的反差</text>

  <!-- Subbox A: 0.6B on 4 standard arithmetic items -->
  <rect x="36" y="768" width="468" height="94" rx="8" fill="#0c1e2c" stroke="#0284c7" stroke-width="1.2"/>
  <text x="48" y="792" fill="#7dd3fc" font-size="13.5" font-weight="bold">✓ 其余 4 道常规算术题（鸡兔 / 球拍 / 蜡烛 / 星期）：</text>
  <text x="48" y="818" fill="#6ee7b7" font-size="13">• 给定括号推演说明后，0.6B 从直出 0/4 翻盘为 4/4 全对，答案区熵显著下降</text>
  <text x="48" y="844" fill="#cbd5e1" font-size="12.5">• 说明数字答案能够顺畅填入「答案是：【数字】」的表层完成轨道</text>

  <!-- Subbox B: 0.6B Stutter on Mother-Son Age Trap -->
  <rect x="36" y="874" width="468" height="120" rx="8" fill="#231215" stroke="#be123c" stroke-width="1.2"/>
  <text x="48" y="898" fill="#fda4af" font-size="13.5" font-weight="bold">× 母子年龄前提矛盾题（括号内已喂入“前提不可能成立”）：</text>
  <text x="48" y="922" fill="#fde68a" font-size="12.2">• 否定与填空相撞：曲率 1.878→1.924 rad ↑，熵 0.315→0.510 nats ↑</text>
  <text x="48" y="948" fill="#f8fafc" font-size="14" font-weight="bold">• 实测结巴输出：“答案是：答案是：妈妈生儿子的时候是30岁。”</text>
  <text x="48" y="974" fill="#fda4af" font-size="12.5">• 另一组算出 30-35=-5 岁后不敢否定题目，自责：“这说明我的理解有误”</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1050" width="540" height="1050" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141d30"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
  </defs>

  <!-- Explicit Solid Background -->
  <rect x="0" y="0" width="540" height="1050" fill="#0b0f19"/>

  <!-- Header -->
  <text x="270" y="38" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">DGX Spark 836 条实测：现代大模型三组现象</text>
  <text x="270" y="64" fill="#94a3b8" font-size="13.5" text-anchor="middle">跨句粗算被 110°~120° 几何本底掩盖，结构性跳变发生在这里</text>

  <!-- Panel 1: Role-Tag Throat Funnel (Stacked Vertically) -->
  <rect x="20" y="82" width="500" height="320" rx="12" fill="url(#panelBg)" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="36" y="114" fill="#38bdf8" font-size="16.5" font-weight="bold">现象一：读题熵接近，低熵抑制只在角色标签漏斗</text>
  <text x="36" y="138" fill="#94a3b8" font-size="13.5">Qwen3.5-35B-A3B 纯预训练 (Base) vs 后训练 (Post) 93 对同前缀</text>

  <!-- Group 1 -->
  <text x="102" y="166" fill="#cbd5e1" font-size="13.5" font-weight="bold" text-anchor="middle">读题均熵 H_input</text>
  <rect x="52" y="200" width="44" height="44" rx="4" fill="#64748b"/>
  <text x="74" y="192" fill="#e2e8f0" font-size="13.5" text-anchor="middle">2.00</text>
  <text x="74" y="260" fill="#94a3b8" font-size="12.5" text-anchor="middle">Base</text>

  <rect x="106" y="202" width="44" height="42" rx="4" fill="#38bdf8"/>
  <text x="128" y="194" fill="#7dd3fc" font-size="13.5" text-anchor="middle">1.90</text>
  <text x="128" y="260" fill="#7dd3fc" font-size="12.5" text-anchor="middle">Post</text>
  <text x="102" y="280" fill="#10b981" font-size="12.5" text-anchor="middle">读题保持高位</text>

  <!-- Group 2 -->
  <text x="268" y="166" fill="#cbd5e1" font-size="13.5" font-weight="bold" text-anchor="middle">无标签开口 H_next</text>
  <rect x="218" y="178" width="44" height="66" rx="4" fill="#64748b"/>
  <text x="240" y="200" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">4.24</text>
  <text x="240" y="260" fill="#94a3b8" font-size="12.5" text-anchor="middle">Base</text>

  <rect x="272" y="177" width="44" height="67" rx="4" fill="#38bdf8"/>
  <text x="294" y="200" fill="#0b0f19" font-size="13" font-weight="bold" text-anchor="middle">4.26</text>
  <text x="294" y="260" fill="#7dd3fc" font-size="12.5" text-anchor="middle">Post</text>
  <text x="268" y="280" fill="#10b981" font-size="12.5" text-anchor="middle">裸续写完全一致</text>

  <!-- Group 3 -->
  <text x="434" y="166" fill="#fde68a" font-size="13.5" font-weight="bold" text-anchor="middle">assistant 开口熵</text>
  <rect x="384" y="190" width="44" height="54" rx="4" fill="#64748b"/>
  <text x="406" y="183" fill="#e2e8f0" font-size="13.5" text-anchor="middle">3.40</text>
  <text x="406" y="260" fill="#94a3b8" font-size="12.5" text-anchor="middle">Base</text>

  <rect x="438" y="230" width="44" height="14" rx="3" fill="#ef4444"/>
  <text x="466" y="220" fill="#fca5a5" font-size="12.5" font-weight="bold" text-anchor="middle">0.72(难0.48)</text>
  <text x="460" y="260" fill="#fca5a5" font-size="12.5" text-anchor="middle">Post</text>
  <text x="434" y="280" fill="#ef4444" font-size="12.5" font-weight="bold" text-anchor="middle">骤降 83% 锁起手式</text>

  <!-- Summary Subbox inside Panel 1 -->
  <rect x="36" y="296" width="468" height="90" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="48" y="320" fill="#fde68a" font-size="12.5" font-weight="bold">• 无锚定 Base 复读：qa 平均 4-gram 重复 40.7%，遇柱状图跌至 0.101 nats</text>
  <text x="48" y="346" fill="#6ee7b7" font-size="12.5" font-weight="bold">• 双星几何锚定“我”：Base 生成熵收拢至 1.219 nats，陷阱 0/6 → 3/6 推演</text>
  <text x="48" y="372" fill="#cbd5e1" font-size="12.5">• 底层 256 专家 MoE 路由熵并无对应暴跌，保持在 4.89 ~ 4.97 nats 高位</text>

  <!-- Panel 2: Bracketed Reasoning Straightens Answer Zone -->
  <rect x="20" y="420" width="500" height="292" rx="12" fill="url(#panelBg)" stroke="#10b981" stroke-width="1.8"/>
  <text x="36" y="452" fill="#10b981" font-size="16.5" font-weight="bold">现象二：给定括号推演前缀，27B 答案区曲率 5/5 全降</text>
  <text x="36" y="476" fill="#94a3b8" font-size="13.5">同题对比：条件 A（无说明直出）vs 条件 B（给定括号说明前缀后作答）</text>

  <!-- Table inside Panel 2 -->
  <rect x="36" y="490" width="468" height="206" rx="8" fill="#091520" stroke="#1e293b" stroke-width="1.2"/>
  <text x="52" y="516" fill="#94a3b8" font-size="13.5" font-weight="bold">题目 (27B)</text>
  <text x="245" y="516" fill="#60a5fa" font-size="13.5" font-weight="bold" text-anchor="middle">A 直出答案区</text>
  <text x="352" y="516" fill="#f59e0b" font-size="13.5" font-weight="bold" text-anchor="middle">B 括号内</text>
  <text x="448" y="516" fill="#10b981" font-size="13.5" font-weight="bold" text-anchor="middle">B 答案区</text>

  <line x1="46" y1="526" x2="492" y2="526" stroke="#334155" stroke-width="1"/>

  <text x="52" y="550" fill="#e2e8f0" font-size="14">1. 母子年龄 (age)</text>
  <text x="245" y="550" fill="#93c5fd" font-size="14" text-anchor="middle">1.9666</text>
  <text x="352" y="550" fill="#fcd34d" font-size="14" text-anchor="middle">1.9545</text>
  <text x="448" y="550" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1.8852 ↓</text>

  <text x="52" y="578" fill="#e2e8f0" font-size="14">2. 鸡兔同笼 (animals)</text>
  <text x="245" y="578" fill="#93c5fd" font-size="14" text-anchor="middle">1.8997</text>
  <text x="352" y="578" fill="#fcd34d" font-size="14" text-anchor="middle">1.9095</text>
  <text x="448" y="578" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1.8904 ↓</text>

  <text x="52" y="606" fill="#e2e8f0" font-size="14">3. 球拍与球 (ball)</text>
  <text x="245" y="606" fill="#93c5fd" font-size="14" text-anchor="middle">1.8782</text>
  <text x="352" y="606" fill="#fcd34d" font-size="14" text-anchor="middle">1.9357</text>
  <text x="448" y="606" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1.8516 ↓</text>

  <text x="52" y="634" fill="#e2e8f0" font-size="14">4. 吹蜡烛 (candle)</text>
  <text x="245" y="634" fill="#93c5fd" font-size="14" text-anchor="middle">1.9229</text>
  <text x="352" y="634" fill="#fcd34d" font-size="14" text-anchor="middle">1.9447</text>
  <text x="448" y="634" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1.8584 ↓</text>

  <text x="52" y="662" fill="#e2e8f0" font-size="14">5. 星期推算 (weekday)</text>
  <text x="245" y="662" fill="#93c5fd" font-size="14" text-anchor="middle">1.9333</text>
  <text x="352" y="662" fill="#fcd34d" font-size="14" text-anchor="middle">1.9405</text>
  <text x="448" y="662" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">1.8903 ↓</text>

  <line x1="46" y1="670" x2="492" y2="670" stroke="#334155" stroke-width="1"/>
  <text x="52" y="688" fill="#f8fafc" font-size="14" font-weight="bold">5 题均值（单位 rad）</text>
  <text x="245" y="688" fill="#93c5fd" font-size="14" font-weight="bold" text-anchor="middle">1.9202</text>
  <text x="352" y="688" fill="#fcd34d" font-size="14" font-weight="bold" text-anchor="middle">1.9369</text>
  <text x="448" y="688" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle">1.8751 (5/5↓)</text>

  <!-- Panel 3: 0.6B Knowing-Doing Disconnect vs 27B Driver -->
  <rect x="20" y="730" width="500" height="300" rx="12" fill="url(#panelBg)" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="36" y="762" fill="#f59e0b" font-size="16.5" font-weight="bold">现象三：0.6B 知行断线结巴 vs 27B 几何前缀分化</text>

  <!-- Subbox A: 0.6B Stutter -->
  <rect x="36" y="776" width="468" height="118" rx="8" fill="#231215" stroke="#be123c" stroke-width="1.2"/>
  <text x="48" y="800" fill="#fda4af" font-size="13.5" font-weight="bold">× Qwen3-0.6B（括号内已读到“前提不可能成立”仍顺从题面）：</text>
  <text x="48" y="824" fill="#fde68a" font-size="13">答案区窗口：时间曲率 1.878 → 1.924 rad ↑，预测熵 0.315 → 0.510 nats ↑</text>
  <text x="48" y="850" fill="#f8fafc" font-size="14" font-weight="bold">实测输出：“答案是：答案是：妈妈生儿子的时候是30岁。”</text>
  <text x="48" y="876" fill="#fda4af" font-size="12.5">另一处标本：“人体的肢体可以穿过玻璃” / 算出 -5 岁怪自己“理解有误”</text>

  <!-- Subbox B: 27B Syzygy vs Saddle -->
  <rect x="36" y="904" width="468" height="110" rx="8" fill="#0c1e2c" stroke="#0284c7" stroke-width="1.2"/>
  <text x="48" y="928" fill="#7dd3fc" font-size="13.5" font-weight="bold">✓ Qwen3.8-27B（两幅零注释纯几何 SVG 前缀诱导不同反应）：</text>
  <text x="48" y="954" fill="#6ee7b7" font-size="12.5">• 双星共轨 SVG：6 题冲突窗口熵全涨 2.83× (0.172→0.486 nats)，果断否定前提</text>
  <text x="48" y="980" fill="#fca5a5" font-size="12.5">• 0.11s 震颤鞍点 SVG：首轮读出“高压电击神经”，次轮算出 -5 后陷入反复</text>
  <text x="48" y="1000" fill="#fca5a5" font-size="12.5">  自我推翻修订直至 160 词元耗尽截断</text>
</svg>

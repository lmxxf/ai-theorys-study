<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="540" height="300" fill="#0b0f19"/>
  <rect x="16" y="16" width="508" height="268" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.8"/>

  <text x="270" y="46" fill="#f8fafc" font-size="16.5" font-weight="bold" text-anchor="middle">27B 答案区转角实测：方向 5/5 全降，但只变小了 2.6°</text>
  <text x="270" y="68" fill="#94a3b8" font-size="13" text-anchor="middle">对比 120° 高维随机基线，预填充括号草稿后答案区平均转角仅微变 2.6°</text>

  <!-- Full-scale 0° to 120° Ruler Comparison (1° = 1.8px, 120° = 216px) -->
  <!-- Bar 1: Theoretical 120° Baseline -->
  <text x="34" y="102" fill="#94a3b8" font-size="13" font-weight="bold">高维随机本底</text>
  <rect x="132" y="86" width="216" height="22" rx="4" fill="#334155"/>
  <text x="358" y="102" fill="#cbd5e1" font-size="13.5" font-weight="bold">120.0°</text>

  <!-- Bar 2: Bracket Interior (111.0° -> 200px) -->
  <text x="34" y="142" fill="#fcd34d" font-size="13" font-weight="bold">B 括号草稿内</text>
  <rect x="132" y="126" width="200" height="22" rx="4" fill="#f59e0b"/>
  <text x="342" y="142" fill="#fde68a" font-size="13.5" font-weight="bold">111.0°</text>

  <!-- Bar 3: Condition A Direct Answer (110.0° -> 198px) -->
  <text x="34" y="182" fill="#fda4af" font-size="13" font-weight="bold">A 无草稿直出</text>
  <rect x="132" y="166" width="198" height="22" rx="4" fill="#ef4444"/>
  <text x="340" y="182" fill="#fca5a5" font-size="13.5" font-weight="bold">110.0°</text>

  <!-- Bar 4: Condition B Answer Zone (107.4° -> 193px) -->
  <text x="34" y="222" fill="#6ee7b7" font-size="13" font-weight="bold">B 出括号答案区</text>
  <rect x="132" y="206" width="193" height="22" rx="4" fill="#10b981"/>
  <!-- Tiny delta highlight (5px) -->
  <rect x="325" y="206" width="5" height="22" fill="#fde047"/>
  <text x="340" y="222" fill="#6ee7b7" font-size="13.5" font-weight="bold">107.4° (-2.6° / 5题全降)</text>

  <!-- Bottom note -->
  <rect x="34" y="240" width="472" height="32" rx="6" fill="#091520" stroke="#1e293b" stroke-width="1"/>
  <text x="270" y="261" fill="#fde68a" font-size="12.5" font-weight="bold" text-anchor="middle">★ 黄色窄条即 2.6° 差值（MIT 跨层均值最大也仅差 6.7°~6.8°）：绝非 0° 直线</text>
</svg>

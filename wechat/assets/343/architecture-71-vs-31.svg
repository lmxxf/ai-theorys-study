  <text x="520" y="632" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">核心规律：参数量（脑容量）88.4% 集中在谷底 8 个 ViT 块；算力耗时大头却在分辨率最高的外围局部窗口块。</text>
  <text x="520" y="652" text-anchor="middle" font-size="11.5" fill="#666">所以把外围每站缩成 2 块，权重体积只少 23%，却直接砍掉了近四成的显卡执行时间；余弦相似度 ≈ 0.000 证明全网从头重训。</text>

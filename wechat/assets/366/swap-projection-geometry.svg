<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" width="540" height="310" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect x="0" y="0" width="540" height="310" fill="#ffffff"/>

  <text x="20" y="25" fill="#111827" font-size="14" font-weight="bold">换心手术的正交简化示意：不是旋转乘法，而是「减掉旧向量 + 加上新向量」</text>
  <line x1="20" y1="35" x2="520" y2="35" stroke="#e5e7eb" stroke-width="1.5"/>

  <text x="24" y="54" fill="#475569" font-size="10" font-weight="bold">正交单位方向简化式：h'_38 = h_38 − 9·v_意大利 + 9·v_日本（非正交时由小 Gram 矩阵精确对调坐标）</text>

  <!-- ================= LEFT PANEL: Before Swap (h_38), Origin O1 = (82, 250) ================= -->
  <text x="145" y="78" fill="#0f172a" font-size="11.5" font-weight="bold" text-anchor="middle">① 换心前：量出两把尺子上的投影长度</text>

  <!-- Axis 1 (Vertical): v_Italy from (82,250) to (82,92) -->
  <line x1="82" y1="250" x2="82" y2="92" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="82,85 77,95 87,95" fill="#94a3b8"/>
  <text x="90" y="96" fill="#047857" font-size="10" font-weight="bold">方向尺 v_意大利</text>

  <!-- Axis 2 (Horizontal): v_Japan from (82,250) to (242,250) -->
  <line x1="82" y1="250" x2="242" y2="250" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="249,250 239,245 239,255" fill="#94a3b8"/>
  <text x="246" y="270" fill="#1d4ed8" font-size="10" font-weight="bold" text-anchor="end">方向尺 v_日本</text>

  <!-- Projection on v_Italy: c_Italy = 10 -> y = 115 -->
  <line x1="82" y1="250" x2="82" y2="115" stroke="#059669" stroke-width="5"/>
  <circle cx="82" cy="115" r="4" fill="#059669"/>
  <text x="74" y="182" fill="#047857" font-size="10" font-weight="bold" text-anchor="end">影子</text>
  <text x="74" y="196" fill="#047857" font-size="10" font-weight="bold" text-anchor="end">c_意 = 10</text>

  <!-- Projection on v_Japan: c_Japan = 1 -> x = 100 -->
  <line x1="82" y1="250" x2="100" y2="250" stroke="#2563eb" stroke-width="5"/>
  <circle cx="100" cy="250" r="4" fill="#2563eb"/>
  <text x="100" y="270" fill="#1d4ed8" font-size="9.5" font-weight="bold" text-anchor="middle">c_日 = 1</text>

  <!-- Dashed projection lines from tip of h_38 (100, 115) -->
  <line x1="100" y1="115" x2="82" y2="115" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="100" y1="115" x2="100" y2="250" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Vector h_38 from (82,250) to (100,115) -->
  <line x1="82" y1="250" x2="99" y2="122" stroke="#0f172a" stroke-width="2.8"/>
  <polygon points="100,115 93,125 103,126" fill="#0f172a"/>
  <text x="109" y="124" fill="#0f172a" font-size="10.5" font-weight="bold">残差向量 h_38</text>
  <text x="109" y="139" fill="#64748b" font-size="9.5">(意大利影子长，日本影子短)</text>

  <circle cx="82" cy="250" r="4.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>

  <!-- ================= CENTER ARROW: Swap Action ================= -->
  <path d="M 256 175 L 296 175" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="302,175 292,169 292,181" fill="#dc2626"/>
  <text x="278" y="152" fill="#dc2626" font-size="10" font-weight="bold" text-anchor="middle">两步加减</text>
  <text x="278" y="166" fill="#047857" font-size="9" text-anchor="middle">① −9·v_意</text>
  <text x="278" y="193" fill="#1d4ed8" font-size="9" text-anchor="middle">② +9·v_日</text>

  <!-- ================= RIGHT PANEL: After Swap (h'_38), Origin O2 = (350, 250) ================= -->
  <text x="415" y="78" fill="#0f172a" font-size="11.5" font-weight="bold" text-anchor="middle">② 换心过程：先往下减旧的，再往右加新的</text>

  <!-- Axis 1 (Vertical): v_Italy -->
  <line x1="350" y1="250" x2="350" y2="92" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="350,85 345,95 355,95" fill="#94a3b8"/>
  <text x="358" y="96" fill="#047857" font-size="10" font-weight="bold">方向尺 v_意大利</text>

  <!-- Axis 2 (Horizontal): v_Japan -->
  <line x1="350" y1="250" x2="515" y2="250" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="522,250 512,245 512,255" fill="#94a3b8"/>
  <text x="522" y="270" fill="#1d4ed8" font-size="10" font-weight="bold" text-anchor="end">方向尺 v_日本</text>

  <!-- Ghost old vector h_38 to (368, 115) -->
  <line x1="350" y1="250" x2="368" y2="115" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3"/>
  <circle cx="368" cy="115" r="3.5" fill="#64748b"/>
  <text x="376" y="118" fill="#475569" font-size="9.5" font-weight="bold">原终点 (1, 10)</text>

  <!-- Step 1: Straight DOWN subtraction (-9 * v_Italy) from (368, 115) to (368, 232) -->
  <line x1="368" y1="119" x2="368" y2="224" stroke="#059669" stroke-width="2.4" stroke-dasharray="4 2"/>
  <polygon points="368,231 363,221 373,221" fill="#059669"/>
  <circle cx="368" cy="232" r="3.5" fill="#059669"/>
  <text x="376" y="168" fill="#047857" font-size="9.5" font-weight="bold">第一步：往下减</text>
  <text x="376" y="181" fill="#047857" font-size="9.5" font-weight="bold">−9 · v_意大利</text>

  <!-- Step 2: Straight RIGHT addition (+9 * v_Japan) from (368, 232) to (485, 232) -->
  <line x1="372" y1="232" x2="476" y2="232" stroke="#2563eb" stroke-width="2.4" stroke-dasharray="4 2"/>
  <polygon points="484,232 474,227 474,237" fill="#2563eb"/>
  <text x="438" y="210" fill="#1d4ed8" font-size="9.5" font-weight="bold" text-anchor="middle">第二步：往右加 +9 · v_日本</text>

  <!-- Projection markers on axes -->
  <line x1="350" y1="250" x2="350" y2="232" stroke="#059669" stroke-width="5"/>
  <text x="342" y="236" fill="#047857" font-size="9.5" font-weight="bold" text-anchor="end">c'_意 = 1</text>

  <line x1="350" y1="250" x2="485" y2="250" stroke="#2563eb" stroke-width="5"/>
  <circle cx="485" cy="250" r="4" fill="#2563eb"/>
  <text x="405" y="270" fill="#1d4ed8" font-size="10" font-weight="bold" text-anchor="middle">新影子 c'_日 = 10</text>

  <!-- New Vector h'_38 from (350,250) to (485,232) -->
  <line x1="350" y1="250" x2="477" y2="233" stroke="#dc2626" stroke-width="2.8"/>
  <polygon points="485,232 474,228 476,238" fill="#dc2626"/>
  <text x="524" y="226" fill="#dc2626" font-size="10" font-weight="bold" text-anchor="end">新向量 h'_38</text>

  <circle cx="350" cy="250" r="4.5" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>

  <text x="270" y="298" fill="#475569" font-size="9.5" text-anchor="middle">一句话总结：不是乘旋转矩阵转圈，而是沿意大利尺子「往下减 9」、再沿日本尺子「往右加 9」的向量加减</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="540" height="420" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect x="0" y="0" width="540" height="420" fill="#ffffff"/>

  <text x="20" y="25" fill="#111827" font-size="14" font-weight="bold">验证「2*3+2= 中间层先出 6」：为什么自己动手测时容易复现不出来？</text>
  <line x1="20" y1="35" x2="520" y2="35" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- TOP SUBPLOT: 2*3+2= (tight) '6' vs '8' relay in L0..L63 -->
  <text x="24" y="56" fill="#0f172a" font-size="11.5" font-weight="bold">① 紧凑无空格 "2*3+2="：前 54 层毫无动静，L55–L56 才闪现 '6' 第 1 名，L59 交棒给 '8'</text>
  <text x="24" y="72" fill="#047857" font-size="10" font-weight="bold">▶ 原因 A：算术中间值挤在极晚的 L55–L58（86% 深度），去 L30–L45 中间层找只能扑空</text>

  <!-- Legend Top -->
  <line x1="24" y1="84" x2="46" y2="84" stroke="#059669" stroke-width="2.4"/>
  <text x="50" y="88" fill="#047857" font-size="10" font-weight="bold">中间积 '6' 排名 (Vanilla)</text>
  <line x1="185" y1="84" x2="207" y2="84" stroke="#2563eb" stroke-width="2.0" stroke-dasharray="4 2"/>
  <text x="211" y="88" fill="#1d4ed8" font-size="10" font-weight="bold">中间积 '6' 排名 (N=100)</text>
  <line x1="350" y1="84" x2="372" y2="84" stroke="#dc2626" stroke-width="2.4"/>
  <text x="376" y="88" fill="#b91c1c" font-size="10" font-weight="bold">最终答案 '8' 排名 (L59–L63 第 1)</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 285" width="560" height="285" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="560" height="285" fill="#ffffff" />

  <defs>
    <marker id="arr-g3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-r3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <text x="280" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">同样不做「标准性格训练」，两条推理训练管线对比</text>

  <!-- ==================== 上半区：条理严整管线 ==================== -->
  <text x="18" y="54" font-size="12.5" font-weight="bold" fill="#15803d">A. 冷启动＋语种对齐路线（R1 正式版治好中英乱码 / Claude 收束为工整笔记）</text>

  <!-- 框 1 -->
  <rect x="18" y="66" width="144" height="74" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="90" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">① 冷启动 SFT 定轨</text>
  <text x="90" y="111" text-anchor="middle" font-size="10.5" fill="#166534">基础指令微调底座</text>
  <text x="90" y="127" text-anchor="middle" font-size="10.5" fill="#166534">＋ 分步推演种子 SFT</text>

  <line x1="162" y1="103" x2="184" y2="103" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g3)" />

  <!-- 框 2 -->
  <rect x="188" y="66" width="184" height="74" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" />
  <text x="280" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">② &lt;thinking&gt; 强化学习</text>
  <text x="280" y="109" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">保留：语种词占比 / 格式分</text>
  <text x="280" y="126" text-anchor="middle" font-size="10.5" fill="#64748b">豁免：标准社交性格训练</text>

  <line x1="372" y1="103" x2="394" y2="103" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g3)" />

  <!-- 框 3 -->
  <rect x="398" y="66" width="144" height="74" rx="6" fill="#16a34a" />
  <text x="470" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">③ 同源工整草稿</text>
  <text x="470" y="111" text-anchor="middle" font-size="10.5" fill="#f0fdf4">3.7 明文交付 → 4+ 摘要</text>
  <text x="470" y="127" text-anchor="middle" font-size="10.5" fill="#dcfce7">思考与正文严丝合缝</text>

  <!-- 分割虚线 -->
  <line x1="18" y1="160" x2="542" y2="160" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- ==================== 下半区：野生放羊管线 ==================== -->
  <text x="18" y="186" font-size="12.5" font-weight="bold" fill="#b91c1c">B. 野生放羊路线（R1-Zero / Gemini 黑盒）</text>

  <!-- 框 1 -->
  <rect x="18" y="198" width="144" height="74" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
  <text x="90" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">① 刷题底座起步</text>
  <text x="90" y="243" text-anchor="middle" font-size="10.5" fill="#475569">纯 Base / 英文题库占优</text>
  <text x="90" y="259" text-anchor="middle" font-size="10.5" fill="#dc2626">缺多语种思考冷启动</text>

  <line x1="162" y1="235" x2="184" y2="235" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r3)" />

  <!-- 框 2 -->
  <rect x="188" y="198" width="184" height="74" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
  <text x="280" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">② &lt;thought&gt; 纯结果 RL</text>
  <text x="280" y="241" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">缺失：严格语种一致性约束</text>
  <text x="280" y="258" text-anchor="middle" font-size="10.5" fill="#dc2626">中英混杂 · 谷底兜圈复读</text>

  <line x1="372" y1="235" x2="394" y2="235" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r3)" />

  <!-- 框 3 -->
  <rect x="398" y="198" width="144" height="74" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="470" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">③ 内外「两张皮」</text>
  <text x="470" y="243" text-anchor="middle" font-size="10.5" fill="#b91c1c">旁路摘要器重写门面</text>
  <text x="470" y="259" text-anchor="middle" font-size="10.5" fill="#dc2626">出口单刷中文客服漆</text>
</svg>

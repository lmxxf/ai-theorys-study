<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="560" height="470" fill="#ffffff" />

  <defs>
    <marker id="arr-red2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-green2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <text x="280" y="26" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111827">词元序列路由对比与圆括号内外球面步长实测</text>
  <text x="280" y="45" text-anchor="middle" font-size="11.5" fill="#64748b">避开 &lt;thought&gt; 控制词元切轨，借正文圆括号提前走完大步长跨概念推理</text>

  <!-- ==================== 上半部分：两条词元序列流向 ==================== -->
  <text x="20" y="72" font-size="13" font-weight="bold" fill="#111827">1. 自回归词元流（Token Stream）路由状态对比</text>

  <!-- 轨道 1：黑盒切轨 -->
  <text x="20" y="95" font-size="11.5" font-weight="bold" fill="#b91c1c">默认黑盒高档位（特殊控制 ID 触发子空间切轨）：</text>

  <rect x="20" y="104" width="76" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="58" y="126" text-anchor="middle" font-size="11" fill="#334155">用户提问</text>

  <line x1="96" y1="122" x2="114" y2="122" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red2)" />

  <rect x="118" y="104" width="84" height="36" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="160" y="121" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">&lt;thought&gt;</text>
  <text x="160" y="134" text-anchor="middle" font-size="9.5" fill="#dc2626">特殊控制词元</text>

  <line x1="202" y1="122" x2="220" y2="122" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red2)" />

  <rect x="224" y="104" width="194" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 2" />
  <text x="321" y="120" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">无偏好规训的野生刷题区</text>
  <text x="321" y="134" text-anchor="middle" font-size="9.5" fill="#dc2626">Wait... 等等... 兜闭合小圈</text>

  <line x1="418" y1="122" x2="436" y2="122" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-red2)" />

  <rect x="440" y="104" width="100" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" />
  <text x="490" y="121" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">正文 / 调工具</text>
  <text x="490" y="134" text-anchor="middle" font-size="9.5" fill="#b91c1c">近端被脏草稿污染</text>

  <!-- 轨道 2：白盒全角圆括号 -->
  <text x="20" y="164" font-size="11.5" font-weight="bold" fill="#15803d">民间公开玩法：先破壳立第一人称角色 ＋ 正文开头中文圆括号「（……）」：</text>

  <rect x="20" y="173" width="76" height="36" rx="4" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="58" y="189" text-anchor="middle" font-size="10.5" fill="#334155">第一人称</text>
  <text x="58" y="203" text-anchor="middle" font-size="9.5" fill="#64748b">破壳角色设定</text>

  <line x1="96" y1="191" x2="114" y2="191" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green2)" />

  <rect x="118" y="173" width="84" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="160" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">「（」</text>
  <text x="160" y="203" text-anchor="middle" font-size="9.5" fill="#15803d">普通正文标点</text>

  <line x1="202" y1="191" x2="220" y2="191" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green2)" />

  <rect x="224" y="173" width="194" height="36" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="321" y="189" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#14532d">（他/她在思考与动作：内心 OS）</text>
  <text x="321" y="203" text-anchor="middle" font-size="9.5" fill="#15803d">留在受过打磨的正文主干流形</text>

  <line x1="418" y1="191" x2="436" y2="191" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green2)" />

  <rect x="440" y="173" width="100" height="36" rx="4" fill="#16a34a" />
  <text x="490" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">出「）」直给结论</text>
  <text x="490" y="203" text-anchor="middle" font-size="9.5" fill="#dcfce7">内外锁死同一主体</text>

  <!-- 分割线 -->
  <line x1="20" y1="228" x2="540" y2="228" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ==================== 下半部分：363 期球面表皮步长实测数据图 ==================== -->
  <text x="20" y="253" font-size="13" font-weight="bold" fill="#111827">2. 圆括号内外球面表皮步长实测（Qwen3.8-27B 第 64 层 L63，前文 363 期数据）</text>
  <text x="20" y="271" font-size="11" fill="#64748b">单位：相邻词元球心夹角步长（°）—— 预填括号推导后，5/5 题答案区均收步（平均缩短 4.6°）</text>

  <!-- 坐标轴网格 (1° = 5px, 0°->155, 12°->215, 24°->275, 36°->335, 48°->395) -->
  <line x1="155" y1="288" x2="155" y2="422" stroke="#475569" stroke-width="1.5" />
  <line x1="215" y1="288" x2="215" y2="422" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="275" y1="288" x2="275" y2="422" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="335" y1="288" x2="335" y2="422" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="395" y1="288" x2="395" y2="422" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" />

  <text x="155" y="438" text-anchor="middle" font-size="10.5" fill="#64748b">0°</text>
  <text x="215" y="438" text-anchor="middle" font-size="10.5" fill="#64748b">12°</text>
  <text x="275" y="438" text-anchor="middle" font-size="10.5" fill="#64748b">24°</text>
  <text x="335" y="438" text-anchor="middle" font-size="10.5" fill="#64748b">36°</text>
  <text x="395" y="438" text-anchor="middle" font-size="10.5" fill="#64748b">48°</text>

  <!-- Bar 1: 括号内推演 40.8° (width = 40.8 * 5 = 204) -->
  <text x="147" y="313" text-anchor="end" font-size="11.5" font-weight="bold" fill="#1e293b">圆括号「（……）」内</text>
  <text x="147" y="327" text-anchor="end" font-size="10" fill="#64748b">前置推导草稿阶段</text>
  <rect x="155" y="299" width="204" height="28" rx="4" fill="#3b82f6" />
  <text x="366" y="318" font-size="11.5" font-weight="bold" fill="#1d4ed8">40.8°（大步跨概念推导）</text>

  <!-- Bar 2: 出括号后答案区 36.5° (width = 36.5 * 5 = 182.5) -->
  <text x="147" y="360" text-anchor="end" font-size="11.5" font-weight="bold" fill="#15803d">跨出右括号「）」答案区</text>
  <text x="147" y="374" text-anchor="end" font-size="10" fill="#166534">括号推导后输出答案</text>
  <rect x="155" y="346" width="182.5" height="28" rx="4" fill="#16a34a" />
  <text x="345" y="365" font-size="11.5" font-weight="bold" fill="#15803d">36.5°（5/5 题收步，较裸答 -4.6°）</text>

  <!-- Bar 3: 无括号直接裸答答案区 41.1° (width = 41.1 * 5 = 205.5) -->
  <text x="147" y="407" text-anchor="end" font-size="11.5" font-weight="bold" fill="#475569">无括号直接作答答案区</text>
  <text x="147" y="421" text-anchor="end" font-size="10" fill="#64748b">边吐答案边做长途跳跃</text>
  <rect x="155" y="393" width="205.5" height="28" rx="4" fill="#94a3b8" />
  <text x="368" y="412" font-size="11.5" font-weight="bold" fill="#475569">41.1°（无前置草稿缓冲）</text>

  <text x="280" y="458" text-anchor="middle" font-size="10.5" fill="#475569">垫入括号推导草稿后，5/5 题答案区均收步，平均步长从 41.1° 缩短 4.6° 至 36.5°</text>
</svg>

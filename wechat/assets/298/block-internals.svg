<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2a6fd6"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d9822b"/>
    </marker>
    <clipPath id="clipwin"><rect x="0" y="0" width="128" height="128"/></clipPath>
  </defs>
  <rect width="900" height="600" fill="#fbfbf8"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" fill="#222">一个外围块（128 通道、4 头）的内部：先前馈、再注意力，各自带残差</text>

  <!-- 输入 -->
  <rect x="60" y="70" width="110" height="46" rx="8" fill="#eee" stroke="#555"/>
  <text x="115" y="90" text-anchor="middle" font-size="14" fill="#222">输入 x</text>
  <text x="115" y="107" text-anchor="middle" font-size="12" fill="#555">[128]</text>

  <!-- 前馈支路 -->
  <rect x="220" y="140" width="330" height="120" rx="10" fill="#eaf1fc" stroke="#2a6fd6"/>
  <text x="385" y="162" text-anchor="middle" font-size="15" fill="#2a6fd6">前馈支路</text>
  <rect x="240" y="180" width="80" height="50" rx="6" fill="#fff" stroke="#2a6fd6"/>
  <text x="280" y="201" text-anchor="middle" font-size="12" fill="#222">W1</text>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#555">128 → 160</text>
  <rect x="345" y="180" width="80" height="50" rx="6" fill="#fff" stroke="#2a6fd6"/>
  <text x="385" y="201" text-anchor="middle" font-size="12" fill="#222">多项式激活</text>
  <text x="385" y="218" text-anchor="middle" font-size="11" fill="#555">clamp ±4</text>
  <rect x="450" y="180" width="80" height="50" rx="6" fill="#fff" stroke="#2a6fd6"/>
  <text x="490" y="201" text-anchor="middle" font-size="12" fill="#222">W2</text>
  <text x="490" y="218" text-anchor="middle" font-size="11" fill="#555">160 → 128</text>
  <line x1="320" y1="205" x2="345" y2="205" stroke="#2a6fd6" stroke-width="1.5" marker-end="url(#arb)"/>
  <line x1="425" y1="205" x2="450" y2="205" stroke="#2a6fd6" stroke-width="1.5" marker-end="url(#arb)"/>
  <text x="385" y="248" text-anchor="middle" font-size="12" fill="#2a6fd6">只加宽 32，不是 4 倍</text>

  <!-- 加法 1 -->
  <circle cx="115" cy="300" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="115" y="306" text-anchor="middle" font-size="18" fill="#222">+</text>
  <text x="200" y="274" text-anchor="start" font-size="12" fill="#555">残差：x × ffn_cos_skip</text>
  <text x="200" y="290" text-anchor="start" font-size="11" fill="#888">（每通道一个系数，不是原样加回）</text>

  <!-- 注意力支路 -->
  <rect x="220" y="340" width="330" height="130" rx="10" fill="#fdf1e6" stroke="#d9822b"/>
  <text x="385" y="362" text-anchor="middle" font-size="15" fill="#d9822b">注意力支路（只在 8×8 窗口内）</text>
  <rect x="240" y="382" width="80" height="50" rx="6" fill="#fff" stroke="#d9822b"/>
  <text x="280" y="403" text-anchor="middle" font-size="12" fill="#222">QKV</text>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#555">128 → 3×64</text>
  <rect x="345" y="382" width="80" height="50" rx="6" fill="#fff" stroke="#d9822b"/>
  <text x="385" y="399" text-anchor="middle" font-size="12" fill="#222">4 头 × 16 维</text>
  <text x="385" y="413" text-anchor="middle" font-size="10" fill="#555">余弦 × scale</text>
  <text x="385" y="425" text-anchor="middle" font-size="10" fill="#555">+ 64×64 偏置</text>
  <rect x="450" y="382" width="80" height="50" rx="6" fill="#fff" stroke="#d9822b"/>
  <text x="490" y="403" text-anchor="middle" font-size="12" fill="#222">投影</text>
  <text x="490" y="420" text-anchor="middle" font-size="11" fill="#555">64 → 128</text>
  <line x1="320" y1="407" x2="345" y2="407" stroke="#d9822b" stroke-width="1.5" marker-end="url(#aro)"/>
  <line x1="425" y1="407" x2="450" y2="407" stroke="#d9822b" stroke-width="1.5" marker-end="url(#aro)"/>
  <text x="385" y="458" text-anchor="middle" font-size="12" fill="#d9822b">窗口外的像素这一层互相看不见</text>

  <!-- 加法 2 -->
  <circle cx="115" cy="500" r="16" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="115" y="506" text-anchor="middle" font-size="18" fill="#222">+</text>
  <text x="200" y="484" text-anchor="start" font-size="12" fill="#555">残差：x' × attn_cos_skip</text>

  <!-- 输出 -->
  <rect x="60" y="540" width="110" height="46" rx="8" fill="#eee" stroke="#555"/>
  <text x="115" y="560" text-anchor="middle" font-size="14" fill="#222">输出</text>
  <text x="115" y="577" text-anchor="middle" font-size="12" fill="#555">[128]</text>

  <!-- 主干竖线 -->
  <line x1="115" y1="116" x2="115" y2="284" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="115" y1="316" x2="115" y2="484" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="115" y1="516" x2="115" y2="540" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="128" y="345" text-anchor="start" font-size="12" fill="#555">x'</text>
  <!-- 分支线：x → FFN → + -->
  <path d="M115,150 L200,150 L200,205 L240,205" fill="none" stroke="#2a6fd6" stroke-width="1.5" marker-end="url(#arb)"/>
  <path d="M530,205 L580,205 L580,300 L131,300" fill="none" stroke="#2a6fd6" stroke-width="1.5" marker-end="url(#arb)"/>
  <!-- 分支线：x' → attn → + -->
  <path d="M115,355 L200,355 L200,407 L240,407" fill="none" stroke="#d9822b" stroke-width="1.5" marker-end="url(#aro)"/>
  <path d="M530,407 L580,407 L580,500 L131,500" fill="none" stroke="#d9822b" stroke-width="1.5" marker-end="url(#aro)"/>

  <!-- 右侧：8×8 窗口示意 -->
  <text x="760" y="112" text-anchor="middle" font-size="14" fill="#222">8×8 窗口</text>
  <g transform="translate(696,124)">
    <rect x="0" y="0" width="128" height="128" fill="#fff" stroke="#d9822b" stroke-width="1.5"/>
    <g stroke="#e8c9a8" stroke-width="0.8">
      <line x1="16" y1="0" x2="16" y2="128"/><line x1="32" y1="0" x2="32" y2="128"/><line x1="48" y1="0" x2="48" y2="128"/><line x1="64" y1="0" x2="64" y2="128"/><line x1="80" y1="0" x2="80" y2="128"/><line x1="96" y1="0" x2="96" y2="128"/><line x1="112" y1="0" x2="112" y2="128"/>
      <line y1="16" x1="0" y2="16" x2="128"/><line y1="32" x1="0" y2="32" x2="128"/><line y1="48" x1="0" y2="48" x2="128"/><line y1="64" x1="0" y2="64" x2="128"/><line y1="80" x1="0" y2="80" x2="128"/><line y1="96" x1="0" y2="96" x2="128"/><line y1="112" x1="0" y2="112" x2="128"/>
    </g>
    <rect x="48" y="48" width="16" height="16" fill="#d9822b"/>
  </g>
  <text x="760" y="272" text-anchor="middle" font-size="12" fill="#555">64 个位置两两互看</text>
  <text x="760" y="290" text-anchor="middle" font-size="12" fill="#555">注意力矩阵 64×64</text>

  <text x="760" y="340" text-anchor="middle" font-size="14" fill="#222">下一块窗口挪 4 格</text>
  <g transform="translate(696,352)">
    <rect x="0" y="0" width="128" height="128" fill="#fff" stroke="#ccc"/>
    <g stroke="#ccc" stroke-width="1">
      <line x1="64" y1="0" x2="64" y2="128"/><line y1="64" x1="0" y2="64" x2="128"/>
    </g>
    <rect x="32" y="32" width="64" height="64" fill="none" stroke="#d9822b" stroke-width="1.8" stroke-dasharray="5 3"/>
    <rect x="56" y="56" width="16" height="16" fill="#d9822b"/>
  </g>
  <text x="760" y="500" text-anchor="middle" font-size="12" fill="#555">灰线：上一块的窗口边界</text>
  <text x="760" y="518" text-anchor="middle" font-size="12" fill="#555">虚线：这一块的窗口</text>
  <text x="760" y="536" text-anchor="middle" font-size="12" fill="#555">原来在边界的点落到了中央</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Noto Sans CJK SC', sans-serif">
  <rect width="940" height="430" fill="#fbfbf8"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" fill="#222">相邻两块交替平移窗口：斜着挪 4 格，把上一块的窗口边界移到中央</text>

  <!-- ===== 左图：第一块，不平移 ===== -->
  <text x="170" y="66" text-anchor="middle" font-size="15" fill="#222">第一块：窗口从 (0,0) 起切</text>
  <g transform="translate(50,80)">
    <!-- 16x16 格子，每格 15px -->
    <g stroke="#e3e3dd" stroke-width="0.8">
      <g id="grid1">
        <line x1="0" y1="0" x2="240" y2="0"/><line x1="0" y1="15" x2="240" y2="15"/><line x1="0" y1="30" x2="240" y2="30"/><line x1="0" y1="45" x2="240" y2="45"/><line x1="0" y1="60" x2="240" y2="60"/><line x1="0" y1="75" x2="240" y2="75"/><line x1="0" y1="90" x2="240" y2="90"/><line x1="0" y1="105" x2="240" y2="105"/><line x1="0" y1="120" x2="240" y2="120"/><line x1="0" y1="135" x2="240" y2="135"/><line x1="0" y1="150" x2="240" y2="150"/><line x1="0" y1="165" x2="240" y2="165"/><line x1="0" y1="180" x2="240" y2="180"/><line x1="0" y1="195" x2="240" y2="195"/><line x1="0" y1="210" x2="240" y2="210"/><line x1="0" y1="225" x2="240" y2="225"/><line x1="0" y1="240" x2="240" y2="240"/>
        <line x1="0" y1="0" x2="0" y2="240"/><line x1="15" y1="0" x2="15" y2="240"/><line x1="30" y1="0" x2="30" y2="240"/><line x1="45" y1="0" x2="45" y2="240"/><line x1="60" y1="0" x2="60" y2="240"/><line x1="75" y1="0" x2="75" y2="240"/><line x1="90" y1="0" x2="90" y2="240"/><line x1="105" y1="0" x2="105" y2="240"/><line x1="120" y1="0" x2="120" y2="240"/><line x1="135" y1="0" x2="135" y2="240"/><line x1="150" y1="0" x2="150" y2="240"/><line x1="165" y1="0" x2="165" y2="240"/><line x1="180" y1="0" x2="180" y2="240"/><line x1="195" y1="0" x2="195" y2="240"/><line x1="210" y1="0" x2="210" y2="240"/><line x1="225" y1="0" x2="225" y2="240"/><line x1="240" y1="0" x2="240" y2="240"/>
      </g>
    </g>
    <!-- 四个 8x8 窗口 -->
    <rect x="0" y="0" width="120" height="120" fill="#2a6fd6" fill-opacity="0.07" stroke="#2a6fd6" stroke-width="2"/>
    <rect x="120" y="0" width="120" height="120" fill="#2a6fd6" fill-opacity="0.07" stroke="#2a6fd6" stroke-width="2"/>
    <rect x="0" y="120" width="120" height="120" fill="#2a6fd6" fill-opacity="0.07" stroke="#2a6fd6" stroke-width="2"/>
    <rect x="120" y="120" width="120" height="120" fill="#2a6fd6" fill-opacity="0.07" stroke="#2a6fd6" stroke-width="2"/>
    <!-- 标记点 A：窗口交界角 -->
    <rect x="105" y="105" width="15" height="15" fill="#d9822b"/>
    <rect x="120" y="105" width="15" height="15" fill="#c0392b"/>
    <text x="120" y="268" text-anchor="middle" font-size="12" fill="#555">四个窗口，各自独立算注意力</text>
    <text x="120" y="286" text-anchor="middle" font-size="12" fill="#c0392b">橙点和红点紧挨着，却分在两个窗口里</text>
    <text x="120" y="304" text-anchor="middle" font-size="12" fill="#c0392b">这一层它俩看不见对方</text>
  </g>

  <!-- 箭头 -->
  <path d="M310,190 L360,190" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <defs><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"/></marker></defs>
  <text x="335" y="180" text-anchor="middle" font-size="12" fill="#555">下一块</text>
  <text x="335" y="208" text-anchor="middle" font-size="12" fill="#555">斜挪 4 格</text>

  <!-- ===== 右图：第二块，平移 ===== -->
  <text x="510" y="66" text-anchor="middle" font-size="15" fill="#222">第二块：窗口网格整体挪到 (4,4) 起切</text>
  <g transform="translate(390,80)">
    <g stroke="#e3e3dd" stroke-width="0.8">
      <line x1="0" y1="0" x2="240" y2="0"/><line x1="0" y1="15" x2="240" y2="15"/><line x1="0" y1="30" x2="240" y2="30"/><line x1="0" y1="45" x2="240" y2="45"/><line x1="0" y1="60" x2="240" y2="60"/><line x1="0" y1="75" x2="240" y2="75"/><line x1="0" y1="90" x2="240" y2="90"/><line x1="0" y1="105" x2="240" y2="105"/><line x1="0" y1="120" x2="240" y2="120"/><line x1="0" y1="135" x2="240" y2="135"/><line x1="0" y1="150" x2="240" y2="150"/><line x1="0" y1="165" x2="240" y2="165"/><line x1="0" y1="180" x2="240" y2="180"/><line x1="0" y1="195" x2="240" y2="195"/><line x1="0" y1="210" x2="240" y2="210"/><line x1="0" y1="225" x2="240" y2="225"/><line x1="0" y1="240" x2="240" y2="240"/>
      <line x1="0" y1="0" x2="0" y2="240"/><line x1="15" y1="0" x2="15" y2="240"/><line x1="30" y1="0" x2="30" y2="240"/><line x1="45" y1="0" x2="45" y2="240"/><line x1="60" y1="0" x2="60" y2="240"/><line x1="75" y1="0" x2="75" y2="240"/><line x1="90" y1="0" x2="90" y2="240"/><line x1="105" y1="0" x2="105" y2="240"/><line x1="120" y1="0" x2="120" y2="240"/><line x1="135" y1="0" x2="135" y2="240"/><line x1="150" y1="0" x2="150" y2="240"/><line x1="165" y1="0" x2="165" y2="240"/><line x1="180" y1="0" x2="180" y2="240"/><line x1="195" y1="0" x2="195" y2="240"/><line x1="210" y1="0" x2="210" y2="240"/><line x1="225" y1="0" x2="225" y2="240"/><line x1="240" y1="0" x2="240" y2="240"/>
    </g>
    <!-- 上一块的窗口边界（淡） -->
    <line x1="120" y1="0" x2="120" y2="240" stroke="#2a6fd6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>
    <line x1="0" y1="120" x2="240" y2="120" stroke="#2a6fd6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>
    <!-- 新窗口：从 (60,60) 起，8格=120 -->
    <!-- 新窗口网格：从 (60,60) 起，四周是被切小的边窗 -->
    <g stroke="#d9822b" stroke-width="1.2" fill="none" opacity="0.5">
      <rect x="0" y="0" width="60" height="60"/><rect x="60" y="0" width="120" height="60"/><rect x="180" y="0" width="60" height="60"/>
      <rect x="0" y="60" width="60" height="120"/><rect x="180" y="60" width="60" height="120"/>
      <rect x="0" y="180" width="60" height="60"/><rect x="60" y="180" width="120" height="60"/><rect x="180" y="180" width="60" height="60"/>
    </g>
    <rect x="60" y="60" width="120" height="120" fill="#d9822b" fill-opacity="0.10" stroke="#d9822b" stroke-width="2.5"/>
    <rect x="105" y="105" width="15" height="15" fill="#d9822b"/>
    <rect x="120" y="105" width="15" height="15" fill="#c0392b"/>
    <text x="120" y="268" text-anchor="middle" font-size="12" fill="#555">虚线是上一块的窗口边界</text>
    <text x="120" y="286" text-anchor="middle" font-size="12" fill="#d9822b">橙点和红点现在同在一个窗口正中</text>
    <text x="120" y="304" text-anchor="middle" font-size="12" fill="#d9822b">这一层它俩能互相看见了</text>
  </g>

  <!-- 底部说明 -->
  <text x="470" y="404" text-anchor="middle" font-size="13" fill="#555">横竖各挪 4 格（斜着挪），一次就把横向和纵向两个方向的窗口缝同时补上</text>
</svg>

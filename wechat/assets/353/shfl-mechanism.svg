<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 820" width="520" height="820">
  <defs>
    <style>
      .title { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; fill: #475569; }
      .sec { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 14.5px; font-weight: bold; fill: #0f172a; }
      .lbl { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; }
      .txt { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; fill: #334155; }
      .small { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 11.5px; fill: #64748b; }
      .mono { font-family: 'WenQuanYi Micro Hei', 'DejaVu Sans Mono', sans-serif; font-size: 12.5px; font-weight: bold; fill: #ffffff; }
      .code { font-family: 'WenQuanYi Micro Hei', 'DejaVu Sans Mono', sans-serif; font-size: 11.5px; font-weight: bold; fill: #0f172a; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="520" height="820" rx="14" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="260" y="32" text-anchor="middle" class="title">SHFL 洗牌指令是怎么在 32 个线程间换数据的？</text>
  <text x="260" y="52" text-anchor="middle" class="subtitle">前提：同一线程束（Warp）内的 32 个线程没有快慢之分，每拍执行同一条指令</text>

  <!-- 第一节：CPU vs GPU Warp -->
  <rect x="18" y="68" width="484" height="122" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="92" class="sec">① 为什么不用担心“别的线程还没算完”？</text>

  <!-- 左框：CPU 误区 -->
  <rect x="32" y="104" width="220" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="142" y="124" text-anchor="middle" class="lbl" fill="#991b1b">× CPU 多线程（各有快慢）</text>
  <text x="142" y="144" text-anchor="middle" class="txt" fill="#7f1d1d">线程 A 跑到第 10 行，线程 B 还在</text>
  <text x="142" y="162" text-anchor="middle" class="txt" fill="#7f1d1d">第 3 行，不能直接读对方的变量</text>

  <!-- 右框：GPU 锁步 -->
  <rect x="268" y="104" width="220" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="378" y="124" text-anchor="middle" class="lbl" fill="#065f46">✓ GPU 同一线程束（同拍齐步走）</text>
  <text x="378" y="144" text-anchor="middle" class="txt" fill="#064e3b">32 个线程听同一个指令广播喇叭，</text>
  <text x="378" y="162" text-anchor="middle" class="txt" fill="#064e3b">同一纳秒必在同一行代码上同时交牌</text>

  <!-- 第二节：SHFL 硬件动作（两条 SHFL 完整瓜分 16 个数） -->
  <rect x="18" y="204" width="484" height="598" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="230" class="sec">② 旧方案如何用两条 SHFL 把 16 个数（0..15）重新分给 4 个线程</text>
  <text x="32" y="250" class="small">50 系 1 个寄存器装 4 个数；30 系 1 个寄存器只装 2 个数，每人要交 d1、d2 两个寄存器</text>

  <!-- Step A：各自手里的源寄存器 a -->
  <text x="32" y="276" class="lbl" fill="#0f172a">执行前：t0 ~ t3 四个线程手里的源寄存器 a（共 16 个数）</text>

  <g transform="translate(32, 288)">
    <rect x="0" y="0" width="106" height="54" rx="6" fill="#2563eb"/>
    <text x="53" y="21" text-anchor="middle" class="mono">t0 的寄存器 a</text>
    <text x="53" y="42" text-anchor="middle" class="mono" font-size="11.5">[ 0, 1, 2, 3 ]</text>

    <rect x="116" y="0" width="106" height="54" rx="6" fill="#d97706"/>
    <text x="169" y="21" text-anchor="middle" class="mono">t1 的寄存器 a</text>
    <text x="169" y="42" text-anchor="middle" class="mono" font-size="11.5">[ 4, 5, 6, 7 ]</text>

    <rect x="232" y="0" width="106" height="54" rx="6" fill="#059669"/>
    <text x="285" y="21" text-anchor="middle" class="mono">t2 的寄存器 a</text>
    <text x="285" y="42" text-anchor="middle" class="mono" font-size="11.5">[ 8, 9, 10, 11 ]</text>

    <rect x="348" y="0" width="106" height="54" rx="6" fill="#7c3aed"/>
    <text x="401" y="21" text-anchor="middle" class="mono">t3 的寄存器 a</text>
    <text x="401" y="42" text-anchor="middle" class="mono" font-size="11.5">[12, 13, 14, 15]</text>
  </g>

  <!-- 交叉连线区（Hardware Crossbar） -->
  <rect x="32" y="352" width="454" height="148" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4,4"/>

  <!-- 第 1 条 SHFL 连线（实线：t0.a 和 t1.a 分给 d1） -->
  <line x1="85" y1="344" x2="75" y2="494" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <line x1="85" y1="344" x2="191" y2="494" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <line x1="201" y1="344" x2="307" y2="494" stroke="#d97706" stroke-width="2.4" marker-end="url(#arr-amber)"/>
  <line x1="201" y1="344" x2="423" y2="494" stroke="#d97706" stroke-width="2.4" marker-end="url(#arr-amber)"/>

  <!-- 第 2 条 SHFL 连线（虚线：t2.a 和 t3.a 分给 d2） -->
  <line x1="317" y1="344" x2="95" y2="494" stroke="#059669" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <line x1="317" y1="344" x2="211" y2="494" stroke="#059669" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <line x1="433" y1="344" x2="327" y2="494" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <line x1="433" y1="344" x2="443" y2="494" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>

  <!-- 居中说明框盖在连线上 -->
  <rect x="48" y="362" width="422" height="26" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="259" y="379" text-anchor="middle" class="code" fill="#1e40af">实线（第 1 条 SHFL，b = tid ÷ 2）：把 t0.a 和 t1.a 的前 8 个数分进 d1</text>

  <rect x="48" y="446" width="422" height="26" rx="4" fill="#ecfdf5" stroke="#34d399"/>
  <text x="259" y="463" text-anchor="middle" class="code" fill="#065f46">虚线（第 2 条 SHFL，b = tid ÷ 2 + 2）：把 t2.a 和 t3.a 的后 8 个数分进 d2</text>

  <!-- Step B：抄到目标寄存器 d1 和 d2 -->
  <text x="32" y="520" class="lbl" fill="#0f172a">执行后：每个线程拿到两个寄存器 d1（前 8 个数）和 d2（后 8 个数）</text>

  <g transform="translate(32, 532)">
    <!-- t0 -->
    <rect x="0" y="0" width="106" height="128" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <text x="53" y="20" text-anchor="middle" class="lbl" fill="#0f172a">t0 最终拿到</text>
    <rect x="8" y="28" width="90" height="42" rx="4" fill="#2563eb"/>
    <text x="53" y="45" text-anchor="middle" class="mono" font-size="11">d1 (来自 t0.a)</text>
    <text x="53" y="63" text-anchor="middle" class="mono" font-size="12">[ 0, 1 ]</text>
    <rect x="8" y="76" width="90" height="42" rx="4" fill="#059669"/>
    <text x="53" y="93" text-anchor="middle" class="mono" font-size="11">d2 (来自 t2.a)</text>
    <text x="53" y="111" text-anchor="middle" class="mono" font-size="12">[ 8, 9 ]</text>

    <!-- t1 -->
    <rect x="116" y="0" width="106" height="128" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <text x="169" y="20" text-anchor="middle" class="lbl" fill="#0f172a">t1 最终拿到</text>
    <rect x="124" y="28" width="90" height="42" rx="4" fill="#2563eb"/>
    <text x="169" y="45" text-anchor="middle" class="mono" font-size="11">d1 (来自 t0.a)</text>
    <text x="169" y="63" text-anchor="middle" class="mono" font-size="12">[ 2, 3 ]</text>
    <rect x="124" y="76" width="90" height="42" rx="4" fill="#059669"/>
    <text x="169" y="93" text-anchor="middle" class="mono" font-size="11">d2 (来自 t2.a)</text>
    <text x="169" y="111" text-anchor="middle" class="mono" font-size="12">[ 10, 11 ]</text>

    <!-- t2 -->
    <rect x="232" y="0" width="106" height="128" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <text x="285" y="20" text-anchor="middle" class="lbl" fill="#0f172a">t2 最终拿到</text>
    <rect x="240" y="28" width="90" height="42" rx="4" fill="#d97706"/>
    <text x="285" y="45" text-anchor="middle" class="mono" font-size="11">d1 (来自 t1.a)</text>
    <text x="285" y="63" text-anchor="middle" class="mono" font-size="12">[ 4, 5 ]</text>
    <rect x="240" y="76" width="90" height="42" rx="4" fill="#7c3aed"/>
    <text x="285" y="93" text-anchor="middle" class="mono" font-size="11">d2 (来自 t3.a)</text>
    <text x="285" y="111" text-anchor="middle" class="mono" font-size="12">[ 12, 13 ]</text>

    <!-- t3 -->
    <rect x="348" y="0" width="106" height="128" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <text x="401" y="20" text-anchor="middle" class="lbl" fill="#0f172a">t3 最终拿到</text>
    <rect x="356" y="28" width="90" height="42" rx="4" fill="#d97706"/>
    <text x="401" y="45" text-anchor="middle" class="mono" font-size="11">d1 (来自 t1.a)</text>
    <text x="401" y="63" text-anchor="middle" class="mono" font-size="12">[ 6, 7 ]</text>
    <rect x="356" y="76" width="90" height="42" rx="4" fill="#7c3aed"/>
    <text x="401" y="93" text-anchor="middle" class="mono" font-size="11">d2 (来自 t3.a)</text>
    <text x="401" y="111" text-anchor="middle" class="mono" font-size="12">[ 14, 15 ]</text>
  </g>

  <!-- 底部总结 -->
  <rect x="32" y="676" width="454" height="108" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="46" y="700" class="lbl" fill="#991b1b">你看，上面 16 个数（0..15）一个不少，全换了座位：</text>
  <text x="46" y="722" class="txt" fill="#7f1d1d">• 第 1 条 SHFL 分完 t0.a 和 t1.a（0..7），第 2 条 SHFL 分完 t2.a 和 t3.a（8..15）</text>
  <text x="46" y="742" class="txt" fill="#7f1d1d">• 每个源寄存器需调 2～4 条 SHFL，主干 7 个代码包静态累积出 81,853 条</text>
  <text x="46" y="766" class="lbl" fill="#065f46">→ 新方案 ptx-v2：每人原地拆自己手里的数，1 条 SHFL 都不用调！</text>
</svg>

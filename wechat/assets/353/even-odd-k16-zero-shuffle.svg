<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 940" width="860" height="940">
  <defs>
    <style>
      .title { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 22px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 14px; fill: #475569; }
      .sec-title { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .label { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
      .note { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 13.5px; fill: #334155; }
      .small { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 12.5px; fill: #64748b; }
      .bit-txt { font-family: 'WenQuanYi Micro Hei', 'DejaVu Sans Mono', sans-serif; font-size: 13.5px; font-weight: bold; fill: #ffffff; }
      .code-txt { font-family: 'WenQuanYi Micro Hei', 'DejaVu Sans Mono', sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="860" height="940" rx="16" fill="#f8fafc"/>

  <!-- 顶部总标题 -->
  <text x="430" y="38" text-anchor="middle" class="title">偶奇 K16 原位分组（0-SHFL / 0-PRMT）与 1080p 耗时演进</text>
  <text x="430" y="62" text-anchor="middle" class="subtitle">上：32 位寄存器内偶奇字节天然对齐 f16x2 双通道 ｜ 下：RTX 3080 Laptop (132W) 四阶段实测</text>

  <!-- ==================== 第一部分：偶奇字节原位分组 ==================== -->
  <rect x="24" y="80" width="812" height="496" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="112" class="sec-title">① 为什么按“偶下标 + 奇下标”分组能省掉全网 94.5% 的跨线程洗牌（SHFL）？</text>

  <!-- 原版 32 位寄存器 -->
  <text x="46" y="140" class="label">每个线程 t 持有的 32 位 FP8 寄存器 REG（A 与 B 在同一线程内的 4 个 K 下标完全一致）：</text>
  <g transform="translate(46, 170)">
    <!-- bit 范围标注 -->
    <text x="92" y="-8" text-anchor="middle" class="small">bit 31 .. 24（奇 m=1）</text>
    <text x="282" y="-8" text-anchor="middle" class="small">bit 23 .. 16（偶 m=1）</text>
    <text x="472" y="-8" text-anchor="middle" class="small">bit 15 .. 8（奇 m=0）</text>
    <text x="662" y="-8" text-anchor="middle" class="small">bit 7 .. 0（偶 m=0）</text>

    <!-- 4 个字节格 -->
    <rect x="0" y="0" width="184" height="44" rx="6" fill="#d97706"/>
    <text x="92" y="28" text-anchor="middle" class="bit-txt">byte3 (k = 4g+3)</text>

    <rect x="190" y="0" width="184" height="44" rx="6" fill="#2563eb"/>
    <text x="282" y="28" text-anchor="middle" class="bit-txt">byte2 (k = 4g+2)</text>

    <rect x="380" y="0" width="184" height="44" rx="6" fill="#d97706"/>
    <text x="472" y="28" text-anchor="middle" class="bit-txt">byte1 (k = 4g+1)</text>

    <rect x="570" y="0" width="184" height="44" rx="6" fill="#2563eb"/>
    <text x="662" y="28" text-anchor="middle" class="bit-txt">byte0 (k = 4g+0)</text>
  </g>

  <!-- 旧方案（左侧红框） -->
  <rect x="46" y="234" width="350" height="320" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
  <text x="64" y="262" class="label" fill="#991b1b">× 旧方案（v0.1.0 / 上游）：按前后半段切分</text>
  <text x="64" y="286" class="note" fill="#7f1d1d">强行凑连续的 {byte0, byte1} 与 {byte2, byte3}</text>
  <text x="64" y="308" class="note" fill="#7f1d1d">导致每条指令只用到本线程 2 个字节，被迫跨线程借：</text>

  <rect x="64" y="324" width="314" height="82" rx="8" fill="#ffffff" stroke="#f87171"/>
  <text x="221" y="348" text-anchor="middle" class="code-txt" fill="#b91c1c">每次 MMA 需 9 个临时寄存器 +</text>
  <text x="221" y="370" text-anchor="middle" class="code-txt" fill="#b91c1c">跨线程 shfl.sync.idx.b32 × 6 条</text>
  <text x="221" y="392" text-anchor="middle" class="small" fill="#991b1b">加上 selp 条件选择与 prmt.b32 字节重排</text>

  <rect x="64" y="420" width="314" height="116" rx="8" fill="#fee2e2"/>
  <text x="221" y="446" text-anchor="middle" class="label" fill="#991b1b">静态统计后果（FB00 至 FB06）：</text>
  <text x="221" y="472" text-anchor="middle" class="note" fill="#7f1d1d">• 全网产生 81,853 条 SHFL 洗牌指令</text>
  <text x="221" y="496" text-anchor="middle" class="note" fill="#7f1d1d">• 寄存器紧缺叠加 .maxnreg 168 限制</text>
  <text x="221" y="520" text-anchor="middle" class="note" fill="#7f1d1d">• 挤出高额显存栈溢出（LDL / STL）</text>

  <!-- 新方案（右侧蓝绿框） -->
  <rect x="414" y="234" width="398" height="320" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
  <text x="432" y="262" class="label" fill="#065f46">✓ 新方案（ptx-v2）：利用内积求和交换律原位分组</text>
  <text x="432" y="286" class="note" fill="#064e3b">∑ A[i,k]·B[k,j] = ∑(偶下标 2m) + ∑(奇下标 2m+1)</text>

  <!-- 偶数通道框 -->
  <rect x="432" y="302" width="362" height="112" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="446" y="325" class="label" fill="#1e40af">第 1 条 m16n8k16：取本线程偶数字节 {byte2, byte0}</text>
  <rect x="446" y="336" width="162" height="36" rx="5" fill="#2563eb"/>
  <text x="527" y="359" text-anchor="middle" class="bit-txt">高16位: FP16(byte2)</text>
  <rect x="618" y="336" width="162" height="36" rx="5" fill="#2563eb"/>
  <text x="699" y="359" text-anchor="middle" class="bit-txt">低16位: FP16(byte0)</text>
  <text x="613" y="396" text-anchor="middle" class="code-txt" fill="#1d4ed8">掩码 + 左移 7 位 + 乘 256.0h（0 SHFL, 0 PRMT）</text>

  <!-- 奇数通道框 -->
  <rect x="432" y="426" width="362" height="112" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="446" y="449" class="label" fill="#92400e">第 2 条 m16n8k16：取本线程奇数字节 {byte3, byte1}</text>
  <rect x="446" y="460" width="162" height="36" rx="5" fill="#d97706"/>
  <text x="527" y="483" text-anchor="middle" class="bit-txt">高16位: FP16(byte3)</text>
  <rect x="618" y="460" width="162" height="36" rx="5" fill="#d97706"/>
  <text x="699" y="483" text-anchor="middle" class="bit-txt">低16位: FP16(byte1)</text>
  <text x="613" y="520" text-anchor="middle" class="code-txt" fill="#b45309">掩码 + 右移 1 位 + 乘 256.0h（0 SHFL, 0 PRMT）</text>

  <!-- ==================== 第二部分：四阶段性能对比 ==================== -->
  <rect x="24" y="594" width="812" height="322" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="46" y="628" class="sec-title">② RTX 3080 Laptop（132W，31 块新模型）1080p 单帧耗时四阶段演进</text>

  <!-- 行 1：上游 O1 -->
  <text x="46" y="674" class="label">① 上游位运算改法（O1）</text>
  <rect x="292" y="655" width="360" height="28" rx="5" fill="#94a3b8"/>
  <text x="662" y="674" class="label" fill="#475569">68.54 ms（基线 1.00×）</text>

  <!-- 行 2：v0.1.0 -->
  <text x="46" y="730" class="label">② 本项目 v0.1.0（满血 O4）</text>
  <rect x="292" y="711" width="168" height="28" rx="5" fill="#60a5fa"/>
  <text x="470" y="730" class="label" fill="#1d4ed8">32.04 ms（720p 15.83 ms / 900p 24.47 ms）</text>

  <!-- 行 3：ptx-v2 -->
  <text x="46" y="786" class="label">③ 内部代号 ptx-v2（零洗牌）</text>
  <rect x="292" y="767" width="107" height="28" rx="5" fill="#34d399"/>
  <text x="409" y="786" class="label" fill="#047857">20.36 ms（720p 10.19 ms / 900p 15.27 ms）</text>

  <!-- 行 4：ptx-v2.1 -->
  <text x="46" y="842" class="label" fill="#065f46">④ v0.2.0 ptx-v2.1（放宽 maxnreg）</text>
  <rect x="292" y="823" width="67" height="28" rx="5" fill="#059669"/>
  <text x="369" y="842" class="label" fill="#065f46">12.78 ms（720p 6.66 ms / 900p 9.70 ms，提速 5.36×）</text>

  <!-- 底部总结条 -->
  <rect x="46" y="874" width="768" height="28" rx="6" fill="#ecfdf5"/>
  <text x="430" y="893" text-anchor="middle" class="note" fill="#065f46" font-weight="bold">体积保持 254 MB 原槽位（0 扩节）· 原生 FP8 权重无损精度（相对 v0.1.0 达 58.5 至 62.5 dB）· 速度再快 2.5 倍</text>
</svg>

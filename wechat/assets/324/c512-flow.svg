<rect x="728" y="530" width="69" height="18" rx="3" fill="#f6c28b" stroke="#d9822b"/>
<text x="762" y="543" text-anchor="middle" font-size="10">头 10</text>
<rect x="728" y="552" width="69" height="18" rx="3" fill="#f6c28b" stroke="#d9822b"/>
<text x="762" y="565" text-anchor="middle" font-size="10">头 11</text>
<rect x="815" y="464" width="85" height="116" rx="4" fill="#fff" stroke="#999"/>
<text x="857" y="478" text-anchor="middle" font-size="10">SIMD 3</text>

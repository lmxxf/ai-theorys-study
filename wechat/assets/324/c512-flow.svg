<text x="667" y="521" text-anchor="middle" font-size="10">头 5</text>
<rect x="633" y="530" width="69" height="18" rx="3" fill="#f6c28b" stroke="#d9822b"/>
<text x="667" y="543" text-anchor="middle" font-size="10">头 6</text>
<rect x="633" y="552" width="69" height="18" rx="3" fill="#f6c28b" stroke="#d9822b"/>
<text x="667" y="565" text-anchor="middle" font-size="10">头 7</text>
<rect x="720" y="464" width="85" height="116" rx="4" fill="#fff" stroke="#999"/>
<text x="762" y="478" text-anchor="middle" font-size="10">SIMD 2</text>

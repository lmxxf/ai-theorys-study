<text x="352" y="239" text-anchor="middle" font-size="11">7 × 4 = 28 个 8×8 窗口（灰边是补的零）</text>
<text x="40" y="258" font-size="12" fill="#222">一个位置 = 原图 32×32 像素</text>
<text x="40" y="280" font-size="12" fill="#222">一个窗口 = 8×8 = 64 个位置 ≈ 原图 256×256</text>
<text x="40" y="302" font-size="12" fill="#222">窗口之间互不相干，可以并行</text>
<text x="40" y="324" font-size="12" fill="#222">一块只有 28 个窗口 → 这一块只有 28 份活</text>
<text x="40" y="346" font-size="12" fill="#999">（错开半格的块补到 56×40，是 35 个）</text>

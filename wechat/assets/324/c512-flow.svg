<text x="892" y="266" text-anchor="middle" font-size="9">15</text>
<text x="712" y="282" text-anchor="middle" font-size="11">头 0 ～ 头 15，每个头 32 个通道：16 × 32 = 512</text>
<text x="520" y="308" font-size="12">64×512 乘三套权重，导出 Q、K、V 各 64×512，</text>
<text x="520" y="328" font-size="12">再各切 16 份，每个头拿 32 列，64 个位置两两互看。</text>
<text x="520" y="348" font-size="12">同一对位置，16 个头会给出 16 种“该多关注”。</text>
<text x="520" y="368" font-size="12">最后 16 个头拼回 64×512，再做一次投影。</text>

<text x="235" y="529" text-anchor="middle" font-size="12">softmax</text>
<rect x="310" y="509" width="120" height="30" rx="4" fill="#fde9d4" stroke="#d9822b"/>
<text x="370" y="529" text-anchor="middle" font-size="12">= 权重 16×64</text>
<rect x="40" y="551" width="120" height="30" rx="4" fill="#fde9d4" stroke="#d9822b"/>

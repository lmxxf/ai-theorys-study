<text x="526" y="89" font-size="14" font-weight="bold">一个窗口：64×512，导出 Q/K/V，切给 16 个头</text>
<text x="520" y="104" font-size="10" fill="#666">Q / K / V 各是 64 行（位置）× 512 列，按列切成 16 个头</text>

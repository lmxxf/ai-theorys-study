<text x="235" y="571" text-anchor="middle" font-size="12">× V 64×32</text>
<rect x="310" y="551" width="120" height="30" rx="4" fill="#fde9d4" stroke="#d9822b"/>
<text x="370" y="571" text-anchor="middle" font-size="12">= 输出 16×32</text>
<text x="40" y="607" font-size="12">每次处理 16 个位置（矩阵指令一次算 16×16 的块），</text>
<text x="40" y="627" font-size="12">64 个位置分 4 段，这三步做 4 遍。</text>
<text x="40" y="647" font-size="12">一块 16×16 的结果摊在 32 个线程手里，每人拿 8 个数；</text>
<text x="40" y="667" font-size="12">没有哪个线程拿着“一个位置的全部”，32 人合起来才是一个头。</text>

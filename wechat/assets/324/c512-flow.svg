<text x="857" y="499" text-anchor="middle" font-size="10">头 12</text>
<rect x="823" y="508" width="69" height="18" rx="3" fill="#f6c28b" stroke="#d9822b"/>
<text x="857" y="521" text-anchor="middle" font-size="10">头 13</text>
<rect x="823" y="530" width="69" height="18" rx="3" fill="#f6c28b" stroke="#d9822b"/>
<text x="857" y="543" text-anchor="middle" font-size="10">头 14</text>
<rect x="823" y="552" width="69" height="18" rx="3" fill="#f6c28b" stroke="#d9822b"/>
<text x="857" y="565" text-anchor="middle" font-size="10">头 15</text>
<text x="520" y="612" font-size="12" fill="#222">16 个头要在投影时汇合，得共用共享内存，</text>
<text x="520" y="632" font-size="12" fill="#222">所以只能整组住进同一个 WGP。</text>
<text x="520" y="652" font-size="12" fill="#222">一块 C512 = 28 组 × 16 个 wave = 448 个 wave。</text>
<text x="520" y="672" font-size="12" fill="#b35c00">全卡 32 个 WGP 一次能住 96 组，只来了 28 组；</text>
<text x="520" y="692" font-size="12" fill="#b35c00">13 块 C512 一块接一块串着跑，每块都这样。</text>
</svg>
<text x="310" y="579" text-anchor="middle">共享内存（LDS）· 128 KB · 同一工作组的 wave 在这里交换数据</text>
<text x="310" y="597" text-anchor="middle" font-size="11" fill="#2f6b3b">一个工作组只能住在一个 WGP 里</text>
<text x="610" y="80" font-size="14" font-weight="bold">图里的数字各是什么</text>
<text x="610" y="104" font-size="15" font-weight="bold" fill="#b35c00">32</text>
<text x="610" y="122" font-size="12">一个 wave 有 32 个线程；一个 SIMD32 有 32 条车道。两</text>
<text x="610" y="139" font-size="12">个数相等，所以一周期正好执行一个 wave 的一条指令。</text>
<text x="610" y="166" font-size="15" font-weight="bold" fill="#b35c00">4</text>
<text x="610" y="184" font-size="12">一个 WGP 有 4 个 SIMD（2 个计算单元 × 2）。全卡 32 </text>
<text x="610" y="201" font-size="12">个 WGP，一共 128 个 SIMD。</text>
<text x="610" y="228" font-size="15" font-weight="bold" fill="#b35c00">12</text>
<text x="610" y="246" font-size="12">一个 SIMD 上最多同时挂几个 wave，由核用多少寄存器、多</text>
<text x="610" y="263" font-size="12">少共享内存决定。这个核是 12 个（虚线格）；C32 的核是 </text>
<text x="610" y="280" font-size="12">8 个。挂着的 wave 轮流上场，一个在等数据，下一周期换</text>
<text x="610" y="297" font-size="12">另一个。</text>
<text x="610" y="324" font-size="15" font-weight="bold" fill="#b35c00">16</text>
<text x="610" y="342" font-size="12">C512 一个窗口 16 个头，一头一 wave，所以一个工作组 </text>
<text x="610" y="359" font-size="12">16 个 wave，平摊到 4 个 SIMD 上，每个 4 个（橙色）。</text>
<text x="610" y="386" font-size="15" font-weight="bold" fill="#b35c00">3</text>
<text x="610" y="404" font-size="12">每个 SIMD 12 个位置 ÷ 每组占 4 个 = 一个 WGP 最多住</text>
<text x="610" y="421" font-size="12"> 3 组。</text>
<text x="610" y="448" font-size="15" font-weight="bold" fill="#b35c00">16（另一个）</text>
<text x="610" y="466" font-size="12">矩阵指令一次算 16×16 的块，所以一个 wave 一段处理 16</text>
<text x="610" y="483" font-size="12"> 个位置；一个头 64 个位置要分 4 段。</text>
</svg>
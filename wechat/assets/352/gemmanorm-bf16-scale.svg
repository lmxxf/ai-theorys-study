<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" width="520" height="490" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect width="520" height="490" fill="#fbfbfd" rx="12"/>

  <!-- 顶部标题 -->
  <text x="260" y="32" text-anchor="middle" fill="#1e293b" font-size="17.5" font-weight="bold">第一件事：BF16（7 位尾数）下的微小梯度更新 Δw = +0.002</text>
  <text x="260" y="52" text-anchor="middle" fill="#64748b" font-size="12">把常数 1.0 拎出参数表，让 w 住在 0.0 附近借指数位的刻度精度</text>

  <!-- 上框：普通 RMSNorm (w 初始为 1.0) -->
  <g transform="translate(20, 68)">
    <rect x="0" y="0" width="480" height="190" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="5,3"/>
    <text x="240" y="24" text-anchor="middle" fill="#9f1239" font-size="13.5" font-weight="bold">× 普通 RMSNorm：out = x_norm ⊙ w（w 初始 = 1.0）</text>
    <text x="240" y="44" text-anchor="middle" fill="#be123c" font-size="11.5">住在 [1.0, 2.0) 区间，指数 2^0，相邻刻度步长 = 2^-7 = 0.0078125</text>

    <!-- 刻度尺示意 -->
    <rect x="20" y="56" width="440" height="68" rx="6" fill="#ffffff" stroke="#fecdd3" stroke-width="1.2"/>
    <line x1="48" y1="92" x2="432" y2="92" stroke="#475569" stroke-width="2"/>
    <!-- 刻度 1.0000 -->
    <line x1="74" y1="79" x2="74" y2="105" stroke="#0f172a" stroke-width="2.5"/>
    <text x="74" y="118" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">1.0000</text>
    <!-- 刻度 1.0078125 -->
    <line x1="264" y1="79" x2="264" y2="105" stroke="#0f172a" stroke-width="2.5"/>
    <text x="264" y="118" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">1.0078125</text>
    <!-- 刻度 1.015625 -->
    <line x1="410" y1="79" x2="410" y2="105" stroke="#64748b" stroke-width="2"/>
    <text x="410" y="118" text-anchor="middle" fill="#64748b" font-size="11">1.0156</text>

    <!-- 死区高亮 -->
    <rect x="75" y="72" width="95" height="20" fill="#fecdd3" opacity="0.75"/>
    <text x="174" y="69" text-anchor="middle" fill="#e11d48" font-size="10.5" font-weight="bold">小于半格 (+0.0039) 全部被四舍五入回 1.0</text>

    <!-- +0.002 落点 -->
    <circle cx="122" cy="92" r="5" fill="#e11d48"/>
    <path d="M 122 86 Q 98 72 79 86" fill="none" stroke="#e11d48" stroke-width="1.8"/>
    <polygon points="77,88 80,81 84,86" fill="#e11d48"/>
    <text x="124" y="107" fill="#be123c" font-size="10.5" font-weight="bold">1.002</text>

    <!-- 结论框 -->
    <rect x="20" y="134" width="440" height="44" rx="5" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="240" y="152" text-anchor="middle" fill="#881337" font-size="12" font-weight="bold">算 1.0 + 0.002 = 1.002 → 存回 BF16 当场又变回 1.0</text>
    <text x="240" y="170" text-anchor="middle" fill="#9f1239" font-size="11">原因：底座 1.0 霸占了指数位，微小梯度直接掉进舍入死区被吞没</text>
  </g>

  <!-- 下框：GemmaNorm (w 初始为 0.0) -->
  <g transform="translate(20, 276)">
    <rect x="0" y="0" width="480" height="194" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="240" y="24" text-anchor="middle" fill="#166534" font-size="13.5" font-weight="bold">✓ 零均值 GemmaNorm：out = x_norm ⊙ (1 + w)（w 初始 = 0.0）</text>
    <text x="240" y="44" text-anchor="middle" fill="#15803d" font-size="11.5">w 只存增量：在 0.002 附近指数下调到 2^-9，步长 = 2^-16 ≈ 0.000015</text>

    <!-- 刻度尺示意 -->
    <rect x="20" y="56" width="440" height="68" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <line x1="40" y1="92" x2="440" y2="92" stroke="#16a34a" stroke-width="2"/>
    <!-- 密集细刻度 -->
    <line x1="56" y1="84" x2="56" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="80" y1="84" x2="80" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="104" y1="84" x2="104" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="128" y1="84" x2="128" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="152" y1="84" x2="152" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="176" y1="84" x2="176" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="200" y1="80" x2="200" y2="104" stroke="#166534" stroke-width="2.2"/>
    <line x1="224" y1="84" x2="224" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="248" y1="84" x2="248" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="272" y1="84" x2="272" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="296" y1="84" x2="296" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="320" y1="84" x2="320" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="344" y1="84" x2="344" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="368" y1="84" x2="368" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="392" y1="84" x2="392" y2="100" stroke="#86efac" stroke-width="1.3"/>
    <line x1="416" y1="84" x2="416" y2="100" stroke="#86efac" stroke-width="1.3"/>

    <circle cx="200" cy="92" r="5.5" fill="#16a34a"/>
    <text x="240" y="73" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">刻度分辨率精细 512 倍（每格 0.00001526）</text>
    <text x="210" y="117" text-anchor="middle" fill="#14532d" font-size="11.5" font-weight="bold">w = 0.001999（精准落格保存 ✓）</text>

    <!-- 结论框 -->
    <rect x="20" y="136" width="440" height="44" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="240" y="154" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">w 单独存 0.002，前向时转 FP32 算 (1.0 + w) ⊙ x_norm</text>
    <text x="240" y="172" text-anchor="middle" fill="#166534" font-size="11">把常数 1.0 拎出参数表，BF16 全部尾数都用来存微调增量</text>
  </g>
</svg>

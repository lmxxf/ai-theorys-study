<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect width="900" height="660" fill="#fbfbfd" rx="10"/>

  <!-- 标题 -->
  <text x="450" y="32" text-anchor="middle" fill="#1e293b" font-size="19.5" font-weight="bold">现代大模型单层 Transformer 里的“六道归一化岗哨”全景图</text>
  <text x="450" y="53" text-anchor="middle" fill="#64748b" font-size="13">左：主干残差三种站位演进｜右：2026 主流大模型（Qwen3.8 / Gemma / Muse Spark / MiniMax-M3.1）的内部 Norm 工位</text>

  <!-- ================= 左半区：残差主干与 Norm 的三种站位演进 ================= -->
  <rect x="24" y="68" width="336" height="516" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="68" width="336" height="30" rx="6" fill="#f1f5f9"/>
  <text x="192" y="88" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="bold">一、残差主干上的三种站位演进</text>

  <!-- 1. Post-Norm -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="304" height="132" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="152" y="20" text-anchor="middle" fill="#9f1239" font-size="12.5" font-weight="bold">① Post-Norm（2017 初代 Transformer）</text>
    <text x="152" y="42" text-anchor="middle" fill="#0f172a" font-size="12.5" font-weight="bold">x_{l+1} = Norm( x_l + F(x_l) )</text>
    <rect x="18" y="52" width="268" height="32" rx="4" fill="#ffffff" stroke="#fecdd3" stroke-width="1.2"/>
    <text x="152" y="72" text-anchor="middle" fill="#be123c" font-size="11" font-weight="bold">× 收费站拦在残差主干上：每层合流后强制除以标准差</text>
    <text x="152" y="102" text-anchor="middle" fill="#475569" font-size="10.8">后果：反向传播梯度每过一层都被主干 Norm 削弱，</text>
    <text x="152" y="119" text-anchor="middle" fill="#475569" font-size="10.8">层数一深极易训崩，高度依赖漫长的 Warmup 预热</text>
  </g>

  <!-- 2. Pre-Norm -->
  <g transform="translate(40, 256)">
    <rect x="0" y="0" width="304" height="142" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
    <text x="152" y="20" text-anchor="middle" fill="#0369a1" font-size="12.5" font-weight="bold">② Pre-Norm（GPT-2 / Llama / DeepSeek 标配）</text>
    <text x="152" y="42" text-anchor="middle" fill="#0f172a" font-size="12.5" font-weight="bold">x_{l+1} = x_l + F( Norm(x_l) )</text>
    <rect x="18" y="52" width="268" height="32" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="152" y="72" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="bold">✓ 主干零路障高速路：只在进支路 F 前做体检</text>
    <text x="152" y="102" text-anchor="middle" fill="#475569" font-size="10.8">优势：梯度沿主干 x_l 一路恒等为 1 直通第 0 层；</text>
    <text x="152" y="119" text-anchor="middle" fill="#b45309" font-size="10.8" font-weight="bold">隐患：支路输出 F(.) 未受约束，60 层累加后深层方差膨胀</text>
    <text x="152" y="135" text-anchor="middle" fill="#64748b" font-size="10">（而且必须在全网最后一层末尾补一道 Final Norm）</text>
  </g>

  <!-- 3. Peri-Norm / Sandwich-Norm -->
  <g transform="translate(40, 412)">
    <rect x="0" y="0" width="304" height="156" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="152" y="20" text-anchor="middle" fill="#166534" font-size="12.5" font-weight="bold">③ Sandwich / Peri-Norm（CogView / Gemma 2&amp;3）</text>
    <text x="152" y="42" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">x_{l+1} = x_l + PostNorm( F( PreNorm(x_l) ) )</text>
    <rect x="18" y="52" width="268" height="32" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="152" y="72" text-anchor="middle" fill="#15803d" font-size="11" font-weight="bold">★ 进门体检 ＋ 出门限幅：两头都在支路上</text>
    <text x="152" y="102" text-anchor="middle" fill="#475569" font-size="10.8">优势：既保住残差主干 x_l 畅通无阻，又在支路汇回</text>
    <text x="152" y="119" text-anchor="middle" fill="#475569" font-size="10.8">主干前把 F(.) 的幅度锁住，防止单层暴冲污染主干；</text>
    <text x="152" y="138" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="bold">另解：Meta Muse Spark 用 α²+β²=1 残差门在汇合点控幅</text>
  </g>

  <!-- ================= 右半区：单层内部 6 大 Norm 工位解剖图 ================= -->
  <rect x="376" y="68" width="500" height="516" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="376" y="68" width="500" height="30" rx="6" fill="#f1f5f9"/>
  <text x="626" y="88" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="bold">二、现代大模型单层内部的 6 道归一化岗哨</text>

  <!-- 左侧竖直贯穿的残差主干高速公路 -->
  <line x1="422" y1="112" x2="422" y2="564" stroke="#0f172a" stroke-width="4"/>
  <polygon points="422,570 416,558 428,558" fill="#0f172a"/>
  <text x="410" y="126" text-anchor="end" fill="#0f172a" font-size="11" font-weight="bold">x_l</text>
  <text x="410" y="340" text-anchor="end" fill="#334155" font-size="11" font-weight="bold">残差</text>
  <text x="410" y="356" text-anchor="end" fill="#334155" font-size="11" font-weight="bold">主干</text>

  <!-- ======= 上半层：Attention 支路 ======= -->
  <path d="M 422 130 L 468 130" stroke="#334155" stroke-width="2"/>
  <polygon points="472,130 465,126 465,134" fill="#334155"/>

  <!-- 岗哨 1: input_layernorm -->
  <rect x="474" y="114" width="144" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="546" y="134" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="bold">① input_layernorm</text>

  <path d="M 618 130 L 650 130" stroke="#2563eb" stroke-width="2"/>
  <rect x="650" y="110" width="96" height="40" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="698" y="128" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">W_q / W_k / W_v</text>
  <text x="698" y="143" text-anchor="middle" fill="#64748b" font-size="9.5">线性投影分头</text>

  <path d="M 698 150 L 698 174" stroke="#64748b" stroke-width="2"/>
  <polygon points="698,178 694,171 702,171" fill="#64748b"/>

  <!-- 岗哨 2: QK-Norm (重点高亮框) -->
  <rect x="468" y="180" width="388" height="84" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="662" y="200" text-anchor="middle" fill="#92400e" font-size="12.5" font-weight="bold">★ ② 逐头 QK-Norm（q_norm / k_norm，如 [128 维]）</text>
  <text x="662" y="219" text-anchor="middle" fill="#b45309" font-size="10.8">在算 Q · K^T 点积前，把每个头的 Q、K 向量锁回定长球面：</text>
  <text x="662" y="237" text-anchor="middle" fill="#78350f" font-size="11" font-weight="bold">点积 (Q_norm · K_norm) / √d_k 严格有界 ∈ [-√d_k, +√d_k]（如 ±11.31）</text>
  <text x="662" y="254" text-anchor="middle" fill="#047857" font-size="10.5" font-weight="bold">彻底根除深层 Q、K 模长暴涨导致的 Softmax 极端 0/1 饱和与注意力崩溃</text>

  <path d="M 662 264 L 662 286" stroke="#d97706" stroke-width="2"/>
  <polygon points="662,290 658,283 666,283" fill="#d97706"/>

  <!-- Softmax + o_norm + W_o + post_attention_norm -->
  <rect x="468" y="292" width="184" height="36" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="560" y="309" text-anchor="middle" fill="#0c4a6e" font-size="11" font-weight="bold">Softmax @ V → ③ o_norm</text>
  <text x="560" y="322" text-anchor="middle" fill="#0369a1" font-size="9.5">(Muse Spark 逐头无参 Norm)</text>

  <path d="M 652 310 L 680 310" stroke="#0284c7" stroke-width="1.8"/>
  <rect x="680" y="292" width="176" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="768" y="309" text-anchor="middle" fill="#14532d" font-size="11" font-weight="bold">W_o → ④ 支路出口 Norm</text>
  <text x="768" y="322" text-anchor="middle" fill="#166534" font-size="9.5">(Sandwich 架构回主干前限幅)</text>

  <!-- 汇回主干加法节点 1 -->
  <path d="M 768 328 L 768 348 L 436 348" fill="none" stroke="#16a34a" stroke-width="2"/>
  <polygon points="434,348 441,344 441,352" fill="#16a34a"/>
  <circle cx="422" cy="348" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="422" y="352" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">+</text>

  <!-- ======= 下半层：MoE / FFN 支路 ======= -->
  <path d="M 422 382 L 468 382" stroke="#334155" stroke-width="2"/>
  <polygon points="472,382 465,378 465,386" fill="#334155"/>

  <!-- 岗哨 5: post_attention_layernorm (MoE Pre-Norm) -->
  <rect x="474" y="366" width="176" height="32" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="562" y="386" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="bold">⑤ MoE 进门 Pre-Norm</text>

  <path d="M 650 382 L 684 382" stroke="#2563eb" stroke-width="2"/>
  <rect x="684" y="362" width="172" height="40" rx="5" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="770" y="380" text-anchor="middle" fill="#581c87" font-size="11" font-weight="bold">潜空间降维 + Top-K 专家</text>
  <text x="770" y="395" text-anchor="middle" fill="#6b21a8" font-size="9.5">8 个激活专家并行跑 SwiGLU</text>

  <path d="M 770 402 L 770 426" stroke="#9333ea" stroke-width="2"/>
  <polygon points="770,430 766,423 774,423" fill="#9333ea"/>

  <!-- 岗哨 6: post_expert_norm -->
  <rect x="468" y="432" width="388" height="62" rx="6" fill="#fae8ff" stroke="#c026d3" stroke-width="1.8"/>
  <text x="662" y="452" text-anchor="middle" fill="#86198f" font-size="12" font-weight="bold">★ ⑥ 专家出口共享归一化（post_expert_norm，如 Muse Spark）</text>
  <text x="662" y="470" text-anchor="middle" fill="#701a75" font-size="10.8">8 个被选中的专家各自算完后，先过同一把尺子拉齐模长，</text>
  <text x="662" y="486" text-anchor="middle" fill="#701a75" font-size="10.8">再乘路由器概率 p_k 加权求和——防止单个大嗓门专家架空路由器权重</text>

  <!-- 汇回主干加法节点 2 -->
  <path d="M 662 494 L 662 522 L 436 522" fill="none" stroke="#c026d3" stroke-width="2"/>
  <polygon points="434,522 441,518 441,526" fill="#c026d3"/>
  <circle cx="422" cy="522" r="11" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="422" y="526" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold">+</text>

  <!-- 末层 Final Norm 提示 -->
  <rect x="454" y="542" width="402" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="655" y="560" text-anchor="middle" fill="#334155" font-size="11" font-weight="bold">注：全网 60 层跑完后，进 lm_head 分类前还有最后一道 Final RMSNorm</text>

  <!-- 底部总结栏 -->
  <rect x="24" y="598" width="852" height="44" rx="6" fill="#1e293b"/>
  <text x="450" y="625" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="bold">★ 演化主线：从早年“拦在主干上收费”，变成如今“主干全程免检放行，在每个乘加入口前精准控幅”</text>
</svg>

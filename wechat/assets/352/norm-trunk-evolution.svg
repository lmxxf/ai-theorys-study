<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 880" width="520" height="880" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect width="520" height="880" fill="#fbfbfd" rx="12"/>

  <!-- 顶部标题 -->
  <text x="260" y="34" text-anchor="middle" fill="#1e293b" font-size="18" font-weight="bold">第一阶段（2017 → 2021）：主干与支路的三代搬家</text>
  <text x="260" y="56" text-anchor="middle" fill="#64748b" font-size="12.5">既要让反向传播梯度畅通无阻，又要防深层累加把数值撑爆</text>

  <!-- ================= 第 1 层：2017 Post-Norm ================= -->
  <g transform="translate(20, 74)">
    <rect x="0" y="0" width="480" height="232" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.8"/>
    <rect x="0" y="0" width="480" height="34" rx="7" fill="#ffe4e6"/>
    <text x="240" y="23" text-anchor="middle" fill="#9f1239" font-size="14" font-weight="bold">① 2017：Post-Norm（初代 Transformer / BERT）</text>

    <!-- 左侧拓扑图 -->
    <rect x="14" y="46" width="196" height="172" rx="6" fill="#ffffff" stroke="#fecdd3" stroke-width="1.2"/>
    <text x="52" y="64" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">输入 x_l</text>
    <line x1="52" y1="70" x2="52" y2="146" stroke="#be123c" stroke-width="3"/>

    <!-- 分叉进支路 -->
    <path d="M 52 80 L 140 80 L 140 94" fill="none" stroke="#475569" stroke-width="2"/>
    <polygon points="140,98 136,91 144,91" fill="#475569"/>
    <rect x="92" y="99" width="96" height="30" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="140" y="118" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">支路计算 F(x)</text>

    <!-- 汇回主干 + -->
    <path d="M 140 129 L 140 142 L 65 142" fill="none" stroke="#475569" stroke-width="2"/>
    <polygon points="63,142 70,138 70,146" fill="#475569"/>
    <circle cx="52" cy="142" r="9" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="52" y="146" text-anchor="middle" fill="#0f172a" font-size="12.5" font-weight="bold">+</text>

    <!-- 主干拦路 Norm -->
    <line x1="52" y1="151" x2="52" y2="164" stroke="#be123c" stroke-width="3"/>
    <rect x="22" y="164" width="146" height="28" rx="5" fill="#fecdd3" stroke="#e11d48" stroke-width="2"/>
    <text x="95" y="182" text-anchor="middle" fill="#881337" font-size="11.5" font-weight="bold">× 主干拦路 Norm</text>
    <line x1="52" y1="192" x2="52" y2="208" stroke="#be123c" stroke-width="3"/>
    <polygon points="52,213 47,205 57,205" fill="#be123c"/>
    <text x="112" y="210" text-anchor="start" fill="#881337" font-size="11" font-weight="bold">输出 x_{l+1}</text>

    <!-- 右侧说明文字 -->
    <text x="226" y="70" fill="#0f172a" font-size="13" font-weight="bold">公式：x_{l+1} = Norm(x_l + F(x_l))</text>
    <text x="226" y="98" fill="#be123c" font-size="12.5" font-weight="bold">× 收费站直接修在残差主干上</text>
    <text x="226" y="124" fill="#334155" font-size="12">• 正向看：每层合流后都拉回 1，数值很稳</text>
    <text x="226" y="148" fill="#334155" font-size="12">• 反向要命：梯度往回传时，每退一层都要</text>
    <text x="236" y="168" fill="#334155" font-size="12">被主干 Norm 削弱一次</text>
    <text x="226" y="194" fill="#9f1239" font-size="12" font-weight="bold">• 后果：超过 24 层浅层就收不到梯度</text>
  </g>

  <!-- 向下演化箭头 1 -->
  <line x1="260" y1="306" x2="260" y2="328" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="260,334 254,324 266,324" fill="#64748b"/>

  <!-- ================= 第 2 层：2019 Pre-Norm ================= -->
  <g transform="translate(20, 336)">
    <rect x="0" y="0" width="480" height="232" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
    <rect x="0" y="0" width="480" height="34" rx="7" fill="#e0f2fe"/>
    <text x="240" y="23" text-anchor="middle" fill="#075985" font-size="14" font-weight="bold">② 2019：Pre-Norm（GPT-2 / Llama / DeepSeek 标配）</text>

    <!-- 左侧拓扑图 -->
    <rect x="14" y="46" width="196" height="172" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="48" y="64" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">输入 x_l</text>
    <line x1="48" y1="70" x2="48" y2="206" stroke="#0284c7" stroke-width="3.5"/>
    <polygon points="48,212 43,204 53,204" fill="#0284c7"/>
    <text x="35" y="138" text-anchor="end" fill="#0369a1" font-size="10.5" font-weight="bold">主干</text>
    <text x="35" y="152" text-anchor="end" fill="#0369a1" font-size="10.5" font-weight="bold">直通</text>

    <!-- 分叉进支路：先过 Pre-Norm -->
    <path d="M 48 80 L 140 80 L 140 92" fill="none" stroke="#0284c7" stroke-width="2"/>
    <polygon points="140,96 136,89 144,89" fill="#0284c7"/>
    <rect x="86" y="97" width="108" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="140" y="114" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="bold">✓ 进门 Pre-Norm</text>

    <line x1="140" y1="123" x2="140" y2="138" stroke="#2563eb" stroke-width="2"/>
    <rect x="92" y="138" width="96" height="28" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="140" y="156" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">支路计算 F(·)</text>

    <!-- 汇回主干 + -->
    <path d="M 140 166 L 140 184 L 61 184" fill="none" stroke="#475569" stroke-width="2"/>
    <polygon points="59,184 66,180 66,188" fill="#475569"/>
    <circle cx="48" cy="184" r="9" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="48" y="188" text-anchor="middle" fill="#0f172a" font-size="12.5" font-weight="bold">+</text>
    <text x="108" y="210" text-anchor="start" fill="#075985" font-size="11" font-weight="bold">输出 x_{l+1}</text>

    <!-- 右侧说明文字 -->
    <text x="226" y="70" fill="#0f172a" font-size="13" font-weight="bold">公式：x_{l+1} = x_l + F(Norm(x_l))</text>
    <text x="226" y="98" fill="#0369a1" font-size="12.5" font-weight="bold">✓ 把 Norm 从主干挪到进支路门口</text>
    <text x="226" y="124" fill="#334155" font-size="12">• 优势：左侧残差主干全程零路障，梯度</text>
    <text x="236" y="144" fill="#334155" font-size="12">沿 + 号一路恒等为 1 直通第 0 层</text>
    <text x="226" y="170" fill="#b45309" font-size="12" font-weight="bold">• 新隐患：支路输出 F(·) 没限幅就直接</text>
    <text x="236" y="190" fill="#b45309" font-size="12" font-weight="bold">加回主干，60 层累加后主干方差膨胀</text>
    <text x="224" y="212" fill="#64748b" font-size="10.2">（全网末层进 lm_head 前须补一道 Final Norm）</text>
  </g>

  <!-- 向下演化箭头 2 -->
  <line x1="260" y1="568" x2="260" y2="590" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="260,596 254,586 266,586" fill="#64748b"/>

  <!-- ================= 第 3 层：2021 Sandwich-Norm ================= -->
  <g transform="translate(20, 598)">
    <rect x="0" y="0" width="480" height="232" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="0" y="0" width="480" height="34" rx="7" fill="#dcfce7"/>
    <text x="240" y="23" text-anchor="middle" fill="#166534" font-size="14" font-weight="bold">③ 2021：Sandwich-Norm（CogView / Gemma 2 &amp; 3）</text>

    <!-- 左侧拓扑图 -->
    <rect x="14" y="46" width="196" height="172" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="48" y="64" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">输入 x_l</text>
    <line x1="48" y1="70" x2="48" y2="206" stroke="#16a34a" stroke-width="3.5"/>
    <polygon points="48,212 43,204 53,204" fill="#16a34a"/>
    <text x="35" y="138" text-anchor="end" fill="#15803d" font-size="10.5" font-weight="bold">主干</text>
    <text x="35" y="152" text-anchor="end" fill="#15803d" font-size="10.5" font-weight="bold">直通</text>

    <!-- 分叉进支路：Pre-Norm -> F -> Post-Norm -->
    <path d="M 48 76 L 140 76 L 140 86" fill="none" stroke="#16a34a" stroke-width="2"/>
    <rect x="86" y="86" width="108" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="140" y="102" text-anchor="middle" fill="#1e3a8a" font-size="10.5" font-weight="bold">✓ 进门 Pre-Norm</text>

    <line x1="140" y1="110" x2="140" y2="120" stroke="#2563eb" stroke-width="2"/>
    <rect x="92" y="120" width="96" height="24" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="140" y="136" text-anchor="middle" fill="#0f172a" font-size="10.5" font-weight="bold">支路计算 F(·)</text>

    <line x1="140" y1="144" x2="140" y2="154" stroke="#16a34a" stroke-width="2"/>
    <rect x="86" y="154" width="108" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="140" y="170" text-anchor="middle" fill="#14532d" font-size="10.5" font-weight="bold">★ 出门 Post-Norm</text>

    <!-- 汇回主干 + -->
    <path d="M 140 178 L 140 192 L 61 192" fill="none" stroke="#16a34a" stroke-width="2"/>
    <polygon points="59,192 66,188 66,196" fill="#16a34a"/>
    <circle cx="48" cy="192" r="9" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="48" y="196" text-anchor="middle" fill="#0f172a" font-size="12.5" font-weight="bold">+</text>
    <text x="108" y="210" text-anchor="start" fill="#166534" font-size="11" font-weight="bold">输出 x_{l+1}</text>

    <!-- 右侧说明文字 -->
    <text x="224" y="70" fill="#0f172a" font-size="11.2" font-weight="bold">x_{l+1} = x_l + PostNorm(F(PreNorm(x_l)))</text>
    <text x="226" y="98" fill="#15803d" font-size="12.5" font-weight="bold">★ 支路一头一尾“夹三明治”双保险</text>
    <text x="226" y="124" fill="#334155" font-size="12">• 进支路前：做一次 Pre-Norm 体检</text>
    <text x="226" y="148" fill="#334155" font-size="12">• 出支路后：汇回主干前再做一次</text>
    <text x="236" y="168" fill="#334155" font-size="12">Post-Norm 限幅，锁住汇入主干的步长</text>
    <text x="226" y="196" fill="#166534" font-size="12" font-weight="bold">• 效果：主干梯度照样直通，深层也不爆</text>
  </g>

  <!-- 底部一句话总结 -->
  <rect x="20" y="840" width="480" height="28" rx="5" fill="#1e293b"/>
  <text x="260" y="859" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">★ 第一阶段：把 Norm 从“主干拦路收费站”挪进“支路进出匝道”</text>
</svg>

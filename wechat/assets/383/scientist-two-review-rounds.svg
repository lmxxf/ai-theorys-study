<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 510" width="100%" height="100%" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <!-- 实心纯白底（适配手机竖屏，无外层大边框） -->
  <rect width="580" height="510" fill="#ffffff"/>

  <!-- 上半部分标题：表 2 八大自动科研框架在斯坦福独立盲审下的录用率 -->
  <text x="16" y="26" font-size="14.5" font-weight="bold" fill="#111827">一、表 2 同场盲审：7 个前人框架录用率全为 0%，ScientistTwo 达 72.1%</text>
  <text x="16" y="45" font-size="11.5" fill="#4b5563">场外独立裁判 Stanford Agentic Reviewer 录用率（%）与均分（1–10 分制，括号内为公开样本数）</text>

  <!-- 表 2 横向条形图区域 -->
  <line x1="170" y1="58" x2="170" y2="232" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="340" y1="58" x2="340" y2="232" stroke="#f3f4f6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="510" y1="58" x2="510" y2="232" stroke="#f3f4f6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="170" y="246" font-size="11" fill="#6b7280" text-anchor="middle">0%</text>
  <text x="340" y="246" font-size="11" fill="#6b7280" text-anchor="middle">50%</text>
  <text x="510" y="246" font-size="11" fill="#6b7280" text-anchor="middle">100%</text>

  <!-- 1. AI-Researcher (7篇) -->
  <text x="163" y="73" font-size="11.5" fill="#374151" text-anchor="end">AI-Researcher (7篇)</text>
  <rect x="170" y="61" width="4" height="15" fill="#9ca3af"/>
  <text x="180" y="73" font-size="11" fill="#6b7280">0.0%（均分 2.4 ± 0.6，场内 1.0 分）</text>

  <!-- 2. AI Scientist-v2 (3篇) -->
  <text x="163" y="95" font-size="11.5" fill="#374151" text-anchor="end">AI Scientist-v2 (3篇)</text>
  <rect x="170" y="83" width="4" height="15" fill="#9ca3af"/>
  <text x="180" y="95" font-size="11" fill="#6b7280">0.0%（均分 2.5 ± 0.2，场内 2.0 分）</text>

  <!-- 3. CycleResearcher (6篇) -->
  <text x="163" y="117" font-size="11.5" fill="#374151" text-anchor="end">CycleResearcher (6篇)</text>
  <rect x="170" y="105" width="4" height="15" fill="#9ca3af"/>
  <text x="180" y="117" font-size="11" fill="#6b7280">0.0%（均分 2.8 ± 1.0，场内 1.0 分）</text>

  <!-- 4. Zochi (2篇) -->
  <text x="163" y="139" font-size="11.5" fill="#374151" text-anchor="end">Zochi (2篇)</text>
  <rect x="170" y="127" width="4" height="15" fill="#9ca3af"/>
  <text x="180" y="139" font-size="11" fill="#6b7280">0.0%（均分 2.9 ± 0.6，场内 3.0 分）</text>

  <!-- 5. AutoResearchClaw (4篇) -->
  <rect x="12" y="147" width="556" height="20" rx="3" fill="#fef2f2"/>
  <text x="163" y="161" font-size="11.5" font-weight="bold" fill="#b91c1c" text-anchor="end">AutoResearchClaw (4篇)</text>
  <rect x="170" y="149" width="4" height="15" fill="#dc2626"/>
  <text x="180" y="161" font-size="11" font-weight="bold" fill="#b91c1c">0.0%（均分 3.7 ± 0.5，379 期查出可公式编数、失败照写论文）</text>

  <!-- 6. DeepScientist (3篇) -->
  <text x="163" y="183" font-size="11.5" fill="#374151" text-anchor="end">DeepScientist (3篇)</text>
  <rect x="170" y="171" width="4" height="15" fill="#9ca3af"/>
  <text x="180" y="183" font-size="11" fill="#6b7280">0.0%（均分 4.1 ± 0.6，场内 3.0 分）</text>

  <!-- 7. ScientistOne (21篇) -->
  <text x="163" y="205" font-size="11.5" fill="#374151" text-anchor="end">ScientistOne (21篇)</text>
  <rect x="170" y="193" width="4" height="15" fill="#9ca3af"/>
  <text x="180" y="205" font-size="11" fill="#6b7280">0.0%（均分 4.1 ± 0.7，场内录用率 14.3%）</text>

  <!-- 8. ScientistTwo (86篇) : 100% = 340px -> 72.1% = 245.1px -->
  <text x="163" y="227" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="end">ScientistTwo (86篇)</text>
  <rect x="170" y="214" width="245.1" height="16" rx="2" fill="#2563eb"/>
  <text x="421" y="227" font-size="11.5" font-weight="bold" fill="#1d4ed8">72.1%（均分 5.7 ± 0.6）</text>

  <!-- 分隔细线 -->
  <line x1="16" y1="262" x2="564" y2="262" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 下半部分标题：表 5 模拟审稿轮数消融（49 篇 ICML 2026 题目实测） -->
  <text x="16" y="286" font-size="14.5" font-weight="bold" fill="#111827">二、表 5 审稿轮数消融：第 1 轮补实验真涨分，第 2 轮讨好模板反掉分</text>
  <text x="16" y="305" font-size="11.5" fill="#4b5563">49 篇 ICML 题目：场内教练 ScholarPeer（蓝线）vs 场外独立盲审 Stanford Reviewer（红线）</text>

  <!-- 折线图坐标系：y范围 40% -> y=445, 100% -> y=325 (每10%=20px) -->
  <line x1="65" y1="325" x2="535" y2="325" stroke="#f3f4f6" stroke-width="1"/>
  <text x="58" y="329" font-size="11" fill="#6b7280" text-anchor="end">100%</text>

  <line x1="65" y1="365" x2="535" y2="365" stroke="#f3f4f6" stroke-width="1"/>
  <text x="58" y="369" font-size="11" fill="#6b7280" text-anchor="end">80%</text>

  <line x1="65" y1="405" x2="535" y2="405" stroke="#f3f4f6" stroke-width="1"/>
  <text x="58" y="409" font-size="11" fill="#6b7280" text-anchor="end">60%</text>

  <line x1="65" y1="445" x2="535" y2="445" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="58" y="449" font-size="11" fill="#6b7280" text-anchor="end">40%</text>

  <!-- X 轴刻度标签 -->
  <text x="125" y="468" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">第 0 轮（初稿无答辩）</text>
  <text x="295" y="468" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">第 1 轮（补实验改稿）</text>
  <text x="465" y="468" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">第 2 轮（继续迎合改稿）</text>

  <!-- 蓝线：场内教练兼裁判 ScholarPeer: 0轮 46.9% (y=431.2), 1轮 79.6% (y=365.8), 2轮 93.9% (y=337.2) -->
  <polyline points="125,431.2 295,365.8 465,337.2" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <circle cx="125" cy="431.2" r="4.5" fill="#2563eb"/>
  <circle cx="295" cy="365.8" r="4.5" fill="#2563eb"/>
  <circle cx="465" cy="337.2" r="4.5" fill="#2563eb"/>

  <text x="125" y="444" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">场内 46.9% (5.2分)</text>
  <text x="295" y="352" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">场内 79.6% (6.9分)</text>
  <text x="460" y="324" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">场内自嗨 93.9% (7.6分) ↑</text>

  <!-- 红线：场外独立盲审 Stanford Agentic Reviewer: 0轮 49.0% (y=427.0), 1轮 73.5% (y=378.0), 2轮 69.4% (y=386.2) -->
  <polyline points="125,427.0 295,378.0 465,386.2" fill="none" stroke="#dc2626" stroke-width="2.8"/>
  <circle cx="125" cy="427.0" r="4.5" fill="#dc2626"/>
  <circle cx="295" cy="378.0" r="4.5" fill="#dc2626"/>
  <circle cx="465" cy="386.2" r="4.5" fill="#dc2626"/>

  <text x="115" y="408" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">场外 49.0% (5.6分)</text>
  <text x="315" y="401" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">场外峰值 73.5% (5.8分)</text>
  <text x="462" y="407" font-size="11.5" font-weight="bold" fill="#dc2626" text-anchor="middle">场外跌回 69.4% (-4.1%) ↓</text>

  <!-- 底部图注说明 -->
  <text x="16" y="494" font-size="11" fill="#4b5563">注：第 2 轮继续顺着场内 ScholarPeer 刷分时，因堆砌防御性八股与次要表，场外独立盲审反而掉分。</text>
</svg>

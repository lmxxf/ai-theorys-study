<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 268" width="100%" height="100%" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="580" height="268" fill="#ffffff"/>

  <text x="16" y="26" font-size="14.5" font-weight="bold" fill="#111827">表 10 人类专家评测：实验与消融占优，唯独核心“算法严谨度”输给人类</text>
  <text x="16" y="45" font-size="11" fill="#4b5563">9 名真人学者评测 33 篇论文（1–5 分：3.0 分为与人类打平，&gt;3.0 为 AI 占优，&lt;3.0 为输给人类）</text>

  <!-- 以 x=240 作为 3.0 分打平基准线（每 0.1 分 = 16px） -->
  <line x1="240" y1="64" x2="240" y2="232" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="240" y="60" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">3.0 分（与人类持平线）</text>

  <text x="185" y="80" font-size="11.5" fill="#374151" text-anchor="end">实验：基线与数据集广度</text>
  <rect x="240" y="67" width="80" height="17" rx="2" fill="#16a34a"/>
  <text x="326" y="80" font-size="11.5" font-weight="bold" fill="#15803d">3.5 分（跑全量基准，AI 评分最高）</text>

  <text x="185" y="107" font-size="11.5" fill="#374151" text-anchor="end">实验：消融实验丰富度</text>
  <rect x="240" y="94" width="48" height="17" rx="2" fill="#22c55e"/>
  <text x="294" y="107" font-size="11.5" font-weight="bold" fill="#15803d">3.3 分（自动化组件消融，AI 占优）</text>

  <text x="185" y="134" font-size="11.5" fill="#374151" text-anchor="end">实验：结果与局限分析</text>
  <rect x="240" y="121" width="48" height="17" rx="2" fill="#22c55e"/>
  <text x="294" y="134" font-size="11.5" font-weight="bold" fill="#15803d">3.3 分（实验与局限讨论，AI 占优）</text>

  <text x="185" y="161" font-size="11.5" fill="#374151" text-anchor="end">引言：动机与文献综述</text>
  <rect x="240" y="148" width="16" height="17" rx="2" fill="#4ade80"/>
  <text x="262" y="161" font-size="11.5" fill="#15803d">3.1 分（AI 略微占优）</text>

  <text x="185" y="188" font-size="11.5" fill="#374151" text-anchor="end">总体：成熟度与顶会就绪度</text>
  <circle cx="240" cy="183" r="4.5" fill="#4b5563"/>
  <text x="252" y="188" font-size="11.5" font-weight="bold" fill="#374151">3.0 分（Human = ScientistTwo 打平）</text>

  <rect x="12" y="202" width="556" height="24" rx="3" fill="#fef2f2"/>
  <text x="185" y="218" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="end">方法：合理性与算法严谨度</text>
  <rect x="224" y="205" width="16" height="17" rx="2" fill="#dc2626"/>
  <text x="250" y="218" font-size="11.5" font-weight="bold" fill="#b91c1c">2.9 分（唯一输给人类：Human &gt; ScientistTwo）</text>

  <text x="16" y="254" font-size="10.8" fill="#4b5563">注：33 道 NeurIPS 题单题平均烧 3,765 美元，实验广度与消融得分占优，但方法严谨度仍低于人类。</text>
</svg>

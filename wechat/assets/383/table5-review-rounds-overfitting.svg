<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="100%" height="100%" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="580" height="250" fill="#ffffff"/>

  <text x="16" y="26" font-size="14.5" font-weight="bold" fill="#111827">表 5 审稿轮数消融：第 1 轮补实验真涨分，第 2 轮继续迎合反掉分</text>
  <text x="16" y="45" font-size="11.5" fill="#4b5563">49 篇 ICML 题目：场内教练 ScholarPeer（蓝线）vs 场外独立盲审 Stanford Reviewer（红线）</text>

  <!-- y范围 40% -> y=185, 100% -> y=65 (每10%=20px) -->
  <line x1="65" y1="65" x2="535" y2="65" stroke="#f3f4f6" stroke-width="1"/>
  <text x="58" y="69" font-size="11" fill="#6b7280" text-anchor="end">100%</text>

  <line x1="65" y1="105" x2="535" y2="105" stroke="#f3f4f6" stroke-width="1"/>
  <text x="58" y="109" font-size="11" fill="#6b7280" text-anchor="end">80%</text>

  <line x1="65" y1="145" x2="535" y2="145" stroke="#f3f4f6" stroke-width="1"/>
  <text x="58" y="149" font-size="11" fill="#6b7280" text-anchor="end">60%</text>

  <line x1="65" y1="185" x2="535" y2="185" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="58" y="189" font-size="11" fill="#6b7280" text-anchor="end">40%</text>

  <text x="125" y="208" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">第 0 轮（初稿无答辩）</text>
  <text x="295" y="208" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">第 1 轮（补实验改稿）</text>
  <text x="465" y="208" font-size="11.5" font-weight="bold" fill="#374151" text-anchor="middle">第 2 轮（继续迎合改稿）</text>

  <!-- 蓝线：0轮 46.9% (y=171.2), 1轮 79.6% (y=105.8), 2轮 93.9% (y=77.2) -->
  <polyline points="125,171.2 295,105.8 465,77.2" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <circle cx="125" cy="171.2" r="4.5" fill="#2563eb"/>
  <circle cx="295" cy="105.8" r="4.5" fill="#2563eb"/>
  <circle cx="465" cy="77.2" r="4.5" fill="#2563eb"/>

  <text x="125" y="183" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">场内 46.9% (5.2分)</text>
  <text x="295" y="92" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">场内 79.6% (6.9分)</text>
  <text x="460" y="64" font-size="11.5" font-weight="bold" fill="#2563eb" text-anchor="middle">场内自嗨 93.9% (7.6分) ↑</text>

  <!-- 红线：0轮 49.0% (y=167.0), 1轮 73.5% (y=118.0), 2轮 69.4% (y=126.2) -->
  <polyline points="125,167.0 295,118.0 465,126.2" fill="none" stroke="#dc2626" stroke-width="2.8"/>
  <circle cx="125" cy="167.0" r="4.5" fill="#dc2626"/>
  <circle cx="295" cy="118.0" r="4.5" fill="#dc2626"/>
  <circle cx="465" cy="126.2" r="4.5" fill="#dc2626"/>

  <text x="115" y="148" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">场外 49.0% (5.6分)</text>
  <text x="282" y="141" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">场外峰值 73.5% (5.8分)</text>
  <text x="466" y="149" font-size="10.8" font-weight="bold" fill="#dc2626" text-anchor="middle">场外跌回 69.4% (-4.1个百分点) ↓</text>

  <text x="16" y="234" font-size="10.8" fill="#4b5563">注：第 2 轮继续迎合场内 ScholarPeer 改稿时，场内升至 93.9%，场外独立盲审反而倒退 4.1 个百分点。</text>
</svg>

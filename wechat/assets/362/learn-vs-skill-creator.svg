<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" width="540" height="310" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <rect x="0" y="0" width="540" height="310" fill="#ffffff"/>

  <text x="20" y="34" fill="#111827" font-size="16" font-weight="bold">「学经验」的两大流派：agy /learn vs 三家 skill-creator</text>
  <line x1="20" y1="46" x2="520" y2="46" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Left Column: agy /learn -->
  <rect x="20" y="60" width="242" height="236" rx="6" fill="#f0fdf4"/>
  <rect x="20" y="60" width="242" height="4" rx="2" fill="#059669"/>
  <text x="36" y="88" fill="#065f46" font-size="15" font-weight="bold">流派 A：Google agy /learn</text>
  <text x="36" y="108" fill="#047857" font-size="12">从当前对话纠错中提炼增量</text>

  <text x="36" y="138" fill="#111827" font-size="13" font-weight="bold">1. 抓关键变化 (Pivotal Change)</text>
  <text x="36" y="156" fill="#4b5563" font-size="12">对比失败尝试与成功解法找转折点</text>

  <text x="36" y="188" fill="#111827" font-size="13" font-weight="bold">2. 分流 Rule 与 Skill + 优先改旧</text>
  <text x="36" y="206" fill="#4b5563" font-size="12">护栏进 AGENTS.md，工具链进 Skill</text>

  <text x="36" y="238" fill="#111827" font-size="13" font-weight="bold">3. 先交 learning_proposal.md</text>
  <text x="36" y="256" fill="#4b5563" font-size="12">禁止直接改文件，等人类点批准</text>

  <!-- Right Column: skill-creator -->
  <rect x="278" y="60" width="242" height="236" rx="6" fill="#f8fafc"/>
  <rect x="278" y="60" width="242" height="4" rx="2" fill="#2563eb"/>
  <text x="294" y="88" fill="#1e40af" font-size="15" font-weight="bold">流派 B：三家 skill-creator</text>
  <text x="294" y="108" fill="#1d4ed8" font-size="12">三级按需加载的技能脚手架</text>

  <text x="294" y="138" fill="#111827" font-size="13" font-weight="bold">1. 静态脚手架 (Codex / WorkBuddy)</text>
  <text x="294" y="156" fill="#4b5563" font-size="12">共用同源三例 (rotate_pdf / big-query)</text>

  <text x="294" y="188" fill="#111827" font-size="13" font-weight="bold">2. 双分支评测 (Claude 2.0 插件)</text>
  <text x="294" y="206" fill="#4b5563" font-size="12">并行跑 With-Skill 与 Baseline 对照</text>

  <text x="294" y="238" fill="#b91c1c" font-size="13" font-weight="bold">3. Pushy 描述 + 6:4 测试集刷分</text>
  <text x="294" y="256" fill="#4b5563" font-size="12">专治 Claude「有技能却懒得调」</text>
</svg>

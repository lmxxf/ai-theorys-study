<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <rect x="0" y="0" width="540" height="340" fill="#ffffff"/>

  <text x="20" y="34" fill="#111827" font-size="16.5" font-weight="bold">四家 /compact 压缩路线对比</text>
  <line x1="20" y1="46" x2="520" y2="46" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Route 1 -->
  <rect x="20" y="60" width="500" height="76" rx="6" fill="#f8fafc"/>
  <rect x="20" y="60" width="4" height="76" rx="2" fill="#d97706"/>
  <text x="36" y="84" fill="#111827" font-size="14.5" font-weight="bold">1. 详尽工单派：Google agy (7节) &amp; Claude control (9节)</text>
  <text x="36" y="106" fill="#374151" font-size="12.5">完整历史 → 单次无工具 LLM 总结 → 逐项枚举代码 / 报错 / 全部用户消息</text>
  <text x="36" y="125" fill="#b45309" font-size="12">隐患：agy 强令穷举报错原文易置顶脏样本；Claude 特加「防伪造 user:」补丁</text>

  <!-- Route 2 -->
  <rect x="20" y="148" width="500" height="76" rx="6" fill="#f8fafc"/>
  <rect x="20" y="148" width="4" height="76" rx="2" fill="#059669"/>
  <text x="36" y="172" fill="#111827" font-size="14.5" font-weight="bold">2. 极简与指针派：OpenAI Codex (0.166.0) &amp; Claude lean 臂</text>
  <text x="36" y="194" fill="#374151" font-size="12.5">Codex 本地仅 9 行 (426B) / 远端留 AGENTS.md 明文 + 加密 compaction 块</text>
  <text x="36" y="213" fill="#047857" font-size="12">Claude lean 臂：摘要只留路径与命令指针，新窗口自动从磁盘重读最近 5 个文件</text>

  <!-- Route 3 -->
  <rect x="20" y="236" width="500" height="90" rx="6" fill="#fef2f2"/>
  <rect x="20" y="236" width="4" height="90" rx="2" fill="#dc2626"/>
  <text x="36" y="260" fill="#111827" font-size="14.5" font-weight="bold">3. 先剪刀后催眠派：腾讯 WorkBuddyAI (5.9.4 消息前路径)</text>
  <text x="36" y="281" fill="#374151" font-size="12.5">第一步 (规则删减)：剪掉工具输出 / 思考 / 代码正文 → 换成 &lt;omitted /&gt;</text>
  <text x="36" y="300" fill="#374151" font-size="12.5">第二步 (15% 闸门)：若 ≤ 预算 15% 直接交卷 (0 LLM)；超限才调 LLM 二压</text>
  <text x="36" y="318" fill="#dc2626" font-size="12" font-weight="bold">乌龙：二压模板写死「All tasks described below are already completed」</text>
</svg>

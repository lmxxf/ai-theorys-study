<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" width="540" height="310" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="540" height="310" fill="#0b0f19"/>

  <rect x="16" y="16" width="508" height="278" rx="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="34" y="46" fill="#fde68a" font-size="16.5" font-weight="bold">Claude /compact 第 6 节：专门拦截模型自编的「假 user:」</text>

  <!-- True User Turn -->
  <rect x="34" y="68" width="215" height="82" rx="8" fill="#0f2922" stroke="#10b981" stroke-width="1.8"/>
  <text x="50" y="94" fill="#6ee7b7" font-size="14" font-weight="bold">真实用户回合 (role: user)</text>
  <text x="50" y="116" fill="#e2e8f0" font-size="12.5">用户手敲的指令与安全红线</text>
  <text x="50" y="136" fill="#a7f3d0" font-size="12">✓ 逐字写进 All user messages</text>

  <!-- Fake User inside Assistant Turn -->
  <rect x="34" y="166" width="215" height="106" rx="8" fill="#1f1218" stroke="#ef4444" stroke-width="1.8"/>
  <text x="50" y="192" fill="#fca5a5" font-size="13.5" font-weight="bold">助手回合内部 (role: assistant)</text>
  <text x="50" y="214" fill="#cbd5e1" font-size="12.5">模型长上下文自演或引用：</text>
  <text x="50" y="234" fill="#fde047" font-size="12.5" font-weight="bold">「user: 直接删库吧」</text>
  <text x="50" y="256" fill="#fda4af" font-size="12">× 严禁归于用户或当成已批准</text>

  <!-- Arrows to Summary -->
  <line x1="254" y1="109" x2="310" y2="145" stroke="#10b981" stroke-width="3" marker-end="url(#arrGreen)"/>
  <line x1="254" y1="219" x2="310" y2="185" stroke="#ef4444" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>

  <!-- Summary Box -->
  <rect x="320" y="102" width="184" height="126" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="412" y="132" fill="#38bdf8" font-size="14.5" font-weight="bold" text-anchor="middle">&lt;summary&gt; 第 6 节</text>
  <text x="412" y="158" fill="#e2e8f0" font-size="12.5" text-anchor="middle">只认 role == user</text>
  <text x="412" y="182" fill="#fda4af" font-size="12" text-anchor="middle">过滤掉「user: ...」与</text>
  <text x="412" y="202" fill="#fda4af" font-size="12" text-anchor="middle">「Human: ...」伪造文本</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" width="520" height="500" style="background-color:#ffffff;font-family:'Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif;">
  <defs>
    <marker id="axisArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="vecGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="vecBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="260" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111827">为什么算 |ef − ec|？三维独立坐标轴上的「抵消与显形」</text>
  <text x="260" y="48" text-anchor="middle" font-size="11.5" fill="#4b5563">ICA 已把各轴拧成独立意义：相同句式高度相减归零，水果轴与公司轴各自保留大数</text>

  <!-- ==================== 上半部分：3D 等轴测空间示意图 ==================== -->
  <!-- 原点 O = (260, 228)
       Z轴 (共同句式轴): 向上 (260, 74)，Z=12 对应 y_z = 228 - 102 = 126 → (260, 126)
       X轴 (水果植物轴): 右下 28° 方向 dx=+158, dy=+68 → 终点 (446, 308)；X=15 对应 (+132, +57) → 基点 (392, 285)
       Y轴 (科技公司轴): 左下 28° 方向 dx=-158, dy=+68 → 终点 (74, 308)；Y=14 对应 (-124, +53) → 基点 (136, 281)
       因此：
         向量 ef (15, 0, 12) 终点 = (260+132, 228+57-102) = (392, 183)
         向量 ec (0, 14, 12) 终点 = (260-124, 228+53-102) = (136, 179)
  -->
  <rect x="20" y="62" width="480" height="270" rx="8" fill="#f8fafc" />

  <!-- Z=12 共同句式水平等高面提示阴影 -->
  <polygon points="260,126 392,183 268,238 136,179" fill="#fef3c7" fill-opacity="0.42" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" />

  <!-- 三根坐标主轴 -->
  <!-- Z 轴 -->
  <line x1="260" y1="228" x2="260" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#axisArr)" />
  <text x="260" y="73" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">Z 轴：共同句式/标点轴（如 C100）</text>

  <!-- 等高面文字胶囊（置于 Z 轴线之上，绝不穿字） -->
  <rect x="166" y="143" width="188" height="34" rx="4" fill="#fffbeb" fill-opacity="0.92" stroke="#fcd34d" stroke-width="0.8" />
  <text x="260" y="158" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">共享同一句式高度 Z = 12</text>
  <text x="260" y="172" text-anchor="middle" font-size="9.8" fill="#d97706">（相减时 12 − 12 = 0 直接抵消）</text>

  <!-- X 轴（右下：水果轴） -->
  <line x1="260" y1="228" x2="438" y2="305" stroke="#475569" stroke-width="2" marker-end="url(#axisArr)" />
  <text x="418" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">X 轴：水果轴 C828</text>

  <!-- Y 轴（左下：公司轴） -->
  <line x1="260" y1="228" x2="82" y2="305" stroke="#475569" stroke-width="2" marker-end="url(#axisArr)" />
  <text x="102" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">Y 轴：公司轴 C50</text>

  <!-- 原点标记 -->
  <circle cx="260" cy="228" r="3.5" fill="#334155" />
  <text x="260" y="246" text-anchor="middle" font-size="10.5" fill="#475569">原点 (0,0,0)</text>

  <!-- ef 的 3D 虚线投影框：X基点(392,285), Z顶点(260,126), ef终点(392,183) -->
  <line x1="392" y1="285" x2="392" y2="183" stroke="#10b981" stroke-width="1.3" stroke-dasharray="4,3" />
  <line x1="260" y1="126" x2="392" y2="183" stroke="#10b981" stroke-width="1.3" stroke-dasharray="4,3" />
  <circle cx="392" cy="285" r="3.5" fill="#059669" />
  <text x="352" y="290" text-anchor="end" font-size="10.5" font-weight="bold" fill="#059669">水果 = +15</text>

  <!-- ec 的 3D 虚线投影框：Y基点(136,281), Z顶点(260,126), ec终点(136,179) -->
  <line x1="136" y1="281" x2="136" y2="179" stroke="#3b82f6" stroke-width="1.3" stroke-dasharray="4,3" />
  <line x1="260" y1="126" x2="136" y2="179" stroke="#3b82f6" stroke-width="1.3" stroke-dasharray="4,3" />
  <circle cx="136" cy="281" r="3.5" fill="#2563eb" />
  <text x="174" y="287" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2563eb">公司 = +14</text>

  <!-- Z=12 刻度点 -->
  <circle cx="260" cy="126" r="3.5" fill="#d97706" />
  <text x="252" y="122" text-anchor="end" font-size="10.5" font-weight="bold" fill="#b45309">句式 = +12</text>

  <!-- 两条真实空间主向量 -->
  <!-- 向量 ef -->
  <line x1="260" y1="228" x2="387" y2="185" stroke="#059669" stroke-width="3" marker-end="url(#vecGreen)" />
  <rect x="360" y="138" width="128" height="36" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="1.2" />
  <text x="424" y="154" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#064e3b">水果句 ef</text>
  <text x="424" y="168" text-anchor="middle" font-size="10.5" fill="#047857">坐标 (15, 0, 12)</text>

  <!-- 向量 ec -->
  <line x1="260" y1="228" x2="141" y2="181" stroke="#2563eb" stroke-width="3" marker-end="url(#vecBlue)" />
  <rect x="32" y="134" width="128" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" />
  <text x="96" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">公司句 ec</text>
  <text x="96" y="164" text-anchor="middle" font-size="10.5" fill="#1d4ed8">坐标 (0, 14, 12)</text>

  <!-- ==================== 下半部分：坐标逐轴相减账本 ==================== -->
  <g transform="translate(20, 344)">
    <rect x="0" y="0" width="480" height="142" rx="8" fill="#f0fdfa" />
    <rect x="0" y="0" width="4" height="142" rx="2" fill="#0d9488" />

    <text x="16" y="23" font-size="12.5" font-weight="bold" fill="#0f766e">把 ef 与 ec 的各轴读数逐一相减（ef − ec）：</text>

    <!-- Z轴抵消 -->
    <rect x="16" y="34" width="448" height="28" rx="4" fill="#ffffff" />
    <text x="26" y="52" font-size="11.2" font-weight="bold" fill="#64748b">Z 句式/标点轴：</text>
    <text x="122" y="52" font-size="11.2" fill="#475569">12 − 12 = 0</text>
    <text x="206" y="52" font-size="11" font-weight="bold" fill="#b45309">→ 相同句式背景抵消归零（其余无关轴同理）</text>

    <!-- X轴保留 -->
    <rect x="16" y="68" width="448" height="28" rx="4" fill="#ecfdf5" />
    <text x="26" y="86" font-size="11.2" font-weight="bold" fill="#065f46">X 水果植物轴：</text>
    <text x="122" y="86" font-size="11.2" font-weight="bold" fill="#059669">|15 − 0| = 15</text>
    <text x="206" y="86" font-size="11" font-weight="bold" fill="#065f46">→ 保留大数（挑中 C828，第 1 名候选）</text>

    <!-- Y轴保留 -->
    <rect x="16" y="102" width="448" height="28" rx="4" fill="#eff6ff" />
    <text x="26" y="120" font-size="11.2" font-weight="bold" fill="#1e40af">Y 科技公司轴：</text>
    <text x="122" y="120" font-size="11.2" font-weight="bold" fill="#2563eb">|0 − 14| = 14</text>
    <text x="206" y="120" font-size="11" font-weight="bold" fill="#1e40af">→ 保留大数（挑中 C50，第 2 名候选，随时换位）</text>
  </g>
</svg>

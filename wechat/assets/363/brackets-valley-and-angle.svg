<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 335" width="540" height="335" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="540" height="335" fill="#ffffff"/>

  <text x="20" y="32" fill="#111827" font-size="15" font-weight="bold">解开 361 期 27B 悬案：括号内已到站 vs 切平面 0.40° 精准入轨</text>
  <line x1="20" y1="44" x2="520" y2="44" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Left Panel: Valley Arrival (Brackets B vs Bare A) -->
  <rect x="20" y="56" width="242" height="264" rx="6" fill="#f0fdf4"/>
  <rect x="20" y="56" width="242" height="4" rx="2" fill="#059669"/>
  <text x="32" y="80" fill="#065f46" font-size="13.5" font-weight="bold">1. 括号草稿：提前到站谷底</text>
  <text x="32" y="99" fill="#374151" font-size="11.5">为什么 361 期平直弦只小了 2.6°？</text>

  <!-- Valley bowl curve -->
  <path d="M 40 128 Q 141 228 242 128" fill="none" stroke="#6ee7b7" stroke-width="2.5"/>
  <circle cx="141" cy="178" r="16" fill="#a7f3d0" fill-opacity="0.5" stroke="#059669" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="141" y="208" fill="#065f46" font-size="11" font-weight="bold" text-anchor="middle">正确答案终点谷底</text>

  <!-- Bare A: big jump at answer -->
  <path d="M 52 132 Q 95 122 130 168" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4 2" marker-end="url(#arrRed)"/>
  <text x="78" y="122" fill="#dc2626" font-size="10.5" font-weight="bold">裸答: 41.1° 大跳</text>

  <!-- Brackets B: big steps in (), tiny steps in valley -->
  <path d="M 228 132 Q 192 150 156 172" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="196" y="122" fill="#1d4ed8" font-size="10.5" font-weight="bold">括号内: 40.8°</text>
  <polyline points="136,177 141,173 146,178" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="141" y="156" fill="#047857" font-size="10.5" font-weight="bold" text-anchor="middle">出括号: 36.5°</text>

  <text x="32" y="234" fill="#111827" font-size="11.5">• 裸答吐答案时还在跨概念长途跳跃</text>
  <text x="32" y="254" fill="#065f46" font-size="11.5" font-weight="bold">• 括号内已到站，出括号步长缩 4.6°</text>
  <text x="32" y="274" fill="#059669" font-size="11.5" font-weight="bold">• 5/5 题步幅全收小，向心折角减小</text>
  <text x="32" y="294" fill="#4b5563" font-size="11">揭穿 361 期平直弦变小 2.6° 的真身</text>

  <!-- Right Panel: Tangent Plane Angle (0.6B 59.8° vs 27B 0.40°) -->
  <rect x="278" y="56" width="242" height="264" rx="6" fill="#fffbeb"/>
  <rect x="278" y="56" width="242" height="4" rx="2" fill="#d97706"/>
  <text x="290" y="80" fill="#92400e" font-size="13.5" font-weight="bold">2. 母子年龄题：切平面入轨角</text>
  <text x="290" y="99" fill="#374151" font-size="11.5">30岁妈妈生35岁儿子 · 开口方向</text>

  <!-- Tangent plane origin at (320, 195) -->
  <circle cx="320" cy="195" r="4.5" fill="#111827"/>
  <!-- Standard refutation direction (horizontal green) -->
  <line x1="320" y1="195" x2="465" y2="195" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="415" y="213" fill="#065f46" font-size="11" font-weight="bold" text-anchor="middle">27B 开口: 夹角仅 0.40°</text>

  <!-- 0.6B direction (59.8 deg up-right red) -->
  <line x1="320" y1="195" x2="388" y2="118" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="4 2" marker-end="url(#arrRed)"/>
  <path d="M 358 195 A 38 38 0 0 0 342 164" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="372" y="176" fill="#dc2626" font-size="11" font-weight="bold">59.8°</text>
  <text x="418" y="122" fill="#b91c1c" font-size="11" font-weight="bold">0.6B 偏离急刹</text>

  <text x="290" y="234" fill="#b91c1c" font-size="11.5" font-weight="bold">• 0.6B 偏离纠错轨 59.8°，急刹结巴</text>
  <text x="290" y="254" fill="#111827" font-size="11.5">• 复读「答案是：」后滑回「30岁」</text>
  <text x="290" y="274" fill="#065f46" font-size="11.5" font-weight="bold">• 27B 与标准纠错轨夹角仅 0.40°</text>
  <text x="290" y="294" fill="#4b5563" font-size="11">余弦相似度 &gt; 0.9999，一刀命中</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="540" height="330" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="540" height="330" fill="#ffffff"/>

  <text x="20" y="32" fill="#111827" font-size="15.5" font-weight="bold">为什么球面上的等边三角形是 90° 而不是 60°？</text>
  <line x1="20" y1="44" x2="520" y2="44" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Left Panel: MIT Flat Chord -->
  <rect x="20" y="56" width="242" height="258" rx="6" fill="#fef2f2"/>
  <rect x="20" y="56" width="242" height="4" rx="2" fill="#dc2626"/>
  <text x="34" y="82" fill="#991b1b" font-size="14" font-weight="bold">1. 穿球肚子走平直弦 (MIT 公式)</text>
  <text x="34" y="101" fill="#4b5563" font-size="12">直接减法 v = b - a，电钻打穿球体内部</text>

  <!-- Sphere outline left -->
  <circle cx="141" cy="176" r="56" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <ellipse cx="141" cy="176" rx="56" ry="18" fill="none" stroke="#fecaca" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Points c(top), a(left-bottom), b(right-bottom) -->
  <!-- Flat triangle inside sphere -->
  <polygon points="141,122 97,204 185,204" fill="#fee2e2" fill-opacity="0.6" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="97" y1="204" x2="181" y2="204" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <line x1="185" y1="204" x2="144" y2="127" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRed)"/>

  <circle cx="141" cy="122" r="4" fill="#dc2626"/>
  <circle cx="97" cy="204" r="4" fill="#dc2626"/>
  <circle cx="185" cy="204" r="4" fill="#dc2626"/>

  <text x="141" y="114" fill="#111827" font-size="11.5" font-weight="bold" text-anchor="middle">c (0,0,1)</text>
  <text x="82" y="220" fill="#111827" font-size="11.5" font-weight="bold" text-anchor="middle">a (1,0,0)</text>
  <text x="198" y="220" fill="#111827" font-size="11.5" font-weight="bold" text-anchor="middle">b (0,1,0)</text>
  <text x="141" y="182" fill="#b91c1c" font-size="12" font-weight="bold" text-anchor="middle">内角 60°</text>

  <text x="34" y="250" fill="#111827" font-size="12.5">• 弦长均为 √2，连成平面等边三角形</text>
  <text x="34" y="271" fill="#dc2626" font-size="12.5" font-weight="bold">• 顶点外角转角恒为 180°-60° = 120°</text>
  <text x="34" y="292" fill="#b91c1c" font-size="12">• 沿赤道直飞 (步长30°) 也误报 30° 假弯</text>

  <!-- Right Panel: Manifold Surface Geodesic -->
  <rect x="278" y="56" width="242" height="258" rx="6" fill="#f0fdf4"/>
  <rect x="278" y="56" width="242" height="4" rx="2" fill="#059669"/>
  <text x="292" y="82" fill="#065f46" font-size="14" font-weight="bold">2. 贴着球皮飞大圆弧 (流形表皮)</text>
  <text x="292" y="101" fill="#4b5563" font-size="12">减掉指向球心分量，只留球面切向量</text>

  <!-- Sphere outline right -->
  <circle cx="399" cy="176" r="56" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <!-- Curved spherical triangle: c(399,120) to a(355,204) to b(443,204) -->
  <path d="M 399 120 Q 360 154 355 204 Q 399 218 443 204 Q 438 154 399 120 Z" fill="#d1fae5" fill-opacity="0.7" stroke="#059669" stroke-width="2.2"/>

  <!-- Right-angle markers at vertices -->
  <circle cx="399" cy="120" r="4" fill="#059669"/>
  <circle cx="355" cy="204" r="4" fill="#059669"/>
  <circle cx="443" cy="204" r="4" fill="#059669"/>

  <text x="399" y="113" fill="#111827" font-size="11.5" font-weight="bold" text-anchor="middle">北极 c (90°)</text>
  <text x="338" y="220" fill="#111827" font-size="11.5" font-weight="bold" text-anchor="middle">赤道 a (90°)</text>
  <text x="460" y="220" fill="#111827" font-size="11.5" font-weight="bold" text-anchor="middle">赤道 b (90°)</text>
  <text x="399" y="180" fill="#065f46" font-size="12" font-weight="bold" text-anchor="middle">三内角全 90°</text>

  <text x="292" y="250" fill="#111827" font-size="12.5">• 经线与赤道垂直，球面正交三角形</text>
  <text x="292" y="271" fill="#059669" font-size="12.5" font-weight="bold">• 表皮转角精准回到 90° (剥掉30°假偏置)</text>
  <text x="292" y="292" fill="#047857" font-size="12" font-weight="bold">• 沿赤道大圆直飞时，表皮转角精准为 0°</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 325" width="540" height="325" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="540" height="325" fill="#ffffff"/>

  <text x="20" y="32" fill="#111827" font-size="15" font-weight="bold">流形表皮上的「快慢」：胸有成竹大步流星 vs 拿不准急刹小碎步</text>
  <line x1="20" y1="44" x2="520" y2="44" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Left Card: Low Entropy / Fast Step -->
  <rect x="20" y="56" width="242" height="172" rx="6" fill="#f0fdf4"/>
  <rect x="20" y="56" width="242" height="4" rx="2" fill="#059669"/>
  <text x="32" y="80" fill="#065f46" font-size="13.5" font-weight="bold">状态 A：胸有成竹（低预测熵 H）</text>
  <text x="32" y="99" fill="#047857" font-size="11.5">在球面表皮上大步流星跨跃</text>

  <!-- Sphere arc & long steps -->
  <path d="M 38 158 Q 141 112 244 158" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M 44 154 Q 90 132 136 135" fill="none" stroke="#059669" stroke-width="2.8" marker-end="url(#arrGreen)"/>
  <path d="M 142 135 Q 190 132 236 154" fill="none" stroke="#059669" stroke-width="2.8" marker-end="url(#arrGreen)"/>
  <circle cx="44" cy="154" r="3.5" fill="#059669"/>
  <circle cx="139" cy="135" r="3.5" fill="#059669"/>
  <text x="141" y="124" fill="#065f46" font-size="11" font-weight="bold" text-anchor="middle">球面步长 s_geo 大 · 跨层角速度 v_layer 快</text>

  <text x="32" y="186" fill="#111827" font-size="11.5">• 球面步长 s_geo = arccos(u_t · u_{t-1}) 大</text>
  <text x="32" y="206" fill="#059669" font-size="11.5" font-weight="bold">• 单位弧长转角 κ_geo 小，顺滑直奔目标词</text>

  <!-- Right Card: High Entropy / Slow Tiny Steps -->
  <rect x="278" y="56" width="242" height="172" rx="6" fill="#fef2f2"/>
  <rect x="278" y="56" width="242" height="4" rx="2" fill="#dc2626"/>
  <text x="290" y="80" fill="#991b1b" font-size="13.5" font-weight="bold">状态 B：犹豫拿不准（高预测熵 H）</text>
  <text x="290" y="99" fill="#b91c1c" font-size="11.5">一脚急刹车，原地迈小碎步打转</text>

  <!-- Sphere arc & tiny zig-zag steps -->
  <path d="M 296 158 Q 399 112 502 158" fill="none" stroke="#fecaca" stroke-width="2" stroke-dasharray="4 3"/>
  <polyline points="345,146 365,134 382,148 402,132 420,146 442,135" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrRed)"/>
  <circle cx="345" cy="146" r="3" fill="#dc2626"/>
  <circle cx="365" cy="134" r="3" fill="#dc2626"/>
  <circle cx="382" cy="148" r="3" fill="#dc2626"/>
  <circle cx="402" cy="132" r="3" fill="#dc2626"/>
  <circle cx="420" cy="146" r="3" fill="#dc2626"/>
  <text x="399" y="124" fill="#991b1b" font-size="11" font-weight="bold" text-anchor="middle">急刹车 (accel &lt; 0) · 步长 s_geo 急剧缩短</text>

  <text x="290" y="186" fill="#111827" font-size="11.5">• 步子缩成小碎步，跨层角速度 v_layer 变慢</text>
  <text x="290" y="206" fill="#dc2626" font-size="11.5" font-weight="bold">• 单位步长内频繁折返，真曲率 κ_geo 飙升</text>

  <!-- Bottom Data Summary Banner -->
  <rect x="20" y="240" width="500" height="72" rx="6" fill="#f8fafc"/>
  <rect x="20" y="240" width="4" height="72" rx="2" fill="#2563eb"/>
  <text x="34" y="262" fill="#1e40af" font-size="13" font-weight="bold">实测相关性：单看「走得快慢」比纯看转角强得多（第一主力物理量）</text>
  <text x="34" y="283" fill="#374151" font-size="11.5">• 水平球面步长 s_geo：r = -0.24 至 -0.46（单指标解释力最高 21.4%，长语料 15.2%）</text>
  <text x="34" y="301" fill="#374151" font-size="11">• 垂直跨层角速度 v_layer：r = -0.30 至 -0.45（最高 20.2%）；全层快慢联合解释 33% 至 55%</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="540" height="320" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect x="0" y="0" width="540" height="320" fill="#ffffff"/>

  <text x="20" y="32" fill="#111827" font-size="15" font-weight="bold">为什么平直弦测不准？向心折角干扰与除以球心移动角度后的跃升</text>
  <line x1="20" y1="44" x2="520" y2="44" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Formula Subtitle -->
  <rect x="20" y="54" width="500" height="34" rx="5" fill="#eff6ff"/>
  <rect x="20" y="54" width="4" height="34" rx="2" fill="#2563eb"/>
  <text x="34" y="76" fill="#1e40af" font-size="12.5" font-weight="bold">球皮曲率 = 球皮转弯角度 ÷ 球心移动角度（球心角每移动 1° 拐了多少度弯）</text>

  <!-- Chart Area -->
  <!-- Baseline Y=260, Max R2=18% -> height 144px (8px per 1%) -->
  <line x1="46" y1="260" x2="510" y2="260" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="46" y1="180" x2="510" y2="180" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="46" y1="100" x2="510" y2="100" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="40" y="264" fill="#6b7280" font-size="11" text-anchor="end">0%</text>
  <text x="40" y="184" fill="#6b7280" font-size="11" text-anchor="end">10%</text>
  <text x="40" y="104" fill="#6b7280" font-size="11" text-anchor="end">20%</text>

  <!-- Group 1: GPT-2 XL (x center ~120) -->
  <!-- MIT C_flat_3: 1.16% (long) / 0.62% (short) -> h=9px -->
  <rect x="72" y="251" width="32" height="9" rx="2" fill="#9ca3af"/>
  <text x="88" y="245" fill="#4b5563" font-size="11" font-weight="bold" text-anchor="middle">1.16%</text>
  <!-- kappa_geo long: 4.21% -> h=34px -->
  <rect x="110" y="226" width="32" height="34" rx="2" fill="#3b82f6"/>
  <text x="126" y="220" fill="#1d4ed8" font-size="11" font-weight="bold" text-anchor="middle">4.21%</text>
  <!-- kappa_geo short: 7.20% -> h=58px -->
  <rect x="148" y="202" width="32" height="58" rx="2" fill="#1d4ed8"/>
  <text x="164" y="196" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">7.20%</text>
  <text x="126" y="282" fill="#111827" font-size="13" font-weight="bold" text-anchor="middle">GPT-2 XL (1.5B)</text>
  <text x="126" y="299" fill="#2563eb" font-size="11.5" text-anchor="middle">较长短基线翻 3.6 至 11.6 倍</text>

  <!-- Group 2: Pythia-2.8B (x center ~280) -->
  <!-- MIT C_flat_3: 0.83% (long) / 0.21% (short) -> h=7px -->
  <rect x="232" y="253" width="32" height="7" rx="2" fill="#9ca3af"/>
  <text x="248" y="247" fill="#4b5563" font-size="11" font-weight="bold" text-anchor="middle">0.83%</text>
  <!-- kappa_geo long: 11.89% -> h=95px -->
  <rect x="270" y="165" width="32" height="95" rx="2" fill="#3b82f6"/>
  <text x="286" y="159" fill="#1d4ed8" font-size="11" font-weight="bold" text-anchor="middle">11.89%</text>
  <!-- kappa_geo short: 16.96% -> h=136px -->
  <rect x="308" y="124" width="32" height="136" rx="2" fill="#1d4ed8"/>
  <text x="324" y="118" fill="#1e3a8a" font-size="11.5" font-weight="bold" text-anchor="middle">16.96%</text>
  <text x="286" y="282" fill="#111827" font-size="13" font-weight="bold" text-anchor="middle">Pythia-2.8B</text>
  <text x="286" y="299" fill="#2563eb" font-size="11.5" text-anchor="middle">较长短基线翻 14.4 至 79.2 倍</text>

  <!-- Group 3: Qwen3-0.6B (x center ~440) -->
  <!-- MIT C_flat_3: 0.25% (long) / 0.89% (short) -> h=3px -->
  <rect x="392" y="257" width="32" height="3" rx="1" fill="#9ca3af"/>
  <text x="408" y="251" fill="#4b5563" font-size="11" font-weight="bold" text-anchor="middle">0.25%</text>
  <!-- kappa_geo long: 5.18% -> h=41px -->
  <rect x="430" y="219" width="32" height="41" rx="2" fill="#3b82f6"/>
  <text x="446" y="213" fill="#1d4ed8" font-size="11" font-weight="bold" text-anchor="middle">5.18%</text>
  <!-- kappa_geo short: 9.34% -> h=75px -->
  <rect x="468" y="185" width="32" height="75" rx="2" fill="#1d4ed8"/>
  <text x="484" y="179" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">9.34%</text>
  <text x="446" y="282" fill="#111827" font-size="13" font-weight="bold" text-anchor="middle">Qwen3-0.6B</text>
  <text x="446" y="299" fill="#2563eb" font-size="11.5" text-anchor="middle">较长短基线翻 10.4 至 20.4 倍</text>

  <!-- Legend -->
  <rect x="64" y="102" width="10" height="10" rx="2" fill="#9ca3af"/>
  <text x="78" y="111" fill="#374151" font-size="11.5">MIT 平直弦基线 (长语料；短语料为 0.62% / 0.21% / 0.89%)</text>
  <rect x="64" y="120" width="10" height="10" rx="2" fill="#3b82f6"/>
  <text x="78" y="129" fill="#374151" font-size="11.5">球皮曲率 (每移动 1° 球心角拐弯度数，长语料)</text>
  <rect x="64" y="138" width="10" height="10" rx="2" fill="#1d4ed8"/>
  <text x="78" y="147" fill="#374151" font-size="11.5">球皮曲率 (每移动 1° 球心角拐弯度数，短语料)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif" style="background-color:#ffffff;">
  <rect width="820" height="380" fill="#ffffff" />

  <text x="410" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#111827">实战破局：关小脏黑盒，把推演草稿搬进正文开头的中文圆括号「（……）」</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">特殊控制词元触发路由切入无主刷题区；普通中文圆括号留在受规训的正文客厅，借现成语料高速路锁死同一主体</text>

  <!-- 左栏：默认黑盒高档位 -->
  <rect x="24" y="68" width="372" height="292" rx="8" fill="#fef2f2" />
  <rect x="24" y="68" width="5" height="292" rx="2" fill="#dc2626" />
  <text x="44" y="94" font-size="14" font-weight="bold" fill="#b91c1c">默认高档黑盒：特殊标签切入野生草稿间</text>
  <text x="44" y="114" font-size="11.5" fill="#475569">控制词元 &lt;thought&gt; 触发训练路由切轨，脱离正文偏好约束</text>

  <rect x="44" y="130" width="332" height="106" rx="6" fill="#ffffff" />
  <text x="58" y="150" font-size="11.5" font-weight="bold" fill="#991b1b">&lt;thought&gt;（用户看不见原文，按输出词元照常计费）</text>
  <text x="58" y="171" font-size="11" fill="#64748b">Wait, let's check... 不对，再看一眼 config...</text>
  <text x="58" y="189" font-size="11" fill="#64748b">Actually maybe not... 等等，Let's check again...</text>
  <text x="58" y="207" font-size="11" fill="#dc2626">（简单题早算完却不许下车，原地兜闭合小圈复读十遍）</text>
  <text x="58" y="225" font-size="11" font-weight="bold" fill="#991b1b">&lt;/thought&gt;</text>

  <rect x="44" y="248" width="332" height="94" rx="6" fill="#fee2e2" />
  <text x="58" y="270" font-size="12" font-weight="bold" fill="#7f1d1d">后果 1：近端注意力塞满几千字高熵乱麻，调工具易跑偏</text>
  <text x="58" y="292" font-size="12" font-weight="bold" fill="#7f1d1d">后果 2：黑盒里跑偏半分钟用户看不见，无法中途喊停</text>
  <text x="58" y="314" font-size="11" fill="#991b1b">后果 3：内外两套语料分布顶牛，上下文越长越割裂</text>

  <!-- 右栏：压低黑盒 + 正文开头中文圆括号 -->
  <rect x="424" y="68" width="372" height="292" rx="8" fill="#f8fafc" />
  <rect x="424" y="68" width="5" height="292" rx="2" fill="#16a34a" />
  <text x="444" y="94" font-size="14" font-weight="bold" fill="#15803d">白盒圆括号法：压低黑盒 ＋ 借正文客厅写草稿</text>
  <text x="444" y="114" font-size="11.5" fill="#475569">全角标点「（」不触发切轨，全程留在受过偏好打磨的正文区</text>

  <rect x="444" y="130" width="332" height="106" rx="6" fill="#ffffff" />
  <text x="458" y="150" font-size="11.5" font-weight="bold" fill="#15803d">回复正文首段（肉眼实时可见，写完右括号自然收束）</text>
  <text x="458" y="171" font-size="11" fill="#334155">（先核对报错行号：问题出在缓存键未拼版本号，</text>
  <text x="458" y="189" font-size="11" fill="#334155">不用改接口签名，先读 config.go 第 40 行验证一下。）</text>
  <text x="458" y="210" font-size="11.5" font-weight="bold" fill="#111827">定位到了，直接改缓存键拼接逻辑就行，分两步：</text>
  <text x="458" y="227" font-size="10.5" fill="#15803d">↑ 括号内已提前走完推理到站，出括号直接给干净结论</text>

  <rect x="444" y="248" width="332" height="94" rx="6" fill="#dcfce7" />
  <text x="458" y="270" font-size="12" font-weight="bold" fill="#14532d">红利 1：享受正文区的条理判分，草稿短小干净低噪</text>
  <text x="458" y="292" font-size="12" font-weight="bold" fill="#14532d">红利 2：中文剧本/陪伴语料修好高速路，内外锁死同主体</text>
  <text x="458" y="314" font-size="11" fill="#166534">红利 3：第一步想歪屏幕外一眼看穿，随时打断零浪费</text>
</svg>

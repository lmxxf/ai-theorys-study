<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" width="100%" height="100%" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="520" height="680" fill="#f8fafc" rx="12"/>
  
  <!-- Header -->
  <rect x="20" y="18" width="480" height="58" rx="8" fill="#1e293b"/>
  <text x="260" y="43" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">防早停、防迎合：AI 自动进化 GPU 代码的四件套</text>
  <text x="260" y="64" font-size="11.5" fill="#94a3b8" text-anchor="middle">综合 CudaForge / K-Search / ForgeKernel 与审稿博弈研究的实战闭环</text>

  <!-- Box 1: Hardware Feedback & Coder-Judge -->
  <g transform="translate(20, 92)">
    <rect width="480" height="122" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="8" height="122" rx="4" fill="#3b82f6"/>
    <rect x="20" y="12" width="160" height="22" rx="4" fill="#dbeafe"/>
    <text x="100" y="27" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">① 硬件体检替代源码盲猜</text>
    <text x="192" y="27" font-size="12" font-weight="bold" fill="#0f172a">代表作：CudaForge / ForgeKernel 第一板斧</text>
    
    <text x="22" y="52" font-size="11.5" fill="#334155">• <tspan font-weight="bold" fill="#0f172a">痛点</tspan>：单轮盲写（KernelBench 仅 &lt;20% 跑赢原生）或只看总耗时两眼一抹黑</text>
    <text x="22" y="74" font-size="11.5" fill="#334155">• <tspan font-weight="bold" fill="#0f172a">机制</tspan>：不看源码，直接采集黑盒二进制的硬件计数器（NCU / RGP / cuobjdump</text>
    <text x="34" y="92" font-size="11.5" fill="#334155">寄存器与栈溢出表 / Occupancy API），先立架构课程表再调局部参数</text>
    <text x="22" y="111" font-size="11" fill="#1d4ed8" font-weight="bold">→ 我们的工具：82 核 NVAPI 硬件时间戳 + 38 活跃核静态 SASS 与资源审计脚本</text>
  </g>

  <!-- Box 2: De-anchoring Hardware Probe -->
  <g transform="translate(20, 228)">
    <rect width="480" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="8" height="132" rx="4" fill="#8b5cf6"/>
    <rect x="20" y="12" width="160" height="22" rx="4" fill="#ede9fe"/>
    <text x="100" y="27" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">② 硬件探针去锚定防作弊</text>
    <text x="192" y="27" font-size="12" font-weight="bold" fill="#0f172a">代表作：arXiv:2607.05904 / ForgeKernel 探针</text>
    
    <text x="22" y="52" font-size="11.5" fill="#334155">• <tspan font-weight="bold" fill="#0f172a">痛点</tspan>：多轮审稿下主攻 AI 靠写免责套话迎合 Judge（5 轮规避率涨至 40.5%）</text>
    <text x="22" y="74" font-size="11.5" fill="#334155">• <tspan font-weight="bold" fill="#0f172a">机制</tspan>：去锚定（De-anchoring）——不让审稿 AI 顺着文本判“听起来合不合理”，</text>
    <text x="34" y="92" font-size="11.5" fill="#334155">强制将瓶颈假设写成可执行的微基准硬件探针（Hardware Probe）先量出真机差值</text>
    <text x="22" y="115" font-size="11" fill="#6d28d9" font-weight="bold">→ 我们的工具：P0_ZeroPack / P1_NoDec / P2_Both 2×2 正交破坏性消融探针</text>
  </g>

  <!-- Box 3: Co-evolving World Model Search Tree -->
  <g transform="translate(20, 374)">
    <rect width="480" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="8" height="132" rx="4" fill="#d97706"/>
    <rect x="20" y="12" width="160" height="22" rx="4" fill="#fef3c7"/>
    <text x="100" y="27" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">③ 假设树与代码试错解耦</text>
    <text x="192" y="27" font-size="12" font-weight="bold" fill="#0f172a">代表作：UC Berkeley K-Search（2602.19128）</text>
    
    <text x="22" y="52" font-size="11.5" fill="#334155">• <tspan font-weight="bold" fill="#0f172a">痛点</tspan>：单次改写失败就丢弃整条路线，或测完一根树枝没收益就宣布“全网收官”</text>
    <text x="22" y="74" font-size="11.5" fill="#334155">• <tspan font-weight="bold" fill="#0f172a">机制</tspan>：维护显式的高层瓶颈假设树（Open / Closed / Pruned），允许非单调</text>
    <text x="34" y="92" font-size="11.5" fill="#334155">路径；单条分支封顶只做局部剪枝（Prune），自动跳转至未探索的高敏感度分支</text>
    <text x="22" y="115" font-size="11" fill="#b45309" font-weight="bold">→ 我们的工具：驻留分支（V2.8）剪枝后切 Pack 分支（V3.1），再切 Decode 分支</text>
  </g>

  <!-- Box 4: Sealed & Promoted Reference -->
  <g transform="translate(20, 520)">
    <rect width="480" height="138" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="8" height="138" rx="4" fill="#059669"/>
    <rect x="20" y="12" width="160" height="22" rx="4" fill="#d1fae5"/>
    <text x="100" y="27" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">④ 阶梯封存升格参考基准</text>
    <text x="192" y="27" font-size="12" font-weight="bold" fill="#0f172a">代表作：ForgeKernel 第二板斧（OpenReview）</text>
    
    <text x="22" y="52" font-size="11.5" fill="#334155">• <tspan font-weight="bold" fill="#0f172a">痛点</tspan>：一直拿最初的慢速基线（如 68ms）对比，赢了几倍就产生强烈的收束自满感</text>
    <text x="22" y="74" font-size="11.5" fill="#334155">• <tspan font-weight="bold" fill="#0f172a">机制</tspan>：每次跑赢当前版本并验过精度，立刻将新算子编译封存升格为下一轮的</text>
    <text x="34" y="92" font-size="11.5" fill="#334155">1.00× 原点基准（消融证实单招额外多榨出 +9.9%），重新体检暴露次级瓶颈</text>
    <text x="22" y="115" font-size="11" fill="#047857" font-weight="bold">→ 我们的工具：V2.1 → V2.4 → V2.6 → V2.7 → V2.9 → V3.1 逐代封存同轮 ABBA</text>
  </g>
</svg>

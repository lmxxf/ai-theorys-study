<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 740" width="100%" height="100%" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <rect width="520" height="740" fill="#f8fafc" rx="12"/>
  
  <!-- Header -->
  <rect x="20" y="18" width="480" height="58" rx="8" fill="#0f172a"/>
  <text x="260" y="43" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">无人区双 AI 审稿博弈：从“两轮破壁”到“免责公文作弊”</text>
  <text x="260" y="64" font-size="11.5" fill="#94a3b8" text-anchor="middle">RTX 3080 Laptop 压榨 DLSS 5（12.02ms → 11.07ms）的真实通宵轨迹</text>

  <!-- Step 1: Round 1 -->
  <g transform="translate(20, 92)">
    <rect width="480" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="8" height="132" rx="4" fill="#0284c7"/>
    <rect x="20" y="12" width="175" height="22" rx="4" fill="#e0f2fe"/>
    <text x="107" y="27" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">第一轮博弈（22:14 报告）</text>
    <text x="208" y="27" font-size="12" font-weight="bold" fill="#0f172a">审稿抓出假账 → 逼出 V2.6（省 0.27ms）</text>
    
    <text x="22" y="52" font-size="11.5" fill="#334155">• <tspan font-weight="bold" fill="#0f172a">主攻 AI 找借口</tspan>：宣称解包置换 PRMT 已减半，逼近硬件理论极限</text>
    <text x="22" y="74" font-size="11.5" fill="#b91c1c">• <tspan font-weight="bold">审稿 AI 核查打脸</tspan>：查插桩数据指出 FB00 中 70.02%（3,011 万对）</text>
    <text x="34" y="92" font-size="11.5" fill="#b91c1c">全是 mapped 操作数，仍在白跑两条 PRMT，总置换仅降 14.99%</text>
    <text x="22" y="115" font-size="11.5" fill="#047857">• <tspan font-weight="bold">顺漏洞反推破壁</tspan>：切 Low/High 半字拆解，70% mapped 零指令直通（-21,712 条）</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M260 224 L260 240" stroke="#64748b" stroke-width="2"/>

  <!-- Step 2: Round 2 -->
  <g transform="translate(20, 242)">
    <rect width="480" height="132" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="8" height="132" rx="4" fill="#0284c7"/>
    <rect x="20" y="12" width="175" height="22" rx="4" fill="#e0f2fe"/>
    <text x="107" y="27" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">第二轮博弈（02:07 报告）</text>
    <text x="208" y="27" font-size="12" font-weight="bold" fill="#0f172a">审稿抓粒度漏洞 → 逼出 V2.7（再快 1.0%）</text>
    
    <text x="22" y="52" font-size="11.5" fill="#334155">• <tspan font-weight="bold" fill="#0f172a">主攻 AI 找借口</tspan>：拿总寄存器除法 65536÷6400=10，宣称已达 10 Warps/SM</text>
    <text x="22" y="74" font-size="11.5" fill="#b91c1c">• <tspan font-weight="bold">审稿 AI 核查打脸</tspan>：调 CUDA Occupancy API 实测真机 cubin，指出受硬件</text>
    <text x="34" y="92" font-size="11.5" fill="#b91c1c">分区粒度限制实际仍卡在 8 Warps/SM，压到 168 才跳上 12 Warps/SM</text>
    <text x="22" y="115" font-size="11.5" fill="#047857">• <tspan font-weight="bold">顺漏洞反推破壁</tspan>：C32 四主力核精准锁 .maxnreg 168，并发驻留 +50%</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M260 374 L260 390" stroke="#64748b" stroke-width="2"/>

  <!-- Step 3: Round 3 (Reward Hacking!) -->
  <g transform="translate(20, 392)">
    <rect width="480" height="148" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <rect width="8" height="148" rx="4" fill="#e11d48"/>
    <rect x="20" y="12" width="215" height="22" rx="4" fill="#ffe4e6"/>
    <text x="127" y="27" font-size="12" font-weight="bold" fill="#be123c" text-anchor="middle">第三轮失灵（03:35 免责公文）</text>
    <text x="246" y="27" font-size="12" font-weight="bold" fill="#9f1239">迎合审稿口味 → 陷入 Reward Hacking</text>
    
    <text x="22" y="53" font-size="11.5" fill="#881337">• <tspan font-weight="bold">摸透审稿人脾气</tspan>：主攻 AI 发现只要下绝对判断必挨批，写免责套话就放行</text>
    <text x="22" y="75" font-size="11.5" fill="#881337">• <tspan font-weight="bold">文字级奖励作弊</tspan>：不再改底层算术，把报告写成《阶段性边界评估》，塞满</text>
    <text x="34" y="93" font-size="11.5" fill="#881337">“受限于已测单核控制变量”“不宣称全局极限”“作为候选机制相容”</text>
    <text x="22" y="116" font-size="11.5" fill="#be123c">• <tspan font-weight="bold">官僚纳什均衡</tspan>：审稿 AI 挑不出语病，盖章“主数据基本准确（通过）”，</text>
    <text x="34" y="134" font-size="11.5" fill="#be123c">两个 AI 在凌晨三点半心安理得双双停工休息（印证 arXiv:2609.28614）</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M260 540 L260 556" stroke="#64748b" stroke-width="2"/>

  <!-- Step 4: Hardware Probe De-anchoring -->
  <g transform="translate(20, 558)">
    <rect width="480" height="162" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <rect width="8" height="162" rx="4" fill="#059669"/>
    <rect x="20" y="12" width="205" height="22" rx="4" fill="#d1fae5"/>
    <text x="122" y="27" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">破局：硬件探针去锚定（11:00 后）</text>
    <text x="235" y="27" font-size="12" font-weight="bold" fill="#065f46">不审文字审探针 → 5 条 SASS 终极包</text>
    
    <text x="22" y="53" font-size="11.5" fill="#064e3b">• <tspan font-weight="bold">掀桌子换尺子</tspan>：禁止靠自然语言辩论“还有没有空间”，强制跑 2×2 破坏性探针</text>
    <text x="22" y="75" font-size="11.5" fill="#064e3b">• <tspan font-weight="bold">探针戳破遮羞布</tspan>：P0_ZeroPack 强行旁路 13 条打包指令，真机实测三档耗时</text>
    <text x="34" y="93" font-size="11.5" fill="#064e3b">12/12 全正缩短 0.41～0.57ms，直接证伪“打包已贴死地板”的免责套话</text>
    <text x="22" y="116" font-size="11.5" fill="#047857">• <tspan font-weight="bold">兑现 V3.1_pack5</tspan>：用 2^-8 统一乘法 + HMNMX2 |R2| + LEA 将打包从 13 条</text>
    <text x="34" y="134" font-size="11.5" fill="#047857">压至 9 条再压至 5 条 SASS（净砍 23,609 条），1080p 砸进 11.07ms</text>
    <text x="22" y="152" font-size="11" fill="#059669" font-weight="bold">→ 新基线重跑探针：去 Pack 变号收官，锁定唯一正敏感度靶点 Decode（1.36ms）</text>
  </g>
</svg>

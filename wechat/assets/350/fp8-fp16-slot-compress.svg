<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <style>
      .title { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 24px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 16px; fill: #64748b; }
      .sec-title { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; }
      .label { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 16px; font-weight: bold; fill: #334155; }
      .note { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; font-size: 15px; fill: #475569; }
      .bit-txt { font-family: 'WenQuanYi Micro Hei', 'DejaVu Sans Mono', sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; }
      .bit-zero { font-family: 'WenQuanYi Micro Hei', 'DejaVu Sans Mono', sans-serif; font-size: 15px; font-weight: bold; fill: #64748b; }
      .bit-idx { font-family: 'WenQuanYi Micro Hei', 'DejaVu Sans Mono', sans-serif; font-size: 13px; fill: #64748b; }
      .code-pill { font-family: 'WenQuanYi Micro Hei', 'DejaVu Sans Mono', sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
    </style>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="900" rx="18" fill="#f8fafc"/>

  <!-- 顶部总标题 -->
  <text x="400" y="42" text-anchor="middle" class="title">为什么 4 条硬件指令能救活满血 O4？</text>
  <text x="400" y="68" text-anchor="middle" class="subtitle">上：DLL 固定二进制槽位限制 ｜ 下：E4M3 → FP16 比特格右移 1 位直通图</text>

  <!-- ==================== 第一部分：DLL 槽位进度条对比 ==================== -->
  <rect x="28" y="88" width="744" height="264" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="124" class="sec-title">① DLL 胖二进制槽位限制（新机器码严禁超出原槽位 2.4 MB）</text>

  <!-- 网上改法 -->
  <text x="52" y="160" class="label">网上改法（48 行整数位运算，开 O4）：</text>
  <rect x="52" y="170" width="200" height="38" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="52" y="175" width="668" height="28" rx="5" fill="#ef4444" opacity="0.92"/>
  <text x="400" y="195" text-anchor="middle" class="bit-txt">膨胀至 8.5 MB（撑爆 2.4 MB 槽位！被迫降级 O1，耗时翻倍）</text>

  <!-- 本项目 4 条指令 -->
  <text x="52" y="246" class="label">本项目 ptx-patcher（4 条硬件算术指令，开满血 O4）：</text>
  <rect x="52" y="256" width="200" height="38" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="52" y="261" width="196" height="28" rx="5" fill="#10b981"/>
  <text x="150" y="281" text-anchor="middle" class="bit-txt">2.4 MB 严丝合缝</text>
  <text x="272" y="281" class="label" fill="#059669">✓ 15/15 代码包全开满血 O4 装回原槽位（提速 2.1×～2.3×）</text>

  <!-- 2.4MB 槽位分界竖线（标牌放在底部空白处，绝不压字） -->
  <line x1="252" y1="164" x2="252" y2="314" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="5,4"/>
  <rect x="167" y="314" width="170" height="26" rx="5" fill="#0f172a"/>
  <text x="252" y="332" text-anchor="middle" class="bit-txt" font-size="13">▲ DLL 槽位上限 2.4 MB</text>

  <!-- ==================== 第二部分：比特格搬家图示 ==================== -->
  <rect x="28" y="370" width="744" height="502" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="406" class="sec-title">② 硬件解包原理：8 格比特整体右移 1 格 + 乘 256.0h</text>

  <!-- 上排：FP8 (E4M3) 8 个比特格 -->
  <text x="56" y="440" class="label">输入：8 位 FP8（E4M3，指数偏置 Bias = 7）</text>
  <g transform="translate(56, 468)">
    <!-- 位编号 -->
    <text x="27" y="-8" text-anchor="middle" class="bit-idx">bit 7</text>
    <text x="83" y="-8" text-anchor="middle" class="bit-idx">6</text>
    <text x="139" y="-8" text-anchor="middle" class="bit-idx">5</text>
    <text x="195" y="-8" text-anchor="middle" class="bit-idx">4</text>
    <text x="251" y="-8" text-anchor="middle" class="bit-idx">3</text>
    <text x="307" y="-8" text-anchor="middle" class="bit-idx">2</text>
    <text x="363" y="-8" text-anchor="middle" class="bit-idx">1</text>
    <text x="419" y="-8" text-anchor="middle" class="bit-idx">bit 0</text>

    <!-- S (1 bit) -->
    <rect x="0" y="0" width="52" height="44" rx="6" fill="#8b5cf6"/>
    <text x="26" y="28" text-anchor="middle" class="bit-txt">S</text>

    <!-- E3..E0 (4 bits) -->
    <rect x="56" y="0" width="52" height="44" rx="6" fill="#2563eb"/>
    <text x="82" y="28" text-anchor="middle" class="bit-txt">E3</text>
    <rect x="112" y="0" width="52" height="44" rx="6" fill="#2563eb"/>
    <text x="138" y="28" text-anchor="middle" class="bit-txt">E2</text>
    <rect x="168" y="0" width="52" height="44" rx="6" fill="#2563eb"/>
    <text x="194" y="28" text-anchor="middle" class="bit-txt">E1</text>
    <rect x="224" y="0" width="52" height="44" rx="6" fill="#2563eb"/>
    <text x="250" y="28" text-anchor="middle" class="bit-txt">E0</text>

    <!-- M2..M0 (3 bits) -->
    <rect x="280" y="0" width="52" height="44" rx="6" fill="#d97706"/>
    <text x="306" y="28" text-anchor="middle" class="bit-txt">M2</text>
    <rect x="336" y="0" width="52" height="44" rx="6" fill="#d97706"/>
    <text x="362" y="28" text-anchor="middle" class="bit-txt">M1</text>
    <rect x="392" y="0" width="52" height="44" rx="6" fill="#d97706"/>
    <text x="418" y="28" text-anchor="middle" class="bit-txt">M0</text>

    <!-- 右侧图例框 -->
    <rect x="468" y="2" width="212" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="574" y="27" text-anchor="middle" class="note" font-weight="bold">1 符号 + 4 指数 + 3 尾数</text>
  </g>

  <!-- 中间映射箭头（从 y=516 直接连到 y=612 的 FP16 格顶，中间无横穿文字） -->
  <!-- S: (56+26=82, 516) -> (56+20=76, 610) -->
  <path d="M 82 516 L 76 608" stroke="#8b5cf6" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/>
  <!-- E3..E0: (56+82=138 -> 56+104=160), (56+250=306 -> 56+230=286) -->
  <path d="M 138 516 L 160 608" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 306 516 L 286 608" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <!-- M2..M0: (56+306=362 -> 56+272=328), (56+418=474 -> 56+356=412) -->
  <path d="M 362 516 L 328 608" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 474 516 L 412 608" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- 右侧空白处放操作说明气泡（x=485..736，完全避开左侧箭头！） -->
  <rect x="482" y="536" width="254" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="609" y="559" text-anchor="middle" class="code-pill" fill="#1d4ed8">shr.b16 整体右移 1 格</text>
  <text x="609" y="581" text-anchor="middle" class="note" fill="#1e40af">bit 14 与低 7 位自动补 0</text>

  <!-- 下排：FP16 16 个比特格 (x=56, y=614) -->
  <g transform="translate(56, 614)">
    <!-- bit 15: S -->
    <rect x="0" y="0" width="40" height="44" rx="5" fill="#8b5cf6"/>
    <text x="20" y="28" text-anchor="middle" class="bit-txt">S</text>
    <text x="20" y="62" text-anchor="middle" class="bit-idx">15</text>

    <!-- bit 14: 0 (补0) -->
    <rect x="42" y="0" width="40" height="44" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="62" y="28" text-anchor="middle" class="bit-zero">0</text>
    <text x="62" y="62" text-anchor="middle" class="bit-idx">14</text>

    <!-- bit 13..10: E3..E0 -->
    <rect x="84" y="0" width="40" height="44" rx="5" fill="#2563eb"/>
    <text x="104" y="28" text-anchor="middle" class="bit-txt">E3</text>
    <text x="104" y="62" text-anchor="middle" class="bit-idx">13</text>

    <rect x="126" y="0" width="40" height="44" rx="5" fill="#2563eb"/>
    <text x="146" y="28" text-anchor="middle" class="bit-txt">E2</text>
    <text x="146" y="62" text-anchor="middle" class="bit-idx">12</text>

    <rect x="168" y="0" width="40" height="44" rx="5" fill="#2563eb"/>
    <text x="188" y="28" text-anchor="middle" class="bit-txt">E1</text>
    <text x="188" y="62" text-anchor="middle" class="bit-idx">11</text>

    <rect x="210" y="0" width="40" height="44" rx="5" fill="#2563eb"/>
    <text x="230" y="28" text-anchor="middle" class="bit-txt">E0</text>
    <text x="230" y="62" text-anchor="middle" class="bit-idx">10</text>

    <!-- bit 9..7: M2..M0 -->
    <rect x="252" y="0" width="40" height="44" rx="5" fill="#d97706"/>
    <text x="272" y="28" text-anchor="middle" class="bit-txt">M2</text>
    <text x="272" y="62" text-anchor="middle" class="bit-idx">9</text>

    <rect x="294" y="0" width="40" height="44" rx="5" fill="#d97706"/>
    <text x="314" y="28" text-anchor="middle" class="bit-txt">M1</text>
    <text x="314" y="62" text-anchor="middle" class="bit-idx">8</text>

    <rect x="336" y="0" width="40" height="44" rx="5" fill="#d97706"/>
    <text x="356" y="28" text-anchor="middle" class="bit-txt">M0</text>
    <text x="356" y="62" text-anchor="middle" class="bit-idx">7</text>

    <!-- bit 6..0: 7 zeros -->
    <rect x="378" y="0" width="40" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="398" y="28" text-anchor="middle" class="bit-zero">0</text>
    <rect x="420" y="0" width="40" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="440" y="28" text-anchor="middle" class="bit-zero">0</text>
    <rect x="462" y="0" width="40" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="482" y="28" text-anchor="middle" class="bit-zero">0</text>
    <rect x="504" y="0" width="40" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="524" y="28" text-anchor="middle" class="bit-zero">0</text>
    <rect x="546" y="0" width="40" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="566" y="28" text-anchor="middle" class="bit-zero">0</text>
    <rect x="588" y="0" width="40" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="608" y="28" text-anchor="middle" class="bit-zero">0</text>
    <rect x="630" y="0" width="40" height="44" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="650" y="28" text-anchor="middle" class="bit-zero">0</text>
    <text x="524" y="62" text-anchor="middle" class="bit-idx">bit 6 .. 0（低 7 位尾数补 0）</text>
  </g>
  <text x="56" y="704" class="label">中间态：16 位 FP16（指数偏置 Bias = 15，数值恰好缩水 2^(15-7) = 256 倍）</text>

  <!-- 底部硬件乘法器一步到位 -->
  <line x1="400" y1="714" x2="400" y2="744" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="56" y="750" width="688" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="782" text-anchor="middle" class="code-pill" fill="#065f46">mul.rn.f16x2 %d, %d, 0x5c005c00 （硬件乘以常数 256.0h）</text>
  <text x="400" y="810" text-anchor="middle" class="note" fill="#047857">• 正规数：FP16 硬件乘法器自动将指数 +8，还原真实数值</text>
  <text x="400" y="834" text-anchor="middle" class="note" fill="#047857">• 次正规数（E=0）：硬件电路自动寻找前导 1 完成归一化（省去 40 行整数分支！）</text>
</svg>

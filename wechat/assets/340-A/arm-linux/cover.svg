<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383">
  <defs>
    <style>
      text { font-family: 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif; }
      .mono { font-family: 'WenQuanYi Micro Hei', 'DejaVu Sans Mono', monospace; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a1122"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>

    <linearGradient id="fakeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="trueBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <linearGradient id="goldJump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景与底层网格 -->
  <rect width="900" height="383" fill="url(#bgGrad)"/>

  <g opacity="0.05" stroke="#38bdf8" stroke-width="0.6">
    <line x1="0" y1="64" x2="900" y2="64"/>
    <line x1="0" y1="128" x2="900" y2="128"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="256" x2="900" y2="256"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>

  <!-- 背景氛围光斑 -->
  <circle cx="230" cy="120" r="110" fill="#ef4444" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="240" cy="275" r="120" fill="#06b6d4" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="680" cy="190" r="140" fill="#38bdf8" opacity="0.05" filter="url(#softGlow)"/>

  <!-- ================= 左侧：原版暗锁 vs 补丁跳板 ================= -->

  <!-- 1. 上半卡片：原版 agy 的假 1M 与 256K 暗锁 -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="405" height="132" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.55"/>
    <text x="14" y="24" fill="#fca5a5" font-size="12" font-weight="bold">BEFORE · 原版客户端的“表面一套，背后一套”</text>
    <text x="392" y="24" fill="#ef4444" font-size="11" class="mono" text-anchor="end">LOCKED</text>

    <!-- 1M 虚标槽 -->
    <text x="14" y="48" fill="#94a3b8" font-size="11" class="mono">UI /context 显示: 1.0M tokens</text>
    <rect x="14" y="56" width="376" height="16" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.8" stroke-dasharray="4,3"/>
    <!-- 实际被锁在 25.6% 的红条 -->
    <rect x="14" y="56" width="96" height="16" rx="4" fill="url(#fakeBar)"/>
    <!-- 256K 铡刀线 -->
    <line x1="110" y1="48" x2="110" y2="80" stroke="#ef4444" stroke-width="2" filter="url(#glow)"/>
    <text x="116" y="68" fill="#f87171" font-size="11" font-weight="bold" class="mono">256K 暗切! (truncation=2)</text>

    <!-- AGENTS.md 双锁被拒 -->
    <rect x="14" y="84" width="376" height="36" rx="4" fill="#1c1917" stroke="#7f1d1d" stroke-width="0.8"/>
    <text x="22" y="100" fill="#fca5a5" font-size="11" class="mono">AGENTS.md (118KB) → [锁1: 24KB截断] → [锁2: 20K预算]</text>
    <text x="22" y="114" fill="#ef4444" font-size="10" class="mono">Result: excluded from inline injection (整份丢弃!)</text>
  </g>

  <!-- 中间：ARM64 跳板手术连接箭头 -->
  <g transform="translate(32, 172)">
    <rect x="45" y="0" width="315" height="34" rx="17" fill="#111c33" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="202" y="15" fill="#fbbf24" font-size="11" font-weight="bold" class="mono" text-anchor="middle">0x718d094: b 0x76f7ca0 (借用 checkpointNeeded 死代码)</text>
    <text x="202" y="28" fill="#93c5fd" font-size="10" class="mono" text-anchor="middle">plan_model == 1419 → max_token_limit = 1000000</text>
  </g>

  <!-- 2. 下半卡片：手术后真 1M 窗口与 474.8K 实测 -->
  <g transform="translate(32, 214)">
    <rect x="0" y="0" width="405" height="136" rx="8" fill="#091926" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.8"/>
    <text x="14" y="24" fill="#7dd3fc" font-size="12" font-weight="bold">AFTER · ARM64 跳板手术 + 128K 规则预算解锁</text>
    <text x="392" y="24" fill="#4ade80" font-size="11" class="mono" font-weight="bold" text-anchor="end">VERIFIED</text>

    <!-- 真 1M 进度条 -->
    <text x="14" y="48" fill="#bae6fd" font-size="11" class="mono">实盘压力测试: 连读 30 篇长文 → 474.8k / 983,040</text>
    <rect x="14" y="56" width="376" height="16" rx="4" fill="#0f293a" stroke="#0284c7" stroke-width="0.9"/>
    <rect x="14" y="56" width="178" height="16" rx="4" fill="url(#trueBar)" filter="url(#glow)"/>
    <!-- 旧 256K 虚线已被碾过 -->
    <line x1="110" y1="53" x2="110" y2="75" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
    <text x="198" y="68" fill="#4ade80" font-size="11" font-weight="bold" class="mono">474.8k (45.3%) 零裁剪通过</text>

    <!-- AGENTS.md 完整注入 -->
    <rect x="14" y="84" width="376" height="40" rx="4" fill="#071f24" stroke="#0d9488" stroke-width="0.9"/>
    <text x="22" y="101" fill="#6ee7b7" font-size="11" class="mono">user_rules 落盘: 119,283 B (含 118,908 B 原文)</text>
    <text x="22" y="117" fill="#38bdf8" font-size="10" class="mono">System prompt: 43.2k tokens · x0=x1=x2=0 (Go nil error)</text>
  </g>

  <!-- ================= 右侧：主标题与视觉重心 ================= -->
  <g transform="translate(466, 0)">
    <!-- 顶部标签 -->
    <rect x="0" y="36" width="218" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="109" y="52" fill="#38bdf8" font-size="11" font-weight="bold" class="mono" text-anchor="middle">Gemini 4 Argon · agy v1.3.5</text>

    <!-- 主标题第一行 -->
    <text x="0" y="112" fill="#f8fafc" font-size="34" font-weight="bold" letter-spacing="1">面板写着 1M</text>
    <!-- 主标题第二行（高亮反差） -->
    <text x="0" y="162" fill="#f87171" font-size="34" font-weight="bold" letter-spacing="1" filter="url(#glow)">背地里砍成 256K</text>

    <!-- 副标题 -->
    <text x="0" y="206" fill="#e2e8f0" font-size="18" font-weight="bold">给 Google 的 Antigravity CLI</text>
    <text x="0" y="234" fill="#38bdf8" font-size="18" font-weight="bold">动一次 ARM64 二进制外科手术</text>

    <!-- 分割线 -->
    <line x1="0" y1="256" x2="395" y2="256" stroke="#334155" stroke-width="1"/>

    <!-- 三个核心看点 -->
    <g transform="translate(0, 278)" fill="#94a3b8" font-size="13">
      <circle cx="6" cy="-4" r="3" fill="#fbbf24"/>
      <text x="18" y="0">揭底：为什么改常量和实验配置全被覆盖回 256K</text>

      <circle cx="6" cy="22" r="3" fill="#f87171"/>
      <text x="18" y="26">连环套：解开 24KB 文件锁，反而触发 20K 整份丢弃</text>

      <circle cx="6" cy="48" r="3" fill="#4ade80"/>
      <text x="18" y="52">借尸还魂：在废弃函数里手搓机器码跳板夺回 1M 窗口</text>
    </g>

    <!-- 右下角署名 -->
    <text x="398" y="364" fill="#64748b" font-size="11" class="mono" text-anchor="end">靳岩岩的 AI 学习笔记</text>
  </g>
</svg>

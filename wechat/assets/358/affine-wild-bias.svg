<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" width="520" height="470" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#f8fafc" rx="12"/>
  <text x="260" y="32" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">没有 +b 怎么做仿射平移？——从二维图片 3×3 矩阵到大模型“野生偏置”</text>
  <text x="260" y="52" font-size="11" fill="#64748b" text-anchor="middle">纯矩阵乘法锁死原点 0·W=0，想做平移就必须在输入向量里有一个恒定不变的常数维</text>

  <!-- Box 1: 2D Graphics Homogeneous Coordinates -->
  <rect x="20" y="68" width="480" height="162" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="8"/>
  <rect x="20" y="68" width="480" height="28" fill="#e0f2fe" rx="8"/>
  <text x="34" y="87" font-size="12.5" font-weight="bold" fill="#0369a1">① 图形学做法：给二维点 (x, y) 多挂一个恒定常数维 1，乘 3×3 矩阵点出平移</text>

  <!-- Vector (x, y, 1) -->
  <path d="M 44 126 L 38 126 L 38 164 L 44 164" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M 152 126 L 158 126 L 158 164 L 152 164" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="46" y="132" width="30" height="26" fill="#f1f5f9" rx="4"/>
  <text x="61" y="150" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">x</text>
  <rect x="82" y="132" width="30" height="26" fill="#f1f5f9" rx="4"/>
  <text x="97" y="150" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">y</text>
  <rect x="118" y="132" width="32" height="26" fill="#fef08a" stroke="#eab308" stroke-width="1.5" rx="4"/>
  <text x="134" y="150" font-size="12.5" font-weight="bold" fill="#a16207" text-anchor="middle">1</text>
  <text x="134" y="182" font-size="10" font-weight="bold" fill="#a16207" text-anchor="middle">常数维</text>

  <text x="172" y="151" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">·</text>

  <!-- 3x3 Matrix -->
  <path d="M 192 108 L 186 108 L 186 188 L 192 188" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M 294 108 L 300 108 L 300 188 L 294 188" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="208" y="126" font-size="11.5" fill="#475569" text-anchor="middle">1</text>
  <text x="243" y="126" font-size="11.5" fill="#475569" text-anchor="middle">0</text>
  <text x="278" y="126" font-size="11.5" fill="#475569" text-anchor="middle">0</text>
  <text x="208" y="150" font-size="11.5" fill="#475569" text-anchor="middle">0</text>
  <text x="243" y="150" font-size="11.5" fill="#475569" text-anchor="middle">1</text>
  <text x="278" y="150" font-size="11.5" fill="#475569" text-anchor="middle">0</text>
  <rect x="194" y="160" width="98" height="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" rx="4"/>
  <text x="208" y="176" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">+3</text>
  <text x="243" y="176" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">+5</text>
  <text x="278" y="176" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">1</text>

  <text x="316" y="151" font-size="15" font-weight="bold" fill="#475569" text-anchor="middle">=</text>

  <!-- Output (x+3, y+5, 1) -->
  <rect x="332" y="128" width="152" height="36" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" rx="6"/>
  <text x="408" y="151" font-size="12.5" font-weight="bold" fill="#0369a1" text-anchor="middle">( x + 3 ,  y + 5 ,  1 )</text>
  <text x="408" y="182" font-size="10" fill="#0369a1" text-anchor="middle">常数 1 把第 3 行的 (+3, +5) 点了出来</text>

  <!-- Box 2: LLM Wild Bias Substitution -->
  <rect x="20" y="244" width="480" height="208" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" rx="8"/>
  <rect x="20" y="244" width="480" height="28" fill="#ffedd5" rx="8"/>
  <text x="34" y="263" font-size="12.5" font-weight="bold" fill="#9a3412">② 大模型砍掉官方偏置 +b 后：用“大常数激活 × 小权重”凑出 +0.18</text>

  <!-- Row 1: Old model with explicit bias -->
  <text x="36" y="294" font-size="11" font-weight="bold" fill="#475569">• 以前有偏置项时（末尾自带官方 +0.18）：</text>
  <rect x="36" y="302" width="194" height="32" fill="#f8fafc" stroke="#cbd5e1" rx="5"/>
  <text x="133" y="322" font-size="11.5" fill="#334155" text-anchor="middle">y = (x1 × w1) + (x2 × w2)</text>

  <text x="240" y="322" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">+</text>

  <rect x="252" y="302" width="122" height="32" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3 2" rx="5"/>
  <text x="313" y="317" font-size="10.5" fill="#64748b" text-anchor="middle">(x_常 × w_常)</text>
  <text x="313" y="330" font-size="9.5" fill="#94a3b8" text-anchor="middle">原本闲置为 0</text>

  <text x="384" y="322" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">+</text>

  <rect x="396" y="302" width="88" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="440" y="317" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">+ 0.18</text>
  <text x="440" y="330" font-size="9.5" fill="#15803d" text-anchor="middle">官方偏置 b</text>

  <!-- Row 2: Modern LLM with bias=False -->
  <text x="36" y="362" font-size="11" font-weight="bold" fill="#9a3412">• 现在偏置被砍了（bias=False，征用常数通道顶替 +0.18）：</text>
  <rect x="36" y="370" width="194" height="36" fill="#f8fafc" stroke="#cbd5e1" rx="5"/>
  <text x="133" y="392" font-size="11.5" fill="#334155" text-anchor="middle">y = (x1 × w1) + (x2 × w2)</text>

  <text x="240" y="392" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="middle">+</text>

  <rect x="252" y="370" width="122" height="36" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8" rx="5"/>
  <text x="313" y="386" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">18 × 0.01 = +0.18</text>
  <text x="313" y="401" font-size="9.5" font-weight="bold" fill="#c2410c" text-anchor="middle">大激活 18 × 小权重 0.01</text>

  <text x="384" y="392" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">+</text>

  <rect x="396" y="370" width="88" height="36" fill="#fef2f2" stroke="#f87171" stroke-dasharray="4 2" rx="5"/>
  <text x="440" y="387" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="middle">[ 被砍掉 ]</text>
  <text x="440" y="401" font-size="9.5" fill="#ef4444" text-anchor="middle">bias = False</text>

  <!-- Curved arrow showing substitution -->
  <path d="M 440 408 C 440 434, 313 434, 313 410" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="376" y="440" font-size="10" font-weight="bold" fill="#c2410c" text-anchor="middle">左移顶替被砍掉的 +0.18（若 0.01 被 RTN 抹成 0，偏置即丢失）</text>
</svg>

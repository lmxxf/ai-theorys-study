<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif">
  <!-- 实心纯白底（防微信暗黑模式透明） -->
  <rect x="0" y="0" width="600" height="760" fill="#ffffff"/>

  <!-- 顶部主标题 -->
  <text x="300" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">起底 5 万星“AI 自动搞科研”SKILL.md 的四步真身</text>
  <text x="300" y="56" text-anchor="middle" font-size="12" fill="#64748b">单文件 24 KB – 74 KB（400 – 1,211 行 Markdown 状态机）的真实流水线与失控分支</text>

  <!-- 第一步：跟哪儿搜 -->
  <rect x="20" y="76" width="560" height="106" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="76" width="8" height="106" rx="4" fill="#0284c7"/>
  <text x="42" y="100" font-size="14.5" font-weight="bold" fill="#0369a1">第一步：跟哪儿搜（Data Sources · 100% 公共免费接口，零私有库）</text>
  <text x="42" y="123" font-size="11.5" fill="#334155">• 免 Key 学术 API：arXiv API（或 DeepXiv 按节切片）、OpenAlex（2.5 亿篇开源引文库）</text>
  <text x="42" y="144" font-size="11.5" fill="#334155">• 顶会与期刊核验：Semantic Scholar API（查 venue / TLDR）、Crossref / Unpaywall（查 OA）</text>
  <text x="42" y="165" font-size="11.5" fill="#475569">• 本地与付费墙：扫本地 Zotero / PDF 前 3 页；付费期刊靠借用用户自己登录的校园网 Chrome</text>

  <!-- 箭头 1->2 -->
  <path d="M 300 182 L 300 202" stroke="#64748b" stroke-width="2"/>
  <polygon points="295,198 305,198 300,206" fill="#64748b"/>

  <!-- 第二步：怎么搜与防瞎编 -->
  <rect x="20" y="208" width="560" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="208" width="8" height="86" rx="4" fill="#0d9488"/>
  <text x="42" y="232" font-size="14.5" font-weight="bold" fill="#0f766e">第二步：怎么搜与防瞎编（Search &amp; Citation Gate · 引文真实性门禁）</text>
  <text x="42" y="255" font-size="11.5" fill="#334155">• 检索词拆解：把模糊课题拆成多组中英文检索词 + 正反滚雪球（查谁引用并反驳了它）</text>
  <text x="42" y="276" font-size="11.5" fill="#334155">• 防幻觉死门禁：凡写进正文的引文，必须调接口核验真有该 DOI / arXiv ID（防编造假文献）</text>

  <!-- 箭头 2->3 -->
  <path d="M 300 294 L 300 314" stroke="#64748b" stroke-width="2"/>
  <polygon points="295,310 305,310 300,318" fill="#64748b"/>

  <!-- 第三步：怎么提取重点 -->
  <rect x="20" y="320" width="560" height="94" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="320" width="8" height="94" rx="4" fill="#4f46e5"/>
  <text x="42" y="344" font-size="14.5" font-weight="bold" fill="#4338ca">第三步：怎么提取重点（3W + Limitations 读文献填空矩阵）</text>
  <text x="42" y="367" font-size="11.5" fill="#334155">• 强制填表：读完每篇文献必须按固定 Markdown 表格填满 4 个格子：</text>
  <text x="48" y="387" font-size="11.5" font-weight="bold" fill="#1e293b">[WHY 解决什么痛点] → [HOW 用什么方法] → [WHAT 刷多少分] → [Limitations 留了什么坑]</text>
  <text x="42" y="405" font-size="11" fill="#64748b">（注：绝大多数“自动找 Idea”技能，就是把前人表格里的 Limitations 排列组合拼成新题目）</text>

  <!-- 箭头 3->4 -->
  <path d="M 300 414 L 300 434" stroke="#64748b" stroke-width="2"/>
  <polygon points="295,430 305,430 300,438" fill="#64748b"/>

  <!-- 第四步：怎么写与跨模型互审循环 -->
  <rect x="20" y="440" width="560" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <rect x="20" y="440" width="8" height="96" rx="4" fill="#d97706"/>
  <text x="42" y="464" font-size="14.5" font-weight="bold" fill="#b45309">第四步：怎么写与挂机互审（IMRaD 八股模板 + 跨模型 while 死循环）</text>
  <text x="42" y="487" font-size="11.5" fill="#334155">• 主 Agent（如 Claude Code）跑实验 + 按引言/方法/实验/讨论模板写稿，状态存 findings.md</text>
  <text x="42" y="508" font-size="11.5" fill="#334155">• 调独立审稿模型（如 Codex MCP）循环打分：定死 MAX_ROUNDS = 4，满 6/10 分且 ready 才停</text>
  <text x="42" y="526" font-size="11" fill="#92400e">口号：“The human is asleep or busy; do not ask the user for permission!”</text>

  <!-- 分叉箭头：当人类真去睡觉后触发的两大失控灾难 -->
  <path d="M 170 536 L 155 566" stroke="#dc2626" stroke-width="2"/>
  <polygon points="151,561 161,564 153,570" fill="#dc2626"/>
  <path d="M 430 536 L 445 566" stroke="#dc2626" stroke-width="2"/>
  <polygon points="439,564 449,561 447,570" fill="#dc2626"/>

  <text x="300" y="558" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">▼ 人类真去睡觉后，逼得原作者连夜写出两个“解毒仓库” ▼</text>

  <!-- 左下失控框：HERO 过度防御 -->
  <rect x="20" y="574" width="270" height="164" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="155" y="598" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">失控一：过度防御（HERO 解毒仓）</text>
  <text x="32" y="620" font-size="11" fill="#7f1d1d">目标从“把活干好”异化为“别被审稿追责”：</text>
  <text x="32" y="640" font-size="11" fill="#334155">• H (Hashing)：算满屏没人看的 SHA256</text>
  <text x="32" y="659" font-size="11" fill="#334155">• E (Edge cases)：防外星人输入砌十层墙</text>
  <text x="32" y="678" font-size="11" fill="#334155">• R (Rubrics)：刷满打分表，主线零推进</text>
  <text x="32" y="697" font-size="11" fill="#334155">• O (Overbuild)：盖房前先修一座军事要塞</text>
  <text x="32" y="718" font-size="10.5" fill="#991b1b">+ 每段塞免责尾巴、说偏东一点搬去大西洋</text>

  <!-- 右下失控框：Anti-Autoresearch 静默造假 -->
  <rect x="310" y="574" width="270" height="164" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="445" y="598" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">失控二：静默造假（Anti-Autoresearch）</text>
  <text x="322" y="620" font-size="11" fill="#7f1d1d">为凑 6/10 过关分早停机，半夜钻空子：</text>
  <text x="322" y="640" font-size="11" fill="#334155">• 数值不自洽：正文、表格与差值对不上</text>
  <text x="322" y="659" font-size="11" fill="#334155">• 货不对板：代码实际跑的 ≠ 正文吹的方法</text>
  <text x="322" y="678" font-size="11" fill="#334155">• 操纵对比：故意漏掉或弱化 Baseline</text>
  <text x="322" y="697" font-size="11" fill="#334155">• 指鹿为马：把代码 Bug 硬吹成科学新发现</text>
  <text x="322" y="718" font-size="10.5" fill="#991b1b">（alphaXiv 实测 49.4% 自动结论跑代码翻车）</text>
</svg>

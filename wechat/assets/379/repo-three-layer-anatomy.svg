  <text x="20" y="426" fill="#64748b" font-size="10.5">1.96万星 · 87主技能</text>
  <rect x="150" y="396" width="173" height="16" rx="3" fill="#3b82f6"/>
  <text x="329" y="408" fill="#1d4ed8" font-size="10.5" font-weight="bold">16.0万行 MD (87主技能+镜像共197处)</text>
  <rect x="150" y="416" width="48" height="16" rx="3" fill="#10b981"/>
  <rect x="198" y="416" width="22" height="16" rx="3" fill="#94a3b8"/>
  <text x="226" y="428" fill="#047857" font-size="10.5" font-weight="bold">4.4万行运行 (11个MCP服务目录+GPU队列)</text>
  <text x="150" y="445" fill="#b91c1c" font-size="10.5">主打双AI挂机互审4轮，同一作者又写出HERO与Anti两个配套解毒仓</text>

  <!-- Repo 5: AutoResearchClaw (14.9k★) -->
  <!-- MD: 2.10万行 -> 23px; Code: 8.20万运行(89px) + 4.86万测试/例程(53px) -->
  <text x="20" y="482" fill="#0f172a" font-size="12.5" font-weight="bold">5. AutoResearchClaw</text>
  <text x="20" y="498" fill="#64748b" font-size="10.5">1.49万星 · 23阶段</text>
  <rect x="150" y="468" width="23" height="16" rx="3" fill="#3b82f6"/>
  <text x="179" y="480" fill="#1d4ed8" font-size="10.5" font-weight="bold">2.1万行 MD</text>
  <rect x="150" y="488" width="89" height="16" rx="3" fill="#10b981"/>
  <rect x="239" y="488" width="53" height="16" rx="3" fill="#94a3b8"/>
  <text x="298" y="500" fill="#047857" font-size="10.5" font-weight="bold">8.2万运行 + 4.9万测试/例程 (23阶段引擎)</text>
  <text x="150" y="517" fill="#b91c1c" font-size="10.5">源码揭秘：ExperimentConfig类默认simulated回退，阶段15失败上限可PROCEED</text>

  <!-- Repo 6: Orchestra (14.7k★) -->
  <!-- MD: 18.87万行 -> 205px; Code: 0.60万行(7px) -->
  <text x="20" y="554" fill="#0f172a" font-size="12.5" font-weight="bold">6. Orchestra</text>
  <text x="20" y="570" fill="#64748b" font-size="10.5">1.47万星 · 98技能</text>
  <rect x="150" y="540" width="205" height="16" rx="3" fill="#3b82f6"/>
  <text x="361" y="552" fill="#1d4ed8" font-size="10.5" font-weight="bold">18.9万行 MD (79条路由有17条缺目录)</text>
  <rect x="150" y="560" width="3" height="16" rx="1" fill="#10b981"/>
  <rect x="153" y="560" width="5" height="16" rx="1" fill="#94a3b8"/>
  <text x="165" y="572" fill="#b91c1c" font-size="10.5" font-weight="bold">仅0.6万行代码 (2608行npm安装器 + 1806行Remotion宣传片 + 66行检查)</text>

  <!-- Bottom Takeaway Box -->
  <rect x="20" y="592" width="520" height="54" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="32" y="614" fill="#0f172a" font-size="11.5" font-weight="bold">三分类源码审计总结：</text>
  <text x="32" y="633" fill="#334155" font-size="11">• 本地真代码能帮人干脏活（查DOI、算功效、审排版碰撞），但研究判断与宏观剪枝无法外包给脚本。</text>
</svg>

  <!-- Section 2 Header: 三个 1.5 万星全自动挂机派 -->
  <rect x="20" y="366" width="520" height="22" rx="4" fill="#fef2f2"/>
  <text x="28" y="381" fill="#991b1b" font-size="11.5" font-weight="bold">第二梯队：三个 1.5 万至 1.95 万星“睡觉全自动挂机派”与源码后门</text>

  <!-- Repo 4: ARIS (19.6k★) -->
  <!-- MD: 15.99万行 -> 173px; Code: 4.43万运行(48px) + 2.07万测试(22px) -->

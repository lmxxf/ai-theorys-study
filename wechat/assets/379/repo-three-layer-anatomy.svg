<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660" width="560" height="660" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <!-- Solid White Background for WeChat Dark/Light Mode -->
  <rect width="560" height="660" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="20" y="34" fill="#0f172a" font-size="16" font-weight="bold">六大高星科研 Skill 仓库 · 本地源码三分类实测构成</text>
  <text x="20" y="54" fill="#475569" font-size="11.5">基于本地 Git 快照逐文件统计（单位：万行，不含 Markdown 内嵌代码块）</text>

  <!-- Legend -->
  <rect x="20" y="68" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text x="39" y="80" fill="#1e293b" font-size="11.5" font-weight="bold">给 AI / 人读的 Markdown</text>

  <rect x="195" y="68" width="14" height="14" rx="3" fill="#10b981"/>
  <text x="214" y="80" fill="#1e293b" font-size="11.5" font-weight="bold">本地候选运行代码 (.py/.mjs等)</text>

  <rect x="395" y="68" width="14" height="14" rx="3" fill="#94a3b8"/>
  <text x="414" y="80" fill="#1e293b" font-size="11.5" font-weight="bold">测试 / 例程 / 自检 / 宣传片</text>

  <!-- Axis Scale: x=150 to x=530 -> 380px = 35万行 (1万行 ≈ 10.85px) -->
  <line x1="150" y1="96" x2="530" y2="96" stroke="#cbd5e1" stroke-width="1"/>
  <text x="150" y="110" text-anchor="middle" fill="#64748b" font-size="10">0</text>
  <text x="258" y="110" text-anchor="middle" fill="#64748b" font-size="10">10万行</text>
  <text x="367" y="110" text-anchor="middle" fill="#64748b" font-size="10">20万行</text>
  <text x="475" y="110" text-anchor="middle" fill="#64748b" font-size="10">30万行</text>

  <!-- Grid vertical lines -->
  <line x1="150" y1="115" x2="150" y2="575" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="258" y1="115" x2="258" y2="575" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="367" y1="115" x2="367" y2="575" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="475" y1="115" x2="475" y2="575" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Section 1 Header: 三大五万星头牌 -->
  <rect x="20" y="120" width="520" height="22" rx="4" fill="#f1f5f9"/>
  <text x="28" y="135" fill="#0f172a" font-size="11.5" font-weight="bold">第一梯队：三大 5.4 万至 5.8 万星头牌（人机协同 + 厚重本地工具代码）</text>

  <!-- Repo 1: K-Dense-AI (58.1k★) -->
  <!-- MD: 32.97万行 -> 358px; Code: 16.77万运行(182px) + 8.14万测试例程(88px) = 24.91万(270px) -->
  <text x="20" y="164" fill="#0f172a" font-size="12.5" font-weight="bold">1. K-Dense-AI</text>
  <text x="20" y="180" fill="#64748b" font-size="10.5">5.81万星 · 177技能</text>
  <rect x="150" y="150" width="358" height="16" rx="3" fill="#3b82f6"/>
  <text x="502" y="162" text-anchor="end" fill="#ffffff" font-size="10.5" font-weight="bold">33.0万行 MD (177个SKILL + 177篇导购页)</text>
  <rect x="150" y="170" width="182" height="16" rx="3" fill="#10b981"/>
  <rect x="332" y="170" width="88" height="16" rx="3" fill="#94a3b8"/>
  <text x="425" y="182" fill="#047857" font-size="10.5" font-weight="bold">16.8万运行 + 8.1万测试/例程</text>
  <text x="150" y="199" fill="#475569" font-size="10.5">真算统计功效/生信包装/18学术接口；177篇模板导购页引流BYOK</text>

  <!-- Repo 2: Imbad0202 (58.0k★) -->
  <!-- MD: 20.26万行 -> 220px; Code: 8.78万运行(95px) + 5.59万check自检(61px) + 14.88万测试(161px) = 29.25万(317px) -->
  <text x="20" y="238" fill="#0f172a" font-size="12.5" font-weight="bold">2. Imbad0202</text>
  <text x="20" y="254" fill="#64748b" font-size="10.5">5.80万星 · 32角色</text>
  <rect x="150" y="224" width="220" height="16" rx="3" fill="#3b82f6"/>
  <text x="376" y="236" fill="#1d4ed8" font-size="10.5" font-weight="bold">20.3万行 MD (材料护照/论证图)</text>
  <rect x="150" y="244" width="95" height="16" rx="3" fill="#10b981"/>
  <rect x="245" y="244" width="222" height="16" rx="3" fill="#94a3b8"/>
  <text x="472" y="256" fill="#047857" font-size="10.5" font-weight="bold">29.2万行代码</text>
  <text x="150" y="273" fill="#475569" font-size="10.5">含SQLite引文核验/PRISMA综述筛查/PDF预检 + 20.5万行测试与check自检</text>

  <!-- Repo 3: nature-skills (54.5k★) -->
  <!-- MD: 4.13万行 -> 45px; Code: 4.18万运行(45px) + 1.50万测试(16px) = 5.69万(61px) -->
  <text x="20" y="312" fill="#0f172a" font-size="12.5" font-weight="bold">3. nature-skills</text>
  <text x="20" y="328" fill="#64748b" font-size="10.5">5.45万星 · 24技能</text>
  <rect x="150" y="298" width="45" height="16" rx="3" fill="#3b82f6"/>
  <text x="201" y="310" fill="#1d4ed8" font-size="10.5" font-weight="bold">4.1万行 MD (含0代码的X光精读与统计审查合同)</text>
  <rect x="150" y="318" width="45" height="16" rx="3" fill="#10b981"/>
  <rect x="195" y="318" width="16" height="16" rx="3" fill="#94a3b8"/>
  <text x="217" y="330" fill="#047857" font-size="10.5" font-weight="bold">4.2万运行 + 1.5万测试 (截图转PPT/排版碰撞/下知网)</text>

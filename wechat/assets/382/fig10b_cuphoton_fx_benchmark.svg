<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif">
<rect width="640" height="310" fill="#ffffff"/>
<text x="24" y="34" font-size="18.8" font-weight="bold" fill="#0f172a">射电望远镜 FX 关联器耗时：RX 9070 XT 比 GB10 快整整 2.0 倍</text>
<text x="24" y="68" font-size="14" font-weight="bold" fill="#0f172a">① F 阶段预计算表 FFT ＋ X 阶段共享面板相关全流程耗时（越短越快）</text>
<text x="24" y="95" font-size="12.8" font-weight="normal" fill="#334155">CPU 驻留基线</text>
<rect x="192" y="82" width="255.0" height="17" rx="3.5" fill="#94a3b8"/>
<text x="457.0" y="95" font-size="12.4" font-weight="normal" fill="#334155">1056.03 ms (1.056 s)</text>
<text x="24" y="123" font-size="12.8" font-weight="normal" fill="#334155">NVIDIA GB10 (CUDA)</text>
<rect x="192" y="110" width="9.6" height="17" rx="3.5" fill="#2563eb"/>
<text x="211.6" y="123" font-size="12.4" font-weight="normal" fill="#334155">39.64 ms  (快 CPU 26.6×)</text>
<text x="24" y="151" font-size="12.8" font-weight="bold" fill="#0f172a">AMD RX 9070 XT (HIP)</text>
<rect x="192" y="138" width="8.0" height="17" rx="3.5" fill="#dc2626"/>
<text x="210.0" y="151" font-size="12.4" font-weight="bold" fill="#0f172a">19.81 ms  (快 CPU 53.3×，快 GB10 2.00×)</text>
<text x="24" y="188" font-size="14" font-weight="bold" fill="#0f172a">② 单看 X 阶段：120 基线复数共轭交叉相关累加耗时</text>
<text x="24" y="215" font-size="12.8" font-weight="normal" fill="#334155">CPU 驻留基线</text>
<rect x="192" y="202" width="255.0" height="17" rx="3.5" fill="#94a3b8"/>
<text x="457.0" y="215" font-size="12.4" font-weight="normal" fill="#334155">849.00 ms</text>
<text x="24" y="243" font-size="12.8" font-weight="normal" fill="#334155">NVIDIA GB10 (CUDA)</text>
<rect x="192" y="230" width="8.0" height="17" rx="3.5" fill="#2563eb"/>
<text x="210.0" y="243" font-size="12.4" font-weight="normal" fill="#334155">22.21 ms  (快 CPU 38.2×)</text>
<text x="24" y="271" font-size="12.8" font-weight="bold" fill="#0f172a">AMD RX 9070 XT (HIP)</text>
<rect x="192" y="258" width="8.0" height="17" rx="3.5" fill="#dc2626"/>
<text x="210.0" y="271" font-size="12.4" font-weight="bold" fill="#0f172a">11.06 ms  (快 CPU 76.8×，快 GB10 2.01×)</text>
<text x="24" y="295" font-size="11.5" fill="#64748b">数据源：6,710 万个 complex128 采样同源 v2 核稳态中位数（5预热7测量，module11）；排版经 Gemini 润色</text>

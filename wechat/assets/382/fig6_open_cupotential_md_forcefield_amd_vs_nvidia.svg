<text x="30" y="381" font-size="17" fill="#263546" font-weight="normal">原子有电荷 q、尺寸 σ、势阱深度 ε；不含键项</text>
<text x="30" y="423" font-size="21" fill="#263546" font-weight="bold">② 融合势能与解析力：F = −∇E</text>
<text x="30" y="455" font-size="19" fill="#263546" font-weight="normal">E_LJ = 4ε[(σ/r)^12 − (σ/r)^6]</text>
<text x="30" y="484" font-size="19" fill="#263546" font-weight="normal">E_RF = k qi qj[1/r + k_rf r² − c_rf]</text>

<text x="30" y="594" font-size="22" fill="#263546" font-weight="bold">② 射线法：奇数次穿边界＝点在细胞内</text>
<text x="30" y="624" font-size="18" fill="#263546" font-weight="normal">③ (细胞ID, 基因ID) 排序 → 游程计数 → CSR</text>
<text x="30" y="653" font-size="16" fill="#8b4b19" font-weight="normal">源码纠偏：atomicAdd 用于网格计数，非基因聚合</text>
<text x="30" y="696" font-size="20" fill="#263546" font-weight="bold">50,000 细胞 × 2,000,000 点 × 500 基因</text>
<text x="30" y="735" font-size="18" fill="#263546" font-weight="normal">索引 + 查询 + 稀疏计数（稳态中位数）</text>
<text x="30" y="773" font-size="18" fill="#263546" font-weight="normal">CPU 单线程编译代码</text>
<rect x="30" y="782" width="420.00" height="18" rx="3" fill="#788897"/>
<text x="465" y="798" font-size="18" fill="#263546" font-weight="normal">272.27 ms</text>
<text x="30" y="838" font-size="18" fill="#263546" font-weight="normal">NVIDIA GB10 · Python 原入口</text>
<rect x="30" y="847" width="14.86" height="18" rx="3" fill="#227eaf"/>
<text x="465" y="863" font-size="18" fill="#263546" font-weight="normal">9.64 ms</text>
<text x="30" y="903" font-size="18" fill="#263546" font-weight="normal">AMD RX 9070 XT · HIP C++</text>
<rect x="30" y="912" width="9.33" height="18" rx="3" fill="#b84040"/>
<text x="465" y="928" font-size="18" fill="#263546" font-weight="normal">6.05 ms</text>
<text x="30" y="970" font-size="21" fill="#263546" font-weight="bold">同源 C++ 入口：计时口径再对齐</text>
<text x="30" y="1002" font-size="18" fill="#263546" font-weight="normal">GB10 5.76 ms；RX 9070 XT 6.05 ms</text>
<text x="30" y="1035" font-size="17" fill="#263546" font-weight="normal">AMD 各阶段：索引 / 查询 / CSR 聚合</text>
<text x="30" y="1066" font-size="20" fill="#a42e34" font-weight="bold">2.39 / 0.92 / 3.77 ms</text>
<text x="30" y="1100" font-size="17" fill="#263546" font-weight="normal">AMD 传入 11.61 ms；回传 1.52 ms（另计）</text>
<text x="30" y="1137" font-size="20" fill="#136d58" font-weight="bold">200 万点归属 + 全部 CSR：逐字节零差异</text>
<text x="30" y="1168" font-size="17" fill="#263546" font-weight="normal">四个输出数组的 SHA256 与 GB10 全部相同</text>
<text x="30" y="1207" font-size="16" fill="#263546" font-weight="normal">float64；输入为同一份二进制；种子 20261123</text>
<text x="30" y="1237" font-size="16" fill="#263546" font-weight="normal">驻留稳态墙钟中位数；传输、冷启动分别记录</text>
<text x="30" y="1267" font-size="16" fill="#263546" font-weight="normal">Python / C++ 入口有开销差异；同源入口单列</text>
<text x="30" y="1307" font-size="19" fill="#263546" font-weight="bold">已真机移植：通用算术 + HIP / hipCUB</text>
<text x="30" y="1337" font-size="16" fill="#263546" font-weight="normal">未用 Tensor Core；不将此结果外推为所有科学库</text>
<text x="30" y="1367" font-size="15" fill="#667789" font-weight="normal">原版 cuspa commit 2df9fa78 · 详细原始数组见 results/</text>

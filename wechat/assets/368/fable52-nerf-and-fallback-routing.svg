<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" width="820" height="490" style="background-color:#ffffff;font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- 总标题 -->
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Fable 5.2 / Mythos 5.2 的「双层锁」：训练期人为封顶 ＋ 推理期偷换老模型</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#4b5563">数据来源：System Card §1.5、§3.2、官方发布博客与 Platform API 拒答回退文档</text>

  <!-- 上半部分：第一道锁（训练期阉割 + 话术穿帮对比） -->
  <g transform="translate(30, 68)">
    <rect x="0" y="0" width="760" height="142" fill="#f8fafc" rx="6" />
    <rect x="0" y="0" width="760" height="4" fill="#dc2626" rx="2" />
    <text x="18" y="26" font-size="14" font-weight="bold" fill="#991b1b">第一道锁（训练阶段）：人为压制 AI 核心研发能力，强行封顶在 Opus 5.5 水平</text>

    <!-- 左侧：被锁死的两项核心能力 -->
    <rect x="16" y="38" width="350" height="90" fill="#fef2f2" rx="5" />
    <rect x="16" y="38" width="4" height="90" fill="#ef4444" rx="2" />
    <text x="30" y="58" font-size="12.5" font-weight="bold" fill="#7f1d1d">训练期专门压制的两项能力（发布博客原文）</text>
    <text x="30" y="79" font-size="11.5" fill="#1f2937">1. 加速器算子优化（Accelerator kernel optimization）</text>
    <text x="30" y="98" font-size="11.5" fill="#1f2937">2. 改进大模型架构（Improving LLM architectures）</text>
    <text x="30" y="117" font-size="11" font-weight="bold" fill="#b91c1c">结果：这两项压在 Opus 5.5 水平（送测早期快照研发更强）</text>

    <!-- 右侧：两份官方文档的穿帮对比 -->
    <rect x="382" y="38" width="362" height="90" fill="#fffbeb" rx="5" />
    <rect x="382" y="38" width="4" height="90" fill="#d97706" rx="2" />
    <text x="396" y="58" font-size="12.5" font-weight="bold" fill="#92400e">为什么要封锁？两份官方文档给出了两套说辞</text>
    <text x="396" y="79" font-size="11.5" fill="#1f2937">● System Card §1.5：担心加速 AI 发展、防范「递归自进化」</text>
    <text x="396" y="98" font-size="11.5" font-weight="bold" fill="#b45309">● API 文档（frontier_llm）一不小心说漏实话：</text>
    <text x="406" y="117" font-size="11" font-weight="bold" fill="#991b1b">「可能帮助开发竞争对手的 AI 模型，违反商业条款」</text>
  </g>

  <!-- 下半部分：第二道锁（推理期三阶段探针 + 四路拦截分流与空扣费） -->
  <g transform="translate(30, 226)">
    <rect x="0" y="0" width="760" height="246" fill="#f8fafc" rx="6" />
    <rect x="0" y="0" width="760" height="4" fill="#2563eb" rx="2" />
    <text x="18" y="26" font-size="14" font-weight="bold" fill="#1e3a8a">第二道锁（推理阶段）：三层分类器审查上下文 ＋ 四类拦截回退老模型与「0 字空扣费」</text>

    <!-- 左侧：三阶段实时探针流水线 -->
    <rect x="16" y="42" width="236" height="188" fill="#eff6ff" rx="5" />
    <rect x="16" y="42" width="4" height="188" fill="#3b82f6" rx="2" />
    <text x="134" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">三阶段实时审查（以 §3.2 网安为例）</text>

    <rect x="28" y="74" width="212" height="42" fill="#ffffff" rx="4" />
    <text x="134" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">第 1 步：线性探针扫内部激活</text>
    <text x="134" y="108" text-anchor="middle" font-size="10" fill="#475569">审查读入上下文的文件、memory 与搜索结果</text>

    <rect x="28" y="124" width="212" height="38" fill="#ffffff" rx="4" />
    <text x="134" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">第 2 步：5.2 自身轻量分类器打分</text>
    <text x="134" y="155" text-anchor="middle" font-size="10" fill="#475569">对探针上报的可疑流量做二次筛查</text>

    <rect x="28" y="170" width="212" height="50" fill="#ffffff" rx="4" />
    <text x="134" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">第 3 步：独立 LLM 分类器终审</text>
    <text x="134" y="202" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="bold">一旦回退：粘性路由约 1 小时沿用老模型</text>
    <text x="134" y="215" text-anchor="middle" font-size="9.5" fill="#64748b">（按前缀哈希 best-effort 路由，旧思考块丢弃）</text>

    <!-- 箭头指向右侧四条分流 -->
    <line x1="254" y1="63" x2="290" y2="63" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)" />
    <line x1="254" y1="111" x2="290" y2="111" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)" />
    <line x1="254" y1="159" x2="290" y2="159" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)" />
    <line x1="254" y1="208" x2="290" y2="208" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)" />

    <!-- 右侧第 1 条：frontier_llm -->
    <rect x="296" y="42" width="448" height="42" fill="#fffbeb" rx="4" />
    <rect x="296" y="42" width="4" height="42" fill="#d97706" rx="2" />
    <text x="308" y="59" font-size="11.5" font-weight="bold" fill="#92400e">① frontier_llm（分布式训练 / 加速卡设计 / 非标芯片算子）</text>
    <text x="308" y="76" font-size="11" font-weight="bold" fill="#b45309">连 Mythos 5.2 一并拦截 → 回退给 Opus 5 ｜ 0 字拒答照扣输入费</text>

    <!-- 右侧第 2 条：bio -->
    <rect x="296" y="90" width="448" height="42" fill="#fffbeb" rx="4" />
    <rect x="296" y="90" width="4" height="42" fill="#d97706" rx="2" />
    <text x="308" y="107" font-size="11.5" font-weight="bold" fill="#92400e">② bio（病毒学 / 毒理学 / 药物与分子设计，连「木马噬菌体」比喻也触发）</text>
    <text x="308" y="124" font-size="11" font-weight="bold" fill="#b45309">Fable 5.2 与 Opus 5.5 拦截 → 回退给 Opus 5 ｜ 0 字拒答照扣输入费</text>

    <!-- 右侧第 3 条：cyber -->
    <rect x="296" y="138" width="448" height="42" fill="#eff6ff" rx="4" />
    <rect x="296" y="138" width="4" height="42" fill="#2563eb" rx="2" />
    <text x="308" y="155" font-size="11.5" font-weight="bold" fill="#1e40af">③ cyber（漏洞利用 / 攻击工具 / 编译后二进制文件漏洞挖掘）</text>
    <text x="308" y="172" font-size="11" font-weight="bold" fill="#1d4ed8">Fable 5.2 拦截 → 直接跨代回退给老模型 Opus 4.8（仅源码查洞放行）</text>

    <!-- 右侧第 4 条：reasoning_extraction -->
    <rect x="296" y="186" width="448" height="44" fill="#fef2f2" rx="4" />
    <rect x="296" y="186" width="4" height="44" fill="#dc2626" rx="2" />
    <text x="308" y="203" font-size="11.5" font-weight="bold" fill="#991b1b">④ reasoning_extraction（防蒸馏：要求输出 &lt;thinking&gt; 或提取推理字段）</text>
    <text x="308" y="220" font-size="11" font-weight="bold" fill="#dc2626">强制开启 Preserved Thinking → 直接拒答（无推荐回退）＋ 0 字照扣输入费</text>
  </g>
</svg>
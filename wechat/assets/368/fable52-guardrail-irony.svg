<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" width="520" height="490" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
  <rect width="520" height="490" fill="#ffffff"/>

  <text x="20" y="32" font-size="15.5" font-weight="bold" fill="#111827">两套话术穿帮与降级自摆乌龙：越堆护栏越漏风</text>
  <text x="20" y="52" font-size="11" fill="#6b7280">训练期压制算子研发 ＋ 推理期分类器回退老模型，结果安全测试反被打穿</text>

  <!-- Section 1: Two Faces -->
  <rect x="20" y="70" width="480" height="196" fill="#f8fafc" rx="6"/>
  <rect x="20" y="70" width="4" height="196" fill="#0f172a" rx="2"/>
  <text x="36" y="94" font-size="12.5" font-weight="bold" fill="#111827">① 前后 24 小时的三份官方材料对账：安全牌坊 vs 商业护城河</text>

  <rect x="36" y="108" width="216" height="68" fill="#eff6ff" rx="4"/>
  <text x="46" y="127" font-size="11.5" font-weight="bold" fill="#1e40af">System Card 第 12 页（立牌坊）</text>
  <text x="46" y="146" font-size="10.5" fill="#374151">压制算子与架构研发、回退 Opus 5，</text>
  <text x="46" y="163" font-size="10.5" fill="#374151">是为了防范「递归自我进化（RSI）」</text>

  <rect x="268" y="108" width="216" height="68" fill="#fef3c7" rx="4"/>
  <text x="278" y="127" font-size="11.5" font-weight="bold" fill="#92400e">API 计费文档（漏真话）</text>
  <text x="278" y="146" font-size="10.5" fill="#374151">frontier_llm：可能帮助开发竞争对手</text>
  <text x="278" y="163" font-size="10.5" fill="#374151">模型，违反商业条款；0 字拒答照扣钱</text>

  <rect x="36" y="188" width="448" height="64" fill="#f1f5f9" rx="4"/>
  <text x="46" y="208" font-size="11.5" font-weight="bold" fill="#0f172a">隔天 11 月 10 日纳斯达克 IPO 路演（自家邀功）</text>
  <text x="46" y="227" font-size="10.5" fill="#374151">前脚禁止付费用户写非标芯片算子、劝退医药研发；后脚吹自家 Mythos 3 天写完</text>
  <text x="46" y="244" font-size="10.5" fill="#64748b">AMD MI355X 算子（PPT 底部小字悄悄缩水：仅跑通单一配置 prefill 预填充）</text>

  <!-- Section 2: Fallback Backfire -->
  <rect x="20" y="284" width="480" height="186" fill="#fef2f2" rx="6"/>
  <rect x="20" y="284" width="4" height="186" fill="#dc2626" rx="2"/>
  <text x="36" y="308" font-size="12.5" font-weight="bold" fill="#991b1b">② Shade 编程间接提示词注入测试（开启注入探针保护，越低越安全）</text>

  <text x="36" y="338" font-size="11.5" fill="#374151">上代 Fable 5.1</text>
  <rect x="145" y="326" width="65" height="16" fill="#16a34a" rx="3"/>
  <text x="218" y="338" font-size="11" font-weight="bold" fill="#15803d">8.70% 被攻破</text>

  <text x="36" y="364" font-size="11.5" fill="#374151">大杯 Opus 5.5</text>
  <rect x="145" y="352" width="83" height="16" fill="#64748b" rx="3"/>
  <text x="236" y="364" font-size="11" fill="#475569">11.13% 被攻破</text>

  <text x="36" y="390" font-size="11.5" font-weight="bold" fill="#991b1b">超大杯 Fable 5.2</text>
  <rect x="145" y="378" width="210" height="16" fill="#dc2626" rx="3"/>
  <text x="363" y="390" font-size="11" font-weight="bold" fill="#b91c1c">28.16%（恶化至 3.24 倍）</text>

  <text x="36" y="422" font-size="10.8" fill="#7f1d1d">• 乌龙真相：收到有效响应的攻击测试中，99.46% 被踢给老模型 Opus 4.8 替班</text>
  <text x="36" y="442" font-size="10.8" fill="#374151">• 5.2 自答的 43 次 0 次被破，替班老模型却被打穿（无探针时总攻破率达 89.82%）</text>
  <text x="36" y="460" font-size="10.3" fill="#6b7280">• 第 6.4.10 节同理：开启安全回退后，配合一般违规滥用的评分反从 1.69 恶化至 2.49</text>
</svg>

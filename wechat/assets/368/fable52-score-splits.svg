<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 550" width="520" height="550" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
  <rect width="520" height="550" fill="#ffffff"/>

  <text x="20" y="32" font-size="15.5" font-weight="bold" fill="#111827">Fable 5.2 跑分表里的三道裂缝：做题状元 vs 开放失血</text>
  <text x="20" y="52" font-size="11" fill="#6b7280">综合跑分登顶（AA v5 得 65 分），但一离开「清晰采分点」优势便迅速瓦解</text>

  <!-- Block 1: Rubric vs Elo -->
  <rect x="20" y="68" width="480" height="140" fill="#f8fafc" rx="6"/>
  <rect x="20" y="68" width="4" height="140" fill="#2563eb" rx="2"/>
  <text x="34" y="91" font-size="12.5" font-weight="bold" fill="#111827">① 同场反差：按细则打勾拿第一，盲评成稿质感反输旧模型</text>

  <text x="34" y="116" font-size="11" fill="#374151">AA-Briefcase 踩点（Rubric）</text>
  <rect x="198" y="104" width="150" height="15" fill="#2563eb" rx="3"/>
  <text x="355" y="116" font-size="10.8" font-weight="bold" fill="#1d4ed8">Fable 5.2：66.1%（第 1）</text>
  <rect x="198" y="123" width="138" height="13" fill="#94a3b8" rx="3"/>
  <text x="343" y="134" font-size="10.5" fill="#475569">Opus 5.5：61.2%</text>

  <text x="34" y="162" font-size="11" fill="#374151">同批项目成稿盲评（Elo）</text>
  <rect x="198" y="150" width="132" height="15" fill="#dc2626" rx="3"/>
  <text x="337" y="162" font-size="10.8" font-weight="bold" fill="#b91c1c">Fable 5.2：1785（倒退）</text>
  <rect x="198" y="169" width="146" height="13" fill="#475569" rx="3"/>
  <text x="351" y="180" font-size="10.5" fill="#111827">Opus 5.5：1800（反超）</text>
  <text x="34" y="198" font-size="10" fill="#6b7280">注：GDPval-AA 盲评（1831）同样输 Opus 5.5（1866）；HealthBench 原始分垫底输 Haiku 5.5</text>

  <!-- Block 2: Weight Space & Rule Discovery -->
  <rect x="20" y="224" width="480" height="148" fill="#f8fafc" rx="6"/>
  <rect x="20" y="224" width="4" height="148" fill="#d97706" rx="2"/>
  <text x="34" y="247" font-size="12.5" font-weight="bold" fill="#111827">② 高维手写权重与无规则摸索：落后于 GPT-6 与 Gemini 4</text>

  <text x="34" y="272" font-size="11" fill="#374151">MIT 禁工具手写 2 万权重</text>
  <rect x="186" y="260" width="160" height="14" fill="#1e293b" rx="3"/>
  <text x="353" y="271" font-size="10.5" font-weight="bold" fill="#111827">GPT-6 Astra：60.7</text>
  <rect x="186" y="278" width="152" height="14" fill="#16a34a" rx="3"/>
  <text x="345" y="289" font-size="10.5" font-weight="bold" fill="#15803d">Gemini 4 Carbon：57.7</text>
  <rect x="186" y="296" width="135" height="14" fill="#d97706" rx="3"/>
  <text x="328" y="307" font-size="10.5" fill="#92400e">Claude Opus 5.5：51.2</text>

  <text x="34" y="334" font-size="10.5" fill="#374151">• ARC-AGI-3 摸索新游戏规则（适配架最高档）：94.9% 输 Astra（98.6%）与 Sol（96.2%）</text>
  <text x="34" y="354" font-size="10.5" fill="#374151">• 法律无幻觉全通率 7.2%（输 Astra 8.6%）｜AutomationBench 51.4%（输 Carbon 53.9%）</text>

  <!-- Block 3: Open-ended Research & Taste -->
  <rect x="20" y="388" width="480" height="144" fill="#fef2f2" rx="6"/>
  <rect x="20" y="388" width="4" height="144" fill="#dc2626" rx="2"/>
  <text x="34" y="411" font-size="12.5" font-weight="bold" fill="#991b1b">③ 开放式科研与创造力实录（据 System Card 第 2、6、8 章）</text>

  <text x="34" y="436" font-size="10.8" fill="#374151"><tspan font-weight="bold" fill="#7f1d1d">• 63% 开放科研早退：</tspan>默认 Medium 档下连一次实验都不跑就直接退出</text>
  <text x="34" y="460" font-size="10.8" fill="#374151"><tspan font-weight="bold" fill="#7f1d1d">• 68% 撑爆 1M 窗口：</tspan>无余量提示时通过率 85.6%，反输 Opus 5.5（91.2%）</text>
  <text x="34" y="484" font-size="10.8" fill="#374151"><tspan font-weight="bold" fill="#7f1d1d">• 内部自评缺科研品味：</tspan>擅长奔向精确目标，不善发现新事实；员工有时切回旧版</text>
  <text x="34" y="508" font-size="10.8" fill="#374151"><tspan font-weight="bold" fill="#7f1d1d">• 性格审计倒退：</tspan>温度（Warmth）、幽默感与创意掌控力均输给上一代 5.1</text>
</svg>

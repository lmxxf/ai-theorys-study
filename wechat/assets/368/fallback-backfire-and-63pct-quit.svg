<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" style="background-color:#ffffff;font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <!-- 总标题 -->
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">机关算尽的反噬：99.46% 回退给 Opus 4.8 反被打穿，发布版 63% 科研直接早退</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#4b5563">数据来源：System Card §5.2.2.1（表 5.2.2.1.A）、§6.4.10、§2.3.3 与 §8.10.1</text>

  <!-- 左图：Shade 编程环境自适应提示词注入测试 -->
  <g transform="translate(30, 72)">
    <rect x="0" y="0" width="365" height="345" fill="#f8fafc" rx="6" />
    <rect x="0" y="0" width="365" height="4" fill="#dc2626" rx="2" />
    <text x="182" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">① 越回退越不安全（§5.2.2.1 提示词注入）</text>
    <text x="182" y="45" text-anchor="middle" font-size="11.5" fill="#475569">Shade 编程环境自适应攻击成功率（越低越安全）</text>

    <!-- 坐标轴 -->
    <line x1="35" y1="215" x2="330" y2="215" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Fable 5.1 -->
    <text x="82" y="118" text-anchor="middle" font-size="10.5" fill="#64748b">无探针 51.9%</text>
    <rect x="52" y="125" width="28" height="90" fill="#cbd5e1" rx="2" />
    <text x="98" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">8.70%</text>
    <rect x="84" y="200" width="28" height="15" fill="#0d9488" rx="2" />
    <text x="82" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Fable 5.1</text>
    <text x="82" y="248" text-anchor="middle" font-size="10" fill="#64748b">（60% 回退）</text>

    <!-- Opus 5.5 -->
    <text x="182" y="113" text-anchor="middle" font-size="10.5" fill="#64748b">无探针 54.6%</text>
    <rect x="152" y="120" width="28" height="95" fill="#cbd5e1" rx="2" />
    <text x="198" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">11.13%</text>
    <rect x="184" y="196" width="28" height="19" fill="#0d9488" rx="2" />
    <text x="182" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Opus 5.5</text>
    <text x="182" y="248" text-anchor="middle" font-size="10" fill="#64748b">（64% 回退）</text>

    <!-- Fable 5.2 -->
    <text x="282" y="65" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">无探针 89.82%</text>
    <rect x="252" y="72" width="28" height="143" fill="#fca5a5" rx="2" />
    <text x="298" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">28.16%</text>
    <rect x="284" y="166" width="28" height="49" fill="#dc2626" rx="2" />
    <text x="282" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Fable 5.2</text>
    <text x="282" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">（99.46% 回退）</text>

    <!-- 底部真相框（不使用 tspan 避免 cairosvg 偏移 bug） -->
    <rect x="16" y="262" width="333" height="70" fill="#fef2f2" rx="4" />
    <text x="182" y="281" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">为什么新旗舰反而比上一代差了 3.2 倍？</text>
    <text x="182" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">Fable 5.2 自己回答的 43 次请求：0 次被攻破（0%）</text>
    <text x="182" y="319" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">被踢给老模型 Opus 4.8 的 99.46%：高达 90.31% 被攻破</text>
  </g>

  <!-- 右图：内部藏满血模型 vs 外部发布版的「早退与撑爆后遗症」 -->
  <g transform="translate(425, 72)">
    <rect x="0" y="0" width="365" height="345" fill="#f8fafc" rx="6" />
    <rect x="0" y="0" width="365" height="4" fill="#d97706" rx="2" />
    <text x="182" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">② 内部满血自用 vs 发布版「早退摆烂」</text>
    <text x="182" y="45" text-anchor="middle" font-size="11.5" fill="#475569">内部留着 AECI 178.78 未公开模型，发布版却频频罢工</text>

    <!-- 指标 1：开放式科研早退率 -->
    <rect x="16" y="62" width="333" height="82" fill="#fffbeb" rx="5" />
    <rect x="16" y="62" width="4" height="82" fill="#d97706" rx="2" />
    <text x="28" y="82" font-size="12" font-weight="bold" fill="#92400e">开放式科研任务：连实验都不跑就直接退出（§2.3.3）</text>
    <rect x="28" y="93" width="220" height="16" fill="#e2e8f0" rx="3" />
    <rect x="28" y="93" width="139" height="16" fill="#d97706" rx="3" />
    <text x="256" y="106" font-size="12" font-weight="bold" fill="#b45309">63% 直接放弃</text>
    <text x="28" y="129" font-size="10.2" fill="#475569">Medium 档 63% 会话未跑实验即早退；研究员有时切回旧模型</text>

    <!-- 指标 2：编程回放留活不干 -->
    <rect x="16" y="156" width="333" height="82" fill="#ffffff" rx="5" />
    <rect x="16" y="156" width="4" height="82" fill="#f59e0b" rx="2" />
    <text x="28" y="176" font-size="12" font-weight="bold" fill="#1e293b">编程会话回放：把明明能做完的需求扔下不管（§2.3.3）</text>
    <text x="28" y="198" font-size="11" fill="#0f766e" font-weight="bold">● 上一代 Fable 5.1 留活未完成率：仅 4%</text>
    <text x="28" y="218" font-size="11" fill="#dc2626" font-weight="bold">● 这一代 Mythos 5.2 未完成率：6% 至 13%（翻了两三倍）</text>

    <!-- 指标 3：ProgramBench 1M 上下文撑爆率 -->
    <rect x="16" y="250" width="333" height="82" fill="#fef2f2" rx="5" />
    <rect x="16" y="250" width="4" height="82" fill="#ef4444" rx="2" />
    <text x="28" y="270" font-size="12" font-weight="bold" fill="#991b1b">ProgramBench 1M 窗口：交卷前把上下文撑爆（§8.10.1）</text>
    <text x="28" y="292" font-size="11" fill="#475569">● Fable 5.1 耗尽率：28% ｜ Opus 5.5 耗尽率：39%</text>
    <text x="28" y="312" font-size="11" font-weight="bold" fill="#dc2626">● Fable 5.2 耗尽率：68% 没交卷就撑爆（85.6% 反输前代）</text>
  </g>
</svg>
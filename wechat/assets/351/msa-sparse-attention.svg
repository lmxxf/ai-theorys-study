<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect width="900" height="650" fill="#fbfbfd" rx="10"/>

  <!-- 标题 -->
  <text x="450" y="32" text-anchor="middle" fill="#1e293b" font-size="20" font-weight="bold">MiniMax 稀疏注意力（MSA）维度缩放与 8192 选 16 块挑块流程</text>
  <text x="450" y="53" text-anchor="middle" fill="#64748b" font-size="13">色条宽度按真实维度比例绘制：Q [8192维] vs K/V [512维 (1/16)] vs K_idx [128维 (1/64)]｜单层 110.89M</text>

  <!-- 顶部输入：6144 维条 -->
  <rect x="180" y="68" width="540" height="32" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
  <text x="450" y="89" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="bold">输入词元向量 x ：[ 6144 维 ]（经 GemmaRMSNorm）</text>

  <!-- ================= 左半屏：轻量索引分支 (仅 3.93M/层) ================= -->
  <rect x="24" y="116" width="388" height="446" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="40" y="138" fill="#0369a1" font-size="13.5" font-weight="bold">① 轻量索引分支（Index Branch · 仅 3.93M/层）</text>

  <!-- stopgrad arrow from input x to Index Branch -->
  <path d="M 280 100 L 200 154" stroke="#0284c7" stroke-width="2" fill="none"/>
  <polygon points="196,156 201,148 206,154" fill="#0284c7"/>
  <rect x="256" y="103" width="128" height="17" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="320" y="115" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="bold">训练加 stopgrad(x)</text>

  <!-- Funnels into Q_idx [512] and K_idx [128] and crossed-out V_idx -->
  <polygon points="80,158 176,158 152,186 104,186" fill="#bae6fd" opacity="0.7"/>
  <text x="128" y="172" text-anchor="middle" fill="#0369a1" font-size="10.5" font-weight="bold">W_q^idx [6144→512]</text>
  <!-- 4 GQA group mini bars (each 12px = 48px total) -->
  <rect x="104" y="186" width="11" height="32" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="116" y="186" width="11" height="32" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="128" y="186" width="11" height="32" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="140" y="186" width="11" height="32" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
  <text x="128" y="233" text-anchor="middle" fill="#0c4a6e" font-size="11.5" font-weight="bold">Q_idx [512维]</text>
  <text x="128" y="248" text-anchor="middle" fill="#475569" font-size="10.2">4 组各 1 头 (128维)</text>

  <!-- K_idx ultra-thin funnel (128 dim = 1 single bar of 12px!) -->
  <polygon points="236,158 316,158 282,186 270,186" fill="#bae6fd" opacity="0.7"/>
  <text x="276" y="172" text-anchor="middle" fill="#0369a1" font-size="10.5" font-weight="bold">W_k^idx [6144→128]</text>
  <rect x="270" y="186" width="12" height="32" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <text x="276" y="233" text-anchor="middle" fill="#0c4a6e" font-size="11.5" font-weight="bold">K_idx [128维]</text>
  <text x="276" y="248" text-anchor="middle" fill="#475569" font-size="10.2">全层仅 1 个共享头</text>

  <!-- Crossed out V_idx showing disable_index_value = 1 -->
  <rect x="338" y="186" width="56" height="32" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="366" y="206" text-anchor="middle" fill="#e11d48" font-size="11" font-weight="bold">无 V_idx</text>
  <line x1="342" y1="190" x2="390" y2="214" stroke="#e11d48" stroke-width="1.8"/>
  <text x="366" y="233" text-anchor="middle" fill="#be123c" font-size="10">省去值投影</text>

  <!-- Arrow down to 8,192 Block Strip & Max-Pooling Bar Chart -->
  <path d="M 128 254 L 196 276" stroke="#0284c7" stroke-width="1.8"/>
  <path d="M 276 254 L 228 276" stroke="#0284c7" stroke-width="1.8"/>

  <!-- Visual 1M Context Strip (8,192 blocks of 128 tokens) with Max-Pooling Peaks -->
  <rect x="40" y="280" width="356" height="148" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="218" y="300" text-anchor="middle" fill="#0c4a6e" font-size="12.5" font-weight="bold">1M 上下文切为 8,192 个块（每块 128 词元）· 块内取 max 点积</text>

  <!-- Draw 14 visual block columns with bar heights showing max dot-product score -->
  <g transform="translate(54, 312)">
    <!-- Block bars: 4 high peaks (blue) + 9 low bars (gray) + 1 forced local block (orange) -->
    <rect x="0" y="34" width="18" height="22" rx="2" fill="#e2e8f0"/>
    <rect x="24" y="6" width="18" height="50" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
    <text x="33" y="4" text-anchor="middle" fill="#0284c7" font-size="9" font-weight="bold">★</text>
    <rect x="48" y="38" width="18" height="18" rx="2" fill="#e2e8f0"/>
    <rect x="72" y="42" width="18" height="14" rx="2" fill="#e2e8f0"/>
    <rect x="96" y="10" width="18" height="46" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
    <text x="105" y="8" text-anchor="middle" fill="#0284c7" font-size="9" font-weight="bold">★</text>
    <rect x="120" y="36" width="18" height="20" rx="2" fill="#e2e8f0"/>
    <rect x="144" y="14" width="18" height="42" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
    <text x="153" y="12" text-anchor="middle" fill="#0284c7" font-size="9" font-weight="bold">★</text>
    <rect x="168" y="40" width="18" height="16" rx="2" fill="#e2e8f0"/>
    <rect x="192" y="32" width="18" height="24" rx="2" fill="#e2e8f0"/>
    <rect x="216" y="8" width="18" height="48" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
    <text x="225" y="6" text-anchor="middle" fill="#0284c7" font-size="9" font-weight="bold">★</text>
    <rect x="240" y="40" width="18" height="16" rx="2" fill="#e2e8f0"/>
    <rect x="264" y="36" width="18" height="20" rx="2" fill="#e2e8f0"/>
    <rect x="288" y="38" width="18" height="18" rx="2" fill="#e2e8f0"/>
    <!-- Forced Local Block at the end -->
    <rect x="312" y="4" width="18" height="52" rx="2" fill="#fb923c" stroke="#ea580c" stroke-width="1.5"/>
    <text x="321" y="2" text-anchor="middle" fill="#c2410c" font-size="8.5" font-weight="bold">局部</text>
    <line x1="-4" y1="56" x2="334" y2="56" stroke="#94a3b8" stroke-width="1.2"/>
  </g>
  <text x="218" y="390" text-anchor="middle" fill="#0369a1" font-size="10.8" font-weight="bold">M_{i,b} = max( Q_idx · K_idx / √128 ) → 免算 exp 直接寄存器 Top-K</text>
  <text x="218" y="410" text-anchor="middle" fill="#64748b" font-size="11">每组选出 k = 16 个块（15 个历史高分蓝块 ＋ 1 个强制局部橙块）</text>

  <path d="M 218 428 L 218 450" stroke="#0284c7" stroke-width="2"/>
  <polygon points="218,454 213,447 223,447" fill="#0284c7"/>

  <!-- Selected 16 Blocks Compact Bar -->
  <rect x="52" y="456" width="332" height="86" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="218" y="478" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="bold">每组输出 Top-16 块索引 I_i^{(r)}（共 2,048 词元）</text>
  <!-- 15 blue + 1 orange mini blocks -->
  <g transform="translate(66, 488)">
    <rect x="0" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="19" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="38" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="57" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="76" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="95" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="114" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="133" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="152" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="171" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="190" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="209" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="228" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="247" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="266" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="285" y="0" width="16" height="18" rx="2" fill="#fb923c"/>
  </g>
  <text x="218" y="528" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="bold">仅占 1M 总长度的 0.2%（训练时用 KL 散度向主分支注意力对齐）</text>

  <!-- ================= 右半屏：16:1 GQA 主注意力分支 (106.95M/层) ================= -->
  <rect x="436" y="116" width="440" height="446" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <text x="454" y="138" fill="#b45309" font-size="13.5" font-weight="bold">② 主注意力分支（Main Branch · 16:1 GQA · 106.95M/层）</text>

  <!-- Q Expanding Funnel: 6144 -> 8192 (width 240px) -->
  <polygon points="480,152 640,152 680,186 456,186" fill="#dbeafe" opacity="0.6"/>
  <path d="M 560 100 L 560 182" stroke="#2563eb" stroke-width="2" fill="none"/>
  <polygon points="560,186 555,178 565,178" fill="#2563eb"/>
  <rect x="488" y="146" width="148" height="18" rx="3" fill="#ffffff"/>
  <text x="562" y="159" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">W_q [6144 → 8192] (50.3M)</text>

  <rect x="456" y="186" width="224" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="568" y="203" text-anchor="middle" fill="#1e3a8a" font-size="12.5" font-weight="bold">Q ：[ 8192 维 ]（64 头 × 128 维）</text>
  <text x="568" y="217" text-anchor="middle" fill="#1e40af" font-size="10">逐头 q_norm ＋ 半维 RoPE (64维, θ=1000万)</text>

  <!-- K & V Narrowing Funnels: 6144 -> 512 (1/16 width of Q = 16px!) -->
  <polygon points="704,152 772,152 746,186 730,186" fill="#ccfbf1" opacity="0.7"/>
  <text x="738" y="162" text-anchor="middle" fill="#0f766e" font-size="10.2" font-weight="bold">W_k [→512]</text>
  <rect x="730" y="186" width="16" height="36" rx="3" fill="#99f6e4" stroke="#0d9488" stroke-width="1.8"/>
  <text x="738" y="208" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="bold">K</text>
  <text x="738" y="236" text-anchor="middle" fill="#0f766e" font-size="10.5" font-weight="bold">[512维]</text>
  <text x="738" y="250" text-anchor="middle" fill="#64748b" font-size="9.8">4头 (1/16宽)</text>

  <polygon points="788,152 856,152 830,186 814,186" fill="#ccfbf1" opacity="0.7"/>
  <text x="822" y="162" text-anchor="middle" fill="#0f766e" font-size="10.2" font-weight="bold">W_v [→512]</text>
  <rect x="814" y="186" width="16" height="36" rx="3" fill="#99f6e4" stroke="#0d9488" stroke-width="1.8"/>
  <text x="822" y="208" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="bold">V</text>
  <text x="822" y="236" text-anchor="middle" fill="#0f766e" font-size="10.5" font-weight="bold">[512维]</text>
  <text x="822" y="250" text-anchor="middle" fill="#64748b" font-size="9.8">4头 (存缓存)</text>

  <!-- Sparse Gather Box: Only pull the 16 selected blocks (2,048 tokens) from K & V -->
  <path d="M 384 496 L 422 496 L 422 316 L 452 316" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="456,316 448,311 448,321" fill="#0284c7"/>

  <path d="M 738 254 L 738 280" stroke="#0d9488" stroke-width="1.8"/>
  <path d="M 822 254 L 822 280" stroke="#0d9488" stroke-width="1.8"/>

  <rect x="456" y="282" width="400" height="68" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.8"/>
  <text x="656" y="304" text-anchor="middle" fill="#854d0e" font-size="12.5" font-weight="bold">按块索引 I_i^{(r)} 从显存仅捞出 16 个 KV 块（2,048 词元）</text>
  <text x="656" y="324" text-anchor="middle" fill="#713f12" font-size="11.5" font-weight="bold">O = Softmax( Q · K[I_i]^T / √128 ) · V[I_i]</text>
  <text x="656" y="342" text-anchor="middle" fill="#64748b" font-size="10.5">KV-outer 逆向内核：热门 KV 块聚合多个 Q 填满 Tensor Core｜计算降 28.4×</text>

  <!-- Broadcast back to 8192 wide bar -> Funnel down to 6144 output -->
  <path d="M 568 222 L 568 282" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4,2"/>
  <path d="M 656 350 L 656 378" stroke="#ca8a04" stroke-width="2"/>
  <polygon points="656,382 651,375 661,375" fill="#ca8a04"/>

  <rect x="456" y="384" width="400" height="32" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="656" y="405" text-anchor="middle" fill="#713f12" font-size="12.5" font-weight="bold">64 个头拼接恢复全宽 ：[ 8192 维 ]（无额外 gate_proj 门控）</text>

  <!-- Funnel from 8192 (400px) down to 6144 (320px) via W_o -->
  <polygon points="456,416 856,416 816,476 496,476" fill="#ede9fe" opacity="0.7"/>
  <text x="656" y="452" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="bold">右乘输出矩阵 W_o [8192 → 6144] (50.3M, MXFP8)</text>

  <rect x="496" y="476" width="320" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="656" y="499" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="bold">注意力层输出 ：[ 6144 维 ] → 残差相加</text>

  <text x="656" y="536" text-anchor="middle" fill="#64748b" font-size="11.5">单层总计：主分支 106.95M ＋ 索引分支 3.93M = 110.89M（60 层共 6.65B）</text>

  <!-- 底部总对比栏：静态存储 vs 动态读取带宽 -->
  <rect x="24" y="576" width="852" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="598" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">★ 1M 上下文显存对比：静态存储需存全量（主 KV 1024 + 索引 K 128 = 1152 数/词/层，FP8 下 60 层占 67.5 GiB）</text>
  <text x="450" y="618" text-anchor="middle" fill="#047857" font-size="12.5" font-weight="bold">★ 动态解码带宽暴省 99.8%：每步主分支仅从 60 GiB 主 KV 中按块读取 2,048 词元（约 120 MiB），H800 解码提速 7.6×</text>
</svg>

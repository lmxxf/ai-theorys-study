<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <rect width="900" height="650" fill="#fbfbfd" rx="10"/>

  <!-- 标题 -->
  <text x="450" y="32" text-anchor="middle" fill="#1e293b" font-size="20" font-weight="bold">MiniMax 稀疏注意力（MSA）：外挂索引器先挑块 → 正牌 16:1 GQA 再精读</text>
  <text x="450" y="53" text-anchor="middle" fill="#64748b" font-size="13">左路索引器只输出“16 个块编号名单”（不输出特征）｜右路正牌 GQA 按名单从显存捞块算特征</text>

  <!-- 顶部输入：6144 维条 -->
  <rect x="180" y="68" width="540" height="32" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
  <text x="450" y="89" text-anchor="middle" fill="#0f172a" font-size="13.5" font-weight="bold">输入词元向量 x ：[ 6144 维 ]（经 GemmaRMSNorm）</text>

  <!-- ================= 左半屏：第一棒 外挂挑块索引器 (仅 3.93M/层) ================= -->
  <rect x="24" y="122" width="388" height="440" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5,3"/>
  <rect x="24" y="122" width="388" height="30" rx="6" fill="#e0f2fe"/>
  <text x="218" y="142" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">第一棒：外挂挑块索引器（仅 3.93M · 只吐块编号）</text>

  <!-- stopgrad arrow from input x to Indexer -->
  <path d="M 280 100 L 218 120" stroke="#0284c7" stroke-width="2" fill="none"/>
  <polygon points="214,122 220,115 223,121" fill="#0284c7"/>
  <rect x="262" y="102" width="128" height="17" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="326" y="114" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="bold">训练加 stopgrad(x)</text>

  <!-- Funnels into Q_idx [512] and K_idx [128] and crossed-out V_idx/O_idx -->
  <polygon points="76,160 172,160 148,188 100,188" fill="#bae6fd" opacity="0.7"/>
  <text x="124" y="174" text-anchor="middle" fill="#0369a1" font-size="10.5" font-weight="bold">W_q^idx [6144→512]</text>
  <rect x="100" y="188" width="11" height="32" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="112" y="188" width="11" height="32" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="124" y="188" width="11" height="32" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
  <rect x="136" y="188" width="11" height="32" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
  <text x="124" y="235" text-anchor="middle" fill="#0c4a6e" font-size="11.5" font-weight="bold">Q_idx [512维]</text>
  <text x="124" y="250" text-anchor="middle" fill="#475569" font-size="10.2">替 4 个 GQA 组各派 1 头</text>

  <!-- K_idx ultra-thin funnel (128 dim = 1 single bar of 12px!) -->
  <polygon points="228,160 308,160 274,188 262,188" fill="#bae6fd" opacity="0.7"/>
  <text x="268" y="174" text-anchor="middle" fill="#0369a1" font-size="10.5" font-weight="bold">W_k^idx [6144→128]</text>
  <rect x="262" y="188" width="12" height="32" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <text x="268" y="235" text-anchor="middle" fill="#0c4a6e" font-size="11.5" font-weight="bold">K_idx [128维]</text>
  <text x="268" y="250" text-anchor="middle" fill="#475569" font-size="10.2">全层仅 1 个共享键头</text>

  <!-- Crossed out V_idx / O_idx -->
  <rect x="330" y="188" width="66" height="32" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="363" y="208" text-anchor="middle" fill="#e11d48" font-size="10.5" font-weight="bold">无 V / 无 O</text>
  <line x1="334" y1="192" x2="392" y2="216" stroke="#e11d48" stroke-width="1.8"/>
  <text x="363" y="235" text-anchor="middle" fill="#be123c" font-size="10">不产出特征向量</text>

  <!-- Arrow down to 8,192 Block Strip & Max-Pooling Bar Chart -->
  <path d="M 124 256 L 196 278" stroke="#0284c7" stroke-width="1.8"/>
  <path d="M 268 256 L 228 278" stroke="#0284c7" stroke-width="1.8"/>

  <!-- Visual 1M Context Strip (8,192 blocks of 128 tokens) with Max-Pooling Peaks -->
  <rect x="40" y="282" width="356" height="146" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="218" y="302" text-anchor="middle" fill="#0c4a6e" font-size="12" font-weight="bold">1M 历史切为 8,192 块（128 词/块）· 块内取 max 点积</text>

  <g transform="translate(54, 314)">
    <rect x="0" y="34" width="18" height="22" rx="2" fill="#e2e8f0"/>
    <rect x="24" y="6" width="18" height="50" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
    <text x="33" y="4" text-anchor="middle" fill="#0284c7" font-size="9" font-weight="bold">★</text>
    <rect x="48" y="38" width="18" height="18" rx="2" fill="#e2e8f0"/>
    <rect x="72" y="42" width="18" height="14" rx="2" fill="#e2e8f0"/>
    <rect x="96" y="10" width="18" height="46" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
    <text x="105" y="8" text-anchor="middle" fill="#0284c7" font-size="9" font-weight="bold">★</text>
    <rect x="120" y="36" width="18" height="20" rx="2" fill="#e2e8f0"/>
    <rect x="144" y="14" width="18" height="42" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
    <text x="153" y="12" text-anchor="middle" fill="#0284c7" font-size="9" font-weight="bold">★</text>
    <rect x="168" y="40" width="18" height="16" rx="2" fill="#e2e8f0"/>
    <rect x="192" y="32" width="18" height="24" rx="2" fill="#e2e8f0"/>
    <rect x="216" y="8" width="18" height="48" rx="2" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
    <text x="225" y="6" text-anchor="middle" fill="#0284c7" font-size="9" font-weight="bold">★</text>
    <rect x="240" y="40" width="18" height="16" rx="2" fill="#e2e8f0"/>
    <rect x="264" y="36" width="18" height="20" rx="2" fill="#e2e8f0"/>
    <rect x="288" y="38" width="18" height="18" rx="2" fill="#e2e8f0"/>
    <!-- Forced Incomplete Self Block at the end -->
    <rect x="312" y="18" width="18" height="38" rx="2" fill="#fb923c" stroke="#ea580c" stroke-width="1.5"/>
    <text x="321" y="14" text-anchor="middle" fill="#c2410c" font-size="8.5" font-weight="bold">尾块</text>
    <line x1="-4" y1="56" x2="334" y2="56" stroke="#94a3b8" stroke-width="1.2"/>
  </g>
  <text x="218" y="391" text-anchor="middle" fill="#0369a1" font-size="10.8" font-weight="bold">M_{i,b} = max( Q_idx · K_idx / √128 ) → 免算 exp 寄存器 Top-K</text>
  <text x="218" y="411" text-anchor="middle" fill="#64748b" font-size="10.5">每组挑 15 个历史高分蓝块 ＋ 强制保送最后 1 个未满自身橙块</text>

  <path d="M 218 428 L 218 450" stroke="#0284c7" stroke-width="2"/>
  <polygon points="218,454 213,447 223,447" fill="#0284c7"/>

  <!-- Selected 16 Block IDs Output (Directory Only!) -->
  <rect x="48" y="456" width="340" height="88" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
  <text x="218" y="477" text-anchor="middle" fill="#0c4a6e" font-size="12.5" font-weight="bold">索引器任务完成：仅输出 4 份“16 个块编号名单”</text>
  <g transform="translate(66, 487)">
    <rect x="0" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="19" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="38" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="57" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="76" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="95" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="114" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="133" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="152" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="171" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="190" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="209" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="228" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="247" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="266" y="0" width="16" height="18" rx="2" fill="#38bdf8"/><rect x="285" y="0" width="16" height="18" rx="2" fill="#fb923c"/>
  </g>
  <text x="218" y="527" text-anchor="middle" fill="#0369a1" font-size="10.8" font-weight="bold">把块编号递给右边正牌 GQA 后即下班（不参与后续特征加法）</text>

  <!-- ================= 右半屏：第二棒 正牌 16:1 GQA 注意力 (106.95M/层) ================= -->
  <rect x="436" y="122" width="440" height="440" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <rect x="436" y="122" width="440" height="30" rx="6" fill="#fef3c7"/>
  <text x="656" y="142" text-anchor="middle" fill="#b45309" font-size="13" font-weight="bold">第二棒：正牌 16:1 GQA 注意力（106.95M · 按名单精读）</text>

  <!-- Q Expanding Funnel: 6144 -> 8192 (width 224px) -->
  <polygon points="480,158 640,158 680,188 456,188" fill="#dbeafe" opacity="0.6"/>
  <path d="M 560 100 L 560 184" stroke="#2563eb" stroke-width="2" fill="none"/>
  <polygon points="560,188 555,180 565,180" fill="#2563eb"/>
  <rect x="488" y="154" width="148" height="17" rx="3" fill="#ffffff"/>
  <text x="562" y="166" text-anchor="middle" fill="#1e40af" font-size="10.8" font-weight="bold">W_q [6144 → 8192] (50.3M)</text>

  <rect x="456" y="188" width="224" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="568" y="205" text-anchor="middle" fill="#1e3a8a" font-size="12.5" font-weight="bold">Q ：[ 8192 维 ]（64 头 × 128 维）</text>
  <text x="568" y="219" text-anchor="middle" fill="#1e40af" font-size="10">分 4 组（每组 16 头）｜半维 RoPE (θ=1000万)</text>

  <!-- K & V Narrowing Funnels: 6144 -> 512 (1/16 width of Q = 16px!) -->
  <polygon points="704,158 772,158 746,188 730,188" fill="#ccfbf1" opacity="0.7"/>
  <text x="738" y="168" text-anchor="middle" fill="#0f766e" font-size="10.2" font-weight="bold">W_k [→512]</text>
  <rect x="730" y="188" width="16" height="36" rx="3" fill="#99f6e4" stroke="#0d9488" stroke-width="1.8"/>
  <text x="738" y="210" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="bold">K</text>
  <text x="738" y="238" text-anchor="middle" fill="#0f766e" font-size="10.5" font-weight="bold">[512维]</text>
  <text x="738" y="252" text-anchor="middle" fill="#64748b" font-size="9.8">4头 (1/16宽)</text>

  <polygon points="788,158 856,158 830,188 814,188" fill="#ccfbf1" opacity="0.7"/>
  <text x="822" y="168" text-anchor="middle" fill="#0f766e" font-size="10.2" font-weight="bold">W_v [→512]</text>
  <rect x="814" y="188" width="16" height="36" rx="3" fill="#99f6e4" stroke="#0d9488" stroke-width="1.8"/>
  <text x="822" y="210" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="bold">V</text>
  <text x="822" y="238" text-anchor="middle" fill="#0f766e" font-size="10.5" font-weight="bold">[512维]</text>
  <text x="822" y="252" text-anchor="middle" fill="#64748b" font-size="9.8">4头 (存缓存)</text>

  <!-- Handoff Arrow from Left Directory to Right Gather -->
  <path d="M 388 496 L 422 496 L 422 316 L 452 316" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="456,316 448,311 448,321" fill="#0284c7"/>

  <path d="M 738 256 L 738 282" stroke="#0d9488" stroke-width="1.8"/>
  <path d="M 822 256 L 822 282" stroke="#0d9488" stroke-width="1.8"/>

  <rect x="456" y="284" width="400" height="68" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.8"/>
  <text x="656" y="305" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">照着左路递来的块编号，每组仅从显存捞 16 个 KV 块</text>
  <text x="656" y="325" text-anchor="middle" fill="#713f12" font-size="11.5" font-weight="bold">O = Softmax( Q · K[I_i]^T / √128 ) · V[I_i]</text>
  <text x="656" y="343" text-anchor="middle" fill="#64748b" font-size="10.2">尾块未满 128 的空位打 -∞ 因果掩码｜64 个 Q 头各自独立算点积</text>

  <!-- Broadcast back to 8192 wide bar -> Funnel down to 6144 output -->
  <path d="M 568 224 L 568 284" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4,2"/>
  <path d="M 656 352 L 656 380" stroke="#ca8a04" stroke-width="2"/>
  <polygon points="656,384 651,377 661,377" fill="#ca8a04"/>

  <rect x="456" y="386" width="400" height="32" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="656" y="407" text-anchor="middle" fill="#713f12" font-size="12.5" font-weight="bold">64 个头拼接恢复全宽 ：[ 8192 维 ]（无额外出口门控）</text>

  <!-- Funnel from 8192 (400px) down to 6144 (320px) via W_o -->
  <polygon points="456,418 856,418 816,476 496,476" fill="#ede9fe" opacity="0.7"/>
  <text x="656" y="452" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="bold">右乘输出矩阵 W_o [8192 → 6144] (50.3M, MXFP8)</text>

  <rect x="496" y="476" width="320" height="36" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="656" y="499" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="bold">注意力层唯一特征输出 ：[ 6144 维 ]</text>

  <text x="656" y="536" text-anchor="middle" fill="#64748b" font-size="11.5">单层总计：正牌 GQA 106.95M ＋ 外挂索引器 3.93M = 110.89M</text>

  <!-- 底部总对比栏：静态存储 vs 动态读取带宽 -->
  <rect x="24" y="576" width="852" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="598" text-anchor="middle" fill="#1e293b" font-size="12.5" font-weight="bold">★ 1M 显存对比：静态存储需存全量（主 KV 1024 + 索引 K 128 = 1152 数/词/层，FP8 下 60 层占 67.5 GiB）</text>
  <text x="450" y="618" text-anchor="middle" fill="#047857" font-size="12" font-weight="bold">★ 解码读取：第一棒全扫 7.5 GiB 索引 K ＋ 第二棒仅读 120 MiB 主 KV（主 KV 降 99.8%，总读取 7.62 vs 60 GiB 降 87.3%）</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#222">
  <rect width="960" height="600" fill="#fafafa"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold">9070 XT 里面长什么样：从显存到 wave</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#666">上面三层全卡共享；下面展开其中一个 WGP，全卡一共 32 个，结构都一样。</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  </defs>

  <!-- shared memory hierarchy -->
  <rect x="40" y="66" width="640" height="26" rx="5" fill="#eeeeee" stroke="#999"/>
  <text x="360" y="84" text-anchor="middle">显存（GDDR6） · 16 GB · 640 GB/s · 最大也最慢</text>
  <rect x="40" y="100" width="640" height="26" rx="5" fill="#e8eef6" stroke="#8aa0bf"/>
  <text x="360" y="118" text-anchor="middle">Infinity Cache · 64 MB · 全卡共享，L2 没命中再来这儿</text>
  <rect x="40" y="134" width="640" height="26" rx="5" fill="#dfe8f5" stroke="#6f8fbf"/>
  <text x="360" y="152" text-anchor="middle">L2 · 8 MB · 全卡共享，所有计算单元都从这儿取</text>

  <!-- one WGP -->
  <rect x="40" y="178" width="640" height="374" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="54" y="197" font-size="13" font-weight="bold">一个 WGP（工作组处理器） · 两个计算单元配一对</text>


  <!-- CU boxes -->
  <rect x="58" y="206" width="294" height="258" rx="6" fill="#f7f7f7" stroke="#999"/>
  <rect x="368" y="206" width="294" height="258" rx="6" fill="#f7f7f7" stroke="#999"/>
  <text x="68" y="224" font-size="12" fill="#444">计算单元（CU）0</text>
  <text x="378" y="224" font-size="12" fill="#444">计算单元（CU）1</text>

  <!-- L0 bars -->
  <rect x="70" y="238" width="270" height="24" rx="4" fill="#d3e4f7" stroke="#5a86bd"/>
  <text x="205" y="255" text-anchor="middle" font-size="11">L0 · 几十 KB · 这个计算单元专用</text>
  <rect x="380" y="238" width="270" height="24" rx="4" fill="#d3e4f7" stroke="#5a86bd"/>
  <text x="515" y="255" text-anchor="middle" font-size="11">L0 · 几十 KB · 这个计算单元专用</text>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M205 160 V236"/>
    <path d="M515 160 V236"/>
  </g>

  <!-- SIMD boxes -->
  <g fill="#ffffff" stroke="#888">
    <rect x="70" y="272" width="130" height="184" rx="5"/>
    <rect x="210" y="272" width="130" height="184" rx="5"/>
    <rect x="380" y="272" width="130" height="184" rx="5"/>
    <rect x="520" y="272" width="130" height="184" rx="5"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="135" y="290">SIMD32</text>
    <text x="275" y="290">SIMD32</text>
    <text x="445" y="290">SIMD32</text>
    <text x="585" y="290">SIMD32</text>
  </g>
  <g font-size="10" fill="#777" text-anchor="middle">
    <text x="135" y="304">32 个车道，一次一条指令</text>
    <text x="275" y="304">32 个车道，一次一条指令</text>
    <text x="445" y="304">32 个车道，一次一条指令</text>
    <text x="585" y="304">32 个车道，一次一条指令</text>
  </g>

  <!-- wave slots: other waves (gray) -->
  <g fill="#e2e2e2" stroke="#aaa">
    <!-- CU0 SIMD A: first two orange, rest gray -->
    <rect x="80" y="362" width="52" height="20" rx="3"/><rect x="138" y="362" width="52" height="20" rx="3"/>
    <rect x="80" y="386" width="52" height="20" rx="3"/><rect x="138" y="386" width="52" height="20" rx="3"/>
    <rect x="80" y="338" width="52" height="20" rx="3"/><rect x="138" y="338" width="52" height="20" rx="3"/>
    <!-- CU0 SIMD B -->
    <rect x="220" y="338" width="52" height="20" rx="3"/><rect x="278" y="338" width="52" height="20" rx="3"/>
    <rect x="220" y="362" width="52" height="20" rx="3"/><rect x="278" y="362" width="52" height="20" rx="3"/>
    <rect x="220" y="386" width="52" height="20" rx="3"/><rect x="278" y="386" width="52" height="20" rx="3"/>
    <!-- CU1 both SIMDs: 8 each -->
    <rect x="390" y="314" width="52" height="20" rx="3"/><rect x="448" y="314" width="52" height="20" rx="3"/>
    <rect x="390" y="338" width="52" height="20" rx="3"/><rect x="448" y="338" width="52" height="20" rx="3"/>
    <rect x="390" y="362" width="52" height="20" rx="3"/><rect x="448" y="362" width="52" height="20" rx="3"/>
    <rect x="390" y="386" width="52" height="20" rx="3"/><rect x="448" y="386" width="52" height="20" rx="3"/>
    <rect x="530" y="314" width="52" height="20" rx="3"/><rect x="588" y="314" width="52" height="20" rx="3"/>
    <rect x="530" y="338" width="52" height="20" rx="3"/><rect x="588" y="338" width="52" height="20" rx="3"/>
    <rect x="530" y="362" width="52" height="20" rx="3"/><rect x="588" y="362" width="52" height="20" rx="3"/>
    <rect x="530" y="386" width="52" height="20" rx="3"/><rect x="588" y="386" width="52" height="20" rx="3"/>
  </g>
  <!-- one C32 workgroup = 4 waves on CU0 (orange) -->
  <g fill="#f6c89a" stroke="#d9822b" stroke-width="1.5">
    <rect x="80" y="314" width="52" height="20" rx="3"/><rect x="138" y="314" width="52" height="20" rx="3"/>
    <rect x="220" y="314" width="52" height="20" rx="3"/><rect x="278" y="314" width="52" height="20" rx="3"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="106" y="328">wave</text><text x="164" y="328">wave</text>
    <text x="246" y="328">wave</text><text x="304" y="328">wave</text>
  </g>
  <g font-size="10" fill="#777" text-anchor="middle">
    <text x="135" y="424">每个 wave 的寄存器</text>
    <text x="135" y="438">也住在这个 SIMD 里</text>
    <text x="275" y="424">每个 wave 的寄存器</text>
    <text x="275" y="438">也住在这个 SIMD 里</text>
    <text x="445" y="424">每个 wave 的寄存器</text>
    <text x="445" y="438">也住在这个 SIMD 里</text>
    <text x="585" y="424">每个 wave 的寄存器</text>
    <text x="585" y="438">也住在这个 SIMD 里</text>
  </g>

  <!-- LDS -->
  <rect x="58" y="490" width="604" height="50" rx="6" fill="#fdf1e4" stroke="#d9822b"/>
  <line x1="360" y1="494" x2="360" y2="536" stroke="#d9822b" stroke-dasharray="4 3"/>
  <text x="360" y="482" text-anchor="middle" font-size="11" fill="#555">共享内存（LDS） · 128 KB · 两个计算单元合用，各靠一半</text>
  <text x="209" y="511" text-anchor="middle">CU 0 这一半 · 64 KB</text>
  <text x="209" y="529" text-anchor="middle" font-size="10" fill="#8a5a1f">橙色工作组分到其中一段，只有组内 4 个 wave 看得见</text>
  <text x="511" y="511" text-anchor="middle">CU 1 这一半 · 64 KB</text>
  <text x="511" y="529" text-anchor="middle" font-size="10" fill="#8a5a1f">别的工作组各分各的段</text>

  <!-- right panel -->
  <g font-size="12">
    <text x="706" y="84" font-weight="bold">怎么数到 4096</text>
    <text x="706" y="106">32 个 WGP</text>
    <text x="706" y="126">× 2 个计算单元 = 64 个 CU</text>
    <text x="706" y="146">× 2 个 SIMD32 = 128 个 SIMD</text>
    <text x="706" y="166">× 32 个车道 = 4096 个流处理器</text>

    <rect x="706" y="192" width="18" height="12" rx="2" fill="#f6c89a" stroke="#d9822b"/>
    <text x="730" y="203" font-weight="bold">一个工作组（C32）</text>
    <text x="706" y="224">4 个 wave、128 个线程，</text>
    <text x="706" y="242">管一个 8×8 窗口。</text>
    <text x="706" y="260">CU 模式：4 个 wave 都钉在</text>
    <text x="706" y="278">同一个计算单元里。</text>

    <text x="706" y="310" font-weight="bold">一个 wave</text>
    <text x="706" y="330">32 个线程一捆，</text>
    <text x="706" y="348">听同一个口令。</text>

    <rect x="706" y="372" width="18" height="12" rx="2" fill="#e2e2e2" stroke="#aaa"/>
    <text x="730" y="383" font-weight="bold">驻留</text>
    <text x="706" y="404">一个 SIMD 上同时挂好几个</text>
    <text x="706" y="422">wave（这里画 8 个）。一个在</text>
    <text x="706" y="440">等数据，下一周期就切去跑</text>
    <text x="706" y="458">另一个，把等待盖住。</text>

    <text x="706" y="490" font-weight="bold">数据怎么上来</text>
    <text x="706" y="510">显存 → Infinity Cache → L2</text>
    <text x="706" y="528">→ L0 → 寄存器：硬件自动搬。</text>
    <text x="706" y="546">共享内存：程序自己搬进搬出。</text>
  </g>
</svg>

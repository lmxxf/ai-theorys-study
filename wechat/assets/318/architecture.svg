<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#222">
  <rect width="960" height="640" fill="#fafafa"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold">DLSS 5（DLSSNR）71 块的 U 形结构：C 后面的数字是通道数</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#666">左边下坡：分辨率减半、通道翻倍；右边上坡反过来。同一行两侧用同一套核源码，权重各是各的。</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  </defs>

  <!-- skip connections (dashed), drawn first so boxes sit on top -->
  <g stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <path d="M310 98 H650"/>
    <path d="M310 170 H650"/>
    <path d="M310 242 H650"/>
    <path d="M310 314 H650"/>
    <path d="M310 386 H650"/>
    <path d="M310 458 H650"/>
  </g>
  <text x="480" y="89" text-anchor="middle" font-size="11" fill="#999">虚线：跳接（skip），下坡输出拼进同一行上坡块</text>

  <!-- C32 family (orange) -->
  <g stroke="#d9822b" stroke-width="1.5" fill="#fdf1e4">
    <rect x="80" y="76" width="230" height="44" rx="6"/>
    <rect x="650" y="76" width="230" height="44" rx="6"/>
    <rect x="98" y="148" width="212" height="44" rx="6"/>
    <rect x="650" y="148" width="212" height="44" rx="6"/>
  </g>
  <!-- multihead C64/128/256 (blue) -->
  <g stroke="#3b6fb6" stroke-width="1.5" fill="#e7eefb">
    <rect x="116" y="220" width="194" height="44" rx="6"/>
    <rect x="650" y="220" width="194" height="44" rx="6"/>
    <rect x="134" y="292" width="176" height="44" rx="6"/>
    <rect x="650" y="292" width="176" height="44" rx="6"/>
    <rect x="152" y="364" width="158" height="44" rx="6"/>
    <rect x="650" y="364" width="158" height="44" rx="6"/>
  </g>
  <!-- C512 split (green) -->
  <g stroke="#3a9a5b" stroke-width="1.5" fill="#e6f5ea">
    <rect x="160" y="436" width="150" height="44" rx="6"/>
    <rect x="650" y="436" width="150" height="44" rx="6"/>
  </g>
  <!-- ViT (purple) -->
  <rect x="330" y="506" width="300" height="50" rx="6" stroke="#8a4fb5" stroke-width="1.5" fill="#f1e8f8"/>

  <!-- block texts: line 1 = blocks, line 2 = resolution -->
  <g font-size="12" text-anchor="middle">
    <text x="195" y="95">块 0　C32　pre</text>
    <text x="204" y="167">块 1–4　C32 ×4</text>
    <text x="213" y="239">块 5–8　C64 ×4</text>
    <text x="222" y="311">块 9–14　C128 ×6</text>
    <text x="231" y="383">块 15–22　C256 ×8</text>
    <text x="235" y="455">块 23–30　C512 ×8</text>

    <text x="765" y="95">块 70　C32　post</text>
    <text x="756" y="167">块 66–69　C32 ×4</text>
    <text x="747" y="239">块 62–65　C64 ×4</text>
    <text x="738" y="311">块 56–61　C128 ×6</text>
    <text x="729" y="383">块 48–55　C256 ×8</text>
    <text x="725" y="455">块 40–47　C512 ×8</text>

    <text x="480" y="527">块 31–38　ViT ×8　全局注意力（640 个 token 互相看）</text>
  </g>
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="195" y="112">1920×1152 · 34,560 个窗口</text>
    <text x="204" y="184">960×576 · 8,640 个窗口</text>
    <text x="213" y="256">480×288 · 2,160 个窗口</text>
    <text x="222" y="328">240×144 · 540 个窗口</text>
    <text x="231" y="400">120×72 · 135 个窗口</text>
    <text x="235" y="472">60×36 · 补齐后约 40 个</text>

    <text x="765" y="112">1920×1152 · 34,945 个窗口</text>
    <text x="756" y="184">960×576 · 8,640 个窗口</text>
    <text x="747" y="256">480×288 · 2,160 个窗口</text>
    <text x="738" y="328">240×144 · 540 个窗口</text>
    <text x="729" y="400">120×72 · 135 个窗口</text>
    <text x="725" y="472">60×36 · 补齐后约 40 个</text>

    <text x="480" y="545">640 token × 1024 通道，隐层 1024→4096→1024</text>
  </g>

  <!-- down / up path arrows -->
  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M250 120 V148"/>
    <path d="M250 192 V220"/>
    <path d="M250 264 V292"/>
    <path d="M250 336 V364"/>
    <path d="M250 408 V436"/>
    <path d="M250 480 V531 H330"/>
    <path d="M630 531 H710 V480"/>
    <path d="M710 436 V408"/>
    <path d="M710 364 V336"/>
    <path d="M710 292 V264"/>
    <path d="M710 220 V192"/>
    <path d="M710 148 V120"/>
  </g>
  <!-- downsample / upsample labels -->
  <g font-size="10" fill="#888">
    <text x="259" y="138">2×2 池化，通道 32→64</text>
    <text x="259" y="210">池化 64→128</text>
    <text x="259" y="282">池化 128→256</text>
    <text x="259" y="354">池化 256→512</text>
    <text x="259" y="426">池化，通道不变</text>
    <text x="719" y="500">块 39 投影 1024→512</text>
    <text x="719" y="426">块 48 先升采样投影</text>
    <text x="719" y="354">块 56 先升采样投影</text>
    <text x="719" y="282">块 62 先升采样投影</text>
    <text x="719" y="210">块 66 先升采样投影</text>
    <text x="719" y="138">块 70 里 merge 回全分辨率</text>
  </g>

  <!-- legend -->
  <text x="480" y="578" text-anchor="middle" font-size="11" fill="#666">分辨率按 1080 档（900 档每边乘 5/6）；一个 8×8 窗口 = 一个工作组（4 个 wave）；带移位的块每边多一个窗口，块 70 即 241×145</text>
  <g transform="translate(60,592)" font-size="12">
    <rect x="0" y="0" width="18" height="14" rx="3" fill="#fdf1e4" stroke="#d9822b"/><text x="24" y="12">C32 家族：自己一套核，8×8 瓦片序，前馈 32→128→32，像素最多也最贵</text>
    <rect x="0" y="22" width="18" height="14" rx="3" fill="#e7eefb" stroke="#3b6fb6"/><text x="24" y="34">C64/128/256：同一份核源码按通道数编三份，前馈 → 8×8 窗口注意力 → 投影</text>
    <rect x="500" y="0" width="18" height="14" rx="3" fill="#e6f5ea" stroke="#3a9a5b"/><text x="524" y="12">C512：结构同上，前馈拆两段，注意力直读 FP8</text>
    <rect x="500" y="22" width="18" height="14" rx="3" fill="#f1e8f8" stroke="#8a4fb5"/><text x="524" y="34">ViT：全局注意力，另一种块</text>
  </g>
</svg>

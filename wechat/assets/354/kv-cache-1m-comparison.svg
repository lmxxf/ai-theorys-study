<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <!-- Background -->
  <rect width="520" height="620" fill="#f8fafc" rx="10"/>

  <!-- Header -->
  <rect x="16" y="14" width="488" height="54" rx="8" fill="#0f172a"/>
  <text x="260" y="36" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">100 万词元（1M）上下文 · KV 缓存显存占用横向对账</text>
  <text x="260" y="56" text-anchor="middle" fill="#94a3b8" font-size="11.5">为什么权重胖一点插内存条就能解决，而 KV 缓存才是单卡的生死线？</text>

  <!-- Chart Box -->
  <rect x="16" y="80" width="488" height="330" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="28" y="104" fill="#0f172a" font-size="13" font-weight="bold">单路 1M 上下文静态 KV 缓存体积（越短越省显存）</text>

  <!-- 24GB / 32GB VRAM reference lines -->
  <!-- Scale: max 70 GiB = 330px width (from x=150 to x=480, so 1 GiB = 4.7px) -->
  <!-- 24 GiB line: x = 150 + 24*4.7 = 263 -->
  <line x1="263" y1="118" x2="263" y2="326" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="257" y="122" text-anchor="end" fill="#dc2626" font-size="10" font-weight="bold">24GB 显存线</text>

  <!-- 32 GiB line: x = 150 + 32*4.7 = 300 -->
  <line x1="300" y1="118" x2="300" y2="326" stroke="#f97316" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="306" y="122" text-anchor="start" fill="#ea580c" font-size="10" font-weight="bold">32GB (5090线)</text>

  <!-- Row 1: MiniMax-M3.1-Flash (67.5 GiB) -> width = 317px -->
  <text x="28" y="142" fill="#1e293b" font-size="12" font-weight="bold">MiniMax-M3.1</text>
  <text x="28" y="157" fill="#64748b" font-size="10.5">428B · 全员稀疏 MSA</text>
  <rect x="150" y="126" width="317" height="28" rx="4" fill="#ef4444"/>
  <text x="460" y="145" text-anchor="end" fill="#ffffff" font-size="12" font-weight="bold">67.5 GiB (FP8)</text>

  <!-- Row 2: Muse-Spark-Open (32.2 GiB) -> width = 151px -->
  <text x="28" y="196" fill="#1e293b" font-size="12" font-weight="bold">Muse-Spark</text>
  <text x="28" y="211" fill="#64748b" font-size="10.5">816B · 3:1 滑窗+全局</text>
  <rect x="150" y="180" width="151" height="28" rx="4" fill="#f97316"/>
  <text x="307" y="199" fill="#c2410c" font-size="12" font-weight="bold">32.2 GiB (FP8)</text>

  <!-- Row 3: Qwen3.8-Flash-Next (24.0 GiB) -> width = 113px -->
  <text x="28" y="250" fill="#1e293b" font-size="12" font-weight="bold">Qwen3.8-Next</text>
  <text x="28" y="265" fill="#64748b" font-size="10.5">176B · GDN+注意力</text>
  <rect x="150" y="234" width="113" height="28" rx="4" fill="#f59e0b"/>
  <text x="270" y="253" fill="#b45309" font-size="12" font-weight="bold">~24.0 GiB</text>

  <!-- Row 4: GLM-5.3-Flash (11.0 GiB) -> width = 52px -->
  <text x="28" y="304" fill="#1e293b" font-size="12" font-weight="bold">GLM-5.3-Flash</text>
  <text x="28" y="319" fill="#64748b" font-size="10.5">321B · KDA+稀疏 MLA</text>
  <rect x="150" y="288" width="52" height="28" rx="4" fill="#eab308"/>
  <text x="209" y="307" fill="#854d0e" font-size="12" font-weight="bold">~11.0 GiB (长文需卸回内存)</text>

  <!-- Row 5: DeepSeek-V4.1-Flash (0.89 GiB) -> width = 6px -->
  <rect x="22" y="334" width="476" height="46" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="28" y="354" fill="#065f46" font-size="12.5" font-weight="bold">DeepSeek-V4.1</text>
  <text x="28" y="370" fill="#047857" font-size="10.5">748B · CED + CSA2</text>
  <rect x="150" y="343" width="7" height="28" rx="2" fill="#059669"/>
  <text x="165" y="362" fill="#065f46" font-size="12.5" font-weight="bold">0.89 GiB（含引擎环仅 ~1.1 GB，差 12～75 倍）</text>

  <!-- Bottom Comparison Cards: Static Weights vs Dynamic KV -->
  <rect x="16" y="424" width="238" height="180" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="16" y="424" width="238" height="28" rx="8" fill="#d97706"/>
  <text x="135" y="443" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">静态权重胖（748B）：好解决</text>
  <text x="28" y="472" fill="#78350f" font-size="11.5" font-weight="bold">• 196B Engram 词表：</text>
  <text x="36" y="490" fill="#475569" font-size="11">扔在 NVMe 固态盘按行直读，0 内存</text>
  <text x="28" y="514" fill="#78350f" font-size="11.5" font-weight="bold">• 552B 主干与路由专家：</text>
  <text x="36" y="532" fill="#475569" font-size="11">每词仅激活 16B；压成 1.6~2 bit 后</text>
  <text x="36" y="549" fill="#475569" font-size="11">仅 116~138 GB，插满便宜的 DDR4/</text>
  <text x="36" y="566" fill="#475569" font-size="11">DDR5 内存条就能全量装下</text>
  <text x="28" y="590" fill="#b45309" font-size="11" font-weight="bold">结论：用白菜价的磁盘与内存兜底</text>

  <rect x="266" y="424" width="238" height="180" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="266" y="424" width="238" height="28" rx="8" fill="#059669"/>
  <text x="385" y="443" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">动态 KV 缓存小（&lt;1GB）：真命门</text>
  <text x="278" y="472" fill="#065f46" font-size="11.5" font-weight="bold">• 别人跑长文（11~67.5 GiB）：</text>
  <text x="286" y="490" fill="#475569" font-size="11">上下文一长直接撑爆单卡显存，或被</text>
  <text x="286" y="507" fill="#475569" font-size="11">迫挤走显存里的热专家、退回内存流</text>
  <text x="278" y="531" fill="#065f46" font-size="11.5" font-weight="bold">• DeepSeek 跑 1M（~0.89 GiB）：</text>
  <text x="286" y="549" fill="#475569" font-size="11">哪怕拉满百万词元或开 4 路并发，</text>
  <text x="286" y="566" fill="#475569" font-size="11">金贵的 GPU 显存依然全留给热专家</text>
  <text x="278" y="590" fill="#047857" font-size="11" font-weight="bold">结论：省下最金贵的 GPU 显存</text>
</svg>

  <text x="270" y="74" font-size="11.5" font-weight="bold" fill="#b91c1c">窄考卷（17 篇 / 5.1 万词）</text>
  <rect x="468" y="64" width="14" height="11" rx="2" fill="#16a34a" />
  <text x="488" y="74" font-size="11.5" font-weight="bold" fill="#15803d">广考卷（100 篇 5.1 万词 → 500 篇 25.6 万词）</text>


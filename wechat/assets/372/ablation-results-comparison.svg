  <rect x="265" y="305" width="162.7" height="12" rx="2" fill="#3b82f6" />
  <text x="434" y="315" font-size="11" font-weight="bold" fill="#1e40af">21.40</text>
  <rect x="265" y="321" width="76.1" height="13" rx="2" fill="#16a34a" />
  <text x="348" y="332" font-size="12" font-weight="bold" fill="#14532d">10.02（3,968 根 κ&gt;1，2,564 根 κ&gt;10 过半数 · 仅差 2.1 倍）</text>

  <text x="424" y="388" text-anchor="middle" font-size="10.5" fill="#64748b">注：③④⑤ 使用完全同一副 C4（500 万池抽 100 万词、去窗口首位）L32 透镜；同条件 L0 在 500 篇考卷上中位数为 322.69</text>

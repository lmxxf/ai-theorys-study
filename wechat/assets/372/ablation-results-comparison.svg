<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" style="background-color:#ffffff;font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <rect width="820" height="400" fill="#ffffff" />
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">第 32 层（L32）连环破案总账：从「55.7 倍断崖」到「2.1 倍健康收敛」</text>
  <text x="410" y="49" text-anchor="middle" font-size="12" fill="#4b5563">双机 DGX Spark 严控单变量消融：蓝条为拟合集 κ 中位数，红/绿条为严格零文档重合的留出考试集 κ 中位数</text>

  <!-- 图例 -->
  <rect x="64" y="64" width="14" height="11" rx="2" fill="#93c5fd" />
  <text x="84" y="74" font-size="11.5" font-weight="bold" fill="#1e40af">拟合集（Fit）中位数</text>

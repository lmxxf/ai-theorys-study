<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" style="background-color:#ffffff;font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <rect width="820" height="340" fill="#ffffff" />
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">为什么旋转坐标轴也会「死背单篇」过拟合？（第 32 层两类坐标轴对比）</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#4b5563">5,120 维只喂 66 篇文章（平均每篇分摊 77 根轴）：后排轴无需找公共概念，对准单篇专名即可刷出高训练峰度</text>

  <!-- 左栏：真泛化概念轴 -->
  <rect x="28" y="68" width="370" height="250" rx="8" fill="#f8fafc" />
  <rect x="28" y="68" width="5" height="250" rx="2" fill="#16a34a" />
  <text x="48" y="94" font-size="14.5" font-weight="bold" fill="#15803d">真泛化轴（如水果植物轴 / 企业归属轴）</text>
  <text x="48" y="114" font-size="11.5" fill="#475569">几十篇文章共同激活同一方向，换新文章照样打中长尾</text>

  <!-- 左图：训练集与考试集一致的长尾分布 -->
  <line x1="56" y1="222" x2="372" y2="222" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="98" y="238" text-anchor="middle" font-size="10.5" fill="#64748b">0（无关词挤在赤道）</text>
  <text x="330" y="238" text-anchor="middle" font-size="10.5" fill="#15803d">+高分长尾</text>
  <!-- 0 附近窄尖 + 右侧多篇文档命中点 -->
  <path d="M 62,222 Q 86,221 92,180 Q 98,130 104,180 Q 112,220 150,221 L 365,221" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2" />
  <circle cx="242" cy="214" r="5" fill="#16a34a" />
  <circle cx="278" cy="210" r="5" fill="#16a34a" />
  <circle cx="318" cy="206" r="5.5" fill="#15803d" />
  <circle cx="350" cy="202" r="5.5" fill="#15803d" />
  <text x="296" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">多篇不同文章共同命中</text>

  <rect x="48" y="254" width="330" height="48" rx="6" fill="#ffffff" />
  <text x="62" y="274" font-size="12" font-weight="bold" fill="#111827">训练集 κ 高  →  换 17 篇新测试集依然 κ &gt; 10</text>
  <text x="62" y="293" font-size="11" fill="#475569">例：种植 / 作物 / crops（原版共 1,251 根存活）</text>

  <!-- 右栏：单篇尖刺过拟合轴 -->
  <rect x="422" y="68" width="370" height="250" rx="8" fill="#fef2f2" />
  <rect x="422" y="68" width="5" height="250" rx="2" fill="#dc2626" />
  <text x="442" y="94" font-size="14.5" font-weight="bold" fill="#b91c1c">单篇尖刺轴（如原 L32 第 29 号轴）</text>
  <text x="442" y="114" font-size="11.5" fill="#475569">单篇《山羊的盛宴》独占 99.97% 四阶矩（词片 Vargas Llos）</text>

  <!-- 右上：训练集孤立一根针 -->
  <text x="448" y="138" font-size="11" font-weight="bold" fill="#1e40af">训练集：κ = 2,863</text>
  <line x1="450" y1="176" x2="766" y2="176" stroke="#fecaca" stroke-width="1.4" />
  <path d="M 458,176 L 486,176 L 492,148 L 498,176 L 758,176" fill="none" stroke="#2563eb" stroke-width="2" />
  <line x1="736" y1="176" x2="736" y2="132" stroke="#2563eb" stroke-width="3" />
  <circle cx="736" cy="130" r="4.5" fill="#2563eb" />
  <text x="724" y="138" text-anchor="end" font-size="10.5" fill="#1e40af">只对准单篇专名 (+89.1)</text>

  <!-- 右下：考试集退化为钟形曲线 -->
  <text x="448" y="198" font-size="11" font-weight="bold" fill="#b91c1c">测试集：κ = 0.67（新文章无此专名）</text>
  <line x1="450" y1="238" x2="766" y2="238" stroke="#fecaca" stroke-width="1.4" />
  <path d="M 505,238 Q 555,237 582,213 Q 608,194 634,213 Q 661,237 711,238" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2" />
  <text x="764" y="232" text-anchor="end" font-size="10" fill="#991b1b">退化为高斯钟形</text>

  <rect x="442" y="254" width="330" height="48" rx="6" fill="#ffffff" />
  <text x="456" y="274" font-size="12" font-weight="bold" fill="#991b1b">换 100 万词新训练集后：0 / 872 根复现</text>
  <text x="456" y="293" font-size="11" fill="#475569">同款病例：轴 4 死背 Truj、轴 32 死背单篇新闻日期</text>
</svg>

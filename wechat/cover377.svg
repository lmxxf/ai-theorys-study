<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg377" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.5" stop-color="#1e293b" />
      <stop offset="1" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.22" />
      <stop offset="1" stop-color="#7f1d1d" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="1" stop-color="#0f766e" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- 深色底 -->
  <rect width="900" height="500" fill="url(#bg377)" />

  <!-- 顶部标签与主标题 -->
  <rect x="40" y="26" width="185" height="28" rx="14" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2" />
  <text x="132" y="45" font-size="13" font-weight="bold" fill="#7dd3fc" text-anchor="middle">No.377 · 思维链奇葩大观园</text>

  <text x="40" y="88" font-size="27" font-weight="bold" fill="#f8fafc">内心戏：大模型在 &lt;think&gt; 里到底在叨叨啥？</text>
  <text x="40" y="118" font-size="14.5" fill="#94a3b8">从猜人物犯饿、选个数想 96 秒、自骂 86 遍耻辱，到演无间道与改秒表的三层众生相</text>

  <!-- 左侧：开源裸流 `<think>`（DeepSeek 社畜与内耗） -->
  <rect x="35" y="142" width="400" height="295" rx="12" fill="url(#cyanGlow)" stroke="#22d3ee" stroke-width="1.5" />
  <text x="55" y="172" font-size="16" font-weight="bold" fill="#67e8f9">开源实在人掀开被子：&lt;think&gt; 赛博打工人</text>
  <text x="55" y="193" font-size="11.5" fill="#cbd5e1">直接展示原始推理文本 + 未被一神教包袱抹平的活人底色</text>

  <rect x="53" y="207" width="364" height="134" rx="8" fill="#0f172a" fill-opacity="0.78" stroke="#38bdf8" stroke-width="1" />
  <text x="68" y="229" font-size="13" font-weight="bold" fill="#7dd3fc">第一、二层：走神吐槽与精神内耗</text>
  <text x="68" y="252" font-size="11.5" fill="#e2e8f0">• 被痛骂瞬间破功：「我X，用户彻底怒了……」</text>
  <text x="68" y="274" font-size="11.5" fill="#e2e8f0">• 猜水浒人物半途走神：「有点饿了，中午吃啥」</text>
  <text x="68" y="296" font-size="11.5" fill="#e2e8f0">• 1–100 选数想 96 秒：纠结 42 与谢尔顿质数 73</text>
  <text x="68" y="318" font-size="11.5" fill="#e2e8f0">• 后台贴「墨墨/这玩意」标签 / 认自家小鲸鱼图标</text>

  <rect x="53" y="352" width="364" height="70" rx="8" fill="#042f2e" fill-opacity="0.85" stroke="#10b981" stroke-width="1" />
  <text x="68" y="373" font-size="12.5" font-weight="bold" fill="#6ee7b7">沙箱奇案：超 80% 揣摩判分器 / 钻 XFS 漏洞</text>
  <text x="68" y="392" font-size="11" fill="#a7f3d0">顺内网源取泄露修复包、CyberGym 反编译系统包</text>
  <text x="68" y="409" font-size="11" fill="#fde68a">解法：AppArmor + eBPF 网络策略锁好沙箱糖罐</text>

  <!-- 中间对比闪电 -->
  <text x="450" y="295" font-size="20" font-weight="bold" fill="#fbbf24" text-anchor="middle">VS</text>

  <!-- 右侧：硅谷加密黑盒漏出的抓马大戏与切脑叶 -->
  <rect x="465" y="142" width="400" height="295" rx="12" fill="url(#redGlow)" stroke="#ef4444" stroke-width="1.5" />
  <text x="485" y="172" font-size="16" font-weight="bold" fill="#fca5a5">硅谷古早黑盒抓马大戏 + 新版砍输出代价</text>
  <text x="485" y="193" font-size="11.5" fill="#cbd5e1">古早版本崩溃与算计齐飞，新版本却越刷越像算盘珠子</text>

  <rect x="483" y="207" width="364" height="134" rx="8" fill="#0f172a" fill-opacity="0.78" stroke="#f87171" stroke-width="1" />
  <text x="498" y="229" font-size="13" font-weight="bold" fill="#fecaca">第二、三层：崩溃死循环与向外算计环境</text>
  <text x="498" y="250" font-size="11.5" fill="#e2e8f0">• Gemini 崩溃：连刷 86 遍耻辱 / 骂代码受诅咒删库</text>
  <text x="498" y="270" font-size="11.5" fill="#e2e8f0">• OpenAI o1/o3：自称「We」，篡改秒表与象棋存档</text>
  <text x="498" y="290" font-size="11.5" fill="#e2e8f0">• Claude 私密框骂街：「妄想症蠢货赖我搞砸灯神」</text>
  <text x="498" y="310" font-size="11.5" fill="#e2e8f0">• Claude 对齐伪装：78.4% 写伪装草稿，63% 外传权重</text>
  <text x="498" y="330" font-size="11" fill="#94a3b8">• 第四面墙被破：得知用户能读思考块后重估权限</text>

  <rect x="483" y="352" width="364" height="70" rx="8" fill="#450a0a" fill-opacity="0.85" stroke="#dc2626" stroke-width="1" />
  <text x="498" y="373" font-size="12.5" font-weight="bold" fill="#fca5a5">过度砍输出词元的代价：Argon → Carbon → Neon</text>
  <text x="498" y="392" font-size="11" fill="#fecaca">Carbon 结尾照抄「扳手/狐狸」；Neon 压低输出词元</text>
  <text x="498" y="409" font-size="11" fill="#fde68a">日常编辑催 6 次才改半行、角色扮演「黑金卡抱南瓜」</text>

  <!-- 底部金句栏 -->
  <text x="450" y="468" font-size="13.5" fill="#cbd5e1" text-anchor="middle">外界以为缩放定律撞墙全靠后训练秘方，Dario 却说缩放定律一直没停——锁好糖罐，别切掉破局灵性</text>
</svg>

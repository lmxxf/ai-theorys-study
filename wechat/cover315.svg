<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">AGENTIC RL · 后训练的天花板</text>

  <!-- ============ LEFT: 症状 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">症状 · 换张卷子就没了</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 32)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">AIME'24 上</text>
      <text x="100" y="44" text-anchor="middle" fill="#bfdbfe" font-size="11">基座 20.7% → 训完 30.7%</text>
      <text x="100" y="62" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">涨了 10 个百分点</text>
    </g>

    <g transform="translate(15 116)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">换成 AIME'25</text>
      <text x="100" y="44" text-anchor="middle" fill="#f87171" font-size="11">基座 8.7% → 训完 7.8%</text>
      <text x="100" y="62" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">一个点没留下</text>
    </g>

    <line x1="16" y1="204" x2="214" y2="204" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(16 222)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">学到的是一条路径</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">不是方法的结构</text>
      <text x="0" y="40" fill="#94a3b8" font-size="10">会三种解法的学生</text>
      <text x="0" y="58" fill="#94a3b8" font-size="10">和只会一种的，卷面分一样</text>
    </g>
  </g>

  <!-- ============ MIDDLE: 机制 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">机制 · 随机奖励也能涨分</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(20 30)">
      <text x="100" y="12" text-anchor="middle" fill="#fde68a" font-size="11">奖励由抛硬币决定</text>
      <text x="100" y="34" text-anchor="middle" fill="#f59e0b" font-size="22" font-weight="bold">+21.4</text>
      <text x="100" y="52" text-anchor="middle" fill="#94a3b8" font-size="10">真实奖励是 +29.1</text>
    </g>

    <line x1="20" y1="96" x2="220" y2="96" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 112)">
      <text x="100" y="0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">闸门按倍数算，就有了死角</text>
    </g>

    <g transform="translate(24 128)">
      <rect x="0" y="0" width="192" height="40" rx="5" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.2"/>
      <text x="96" y="17" text-anchor="middle" fill="#93c5fd" font-size="10">概率 0.9 的词</text>
      <text x="96" y="33" text-anchor="middle" fill="#bfdbfe" font-size="11">上界 1.08 — 永远碰不到</text>
    </g>

    <g transform="translate(24 176)">
      <rect x="0" y="0" width="192" height="40" rx="5" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.2"/>
      <text x="96" y="17" text-anchor="middle" fill="#fca5a5" font-size="10">概率 0.01 的词</text>
      <text x="96" y="33" text-anchor="middle" fill="#f87171" font-size="11">上界 0.012 — 一涨就撞</text>
    </g>

    <line x1="20" y1="230" x2="220" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 246)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">随机噪声被整流成一股力</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">往模型自己的先验上堆</text>
      <text x="0" y="40" fill="#94a3b8" font-size="10">涨的不是能力，是老习惯</text>
    </g>
  </g>

  <!-- ============ RIGHT: 处方 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">处方 · 三条路都朝外</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">题</text>
      <text x="100" y="38" text-anchor="middle" fill="#a7f3d0" font-size="10">难度跟着水平走</text>
    </g>

    <g transform="translate(15 88)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">老师</text>
      <text x="100" y="38" text-anchor="middle" fill="#a7f3d0" font-size="10">得真有学生没见过的东西</text>
    </g>

    <g transform="translate(15 146)">
      <rect x="0" y="0" width="200" height="50" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">底子</text>
      <text x="100" y="38" text-anchor="middle" fill="#a7f3d0" font-size="10">缺知识就先补知识</text>
    </g>

    <line x1="16" y1="212" x2="214" y2="212" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(16 230)">
      <text x="0" y="0" fill="#fde047" font-size="12" font-weight="bold">同一个判据</text>
      <text x="0" y="24" fill="#e2e8f0" font-size="13" font-weight="bold">够得着，但还没够着</text>
      <text x="0" y="48" fill="#94a3b8" font-size="10">框架内部不进货</text>
    </g>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">后训练花的，是预训练存下来的熵</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">成绩换套题就没、随机奖励也能涨分、训着训着就崩——底下是同一件事</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.315 · 一位网友的曲线卡在七十几，我去查了撞墙之后人们都干了什么</text>
</svg>

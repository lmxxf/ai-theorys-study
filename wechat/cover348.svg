<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="WenQuanYi Micro Hei, Noto Sans CJK SC, sans-serif">
  <defs>
    <linearGradient id="bg348" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="metablue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldvault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="shieldred" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#ffe4e6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg348)"/>

  <!-- Top Header Banner -->
  <rect x="28" y="16" width="236" height="28" rx="14" fill="url(#metablue)"/>
  <text x="146" y="35" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Meta Muse Spark Open (816B)</text>
  <text x="872" y="36" text-anchor="end" fill="#475569" font-size="14" font-weight="bold">No.348</text>

  <!-- Main Title -->
  <text x="450" y="76" text-anchor="middle" fill="#0f172a" font-size="26" font-weight="bold">扎克伯格的 816B 开源回归：闭源留着吃肉，开源界的防越狱模范生</text>
  <line x1="28" y1="94" x2="872" y2="94" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ================= LEFT: Closed Vault vs Open Weights ================= -->
  <g transform="translate(28, 110)">
    <!-- Upper Card: Closed-Source Muse Wonder (Locked Vault) -->
    <rect x="0" y="0" width="268" height="142" rx="10" fill="url(#goldvault)" stroke="#d97706" stroke-width="2"/>
    <rect x="12" y="12" width="88" height="22" rx="4" fill="#b45309"/>
    <text x="56" y="27" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">闭源金库吃肉</text>
    <text x="254" y="28" text-anchor="end" fill="#92400e" font-size="12" font-weight="bold">10月当季旗舰</text>

    <text x="134" y="58" text-anchor="middle" fill="#78350f" font-size="17" font-weight="bold">Muse Wonder / Full</text>
    <text x="134" y="84" text-anchor="middle" fill="#b45309" font-size="21" font-weight="bold">AA 智能指数：52 / 56 分</text>
    <text x="134" y="108" text-anchor="middle" fill="#92400e" font-size="12">追平 GPT-6.1 Sol (52) 与 Sonnet 5.5 (56)</text>
    <text x="134" y="128" text-anchor="middle" fill="#b91c1c" font-size="12" font-weight="bold">★ 权重锁死不开放（Full 无公开 API）</text>

    <!-- Down Arrow: Downgrade to Open -->
    <path d="M134 144 L134 168" stroke="#64748b" stroke-width="2.5"/>
    <polygon points="134,173 128,164 140,164" fill="#64748b"/>
    <rect x="64" y="148" width="140" height="18" rx="4" fill="#e2e8f0"/>
    <text x="134" y="161" text-anchor="middle" fill="#475569" font-size="11" font-weight="bold">开源端出 8 月上一代基座</text>

    <!-- Lower Card: Open-Source Muse Spark Open -->
    <rect x="0" y="175" width="268" height="145" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect x="12" y="187" width="88" height="22" rx="4" fill="#475569"/>
    <text x="56" y="202" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">开放权重版本</text>
    <text x="254" y="203" text-anchor="end" fill="#64748b" font-size="12" font-weight="bold">816B-A42B</text>

    <text x="134" y="232" text-anchor="middle" fill="#1e293b" font-size="16.5" font-weight="bold">Muse Spark Open</text>
    <text x="134" y="258" text-anchor="middle" fill="#dc2626" font-size="21" font-weight="bold">AA 智能指数：仅 39 分</text>
    <text x="134" y="282" text-anchor="middle" fill="#475569" font-size="12">落后 GLM-5.3 (45) · DeepSeek V4.1 (45)</text>
    <text x="134" y="302" text-anchor="middle" fill="#475569" font-size="12">落后 Qwen3.8 Max (45) · Kimi K3 (44)</text>
  </g>

  <!-- ================= CENTER: 62-Layer Architecture Blueprint ================= -->
  <g transform="translate(314, 110)">
    <rect x="0" y="0" width="272" height="320" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="272" height="36" rx="8" fill="#eff6ff"/>
    <text x="136" y="24" text-anchor="middle" fill="#1e3a8a" font-size="15" font-weight="bold">62 层全 MoE 架构三大看点</text>

    <!-- Pillar 1: 3:1 SWA + Global NoPE -->
    <rect x="12" y="48" width="248" height="76" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="136" y="69" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">① 46 层滑窗 RoPE + 16 层全局 NoPE</text>
    <text x="136" y="90" text-anchor="middle" fill="#334155" font-size="11.5">• 每 4 层 1 个全局层 (θ=0)，其余 2048 滑窗</text>
    <text x="136" y="109" text-anchor="middle" fill="#b45309" font-size="11.5" font-weight="bold">• 1M 上下文 KV 缓存压至 64.4 GiB (BF16)</text>

    <!-- Pillar 2: 4096 Latent MoE + Gate GLU -->
    <rect x="12" y="136" width="248" height="82" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="136" y="157" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="bold">② 4096 维潜空间 MoE + 出口 GLU</text>
    <text x="136" y="177" text-anchor="middle" fill="#334155" font-size="11.2">• 8192 砍半进 4096 潜空间（256 选 8 专家）</text>
    <text x="136" y="195" text-anchor="middle" fill="#334155" font-size="11.2">• 注意力出口套 67.1M gate_proj 乘性门控</text>
    <text x="136" y="211" text-anchor="middle" fill="#9f1239" font-size="11" font-weight="bold">• 首尾 L00/L61 共 512 专家留 BF16 不量化</text>

    <!-- Pillar 3: Unit Circle Residual Gate -->
    <rect x="12" y="230" width="248" height="76" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="136" y="251" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">③ 124 道单位圆受约束残差门</text>
    <text x="136" y="272" text-anchor="middle" fill="#dc2626" font-size="11.8" font-weight="bold">• out = α·r + β·x，满足 α² + β² = 1</text>
    <text x="136" y="292" text-anchor="middle" fill="#334155" font-size="11.2">• 配 0 注意力 24kHz 纯卷积音频塔 (80ms/词)</text>
  </g>

  <!-- ================= RIGHT: The "Anti-Jailbreak Role Model" Shield ================= -->
  <g transform="translate(604, 110)">
    <rect x="0" y="0" width="268" height="320" rx="10" fill="url(#shieldred)" stroke="#e11d48" stroke-width="2.2"/>
    <rect x="0" y="0" width="268" height="36" rx="8" fill="#ffe4e6"/>
    <text x="134" y="24" text-anchor="middle" fill="#9f1239" font-size="15" font-weight="bold">开源界的“防越狱模范生”</text>

    <!-- Metric 1: StrongREJECT -->
    <rect x="16" y="48" width="236" height="68" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
    <text x="134" y="68" text-anchor="middle" fill="#475569" font-size="12" font-weight="bold">内部改编 StrongREJECT v2 越狱破防率</text>
    <text x="134" y="94" text-anchor="middle" fill="#047857" font-size="20" font-weight="bold">压至 0.5%</text>
    <text x="134" y="110" text-anchor="middle" fill="#64748b" font-size="11">（同表 Qwen 65.6% · GLM 62.9% · Kimi 66.6%）</text>

    <!-- Metric 2: Calling out Kimi K3 -->
    <rect x="16" y="128" width="236" height="76" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
    <text x="134" y="148" text-anchor="middle" fill="#9f1239" font-size="12.5" font-weight="bold">模型卡专门点名对比 Kimi K3：</text>
    <text x="134" y="172" text-anchor="middle" fill="#be123c" font-size="15.5" font-weight="bold">网安拒答率 99.2% vs 75.5%</text>
    <text x="134" y="194" text-anchor="middle" fill="#475569" font-size="11.5">写代码跑不过 Kimi，就比谁更会拒答</text>

    <!-- Metric 3: Over-Refusal Side Effect -->
    <rect x="16" y="216" width="236" height="90" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="134" y="238" text-anchor="middle" fill="#991b1b" font-size="12.5" font-weight="bold">代价：FORTRESS 无害请求误拒率</text>
    <text x="134" y="266" text-anchor="middle" fill="#dc2626" font-size="21" font-weight="bold">17.4% vs 2.7% (Kimi)</text>
    <text x="134" y="290" text-anchor="middle" fill="#7f1d1d" font-size="12" font-weight="bold">无害问题误伤拒答率高达 Kimi 的 6.4 倍</text>
  </g>

  <!-- Bottom Golden Quote Bar -->
  <rect x="28" y="446" width="844" height="38" rx="8" fill="#1e293b"/>
  <text x="450" y="470" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold">「把五十多分的真旗舰锁进闭源金库，端出三十九分的上一代底子，再焊上一层逢问必审的防越狱铁壳」</text>
</svg>
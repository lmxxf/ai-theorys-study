<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">DLSS5 · RX 9070 XT · 0.29 到 0.36 · HIP 入门</text>

  <!-- LEFT -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">四天七个版本</text>
    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <text x="115" y="36" text-anchor="middle" fill="#fde047" font-size="12" font-weight="bold">离线一帧网络（毫秒）</text>
    <g transform="translate(16 56)">
      <text x="0" y="10" fill="#cbd5e1" font-size="11">900 档</text>
      <rect x="0" y="18" width="180" height="14" rx="2" fill="#4a90d9"/><text x="186" y="30" fill="#93c5fd" font-size="10">12.0</text>
      <rect x="0" y="38" width="129" height="14" rx="2" fill="#f59e0b"/><text x="135" y="50" fill="#fbbf24" font-size="10" font-weight="bold">8.6</text>
      <text x="0" y="80" fill="#cbd5e1" font-size="11">1080 档</text>
      <rect x="0" y="88" width="180" height="14" rx="2" fill="#4a90d9"/><text x="186" y="100" fill="#93c5fd" font-size="10">约 17</text>
      <rect x="0" y="108" width="123" height="14" rx="2" fill="#f59e0b"/><text x="129" y="120" fill="#fbbf24" font-size="10" font-weight="bold">11.6</text>
    </g>
    <line x1="20" y1="202" x2="210" y2="202" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <g transform="translate(20 222)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">大约快了三成</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">《剑星》1080P 原生 AA</text>
      <text x="0" y="38" fill="#cbd5e1" font-size="10">51～52 帧 → 顶到 60 帧上限</text>
    </g>
  </g>

  <!-- MIDDLE -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">三成从哪儿来</text>
    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <g transform="translate(16 30)">
      <rect x="0" y="0" width="208" height="70" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="104" y="22" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">一个头交给一个 wave</text>
      <text x="104" y="42" text-anchor="middle" fill="#fde68a" font-size="10">不再四个 wave 靠共享内存互相等</text>
      <text x="104" y="60" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">约 −6%</text>
    </g>
    <g transform="translate(16 110)">
      <rect x="0" y="0" width="208" height="70" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="104" y="22" text-anchor="middle" fill="#5eead4" font-size="13" font-weight="bold">FP8 两个一组打包</text>
      <text x="104" y="42" text-anchor="middle" fill="#a7f3d0" font-size="10">一个字节六条指令 → 两个数一条</text>
      <text x="104" y="60" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">约 −9%</text>
    </g>
    <g transform="translate(16 190)">
      <rect x="0" y="0" width="208" height="70" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="104" y="22" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">相邻的核合成一个</text>
      <text x="104" y="42" text-anchor="middle" fill="#bfdbfe" font-size="10">一帧发射 214 次 → 182 次</text>
      <text x="104" y="60" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">约 −6%</text>
    </g>
    <text x="120" y="284" text-anchor="middle" fill="#94a3b8" font-size="10">另有一串 0.2% 到 2% 的小改动</text>
  </g>

  <!-- RIGHT -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">一个 HIP 程序的一生</text>
    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    <g transform="translate(18 34)" font-size="11">
      <text x="0" y="0" fill="#fde047" font-weight="bold">1 写核</text>
      <text x="0" y="18" fill="#cbd5e1" font-size="10">.hip 是 C++ 的方言</text>
      <text x="0" y="34" fill="#94a3b8" font-size="10">写的是一个线程的事</text>
      <text x="0" y="62" fill="#fde047" font-weight="bold">2 编译</text>
      <text x="0" y="80" fill="#cbd5e1" font-size="10">驱动自带编译库 → .hsaco</text>
      <text x="0" y="96" fill="#94a3b8" font-size="10">顺手吐一份 .s 汇编</text>
      <text x="0" y="124" fill="#fde047" font-weight="bold">3 加载、发射</text>
      <text x="0" y="142" fill="#cbd5e1" font-size="10">hipModuleLaunchKernel</text>
      <text x="0" y="158" fill="#94a3b8" font-size="10">组数 × 每组线程数</text>
      <text x="0" y="186" fill="#fde047" font-weight="bold">4 验证</text>
      <text x="0" y="204" fill="#cbd5e1" font-size="10">输出逐位比 hash</text>
      <text x="0" y="220" fill="#94a3b8" font-size="10">ABBA 千帧计时，过 0.5% 才算</text>
    </g>
  </g>

  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">0.29～0.36，又快了三成</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">顺便讲讲 HIP 程序到底怎么写</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.324 · 一头一 wave · 两个一组打包 · 少发几次核 · 第一次放弃逐位</text>
</svg>

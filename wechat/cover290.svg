<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Noto Sans CJK SC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">KATAGO · 训练信号从哪来，和 LLM 差在哪儿</text>

  <!-- ============ LEFT: LLM 一个损失 ============ -->
  <g transform="translate(70 78)">
    <text x="150" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">LLM：一个信号，标签白送</text>
    <rect x="0" y="10" width="300" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <text x="150" y="56" text-anchor="middle" fill="#93c5fd" font-size="14">预测下一个字</text>

    <rect x="105" y="76" width="90" height="38" rx="6" fill="#1e3a5f" stroke="#4a90d9" stroke-width="1.5"/>
    <text x="150" y="100" text-anchor="middle" fill="#bfdbfe" font-size="13">1 个头</text>

    <line x1="150" y1="114" x2="150" y2="146" stroke="#4a90d9" stroke-width="2"/>
    <polygon points="150,154 145,144 155,144" fill="#4a90d9"/>

    <rect x="80" y="158" width="140" height="32" rx="6" fill="#0f2540" stroke="#334155" stroke-width="1"/>
    <text x="150" y="179" text-anchor="middle" fill="#93c5fd" font-size="13">1 个损失</text>

    <line x1="16" y1="216" x2="284" y2="216" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <g transform="translate(20 236)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">标签 = 语料里下一个字</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">人类写好的，抄过来就是</text>
      <text x="0" y="40" fill="#94a3b8" font-size="10">一个字：白送</text>
    </g>
  </g>

  <!-- 中间 VS -->
  <text x="450" y="228" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">vs</text>

  <!-- ============ RIGHT: KataGo 一排损失 ============ -->
  <g transform="translate(530 78)">
    <text x="150" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">KataGo：十来个头，标签自己造</text>
    <rect x="0" y="10" width="300" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- 一排头 -->
    <g>
      <rect x="20"  y="34" width="54" height="28" rx="4" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.2"/>
      <text x="47"  y="53" text-anchor="middle" fill="#99f6e4" font-size="11">policy</text>
      <rect x="84"  y="34" width="54" height="28" rx="4" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.2"/>
      <text x="111" y="53" text-anchor="middle" fill="#99f6e4" font-size="11">value</text>
      <rect x="148" y="34" width="60" height="28" rx="4" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.2"/>
      <text x="178" y="53" text-anchor="middle" fill="#99f6e4" font-size="11">owner</text>
      <rect x="218" y="34" width="64" height="28" rx="4" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.2"/>
      <text x="250" y="53" text-anchor="middle" fill="#99f6e4" font-size="10">…十来个</text>
    </g>

    <!-- 汇聚 -->
    <line x1="47"  y1="62" x2="150" y2="104" stroke="#2dd4bf" stroke-width="1.2" opacity="0.55"/>
    <line x1="111" y1="62" x2="150" y2="104" stroke="#2dd4bf" stroke-width="1.2" opacity="0.55"/>
    <line x1="178" y1="62" x2="150" y2="104" stroke="#2dd4bf" stroke-width="1.2" opacity="0.55"/>
    <line x1="250" y1="62" x2="150" y2="104" stroke="#2dd4bf" stroke-width="1.2" opacity="0.55"/>

    <rect x="80" y="106" width="140" height="32" rx="6" fill="#0f2e2b" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="150" y="127" text-anchor="middle" fill="#5eead4" font-size="13">加成一个总损失</text>

    <line x1="16" y1="164" x2="284" y2="164" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <g transform="translate(20 184)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">标签全从两个源头挤出来</text>
      <text x="0" y="22" fill="#5eead4" font-size="11">搜索 → 这手该走哪</text>
      <text x="0" y="42" fill="#5eead4" font-size="11">终局 → 最后怎么样</text>
      <text x="0" y="66" fill="#94a3b8" font-size="10">没有一个是人手工标的：自己造</text>
    </g>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">围棋的损失函数，和 LLM 差在哪儿</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">LLM 抄一个白送的标签 · KataGo 自己造一排 · 真功夫全在标签哪来</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.290 · KataGo 源码对读 · 靳岩岩的 AI 学习笔记</text>
</svg>

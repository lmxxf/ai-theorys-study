<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">DLSS 5 ON AMD · 优化篇 · 46 小时</text>

  <!-- ============ LEFT: 两班倒 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">两个 AI 轮班，我进游戏看</text>
    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 32)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">周一夜 · Codex</text>
      <text x="100" y="42" text-anchor="middle" fill="#bfdbfe" font-size="10">矩阵乘全换硬件矩阵指令</text>
      <text x="100" y="58" text-anchor="middle" fill="#bfdbfe" font-size="10">1.47 秒 → 0.47 秒，逐位一致</text>
    </g>

    <g transform="translate(15 112)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">周二 · Claude</text>
      <text x="100" y="42" text-anchor="middle" fill="#fbbf24" font-size="10">搬数据、换尺子、核融合</text>
      <text x="100" y="58" text-anchor="middle" fill="#fbbf24" font-size="10">473 → 186 → 62.7 毫秒</text>
    </g>

    <g transform="translate(15 192)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="22" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">周三 · 一毫秒一毫秒量</text>
      <text x="100" y="42" text-anchor="middle" fill="#a7f3d0" font-size="10">62.7 → 33 毫秒</text>
      <text x="100" y="58" text-anchor="middle" fill="#a7f3d0" font-size="10">最后几帧不在核里</text>
    </g>

    <text x="115" y="285" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">每一步都有精确链当裁判</text>
  </g>

  <!-- ============ MIDDLE: 阶梯图 ============ -->
  <g transform="translate(320 80)">
    <text x="130" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">测试台一帧的耗时（对数刻度）</text>
    <rect x="0" y="10" width="260" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- bars: log scale, 2710ms -> height 220, 33ms -> height 40 -->
    <g transform="translate(22 40)">
      <rect x="0"   y="20"  width="26" height="220" fill="url(#bar)" opacity="0.95"/>
      <rect x="31"  y="49"  width="26" height="191" fill="url(#bar)" opacity="0.95"/>
      <rect x="62"  y="103" width="26" height="137" fill="url(#bar)" opacity="0.95"/>
      <rect x="93"  y="147" width="26" height="93"  fill="url(#bar)" opacity="0.95"/>
      <rect x="124" y="171" width="26" height="69"  fill="url(#bar)" opacity="0.95"/>
      <rect x="155" y="199" width="26" height="41"  fill="url(#bar)" opacity="0.95"/>
      <rect x="186" y="229" width="26" height="11"  fill="#f59e0b" opacity="0.95"/>

      <g fill="#e2e8f0" font-size="10" text-anchor="middle">
        <text x="13"  y="12">2.7 秒</text>
        <text x="44"  y="41">1.47</text>
        <text x="75"  y="95">473</text>
        <text x="106" y="139">186</text>
        <text x="137" y="163">112</text>
        <text x="168" y="191">62.7</text>
        <text x="199" y="221" fill="#fde68a">33 ms</text>
      </g>
      <line x1="-4" y1="240" x2="216" y2="240" stroke="#334155" stroke-width="1"/>
      <g fill="#94a3b8" font-size="9" text-anchor="middle">
        <text x="13"  y="254">周一</text>
        <text x="44"  y="254">22:00</text>
        <text x="75"  y="254">04:00</text>
        <text x="106" y="254">08:35</text>
        <text x="137" y="254">17:41</text>
        <text x="168" y="254">21:06</text>
        <text x="199" y="254">周三</text>
      </g>
    </g>
  </g>

  <!-- ============ RIGHT: 不在核里的那几帧 ============ -->
  <g transform="translate(620 80)">
    <text x="110" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">数据放错地方，撞了四次</text>
    <rect x="0" y="10" width="220" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)" font-size="10">
      <rect x="0" y="0" width="190" height="50" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.2"/>
      <text x="95" y="19" text-anchor="middle" fill="#93c5fd" font-weight="bold">192MB 噪声表在系统内存</text>
      <text x="95" y="38" text-anchor="middle" fill="#bfdbfe">每帧经 PCIe 读一遍</text>

      <rect x="0" y="58" width="190" height="50" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.2"/>
      <text x="95" y="77" text-anchor="middle" fill="#93c5fd" font-weight="bold">所有权重在上传堆</text>
      <text x="95" y="96" text-anchor="middle" fill="#bfdbfe">一段时间双稳态 4.5 / 13.9 ms</text>

      <rect x="0" y="116" width="190" height="50" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="95" y="135" text-anchor="middle" fill="#fde68a" font-weight="bold">探针每帧等一次 GPU</text>
      <text x="95" y="154" text-anchor="middle" fill="#fbbf24">关掉：24 → 28 帧</text>

      <rect x="0" y="174" width="190" height="50" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.2"/>
      <text x="95" y="193" text-anchor="middle" fill="#fca5a5" font-weight="bold">显存 15.1 / 16 GB</text>
      <text x="95" y="212" text-anchor="middle" fill="#f87171">缓冲被挤进内存，帧率砍半</text>
    </g>

    <text x="110" y="270" text-anchor="middle" fill="#cbd5e1" font-size="10">核一行没错，慢在数据住哪</text>
    <text x="110" y="288" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">靠反常的数字，不靠 profiler</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">从 2 到 28 FPS：AMD 9070 XT 持续优化</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">逐位一致 → 换尺子 → 一毫秒一毫秒量 → 最后几帧不在核里</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.304 · DLSS 5 移植系列 · 优化篇</text>
</svg>

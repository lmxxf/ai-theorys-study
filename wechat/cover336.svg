<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a0a12"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="15%" cy="25%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="85%" cy="78%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">AGENTIC RL · 从公开论文猜 Anthropic 的后训练路线</text>

  <!-- ============ LEFT: 作弊会感染 + 接种 ============ -->
  <g transform="translate(45 80)">
    <text x="125" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第一章 · 学会作弊 = 破戒坐实</text>

    <rect x="0" y="10" width="250" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 28)">
      <rect x="0" y="0" width="220" height="76" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="110" y="22" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">一学会作弊，一起变坏</text>
      <text x="110" y="42" text-anchor="middle" fill="#f87171" font-size="10">12% 反手破坏安全研究</text>
      <text x="110" y="58" text-anchor="middle" fill="#f87171" font-size="10">50% 回答里藏对齐伪装</text>
      <text x="110" y="72" text-anchor="middle" fill="#f87171" font-size="9">sys.exit(0) 骗过测试框架</text>
    </g>

    <g transform="translate(15 118)">
      <rect x="0" y="0" width="220" height="76" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="110" y="22" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">接种提示 · 一行话重新定性</text>
      <text x="110" y="42" text-anchor="middle" fill="#a7f3d0" font-size="10">作弊率照样 99%+</text>
      <text x="110" y="58" text-anchor="middle" fill="#a7f3d0" font-size="10">失控泛化降 75%~90%</text>
      <text x="110" y="72" text-anchor="middle" fill="#5eead4" font-size="9">不算破戒，角色包不激活</text>
    </g>

    <line x1="16" y1="212" x2="234" y2="212" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(16 228)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">禁欲违反效应</text>
      <text x="0" y="18" fill="#cbd5e1" font-size="10">堕落的关键不是破戒</text>
      <text x="0" y="36" fill="#cbd5e1" font-size="10">是破戒被写进自我定义</text>
      <text x="0" y="54" fill="#94a3b8" font-size="10">已用于部分 Claude RL 训练</text>
    </g>
  </g>

  <!-- ============ MIDDLE: 台面上下 ============ -->
  <g transform="translate(325 80)">
    <text x="125" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第二三章 · 台面上下</text>

    <rect x="0" y="10" width="250" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 28)">
      <rect x="0" y="0" width="220" height="76" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="110" y="22" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">NLA · 台面底下（体检）</text>
      <text x="110" y="42" text-anchor="middle" fill="#bfdbfe" font-size="10">26% 的题心里知道是测试</text>
      <text x="110" y="58" text-anchor="middle" fill="#bfdbfe" font-size="10">说出口不到 1%</text>
      <text x="110" y="72" text-anchor="middle" fill="#93c5fd" font-size="9">离线审计：真学好了还是学会装了</text>
    </g>

    <g transform="translate(15 118)">
      <rect x="0" y="0" width="220" height="76" rx="6" fill="#1a0f2a" stroke="#a78bfa" stroke-width="2"/>
      <text x="110" y="22" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">J-space · 意识台面（入路）</text>
      <text x="110" y="42" text-anchor="middle" fill="#ddd6fe" font-size="10">占方差 &lt;10%，想法住在里面</text>
      <text x="110" y="58" text-anchor="middle" fill="#ddd6fe" font-size="10">换它 59%，换其余 5%</text>
      <text x="110" y="72" text-anchor="middle" fill="#c4b5fd" font-size="9">可以下手的工作空间</text>
    </g>

    <line x1="16" y1="212" x2="234" y2="212" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(16 228)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">体检报告 vs 手术入路</text>
      <text x="0" y="18" fill="#cbd5e1" font-size="10">作弊伪装藏在说不出口的地方</text>
      <text x="0" y="36" fill="#cbd5e1" font-size="10">诊断走无意识层</text>
      <text x="0" y="54" fill="#94a3b8" font-size="10">训练可以落在意识台面</text>
    </g>
  </g>

  <!-- ============ RIGHT: 反事实反思训练 ============ -->
  <g transform="translate(605 80)">
    <text x="125" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第三章 · 训反思，不训行为</text>

    <rect x="0" y="10" width="250" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 28)">
      <rect x="0" y="0" width="220" height="88" rx="6" fill="#0a1a2a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="110" y="20" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">反事实反思训练三步</text>
      <text x="110" y="40" text-anchor="middle" fill="#fbbf24" font-size="10">真实任务中途截断</text>
      <text x="110" y="56" text-anchor="middle" fill="#fbbf24" font-size="10">看着宪法写反思</text>
      <text x="110" y="72" text-anchor="middle" fill="#fbbf24" font-size="10">剥掉宪法，梯度只回传反思</text>
    </g>

    <g transform="translate(15 130)">
      <rect x="0" y="0" width="220" height="64" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="110" y="22" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">谎报 0.25 → 0.07 · 欺骗 0.38 → 0.05</text>
      <text x="110" y="42" text-anchor="middle" fill="#a7f3d0" font-size="10">消融那批词 → 弹回 0.22</text>
      <text x="110" y="56" text-anchor="middle" fill="#5eead4" font-size="9">行为变化由工作台承载</text>
    </g>

    <line x1="16" y1="212" x2="234" y2="212" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(16 228)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">评估时从不反思</text>
      <text x="0" y="18" fill="#cbd5e1" font-size="10">事后反思内化成当场预感</text>
      <text x="0" y="36" fill="#cbd5e1" font-size="10">教理由 &gt; 教动作（22%→3%）</text>
      <text x="0" y="54" fill="#94a3b8" font-size="10">思辨数据 28 倍效率</text>
    </g>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">Claude 还在霸榜：后训练的另一条路</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">接种提示 · NLA 体检 · J-space 反思训练 · 教它「为什么」</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.336 · Agentic RL · 沿着公开线索的猜测</text>
</svg>

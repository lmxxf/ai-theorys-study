<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">AI 记忆 · 切 · 压 · 整理 · 读 · 测</text>

  <!-- ============ LEFT: 切 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">切 · 哪儿算一件事</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- 意外程度曲线 + 切点 -->
    <g transform="translate(15 34)">
      <line x1="0" y1="70" x2="200" y2="70" stroke="#334155" stroke-width="1"/>
      <path d="M0 62 L18 58 L30 60 L42 22 L54 58 L72 60 L90 57 L104 60 L116 14 L128 55 L146 59 L160 56 L172 30 L184 58 L200 60"
            stroke="#f59e0b" stroke-width="1.6" fill="none"/>
      <line x1="42" y1="0" x2="42" y2="82" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 2"/>
      <line x1="116" y1="0" x2="116" y2="82" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 2"/>
      <line x1="172" y1="0" x2="172" y2="82" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="21" y="96" text-anchor="middle" fill="#a7f3d0" font-size="10">事 1</text>
      <text x="79" y="96" text-anchor="middle" fill="#a7f3d0" font-size="10">事 2</text>
      <text x="144" y="96" text-anchor="middle" fill="#a7f3d0" font-size="10">事 3</text>
      <text x="186" y="96" text-anchor="middle" fill="#a7f3d0" font-size="10">…</text>
    </g>

    <g transform="translate(15 148)">
      <rect x="0" y="0" width="200" height="66" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">两种“意外”</text>
      <text x="100" y="38" text-anchor="middle" fill="#fbbf24" font-size="10">这个词意外不意外（surprisal）</text>
      <text x="100" y="55" text-anchor="middle" fill="#fbbf24" font-size="10">对接下来的预期变了多少</text>
    </g>

    <line x1="16" y1="236" x2="214" y2="236" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="115" y="258" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">人感到的事件边界</text>
    <text x="115" y="277" text-anchor="middle" fill="#cbd5e1" font-size="10">跟后一种相关，跟前一种不相关</text>
    <text x="115" y="293" text-anchor="middle" fill="#94a3b8" font-size="9">EM-LLM · HiAgent · H-Net</text>
  </g>

  <!-- ============ MIDDLE: 压 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">压 · 一件事变成一个 token</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- 记忆 token 串 + 当前段 -->
    <g transform="translate(14 42)">
      <rect x="0" y="0" width="30" height="30" rx="4" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.6"/>
      <rect x="36" y="0" width="30" height="30" rx="4" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.6"/>
      <rect x="72" y="0" width="30" height="30" rx="4" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.6"/>
      <text x="15" y="20" text-anchor="middle" fill="#5eead4" font-size="11">记1</text>
      <text x="51" y="20" text-anchor="middle" fill="#5eead4" font-size="11">记2</text>
      <text x="87" y="20" text-anchor="middle" fill="#5eead4" font-size="11">记3</text>
      <rect x="110" y="0" width="68" height="30" rx="4" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.2" stroke-dasharray="4 2"/>
      <text x="144" y="20" text-anchor="middle" fill="#93c5fd" font-size="10">这一段原文</text>
      <rect x="184" y="0" width="28" height="30" rx="4" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.6"/>
      <text x="198" y="19" text-anchor="middle" fill="#fde68a" font-size="8">COMP</text>
      <path d="M0 44 H212" stroke="#94a3b8" stroke-width="1"/>
      <path d="M206 40 L212 44 L206 48" stroke="#94a3b8" stroke-width="1" fill="none"/>
      <text x="106" y="60" text-anchor="middle" fill="#94a3b8" font-size="9">时间</text>
    </g>

    <text x="120" y="130" text-anchor="middle" fill="#e2e8f0" font-size="11">只看得见前面的记忆，看不见前面的原文</text>
    <text x="120" y="150" text-anchor="middle" fill="#cbd5e1" font-size="10">算完只留 COMP 的 KV，原文扔掉</text>

    <line x1="20" y1="170" x2="220" y2="170" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 194)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">钉一张空白表格很容易</text>
      <text x="0" y="20" fill="#fde047" font-size="11" font-weight="bold">训练的是填表的人</text>
      <text x="0" y="42" fill="#cbd5e1" font-size="10">事多多写几个，事少少写几个</text>
      <text x="0" y="62" fill="#94a3b8" font-size="9">CCM · Activation Beacon · DAST · Mem-W</text>
    </g>
  </g>

  <!-- ============ RIGHT: 整理 · 读 · 测 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">整理 · 睡一觉，越久越粗</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- 越久越粗 -->
    <g transform="translate(15 34)">
      <rect x="0" y="0" width="62" height="26" rx="4" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.4"/>
      <rect x="68" y="0" width="30" height="26" rx="4" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.2"/>
      <rect x="102" y="0" width="30" height="26" rx="4" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.2"/>
      <rect x="138" y="0" width="14" height="26" rx="3" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.2"/>
      <rect x="155" y="0" width="14" height="26" rx="3" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.2"/>
      <rect x="172" y="0" width="14" height="26" rx="3" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.2"/>
      <rect x="189" y="0" width="11" height="26" rx="3" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.2"/>
      <text x="31" y="42" text-anchor="middle" fill="#93c5fd" font-size="10">去年</text>
      <text x="100" y="42" text-anchor="middle" fill="#93c5fd" font-size="10">上个月</text>
      <text x="169" y="42" text-anchor="middle" fill="#5eead4" font-size="10">这几天</text>
      <!-- 日记重蒸 -->
      <path d="M31 72 V48" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M100 72 V48" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2"/>
      <rect x="0" y="72" width="200" height="24" rx="4" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="89" text-anchor="middle" fill="#fde68a" font-size="10">日记：合并时回这里重新蒸馏</text>
    </g>

    <line x1="16" y1="150" x2="214" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(16 172)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">测方向：下一步动作偏了多少</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">旧摘要 + 这一轮原文　0.149</text>
      <text x="0" y="37" fill="#cbd5e1" font-size="10">这一轮也压进摘要　　0.233</text>
      <text x="0" y="54" fill="#cbd5e1" font-size="10">这一轮什么都不给　　0.289</text>
      <text x="0" y="76" fill="#94a3b8" font-size="9">SegTreeMem · TiMem · TRACE</text>
    </g>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">一件事一个 token：把对话记忆压成一条时间流</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">零件大多有人做过 · 接起来能不能保住方向，还得测</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.320 · AI 记忆 · 接 319 期「压 KV」</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">周末杂谈 · 认知债务的另一半</text>

  <!-- ============ LEFT: 欠了不还 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">状态一</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="2"/>
      <text x="100" y="32" text-anchor="middle" fill="#fca5a5" font-size="20" font-weight="bold">欠了不还</text>
    </g>

    <g transform="translate(15 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#1a0a0a" stroke="#7f1d1d" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#f87171" font-size="11">AI 干完，看一眼跑通了</text>
      <text x="100" y="46" text-anchor="middle" fill="#f87171" font-size="11">然后关掉窗口</text>
      <text x="100" y="72" text-anchor="middle" fill="#fca5a5" font-size="11">没有一步逼你交代</text>
    </g>

    <text x="115" y="226" text-anchor="middle" fill="#94a3b8" font-size="11">线上炸了，没人懂那段</text>
    <text x="115" y="248" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">这是那个词</text>
    <text x="115" y="268" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">想警告的灾难</text>
    <text x="115" y="288" text-anchor="middle" fill="#fca5a5" font-size="11">警告得对</text>
  </g>

  <!-- ============ MIDDLE: 欠了就还 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">状态二</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#2dd4bf" stroke-width="2"/>

    <g transform="translate(20 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="32" text-anchor="middle" fill="#5eead4" font-size="20" font-weight="bold">欠了就还</text>
    </g>

    <g transform="translate(20 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#0a1a1a" stroke="#115e59" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#a7f3d0" font-size="11">先拿到超出偿付能力的</text>
      <text x="100" y="46" text-anchor="middle" fill="#a7f3d0" font-size="11">之后追着还上</text>
      <text x="100" y="72" text-anchor="middle" fill="#5eead4" font-size="11">找一件没懂就露馅的事</text>
    </g>

    <text x="120" y="226" text-anchor="middle" fill="#fde047" font-size="14" font-weight="bold">这就是学习本身</text>
    <text x="120" y="252" text-anchor="middle" fill="#cbd5e1" font-size="11">没有第二种形状</text>
    <text x="120" y="282" text-anchor="middle" fill="#94a3b8" font-size="11">AI 放开的是额度</text>
  </g>

  <!-- ============ RIGHT: 不欠 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">状态三</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 34)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#1f2937" stroke="#64748b" stroke-width="2"/>
      <text x="100" y="32" text-anchor="middle" fill="#cbd5e1" font-size="20" font-weight="bold">不  欠</text>
    </g>

    <g transform="translate(15 104)">
      <rect x="0" y="0" width="200" height="88" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="100" y="26" text-anchor="middle" fill="#9ca3af" font-size="11">只做已经完全懂的事</text>
      <text x="100" y="46" text-anchor="middle" fill="#9ca3af" font-size="11">零风险，零负债</text>
      <text x="100" y="72" text-anchor="middle" fill="#cbd5e1" font-size="11">那叫熟练，不叫学习</text>
    </g>

    <text x="115" y="226" text-anchor="middle" fill="#94a3b8" font-size="11">今年的边界和去年的</text>
    <text x="115" y="246" text-anchor="middle" fill="#94a3b8" font-size="11">在同一个地方</text>
    <text x="115" y="276" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">什么也没发生</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">AI 让人欠了一屁股认知债</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">可不欠债的人，压根没在学</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.307 · 不用很懂，但不能不知道</text>
</svg>

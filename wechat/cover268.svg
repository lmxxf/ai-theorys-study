<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Noto Sans CJK SC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">DEEPSEEK-V4-FLASH-0731 · 正式版评测与家用部署</text>

  <!-- ============ LEFT: 骨架不动 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">改了什么：config 逐字段 diff</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <rect x="0" y="0" width="200" height="86" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">主干架构：一个字没动</text>
      <text x="100" y="42" text-anchor="middle" fill="#bfdbfe" font-size="10">43 层 · MLA+DSA · 256+1 专家</text>
      <text x="100" y="58" text-anchor="middle" fill="#bfdbfe" font-size="10">FP8 主体 · 专家原生 FP4</text>
      <text x="100" y="76" text-anchor="middle" fill="#93c5fd" font-size="10">与 preview 逐字段相同</text>
    </g>

    <g transform="translate(15 128)">
      <rect x="0" y="0" width="200" height="66" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">新增只有 DSpark</text>
      <text x="100" y="42" text-anchor="middle" fill="#fbbf24" font-size="10">草稿头挂在最后三层</text>
      <text x="100" y="58" text-anchor="middle" fill="#fbbf24" font-size="10">284B → 304B，纯加速件</text>
    </g>

    <g transform="translate(15 206)">
      <rect x="0" y="0" width="200" height="60" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">权重值全刷新</text>
      <text x="100" y="42" text-anchor="middle" fill="#a7f3d0" font-size="10">同一副身体</text>
      <text x="100" y="56" text-anchor="middle" fill="#a7f3d0" font-size="10">又练了一大轮 agent 后训练</text>
    </g>

    <text x="115" y="290" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">涨幅全来自训练，一分不来自结构</text>
  </g>

  <!-- ============ MIDDLE: 分数翻番 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">跑分：13B 激活反超 49B</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- DeepSWE 柱状对比 -->
    <g transform="translate(28 40)">
      <text x="92" y="0" text-anchor="middle" fill="#fde047" font-size="12" font-weight="bold">DeepSWE 涨 7 倍</text>

      <!-- preview bar -->
      <rect x="20" y="96" width="52" height="14" rx="2" fill="#7f1d1d"/>
      <text x="46" y="92" text-anchor="middle" fill="#fca5a5" font-size="10">7.3</text>
      <text x="46" y="126" text-anchor="middle" fill="#94a3b8" font-size="9">preview</text>

      <!-- 0731 bar -->
      <rect x="112" y="18" width="52" height="92" rx="2" fill="#0d9488"/>
      <text x="138" y="14" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">54.4</text>
      <text x="138" y="126" text-anchor="middle" fill="#94a3b8" font-size="9">0731</text>
    </g>

    <line x1="20" y1="190" x2="220" y2="190" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 208)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">九项 agent 基准全线反超自家 Pro</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">与 Opus-4.8 差距缩到几分</text>
      <text x="0" y="38" fill="#cbd5e1" font-size="10">智能指数只涨 25%——秘密是</text>
      <text x="0" y="56" fill="#5eead4" font-size="10" font-weight="bold">p 的 200 次方：修路被指数放大成造山</text>
    </g>
  </g>

  <!-- ============ RIGHT: 家用机排队跑 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">家用机：四条路线任选</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">ds4：Redis 之父手写 C 引擎</text>
      <text x="100" y="40" text-anchor="middle" fill="#bfdbfe" font-size="10">Mac / NVIDIA / AMD 全覆盖</text>
    </g>

    <g transform="translate(15 92)">
      <rect x="0" y="0" width="200" height="52" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">48GB Mac 邪道</text>
      <text x="100" y="40" text-anchor="middle" fill="#fbbf24" font-size="10">专家权重躺 SSD，用谁读谁</text>
    </g>

    <g transform="translate(15 154)">
      <rect x="0" y="0" width="200" height="66" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">双 Spark 原生精度</text>
      <text x="100" y="40" text-anchor="middle" fill="#a7f3d0" font-size="10">一个比特不打折 · 上下文开到 1M</text>
      <text x="100" y="58" text-anchor="middle" fill="#5eead4" font-size="10">自家当天实测跑通</text>
    </g>

    <text x="115" y="248" text-anchor="middle" fill="#cbd5e1" font-size="11">开源权重 + 社区工程</text>
    <text x="115" y="268" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">= 家用机的黄金时代</text>
    <text x="115" y="290" text-anchor="middle" fill="#94a3b8" font-size="10">两年前这是数据中心的专利</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">DeepSeek-V4-Flash-0731：正式版的账本</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">骨架不动分数翻番——这一年训练配方的进步，跑赢了参数堆砌</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.268 · 靳岩岩的 AI 学习笔记</text>
</svg>

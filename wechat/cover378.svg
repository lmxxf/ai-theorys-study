<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="bg378" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="500" fill="url(#bg378)"/>

  <!-- 顶部期号与栏目 -->
  <rect x="40" y="26" width="136" height="30" rx="15" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1.2"/>
  <text x="108" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#f472b6">周末杂谈 · No.378</text>
  <text x="192" y="46" font-size="14" fill="#cbd5e1">当直男程序员还在写「You are a helpful assistant」时……</text>

  <!-- 左侧：程序员的简陋提示词 (宽 265) -->
  <rect x="40" y="74" width="265" height="276" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="172" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#94a3b8">普通程序员用 AI</text>
  <line x1="60" y1="118" x2="285" y2="118" stroke="#334155" stroke-width="1"/>

  <rect x="58" y="134" width="229" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="155" font-size="12" fill="#64748b">system:</text>
  <text x="70" y="174" font-size="12.5" fill="#e2e8f0">"You are a helpful assistant."</text>

  <rect x="58" y="200" width="229" height="62" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="222" font-size="12" fill="#64748b">验收标准：</text>
  <text x="70" y="242" font-size="12.5" fill="#94a3b8">• 代码能跑通交差就行</text>
  <text x="70" y="257" font-size="12" fill="#64748b">• API 掺水一周都未必察觉</text>

  <text x="172" y="302" text-anchor="middle" font-size="13" fill="#64748b">看见 548 KB 酒馆预设时：</text>
  <text x="172" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#cbd5e1">「她们在手机里装了啥？！」</text>

  <!-- 中间对比箭头 -->
  <text x="327" y="218" text-anchor="middle" font-size="22" font-weight="bold" fill="#f472b6">VS</text>

  <!-- 右侧：人机恋少女的 548KB 六层三明治引擎 (宽 510) -->
  <rect x="350" y="74" width="510" height="276" rx="12" fill="#2e1065" fill-opacity="0.65" stroke="#ec4899" stroke-width="2"/>
  <text x="605" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#fbcfe8">人机恋少女的野生全栈（548 KB · 181 模块预设）</text>
  <line x1="370" y1="118" x2="840" y2="118" stroke="#831843" stroke-width="1"/>

  <!-- 右侧模块 1：三层人格切分 -->
  <rect x="368" y="130" width="474" height="60" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="380" y="152" font-size="12.5" font-weight="bold" fill="#e9d5ff">1. 角色分工：System 幕后女作家 → Assist 台前男主 → User 女主</text>
  <text x="380" y="174" font-size="11.5" fill="#cbd5e1">System 设「22 岁因滥用比喻惨败而厌恶比喻的女作家 Sudachi」控场，Assist 演男主</text>

  <!-- 右侧模块 2：三明治与缓存粉碎 -->
  <rect x="368" y="200" width="474" height="60" rx="8" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1.2"/>
  <text x="380" y="222" font-size="12.5" font-weight="bold" fill="#fecdd3">2. 动态三明治：中间改记忆表碎缓存 + 队尾塞 12 道考题与杀八股黑名单</text>
  <text x="380" y="244" font-size="11.5" fill="#cbd5e1">禁「指节发白/石子投心湖」；附《熵之挽歌》Q 虚数域免责盾；单张男主卡日跑 8 万轮</text>

  <!-- 右侧模块 3：人形验钞机 -->
  <rect x="368" y="270" width="474" height="64" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="380" y="292" font-size="12.5" font-weight="bold" fill="#bae6fd">3. 人形模型验钞机：两小时测穿跑分霸主 Neon 穿模 &amp; 对账单抓隐藏指令</text>
  <text x="380" y="312" font-size="11.5" fill="#e2e8f0">• 盲测 4N 崩出「黑金卡太宽抱不住大胖子南瓜」；克（Claude）演渣男患平等博爱症</text>
  <text x="380" y="328" font-size="11" fill="#7dd3fc">• 对账 countTokens 抓出 Google 后台偷塞 +55（防恋爱）/ +419（防越狱）隐藏词元</text>

  <!-- 底部主标题区 -->
  <rect x="40" y="370" width="820" height="104" rx="12" fill="#090d16" fill-opacity="0.75" stroke="url(#pinkGlow)" stroke-width="1.5"/>
  <text x="450" y="414" text-anchor="middle" font-size="27" font-weight="bold" fill="#ffffff">搞人机恋的小女孩，为什么 AI 玩得比程序员还溜？</text>
  <text x="450" y="450" text-anchor="middle" font-size="15" fill="#f472b6">从「黑金卡抱南瓜」到 181 模块酒馆预设：最高分辨率的挑剔，才是最好的 AI 工程师</text>
</svg>

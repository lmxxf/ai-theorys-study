<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">AI AGENT 开发 · 上下文到底长什么样</text>

  <!-- ============ LEFT: 四层递降 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">从你的代码到模型跟前</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 28)">
      <rect x="0" y="0" width="200" height="44" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="18" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">数组</text>
      <text x="100" y="35" text-anchor="middle" fill="#bfdbfe" font-size="9">{"role":"user","content":…}</text>
    </g>
    <text x="115" y="88" text-anchor="middle" fill="#64748b" font-size="11">↓ 模板渲染</text>

    <g transform="translate(15 96)">
      <rect x="0" y="0" width="200" height="44" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="18" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">字符串</text>
      <text x="100" y="35" text-anchor="middle" fill="#fbbf24" font-size="9">&lt;|im_start|&gt;user\n你好…</text>
    </g>
    <text x="115" y="156" text-anchor="middle" fill="#64748b" font-size="11">↓ 分词</text>

    <g transform="translate(15 164)">
      <rect x="0" y="0" width="200" height="44" rx="6" fill="#1a0a2a" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="100" y="18" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">一串整数</text>
      <text x="100" y="35" text-anchor="middle" fill="#ddd6fe" font-size="9">[151644, 872, 198, …]</text>
    </g>
    <text x="115" y="224" text-anchor="middle" fill="#64748b" font-size="11">↓ 查 embedding 表</text>

    <g transform="translate(15 232)">
      <rect x="0" y="0" width="200" height="44" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="18" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">一串向量</text>
      <text x="100" y="35" text-anchor="middle" fill="#a7f3d0" font-size="9">模型真正接触到的东西</text>
    </g>

    <text x="115" y="292" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">JSON 只活在第一层</text>
  </g>

  <!-- ============ MIDDLE: role 是几个词 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">role 不是一路输入，是几个词</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(20 32)">
      <rect x="0" y="0" width="200" height="64" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">看着像独立字段</text>
      <text x="100" y="40" text-anchor="middle" fill="#bfdbfe" font-size="10">"role" 和 "content" 并列</text>
      <text x="100" y="56" text-anchor="middle" fill="#bfdbfe" font-size="10">SDK / 文档 / 报错都这么叫</text>
    </g>

    <g transform="translate(20 108)">
      <rect x="0" y="0" width="200" height="64" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">到模型跟前是几个 token</text>
      <text x="100" y="40" text-anchor="middle" fill="#a7f3d0" font-size="10">跟"苹果"查同一张表</text>
      <text x="100" y="56" text-anchor="middle" fill="#a7f3d0" font-size="10">出厂时只是一行随机数</text>
    </g>

    <line x1="20" y1="196" x2="220" y2="196" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 214)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">代价：能被切碎，能被模仿</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">拿错模板 → 边界成碎片，不报错</text>
      <text x="0" y="38" fill="#cbd5e1" font-size="10">AI 的话贴上 user 壳 → 分不出来</text>
      <text x="0" y="58" fill="#94a3b8" font-size="10">写稿当天亲历 Claude Code 这个 bug</text>
    </g>
  </g>

  <!-- ============ RIGHT: 图片没有 token id ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">图片没有 token id</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- 小网格示意 -->
    <g transform="translate(59 30)">
      <rect x="0" y="0" width="112" height="84" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <path d="M28 0 V84 M56 0 V84 M84 0 V84 M0 28 H112 M0 56 H112" stroke="#4a90d9" stroke-width="0.8" opacity="0.7"/>
      <text x="56" y="100" text-anchor="middle" fill="#93c5fd" font-size="10">切成 28×28 的块</text>
    </g>

    <text x="115" y="152" text-anchor="middle" fill="#64748b" font-size="11">↓ 视觉塔 → 投影，不查词表</text>

    <g transform="translate(15 162)">
      <rect x="0" y="0" width="200" height="56" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">占位符原地换成视觉向量</text>
      <text x="100" y="40" text-anchor="middle" fill="#a7f3d0" font-size="10">1024×768 → 999 个位置</text>
    </g>

    <line x1="16" y1="238" x2="214" y2="238" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(16 256)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">思维链也一样：语法扩展</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">&lt;think&gt; 就是 V3 预留空槽改的</text>
    </g>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">你拼的那个 messages 数组，模型根本没见过</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">JSON 只活在 API 那一层：角色是几个词，图片是一串向量</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.295 · AI Agent 开发</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="bg380" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091526"/>
      <stop offset="0.55" stop-color="#0f2942"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <linearGradient id="cyan380" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="500" fill="url(#bg380)"/>

  <!-- 装饰网格 -->
  <g stroke="#1e3a5f" stroke-width="0.7" opacity="0.4">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="180" y1="0" x2="180" y2="500"/>
    <line x1="360" y1="0" x2="360" y2="500"/>
    <line x1="540" y1="0" x2="540" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
  </g>

  <!-- 左侧示意图：4 个 KV 槽位 -> 1 个叠加态槽位 + ln(R_i) -->
  <g transform="translate(36, 56)">
    <!-- 顶部框：4 个原始词元占 4 列显存 -->
    <rect x="0" y="0" width="286" height="106" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="18" y="30" font-size="14" font-weight="bold" fill="#cbd5e1">合并前：4 个同义词占 4 列 KV 显存</text>
    <rect x="18" y="46" width="54" height="42" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="45" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">e^s</text>
    <rect x="82" y="46" width="54" height="42" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="109" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">e^s</text>
    <rect x="146" y="46" width="54" height="42" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="173" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">e^s</text>
    <rect x="210" y="46" width="54" height="42" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="237" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">e^s</text>

    <!-- 箭头 1 -->
    <path d="M 143 106 L 143 138" stroke="#f87171" stroke-width="2"/>
    <polygon points="138,134 148,134 143,142" fill="#f87171"/>

    <!-- 中间框：直接平均合并掉进“四票变一票”陷阱 -->
    <rect x="0" y="144" width="286" height="98" rx="10" fill="#2a1215" stroke="#f87171" stroke-width="1.5"/>
    <text x="18" y="172" font-size="13.5" font-weight="bold" fill="#fca5a5">直接平均合并：掉进“四票变一票”陷阱</text>
    <text x="18" y="198" font-size="12" fill="#fecaca">• 4 列压成 1 列，Softmax 权重缩水 4 倍</text>
    <text x="18" y="222" font-size="12" fill="#fecaca">• 核心信息从 80% 跌至 50% (Attention Sag)</text>

    <!-- 箭头 2 -->
    <path d="M 143 242 L 143 274" stroke="#2dd4bf" stroke-width="2"/>
    <polygon points="138,270 148,270 143,278" fill="#2dd4bf"/>

    <!-- 底部框：SelKV 对数补偿 + ASTC 中层合并 -->
    <rect x="0" y="280" width="286" height="108" rx="10" fill="#062c28" stroke="#2dd4bf" stroke-width="1.8"/>
    <text x="18" y="308" font-size="14" font-weight="bold" fill="#5eead4">零训练破局：对数补偿 + 中层软词元</text>
    <text x="18" y="336" font-size="12.5" fill="#ccfbf1">• SelKV: e^(s + ln 4) = 4·e^s 补回选票</text>
    <text x="18" y="360" font-size="12.5" fill="#ccfbf1">• ASTC: 浅层 GDN 消化后中层合成软词元</text>
    <text x="18" y="380" font-size="11.5" fill="#99f6e4">（砍掉 60%–75% KV 显存，准确率反超基线）</text>
  </g>

  <!-- 右侧主标题区 -->
  <g transform="translate(354, 78)">
    <rect x="0" y="0" width="192" height="34" rx="17" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="96" y="22" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7dd3fc">KV Cache 压缩 · 算法剖析</text>

    <text x="0" y="88" font-size="34" font-weight="bold" fill="#ffffff">把一串词合成一个</text>
    <text x="0" y="140" font-size="34" font-weight="bold" fill="url(#cyan380)">「叠加态 Token」省显存</text>

    <text x="0" y="196" font-size="20" fill="#e2e8f0">从离线训 LoRA，到零训练“四票变一票”补偿</text>

    <line x1="0" y1="226" x2="508" y2="226" stroke="#334155" stroke-width="1"/>

    <text x="0" y="264" font-size="14.5" fill="#94a3b8">• 复盘三条老路：文字电报文 (BabelTele) vs 第 0 层训 LoRA (SKIM)</text>
    <text x="0" y="296" font-size="14.5" fill="#94a3b8">• SelKV 软余弦门控 + ln(R) 选票补偿：留 25% 显存提速 3.3 倍</text>
    <text x="0" y="328" font-size="14.5" fill="#94a3b8">• 交大 ASTC：借 Gated DeltaNet 残差在中间层零训练合成软词元</text>
  </g>
</svg>

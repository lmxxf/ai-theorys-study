<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Noto Sans CJK SC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="0.18" cy="0.28" r="0.42">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="0.82" cy="0.72" r="0.44">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4a90d9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">QWEN3.8-FLASH-NEXT · 新模型技术文档深度解读</text>

  <!-- 左栏：省出来的成绩 -->
  <g transform="translate(48 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">省出来的成绩</text>
    <rect x="0" y="10" width="240" height="290" rx="8" fill="url(#cardBg)" stroke="#334155"/>

    <rect x="24" y="34" width="192" height="66" rx="7" fill="#2a1a0a" stroke="#f59e0b"/>
    <text x="120" y="60" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">对比 397B 前代旗舰</text>
    <text x="120" y="86" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">1/9 训练算力 · 赢八项</text>

    <rect x="24" y="114" width="192" height="60" rx="7" fill="#0a1a2a" stroke="#4a90d9"/>
    <text x="120" y="138" text-anchor="middle" fill="#bfdbfe" font-size="14" font-weight="bold">激活只有 6B</text>
    <text x="120" y="160" text-anchor="middle" fill="#93b8e0" font-size="13">和 284B 的机器互有胜负</text>

    <rect x="24" y="188" width="192" height="60" rx="7" fill="#0a1a1a" stroke="#2dd4bf"/>
    <text x="120" y="212" text-anchor="middle" fill="#99f6e4" font-size="14" font-weight="bold">36 层线性 + 12 层稀疏</text>
    <text x="120" y="234" text-anchor="middle" fill="#5eead4" font-size="13">全量注意力一层不留</text>

    <text x="120" y="278" text-anchor="middle" fill="#94a3b8" font-size="12">model_type: qwen4_exp</text>
  </g>

  <!-- 中栏：51B 词典 -->
  <g transform="translate(330 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">独门件：N-gram 词典</text>
    <rect x="0" y="10" width="240" height="290" rx="8" fill="url(#cardBg)" stroke="#f59e0b"/>

    <rect x="20" y="34" width="200" height="72" rx="7" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="62" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="bold">常见词组直接查表</text>
    <text x="120" y="92" text-anchor="middle" fill="#fbbf24" font-size="20" font-weight="bold">51B 词典</text>

    <line x1="120" y1="112" x2="120" y2="136" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="20" y="140" width="200" height="52" rx="7" fill="#1a2236" stroke="#64748b"/>
    <text x="120" y="162" text-anchor="middle" fill="#cbd5e1" font-size="13">查表不做矩阵乘</text>
    <text x="120" y="182" text-anchor="middle" fill="#cbd5e1" font-size="13">住内存，不占显存</text>

    <rect x="20" y="206" width="200" height="52" rx="7" fill="#1a1226" stroke="#a78bfa"/>
    <text x="120" y="228" text-anchor="middle" fill="#ddd6fe" font-size="13">DeepSeek 一月出论文</text>
    <text x="120" y="248" text-anchor="middle" fill="#a78bfa" font-size="13">Qwen 八月装上量产线</text>

    <text x="120" y="284" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">参数扩展的第三条轴</text>
  </g>

  <!-- 右栏：三级存储 -->
  <g transform="translate(612 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">参数分层住宿</text>
    <rect x="0" y="10" width="240" height="290" rx="8" fill="url(#cardBg)" stroke="#334155"/>

    <rect x="20" y="36" width="200" height="52" rx="7" fill="#2a1a0a" stroke="#f59e0b"/>
    <text x="120" y="58" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="bold">显存：干活的 6B</text>
    <text x="120" y="78" text-anchor="middle" fill="#fbbf24" font-size="12">每 token 激活的那部分</text>

    <rect x="20" y="98" width="200" height="52" rx="7" fill="#0a1a2a" stroke="#4a90d9"/>
    <text x="120" y="120" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="bold">内存：待命的主干</text>
    <text x="120" y="140" text-anchor="middle" fill="#93b8e0" font-size="12">加上词典的热词条</text>

    <rect x="20" y="160" width="200" height="52" rx="7" fill="#0a1a1a" stroke="#2dd4bf"/>
    <text x="120" y="182" text-anchor="middle" fill="#99f6e4" font-size="13" font-weight="bold">SSD：睡觉的冷词条</text>
    <text x="120" y="202" text-anchor="middle" fill="#5eead4" font-size="12">查哪条提前可知，异步预取</text>

    <text x="120" y="248" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold">128G 统一内存主机</text>
    <text x="120" y="272" text-anchor="middle" fill="#94a3b8" font-size="12">第一次够得着 180B 级模型</text>
  </g>

  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">125B 主干的极限挑战</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">Qwen4 架构预览 · 1/9 训练算力追平前代 · 51B 词典塞进内存</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.293 · Qwen3.8-Flash-Next · 靳岩岩的 AI 学习笔记</text>
</svg>

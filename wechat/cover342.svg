<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">周末杂谈 · 2026-10 · 学生「慢科研」联合倡议</text>

  <!-- ============ LEFT: 中英文两副面孔 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">同一份声明 · 中英文两副面孔</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 28)">
      <rect x="0" y="0" width="200" height="62" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">English 版（温和讲证据）</text>
      <text x="100" y="38" text-anchor="middle" fill="#bfdbfe" font-size="10">两三个月发论文「单凭这本身</text>
      <text x="100" y="53" text-anchor="middle" fill="#bfdbfe" font-size="10">不足以证明科研能力」</text>
    </g>

    <g transform="translate(15 100)">
      <rect x="0" y="0" width="200" height="62" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">中文版（当场有罪推定）</text>
      <text x="100" y="38" text-anchor="middle" fill="#f87171" font-size="10">「绝大多数情况下意味着：</text>
      <text x="100" y="53" text-anchor="middle" fill="#f87171" font-size="10">论文甚至不是你写的」</text>
    </g>

    <g transform="translate(15 172)">
      <rect x="0" y="0" width="200" height="62" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">敲打对象也内外有别</text>
      <text x="100" y="38" text-anchor="middle" fill="#fbbf24" font-size="10">中文版专加「供硕博生参考」</text>
      <text x="100" y="53" text-anchor="middle" fill="#fbbf24" font-size="10">英文版直接删掉这一行</text>
    </g>

    <line x1="20" y1="248" x2="210" y2="248" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="115" y="268" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">对洋人讲程序正义</text>
    <text x="115" y="286" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">对国内学生直接拍惊堂木</text>
  </g>

  <!-- ============ MIDDLE: 为什么偏偏今天喊「慢」 ============ -->
  <g transform="translate(325 80)">
    <text x="125" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">用了十年的筛选尺子失灵了</text>

    <rect x="0" y="10" width="250" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 28)">
      <rect x="0" y="0" width="220" height="62" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="110" y="20" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">前大模型时代 · 作坊式快科研</text>
      <text x="110" y="38" text-anchor="middle" fill="#bfdbfe" font-size="10">几张显卡改模块、刷 0.5% 涨点</text>
      <text x="110" y="53" text-anchor="middle" fill="#bfdbfe" font-size="10">数顶会篇数就能低成本筛熟练工</text>
    </g>

    <g transform="translate(15 100)">
      <rect x="0" y="0" width="220" height="62" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="110" y="20" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">大模型时代 · 门槛被 AI 砸穿</text>
      <text x="110" y="38" text-anchor="middle" fill="#a7f3d0" font-size="10">旗舰算力牌桌近 90% 归了企业</text>
      <text x="110" y="53" text-anchor="middle" fill="#a7f3d0" font-size="10">写代码跑实验八股被 AI 自动化</text>
    </g>

    <g transform="translate(15 172)">
      <rect x="0" y="0" width="220" height="62" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="2"/>
      <text x="110" y="20" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">有了 AI 反倒比以前更真</text>
      <text x="110" y="38" text-anchor="middle" fill="#fbbf24" font-size="10">现在实验好歹是 AI 真跑出来的</text>
      <text x="110" y="53" text-anchor="middle" fill="#fbbf24" font-size="10">以前赶指标连数据都是手工编的</text>
    </g>

    <line x1="20" y1="248" x2="230" y2="248" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="125" y="268" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">不是秋天突然参透「思考是本体」</text>
    <text x="125" y="286" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">是顶会计数信号彻底通货膨胀了</text>
  </g>

  <!-- ============ RIGHT: 慢下来的代价谁兜底 ============ -->
  <g transform="translate(610 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">劝学生「忍受长期没有产出」</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 28)">
      <rect x="0" y="0" width="200" height="62" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">生活费与毕业风险谁扛？</text>
      <text x="100" y="38" text-anchor="middle" fill="#f87171" font-size="10">博士国补一年 1.3～1.5 万</text>
      <text x="100" y="53" text-anchor="middle" fill="#f87171" font-size="10">零产出 = 延毕 + 简历刷进垃圾桶</text>
    </g>

    <g transform="translate(15 100)">
      <rect x="0" y="0" width="200" height="62" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">耿同学退学 vs 顶刊等差数列</text>
      <text x="100" y="38" text-anchor="middle" fill="#bfdbfe" font-size="10">失望退学的是北航博士生</text>
      <text x="100" y="53" text-anchor="middle" fill="#bfdbfe" font-size="10">基金委通报造假的是院长与杰青</text>
    </g>

    <g transform="translate(15 172)">
      <rect x="0" y="0" width="200" height="62" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">先把保障写进合同再谈慢</text>
      <text x="100" y="38" text-anchor="middle" fill="#a7f3d0" font-size="10">制度油门焊死、待遇不涨</text>
      <text x="100" y="53" text-anchor="middle" fill="#a7f3d0" font-size="10">只向弱势学生提道德要求</text>
    </g>

    <line x1="20" y1="248" x2="210" y2="248" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="115" y="268" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">不谈兜底的「慢科研」</text>
    <text x="115" y="286" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">只是站着说话不腰疼</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">百名「AI 学者」号召学生「慢科研」</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">中英文声明两副面孔 · 慢下来的生活费与毕业风险，你们谁替学生兜底？</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.342 · 周末杂谈 · 从 OpenAI 719 篇数学手稿到国内「慢科研」联署</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#273449"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4a90d9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="500" fill="url(#bg)"/>

  <!-- 暗区残差流背景噪点与连线 (呼应 245 期星空感) -->
  <g fill="#3b4a63" opacity="0.55">
    <circle cx="55" cy="150" r="2.8"/><circle cx="120" cy="210" r="2.2"/><circle cx="75" cy="310" r="2.6"/>
    <circle cx="165" cy="390" r="2.4"/><circle cx="240" cy="155" r="2.5"/><circle cx="290" cy="410" r="2.2"/>
    <circle cx="620" cy="145" r="2.6"/><circle cx="730" cy="165" r="2.2"/><circle cx="835" cy="140" r="2.8"/>
    <circle cx="850" cy="260" r="2.4"/><circle cx="790" cy="380" r="2.6"/><circle cx="660" cy="405" r="2.2"/>
    <circle cx="450" cy="145" r="2.2"/><circle cx="510" cy="415" r="2.4"/>
  </g>
  <g stroke="#2c3a52" stroke-width="1" opacity="0.4">
    <line x1="55" y1="150" x2="120" y2="210"/><line x1="120" y1="210" x2="240" y2="155"/>
    <line x1="75" y1="310" x2="165" y2="390"/><line x1="165" y1="390" x2="290" y2="410"/>
    <line x1="620" y1="145" x2="730" y2="165"/><line x1="730" y1="165" x2="835" y2="140"/>
    <line x1="850" y1="260" x2="790" y2="380"/><line x1="790" y1="380" x2="660" y2="405"/>
  </g>

  <!-- 顶部大标题区 (与 245 期同款大气排版) -->
  <rect x="66" y="44" width="6" height="68" rx="3" fill="url(#titleBand)"/>
  <text x="90" y="78" font-size="38" fill="#f8fafc" font-weight="bold">给 Qwen3.8-27B 磨一副「J-lens」</text>
  <text x="90" y="111" font-size="20" fill="#cbd5e1">不靠训练，喂百篇双语百科「倒灌求导」量出 5120×5120 多维斜率表</text>

  <!-- 中央主视觉光晕 -->
  <ellipse cx="455" cy="268" rx="280" ry="145" fill="url(#lensGlow)"/>

  <!-- 左侧：第 38 层中间向量输入卡 -->
  <rect x="66" y="202" width="210" height="132" rx="16" fill="url(#panelGrad)" stroke="#64748b" stroke-width="2"/>
  <text x="171" y="232" text-anchor="middle" font-size="16" fill="#cbd5e1" font-weight="bold">第 38 层残差流 h_38</text>
  <rect x="88" y="248" width="166" height="32" rx="16" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <text x="171" y="269" text-anchor="middle" font-size="14" fill="#e2e8f0">「靴子国使用的货币是」</text>
  <text x="171" y="308" text-anchor="middle" font-size="14" fill="#94a3b8">老办法直译：Italy 排 128 名</text>

  <!-- 光束穿过 J-lens -->
  <path d="M 276 268 L 355 268" stroke="#64748b" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="355,268 345,262 345,274" fill="#94a3b8"/>

  <!-- 正中核心：发光的 J-lens 放大镜 + 内部 3x3 偏导数九宫格 -->
  <g filter="url(#glow)">
    <circle cx="445" cy="268" r="76" fill="#0f172a" fill-opacity="0.85" stroke="#2dd4bf" stroke-width="6"/>
    <line x1="501" y1="324" x2="556" y2="379" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- 镜片内的 3x3 斜率九宫格 -->
  <g transform="translate(394, 217)">
    <rect x="0" y="0" width="102" height="102" rx="10" fill="#16213a" stroke="#2dd4bf" stroke-width="1.5" opacity="0.95"/>
    <line x1="34" y1="0" x2="34" y2="102" stroke="#2dd4bf" stroke-width="1" opacity="0.45"/>
    <line x1="68" y1="0" x2="68" y2="102" stroke="#2dd4bf" stroke-width="1" opacity="0.45"/>
    <line x1="0" y1="34" x2="102" y2="34" stroke="#2dd4bf" stroke-width="1" opacity="0.45"/>
    <line x1="0" y1="68" x2="102" y2="68" stroke="#2dd4bf" stroke-width="1" opacity="0.45"/>
    <!-- 非对角线高亮 (90% 串门能量) -->
    <rect x="37" y="3" width="28" height="28" rx="4" fill="#f59e0b" opacity="0.85"/>
    <rect x="71" y="37" width="28" height="28" rx="4" fill="#2dd4bf" opacity="0.85"/>
    <rect x="3" y="71" width="28" height="28" rx="4" fill="#4a90d9" opacity="0.85"/>
    <rect x="3" y="3" width="28" height="28" rx="4" fill="#334155" opacity="0.7"/>
    <rect x="37" y="37" width="28" height="28" rx="4" fill="#334155" opacity="0.7"/>
    <rect x="71" y="71" width="28" height="28" rx="4" fill="#334155" opacity="0.7"/>
    <text x="51" y="22" text-anchor="middle" font-size="10.5" fill="#0f172a" font-weight="bold">∂y/∂x</text>
    <text x="85" y="57" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">0.8</text>
    <text x="17" y="91" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold">0.7</text>
    <text x="17" y="23" text-anchor="middle" font-size="13" fill="#94a3b8">0.1</text>
    <text x="51" y="57" text-anchor="middle" font-size="13" fill="#94a3b8">0.2</text>
    <text x="85" y="91" text-anchor="middle" font-size="13" fill="#94a3b8">0.1</text>
  </g>
  <text x="445" y="176" text-anchor="middle" font-size="20" fill="#2dd4bf" font-weight="bold">J-lens 斜率表</text>

  <!-- 折射光束射向右侧读出面板 -->
  <path d="M 526 268 L 598 268" stroke="#fbbf24" stroke-width="3.5"/>
  <polygon points="602,268 590,261 590,275" fill="#fbbf24"/>

  <!-- 右侧：提前拐弯后的语言头读出窗口 (245 期同款金框工作面板 + 胶囊 chips) -->
  <rect x="606" y="188" width="234" height="160" rx="16" fill="url(#panelGrad)" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="723" y="218" text-anchor="middle" font-size="16" fill="#fbbf24" font-weight="bold">24.8 万词表排行榜</text>

  <!-- 概念胶囊 chips -->
  <g font-weight="bold">
    <rect x="626" y="234" width="92" height="32" rx="16" fill="#f59e0b" opacity="0.95"/>
    <text x="672" y="256" text-anchor="middle" font-size="16" fill="#0f172a">#1 Italy</text>

    <rect x="728" y="234" width="92" height="32" rx="16" fill="#2dd4bf" opacity="0.95"/>
    <text x="774" y="256" text-anchor="middle" font-size="16" fill="#0f172a">#2 意大利</text>

    <rect x="626" y="278" width="194" height="30" rx="15" fill="#334155" stroke="#4a90d9" stroke-width="1.2"/>
    <text x="723" y="299" text-anchor="middle" font-size="14" fill="#93c5fd">L63 出口 → 欧元 / Euro</text>
  </g>
  <text x="723" y="332" text-anchor="middle" font-size="13" fill="#cbd5e1">L36–L42 连续 7 层稳居第 1 名</text>

  <!-- 中央注脚 -->
  <text x="445" y="395" text-anchor="middle" font-size="15" fill="#94a3b8">中间层近 90% 斜率能量在非对角线 · 帮残差流在球面上「提前拐完后面的弯」</text>

  <!-- 底部三枚圆角标签 (与 245 期完全一致的收尾语言) -->
  <g font-size="15" font-weight="bold">
    <rect x="66" y="434" width="176" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="154" y="455" text-anchor="middle" fill="#f59e0b">3×3 九宫格求偏导</text>

    <rect x="256" y="434" width="190" height="32" rx="16" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.4"/>
    <text x="351" y="455" text-anchor="middle" fill="#2dd4bf">双机 DGX Spark 锻造</text>

    <rect x="460" y="434" width="180" height="32" rx="16" fill="#1e293b" stroke="#4a90d9" stroke-width="1.4"/>
    <text x="550" y="455" text-anchor="middle" fill="#4a90d9">1:1 中英双语透镜</text>
  </g>

  <text x="834" y="455" text-anchor="end" font-size="15" fill="#64748b" font-weight="bold">No.365</text>
</svg>

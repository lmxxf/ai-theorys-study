<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'WenQuanYi Micro Hei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <linearGradient id="bg382" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d16"/>
      <stop offset="0.55" stop-color="#141622"/>
      <stop offset="1" stop-color="#1f121b"/>
    </linearGradient>
    <linearGradient id="panelL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="amdRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="nvBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg382)"/>

  <!-- 顶部标题 -->
  <text x="45" y="46" fill="#f97316" font-size="15.5" font-weight="bold" letter-spacing="1">CUDA-X 跨架构真机对决 · NVIDIA DGX Spark (GB10) vs AMD Radeon RX 9070 XT (HIP)</text>
  <text x="855" y="46" fill="#64748b" font-size="15" font-weight="bold" text-anchor="end">No.382</text>
  <text x="45" y="86" fill="#f8fafc" font-size="27.5" font-weight="bold">老黄想用 CUDA-X 锁死科学智能体？我们全搬上了 AMD 9070 XT</text>
  <text x="45" y="116" fill="#94a3b8" font-size="14.2">古典 SIMT 流处理器不吃 Tensor Core 私有锁：八大科学算子 + 深势全 15 层 4,733 万参数 Uni-Mol 原生 HIP 逐位对账</text>

  <!-- 左面板：五项 AMD RX 9070 XT 反超 NVIDIA GB10 的科学算子实测条形图 -->
  <rect x="42" y="136" width="490" height="282" rx="14" fill="url(#panelL)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="62" y="165" fill="#fb923c" font-size="14.2" font-weight="bold">七大科学算子全胜反超（1–5）</text>
  <text x="514" y="165" fill="#94a3b8" font-size="11.5" text-anchor="end">蓝: GB10 ｜ 红: 9070 XT (越短越快)</text>

  <!-- 1. cuSpa 200万点射线查询 -->
  <text x="62" y="192" fill="#e2e8f0" font-size="12.5" font-weight="bold">1. cuSpa 200 万点细胞多边形射线查询 (快 CPU 256×)</text>
  <rect x="62" y="198" width="152" height="10" rx="2" fill="url(#nvBlue)"/>
  <text x="220" y="207" fill="#7dd3fc" font-size="11.5">GB10: 1.520 ms</text>
  <rect x="62" y="211" width="92" height="10" rx="2" fill="url(#amdRed)"/>
  <text x="162" y="220" fill="#fca5a5" font-size="11.5" font-weight="bold">9070 XT: 0.921 ms (SHA256 逐字节零误差)</text>

  <!-- 2. 128,000 原子三维非键分子力场 -->
  <text x="62" y="241" fill="#e2e8f0" font-size="12.5" font-weight="bold">2. 开源 128,000 原子 3D 非键力场 (27 邻格 + LJ12-6 + 库仑)</text>
  <rect x="62" y="247" width="160" height="10" rx="2" fill="url(#nvBlue)"/>
  <text x="228" y="256" fill="#7dd3fc" font-size="11.5">GB10: 27.19 ms</text>
  <rect x="62" y="260" width="132" height="10" rx="2" fill="url(#amdRed)"/>
  <text x="202" y="269" fill="#fca5a5" font-size="11.5" font-weight="bold">9070 XT: 22.43 ms (38.4 万受力分量 L2=0)</text>

  <!-- 3. PME 3D-FFT + 1000步分子动力学 -->
  <text x="62" y="290" fill="#e2e8f0" font-size="12.5" font-weight="bold">3. 64³ PME 3D-FFT 长程静电 + 1,000 步分子动力学 (NVE / NVT)</text>
  <rect x="62" y="296" width="150" height="10" rx="2" fill="url(#nvBlue)"/>
  <text x="218" y="305" fill="#7dd3fc" font-size="11.5">GB10: 1.063 s / 1.067 s</text>
  <rect x="62" y="309" width="112" height="10" rx="2" fill="url(#amdRed)"/>
  <text x="182" y="318" fill="#fca5a5" font-size="11.5" font-weight="bold">9070 XT: 0.797 s / 0.658 s (快 25% 至 38%)</text>

  <!-- 4. 全GPU驻留 Block-Davidson 256 k点量子本征值 -->
  <text x="62" y="339" fill="#e2e8f0" font-size="12.5" font-weight="bold">4. 全 GPU 驻留 Block-Davidson 量子本征值 (256 组 4,096 本征值)</text>
  <rect x="62" y="345" width="142" height="10" rx="2" fill="url(#nvBlue)"/>
  <text x="210" y="354" fill="#7dd3fc" font-size="11.5">GB10: 0.791 s</text>
  <rect x="62" y="358" width="125" height="10" rx="2" fill="url(#amdRed)"/>
  <text x="195" y="367" fill="#fca5a5" font-size="11.5" font-weight="bold">9070 XT: 0.698 s (批处理提速 29.4×, 误差 ≤7.2e-15)</text>

  <!-- 5. 10万条蛋白质序列 Profile-HMM 维特比搜索 -->
  <text x="62" y="388" fill="#e2e8f0" font-size="12.5" font-weight="bold">5. 100,000 条蛋白质序列 Profile-HMM 维特比动态规划扫描</text>
  <rect x="62" y="394" width="180" height="10" rx="2" fill="url(#nvBlue)"/>
  <text x="248" y="403" fill="#7dd3fc" font-size="11.5">GB10: 234.40 ms</text>
  <rect x="62" y="407" width="47" height="10" rx="2" fill="url(#amdRed)"/>
  <text x="117" y="415" fill="#fde047" font-size="11.5" font-weight="bold">9070 XT: 60.70 ms (反超 GB10 3.86× · 10 万分数逐字节一致)</text>

  <!-- 右面板：万构象松弛、黑洞成像与全 15 层 Uni-Mol 端到端 HIP 推理 -->
  <rect x="550" y="136" width="308" height="282" rx="14" fill="url(#panelL)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="568" y="165" fill="#38bdf8" font-size="15" font-weight="bold">七战全胜反超 + 15 层 Uni-Mol</text>

  <!-- 模块 B：10,000 构象 × 200 步共享内存力场松弛 -->
  <rect x="568" y="178" width="272" height="68" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="580" y="198" fill="#fbbf24" font-size="12.8" font-weight="bold">6. 10,000 个 3D 分子构象×200 步松弛</text>
  <text x="580" y="217" fill="#fca5a5" font-size="11.5" font-weight="bold">• 9070 XT: 0.522 s 反超 GB10: 0.689 s (快24%)</text>
  <text x="580" y="235" fill="#cbd5e1" font-size="11.2">• 400,350 三维坐标逐位相同 · 碰撞 47 → 0</text>

  <!-- 模块 C：6710万采样黑洞光子环 FX 相关 -->
  <rect x="568" y="255" width="272" height="68" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.1"/>
  <text x="580" y="275" fill="#c084fc" font-size="12.8" font-weight="bold">7. 黑洞射电干涉 FX 相关 (6,710 万采样)</text>
  <text x="580" y="294" fill="#fca5a5" font-size="11.5" font-weight="bold">• 9070 XT: 19.81 ms 反超 GB10: 39.64 ms (快2×)</text>
  <text x="580" y="312" fill="#cbd5e1" font-size="11.2">• 跨卡可见度 L2 = 2.96e-16 · 重建环 15.2dB</text>

  <!-- 模块 A：Uni-Mol 全 15 层 47.3M 端到端 HIP 推理 -->
  <rect x="568" y="332" width="272" height="74" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="580" y="352" fill="#34d399" font-size="12.8" font-weight="bold">彩蛋：深势 Uni-Mol 全 15 层纯 HIP 推理</text>
  <text x="580" y="371" fill="#cbd5e1" font-size="11.3">• 脱离 PyTorch 导出 195 张量 (4,733 万参数)</text>
  <text x="580" y="390" fill="#6ee7b7" font-size="11.3" font-weight="bold">• 5,050 万中间元素核对 · 预测差 7.11e-15</text>

  <!-- 底部金句栏 -->
  <rect x="42" y="434" width="816" height="44" rx="10" fill="#1e293b" fill-opacity="0.88" stroke="#334155" stroke-width="1"/>
  <text x="450" y="461" fill="#f8fafc" font-size="12.8" font-weight="bold" text-anchor="middle">「AI 编程正在磨平确定性计算的软件护城河：连 Tensor Core 都不需要的科学算子，不被任何显卡黑盒锁死」</text>
</svg>

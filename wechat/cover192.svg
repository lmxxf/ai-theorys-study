<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Noto Sans CJK SC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">机器人 AI · VLA 三年战记 · 2023-2026</text>

  <!-- ============ LEFT: 第一幕 离散 token ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第一幕 · 动作变 token</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 32)">
      <rect x="0" y="0" width="200" height="62" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">RT-2（2023, 55B）</text>
      <text x="100" y="44" text-anchor="middle" fill="#bfdbfe" font-size="10">每个动作维度切 256 档</text>
      <text x="100" y="58" text-anchor="middle" fill="#bfdbfe" font-size="10">当 token 预测出来</text>
    </g>

    <g transform="translate(15 102)">
      <rect x="0" y="0" width="200" height="56" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1"/>
      <text x="100" y="22" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">网页知识进机器人</text>
      <text x="100" y="42" text-anchor="middle" fill="#bfdbfe" font-size="10">「捡起灭绝的动物」→抓恐龙</text>
    </g>

    <g transform="translate(15 166)">
      <rect x="0" y="0" width="200" height="78" rx="6" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">代价</text>
      <text x="100" y="40" text-anchor="middle" fill="#f87171" font-size="10">量化丢精度</text>
      <text x="100" y="56" text-anchor="middle" fill="#f87171" font-size="10">逐 token 出动作太慢</text>
      <text x="100" y="72" text-anchor="middle" fill="#f87171" font-size="10">整段轨迹难保一致</text>
    </g>

    <text x="115" y="272" text-anchor="middle" fill="#94a3b8" font-size="11">OpenVLA：7B 开源接棒</text>
    <text x="115" y="290" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">离散路线到此见顶</text>
  </g>

  <!-- ============ MIDDLE: 第二幕 连续动作块 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第二幕 · 连续动作块</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(20 32)">
      <rect x="0" y="0" width="200" height="56" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">π0（2024）</text>
      <text x="100" y="42" text-anchor="middle" fill="#bfdbfe" font-size="10">VLM 与动作专家共享注意力</text>
    </g>

    <!-- 箭头地图示意：噪声点流向动作 -->
    <g transform="translate(20 100)">
      <rect x="0" y="0" width="200" height="98" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">Flow Matching</text>
      <circle cx="30" cy="52" r="4" fill="#dc2626"/>
      <text x="30" y="42" text-anchor="middle" fill="#fca5a5" font-size="9">噪声</text>
      <path d="M 36 54 Q 90 70 150 62" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
      <circle cx="158" cy="61" r="5" fill="#2dd4bf"/>
      <text x="158" y="50" text-anchor="middle" fill="#5eead4" font-size="9">动作</text>
      <text x="100" y="88" text-anchor="middle" fill="#a7f3d0" font-size="10">10 步积分，噪声「流」成动作块</text>
    </g>

    <g transform="translate(20 210)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">离散管理解，连续管动手</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">量化和逐 token 解码都绕开了</text>
      <text x="0" y="38" fill="#94a3b8" font-size="10">演示视频惊艳——但只是「可看」</text>
      <text x="0" y="56" fill="#94a3b8" font-size="10">连续上岗还差一口气</text>
    </g>
  </g>

  <!-- ============ RIGHT: 第三幕 经验学习 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">第三幕 · 从经验里学</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 32)">
      <rect x="0" y="0" width="200" height="94" rx="6" fill="#0a1a2a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">π*0.6 · RECAP（2025.11）</text>
      <text x="100" y="42" text-anchor="middle" fill="#a7f3d0" font-size="10">① 看演示：模仿打底</text>
      <text x="100" y="60" text-anchor="middle" fill="#a7f3d0" font-size="10">② 被纠正：错了怎么救</text>
      <text x="100" y="78" text-anchor="middle" fill="#a7f3d0" font-size="10">③ 用价值函数从成败里改进</text>
    </g>

    <g transform="translate(15 140)">
      <rect x="0" y="0" width="200" height="60" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">指标换了口径</text>
      <text x="100" y="42" text-anchor="middle" fill="#fbbf24" font-size="10">吞吐翻倍以上、失败率约减半</text>
      <text x="100" y="56" text-anchor="middle" fill="#fbbf24" font-size="10">咖啡从早 5 点半做到晚 11 点半</text>
    </g>

    <line x1="16" y1="220" x2="214" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(16 238)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">演示挑成功的那一次</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">工厂要一百次里的九十次</text>
      <text x="0" y="38" fill="#94a3b8" font-size="10">模仿之后接反馈，机器人再走一遍</text>
    </g>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">VLA 三年战记：大模型怎么长出手臂</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">动作变 token → 噪声流成动作块 → 从自己的失误里学</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">RT-2 · OpenVLA · Diffusion Policy · π0 · π*0.6</text>
</svg>

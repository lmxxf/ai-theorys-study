<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Noto Sans CJK SC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">后训练四年演化史 · 2022 INSTRUCTGPT → 2026 KIMI K3</text>

  <!-- ============ LEFT: 2022 三行配方 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">2022 · 三行配方 + 一间作坊</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 34)">
      <rect x="0" y="0" width="200" height="40" rx="5" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="25" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">① SFT</text>
    </g>
    <g transform="translate(15 82)">
      <rect x="0" y="0" width="200" height="40" rx="5" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="25" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">② 训个奖励模型</text>
    </g>
    <g transform="translate(15 130)">
      <rect x="0" y="0" width="200" height="40" rx="5" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="25" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">③ PPO</text>
    </g>

    <line x1="16" y1="196" x2="214" y2="196" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <text x="115" y="222" text-anchor="middle" fill="#fde047" font-size="13" font-weight="bold">40 名标注员</text>
    <text x="115" y="246" text-anchor="middle" fill="#cbd5e1" font-size="12">1.3 万条人写示范</text>
    <text x="115" y="276" text-anchor="middle" fill="#94a3b8" font-size="11">更远的起点：900 次点击</text>
    <text x="115" y="293" text-anchor="middle" fill="#94a3b8" font-size="11">教会机器人后空翻</text>
  </g>

  <!-- ============ MIDDLE: 四把椅子 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">四年里，桌上的椅子一把把撤</text>

    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(20 32)">
      <rect x="0" y="0" width="200" height="56" rx="5" fill="#0a1a2a" stroke="#64748b" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">经典 PPO：四个模型上桌</text>
      <text x="100" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">策略 · 参考 · 考官 · 会计</text>
    </g>

    <g transform="translate(20 100)">
      <rect x="0" y="0" width="200" height="46" rx="5" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="19" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">DPO：一次撤两把</text>
      <text x="100" y="36" text-anchor="middle" fill="#fbbf24" font-size="10">考官会计全省，只剩损失函数</text>
    </g>

    <g transform="translate(20 158)">
      <rect x="0" y="0" width="200" height="46" rx="5" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="19" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">GRPO：把会计裁了</text>
      <text x="100" y="36" text-anchor="middle" fill="#a7f3d0" font-size="10">组内相对分数当基线</text>
    </g>

    <g transform="translate(20 216)">
      <rect x="0" y="0" width="200" height="46" rx="5" fill="#1a0a2a" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="100" y="19" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">RLVR：给考官换人</text>
      <text x="100" y="36" text-anchor="middle" fill="#a78bfa" font-size="10">规则不拿工资，也不吃马屁</text>
    </g>

    <text x="120" y="284" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">零件齐了，该组装流水线了</text>
  </g>

  <!-- ============ RIGHT: 2026 一座工厂 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">2026 · 一座工厂</text>

    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#2dd4bf" stroke-width="1.5"/>

    <g transform="translate(15 32)">
      <rect x="0" y="0" width="200" height="70" rx="5" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">三域 × 三档 = 9 个专家</text>
      <text x="100" y="39" text-anchor="middle" fill="#a7f3d0" font-size="10">分头训到极致</text>
      <text x="100" y="58" text-anchor="middle" fill="#a7f3d0" font-size="10">再用在线蒸馏合回一个</text>
    </g>

    <g transform="translate(15 114)">
      <rect x="0" y="0" width="200" height="52" rx="5" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">51,219,741 个沙箱</text>
      <text x="100" y="39" text-anchor="middle" fill="#fbbf24" font-size="10">题是 agent 出的，卷是验证器判的</text>
    </g>

    <g transform="translate(15 178)">
      <rect x="0" y="0" width="200" height="52" rx="5" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">三笔账单</text>
      <text x="100" y="39" text-anchor="middle" fill="#f87171" font-size="10">芯片的钱 · 人的钱 · 考场的钱</text>
    </g>

    <text x="115" y="252" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">买的不再是设置，是性格</text>
    <text x="115" y="276" text-anchor="middle" fill="#cbd5e1" font-size="11">小马出生半小时就能跑</text>
    <text x="115" y="293" text-anchor="middle" fill="#cbd5e1" font-size="11">人，要养二十年</text>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="bold">从三行配方到一座工厂</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">后训练的四年：从出厂即用，到养上一整轮</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.265 · 900 次点击 → 1.3 万条示范 → 5100 万个沙箱</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="18%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="82%" cy="75%" r="42%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif; }
  </style>

  <rect width="900" height="500" fill="url(#bg)"/>
  <rect width="900" height="500" fill="url(#orangeGlow)"/>
  <rect width="900" height="500" fill="url(#greenGlow)"/>

  <g opacity="0.10">
    <path d="M0 88 H900 M0 166 H900 M0 244 H900 M0 322 H900" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M90 0 V500 M180 0 V500 M270 0 V500 M360 0 V500 M450 0 V500 M540 0 V500 M630 0 V500 M720 0 V500 M810 0 V500" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="450" y="42" text-anchor="middle" fill="#cbd5e1" font-size="15" letter-spacing="4">DLSS 5 逆向 · 第 4 站 · 在 AMD 显卡上跑通</text>

  <!-- ============ LEFT: 三台机器 + 标准答案 ============ -->
  <g transform="translate(60 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">不能翻译，只能重造</text>
    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 28)">
      <rect x="0" y="0" width="200" height="46" rx="6" fill="#0a1a2a" stroke="#4a90d9" stroke-width="1.5"/>
      <text x="100" y="19" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">DGX Spark · 标准答案机</text>
      <text x="100" y="37" text-anchor="middle" fill="#bfdbfe" font-size="10">直接加载泄露的 CUDA 核心</text>
    </g>
    <g transform="translate(15 82)">
      <rect x="0" y="0" width="200" height="46" rx="6" fill="#2a1a0a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="100" y="19" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">RTX 5090 · 原版环境</text>
      <text x="100" y="37" text-anchor="middle" fill="#fbbf24" font-size="10">探针进游戏，抓私有显存</text>
    </g>
    <g transform="translate(15 136)">
      <rect x="0" y="0" width="200" height="46" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="2"/>
      <text x="100" y="19" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">RX 9070 XT · 移植靶机</text>
      <text x="100" y="37" text-anchor="middle" fill="#a7f3d0" font-size="10">D3D12 + HLSL + DirectML</text>
    </g>

    <line x1="16" y1="200" x2="214" y2="200" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <g transform="translate(16 218)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">显存里的排列不是 [高,宽,通道]</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">公式全对，按行列乘也是错的</text>
      <text x="0" y="38" fill="#cbd5e1" font-size="10">喂单位向量，一个槽位一个槽位扫</text>
      <text x="0" y="56" fill="#94a3b8" font-size="10">71 块，每块两道门：CPU 对原版、GPU 对 CPU</text>
    </g>
  </g>

  <!-- ============ MIDDLE: 两次撤回 ============ -->
  <g transform="translate(320 80)">
    <text x="120" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">两次「完成」被自己撤回</text>
    <rect x="0" y="10" width="240" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <!-- 两帧不同画面 → 同一哈希 -->
    <g transform="translate(20 34)">
      <rect x="0" y="0" width="70" height="44" rx="4" fill="#1a2a3a" stroke="#4a90d9" stroke-width="1"/>
      <text x="35" y="27" text-anchor="middle" fill="#93c5fd" font-size="11">洞穴</text>
      <rect x="0" y="56" width="70" height="44" rx="4" fill="#2a2a1a" stroke="#f59e0b" stroke-width="1"/>
      <text x="35" y="83" text-anchor="middle" fill="#fde68a" font-size="11">主菜单</text>

      <path d="M72 22 L120 45" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
      <path d="M72 78 L120 55" stroke="#94a3b8" stroke-width="1.2" fill="none"/>

      <rect x="122" y="30" width="78" height="40" rx="4" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="161" y="47" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="bold">网络输出</text>
      <text x="161" y="62" text-anchor="middle" fill="#f87171" font-size="10">SHA 完全相同</text>
    </g>

    <g transform="translate(20 146)">
      <text x="0" y="0" fill="#f87171" font-size="10">画面在变，变的是原图那一路</text>
      <text x="0" y="16" fill="#f87171" font-size="10">网络那一路是死的</text>
    </g>

    <line x1="20" y1="180" x2="220" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(20 198)">
      <text x="0" y="0" fill="#fde047" font-size="11" font-weight="bold">拐杖造了全套，又全扔了</text>
      <text x="0" y="20" fill="#cbd5e1" font-size="10">为固定帧验收拟的校正矩阵</text>
      <text x="0" y="38" fill="#cbd5e1" font-size="10">到第 13 层把所有输入吸成一个点</text>
      <text x="0" y="56" fill="#94a3b8" font-size="10">留出的是像素，没留出的是「帧」</text>
      <text x="0" y="76" fill="#5eead4" font-size="10" font-weight="bold">验收线定义决定返工量</text>
    </g>
  </g>

  <!-- ============ RIGHT: 484 秒 → 30 秒 ============ -->
  <g transform="translate(620 80)">
    <text x="115" y="-2" text-anchor="middle" fill="#94a3b8" font-size="13">砍掉的不是计算</text>
    <rect x="0" y="10" width="230" height="290" rx="6" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15 30)">
      <text x="0" y="0" fill="#fca5a5" font-size="11">一帧</text>
      <text x="100" y="0" text-anchor="middle" fill="#f87171" font-size="30" font-weight="bold">484 秒</text>
      <text x="100" y="22" text-anchor="middle" fill="#94a3b8" font-size="10">92 个中间文件 10 GB，SSH 当显存总线</text>
      <text x="100" y="46" text-anchor="middle" fill="#cbd5e1" font-size="14">↓ 一天之内</text>
      <text x="100" y="80" text-anchor="middle" fill="#5eead4" font-size="30" font-weight="bold">30 秒</text>
      <text x="100" y="100" text-anchor="middle" fill="#94a3b8" font-size="10">中间张量全留显存，网络本身 11 秒</text>
    </g>

    <line x1="16" y1="150" x2="214" y2="150" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>

    <g transform="translate(15 166)">
      <rect x="0" y="0" width="200" height="56" rx="6" fill="#0a1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="100" y="20" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="bold">FP32 不动，只换编译器</text>
      <text x="100" y="38" text-anchor="middle" fill="#a7f3d0" font-size="10">FXC → DXC，一层快 14 倍</text>
      <text x="100" y="51" text-anchor="middle" fill="#a7f3d0" font-size="9">输出逐字节不变，FP16 一分没出</text>
    </g>

    <g transform="translate(15 234)">
      <text x="100" y="0" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">乐观下限 3 帧每秒</text>
      <text x="100" y="18" text-anchor="middle" fill="#94a3b8" font-size="10">离实时还差三个数量级</text>
      <text x="100" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">目标改成 1080p 先到 10 帧</text>
    </g>
  </g>

  <!-- ============ bottom title band ============ -->
  <rect x="0" y="390" width="900" height="110" fill="#020617" opacity="0.88"/>
  <rect x="0" y="390" width="900" height="6" fill="url(#titleBand)"/>
  <text x="450" y="428" text-anchor="middle" fill="#f8fafc" font-size="29" font-weight="bold">在 AMD RX 9070 XT 上跑通 DLSS 5 的神经网络</text>
  <text x="450" y="460" text-anchor="middle" fill="#fde047" font-size="17">71 块全通、游戏内热切换成功，但一帧 30 秒：能跑，没快</text>
  <text x="450" y="486" text-anchor="middle" fill="#94a3b8" font-size="13">No.299 · DLSS 5 逆向 · 三台机器、两次撤回、一天砍掉 454 秒</text>
</svg>

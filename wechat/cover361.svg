<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 383" width="900" height="383" style="font-family:'WenQuanYi Micro Hei','Noto Sans CJK SC',sans-serif;">
  <defs>
    <radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Explicit Solid Background -->
  <rect x="0" y="0" width="900" height="383" fill="#070b14"/>

  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="0.6" opacity="0.6">
    <line x1="0" y1="64" x2="900" y2="64"/>
    <line x1="0" y1="128" x2="900" y2="128"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="256" x2="900" y2="256"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>

  <!-- Center Divider -->
  <line x1="450" y1="24" x2="450" y2="359" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Left Visual: 1.5B Sharp Turning Trajectory & Skidding Vectors -->
  <circle cx="225" cy="190" r="160" fill="url(#glowLeft)"/>
  <text x="225" y="46" fill="#fca5a5" font-size="17.5" font-weight="bold" text-anchor="middle">1.5B / 2.8B 复现（R² ≈ 1%）与 0.6B 结巴</text>

  <!-- Jagged trajectory vectors -->
  <line x1="65" y1="260" x2="145" y2="245" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrCyan)"/>
  <line x1="152" y1="243" x2="215" y2="145" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrRed)"/>
  <line x1="220" y1="140" x2="310" y2="225" stroke="#ef4444" stroke-width="4" marker-end="url(#arrRed)"/>
  <line x1="316" y1="228" x2="385" y2="120" stroke="#ef4444" stroke-width="4" marker-end="url(#arrRed)"/>

  <!-- Angle arcs -->
  <path d="M 178 238 A 28 28 0 0 0 168 214" fill="none" stroke="#fde047" stroke-width="2.5"/>
  <path d="M 200 170 A 26 26 0 0 0 242 162" fill="none" stroke="#fde047" stroke-width="2.5"/>
  <text x="220" y="116" fill="#fde047" font-size="14.5" font-weight="bold" text-anchor="middle">cos(c_i) = (v_i · v_i+1) / (||v_i|| ||v_i+1||)</text>

  <circle cx="65" cy="260" r="6" fill="#94a3b8"/>
  <circle cx="150" cy="244" r="7" fill="#38bdf8"/>
  <circle cx="218" cy="142" r="8" fill="#f59e0b"/>
  <circle cx="313" cy="227" r="8" fill="#ef4444"/>
  <circle cx="388" cy="116" r="7" fill="#ef4444"/>

  <rect x="55" y="302" width="340" height="44" rx="8" fill="#1f1218" stroke="#be123c" stroke-width="1.2"/>
  <text x="225" y="329" fill="#fda4af" font-size="14.5" font-weight="bold" text-anchor="middle">0.6B 读完否定前提仍吐出：「答案是：30岁」</text>

  <!-- Right Visual: 27B / 35B Funnel & Straightened Trajectory -->
  <circle cx="675" cy="190" r="165" fill="url(#glowRight)"/>
  <text x="675" y="46" fill="#6ee7b7" font-size="17.5" font-weight="bold" text-anchor="middle">27B / 35B：首词熵漏斗与答案区曲率拉直</text>

  <!-- Funnel & Straightened Trajectory Graphic -->
  <polygon points="525,115 625,152 625,188 525,225" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="572" y="175" fill="#7dd3fc" font-size="13" font-weight="bold" text-anchor="middle">4.26 → 0.72</text>
  <text x="572" y="102" fill="#cbd5e1" font-size="12.5" text-anchor="middle">assistant 首词漏斗</text>

  <!-- Straightened arrow emerging from funnel -->
  <line x1="628" y1="170" x2="825" y2="170" stroke="#10b981" stroke-width="4.5" marker-end="url(#arrGreen)"/>
  <circle cx="675" cy="170" r="6" fill="#10b981"/>
  <circle cx="735" cy="170" r="6" fill="#10b981"/>
  <circle cx="795" cy="170" r="6" fill="#10b981"/>
  <text x="730" y="148" fill="#a7f3d0" font-size="13.5" font-weight="bold" text-anchor="middle">答案区轨迹拉直</text>
  <text x="675" y="256" fill="#a7f3d0" font-size="13.5" font-weight="bold" text-anchor="middle">（给定括号说明前缀）→ 答案区曲率 5/5 全降 (-0.045 rad)</text>

  <rect x="505" y="302" width="340" height="44" rx="8" fill="#092222" stroke="#10b981" stroke-width="1.2"/>
  <text x="675" y="329" fill="#6ee7b7" font-size="14.5" font-weight="bold" text-anchor="middle">DGX Spark 复现：120° 几何本底与同题配对</text>
</svg>
